# The line as shipped. A project changes it in the `routing:` section of
# .workline/config.yaml: each event it lists replaces this one, and a
# `handoffs` list it gives replaces this list (an empty list forbids them all).
events:
  commit-msg:    [committer]
  merge-request: [committer, documentalist]
  schedule:      [documentalist]
  release:       []   # before the project's release tool tags: its gates; never the docs (ADR-0051)
  # After a merge, on the default branch's new tip (ADR-0050): the gates of
  # merge-request run first, whatever this lists, every finding kept as the
  # next base; then these steps, no agent asked: the whole repository's
  # checks, once.
  main:          [documentalist]
# The first step that does not pass stops the line, but on schedule: its
# roles are upkeep, each on its own (docs, backlog), so every one runs and
# the line takes the worst verdict (ADR-0037). On main, every step runs too:
# a gate red after a merge leaves the whole repository's checks to run.
fail-fast:
  schedule: false
  main: false
handoffs: []
max-handoffs: 3
# The line of states (ADR-0059): an issue's state is its label, one at a
# time. On `issue` — an event naming the issue — and at `reconcile`, its
# state wakes its role, when the project routes that role on `issue`; the
# role's result moves the issue to `next`. Listed in the order that
# settles an issue bearing two. A project's list replaces this one.
states:
  - {name: blocked, label: "workline:blocked"}                                 # its reason on the issue; nobody woken
  - {name: doing,   label: "workline:developing"}                              # the developer's claim (ADR-0054)
  - {name: ready,   label: "workline:ready",       role: developer, next: doing}
  - {name: tests,   label: "workline:needs-tests", role: tester,    next: ready}
  - {name: refine,  label: "workline:to-refine",   role: product-owner, next: tests}
# The state steps run on one issue, at most: past it, Blocked, the count
# said on it. A state step is not a handoff: it is a new run.
max-hops: 8
# The steps one run of the reconciler (`workline route reconcile`, hourly)
# starts at most: it catches what an event missed, never a flood of agent
# calls; the issues left wait for its next run.
reconcile-max: 3
# Each moment's wait budget, in seconds (ADR-0050): a run over it says so
# in its summary, naming the step that took the time; it never blocks. A
# project sets its own in `routing: budgets:`, moment by moment.
budgets:
  commit: 1            # the commit-msg hook
  commit-rewrite: 30   # the same, when the agent rewrites a refused message
  push: 5              # the pre-push hook, no agent
  first-result: 60     # a merge request's push: the gates alone
  verdict: 180         # the head's verdict: the line, the gates' job's seconds with it
  ready-review: 600    # the run apart, the lenses that warn, posted when done
  queue: 60            # a merge queue's or train's run: what workline adds to its turn
