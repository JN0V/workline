contract: 1
name: developer
mission: A ready issue becomes a pull request that proves its Verification, written within its Scope, without a person opening a session.

# issue: `workline develop [--issue <n>]` (ADR-0054): picks the first
#        ready issue free to take (docs/pick.md); with an agent, claims
#        it, writes its code within its bounds (docs/bounds.md), proves
#        it: ready when green, no cap reached, else a Draft
#        (docs/proof.md). With none, the issue is named, nothing claimed.
events: [issue]

requires: [git]

# Writing the code an issue asks for is judgement on code; the pick and
# the bounds are mechanical and ask no agent.
model:
  capability: coding
  tier: standard
  effort: medium
  timeout: 30m

context:
  budget: 60000

duties:
  reads: ["**"]
  writes: ["**"]   # held, file by file, to the issue's bounds by post (docs/bounds.md)

# label and comment are the engine's, never the agent's: the claim and
# its record on the issue. The agent's: patches, and a comment that is an
# objection to a frozen test; post refuses any other (docs/bounds.md).
intentions: [patch, comment, label]

without-ai: pass   # with none, the issue is named, nothing claimed

settings:
  # The label that says the developer took an issue. GitHub does not
  # assign an issue to an App, so the claim is a label on every forge;
  # a person's assignment keeps an issue from it (docs/pick.md).
  claim-label: "workline:developing"
  # The caps (docs/proof.md): the tokens the run's agent calls may
  # spend, the seconds it waits on its agent, the seconds the tests run
  # on its code. The two times together: the ADR's 30 min a run.
  ai-max-tokens: 300000
  ai-max-seconds: 1200
  proof-seconds: 600
