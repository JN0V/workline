contract: 1
name: developer
mission: A ready issue becomes a pull request that proves its Verification, written within its Scope, without a person opening a session.

# issue: `workline develop [--issue <n>]` (ADR-0054): picks the first
#        ready issue free to take (docs/pick.md); with an agent, claims
#        it, writes its code within its bounds (docs/bounds.md), proves
#        it: ready when green, no cap reached, else a Draft
#        (docs/proof.md). With none, the issue is named, nothing claimed.
#        Routed on `issue` (`workline route issue --target issue:<n>`)
#        when CI sees an issue labelled ready: that issue alone.
# schedule: the same, the first ready issue nobody took, one a run
#        (step 5). Both need --open-merge-request (docs/triggers.md).
# review: `workline develop --merge-request <n>` — a review round on its
#        own pull request (step 6, docs/review-loop.md): a fresh run reads
#        the record, the reviewer's findings that block or are Important
#        and a person's comments, fixes them within the bounds, proves
#        the fix and pushes it on its branch; the five whys at round
#        three on a finding still there; past the last round, a person.
# merge-request: `workline develop --bounds --merge-request <n>` — its
#        bounds on its own pull request, no agent (ADR-0058, step 1): each
#        file the branch changed since its base, held to the issue's
#        bounds read at the base's tip; one refused blocks, named with its
#        rule. A person's branch passes, said. Routed where the project
#        lists it (docs/bounds.md#on-the-pull-request).
events: [issue, schedule, review, merge-request]

requires: [git]

# Writing the code an issue asks for is judgement on code; the pick and
# the bounds are mechanical and ask no agent.
model:
  capability: coding
  tier: standard
  effort: medium
  timeout: 60m   # one answer; ai-max-seconds holds the run's wait

context:
  budget: 60000
  # The shared skill a review round loads when a finding is still there
  # at round three (skills/five-whys, docs/review-loop.md).
  skills: [five-whys]

duties:
  reads: ["**"]
  writes: ["**"]   # held, file by file, to the issue's bounds by post (docs/bounds.md)

# label and comment are the engine's, never the agent's: the claim and
# its record on the issue. The agent's: patches, and a comment that is an
# objection to a frozen test; post refuses any other (docs/bounds.md).
# note: in a review round, what it did a finding, and the five whys.
intentions: [patch, comment, label, note]
# A bounds check that blocks still keeps its record on the pull request,
# for the auditor (ADR-0046); a round's answer refused keeps nothing.
on-block: [comment]

without-ai: pass   # with none, the issue is named, nothing claimed

settings:
  # The label that says the developer took an issue. GitHub does not
  # assign an issue to an App, so the claim is a label on every forge;
  # a person's assignment keeps an issue from it (docs/pick.md).
  claim-label: "workline:developing"
  # The hours a claim waits for its pull request: past them, with none
  # open that closes the issue, the next run lets it go, its label off,
  # why said on the issue (docs/pick.md#letting-a-claim-go).
  claim-hours: 24
  # The caps (docs/proof.md): the fresh tokens the run's agent calls
  # may spend (cache reads apart), the turns one call of its agent may
  # take, the seconds it waits on its agent, then kills it, the seconds
  # the tests run on its code. Sized for an issue-sized task; ADR-0056's
  # step 7 measured planted ones far below them (status.md#measured).
  ai-max-tokens: 500000
  ai-max-turns: 300
  ai-max-seconds: 3600
  proof-seconds: 900
  # The proof on the folders the change touches (docs/proof.md): the
  # tester's test-command, with `{packages}` replaced by the folders of
  # its code and of the acceptance tests that hold tests, as the
  # curator's proof command takes them. Unset, or no such folder: the
  # test-command runs whole, said. The pull request's own CI runs the
  # whole suite. E.g. `gotestsum --junitfile {report} -- {packages}`.
  # `{test}` in it: the test a flaky-n-of-n proof names, "" for another
  # issue, e.g. `gotestsum --junitfile {report} -- -run '{test}' {packages}`.
  proof-command: ""
  # The runs of a flaky-n-of-n proof when the tester's record names
  # none: the named test passes each, the proof green N runs of N
  # (docs/proof.md).
  flaky-runs: 10
  # The review rounds it runs on its pull request, one a reviewer's
  # verdict or a person's comment; past them, its issue goes
  # workline:blocked, the reason on it (ADR-0059; docs/review-loop.md).
  review-rounds: 5
