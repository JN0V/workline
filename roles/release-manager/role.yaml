contract: 1
name: release-manager
mission: Own the project's versions — decide the next one, and publish it with notes a user can read.

# release: someone decides to release now (manual run, or a schedule).
# merge: a merge on the default branch; with the merge-request flow, it keeps the
#        pending release merge request up to date, and releases once that is merged.
#        Not built yet, and not routed by default.
events: [release, merge]

# The next version and the changelog come from the conventional commits the
# committer guarantees, computed by the engine itself: a core role needs nothing
# but git and the engine (ADR-0001).
requires: [git]

# Release notes are real writing for users, but short. Retry one tier up on failure.
model:
  capability: writing
  tier: standard
  effort: medium
  promote-after: 1

context:
  knowledge: []
  budget: 12000

duties:
  reads: ["**"]
  writes: [$settings.changelog, $settings.version-files]

intentions: [patch, release, handoff, note]

# Without AI, the release still happens with the changelog the engine generated.
# The AI only adds a readable summary on top of it.
without-ai: pass

settings:
  flow: direct                # direct: tag and publish now | merge-request: not built yet
  tag-prefix: v
  # The release manager owns the versioning scheme; the committer only supplies
  # the signal (commit types). semver: MAJOR.MINOR.PATCH from the commits.
  # calver: from the date, e.g. YYYY.MM.MICRO. Build metadata is optional in both.
  versioning:
    scheme: semver            # semver | calver
    calver-format: YYYY.MM.MICRO
    build: none               # none | ci-number | commit — appended as +<build>; not read yet
  changelog: CHANGELOG.md
  version-files: []           # e.g. [package.json, Cargo.toml]; empty = tag only
# After a release, the agent may hand over to the documentalist, so user docs
# match what shipped; routing allows that handoff (routing.default.yaml).
