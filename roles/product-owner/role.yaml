contract: 1
name: product-owner
mission: The backlog stays true to the code and in order, between the need a person states and the result they accept.

# schedule: gardening — the open issues read against the code (ADR-0018).
# import: `workline issues import <file>` — a roadmap or backlog file read a
#         share at a time, its items still to do opened as issues.
events: [schedule, import]

requires: [git]

# Telling a duplicate from a look-alike, and code that solved an issue from
# code that only moved, is judgement on evidence.
model:
  capability: reasoning
  tier: standard
  effort: medium
  promote-after: 1   # an answer that does not read is asked for again once

context:
  budget: 40000      # eight issues, their code (code-lines-max), and refining's instruction

duties:
  reads: ["**"]
  writes: []        # never the code nor the docs: the forge's issues only

# comment: the engine's state comment on each issue it takes (pre).
intentions: [open, close, sources, milestone, refine, ready, ask, comment, note]

# Without AI, nothing is judged: the issues taken get their state comment.
without-ai: pass

settings:
  # A run reads the issues never read first, then those whose code changed
  # since; one whose code did not change is not read again.
  issues-per-run: 8
  code-lines-max: 1500     # lines of code given in one run, all files together
  # Each kind of act: act (done, up to max a run), propose (in the report,
  # for a person), off (dropped). Closing as obsolete starts at propose
  # until the evaluation has measured how often it is wrong (ADR-0018).
  acts:
    open: {mode: act, max: 30}        # an item of a file opened as an issue, when importing
    sources: {mode: act, max: 10}     # the code an issue is about, named
    milestone: {mode: act, max: 10}   # an issue put in a release's milestone
    close-duplicate: {mode: act, max: 3}
    close-obsolete: {mode: propose, max: 3}
    refine: {mode: act, max: 5}       # the sections an issue lacks, Need and Validation as drafts
    ready: {mode: act, max: 5}        # checked by the engine; an outsider's issue is proposed
    ask: {mode: act, max: 3}          # the reporter asked what is missing, once an issue
