contract: 1
name: product-owner
mission: The backlog stays true to the code and in order, between the need a person states and the result they accept.

# schedule: gardening — the open issues read against the code (ADR-0018).
# import: `workline issues import <file>` — a roadmap or backlog file read a
#         share at a time, its items still to do opened as issues.
events: [schedule, import]

requires: [git]

# Telling a duplicate from a look-alike, and code that solved an issue from
# code that only moved, is judgement on evidence.
model:
  capability: reasoning
  tier: standard
  effort: medium
  promote-after: 1   # an answer that does not read is asked for again once

context:
  # Estimated tokens, 711 + 0.82 a character (#235): eight issues, their
  # code (code-lines-max) and refining's instruction; real calls up to 97.6k
  # tokens in (DomoticsCore, a task of 126k characters).
  budget: 120000

duties:
  reads: ["**"]
  writes: []        # never the code nor the docs: the forge's issues only

# comment: the engine's state comment on each issue it takes (pre).
# skip: an item of a file an import does not open, and why, for its map.
intentions: [open, skip, close, keep, sources, milestone, order, refine, ready, unready, ask, split, rename, depend, comment, note]

# Without AI, nothing is judged: the issues taken get their state comment.
without-ai: pass

settings:
  # A run reads the issues never read first, then those whose code changed
  # since; one whose code did not change is not read again.
  issues-per-run: 8
  code-lines-max: 1500     # lines of code given in one run, all files together
  # How far the role goes (ADR-0026): cautious, normal or enterprising —
  # the acts below are normal; `levels`, at the end, what the others change.
  # A kind set here wins over the level, field by field.
  autonomy: normal
  # Runs in a row nobody answered before the role pauses (ADR-0025): 1 to
  # 20; 0 never pauses, said in every report.
  ignored-runs-max: 3
  # What the report opens with (ADR-0031): the first ready issues of the
  # order, at most next-max (0 to 20; 0 lists none); then each issue
  # waiting on a person for more than stuck-days (1 to 365) — ready with
  # nothing started, its reporter not answering, a proposal unticked —
  # and an announcement past its delay, each with since when.
  next-max: 5
  stuck-days: 14
  # Each kind of act: act (done, up to max a run), propose (in the report,
  # for a person), off (dropped). Closing as obsolete, in act, is announced
  # on the issue first and closed `days` later if nobody wrote, the label
  # workline:obsolete is still there and a second judge agrees (ADR-0024).
  # A run moves at most this share of the open issues, in percent —
  # milestones and priorities counted together; past it, proposed (ADR-0018).
  moved-percent-max: 20
  acts:
    open: {mode: act, max: 30}        # an item of a file opened as an issue, when importing
    sources: {mode: act, max: 10}     # the code an issue is about, named
    milestone: {mode: act, max: 10}   # an issue put in a release's milestone; one that slipped moved by the engine
    order: {mode: act, max: 10}       # an issue's priority, workline:priority/1 to /4; a person's kept
    close-duplicate: {mode: act, max: 3}
    close-obsolete: {mode: act, max: 3, days: 7, exempt: [pinned, security]}  # announcements and closings together
    refine: {mode: act, max: 5}       # the sections an issue lacks, Need and Validation as drafts
    ready: {mode: act, max: 5}        # checked by the engine; an outsider's issue is proposed
    ask: {mode: act, max: 3, rounds: 3}  # the reporter asked what is missing; again only after an answer, three times, then a person
    split: {mode: act, max: 2}        # a need too big for one issue split into 2 to 6, linked to it (ADR-0022)
    rename: {mode: act, max: 5}       # an issue's title; a person's kept
    depend: {mode: act, max: 5}       # what an issue waits on: the forge's relation, or a line in its body (ADR-0028)

# What each autonomy level lays over the settings above, before the
# project's own (docs/spec/backlog-acts.md, "Autonomy and caps"). normal is
# the settings as they are. cautious keeps the acts that check facts and
# proposes those that set direction; enterprising raises the caps.
levels:
  autonomy:
    cautious:
      moved-percent-max: 10
      acts:
        milestone: {mode: propose}
        order: {mode: propose}
        close-duplicate: {mode: propose}
        close-obsolete: {days: 14}
        refine: {drafts: propose}     # Scope and Verification written; Need and Validation drafts proposed
        ask: {max: 2, rounds: 2}
        split: {mode: propose}
        rename: {mode: propose}
        depend: {mode: propose}
    normal: {}
    enterprising:
      moved-percent-max: 30
      acts:
        order: {max: 15}
        close-duplicate: {max: 5}
        close-obsolete: {max: 5}
        refine: {max: 10}
        ready: {max: 10}
        ask: {max: 5}
        split: {max: 4}
        rename: {max: 10}
        depend: {max: 10}
