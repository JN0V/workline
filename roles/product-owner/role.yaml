contract: 1
name: product-owner
mission: The backlog stays true to the code and in order, between the need a person states and the result they accept.

# schedule: gardening — the open issues read against the code (ADR-0018).
# import: `workline issues import <file>` — a roadmap or backlog file read a
#         share at a time, its items still to do opened as issues.
events: [schedule, import]

requires: [git]

# Telling a duplicate from a look-alike, and code that solved an issue from
# code that only moved, is judgement on evidence.
model:
  capability: reasoning
  tier: standard
  effort: medium
  promote-after: 1   # an answer that does not read is asked for again once

context:
  # Estimated tokens, 711 + 0.82 a character (#235): eight issues, their
  # code (code-lines-max) and refining's instruction; real calls up to 97.6k
  # tokens in (DomoticsCore, a task of 126k characters).
  budget: 120000

duties:
  reads: ["**"]
  writes: []        # never the code nor the docs: the forge's issues only

# comment: the engine's state comment on each issue it takes (pre).
# skip: an item of a file an import does not open, and why, for its map.
intentions: [open, skip, close, keep, sources, milestone, order, refine, ready, unready, ask, split, rename, depend, undepend, comment, note]

# Without AI, nothing is judged: the issues taken get their state comment.
without-ai: pass

settings:
  # A run reads the issues a person answered on first, then a person's new
  # issues, then those changed since read; one whose code did not change is
  # not read again.
  issues-per-run: 8
  code-lines-max: 1500     # lines of code given in one run, all files together
  # How far the role goes (ADR-0038): cautious notes and proposes; normal
  # completes, and moves evident issues to ready alone; enterprising does
  # the same, more a run. `levels`, at the end, what each changes; a kind
  # set here wins over the level, field by field.
  autonomy: normal
  # A person undoing an act done alone has that kind proposed on that issue
  # from then on; undone this many times across the issues (1 to 20), the
  # kind is proposed on every issue (ADR-0038, amended).
  undone-max: 3
  # Issues waiting on a person's answer (the label workline:proposed) before
  # the role slows down: past it, only the issues answered are read (1 to
  # 100). Silence is never a yes.
  proposals-max: 10
  # The job's summary lists the first ready issues of the order, at most
  # next-max (0 to 20; 0 lists none), then each issue waiting on a person
  # for more than stuck-days (1 to 365) (ADR-0031).
  next-max: 5
  stuck-days: 14
  # Off by default, the code kept (ADR-0038): a changed Need or Scope flags
  # the issues built on it (ADR-0032); the weekly sample of the acts done
  # alone (ADR-0033). True turns each on.
  changed-needs: false
  weekly-sample: false
  # The files no longer a source, as paths or globs — a roadmap archived
  # once its items became issues: a change to their lines flags no issue
  # opened from them (ADR-0032).
  archived: []
  # With milestone or order on: a run moves at most this share of the open
  # issues, in percent; past it, proposed (ADR-0018).
  moved-percent-max: 20
  # Each kind of act: act (done, up to max a run), propose (on the issue,
  # for a person to accept), off (dropped). On by default: refine, ask,
  # ready, an evident duplicate, sources. Off, the code kept, each back by
  # a mode here: milestone, order, split, rename, depend, close-obsolete —
  # announced on the issue first, closed `days` later if nobody wrote and a
  # second judge agrees (ADR-0024).
  acts:
    open: {mode: act, max: 30}        # an item of a file opened as an issue, when importing
    sources: {mode: act, max: 10}     # the code an issue is about, named
    close-duplicate: {mode: act, max: 3}
    refine: {mode: act, max: 5}       # the sections an issue lacks, Need and Validation as drafts
    ready: {mode: act, max: 5}        # an evident issue: its four sections, Need and Validation a person's; an outsider's is proposed
    ask: {mode: act, max: 3, rounds: 3}  # the reporter asked what is missing; again only after an answer; three rounds, revisions included, then a person
    milestone: {mode: off, max: 10}   # an issue put in a release's milestone; one that slipped moved by the engine
    order: {mode: off, max: 10}       # an issue's priority, workline:priority/1 to /4; a person's kept
    close-obsolete: {mode: off, max: 3, days: 7, exempt: [pinned, security]}  # announcements and closings together
    split: {mode: off, max: 2}        # a need too big for one issue split into 2 to 6, linked to it (ADR-0022)
    rename: {mode: off, max: 5}       # an issue's title; a person's kept
    depend: {mode: off, max: 5}       # what an issue waits on: the forge's relation, or a line in its body (ADR-0028)

# What each autonomy level lays over the settings above, before the
# project's own (docs/spec/backlog-acts.md, "Autonomy and caps"). normal is
# the settings as they are. cautious notes and proposes: the code named,
# Scope and Verification written, the rest proposed; enterprising raises
# the caps.
levels:
  autonomy:
    cautious:
      acts:
        close-duplicate: {mode: propose}
        refine: {drafts: propose}     # Scope and Verification written; Need and Validation drafts proposed
        ready: {mode: propose}
        ask: {max: 2, rounds: 2}
    normal: {}
    enterprising:
      acts:
        close-duplicate: {max: 5}
        refine: {max: 10}
        ready: {max: 10}
        ask: {max: 5}
