contract: 1
name: tester
mission: Each test a change adds is proven red on its base before the code makes it green, from the project's own test runner's report.

# issue: `workline test write --issue <n>`, or the issue line on an issue
#        waiting for its tests (workline:needs-tests, ADR-0059) — its
#        Validation scenarios, a test each, proven red on the base and
#        linted, opened as a Draft; its Verification written from them
#        (ADR-0066); the issue then moves to ready (ADR-0055, step 2).
#        Given `symptom` by the line on a bug's parent, every part
#        closed: its Draft's tests over the default branch, the green
#        proof, no agent, said on the parent (#1212).
# schedule: its moment (step 4), where the project routes it: one issue
#        waiting for its tests a run, the first with named scenarios and
#        no open Draft, then as on issue; needs --open-merge-request.
# merge-request: the frozen guard, no agent (step 3): a test file the
#        tester wrote, changed or deleted by another, blocks
#        (tester-test-changed); routed where the project lists it. Then,
#        the pull request marked ready, the green proof (step 5): each
#        new test passes on the head three runs out of three (test-flaky).
# objection: `workline test answer --merge-request <n>` — the first
#        objection waiting on the tester's Draft, kept or rewritten
#        (step 3); in CI, woken by the comment (workline-objection.yml).
# curate: `workline test curate --history <file>` — the curator's
#        removals (step 7): one folder of tests a run, a few redundant
#        tests removed by the agent, never rewritten, proven with no agent
#        (coverage and killed mutants before and after), opened as a pull
#        request merged by the project's merge policy.
# The red-first check alone, `workline test check --base <ref>`, runs no
# role and no agent (step 1); the curator's measures,
# `workline test measure --history <file>`, neither (step 6).
events: [issue, schedule, merge-request, objection, curate]

requires: [git]

# Turning a person's scenario into a test that fails for the right reason,
# in the project's own framework, is judgement on code.
model:
  capability: coding
  tier: standard
  effort: medium
  timeout: 10m

context:
  # Estimated tokens, 711 + 0.82 a character: the issue's scenarios, the
  # Scope's code and the tests beside it (code-lines-max).
  budget: 60000
  # The shared skill an answer loads, after the task, when an objection's
  # thread is still open after the second answer (skills/five-whys).
  skills: [five-whys]

duties:
  reads: ["**"]
  writes: [$settings.test-paths]   # test files only, never the code

# patch: a test file, new or changed. covers: a scenario and the tests
# that check it, or why none can, said in the Draft; read by post, never
# applied (ADR-0065). note: an answer's reason, what a test assumes, the
# files or the proof it needs. comment, label and
# verification are the engine's, never the agent's: the record of the
# tests, the reply in an objection's thread, a need sent back to the
# product owner, the issue's Verification written from the tests, a
# person's kept (ADR-0066).
intentions: [patch, covers, note, comment, label, verification]

without-ai: pass   # with none, nothing is written: the issue waits for its tests

settings:
  # A run's caps (ADR-0055, guards): the tokens it may spend, every call
  # together, and how long it waits on its agent, in seconds.
  ai-max-tokens: 300000
  ai-max-seconds: 1200
  # The turns of an agent that reads the project itself, with read-only
  # tools (claude: Read, Glob, Grep, no shell, ADR-0063 §8), when it
  # writes an issue's tests; told in its task, and enforced by the
  # engine (claude --max-turns). Another agent reads its task alone,
  # and asks for the files it lacks (`needs:`).
  ai-max-turns: 40
  # Lines of code and tests given to the agent, all files together: the
  # Scope's files and those the product owner named for the issue, then
  # up to three test files beside them, a fifth kept for the first when
  # the code would fill it. A file too long gives the functions the
  # Scope names in it, the rest named.
  code-lines-max: 1500
  # Runs the project's tests and writes a JUnit XML report; {report} is
  # replaced by test-report's path. Unset: the check blocks,
  # setting-missing, never a pass. E.g. `python -m pytest --junitxml={report}`,
  # `gotestsum --junitfile {report} ./...`, `npx jest --reporters=jest-junit`.
  test-command: ""
  # Where the command writes the report, from the repository's root: a
  # path, or a pattern, `**` spanning folders, each file it names read:
  # a report per module (`**/build/test-results/**/*.xml`, Gradle;
  # `**/target/surefire-reports/*.xml`, Maven), removed before each run.
  # A file git tracks, one in a nested repository, or one through a folder
  # linked outside the root (`bazel-testlogs/*/*/test.xml`) is never removed,
  # and read only if the run rewrites it into a JUnit report (`pom.xml`
  # under `**/*.xml`); a pattern leaving the root (`../`, `/`) is refused.
  test-report: junit.xml
  # The Draft's red proof on the folders holding its tests alone
  # ({packages}), on the base and with the tests, writing test-report;
  # unset: test-command, the whole suite, on each. E.g.
  # `gotestsum --junitfile {report} -- {packages}`, `python -m pytest
  # --junitxml={report} {packages}`.
  draft-command: ""
  # The file marking a build module's folder, by its name alone (`*`
  # allowed, no `/`): set, {packages} is the modules a change touches,
  # the nearest folder above each file holding one; with a build file at
  # the root, a file outside any other module (`docs/x.md`) is the root
  # module's: the whole suite; with none there, it adds none; unset, the
  # folders holding tests. E.g. [build.gradle.kts, build.gradle], [pom.xml].
  # The project's command turns a folder into its task:
  # `./gradlew $(echo {packages} | sed -E 's#\./##g; s#/#:#g; s#([^ ]+)#:\1:test#g')`.
  module-files: []
  # The test files: those a change adds or changes are laid on the base
  # for the red proof; the change's other files are its code. The one
  # definition of a test file every role reads (ADR-0065): unset, the
  # test-paths of the language packs the project lists (packs: in
  # .workline/config.yaml, docs/packs.md) with the built-in generic
  # pack's, else the generic pack's alone (internal/packs/builtin/generic.yaml: test/, tests/, Tests/,
  # __tests__/ folders, test_*, *_test.*, *_spec.*, *.test.*, *.spec.*),
  # which `workline doctor` says. A test they miss is code to the developer: beyond its Scope, listed.
  # E.g. ["**/src/test/**", "**/src/androidTest/**"], ["spec/**"].
  test-paths: []
  # Where a test's code lives, for the developer: a new test file whose
  # code folder holds a Scope path is beside the Scope, not listed beyond it. Each maps a test's
  # folder (`tests`) onto its code's (`code`), each `**` filling the next;
  # a test in none lives beside its code. Unset, the listed packs', then
  # the generic ones: the folder holding a test/ or tests/ folder.
  # E.g. [{tests: "**/src/test/**", code: "**/src/main/**"}].
  test-homes: []
  # A build broken by a new test, read by ecosystem: an error line of
  # the test command's output (groups file and message), the messages
  # naming what the code lacks (the name in a group `name`, else the
  # first quoted word), and the tests a file declares. Each error a
  # missing name the base lacks and the issue names: red at once. Any
  # other build broken on the base goes to the judge with the raw facts;
  # its yes is red, its no build-broken, anything else red unproven
  # (docs/missing-name.md). On the head, a test of the change that does
  # not build, but for a missing name, is build-broken at once. An absolute path, or a file:// URI, under the
  # checkout is read from the root. A message on a later line, read by
  # message-line (pytest's `E` line). Go's, Kotlin's (Gradle's `e:`
  # lines, Kotlin 2 and 1), javac's, Gradle's build files and pytest's
  # collection errors here; data, until the language packs take them.
  build-errors:
    - error: '^(?:\./)?(?P<file>[^\s:]+\.go):\d+:\d+: (?P<message>.+)$'
      missing-name:
        - '^undefined: (?P<name>[\w.]+)$'
        - '^\S+ undefined \(type .+ has no field or method (?P<name>\w+)'
        - '^unknown field (?P<name>\w+) in struct literal'
      test-name: '(?m)^func (Test\w*)\(\w+ \*testing\.T\)'
    - error: '^e: (?P<file>.+?\.kts?)(?::\d+:\d+:?|: \(\d+, \d+\):) (?P<message>.+)$'
      missing-name:
        - '^Unresolved reference ''(?P<name>[^'']+)'''
        - '^Unresolved reference: (?P<name>\S+)'
        - '^No parameter with name ''(?P<name>[^'']+)'' found'
        - '^Cannot find a parameter with this name: (?P<name>\S+)'
      test-name: '(?m)@Test\b(?:\([^)]*\))?\s+(?:@\w+(?:\([^)]*\))?\s+)*(?:(?:public|internal)\s+)?fun\s+(?:`([^`]+)`|(\w+))\s*\('
    - error: '^(?P<file>\S.*?\.java):\d+: error: (?P<message>.+)$'
      missing-name:
        - '^cannot find symbol$'
      name-line: '^\s*symbol:\s+\w+\s+(?P<name>\w+)'
      test-name: '(?m)@Test\b(?:\([^)]*\))?\s+(?:@\w+(?:\([^)]*\))?\s+)*(?:(?:public|protected|private|static|final)\s+)*void\s+(\w+)\s*\('
    - error: '^(?:Build|Settings) file ''(?P<file>[^'']+)'' line: \d+(?P<message>)$'
    - error: '^_+ ERROR collecting (?P<file>\S+\.py) _+(?P<message>)$'
      message-line: '^E\s+(?P<message>[\w.]+: .+)$'
      missing-name:
        - '^ImportError: cannot import name ''(?P<name>[^'']+)'''
      test-name: '(?m)^\s*(?:async\s+)?def (test\w*)\s*\('
  # The judge of a broken build may read the base before it answers
  # (ADR-0045): its rounds of reads, and the lines served, all rounds
  # together. 0 rounds: it answers from the facts alone.
  judge-read-rounds: 2
  judge-read-lines-max: 400
  # An objection's thread (ADR-0055): the tester answers it this many
  # times; the builder still objecting after the last, the product owner
  # settles it, the issue sent back to it; objected to again after that,
  # the issue is blocked, its reason on it (ADR-0059). No person is asked:
  # one on the loop reads the board. Once the second answer did not settle
  # it, the third gives the five whys with it, the shared skill
  # (skills/five-whys/SKILL.md).
  objection-exchanges: 3
  # The curator's measures, no agent (`workline test measure`, ADR-0055
  # step 6): the command run, when not test-command (one that also writes
  # coverage-report, Go's profile or LCOV, e.g. `gotestsum --junitfile
  # {report} -- -coverprofile=cover.out ./...`); the runs a measure, two to
  # tell a flaky test on one commit; the slowest tests named; the window of
  # measures a test never red is counted over (twelve: a quarter, weekly);
  # the corpus's time over which it warns, in seconds (0: none), and where
  # a proof's run of the tests stops (#1425).
  curator-command: ""
  curator-runs: 2
  curator-slowest: 10
  curator-window: 12
  suite-max-seconds: 600
  coverage-report: ""
  # The curator's removals (`workline test curate`, ADR-0055 step 7): the
  # test files it may change (none: test-paths; leave out a test whose
  # coverage the report cannot see, one running a built binary); files
  # listing tests never removed, a name a line (a conformance suite's
  # pending list); the tests a run removes at most; the proof's command,
  # on the touched folders ({packages}), writing test-report and
  # coverage-report (none: curator-command, else test-command, the whole
  # suite); the mutation tool's, on each touched folder ({package}),
  # writing curator-mutation-report ({report}): Gremlins' JSON or the
  # mutation testing report schema; unset where the language has a tool,
  # the curator does not run; `none`, coverage alone, said. The proof's
  # time budget, in seconds: past it, stopped, nothing proposed.
  curator-paths: []
  curator-keep: []
  curator-removals-max: 5
  curator-proof-command: ""
  curator-mutation-command: ""
  curator-mutation-report: mutation.json
  curator-proof-seconds: 1800
