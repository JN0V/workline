contract: 1
name: documentalist
mission: The docs stay true to the code, short enough to be read, and the product docs follow the technical ones.

# merge-request: check what this change makes suspect, before it merges.
# pre-push: the same on the machine, before the commits leave it, with the
#           person's agent; its patches are reviewed before pushing again.
# schedule: gardening — freshness, duplicates, budgets, across the whole repo.
# handoff: from the release manager, when a release changes how the project is used.
# release: before the release manager: the docs due at the release are brought
#          up to date; until they are, the release waits.
# init: `workline init` adopting a repository: the docs saying nothing of the
#       code they describe get their `sources` proposed, for a person to review.
events: [merge-request, pre-push, schedule, handoff, release, init]

requires: [git]
# Budgets, duplicates and links inside the repository are checked by the engine
# itself (ADR-0003). Optional tools, run when installed; the verdict says when
# one is missing. lychee: links to other sites, when gardening (README, "Links").
# Coming: vale (style).
uses: [lychee]

# Rewriting docs for a reader is real writing; condensing well needs judgement.
model:
  capability: writing
  tier: standard
  effort: medium
  promote-after: 1
  timeout: 10m    # condensing a long doc is a long diff to write
  tasks:
    # Measured (tests/evaluation, 2026-09-25 and 28): Sonnet condensed 4 times
    # in 6, writing 13 to 19k tokens; Opus 10 in 10, writing 9 to 11k.
    condense: {tier: frontier}
    split: {tier: frontier}          # the same move, a card at a time; 3 in 3 on Opus

context:
  knowledge: [doc-model.md]
  budget: 16000

duties:
  reads: ["**"]
  writes: [$settings.docs]    # only documentation, never code

intentions: [patch, issue, comment, label, note]

# Without AI, every check still runs. What needed judgement (is this suspect doc
# still right?) is reported for a person, who clears it by updating `checked`.
# On a merge request, with a forge, they are listed in one comment, edited on each run.
without-ai: report

settings:
  docs: ["docs/**", "*.md"]
  # Which side is right when they disagree, per glob. A doc the code follows
  # is never rewritten to match it: an issue is opened instead. Every other
  # doc follows the code.
  truth:
    doc: ["docs/adr/**"]
  # Cascades are cut. Only edges marked `now` are handled in the change itself;
  # the others are pending, listed in one tracking issue, until the event they
  # name (`release`), which runs the documentalist first and waits for them.
  propagation:
    - {from: code, to: "docs/tech/**", when: now}
    - {from: "docs/tech/**", to: "docs/product/**", when: release}
  budgets:
    doc-lines: 200                   # above it: extract into cards, don't compress
    section-words: 400
    card-words: {min: 80, max: 400}  # too small is fragmentation, a smell too
    folder-lines: 2000
    root-agent-file-lines: 200       # AGENTS.md / CLAUDE.md: a routing file, not a dump
  freshness:                         # on schedule: a doc confirmed longer ago is stale
    stale-after-days: 180
  duplicates:
    min-words: 40                    # shorter repeats are not worth merging
    similarity: 0.85
  # Facts regenerated from the code, by name: a doc writes
  # `<!-- workline:derive name -->…<!-- workline:end -->`, the command lives here,
  # where only people change it. e.g. {conformance-cases: "ls tests/*.yaml | wc -l"}
  derive: {}
  # The code the project wants described, as globs, e.g. ["src/**"]: a file
  # of it the commits add, under no doc's sources, is reported (undocumented);
  # when gardening, every such file. Empty: nothing is reported.
  documented: []
  max-open-merge-requests: 5         # backpressure: with --open-merge-request, no gardening while this many wait
  ai-max-calls: 10                   # suspect docs per call; the rest wait for the next round
