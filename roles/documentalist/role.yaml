contract: 1
name: documentalist
mission: The docs stay true to the code, short enough to be read, and the product docs follow the technical ones.

# merge-request: check what this change makes suspect, before it merges;
#           no other doc read there, nor duplicates looked for (ADR-0050).
# pre-push: the same on the machine, before the commits leave it: counted at
#           the push, judged with `workline docs`, each change reviewed (ADR-0007).
# main:     after a merge, the whole repository's budgets, links, duplicates
#           and counts, once, no agent: kept in one issue (ADR-0050).
# schedule: gardening — freshness, duplicates, budgets, across the whole repo.
# handoff: from a project's own role, when routing allows it; no shipped role asks.
# init: `workline init` adopting a repository: the docs saying nothing of the
#       code they describe get their `sources` proposed, for a person to review.
events: [merge-request, pre-push, main, schedule, handoff, init]

requires: [git]
# Budgets, duplicates and links inside the repository are checked by the engine
# itself (ADR-0003). Optional tools, run when installed; the verdict says when
# one is missing. lychee: links to other sites, when gardening (docs/checks.md, "Links").
# Coming: vale (style).
uses: [lychee]

# Rewriting docs for a reader is real writing; splitting well needs judgement.
model:
  capability: writing
  tier: standard
  effort: medium
  promote-after: 1
  timeout: 10m    # splitting a long doc is a long diff to write
  tasks:
    # Measured (tests/evaluation, 2026-09-25 and 28): Sonnet moved a doc's
    # parts out 4 times in 6, writing 13 to 19k tokens; Opus 10 in 10, writing
    # 9 to 11k.
    split: {tier: frontier}

context:
  knowledge: [doc-model.md]
  # Estimated tokens, 711 + 0.82 a character (#235): a task of 40,000
  # characters (taskMaxChars) and the facets; real calls up to 41k tokens in.
  # What an agent that reads the repository reads there is its own, capped
  # by its turns (docs/adr/0074).
  budget: 48000

duties:
  reads: ["**"]
  writes: [$settings.docs]    # only documentation, never code

intentions: [patch, claim, issue, comment, label, note]
# A blocked run still applies its comments, which say why.
on-block: [comment]

# Without AI, every check still runs. What needed judgement (is this suspect doc
# still right?) is reported for a person, who clears it by updating `checked`.
# On a merge request, with a forge, they are listed in one comment, edited on each run.
without-ai: report
# On a merge request, the agent judges the docs once, on the run at ready
# (--input ready=true); a push after it lists them (ADR-0051).
merge-request-ai: ready

settings:
  docs: ["docs/**", "*.md"]
  # Which side is right when they disagree, per glob. A doc the code follows
  # is never rewritten to match it: an issue is opened instead. Every other
  # doc follows the code.
  truth:
    doc: ["docs/adr/**"]
  # Cascades are cut. Only edges marked `now` are handled in the change itself;
  # the others are pending, listed in one tracking issue, until the event they
  # name (`schedule`: gardening), which brings them up to date. The release
  # never waits for them (ADR-0051).
  propagation:
    - {from: code, to: "docs/tech/**", when: now}
    - {from: "docs/tech/**", to: "docs/product/**", when: schedule}
  budgets:
    doc-lines: 200                   # above it: split into linked pages, don't compress
    section-words: 400
    page-words: 80                   # the fewest a page a split creates holds: smaller is fragmentation
    folder-lines: 2000
    root-agent-file-lines: 200       # AGENTS.md / CLAUDE.md: a routing file, not a dump
  freshness:                         # on schedule: a doc confirmed longer ago is stale
    stale-after-days: 180
  # Whether the user pages serve their reader, beside whether they are true
  # (docs/checks.md, "Reader"): on schedule, no agent, reported only. User
  # pages are the docs matching `pages`, but `skip` and the records
  # (decisions, research, history: `history`, `decisions`).
  reader:
    pages: ["README.md", "docs/**"]
    skip: ["docs/spec/**", "docs/specs/**"]
    navigation: ["README.md"]        # where a reader starts; every user page is reached from one
    flow: []                          # pages explaining a flow, which need a diagram
    flow-headings: ["how it works"]   # a heading holding one, as words, any case, explains a flow too; in the docs' language
    paragraph-words: 80               # a paragraph, or a list item, over it is a wall of prose
    cell-words: 30                    # a table cell holds one short sentence and a link
    # What counts as a decision or issue named in prose, in the project's own
    # naming, as regular expressions (docs/checks-docs.md, "Docs for their
    # reader"). Empty: ADR-<n> and #<n>. Set, they replace both, e.g. on
    # GitLab ['ADR-\d+', '#\d+', '!\d+', '[\w.-]+/[\w.-]+#\d+'].
    references: []
    # With an agent, last in a gardening run, it reads the pages these checks
    # flagged — what a reader would miss or skip — and proposes a patch on a
    # merge request (#256): at most this many pages a run, within one task;
    # a page is not read again until it changes. 0: no page is read.
    agent-pages: 4
  duplicates:
    min-words: 40                    # shorter repeats are not worth merging
    similarity: 0.85
  # Facts regenerated from the code, by name: a doc writes
  # `<!-- workline:derive name -->…<!-- workline:end -->`, the command lives here,
  # where only people change it. e.g. {conformance-cases: "ls tests/*.yaml | wc -l"}
  derive: {}
  # A code example a fix writes, a fenced block added or changed, is said
  # unverified, for the person merging to read, unless a command checking
  # the project's examples is named here: it runs on a checkout of HEAD with
  # the fixed docs written in, the docs as its arguments ("$@"), in the job
  # the agent runs in. It fails: the example is withheld, its output shown;
  # it passes: the example is said checked by it. e.g. {check: "make doc-examples"}
  examples: {check: ""}
  # The code the project wants described, as globs, e.g. ["src/**"]: a file
  # of it the commits add, under no doc's sources, is reported (undocumented);
  # when gardening, every such file. Empty: nothing is reported.
  documented: []
  # Records, saying what was true when written: no count or version in them
  # is reported, none is split, and a decision record may cite what it
  # superseded. Known without a setting: a name holding `changelog` or
  # `release-notes`, or history, news, changes, tried; a folder named
  # releases, release-notes, changelog(s), news, research(-…), or one of
  # decisions' below. These globs add to them, e.g. ["docs/journal/**"].
  history: []
  # Decision records, beside the numbered files (`0007-…`, `adr001-…`) of a
  # folder named adr, adrs, adr-…, decisions, architecture-decisions,
  # decision-records or decision-log: these globs add to them, each record
  # numbered by the first number in its name, e.g. ["docs/design/*.md"].
  decisions: []
  # Versions, for `value-left` (docs/checks.md): how the project writes one, when
  # not in three parts (1.4.1, v1.4.1), as a regexp, e.g. '\d{2}\.\d+' for a
  # calendar version (26.2); and the files saying its version, e.g.
  # [pyproject.toml]: a doc still saying a version a fix replaces is reported
  # when one of them says the new one, whatever the doc's own sources.
  versions: {pattern: "", files: []}
  # The docs' language, whose glue and fact words the removal rule reads
  # (docs/judge.md): en or fr. Unset, each doc's own, told by its frequent words.
  language: ""
  max-open-merge-requests: 5         # backpressure: with --open-merge-request, no gardening while this many wait
  ai-max-calls: 10                   # suspect docs per call; the rest wait for the next round
  # Tokens one run may spend, all calls together (in, cache included, and
  # out); past it the agent is asked nothing more and the rest waits. 0: no
  # cap. A doc judged whole cost 13k to 26k on DomoticsCore; 400k holds 10
  # docs whole, and stops a run looping (docs/adr/0064, §5).
  ai-max-tokens: 400000
  # An agent that reads files itself (claude) reads each doc's sources in
  # the repository at HEAD, read-only, named in its task, never given
  # (docs/adr/0074): `checked` moves only for a doc whose every source file
  # its calls' log holds. Its turns, told in its task:
  ai-max-turns: 40
  # Any other agent is given each doc's sources in its task, whole, when
  # they fit these characters together (about four a token); else what
  # changed in them, and `checked` cannot move; a doc too far behind goes
  # to a person. The weekly sample reads within it too. On the six public
  # repositories probed, 0 to 33% of docs fit 20,000
  # (docs/research/documentalist-genericity.md).
  whole-chars: 20000
