contract: 1
name: documentalist
mission: The docs stay true to the code, short enough to be read, and the product docs follow the technical ones.

# merge-request: check what this change makes suspect, before it merges.
# pre-push: the same on the machine, before the commits leave it: listed at
#           the push, judged with `workline docs`, each change reviewed (ADR-0007).
# schedule: gardening — freshness, duplicates, budgets, across the whole repo.
# handoff: from a project's own role, when routing allows it; no shipped role asks.
# release: before the project's release tool tags (ADR-0017): the docs due at
#          the release are brought up to date; until they are, the release waits.
# init: `workline init` adopting a repository: the docs saying nothing of the
#       code they describe get their `sources` proposed, for a person to review.
events: [merge-request, pre-push, schedule, handoff, release, init]

requires: [git]
# Budgets, duplicates and links inside the repository are checked by the engine
# itself (ADR-0003). Optional tools, run when installed; the verdict says when
# one is missing. lychee: links to other sites, when gardening (docs/checks.md, "Links").
# Coming: vale (style).
uses: [lychee]

# Rewriting docs for a reader is real writing; condensing well needs judgement.
model:
  capability: writing
  tier: standard
  effort: medium
  promote-after: 1
  timeout: 10m    # condensing a long doc is a long diff to write
  tasks:
    # Measured (tests/evaluation, 2026-09-25 and 28): Sonnet condensed 4 times
    # in 6, writing 13 to 19k tokens; Opus 10 in 10, writing 9 to 11k.
    condense: {tier: frontier}
    split: {tier: frontier}          # the same move, a card at a time; 3 in 3 on Opus
    # A part of a doc judged in parts (judge-in-parts, below): light, once the
    # evaluation says it checks as well as standard (ADR-0009); until then, standard.
    part: {tier: standard}

context:
  knowledge: [doc-model.md]
  # Estimated tokens, 711 + 0.82 a character (#235): a task of 40,000
  # characters (taskMaxChars) and the facets; real calls up to 41k tokens in.
  budget: 48000

duties:
  reads: ["**"]
  writes: [$settings.docs]    # only documentation, never code

intentions: [patch, claim, issue, comment, label, note]

# Without AI, every check still runs. What needed judgement (is this suspect doc
# still right?) is reported for a person, who clears it by updating `checked`.
# On a merge request, with a forge, they are listed in one comment, edited on each run.
without-ai: report

settings:
  docs: ["docs/**", "*.md"]
  # Which side is right when they disagree, per glob. A doc the code follows
  # is never rewritten to match it: an issue is opened instead. Every other
  # doc follows the code.
  truth:
    doc: ["docs/adr/**"]
  # Cascades are cut. Only edges marked `now` are handled in the change itself;
  # the others are pending, listed in one tracking issue, until the event they
  # name (`release`), which runs the documentalist first and waits for them.
  propagation:
    - {from: code, to: "docs/tech/**", when: now}
    - {from: "docs/tech/**", to: "docs/product/**", when: release}
  budgets:
    doc-lines: 200                   # above it: extract into cards, don't compress
    section-words: 400
    card-words: {min: 80, max: 400}  # too small is fragmentation, a smell too
    folder-lines: 2000
    root-agent-file-lines: 200       # AGENTS.md / CLAUDE.md: a routing file, not a dump
  freshness:                         # on schedule: a doc confirmed longer ago is stale
    stale-after-days: 180
  duplicates:
    min-words: 40                    # shorter repeats are not worth merging
    similarity: 0.85
  # Facts regenerated from the code, by name: a doc writes
  # `<!-- workline:derive name -->…<!-- workline:end -->`, the command lives here,
  # where only people change it. e.g. {conformance-cases: "ls tests/*.yaml | wc -l"}
  derive: {}
  # The code the project wants described, as globs, e.g. ["src/**"]: a file
  # of it the commits add, under no doc's sources, is reported (undocumented);
  # when gardening, every such file. Empty: nothing is reported.
  documented: []
  # Records, saying what was true when written: no count or version in them
  # is reported, none is condensed, and a decision record may cite what it
  # superseded. Known without a setting: a name holding `changelog` or
  # `release-notes`, or history, news, changes, tried; a folder named
  # releases, release-notes, changelog(s), news, research(-…), or one of
  # decisions' below. These globs add to them, e.g. ["docs/journal/**"].
  history: []
  # Decision records, beside the numbered files (`0007-…`, `adr001-…`) of a
  # folder named adr, adrs, adr-…, decisions, architecture-decisions,
  # decision-records or decision-log: these globs add to them, each record
  # numbered by the first number in its name, e.g. ["docs/design/*.md"].
  decisions: []
  # Versions, for `value-left` (docs/checks.md): how the project writes one, when
  # not in three parts (1.4.1, v1.4.1), as a regexp, e.g. '\d{2}\.\d+' for a
  # calendar version (26.2); and the files saying its version, e.g.
  # [pyproject.toml]: a doc still saying a version a fix replaces is reported
  # when one of them says the new one, whatever the doc's own sources.
  versions: {pattern: "", files: []}
  # The docs' language, whose glue and fact words the removal rule reads
  # (docs/judge.md): en or fr. Unset, each doc's own, told by its frequent words.
  language: ""
  max-open-merge-requests: 5         # backpressure: with --open-merge-request, no gardening while this many wait
  ai-max-calls: 10                   # suspect docs per call; the rest wait for the next round
  # Tokens one run may spend, all calls together (in, cache included, and
  # out); past it the agent is asked nothing more and the rest waits. 0: no
  # cap. A doc judged whole cost 13k to 26k on DomoticsCore; 16 parts, more.
  ai-max-tokens: 0
  # The characters a doc's sources may take, together, to be judged whole
  # (about four a token; characters, as the engine measures a task before the
  # call). Higher, more docs can be vouched for, and each costs more tokens,
  # every night when gardening: on the six public repositories probed, 0 to
  # 33% of docs fit 20,000 (docs/research/documentalist-genericity.md). The
  # task grows by as much as the cap does.
  whole-chars: 20000
  # A suspect doc whose sources, as they are now, do not fit a task goes to a
  # person. Turned on, it is judged in parts instead (ADR-0009): the doc whole
  # with a share of its source files in each part, then one call fixing what
  # the parts found wrong; `checked` does not move, and the doc stays suspect.
  # Off until the evaluation has measured it.
  judge-in-parts: false
  parts-max: 8                       # parts a doc may take; past it, its sources are too wide
  parts-max-per-run: 16              # parts asked in one run; the other docs wait for the next round
