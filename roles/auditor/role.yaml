contract: 1
name: auditor
mission: Re-check an act another role did alone against what it was done on, and say whether it holds, with the material's words proving it does not.

# Not a role of the line: no event runs it. `workline sample` asks it, every
# week, of one in ten of each role's acts per kind (ADR-0046) — the docs the
# documentalist vouched for (ADR-0014, step 4), the product owner's acts, the
# findings the reviewer's judge kept or dropped, the committer's rewrites,
# the tester's tests, its answers to objections and its curator's removals —
# one call an act, its kind's question in kinds/<kind>.md, at the best
# independence available from the models that acted (ADR-0005). The engine
# checks every quote it gives; it applies nothing.
model:
  capability: reasoning
  tier: frontier
  effort: medium
  timeout: 5m

intentions: [claim, note]
