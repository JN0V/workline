contract: 1
name: reviewer
mission: A change is reviewed before it merges — what it breaks found, quoted and verified — and the person merges.

# review: `workline review` on a machine, at the end of development, on
#         base..HEAD: every lens, for the author's agent to fix before pushing.
# merge-request: on the forge, the commits not reviewed yet, one lens a push;
#         every lens once, on the whole change, when it becomes ready
#         (--input lenses=all, or --input draft=false and a record not
#         saying every lens read it, #359): a safety net; opt-in in the
#         project's routing (ADR-0020).
# spec:   a spec before it is built (#128): a file (--input spec=<file>) or
#         an issue by its number (--input issue=<n>), every spec lens;
#         `workline review --spec` or `--issue` on a machine.
# schedule: on the forge, in the gardening line after the product owner
#         (opt-in): the issues it refined that wait on a spec review, up
#         to specs-per-run a run (#433); ready is held while an important
#         finding is open (#128).
events: [review, merge-request, spec, schedule]
# On a merge request, the lenses that only warn (`ai-findings`) can read
# apart from the verdict (ADR-0050): the verdict's line asks the lenses
# that block (`route --warn-apart`), a line of its own the others, posting
# in a comment of their own (`route --warn-only`).
apart: [merge-request]

requires: [git]

# Finding what a change breaks, and telling a defect from a guess, is
# judgement on code.
model:
  capability: reasoning
  tier: standard
  effort: medium
  promote-after: 1   # a lens's answer that does not read is asked for again once

context:
  # Estimated tokens, 711 + 0.82 a character (#235): the lenses' call, the
  # change (diff-lines-max) and the files it changes (code-lines-max); real
  # calls up to 97.0k tokens in (a lens of 117k characters, #147). A change
  # past it is read in parts, each within it (parts-max, #446).
  budget: 100000

duties:
  reads: ["**"]
  writes: []         # never the code: the author fixes, a person merges

# A lens answers findings, each its cause quoted; the engine finds the quote
# again, and tells the change's from the rest. What it then proposes is the
# engine's own: an issue for what lies outside the change, and one summary
# comment on the merge request carrying each finding on its line, in the
# forge's own review (#277). Never a patch, never an approval.
part-intentions: [finding]
intentions: [issue, comment, note]
# A finding that blocks is when the author most needs the comment: a
# blocked run still applies these, which only say what was found, the
# record of the commits reviewed in the comment (#226).
on-block: [comment, issue]
# A push landing before the run is applied: the review of the head it
# judged is still applied, its line comments at that head, so the push's
# run reviews only what is new (#375, ADR-0044's amendment).
on-moved-on: [comment, issue]

# Without AI, the rules that need no judgement still run and still block; the
# change waits for a person's review, said.
without-ai: block

settings:
  base: main            # `workline review` starts from here when no --base is given
  # Not code: a change touching only these asks nobody.
  ignore: ["*.md", "**/*.md", "docs/**", "LICENSE*", "**/*.txt", "CHANGELOG*"]
  # In this order on a merge request, one a push (lenses-per-push), the
  # record turning it; every one on a machine, or with --input lenses=all
  # (on a merge request, when it becomes ready: the whole change), or on
  # one no draft (--input draft=false) its record does not say every lens
  # read (#359).
  lenses: [correctness, edge-cases, tests, intent, claims]
  lenses-per-push: 1
  # On a merge request, after ready (ADR-0050): the new commits a push's
  # lenses that warn read, those changing code counted, the oldest first;
  # the rest left, said, for the next push or the run again, first in line.
  # A lens that blocks, and the run on ready, read every one. 0: every one.
  commits-per-push: 5
  # A change to what the merge request's own pipeline runs skips no commit
  # on the record (ADR-0051, cut 5): .github/, .gitlab-ci.yml and
  # .workline/, and these paths, for a pipeline that runs scripts from
  # elsewhere: [ci/, scripts/ci/].
  pipeline-paths: []
  findings-max: 10      # findings on the change checked and shown a run; the rest counted
  issues-max: 3         # issues opened a run for what lies outside the change; the rest counted
  diff-lines-max: 1500  # lines of the change's hunks one call is given; past them, the change is read in parts
  code-lines-max: 600   # lines of the files changed a lens is given whole, all together; the others by their hunks
  # A change past one call — the context budget or diff-lines-max — is read
  # in parts, as a doc too large is judged (ADR-0009, #446): each part the
  # lenses, what the author says, every file by name, then a share of the
  # files; each part a call, its findings judged as one review's. Past
  # parts-max, no lens is asked, said: the author splits the change. Two
  # parts spend at most two budgets, 200k tokens, leaving the judges a third
  # of ai-max-tokens. 1: never in parts. 1 to 8.
  parts-max: 2
  comment-block-max: 8  # lines of one comment the change adds (long-comment, a warning)
  # A comment telling the code's history, not what it does (bug-story).
  story-words: ['\bused to\b', '\bthe bug was\b', '\bpreviously\b']
  # What the lenses find warns until the evaluation has measured it (#90);
  # block: an important finding the judge verified blocks. One value for
  # every lens, or by lens, a lens not named warning:
  # {correctness: block, edge-cases: warn}.
  ai-findings: warn
  # The independence a verification needs (ADR-0005): context (the same
  # model, apart), model, provider.
  judge-at-least: context
  # On a merge request: each finding on its line, the summary comment, and
  # an issue for each verified finding outside the change. false: all of
  # them only in the verdict.
  forge-writes: true
  # Each lens looks for a number of candidates before it stops, from the
  # change's size; nothing found is ever required to be shown (ADR-0020).
  finder-floor: true
  # The test files. A lens whose judge reads tests (lenses/tests.md) has
  # its judge shown those in the cause's folder and those naming its file.
  tests: ["**/*_test.*", "**/test_*", "**/*_spec.*", "**/*.test.*", "**/*.spec.*", "**/test/**", "**/tests/**", "**/spec/**", "**/__tests__/**"]
  tests-lines-max: 300  # lines of those tests one judge is shown, all together; the rest named
  # Lines of code one judge is shown, all together: the function the
  # cause lies in, whole; then the functions the finding names, those it
  # calls and those calling it, each whole while they fit; the rest named
  # (#127). 0: the 31 lines around the cause only.
  judge-lines-max: 200
  # The judge of the code reads what it needs (ADR-0045): instead of a
  # verdict, it may ask a file's lines, a definition by its name, or the
  # places a word is written, read from git at the commit reviewed, and is
  # asked again; a no quotes the lines that refute the finding, found
  # again, else the finding is shown not verified; unsure too. Rounds of
  # reads a judge may ask, on since the replay of 2026-10-14 (ADR-0045,
  # amended); 0: the judge reads nothing, a no drops the finding; at most
  # 8, the engine asking a judge ten times a run at most.
  judge-read-rounds: 2
  # Lines read for one judge, all its rounds together; past them, cut, the
  # rest named; 0: no read. A search past 50 places is not read: narrow it.
  judge-read-lines-max: 400
  # Every lens a run asks, in one call: the change and its files given
  # once, each finding naming its lens (#147). false: a call each, apart.
  lenses-together: true
  # The diff-alone facet (lenses/diff-alone.md, #126): a call of its own,
  # each run, given the change only, not the files nor what the author
  # says; its findings quoted and judged as a lens's. `--lenses
  # diff-alone` asks it alone, whatever this says.
  diff-alone: false
  # What the author says, the lenses' testimony (#126): the messages of the
  # commits reviewed, whole, and the merge request's title and body.
  testimony-lines-max: 80
  # Decisions put to a person a run (#126): no defect, a choice only a
  # person makes; never judged, never blocking. The rest counted.
  questions-max: 3
  # The issues the change closes (`Closes #4`), read from the forge: their
  # Need, Verification and Scope, for a lens that `needs: issue` (intent).
  issue-lines-max: 80
  # What a run may spend, all calls together, tokens in and out as the agent
  # reports them; once spent, nothing more is asked, said, and the commits
  # are not recorded as reviewed. The call that crosses it is paid. 0: no cap.
  # 300000, so a large review is judged whole when its judges read
  # (ADR-0045): a run spends what it uses.
  ai-max-tokens: 300000
  # The lenses a spec is read through (#128), lenses/<lens>.md holding
  # `subject: spec`: every one each run, together when lenses-together.
  spec-lenses: [ambiguous, unverifiable, out-of-scope, contradicted]
  # Lines of the spec the lenses and each judge are given; past them, cut, said.
  spec-lines-max: 300
  # On the forge (#128): reviews in a row that leave an important finding
  # open, the product owner answering between them; the next is a
  # question to a person, on the issue, and the reviewer stops reading it.
  spec-rounds: 5
  # On the forge (#433): the specs a run reads, in the backlog's order,
  # each its own lens call, comment and record; the rest wait for the next
  # run, said. Five at the dearest cost measured (about 41k tokens a spec,
  # three important findings judged) spend about 205k, within
  # ai-max-tokens; past it, the specs after are not read, said. 1 to 20.
  specs-per-run: 5
