contract: 1
name: committer
mission: Every commit is atomic, and its message tells a newcomer what changed and why.

# commit-msg: the local git hook, on the message being written.
# merge-request: CI, on every commit of the MR — the net for hooks that were skipped.
# pre-push: the same on the machine, on the commits about to be pushed.
events: [commit-msg, merge-request, pre-push]

requires: [git]
# Optional tools, run when installed; the verdict says when one is missing.
# gitleaks: secrets, and the terms of the user's lists (README, "Secrets").
uses: [gitleaks]

# A commit message is short writing; a cheap, fast model is enough.
model:
  capability: writing
  tier: light
  effort: low
  promote-after: 1   # a refused rewrite is asked again once, of a stronger model

context:
  knowledge: []
  budget: 4000

duties:
  reads: ["**"]
  writes: []

intentions: [commit-message, note]

# Without AI, a bad message still fails; the human rewrites it with the verdict in hand.
without-ai: block

settings:
  subject-max: 72
  body-max-lines: 12
  types: [feat, fix, docs, test, refactor, perf, build, ci, chore, revert]
  # Internal references that mean nothing outside the project (AC-3, F-NEW-1, L-019...).
  # Forbidden in the subject; allowed in a trailer at the end (`Refs: AC-3`).
  internal-codes: ['\b[A-Z]{1,4}(-NEW)?-[0-9]+\b']
  # Standard identifiers that look like codes but are not.
  internal-codes-allow: [UTF-8, UTF-16, SHA-1, SHA-256, SHA-512, ISO-8601, 'RFC-[0-9]+', 'CVE-[0-9]+']
  # Author and committer addresses allowed, as patterns; with the user's own
  # list (README, "Identity"). Both empty: identities are not checked.
  allowed-identities: []
