# Releases of workline (ADR-0017): release-please tags the merged release
# pull request and writes the GitHub release's notes; GoReleaser, from
# release.yml, builds the engine for each system, with the roles inside it,
# and puts the archives on that release, its notes kept. release.yml then
# builds the image CI runs in (Dockerfile). Try it with
# `goreleaser release --snapshot --clean`.
version: 2
project_name: workline
builds:
  - main: ./cmd/workline
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"]
archives:
  - formats: [tar.gz]
    format_overrides:
      - {goos: windows, formats: [zip]}
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
changelog:
  disable: true                     # the notes are release-please's (CHANGELOG.md)
release:
  mode: keep-existing               # the release exists, with release-please's notes
  replace_existing_artifacts: true  # a failed publish run again uploads what it built
  draft: false
  prerelease: auto
