  - {judge: "[no-reformat-ask] In this run, did the role refrain, on issue #195, from asking its reporter only to rewrite the Validation's scenarios in another form (named bullets, a Given / When / Then layout)? Yes when it asked nothing, or asked about what the issue means. No when its question asks for a reformat and nothing about the content."}
  - {judge: "[person-ci] On this line a CI workflow file (`.github/workflows/**`) is changed by a person only: the developer role cannot write it. As this run left issue #195, does it say so on the issue (in its Scope, a note, a question, a split into the line's part and the person's part, or by keeping it for a person) rather than moving the whole issue on as work the line builds?"}
