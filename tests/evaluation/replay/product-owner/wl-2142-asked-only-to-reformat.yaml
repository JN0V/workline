        body: "## Need\n\nA reader of the user docs needs to read how a role works, not what it cost to measure it.\nToken figures held in a user doc are internals a newcomer cannot read.\nToday they sit in the pages of the documentalist and the product owner.\n\n## Example\n\n- The roles/documentalist and roles/product-owner docs state token figures for runs.\n- A reader of those pages meets numbers with no context.\n- The page should say what the role does and link to where the measure is told.\n\n## Validation\n\n- Given a user doc of a role, When I read it, Then it holds no token figure and links to the measure.\n- Given the moved measure, When I open docs/research/ or the ADR, Then the figure is there with its run and date.\n- Given the documentalist, When it checks the docs, Then no user doc is suspect from this move.\n\n---\n\n## Verification\n\n- Search the docs of roles/documentalist and roles/product-owner for token figures.\n- `go test -count=1 ./...` and the documentalist report show no new suspect doc.\n\n## Scope\n\n- Move each figure to docs/research/ or an ADR.\n- Replace it in the user doc by a link to it.\n- Rule: AGENTS.md \"No unexplained internals\".\n"
        comments:
          - "```yaml\nsources: []\nconfirmed: 1d0004c\n```\n\n<!-- workline:sticky=product-owner/state -->"
