        body: "### BUG-56 — WebUI: a refusal message outlives its cause [LOW] — **NEW (2026-09-20, by BUG-51's review)**\n\n- **Problem**: a message is cleared when the next attempt starts, on entering\n  edit mode and on cancel. It is deliberately not cleared by a redraw — the card\n  redraws every tick and would wipe it within a second — so after a refused save\n  the reason sits under a field the tick has already put back to a valid value,\n  with no way to dismiss it. A multi-field save can leave several at once.\n- **The decision**: a close control, a lifetime, or clearing on the next *edit*\n  of that field (an `input` event, which the buffering listener does not use\n  today). Each is a different answer to \"how long is a refusal true for\".\n- **Refs**: BUG-51 (which chose the rule), SEC-14.\n\nOpened from `docs/CODE-ROADMAP.md`, lines 4264 to 4274 by the product-owner role.\n\n<!-- workline:import=docs/CODE-ROADMAP.md:e0b855c40924 -->\n\n## Need\n\n<!-- workline:draft -->\n\nWhen a settings save is refused, I want the refusal message to disappear once it is no longer true, so I am not told a field is wrong after it already shows a valid value.\n\n---\n\n## Scope\n\n`DomoticsCore-WebUI/webui_src/app.js`: where the refusal message is drawn under a field (`showActionError`) and where it is cleared (on the next attempt, on entering edit mode, on cancel). The card redraws every tick, so a redraw must not clear it."
        comments:
          - {body: "@JN0V, to refine this issue: How long should a refusal message stay visible? Pick one: (a) a close control the person clicks, (b) a fixed lifetime (how many seconds?), or (c) cleared as soon as the person next edits that field.\n\n<!-- workline:product-owner/ask -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-20T11:07:13Z"}
