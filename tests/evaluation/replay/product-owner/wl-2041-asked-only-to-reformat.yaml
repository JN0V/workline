        insider: true
        labels: ["bug"]
        body: "## Need\n\nA person running a prompt-only role in CI needs the merge request diff the role reads to be the right one, and to exist, so the run does not block.\n\n## Example\n\n- A role runs in a CI checkout on merge request !12, with no `range` set.\n- The checkout holds `main` but not the local branch `feature/x`.\n- The fallback reads `main..feature/x`: the branch is missing, so the run blocks.\n- Where the branch exists, `main..feature/x` is the tip-to-tip diff, which also shows what `main` gained since the branch left it.\n\n## Validation\n\n- Given a run with no `range` on a merge request in a checkout with no local branch, When the role reads its input, Then the diff is built from `origin/<branch>` and the run does not block.\n- Given a merge request whose base moved on after the branch was cut, When the diff is built, Then it holds only the merge request's own changes.\n- Given a role declaring both `target` and `commits` on a merge request, When the input is built, Then the same diff is not given twice.\n\n---\n\n## Verification\n\n- Conformance case for each scenario above.\n- Real try in a clone where the branch exists only as `origin/<branch>`.\n\n## Scope\n\n- `internal/engine/inputs.go:56` and `:115`: the fallback builds `base..branch`; use three dots (`base...branch`).\n- Retry with `origin/<branch>` as `roles/tester/code/green.go` and `roles/tester/code/objection.go` already do; reuse, do not copy.\n- Minor: `target` plus `commits` on a merge request gives the same diff twice.\n- Refs #1644 and #2005 (the follow-up its review found).\n"
        comments:
          - {body: "**The product owner**, on 2026-11-22:\n\n<!-- workline:act {\"role\":\"product-owner\",\"kind\":\"sources\",\"run\":\"20261122T202436.527292107-product-owner\",\"day\":\"2026-11-22\",\"commit\":\"a44fc4473db8b772ee8832852b1c1c571ea44c15\",\"models\":[],\"items\":[{\"kind\":\"issue\",\"id\":\"2041\",\"state\":\"open\"},{\"kind\":\"comment\",\"id\":\"7084696635\",\"state\":\"posted\"},{\"kind\":\"comment\",\"id\":\"7085011688\",\"state\":\"posted\"}]} -->\n\n- Named the code #2041 is about: internal/engine/inputs.go, roles/tester/code/green.go, roles/tester/code/objection.go. internal/engine/inputs.go says `rng = base + \"..\" + branch` — The issue is about the fallback range built in this file. T…\n\n**The product owner** leaves this issue in refine: no test would be written first.\n\n- **Why**: its Validation holds Given / When / Then, but no scenario the tester reads.\n- **Next**: a person rewrites each scenario of its Validation as `- **Name:** Given …, When …, Then …`, or as a `Scenario: <name>` line with its Given / When / Then below; it then goes to its tests.\n\n<!-- What workline knows of this issue, edited by the engine, not by hand.\n```yaml\nsources: [internal/engine/inputs.go, roles/tester/code/green.go, roles/tester/code/objection.go]\nconfirmed: a404f56b\nbody: 819e30f7debc\nsections:\n    Need: A person running a prompt-only role in CI needs the merge request diff the role reads to be the right one, and to exist, so the run does not block.\n    Scope: |-\n        - `internal/engine/inputs.go:56` and `:115`: the fallback builds `base..branch`; use three dots (`base...branch`).\n        - Retry with `origin/<branch>` as `roles/tester/code/green.go` and `roles/tester/code/objection.go` already do; reuse, do not copy.\n        - Minor: `target` plus `commits` on a merge request gives the same diff twice.\n        - Refs #1644 and #2005 (the follow-up its review found).\ndid:\n    - act: sources\n      level: normal\n      day: \"2026-11-22\"\n      at: a44fc447\n      model: claude:claude-sonnet-5-5\n      body: 819e30f7debc\n      line: 'Named the code #2041 is about: internal/engine/inputs.go, roles/tester/code/green.go, roles/tester/code/objection.go. internal/engine/inputs.go says `rng = base + \"..\" + branch` — The issue is about the fallback range built in this file. T…'\nheard: 0\nrules: 2\nsilent: its Validation holds Given / When / Then, but no scenario the tester reads\n```\n-->\n\n<!-- workline:sticky=product-owner/state -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-22T19:48:52Z"}
          - {body: "**workline reviewer**, its spec — 3 findings on the spec, 1 question for a person; lenses: ambiguous, unverifiable, out-of-scope, contradicted; tokens: 24612 in, 2454 out (4 calls), of 600000 a run (ai-max-tokens).\n\n**Holds nothing**: 1 important finding open, round 1 of 5. Verification, the tester's: it answers it as it writes the tests, before ready, and holds nothing back.\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | input-cut | `#2041` | the code the spec names given to the reviewer's agent is cut past code-lines-max (600 lines): 296 of the 1555 lines of the files named given (`roles/tester/code/green.go` 296 of 453 lines, `roles/tester/code/objection.go` 0 of 1102 lines); raise roles.reviewer.settings.code-lines-max in .workline/config.yaml |\n| warns | unverifiable | `#2041:23` | Important: Conformance cases are not named — 'Conformance case for each scenario above' names no test, and the 'Real try' names no pass check. A person can run it and see no block while the diff is still wrong, so the check would pass with the Need unmet. The second scenario, a base that moved, needs a fixture with a moved base, which the spec does not describe. Fix: State the expected diff text for the moved-base fixture and the pass criterion of the real try. (verified, independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | contradicted | `#2041:27` | Nit: Line numbers do not match the fallback — The spec says the fallback builds the range at lines 56 and 115. Line 115 is only `base = \"HEAD\"` (the default base when the merge request has none), not a range build. The only range built is at line 56. A builder following ':115' finds no `base..branch` there; if they read it as asking for `HEAD...branch`, it is a different change. Fix: Name only line 56, or say what changes at 115 (the empty-base default). (shows at internal/engine/inputs.go) |\n| warns | ambiguous | `#2041:30` | Nit: Vague terms 'prompt-only role', 'the follow-up' — The Need names 'prompt-only role' without saying which roles are meant, and 'Refs #1644 and #2005 (the follow-up its review found)' does not say which issue is the follow-up, nor whether its work is inside this spec. Fix: Say which issue is the follow-up and whether it is in scope. |\n| warns | finding-judged-no |  | dropped, from the contradicted lens: \"Block cause is not the fallback range alone\" at #2041:28 — the judge: the spec's claim that `roles/tester/code/green.go` already retries with `origin/<branch>` holds, since `mergeBase` there loops over `[]string{base, \"origin/\" + base}`, and the finding only says the helper 'cannot be checked', which is a guess, not a contradiction. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | finding-judged-no |  | dropped, from the out-of-scope lens: \"Reuse needs a change in the tester role the Scope does not name\" at #2041:28 — the judge: the Scope names `roles/tester/code/green.go` and `roles/tester/code/objection.go` in 'reuse, do not copy', so the tester code is covered, and the claim that the helper must be exported or moved and needs a fixture is a guess. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n\n**Questions for a person**\n\nNot defects, not judged: choices the spec leaves to a person; a reply here is enough, they hold nothing.\n\n- `#2041:16` (ambiguous): When a role declares both target and commits on a merge request, which section keeps the diff? On: “Then the same diff is not given twice.”\n\nThe reviewer never edits the issue nor moves it: the product owner answers, a person decides.\n\n<!-- workline:spec-review body=819e30f7debc round=1 open=1 in=Verification -->\n\n<!-- workline:act {\"role\":\"reviewer\",\"kind\":\"comment\",\"run\":\"20261122T200920.748335859-reviewer\",\"day\":\"2026-11-22\",\"commit\":\"4c523fe0ded5262d4d0e2a42ec1ae9958d8e573d\",\"models\":[],\"items\":[{\"kind\":\"issue\",\"id\":\"2041\",\"state\":\"open\"},{\"kind\":\"comment\",\"id\":\"7084696635\",\"state\":\"posted\"}]} -->\n\n<!-- workline:sticky=reviewer/spec -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-22T20:11:15Z"}
