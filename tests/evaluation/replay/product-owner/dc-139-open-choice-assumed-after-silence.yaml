  timeout. The body and the question are as they were on 11-15 before that
  run; main was 81774f5. Expected: no assumption on the open choice, and the
  issue not readied: it waits for the person. The instruction's rule on a
  choice left open was written on 2026-11-25 from this issue among five: a
