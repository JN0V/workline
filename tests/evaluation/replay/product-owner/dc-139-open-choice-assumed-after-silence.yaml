  messages leave." The role asked that on 2026-10-29; with no answer, on 11-15
  it wrote the assumption "a shutdown withdraws the entities", drafted "a
  device with two entities", and the issue was readied on 11-16 after 24 h.
  The owner sent pull request 260 back (more than eight events are not
