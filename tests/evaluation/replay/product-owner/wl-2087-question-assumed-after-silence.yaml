        labels: ["bug", "workline:to-refine"]
        body: "## Need\n\nWhen the agent's token is rejected in a repository in production, the person wants to be told once and the line to stop retrying, so runner minutes are not burned and the problem is not silent.\n\n## Example\n\nOn 2026-11-23 a repository's `CLAUDE_CODE_OAUTH_TOKEN` was rejected:\n`agent-unavailable: agent unavailable: claude failed: Failed to authenticate. API Error: 401 Invalid bearer token`\n\n- The propose job ended green: `blocked-external — the agent could not be reached: only the rules ran`.\n- apply and reconcile then re-dispatched each of 5 issues every 1 to 2 minutes.\n- That made about 110 runs per issue in 3.5 h, about 800 runner minutes.\n- Nothing was written to the issues. The person saw nothing.\n\nWanted: one notice to the person, then no dispatch until the secret changes or the person acts.\n\n## Steps to reproduce\n\n1. In a repository with the line's workflows, set `CLAUDE_CODE_OAUTH_TOKEN` to an invalid value.\n2. Open an issue the line must refine.\n3. Watch the Actions runs for 30 minutes.\n\n- **Expected:** one comment or notice to the person naming the 401; no new dispatch; the job is not green.\n- **Actual:** a re-dispatch every 1 to 2 minutes; the job is green; no comment.\n- **Version:** the engine pinned in that repository on 2026-11-23 (a 0.8x release).\n\n## Validation\n\n- **Authentication failure:** Given an agent that answers 401, When the line runs on an issue, Then one comment or notice tells the person, and no further dispatch happens for that issue.\n- **Secret changes:** Given a stopped line after a 401, When the secret changes or the person acts, Then dispatch resumes.\n- **Other causes back off:** Given an agent unreachable for a cause other than 401, When the line retries, Then the delay between runs grows each time.\n- **Not green:** Given an unreachable agent, When the job ends, Then it does not show a plain success and the person can see why.\n\n---\n\n## Scope\n\n- A 401 is not transient: record it, notify once, stop dispatching until the secret changes or the person acts.\n- Other unreachable causes: back off.\n- `.github/workflows/workline-develop.yml`: two steps turn an unreachable agent (status 3) into a warning and `exit 0`, so the job is green. Both change.\n  - The step that reads `steps.line.outputs.status` (the line `status=${{ steps.line.outputs.status || 0 }}`, followed by `if [ \"$status\" = 3 ]`).\n  - The review round step that reads `STATUS` from `steps.round.outputs.status`.\n- `.github/workflows/workline-apply.yml`: the apply and reconcile dispatch that starts the run again.\n- `cmd/workline/cli.go`: `dispatch` only returns the exit code of the command it runs. It does not map the route result `blocked-external` to a code.\n- New: `tests/simulator/unreachable_agent_test.go`: tests for a 401 and for another unreachable cause.\n- `docs/`: the page on the line's workflows, to say what happens when the agent cannot be reached.\n\nGuessed: the code that turns a route result into the exit code 3, and the code that classifies the agent's error as a 401 and records it, are not in the code given. They are probably in `cmd/workline/main.go` (the route command), `internal/line/line.go` and `internal/engine/`. The comment writer is probably under `internal/forge/`. The developer lists each file changed beyond these paths, with why.\n\nDecisions still open, asked of the reporter: how the line sees the secret changed, whether the stop and the notice are per issue or per repository, the channel of the notice, and the conclusion the job shows."
