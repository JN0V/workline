          - {body: "**workline reviewer**, its spec — 5 findings on the spec, 1 question for a person; lenses: ambiguous, unverifiable, out-of-scope, contradicted; tokens: 31165 in, 3840 out (5 calls), of 600000 a run (ai-max-tokens).\n\n**Holds it from ready**: 1 important finding open, round 4 of 5. Validation, a person's: the product owner never rewrites it and asks its reporter; a person answers, editing it, or accepts the issue as it reads with `workline:accepted`. The reviewer then reads the spec again.\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | input-cut | `#2087` | the code the spec names given to the reviewer's agent is cut past code-lines-max (600 lines): 426 of the 8463 lines of the files named given (`.github/workflows/workline-develop.yml` 56 of 715 lines, `.github/workflows/workline-apply.yml` 49 of 325 lines, `cmd/workline/cli.go` 70 of 291 lines, `cmd/workline/main.go` 231 of 3342 lines, `internal/line/line.go` 20 of 848 lines, and 7 more files); raise roles.reviewer.settings.code-lines-max in .workline/config.yaml |\n| warns | unverifiable | `#2087:32` | Important: Backoff and 'not green' verification not testable as written — No test, command or threshold proves a growing delay (needs a clock or simulated time), and 'does not show a plain success' does not name the conclusion. The decisions on the conclusion are still open. Fix: Name the job conclusion, the message, and how the test controls time. (verified, independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | contradicted | `#2087:44` | Nit: dispatch described as not mapping blocked-external, scope misplaces it — The spec lists cmd/workline/cli.go in Scope, saying dispatch only returns the command's exit code. That is true (dispatch returns c.run's code), but nothing in the Need asks for a change there; the mapping to exit 3 lives elsewhere (guessed). The file is in Scope without work asked of it. Fix: Say what must change in cli.go, or drop it from the Scope. |\n| warns | ambiguous | `#2087:15` | Nit: 'Person acts' and 'one comment or notice' are vague — 'Acts' could mean a label, a comment, or a manual dispatch; 'comment or notice' lets the builder pick either channel, which build and test differently. Fix: Name the action that resumes the line and the single channel. |\n| warns | contradicted | `#2087:42` | Nit: Two steps said to turn status 3 into green; only the review round is the second — The spec says the develop steps exit 0 on status 3. The code confirms both, but the review round step reads a differently named variable, and the first uses an expression-inlined status; the spec's quoted line matches. Fix: None required; confirm both steps change the same way. (shows at .github/workflows/workline-develop.yml) |\n| warns | unverifiable | `#2087:29` | Nit: New tests file named but the Verification names no checks — Scope names the test file, but 'one comment' and 'no further dispatch' need a way to count dispatches in the simulator that is not named. Fix: Say how the test observes dispatches and the notice. |\n| warns | finding-judged-no |  | dropped, from the out-of-scope lens: \"Scope guesses the files that carry the core of the Need\" at #2087:48 — the judge: the Scope names the parts that hold this work, though hedged with 'probably': `cmd/workline/main.go`, `internal/line/line.go`, the folders `internal/engine/` and `internal/forge/`, and it states the 401 behaviour ('record it, notify once, stop dispatching'); the finding shows no part of the Need lying outside these and only objects that they are guessed. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | finding-judged-no |  | dropped, from the out-of-scope lens: \"Reconcile dispatch and the recorded state are not in Scope\" at #2087:43 — the judge: the Scope names `.github/workflows/workline-apply.yml` as 'the apply and reconcile dispatch', and its Guessed paragraph covers 'the code that classifies the agent's error as a 401 and records it' in `internal/line/line.go` and `internal/engine/`; the claim of separate tick/reconcile code outside these is only a guess. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | finding-judged-no |  | dropped, from the ambiguous lens: \"'Grows each time' backoff is unbounded and unspecified\" at #2087:31 — the judge: 'the delay between runs grows each time' has one testable meaning, each delay longer than the one before, which both linear and exponential growth satisfy; the missing initial delay, factor and cap are detail the builder may choose, and 'never retry' is only a guess. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n\n**Questions for a person**\n\nNot defects, not judged: choices the spec leaves to a person; a reply here is enough, they hold nothing.\n\n- `#2087:50` (ambiguous): Is the stop per issue or per repository, which channel carries the notice, how is a changed secret detected, and what conclusion does the job show? On: “Decisions still open, asked of the reporter: how the line sees the secret changed, whether the stop and the notice are per issue or per repository, the channel of the notice, and the conclusion the jo…”\n\nThe reviewer never edits the issue nor moves it: the product owner answers, a person decides.\n\n<!-- workline:spec-review body=e5cdc362d8b8 round=4 open=1 in=Validation -->\n\n<!-- workline:act {\"role\":\"reviewer\",\"kind\":\"comment\",\"run\":\"20261124T061025.514336686-reviewer\",\"day\":\"2026-11-24\",\"commit\":\"33daff28c430b286065f5397b9c3af3d9fb88b59\",\"models\":[],\"items\":[{\"kind\":\"issue\",\"id\":\"2087\",\"state\":\"open\"},{\"kind\":\"comment\",\"id\":\"7120336100\",\"state\":\"posted\"},{\"kind\":\"comment\",\"id\":\"7121316839\",\"state\":\"posted\"},{\"kind\":\"comment\",\"id\":\"7123271745\",\"state\":\"posted\"},{\"kind\":\"comment\",\"id\":\"7123397223\",\"state\":\"posted\"}]} -->\n\n<!-- workline:sticky=reviewer/spec -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-24T03:40:35Z"}
          - {body: "@JN0V, to refine this issue: Your Validation leaves two choices open. 1) How should the line see that the secret changed? A secret's value cannot be read by a workflow. It could be a stored hash, a new secret version, or a manual re-run. 2) Should the stop and the single notice apply per issue or per repository, since the 401 is the repository's token? Also, which channel is the notice: an issue comment, or a workflow annotation? And what conclusion must the job show instead of green, for example failure or neutral?\n\n<!-- workline:product-owner/ask -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-24T05:47:08Z"}
