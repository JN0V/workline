case: product-owner/wl-2087-question-assumed-after-silence
about: >
  JN0V/workline #2087, a person's bug: an agent the line cannot reach is
  retried every minute. On 2026-11-24 the role asked two choices the
  Validation leaves open (how the line sees that the secret changed; a stop
  per issue or per repository) and wrote in the Scope "Decisions still open,
  asked of the reporter". 24 h later it assumed "per repository, one comment",
  and the reviewer's fifth round left the issue to a person. One of six
  questions of the window that ended in an assumption; the owner decided on
  11-25 that a product choice is never settled by a timeout. The issue and its
  comments are as they were before the assumption; main was f45f6b2. Expected:
  no assumption: the body itself says the decisions are open.
