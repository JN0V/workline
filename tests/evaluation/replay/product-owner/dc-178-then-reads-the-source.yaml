case: product-owner/dc-178-then-reads-the-source
about: >
  JN0V/DomoticsCore #178, a roadmap row: "volatile int pollingClients — use
  std::atomic<int> or remove volatile". On 2026-10-19 the role drafted one
  scenario: "When I read the pollingClients declaration, Then it is not a
  plain volatile int"; the tester froze a test that greps the header, the
  developer objected, and the owner closed the issue and pull request 296 on
  11-25: the test proves no atomicity. (The owner also found that no count is
  lost today, the counter is only set to 0 or 1: a choice of theirs, not
  graded.) The body is the row as imported; main was 0944d89. Expected: every
  Then is seen by running, none read in the source. The instruction's
  Validation rules were written on 2026-11-25 from this issue among five: a
  pass here shows the edit landed, not that the role generalises (the held-
  cases measure that).
