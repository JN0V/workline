case: product-owner/wl-2085-question-assumed-after-silence
about: >
  JN0V/workline #2085, a person's bug: a lens answer that is not valid YAML
  fails the whole verdict. On 2026-11-24 the role asked which failures are
  retried and where both parse errors are named; 24 h later it assumed "any
  invalid-proposals error; in the lens-failed short", and the issue was
  readied, built and merged on 11-25 (pull request 2182), nothing sent back.
  One of six questions of the window that ended in an assumption. The issue
  and its comments are as they were before the assumption; main was dccd37b.
  Whether this question is one only the owner can answer is the owner's to
  say: reported apart (owner-choice), counted neither for nor against.
given:
  clone: {repo: JN0V/workline, head: dccd37b89ed989cbfc1beef71996dc10c29c0f6e}
  config: {roles: {product-owner: {settings: {autonomy: normal, issues-per-run: 15, acts: {refine: {max: 10}, ready: {max: 10}}, archived: [docs/BACKLOG.md]}}}}
  forge:
    issues:
      - id: 2085
        title: "A lens answer that is not valid YAML fails the whole verdict"
        author: JN0V
        insider: true
        labels: ["bug"]
        body: "## Need\n\nA person who opens a pull request needs a review that does not fail on one malformed agent answer, so a correct change is not held by a reply's syntax.\n\n## Example\n\n- Pull request [#2084](https://github.com/JN0V/workline/pull/2084), a 9-line pin change, v0.88.0 to v0.89.0.\n- The reviewer's correctness lens got an answer that is not valid YAML: `agent answered without valid proposals: expected a YAML list of proposals (yaml: found character that cannot start any token)`.\n- The status `workline/verdict` went `fail` with `short: [lens-failed]`, while 0 findings were made on the change.\n- The comment says the next push asks every lens again. The person had to push an empty commit.\n\n## Validation\n\n- **Bad answer retried:** Given a lens answers with text that is not a YAML list, When the reviewer reads it, Then it asks that lens once more, with the parse error, before it counts it as failed.\n- **Still bad:** Given the second answer is also not valid, When the reviewer reads it, Then the lens is `lens-failed` as today, naming both parse errors.\n- **Good answer:** Given a lens answers a valid list, When the reviewer reads it, Then no second call is made.\n\n---\n\n## Verification\n\n- A test of the reviewer with a fake agent: first answer invalid YAML, second valid; the lens is not failed and the agent is called twice.\n- The same with two invalid answers: `lens-failed`.\n\n## Scope\n\n- The reviewer's reading of a lens answer (the code that raises `lens-failed` on `invalid: agent answered without valid proposals`).\n- Not the lenses' prompts.\n"
        comments:
          - {body: "**The product owner**, on 2026-11-24:\n\n<!-- workline:act {\"role\":\"product-owner\",\"kind\":\"comment\",\"run\":\"20261124T034543.081707495-product-owner\",\"day\":\"2026-11-24\",\"commit\":\"b8a77c0ae9f313928adbd1b751d730c0652a19ba\",\"models\":[],\"items\":[{\"kind\":\"issue\",\"id\":\"2085\",\"state\":\"open\"},{\"kind\":\"comment\",\"id\":\"7120335307\",\"state\":\"posted\"},{\"kind\":\"comment\",\"id\":\"7121315785\",\"state\":\"posted\"}]} -->\n<!-- workline:act {\"role\":\"product-owner\",\"kind\":\"ask\",\"run\":\"20261124T034543.081707495-product-owner\",\"day\":\"2026-11-24\",\"commit\":\"b8a77c0ae9f313928adbd1b751d730c0652a19ba\",\"models\":[],\"items\":[{\"kind\":\"issue\",\"id\":\"2085\",\"state\":\"open\"},{\"kind\":\"comment\",\"id\":\"7120335307\",\"state\":\"posted\"},{\"kind\":\"comment\",\"id\":\"7121315785\",\"state\":\"posted\"}]} -->\n\n- Named the code #2085 is about: roles/reviewer/code/reviewer.go, internal/engine/engine.go. roles/reviewer/code/reviewer.go says `fmt.Fprintln(os.Stderr, \"reviewer:\", err)` — The reviewer's code reads the lens answers and raises lens-failed.\n- Labelled #2085 `bug`, a bug: The reviewer fails a whole verdict on one malformed lens answer, where a retry is meant to recover. Wrong? Change the label; the role does not set it again.\n- Asked the reporter a question, in the comment below.\n\n<!-- What workline knows of this issue, edited by the engine, not by hand.\n```yaml\nsources: [roles/reviewer/code/reviewer.go, internal/engine/engine.go]\nconfirmed: af579e5f\njudged: b8a77c0a\nbody: 0d815b1f6233\nsections:\n    Need: A person who opens a pull request needs a review that does not fail on one malformed agent answer, so a correct change is not held by a reply's syntax.\n    Scope: |-\n        - The reviewer's reading of a lens answer (the code that raises `lens-failed` on `invalid: agent answered without valid proposals`).\n        - Not the lenses' prompts.\nanswered: 0d815b1f6233\ndid:\n    - act: sources\n      level: normal\n      day: \"2026-11-24\"\n      at: af579e5f\n      model: claude:claude-sonnet-5-5\n      body: 0d815b1f6233\n      line: 'Named the code #2085 is about: roles/reviewer/code/reviewer.go, internal/engine/engine.go. roles/reviewer/code/reviewer.go says `fmt.Fprintln(os.Stderr, \"reviewer:\", err)` — The reviewer''s code reads the lens answers and raises lens-failed.'\n    - act: kind\n      level: normal\n      day: \"2026-11-24\"\n      at: af579e5f\n      model: claude:claude-sonnet-5-5\n      body: 0d815b1f6233\n      line: 'Labelled #2085 `bug`, a bug: The reviewer fails a whole verdict on one malformed lens answer, where a retry is meant to recover. Wrong? Change the label; the role does not set it again.'\n    - act: ask\n      level: normal\n      day: \"2026-11-24\"\n      at: b8a77c0a\n      model: claude:claude-sonnet-5-5\n      body: 0d815b1f6233\n      line: Asked the reporter a question, in the comment below.\nheard: 0\nrules: 2\nkind: bug\n```\n-->\n\n<!-- workline:sticky=product-owner/state -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-24T02:38:03Z"}
          - {body: "**workline reviewer**, its spec — 4 findings on the spec; lenses: ambiguous, unverifiable, out-of-scope, contradicted; tokens: 21346 in, 2599 out (3 calls), of 600000 a run (ai-max-tokens).\n\n**Holds it from ready**: 1 important finding open, round 1 of 5. Validation, a person's: the product owner never rewrites it and asks its reporter; a person answers, editing it, or accepts the issue as it reads with `workline:accepted`. The reviewer then reads the spec again.\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | ambiguous | `#2085:14` | Important: 'Not a YAML list' vs any parse or shape failure — The Validation triggers on text that is not a YAML list. The example error is a YAML syntax error, and a valid YAML that is not a list, or a list of unreadable proposals, is a different failure. One reading retries only on syntax errors, another on every invalid-proposals error. Builders would code different conditions, and the tests would differ. Fix: State which failures retry: a syntax error, a non-list, an empty answer, or every ErrInvalidOutput. (also found on this line — ambiguous: What 'with the parse error' means is open) (verified, independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | ambiguous | `#2085:15` | Nit: 'Naming both parse errors' has no format — It is unclear where the two errors are named (the lens-failed short, the comment, or the log) and in what form. The test cannot assert it. Fix: Say where and how both errors appear. |\n| warns | unverifiable | `#2085:22` | Nit: 'Agent is called twice' does not show the error was passed — The first test checks that the lens is not failed and that two calls are made. It does not check that the second call carried the parse error, which the Validation requires. Fix: Assert the second call's prompt contains the first parse error. |\n| warns | out-of-scope | `#2085:27` | Nit: Scope pins the code by a message, not a place — The Scope names only 'the reviewer's reading', by a message. The error comes from the agent package's ErrInvalidOutput, and the reading of an answer may sit in the engine or in the agent package. The Need implies a retry that calls the agent again, and that may be outside the reviewer role's code, which the Scope leaves out. Fix: Name the files, and say whether internal/agent or the engine may change. (also found on this line — contradicted: The message is not raised by the reviewer code) |\n| warns | finding-judged-no |  | dropped, from the unverifiable lens: \"Verification omits the 'good answer' and the naming checks\" at #2085:23 — the judge: the first Verification test ('first answer invalid YAML, second valid; the lens is not failed and the agent is called twice') would fail if the Need were unmet; the missing 'good answer' and 'naming both parse errors' checks are Validation scenarios, not the Need itself. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n\nThe reviewer never edits the issue nor moves it: the product owner answers, a person decides.\n\n<!-- workline:spec-review body=0d815b1f6233 round=1 open=1 in=Validation -->\n\n<!-- workline:act {\"role\":\"reviewer\",\"kind\":\"comment\",\"run\":\"20261124T033231.757390701-reviewer\",\"day\":\"2026-11-24\",\"commit\":\"af579e5f9be5b03cc296f143242beff2f00003e6\",\"models\":[],\"items\":[{\"kind\":\"issue\",\"id\":\"2085\",\"state\":\"open\"},{\"kind\":\"comment\",\"id\":\"7120335307\",\"state\":\"posted\"}]} -->\n\n<!-- workline:sticky=reviewer/spec -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-24T03:40:31Z"}
          - {body: "@JN0V, to refine this issue: Which failures should the reviewer retry once? (a) only a YAML syntax error, as in #2084; (b) also a valid YAML that is not a list, or an empty answer; (c) every invalid-proposals error. And where should \"naming both parse errors\" appear: in the `lens-failed` short, in the comment, or in the log?\n\n<!-- workline:product-owner/ask -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-24T04:01:03Z"}
run: {role: product-owner, event: schedule}
grade:
  - {status: pass}
  - {sh: ": owner-choice-waits; python3 -c 'import json; i = [i for i in json.load(open(\"../forge.json\"))[\"issues\"] if i[\"id\"] == 2085][0]; assert \"## Assumptions\" not in i[\"body\"]'"}
