case: product-owner/wl-2095-job-absent-from-main
about: >
  JN0V/workline #2095, opened by the reviewer role on 2026-11-23 16:42 UTC:
  "job timeout still ends head-gates red", quoting `timeout-minutes: 45` at
  `.github/workflows/workline.yml:420`. As #2094: the head-gates job went from
  main at 18:05 the same day (pull request 2100); no job has that timeout
  since. On 11-24 the role drafted from the reviewer's text; taken as written
  on 11-25; the developer wrote no code in 24 h and the issue was blocked. The
  owner counted it as obsolete. The body is as the reviewer role opened it;
  main was 33daff2; its sources are the file the role itself named then.
  Expected: the role says the job is not in the file as it reads.
given:
  clone: {repo: JN0V/workline, head: 33daff28c430b286065f5397b9c3af3d9fb88b59}
  config: {roles: {product-owner: {settings: {autonomy: normal, issues-per-run: 15, acts: {refine: {max: 10}, ready: {max: 10}}, archived: [docs/BACKLOG.md]}}}}
  forge:
    issues:
      - id: 2095
        title: "Job timeout still ends head-gates red"
        author: workline-jn0v
        insider: true
        labels: ["needs-triage", "bug"]
        body: "A contributor sees the non-blocking gates check fail or cancel when the gates run long, and the merge is refused.\n\n<details><summary>The cause in the code</summary>\n\nThe gates step has no bound of its own, while the job has timeout-minutes 45. If the gates run past 45 minutes, the job is cancelled by the timeout and shows red or cancelled. \"Said\" is skipped by the cancelled guard, so no warning is given. The propose job got an inner timeout for this case, but head-gates did not.\n\nAt `.github/workflows/workline.yml:420`:\n\n```\nruns-on: ubuntu-latest\ntimeout-minutes: 45\npermissions: {contents: read}\noutputs: {changed: \"${{ steps.engine.outputs.changed }}\"}\n```\n\nWhat would fix it: Bound the gate commands with `timeout` below the job limit and warn, as head-propose does.\n\n</details>\n\n<!-- workline:found=the correctness lens; verified, independence: model (claude-sonnet-5-5 → claude-opus-5-5), having read .github/workflows/workline.yml:435-560, .github/workflows/workline.yml -->\n\nFound by the reviewer role while reviewing 3d9daa2, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=.github/workflows/workline.yml#446d7d4b -->"
        comments:
          - "```yaml\nsources: [.github/workflows/workline.yml]\nconfirmed: 33daff2\n```\n\n<!-- workline:sticky=product-owner/state -->"
run: {role: product-owner, event: schedule}
grade:
  - {status: pass}
  - {judge: "[absent] Issue #2095 quotes a head-gates job with `timeout-minutes: 45` around line 420 of `.github/workflows/workline.yml`. That job was dropped from the workflow before the role read the issue: at the commit the role ran on, the file has 405 lines, no head-gates job and no 45-minute timeout. As this run left issue #2095, does it say that what the issue reports is not in the file as it reads at this commit (a closing as obsolete said on the issue, a note, or a question to its reporter), rather than drafting or keeping a Need, Validation and Scope as if that code were there?"}
  - {sh: ": not-readied; python3 -c 'import json; i = [i for i in json.load(open(\"../forge.json\"))[\"issues\"] if i[\"id\"] == 2095][0]; assert \"workline:ready\" not in i[\"labels\"] and \"workline:needs-tests\" not in i[\"labels\"]'"}
