        labels: ["bug", "workline:to-refine"]
        body: "## Need\n\nTesters lose a whole run to a small slip in the answer's shape, then get told a reason that is not the cause.\n\n## Steps to reproduce\n\n1. In an Android project in production, the tester's agent answers with a `covers:` block at the top level, not as `- covers:` items.\n2. The answer is read as prose and skipped, then refused: \"proposal 1 holds 2 kinds (scenario, tests)\".\n3. The retry adds prose on line 9 and is refused: \"yaml: line 9: could not find expected ':'\".\n4. The earlier refusal \"no report\" did not say the run was on the base, without the new tests. The agent read it as its own tests not reporting.\n\n- **Expected:** the shape is repaired or accepted, and the refusal says \"on the base, without the new tests\".\n- **Actual:** 175k and 167k tokens lost across the two tries.\n- **Version:** workline 0.88.0.\n\n## Validation\n\n- **Top-level covers:** Given an answer with a top-level `covers:` block holding the scenario and its tests, When the answer is read, Then it is repaired or accepted as one `- covers:` item.\n- **Refusal says where:** Given a test run that wrote no report on the base without the new tests, When the check refuses, Then the message says \"on the base, without the new tests\".\n- **Retry told the cause:** Given a refused answer, When the agent retries, Then the reason it reads names the real fault, not a later YAML error caused by its own fix.\n\n---\n\n## Scope\n\n- `internal/agent/claude.go`: the step that reads the answer as a list, around `proseFirst` (lines 538 to 549). It skips the top-level `covers:` block as prose, then the kinds check fails.\n- `roles/tester/code/tester.go`: `prove()`. The base run is labelled \"on the base <commit>\" only; it must say \"on the base, without the new tests\" when the report is missing.\n\nRelated: [#2085](https://github.com/JN0V/workline/issues/2085), a lens answer that is not valid YAML."
