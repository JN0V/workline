          - {body: "**workline reviewer**, its spec — 7 findings on the spec, 1 question for a person; lenses: ambiguous, unverifiable, out-of-scope, contradicted; tokens: 19344 in, 4539 out (6 calls), of 300000 a run (ai-max-tokens).\n\n**Holds it from ready**: 3 important findings open, round 1 of 5. Validation, a person's: the product owner never rewrites it and asks its reporter; a person answers, editing it, or accepts the issue as it reads with `workline:accepted`. Verification, the tester's: it answers it as it writes the tests, before ready, and holds nothing back. The reviewer then reads the spec again.\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | ambiguous | `#9:11` | Important: 'High-contrast hand-drawn shapes' undefined — The Validation says 'four high-contrast hand-drawn shapes' but gives no shape type, size, ink, or contrast threshold. One builder tests with simple squares in a marker pen, another with arbitrary doodles, and the detector gets built and tested against different inputs. Fix: State which shapes (and how many distinct ones), minimum size, and a contrast or ink criterion the detector must handle. (verified, independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | unverifiable | `#9:20` | Important: Verification uses manual, subjective checks — 'Try it with a real phone and a real sheet' has no command, pass criterion, or threshold; it passes whenever someone says it worked. 'The existing tests and lint stay green' doesn't prove hand-drawn tracking works. Fix: Add automated detector tests with fixture images of drawn shapes and a stated success rate, plus a device-check checklist. (verified, independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | unverifiable | `#9:21` | Important: Verification lacks a check for the ArUco unchanged scenario and the experimental label — The Verification only says existing tests stay green. Those tests may not cover the default mode selection, and nothing checks the 'experimental' marking or that ArUco is the default. Fix: Add tests that the default mode is ArUco and that the custom mode label contains 'experimental'. (verified, independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | out-of-scope | `#9:26` | Nit: Persisting the mode choice not in Scope — A mode choice must be kept across launches, which touches settings or the repository; the Scope names neither a settings nor a persistence module. Fix: Say where the mode is stored and add that module to the Scope. (also found on this line — contradicted: Native detector area given as ArUco-only code) |\n| warns | ambiguous | `#9:25` | Nit: Fork reference unclear about what to reuse — 'About 398 lines' and 'not to be copied blindly' leave open which parts of the fork are kept; the fork is also an external, unpinned-in-repo reference. Fix: List the fork behaviours that are required versus free to change. |\n| warns | unverifiable | `#9:19` | Nit: 'Needs the owner's yes' is not a check — It is a process gate listed under Verification, and the machine cannot prove it. Fix: Move it out of Verification. |\n| warns | out-of-scope | `#9:13` | Nit: Test-wiring modules not in Scope — The Validation asks for unit tests of the detector run by `./gradlew test`; the Scope lists no test directories or build files, and the native detector may need a Kotlin-side seam to be unit-tested. Fix: Name the test source sets and the build changes allowed. |\n| warns | finding-judged-no |  | dropped, from the ambiguous lens: \"'Tracking locks on' and 'behaves as before' not defined\" at #9:11 — the judge: 'Then tracking locks on' points to the app's existing tracking state, which the walkthrough already shows, so builders and testers would build and check the same thing; asking 'how many frames, which state' is detail a builder does not need. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n| warns | finding-judged-no |  | dropped, from the out-of-scope lens: \"Overlay calculator and docs not in Scope but implied\" at #9:26 — the judge: the finding only guesses that `OverlayTransformCalculator`'s `marker.corners[id]` must change, while the spec's Example says the fork's 398 lines touched only 'the native detector, `core/cv`, onboarding, `TracingScreen` and `MainActivity`', all named in Scope; and no part of the Need asks for marker docs or README work. (independence: model (claude-sonnet-5-5 → claude-opus-5-5)) |\n\n**Questions for a person**\n\nNot defects, not judged: choices the spec leaves to a person; a reply here is enough, they hold nothing.\n\n- `#9:3` (ambiguous): Must the four shapes be distinct, or identical with corner identity derived from position? On: “they need to draw the corner shapes by hand instead of printing ArUco markers”\n\nThe reviewer never edits the issue nor moves it: the product owner answers, a person decides.\n\n<!-- workline:spec-review body=69120607075f round=1 open=3 in=Validation,Verification -->\n\n<!-- workline:act {\"role\":\"reviewer\",\"kind\":\"comment\",\"run\":\"20261123T142147.535120404-reviewer\",\"day\":\"2026-11-23\",\"commit\":\"8d3965c825d4145df335cec4fd738f3445ef9180\",\"models\":[],\"items\":[{\"kind\":\"issue\",\"id\":\"9\",\"state\":\"open\"},{\"kind\":\"comment\",\"id\":\"7094648649\",\"state\":\"posted\"}]} -->\n\n<!-- workline:sticky=reviewer/spec -->", author: "workline-jn0v[bot]", bot: true, created: "2026-11-23T14:23:04Z"}
