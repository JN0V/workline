        body: "## Need\n\nA person with no printer wants to set up tracing, so they need to draw the corner shapes by hand instead of printing ArUco markers.\n\n## Example\n\nThe fork mrutalo/TraceGlass, branch `feature/custom-corner-markers`, commit fefa077e, \"Add experimental custom corner shape tracking\" (thanks to its author, mrutalo). It adds about 398 lines across 12 files: the native detector, `core/cv`, onboarding, `TracingScreen` and `MainActivity`. It has no tests.\n\n## Validation\n\n- **Scenario: hand-drawn shapes lock.** Given four high-contrast hand-drawn shapes at the paper corners, When the walkthrough runs with \"Custom shapes (experimental)\", Then tracking locks on.\n- **Scenario: ArUco is unchanged.** Given four printed ArUco markers, When the walkthrough runs in the default mode, Then tracking behaves as before.\n- **Scenario: the detector is tested.** Given the new detector code, When `./gradlew test` runs, Then it has unit tests that pass.\n\n---\n\n## Verification\n\n- This is a feature: it needs the owner's yes before it is built.\n- Try it with a real phone and a real sheet with four drawn shapes.\n- The existing tests and lint stay green.\n\n## Scope\n\n- The fork's code is a reference, not to be copied blindly: re-write it to the project's modules and style, with tests.\n- Areas: the native detector (`core/cv/src/main/cpp`), `core/cv` (detection mode and detector), `feature/onboarding` (mode choice, walkthrough, setup guide, strings), `feature/tracing` (`TracingScreen`), `app` (`MainActivity` wiring).\n- Marked experimental in the UI; ArUco stays the default.\n"
