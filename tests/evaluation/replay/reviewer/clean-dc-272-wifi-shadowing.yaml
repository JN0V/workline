case: reviewer/clean-dc-272-wifi-shadowing
about: >
  Clean. JN0V/DomoticsCore #272 (closes #164): WifiComponent's constructor parameters renamed so they no longer
  shadow the ssid and password members, a missing <functional> include added, with a native test. Merged with no
  review round; the owner's label on an independent review; only the release bumped Wifi.h's version line after
  it. Any Important here is false. #164's body was last edited before the pull request opened.
