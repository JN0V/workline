      branch: change
      title: 'chore(domoticscore): wiFi member shadowing of ssid/password'
      body: |
        Closes #164

        The developer's code for #164, proven on the project's tests.

        ## Changes

        - Code: `DomoticsCore-Wifi/include/DomoticsCore/INetworkProvider.h`, `DomoticsCore-Wifi/include/DomoticsCore/Wifi.h`.
        - The tester's acceptance tests, read-only to the developer, from `workline/tester/issue-164`: `DomoticsCore-Wifi/test/test_wifi_shadow/test_wifi_shadow.cpp`.

        ## Beyond the Scope

        Files changed beyond the issue's Scope, the product owner's hint, each with its agent's reason: the reviewer's intent lens judges each.

        - `DomoticsCore-Wifi/include/DomoticsCore/INetworkProvider.h`: uses std::function without including \<functional>, so Wifi.h did not compile on its own for the -Wshadow test

        ## Verification

        - Its agent ran with the rights of the CI job; the forge's guards decide what merges.
        - `tools/workline-tests.sh {report}`: 1370 tests passed, none red.
        - The whole suite: no file it touches lies in a folder holding tests (the developer's `proof-command`, with `{packages}`, runs the touched folders alone).
        - Run on a fresh checkout of 5c9abbd, its code laid on it: not its agent's worktree.

        ## Tried

        - Its code on the project's tests, on a fresh checkout, before this opened: above.
        - Not tried: the commands the issue names to verify it, nor a person's use of it.
