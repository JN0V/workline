  clone:
    repo: JN0V/DomoticsCore
    base: 04d2cb3b12f789c8ee2d8c2c9bc1528c1ff64671
    head: 149f2d1eb6db795b573b5e452da2827346a4a7fa
  forge:
    issues:
    - id: 164
      title: 'LO-9: WiFi member shadowing of ssid/password'
      labels:
      - task
      body: |
        Opened from `docs/CODE-ROADMAP.md`, lines 6329 to 6329 by the product-owner role.

        <!-- workline:import=docs/CODE-ROADMAP.md:dba875a5a2b2 -->

        ## Need

        Maintainers of the WiFi component want constructor parameters that do not shadow members, so shadow warnings stay clean and the code is clearer.

        ## Validation

        - **No shadow warning:** Given `Wifi.h`, When it is compiled with `-Wshadow`, Then no warning is reported for `ssid` or `password`.
        - **Same behaviour:** Given `WifiComponent("net", "pw")`, When it starts, Then it connects with those credentials as before.

        ---

        ## Verification

        <!-- workline:verification=tester -->

        - **No shadow warning:** `DomoticsCore-Wifi/test_wifi_shadow.test_wifi_header_reports_no_shadow_warning_for_ssid_or_password`.
        - **Same behaviour:** no test can check it: kept as today: guarded by `test_reconnect_success_emits_events` (DomoticsCore-Wifi/test/test_wifi_behaviour/test_wifi_behaviour.cpp), which builds WifiComponent("Net", "pw"), starts it and checks the connect call it made and the SSID it used

        Each test fails on the code before the change and passes once it is built; they are on `workline/tester/issue-164`. Written by the tester from its tests.

        ## Scope

        The `WifiComponent` constructor and its `ssid` and `password` members in `DomoticsCore-Wifi/include/DomoticsCore/Wifi.h`.

        ## Assumptions

        - Assumption taken on 2026-11-16, the question of 2026-10-20 unanswered after 24 h: The shadowing is in the `WifiComponent` constructor, where `ssid` and `password` parameters hide the members of the same name; it causes only a warning, not a wrong value.
        - Assumption taken on 2026-11-17, the Need and Validation drafts unanswered after 24 h: written as the role drafted it, for a person to correct.
      author: JN0V
    merge-requests:
