case: reviewer/clean-tg-11-unreadable-onboarding
about: >
  Clean. JN0V/TraceGlass #11 (closes #4): the onboarding repository reads its DataStore through a flow that turns
  an IOException into empty preferences, so an unreadable file gives the onboarding defaults instead of a crash;
  Kotlin tests. Merged with no review round; the owner's label on an independent review; nothing touched the
  repository file after its merge. Any Important here is false. #4's body was never edited.
given:
  clone:
    repo: JN0V/TraceGlass
    base: 8d3965c825d4145df335cec4fd738f3445ef9180
    head: 531dd014a1fa77db18e8869ef264f71c86b5c3a2
  forge:
    issues:
    - id: 4
      title: An unreadable onboarding file crashes the app at launch
      labels:
      - bug
      body: |
        **Need**: a person whose onboarding preferences file cannot be read needs the app to start anyway, as it does when the settings file cannot be read.

        **Example**:

        1. Make the `onboarding_prefs` DataStore throw an `IOException` on read.
        2. Launch the app.

        - **Expected**: onboarding comes back with its defaults: not completed, no tier chosen. The app starts on the onboarding.
        - **Actual**: the read error is not caught; the app crashes at launch, every time.
        - **Version**: main, 8d3965c.

        ## Validation

        - **Scenario: unreadable gives defaults**
          - Given the onboarding store throws an `IOException` on read
          - When "onboarding completed" is read
          - Then it is false
        - **Scenario: tier falls back**
          - Given the same store
          - When the chosen tier is read
          - Then there is none
        - **Scenario: other errors surface**
          - Given the store throws an `IllegalStateException` on read
          - When it is read
          - Then the error is not hidden, as today

        ---

        ## Verification

        - New unit tests in `feature/onboarding/src/test/kotlin/io/github/jn0v/traceglass/feature/onboarding/`, a DataStore fake whose `data` throws: the first two scenarios fail on main and pass once built.
        - `./gradlew :feature:onboarding:testDebugUnitTest`.

        ## Scope

        - `feature/onboarding/src/main/kotlin/io/github/jn0v/traceglass/feature/onboarding/DataStoreOnboardingRepository.kt`: catch `IOException` on `dataStore.data` and emit empty preferences; rethrow anything else.
        - Model to follow: `core/session/src/main/kotlin/io/github/jn0v/traceglass/core/session/DataStoreSettingsRepository.kt` (`.catch { if (exception is IOException) emit(emptyPreferences()) else throw exception }`).
        - Reference: trial issue JN0V/TraceGlass-trial#75.
      author: JN0V
    merge-requests:
    - id: 11
      branch: change
      title: 'fix: an unreadable onboarding file crashes the app at launch'
      body: |
        Closes #4

        The developer's code for #4, proven on the project's tests.

        ## Changes

        - Code: `feature/onboarding/src/main/kotlin/io/github/jn0v/traceglass/feature/onboarding/DataStoreOnboardingRepository.kt`.
        - The tester's acceptance tests, read-only to the developer, from `workline/tester/issue-4`: `feature/onboarding/src/test/kotlin/io/github/jn0v/traceglass/feature/onboarding/DataStoreOnboardingRepositoryTest.kt`.

        ## Verification

        - Its agent ran with the rights of the CI job; the forge's guards decide what merges.
        - `./gradlew --console=plain $(echo {packages} | sed -E 's#\./##g; s#/#:#g; s#([^ ]+)#:\1:testDebugUnitTest#g')`: 56 tests passed, none red.
        - On the folders its code and the acceptance tests touch: `./feature/onboarding`. This pull request's own CI runs the whole suite.
        - Run on a fresh checkout of ad67301, its code laid on it: not its agent's worktree.

        ## Tried

        - Its code on the project's tests, on a fresh checkout, before this opened: above.
        - Not tried: the commands the issue names to verify it, nor a person's use of it.
run:
  role: reviewer
  event: review
  target: merge-request:11
  input:
    range: main..HEAD
review:
  defects: []
