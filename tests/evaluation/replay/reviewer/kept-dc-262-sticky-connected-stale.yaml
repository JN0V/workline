    kind: stale-sticky-connected-replayed
    at:
    - file: DomoticsCore-MQTT/include/DomoticsCore/MQTT_impl.h
      lines:
      - 205
      - 212
      text: emit(MQTTEvents::EVENT_CONNECTED, true, true);
      why: connected is sticky and never cleared when the link drops
    - file: DomoticsCore-MQTT/include/DomoticsCore/MQTT_impl.h
      lines:
      - 108
      - 116
      text: emit(MQTTEvents::EVENT_DISCONNECTED, true, true);
      why: the loss is emitted sticky but the old sticky connected stays replayable
    - file: DomoticsCore-MQTT/include/DomoticsCore/MQTT_impl.h
      lines:
      - 232
      - 239
      text: emit(MQTTEvents::EVENT_DISCONNECTED, true, true);
      why: 'same on disconnect(): the sticky connected is not cleared'
