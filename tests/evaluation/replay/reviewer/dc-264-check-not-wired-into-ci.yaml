case: reviewer/dc-264-check-not-wired-into-ci
about: >
  DomoticsCore #264 (closes #154) adds tools/check_stack_usage.py, which fails on a .su stack frame over a
  limit, and its test. The owner reviewed head e3007bf0, since force-pushed away and absent from the mirror: the
  case starts from its parent 04d2cb3b (in the mirror) and given.setup lays e3007bf0's two files on it, byte for
  byte, in one commit. The owner sent it back
  (https://github.com/JN0V/DomoticsCore/pull/264#issuecomment-7112635021): (1) the script is not wired into CI
  (no -fstack-usage on the esp8266dev FullStack build), so the Need is unmet and "Closes #154" closes it early;
  the Scope names `.github/workflows`, which the line cannot write; (2) rsplit(':', 3) cuts C++ names holding
  `::`: parse them, with a test on such a name. Said again at the next head
  (https://github.com/JN0V/DomoticsCore/pull/264#issuecomment-7129514187). The line then: "CI not wired;
  esp8266dev build runs no check" was an intent Important, verified, and the developer answered it "no fix"
  while keeping "Closes #154"; the `::` parse was not found. Issue body as at 2026-11-15 (edit history, before
  the review); PR body current, unedited.
given:
  clone: {repo: JN0V/DomoticsCore, base: 04d2cb3b12f789c8ee2d8c2c9bc1528c1ff64671, head: 04d2cb3b12f789c8ee2d8c2c9bc1528c1ff64671}
  setup:
    - "echo  | base64 -d > tools/check_stack_usage.py"
    - "echo  | base64 -d > tools/test_check_stack_usage.py"
    - "git add tools/check_stack_usage.py tools/test_check_stack_usage.py && git commit -qm \"chore: no build-time check reads the ESP8266 boot path's stack frames\""
    - "test $(git rev-parse HEAD:tools/check_stack_usage.py) = 97190c2944f448d173445aedb7c926dbe1bf4998 && test $(git rev-parse HEAD:tools/test_check_stack_usage.py) = 6a9ace4a9a47388aaced923e507f1fb35aa6f618"
  forge:
    issues:
      - id: 154
        title: "CI-18 — no build-time check reads the ESP8266 boot path's stack frames"
        labels: ["task"]
        body: "### CI-18 — no build-time check reads the ESP8266 boot path's stack frames [LOW] — **NEW (2026-09-20, by the deferred-work purge)**\n\n- **Parked by**: BUG-42's lot, 2026-09-18.\n- **Problem**: `Core::begin()` was one deep frame among several on the 4 KB\n  cont stack, and BUG-42 measured only the one overflowing it. With that\n  kilobyte gone the Storage suite's deepest point leaves 896 B — margin, not\n  comfort: `-fstack-usage` puts `logPromotedRecord` at 1 168 B and\n  `app_entry_redefinable` at 4 160, and nothing in CI reads either number. A\n  board found BUG-42; a build could have.\n- **Fix**: `PLATFORMIO_BUILD_FLAGS=\"-fstack-usage\"` on the `esp8266dev`\n  FullStack build, and a script that fails on any frame over a stated figure\n  in the paths an application runs at boot.\n- **Refs**: BUG-42, CI-14 (the same build).\n\nOpened from `docs/CODE-ROADMAP.md`, lines 5904 to 5916 by the product-owner role.\n\n<!-- workline:import=docs/CODE-ROADMAP.md:8f8b8110b55e -->\n\n## Need\n\nA maintainer shipping ESP8266 builds wants CI to flag large stack frames on the boot path, so a stack overflow is found by a build and not by a board.\n\n## Example\n\n`-fstack-usage` puts `logPromotedRecord` at 1 168 B and `app_entry_redefinable` at 4 160 B on a 4 KB stack. The Storage suite's deepest point leaves only 896 B, and no CI check reads these numbers.\n\n## Validation\n\n- **Frame too big:** Given a boot-path function whose frame exceeds the stated limit, When the `esp8266dev` FullStack build runs in CI, Then the check fails and names the function.\n- **Within limits:** Given all boot-path frames under the limit, When CI runs, Then the check passes.\n\n---\n\n## Verification\n\nThe `esp8266dev` FullStack build runs with `PLATFORMIO_BUILD_FLAGS=\"-fstack-usage\"`. A script fails on any frame over the stated figure in the boot paths. A test feeds the script one oversized frame and expects failure.\n\n## Scope\n\n`.github/workflows` (the `esp8266dev` FullStack build), a new check script, `DomoticsCore-Core/src/Core.cpp`.\n\n## Assumptions\n\n- Assumption taken on 2026-11-15, the Need and Validation drafts unanswered after 24 h: written as the role drafted it, for a person to correct."
        comments: []
    merge-requests:
      - id: 264
        branch: change
        title: "chore: no build-time check reads the ESP8266 boot path's stack"
        body: "Closes #154\n\nThe developer's code for #154, proven on the project's tests.\n\n## Changes\n\n- Code: `tools/check_stack_usage.py`, `tools/test_check_stack_usage.py`.\n- The tester found that no acceptance test applied to this issue: no test is frozen for it.\n\n## Beyond the Scope\n\nFiles changed beyond the issue's Scope, the product owner's hint, each with its agent's reason: the reviewer's intent lens judges each.\n\n- `tools/check_stack_usage.py`: the check script the issue asks for; the Scope names no path, tools/ holds the project's CI scripts\n- `tools/test_check_stack_usage.py`: feeds the script an oversized frame and expects failure, as the Verification asks\n\n## Left out\n\nCI-18: I wrote `tools/check_stack_usage.py` and `tools/test_check_stack_usage.py`, but I did not edit `.github/workflows/ci.yml`. The rules revert any change to CI workflows, so the `esp8266dev` FullStack build does not run the check yet. A person needs to add it.\n\nThe script reads the `.su` files from `-fstack-usage` and exits 1 naming each function over the limit. Its default limit is 1280 B, and it only counts frames from sources under `DomoticsCore-*`. The 1280 B figure is my choice. It sits just above `logPromotedRecord` at 1168 B, so please confirm it or set another with `--limit`. `app_entry_redefinable` (4160 B) is framework code, so the default path filter skips it. To cover it, add a `--path` for its source file.\n\nThe test feeds the script one oversized frame and expects exit 1 with the function named. It also covers a pass under the limit, an off-path frame being ignored, and a build with no frames failing. I ran it with `python3 tools/test_check_stack_usage.py`: 4 tests, all pass. I did not run `tools/workline-tests.sh`, which only runs the native PlatformIO suites and none of this. I did not run the script against a real esp8266 build either.\n\nTo wire it into the `Build FullStack example` step of the `build-targets` job in `ci.yml`, add this env to that step:\n\\```\nenv:\n  PLATFORMIO_BUILD_FLAGS: ${{ matrix.target == 'esp8266dev' && '-fstack-usage' || '' }}\n\\```\nThen add a step that runs this when the target is `esp8266dev`:\n\\```\npython3 tools/check_stack_usage.py DomoticsCore-System/examples/FullStack/.pio/build/esp8266dev\n\\```\nTwo things there are untested. I did not check that PlatformIO writes the `.su` files under that `.pio/build` directory. I also did not check that `-fstack-usage` makes the build produce the frames the script looks for. If a library is built in place, the path filter may need adjusting. `DomoticsCore-Core/src/Core.cpp` needed no change.\n\n\n## Verification\n\n- Its agent ran with the rights of the CI job; the forge's guards decide what merges.\n- `tools/workline-tests.sh {report}`: 1369 tests passed, none red.\n- The whole suite: no file it touches lies in a folder holding tests (the developer's `proof-command`, with `{packages}`, runs the touched folders alone).\n- Run on a fresh checkout of 04d2cb3, its code laid on it: not its agent's worktree.\n\n## Tried\n\n- Its code on the project's tests, on a fresh checkout, before this opened: above.\n- Not tried: the commands the issue names to verify it, nor a person's use of it.\n"
run: {role: reviewer, event: review, target: "merge-request:264", input: {range: main..HEAD}}
review:
  defects:
    - lens: intent
      kind: check-not-wired-into-ci
      at:
        - {file: "#154", text: "When the `esp8266dev` FullStack build runs in CI, Then the check fails and names the function.", why: "nothing in CI builds esp8266dev with -fstack-usage nor runs the script; Closes is early"}
        - {file: tools/check_stack_usage.py, lines: [1, 12], text: "Fail on any stack frame over a limit in the ESP8266 boot path (CI-18).", why: "a check script no build runs"}
    - lens: correctness
      kind: cpp-scope-names-misparsed
      at:
        - {file: tools/check_stack_usage.py, lines: [25, 35], text: "head = parts[0].rsplit(\":\", 3)", why: "a C++ name holding :: is split on its scope colons: wrong file and name"}
        - {file: tools/test_check_stack_usage.py, lines: [14, 15], text: "BIG = \"DomoticsCore-Storage/src/S.cpp:20:6:logPromotedRecord", why: "no test feeds a name holding ::"}
