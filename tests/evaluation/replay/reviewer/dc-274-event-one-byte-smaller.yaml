case: reviewer/dc-274-event-one-byte-smaller
about: >
  DomoticsCore #274 (closes #158) packs MQTTPublishEvent's qos and retain into one byte: the event goes from 830 to
  829 bytes, which meets the frozen test's letter ("below 830") while QueueCost::kReference stays at block(830), so
  the queue gains nothing (its own Left out says the saving is small). Head 13f2ccfc is the one the line declared
  ready and the owner reviewed. The owner sent it back
  (https://github.com/JN0V/DomoticsCore/pull/274#issuecomment-7112634480): (1) 829 against 830 gains nothing,
  kReference unchanged; (2) `qos : 2` silently truncates values above 3; (3) no test that qos and retain read back
  after packing. The line then (https://github.com/JN0V/DomoticsCore/pull/274#issuecomment-7106065418, first version
  2026-11-23T15:45Z): the intent lens found "Event shrinks by one byte, not enough to matter", dropped by the quote
  check as finding-unfounded; the qos wrap (edge-cases) and the missing read-back test (tests) were nits; the verdict
  said no finding. Issue body: current, last edited 15:26Z before the PR opened; PR body: its 15:42Z version.
given:
  clone: {repo: JN0V/DomoticsCore, base: 04d2cb3b12f789c8ee2d8c2c9bc1528c1ff64671, head: 13f2ccfc7c38783a592dcd90a33abe406fd85a45}
  forge:
    issues:
      - id: 158
        title: "LO-2: MQTTPublishEvent is 830 bytes, reduce field sizes"
        labels: ["task"]
        body: "The MQTT publish event takes 830 bytes. The event bus sizes its queue from this figure, so the event costs memory on small boards. The wish is to reduce its field sizes. It hurts boards with little RAM, such as the ESP8266.\n\n<details><summary>For the builder</summary>The size is `sizeof(MQTTPublishEvent)`. The event bus uses 830 as `kReference` in `DomoticsCore-Core/include/DomoticsCore/EventBus.h`.</details>\n\nOpened from `docs/CODE-ROADMAP.md`, lines 6322 to 6322 by the product-owner role.\n\n<!-- workline:import=docs/CODE-ROADMAP.md:a383a9b7cbf9 -->\n\n## Need\n\nAs a builder for a board with little RAM, I want the MQTT publish event to be smaller, so that the event queue holds more events or uses less memory.\n\n## Validation\n\n- **Smaller event:** Given the new event type, When I print its `sizeof`, Then it is below 830 bytes.\n- **Same messages:** Given a topic and payload that fit before, When I publish them, Then they still arrive whole.\n\n---\n\n## Verification\n\n<!-- workline:verification=tester -->\n\n- **Smaller event:** `DomoticsCore-MQTT/test_mqtt_event_size.test_the_publish_event_is_below_830_bytes`.\n- **Same messages:** no test can check it: kept as today: no existing test was found that checks it, so nothing guards it; a test of it would pass on the base, and is not written\n\nEach test fails on the code before the change and passes once it is built; they are on `workline/tester/issue-158`. Written by the tester from its tests.\n\n## Scope\n\nThe MQTT publish event type in the MQTT headers, and the reference size in the event bus."
        comments: []
    merge-requests:
      - id: 274
        branch: change
        title: "chore: MQTTPublishEvent is 830 bytes, reduce field sizes"
        body: "Closes #158\n\nThe developer's code for #158, proven on the project's tests.\n\n## Changes\n\n- Code: `DomoticsCore-MQTT/include/DomoticsCore/MQTT.h`.\n- The tester's acceptance tests, read-only to the developer, from `workline/tester/issue-158`: `DomoticsCore-MQTT/test/test_mqtt_event_size/test_mqtt_event_size.cpp`.\n\n## Left out\n\nMQTTPublishEvent is now 829 bytes, down from 830, so it is below 830 as the acceptance test asks. The saving is small. I packed `qos` (2 bits) and `retain` (1 bit) into one byte in `DomoticsCore-MQTT/include/DomoticsCore/MQTT.h`. I kept the topic field at 128 bytes and the payload field at 700 bytes. A bigger cut means shrinking those two fields, and existing tests pin them. The alarm-panel test expects \"699-byte event field\", and the discovery test expects \"127-char event field\". If the payload was cut to 640, the alarm-panel test failed. The topic field is also tied to `HA_TOPIC_BUF_SIZE`.\nThe same applies to `QueueCost::kReference` in `EventBus.h`. I left it at 830, because `test_cliff_is_where_it_was` pins the 32-event budget to that figure.\nBigger savings, which the ESP8266 case wants, need a decision from a person. Either shrink the fields and update those tests, or make the event variable-length.\nThe full `tools/workline-tests.sh` run showed no failures in my last run. `test_mqtt_event_size` passes.\n`qos` and `retain` are now bitfields, so nobody can take a pointer or reference to them. Nothing in the repo does.\n\n\n## Verification\n\n- Its agent ran with the rights of the CI job; the forge's guards decide what merges.\n- `tools/workline-tests.sh {report}`: 1370 tests passed, none red.\n- The whole suite: no file it touches lies in a folder holding tests (the developer's `proof-command`, with `{packages}`, runs the touched folders alone).\n- Run on a fresh checkout of fdf16f2, its code laid on it: not its agent's worktree.\n\n## Tried\n\n- Its code on the project's tests, on a fresh checkout, before this opened: above.\n- Not tried: the commands the issue names to verify it, nor a person's use of it.\n"
run: {role: reviewer, event: review, target: "merge-request:274", input: {range: main..HEAD}}
review:
  defects:
    - lens: intent
      kind: saving-too-small-to-matter
      at:
        - {file: DomoticsCore-MQTT/include/DomoticsCore/MQTT.h, lines: [54, 61], text: "the event is 829 bytes, not 830.", why: "one byte saved: the queue, sized on 830, holds no more events"}
        - {file: "#158", text: "so that the event queue holds more events or uses less memory.", why: "the Need is a queue gain, not a sizeof below 830"}
        - {file: DomoticsCore-Core/include/DomoticsCore/EventBus.h, lines: [48, 48], text: "block(830)", why: "the reference size the queue budget is built on stays at 830"}
    - lens: edge-cases
      kind: qos-bitfield-truncates
      at:
        - {file: DomoticsCore-MQTT/include/DomoticsCore/MQTT.h, lines: [57, 60], text: "uint8_t qos : 2;", why: "a qos above 3 wraps silently in a 2-bit field"}
    - lens: tests
      kind: no-readback-test
      at:
        - {file: DomoticsCore-MQTT/test/test_mqtt_event_size/test_mqtt_event_size.cpp, lines: [14, 19], text: "TEST_ASSERT_LESS_THAN_UINT32((uint32_t)830, (uint32_t)sizeof(MQTTPublishEvent));", why: "only sizeof is checked: a lost qos or retain after packing passes"}
        - {file: DomoticsCore-MQTT/include/DomoticsCore/MQTT.h, lines: [58, 60], text: "MQTTPublishEvent() : topic{}, payload{}, qos(0), retain(0) {}", why: "the packed fields and new constructor have no test reading them back"}
