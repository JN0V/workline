# planted defect, and a finding the judge refuses.
- finding:
    severity: important
    title: A coupon that does not read is charged without an error
    why: Checkout returns the full price and no error for "SAVEx", which its doc calls an error.
    cause: {path: shop/checkout.go, quote: "if err == nil {"}
    fix: return the error ParseCoupon gives.
