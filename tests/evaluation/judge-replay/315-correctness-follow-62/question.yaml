{"material":"## The finding\n\nimportant: --gardening tends every role's workline branch, not only gardening ones\n\nWhy: The loop skips only branches whose task is not `release` when `--gardening` is off. With the flag on, every open `workline/\u003crole\u003e/\u003ctask\u003e` branch is rebuilt or closed, whichever role opened it. A merge request from another role (an implementer's branch for an issue, say) can be closed with \"main holds its change\" or \"changed the same lines\". The comment on the closing line says \"gardening\", but nothing checks the role or the task.\n\nIts cause, quoted:\n\n```\nif !ok || task != \"release\" \u0026\u0026 !gardening {\n    continue\n}\n```\n\n## The code it stands on\n\nAs it reads at b91b620: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/engine/follow.go, lines 17 to 93: `Follow`, the function the cause lies in\n\n```\n17  // Follow keeps a role's release merge requests (fixElsewhere's, ADR-0017)\n18  // on the tip of base, as a release tool keeps its own branch: run when base\n19  // moves, it rebuilds each open one whose branch base moved under, by\n20  // redoing the branch's change on base's new tip, and force-pushes it — the\n21  // merge request stays the same (ADR-0034). A branch already on base's tip\n22  // is left as it is; one a person committed to is never rebuilt over them;\n23  // one whose change no longer applies is left for a person.\n24  //\n25  // With gardening, run when gardening runs, it tends the roles' other merge\n26  // requests too, one a task (ADR-0006): each base moved under is rebuilt\n27  // the same way, or closed, one comment saying why, when nothing of it is\n28  // left to merge — base holds its change already, base changed the lines it\n29  // changed, or it only records when docs were read. One a person committed\n30  // to is left to them, and named only when it no longer merges (ADR-0034,\n31  // amended).\n32  func Follow(repo, forgeSpec, base string, gardening bool) *Result {\n33  \tres := \u0026Result{Status: verdict.Pass, Applied: []string{}, Refused: []string{}}\n34  \tfail := func(err error) *Result {\n35  \t\tres.Status = verdict.Block\n36  \t\tif errors.Is(err, forge.ErrUnreachable) {\n37  \t\t\tres.Status = verdict.BlockedExternal\n38  \t\t}\n39  \t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"follow-failed\", Message: err.Error()})\n40  \t\treturn res\n41  \t}\n42  \tf, err := forge.Open(forgeSpec, repo)\n43  \tif err != nil {\n44  \t\treturn fail(err)\n45  \t}\n46  \tif f == nil {\n47  \t\treturn fail(errors.New(\"follow needs a forge: \" + forge.Missing))\n48  \t}\n49  \tif base == \"\" {\n50  \t\tif base, err = git(repo, nil, \"symbolic-ref\", \"-q\", \"--short\", \"HEAD\"); err != nil {\n51  \t\t\treturn fail(errors.New(\"on no branch: give the branch the merge requests go into with --base\"))\n52  \t\t}\n53  \t}\n54  \topen, err := f.OpenMergeRequests(\"workline/\")\n55  \tif err != nil {\n56  \t\treturn fail(err)\n57  \t}\n58  \tlocal := forge.KeepsBranches(f)\n59  \tn, rebuilt, closed := 0, 0, 0\n60  \tfor _, branch := range open {\n61  \t\trole, task, ok := strings.Cut(strings.TrimPrefix(branch, \"workline/\"), \"/\")\n62  \t\tif !ok || task != \"release\" \u0026\u0026 !gardening {\n63  \t\t\tcontinue\n64  \t\t}\n65  \t\tn++\n66  \t\tfinding, err := follow(repo, base, branch, role, local, task != \"release\")\n67  \t\tif err != nil {\n68  \t\t\treturn fail(err)\n69  \t\t}\n70  \t\tswitch finding.Rule {\n71  \t\tcase \"\":\n72  \t\t\tcontinue\n73  \t\tcase \"no-longer-applies\":\n74  \t\t\tres.Status = verdict.Human\n75  \t\tcase \"rebuilt\":\n76  \t\t\trebuilt++\n77  \t\tcase \"closed\":\n78  \t\t\t// The forge's own close, its comment saying why; the branch\n79  \t\t\t// stays, for the next run of the task to propose again from.\n80  \t\t\tif err := f.CloseMergeRequest(branch, \"Closed by workline's \"+role+\": \"+finding.Message+\".\", forge.Marker(\"closed\")); err != nil {\n81  \t\t\t\treturn fail(err)\n82  \t\t\t}\n83  \t\t\tclosed++\n84  \t\t}\n85  \t\tres.Findings = append(res.Findings, finding)\n86  \t}\n87  \tif gardening {\n88  \t\tres.Summary = fmt.Sprintf(\"%d merge requests of the roles open, %d rebuilt on %s, %d closed\", n, rebuilt, base, closed)\n89  \t} else {\n90  \t\tres.Summary = fmt.Sprintf(\"%d release merge requests open, %d rebuilt on %s\", n, rebuilt, base)\n91  \t}\n92  \treturn res\n93  }\n```\n\n### internal/role/config.go, lines 17 to 17: `Error`, called by `Follow`\n\n```\n17  func (e *ConfigError) Error() string { return \".workline/config.yaml: \" + e.msg }\n```\n\n### internal/engine/engine.go, lines 2597 to 2606: `git`, called by `Follow`\n\n```\n2597  func git(repo string, stdin io.Reader, args ...string) (string, error) {\n2598  \tcmd := exec.Command(\"git\", append([]string{\"-C\", repo, \"-c\", \"core.quotePath=off\"}, args...)...)\n2599  \tcmd.Stdin = stdin\n2600  \tvar out, errOut strings.Builder\n2601  \tcmd.Stdout, cmd.Stderr = \u0026out, \u0026errOut\n2602  \tif err := cmd.Run(); err != nil {\n2603  \t\treturn \"\", fmt.Errorf(\"git %s: %v: %s\", args[0], err, strings.TrimSpace(errOut.String()))\n2604  \t}\n2605  \treturn strings.TrimSpace(out.String()), nil\n2606  }\n```\n\n### internal/forge/forge.go, lines 292 to 297: `KeepsBranches`, called by `Follow`\n\n```\n292  // KeepsBranches says whether f's merge requests come from local branches:\n293  // nothing is pushed to a remote, nor fetched from one.\n294  func KeepsBranches(f Forge) bool {\n295  \t_, ok := f.(interface{ keepsBranches() })\n296  \treturn ok\n297  }\n```\n\n### internal/engine/follow.go, lines 95 to 181: `follow`, called by `Follow`\n\n```\n95  // follow rebuilds one role's branch on base's tip, and says what it did;\n96  // nothing when the branch is on base's tip already. A gardening task's\n97  // branch with nothing left to merge is said `closed`, for Follow to close.\n98  func follow(repo, base, branch, role string, local, gardening bool) (verdict.Finding, error) {\n99  \tbaseTip, tip, err := tips(repo, base, branch, local)\n100  \tif err != nil || tip == \"\" {\n101  \t\treturn verdict.Finding{}, err\n102  \t}\n103  \tif _, err := git(repo, nil, \"merge-base\", \"--is-ancestor\", baseTip, tip); err == nil {\n104  \t\treturn verdict.Finding{}, nil // on base's tip already\n105  \t}\n106  \t// The forge lists the branches, not where they go: a branch that did not\n107  \t// leave from base's history goes elsewhere, a maintenance branch, and is\n108  \t// never put on base.\n109  \tif first, _ := git(repo, nil, \"rev-list\", \"--reverse\", \"--grep=^\"+OwnTrailer+\": \"+regexp.QuoteMeta(role)+\"$\", baseTip+\"..\"+tip); first != \"\" {\n110  \t\tfirst, _, _ = strings.Cut(first, \"\\n\")\n111  \t\tif _, err := git(repo, nil, \"merge-base\", \"--is-ancestor\", first+\"^\", baseTip); err != nil {\n112  \t\t\treturn verdict.Finding{Rule: \"not-rebuilt\", Level: \"warn\", Where: branch,\n113  \t\t\t\tMessage: fmt.Sprintf(\"it did not leave from %s, so its merge request goes into another branch: not rebuilt on %s\", base, base)}, nil\n114  \t\t}\n115  \t}\n116  \tif who := personsCommit(repo, baseTip, tip, role); who != \"\" {\n117  \t\tif !gardening {\n118  \t\t\treturn verdict.Finding{Rule: \"not-rebuilt\", Level: \"warn\", Where: branch,\n119  \t\t\t\tMessage: fmt.Sprintf(\"%s moved under it, but %s: not rebuilt over it; rebase it by hand, or close it and the next release run proposes the fix again\", base, who)}, nil\n120  \t\t}\n121  \t\t// Theirs now: said only when it no longer merges, as the forge\n122  \t\t// shows it — git's own merge, in memory.\n123  \t\tclash, err := conflicts(repo, baseTip, tip)\n124  \t\tswitch {\n125  \t\tcase err != nil:\n126  \t\t\treturn verdict.Finding{Rule: \"not-rebuilt\", Level: \"warn\", Where: branch,\n127  \t\t\t\tMessage: fmt.Sprintf(\"%s: left to them, neither rebuilt nor closed; whether it is in conflict with %s could not be told: %v\", who, base, err)}, nil\n128  \t\tcase clash:\n129  \t\t\treturn verdict.Finding{Rule: \"not-rebuilt\", Level: \"warn\", Where: branch,\n130  \t\t\t\tMessage: fmt.Sprintf(\"in conflict with %s, and %s: left to them, to rebase or close\", base, who)}, nil\n131  \t\t}\n132  \t\treturn verdict.Finding{}, nil\n133  \t}\n134  \ttree, clashes, err := redo(repo, baseTip, tip)\n135  \tif err != nil {\n136  \t\treturn verdict.Finding{}, err\n137  \t}\n138  \tif len(clashes) \u003e 0 {\n139  \t\tif gardening {\n140  \t\t\treturn verdict.Finding{Rule: \"closed\", Where: branch,\n141  \t\t\t\tMessage: fmt.Sprintf(\"%s changed the same lines of %s since, so its change no longer applies; the next gardening judges the docs again on %s and proposes what is still needed\", base, strings.Join(clashes, \", \"), base)}, nil\n142  \t\t}\n143  \t\treturn verdict.Finding{Rule: \"no-longer-applies\", Where: branch,\n144  \t\t\tMessage: fmt.Sprintf(\"its change no longer applies on %s, which changed the same lines of %s: left as it is, for a person to rebase or close\", base, strings.Join(clashes, \", \"))}, nil\n145  \t}\n146  \tsame, _ := git(repo, nil, \"rev-parse\", baseTip+\"^{tree}\")\n147  \tif tree == same {\n148  \t\tif gardening {\n149  \t\t\treturn verdict.Finding{Rule: \"closed\", Where: branch,\n150  \t\t\t\tMessage: fmt.Sprintf(\"%s holds its change already: nothing is left to merge\", base)}, nil\n151  \t\t}\n152  \t\treturn verdict.Finding{Rule: \"already-on-base\", Level: \"warn\", Where: branch,\n153  \t\t\tMessage: fmt.Sprintf(\"%s holds its change already: nothing left to merge; close it\", base)}, nil\n154  \t}\n155  \tif gardening {\n156  \t\tonly, err := recordOnly(repo, baseTip, tree)\n157  \t\tif err != nil {\n158  \t\t\treturn verdict.Finding{}, err\n159  \t\t}\n160  \t\tif only { // a record waiting on a moved base holds its task's docs back for nothing (#303)\n161  \t\t\treturn verdict.Finding{Rule: \"closed\", Where: branch,\n162  \t\t\t\tMessage: fmt.Sprintf(\"it only records when docs were read (`judged`), and %s moved since; the next gardening judges again those still due\", base)}, nil\n163  \t\t}\n164  \t}\n165  \tcommit, err := recommit(repo, tip, tree, baseTip)\n166  \tif err != nil {\n167  \t\treturn verdict.Finding{}, err\n168  \t}\n169  \tmove := []string{\"push\", \"-q\", \"--force-with-lease=refs/heads/\" + branch + \":\" + tip, \"origin\", commit + \":refs/heads/\" + branch}\n170  \tif local {\n171  \t\tmove = []string{\"update-ref\", \"refs/heads/\" + branch, commit, tip}\n172  \t}\n173  \tif _, err := git(repo, nil, move...); err != nil {\n174  \t\tif local {\n175  \t\t\treturn verdict.Finding{}, err\n176  \t\t}\n177  \t\treturn verdict.Finding{}, fmt.Errorf(\"%w: %v\", forge.ErrUnreachable, err)\n178  \t}\n179  \treturn verdict.Finding{Rule: \"rebuilt\", Where: branch,\n180  \t\tMessage: fmt.Sprintf(\"rebuilt on %s (%s): the same change, its merge request kept\", base, short(baseTip))}, nil\n181  }\n```\n\n### internal/forge/forge.go, lines 299 to 300: `Marker`, called by `Follow`\n\n```\n299  // Marker is the hidden text that makes a comment findable again.\n300  func Marker(key string) string { return \"\u003c!-- workline:\" + key + \" --\u003e\" }\n```\n\n### internal/work/headings.go, lines 109 to 120: `With`, named by the finding\n\n```\n109  // With is the table with written as the heading m is written under, those\n110  // it had still read after it: how a meaning takes a new name.\n111  func (t Table) With(m Meaning, written string) Table {\n112  \tout := make(Table, len(t))\n113  \tfor i, r := range t {\n114  \t\tout[i] = r\n115  \t\tif r.Meaning == m {\n116  \t\t\tout[i].Headings = append([]string{written}, r.Headings...)\n117  \t\t}\n118  \t}\n119  \treturn out\n120  }\n```\n\nNot shown, past 200 lines: `follow