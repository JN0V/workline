fix(lines[i-1], \"diff --git \") \u0026\u0026 !strings.HasPrefix(lines[i-1], \"new file mode\") \u0026\u0026\n206  \t\t\t\t!strings.HasPrefix(lines[i-1], \"deleted file mode\") \u0026\u0026 !strings.HasPrefix(lines[i-1], \"index \")) {\n207  \t\t\tfrom := name(strings.TrimPrefix(l, \"--- \"), \"a/\")\n208  \t\t\tto := name(strings.TrimPrefix(lines[i+1], \"+++ \"), \"b/\")\n209  \t\t\tswitch {\n210  \t\t\tcase from == \"/dev/null\":\n211  \t\t\t\tout = append(out, \"diff --git a/\"+to+\" b/\"+to, \"new file mode 100644\")\n212  \t\t\tcase to == \"/dev/null\":\n213  \t\t\t\tout = append(out, \"diff --git a/\"+from+\" b/\"+from, \"deleted file mode 100644\")\n214  \t\t\tdefault:\n215  \t\t\t\tout = append(out, \"diff --git a/\"+from+\" b/\"+to)\n216  \t\t\t}\n217  \t\t}\n218  \t\tout = append(out, l)\n219  \t}\n220  \treturn mergeOverlapping(strings.Join(out, \"\\n\"))\n221  }\n```\n\n### internal/role/config.go, lines 17 to 17: `Error`, called by `judgeCondense`\n\n```\n17  func (e *ConfigError) Error() string { return \".workline/config.yaml: \" + e.msg }\n```\n\n### internal/builtin/documentalist/judge.go, lines 32 to 88: `parseDiff`, called by `judgeCondense`\n\n```\n32  // parseDiff reads a unified diff as its lines read: a hunk runs to the next\n33  // header, whatever counts its own header announces — agents often get them\n34  // wrong, and the engine applies with git apply --recount, which reads it the\n35  // same way.\n36  func parseDiff(diff string) ([]fileDiff, error) {\n37  \tdiff = intent.NormalizeDiff(diff) // read as git will: overlapping hunks merged\n38  \tlines := strings.Split(strings.TrimSuffix(diff, \"\\n\"), \"\\n\")\n39  \tvar out []fileDiff\n40  \tfor i := 0; i \u003c len(lines); i++ {\n41  \t\tl := lines[i]\n42  \t\tswitch {\n43  \t\tcase strings.HasPrefix(l, \"+++ \"):\n44  \t\t\tp := strings.TrimSpace(strings.TrimPrefix(l, \"+++ \"))\n45  \t\t\tp, _, _ = strings.Cut(p, \"\\t\")\n46  \t\t\tif p == \"/dev/null\" \u0026\u0026 i \u003e 0 \u0026\u0026 strings.HasPrefix(lines[i-1], \"--- \") {\n47  \t\t\t\told, _, _ := strings.Cut(strings.TrimSpace(strings.TrimPrefix(lines[i-1], \"--- \")), \"\\t\")\n48  \t\t\t\tout = append(out, fileDiff{path: strings.TrimPrefix(old, \"a/\"), deleted: true})\n49  \t\t\t\tcontinue\n50  \t\t\t}\n51  \t\t\tout = append(out, fileDiff{path: strings.TrimPrefix(p, \"b/\")})\n52  \t\tcase strings.HasPrefix(l, \"@@\"):\n53  \t\t\tm := hunkHeader.FindStringSubmatch(l)\n54  \t\t\tif m == nil || len(out) == 0 {\n55  \t\t\t\treturn nil, fmt.Errorf(\"line %d: a hunk header must follow a file header, as `@@ -a,b +c,d @@`\", i+1)\n56  \t\t\t}\n57  \t\t\th := hunk{oldStart: atoi(m[1])}\n58  \t\t\tfor ; i+1 \u003c len(lines) \u0026\u0026 !diffHeader(lines, i+1); i++ {\n59  \t\t\t\thl := lines[i+1]\n60  \t\t\t\tif strings.HasPrefix(hl, `\\`) { // \"\\ No newline at end of file\"\n61  \t\t\t\t\tcontinue\n62  \t\t\t\t}\n63  \t\t\t\tif hl == \"\" {\n64  \t\t\t\t\thl = \" \" // a blank context line whose space was trimmed\n65  \t\t\t\t}\n66  \t\t\t\tswitch hl[0] {\n67  \t\t\t\tcase ' ', '-':\n68  \t\t\t\t\th.oldCount++\n69  \t\t\t\tcase '+':\n70  \t\t\t\tdefault:\n71  \t\t\t\t\treturn nil, fmt.Errorf(\"the hunk at line %d holds a line starting with neither ' ', '-' nor '+': %q\", h.oldStart, hl)\n72  \t\t\t\t}\n73  \t\t\t\th.lines = append(h.lines, hl)\n74  \t\t\t}\n75  \t\t\tif h.oldStart == 0 \u0026\u0026 h.oldCount \u003e 0 {\n76  \t\t\t\th.oldStart = 1 // an insertion before the first line, quoting it: git reads it from line 1\n77  \t\t\t}\n78  \t\t\tif h.oldCount == 0 \u0026\u0026 h.oldStart \u003e 0 \u0026\u0026 m[2] != \"0\" {\n79  \t\t\t\treturn nil, fmt.Errorf(\"the hunk at line %d quotes no line of the doc; give context lines\", h.oldStart)\n80  \t\t\t}\n81  \t\t\tout[len(out)-1].hunks = append(out[len(out)-1].hunks, h)\n82  \t\t}\n83  \t}\n84  \tif len(out) == 0 {\n85  \t\treturn nil, fmt.Errorf(\"no file in the diff\")\n86  \t}\n87  \treturn out, nil\n88  }\n```\n\n### internal/builtin/documentalist/condense.go, lines 358 to 378: `applyDoc`, called by `judgeCondense`\n\n```\n358  // applyDoc applies one file of a patch to an existing doc, as git will: the\n359  // lines it cites must be quoted as they are, and it must leave derived blocks\n360  // alone. rule and why say what is wrong, if anything.\n361  func applyDoc(old string, f fileDiff, diff string) (now, rule, why string) {\n362  \tf = placed(old, f)\n363  \tif why := misquoted(old, f); why != \"\" {\n364  \t\treturn \"\", \"misquoted\", why\n365  \t}\n366  \tif touchesDerived(old, f) {\n367  \t\treturn \"\", \"derived-block\", \"the patch changes lines between workline:derive markers; they are regenerated from the code, never written\"\n368  \t}\n369  \tnow = applyHunks(old, f)\n370  \tif byGit, err := gitApplied(f.path, old, diff, false); err != nil || byGit != now {\n371  \t\treturn \"\", \"patch-ambiguous\", \"git would apply this diff differently from how it reads; send a plain unified diff\"\n372  \t}\n373  \t// Moving text gives no source to read: `checked` stays (ADR-0014).\n374  \tif checkedOf(now) != checkedOf(old) {\n375  \t\treturn \"\", \"checked-unread\", \"the patch moves `checked`, but this task gives none of the doc's sources: moving text vouches for nothing, so leave the header as it is\"\n376  \t}\n377  \treturn now, \"\", \"\"\n378  }\n```\n\n### internal/backlog/obsolete.go, lines 44 to 46: `Key`, named by the finding\n\n```\n44  // Key is the evidence an announcement rests on: kept open once, not\n45  // announced again for it.\n46  func (a Announcement) Key() string { return ObsoleteKey(a.Quote) }\n```\n\nNot shown, past 200 lines: `matchAny` (internal/builtin/documentalist/documentalist.go:1874-1881, called by `judgeCondense`); `bornChecked` (internal/builtin/documentalist/condense.go:380-389, called by `judgeCondense`); `docType` (internal/builtin/documentalist/hygiene.go:130-140, called by `judgeCondense`); `normal` (internal/builtin/documentalist/condense.go:414