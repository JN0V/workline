{"material":"## The finding\n\nimportant: movedWhole accepts any new problem fitting a vanished size\n\nWhy: The gone sizes are matched by rule only, and any new section in a created doc of a size at or below a vanished one is excused. A patch can excuse a new, unrelated over-budget section in a created doc as long as one over-budget section of the doc vanished. It does not check that the section is the same one (same content or heading). Also, the \"gone\" map is built from `old` but `stays` is keyed on p.Key, so a section whose key changes by renaming a heading in place counts as gone.\n\nIts cause, quoted:\n\n```\nif p.Size \u003c= size {\n```\n\n## The code it stands on\n\nAs it reads at 5c46147: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/builtin/documentalist/condense.go, lines 316 to 346: the lines around the cause, in `judgeCondense` (lines 155 to 356, longer than judge-lines-max)\n\n```\n316  \t}\n317  \tfor _, p := range old {\n318  \t\tif doc, _, part := strings.Cut(p.Where, \"#\"); part \u0026\u0026 doc == c.Doc \u0026\u0026 !stays[p.Key] {\n319  \t\t\tgone[p.Rule] = append(gone[p.Rule], p.Size)\n320  \t\t}\n321  \t}\n322  \tfor _, sizes := range gone {\n323  \t\tsort.Ints(sizes) // the smallest that holds it first\n324  \t}\n325  \tmovedWhole := func(p Problem) bool {\n326  \t\tdoc, _, part := strings.Cut(p.Where, \"#\")\n327  \t\tif !part || !contains(created, doc) {\n328  \t\t\treturn false\n329  \t\t}\n330  \t\tfor i, size := range gone[p.Rule] {\n331  \t\t\tif p.Size \u003c= size {\n332  \t\t\t\tgone[p.Rule] = append(gone[p.Rule][:i], gone[p.Rule][i+1:]...)\n333  \t\t\t\treturn true\n334  \t\t\t}\n335  \t\t}\n336  \t\treturn false\n337  \t}\n338  \tfor _, p := range found {\n339  \t\tswitch prev, was := old[p.Key]; {\n340  \t\tcase contains(c.Keys, p.Key):\n341  \t\t\trefuse(\"still-over-budget\", p.Where, p.Rule+\": \"+p.Message)\n342  \t\tcase !was \u0026\u0026 movedWhole(p):\n343  \t\tcase !was || p.Size \u003e prev.Size:\n344  \t\t\trefuse(\"patch-introduces\", p.Where, p.Rule+\": \"+p.Message)\n345  \t\t}\n346  \t}\n```\n\n### internal/builtin/documentalist/condense.go, lines 450 to 458: `proposedPatch`, called by `judgeCondense`\n\n```\n450  // proposedPatch says whether the agent proposed a patch of its own.\n451  func proposedPatch(intents, fallback []intent.Intention) bool {\n452  \tfor _, in := range intents {\n453  \t\tif in.Kind == \"patch\" \u0026\u0026 !isFallback(in, fallback) {\n454  \t\t\treturn true\n455  \t\t}\n456  \t}\n457  \treturn false\n458  }\n```\n\n### internal/builtin/documentalist/documentalist.go, lines 1622 to 1653: `loadTree`, called by `judgeCondense`\n\n```\n1622  // loadTree reads the docs the role looks after — the Markdown files matching\n1623  // the docs globs, and the agents' entry points at the root — and lists every\n1624  // tracked file.\n1625  func loadTree(repo string, globs []string) (Tree, error) {\n1626  \tt := Tree{Docs: map[string]string{}, Files: map[string]bool{}}\n1627  \tfiles, err := git(repo, \"ls-files\", \"-z\")\n1628  \tif err != nil {\n1629  \t\treturn t, err\n1630  \t}\n1631  \tfor _, f := range pathList(files) {\n1632  \t\tif f == \"\" {\n1633  \t\t\tcontinue\n1634  \t\t}\n1635  \t\tt.Files[f] = true\n1636  \t\tisAgentFile := false\n1637  \t\tfor _, a := range rootAgentFiles {\n1638  \t\t\tisAgentFile = isAgentFile || f == a\n1639  \t\t}\n1640  \t\tif !isAgentFile \u0026\u0026 (!strings.HasSuffix(f, \".md\") || !matchAny(globs, f)) {\n1641  \t\t\tcontinue\n1642  \t\t}\n1643  \t\tdata, err := os.ReadFile(filepath.Join(repo, f))\n1644  \t\tif os.IsNotExist(err) {\n1645  \t\t\tcontinue // deleted in the working tree\n1646  \t\t}\n1647  \t\tif err != nil {\n1648  \t\t\treturn t, err\n1649  \t\t}\n1650  \t\tt.Docs[f] = 