{"material":"## The finding\n\nimportant: Guard line with exit hides later hand-over\n\nWhy: A line whose first word is `exit` returns false, but a guard such as `[ -n \"$CI\" ] \u0026\u0026 exit 0` starts with `[`, so it is not caught. Conversely, a conditional like `if x; then exit 1; fi` or `foo || exit 1` containing exit is not treated as ending the script. The real problem is the opposite case: a one-line `exit` inside a conditional such as `[ -z \"$X\" ] \u0026\u0026 exit 0` is correctly ignored, but a line like `exit` indented inside an `if` block (for example `if [ -n \"$SKIP\" ]; then` followed by `  exit 0` and `fi`) makes the next line after `fi`, which does run, count as unreachable. The hook is wrongly reported as not handing over to workline.\n\nIts cause, quoted:\n\n```\nif f[0] == \"exit\" {\n\t\t\treturn false // what follows never runs\n\t\t}\n```\n\n## internal/hooks/hooks.go, lines 193 to 223\n\n```\n193  \t}\n194  \tlines := strings.Split(string(data), \"\\n\")\n195  \tif len(lines) \u003e 1 \u0026\u0026 strings.HasPrefix(lines[1], \"# workline hook dispatcher\") {\n196  \t\treturn true\n197  \t}\n198  \tunquote := func(w string) string { return strings.Trim(w, `\"';`) }\n199  \tglobal := \"\"\n200  \tif p.Hooks != \"\" {\n201  \t\tglobal = filepath.Join(p.Hooks, name)\n202  \t}\n203  \tfor _, line := range lines {\n204  \t\tf := strings.Fields(line)\n205  \t\tif len(f) == 0 || strings.HasPrefix(f[0], \"#\") {\n206  \t\t\tcontinue\n207  \t\t}\n208  \t\tif f[0] == \"exit\" {\n209  \t\t\treturn false // what follows never runs\n210  \t\t}\n211  \t\tfor i, w := range f {\n212  \t\t\tif strings.HasPrefix(w, \"#\") {\n213  \t\t\t\tbreak\n214  \t\t\t}\n215  \t\t\tif !commandAt(f, i) {\n216  \t\t\t\tcontinue\n217  \t\t\t}\n218  \t\t\tw = unquote(w)\n219  \t\t\tif global != \"\" \u0026\u0026 filepath.Clean(w) == global {\n220  \t\t\t\treturn true\n221  \t\t\t}\n222  \t\t\tif filepath.Base(w) == \"workline\" \u0026\u0026 i+2 \u003c len(f) \u0026\u0026 f[i+1] == \"hook\" \u0026\u0026 unquote(f[i+2]) == name {\n223  \t\t\t\treturn true\n```\n\n## What the change did to internal/hooks/hooks.go\n\n```diff\ndiff --git a/internal/hooks/hooks.go b/internal/hooks/hooks.go\nindex 6547320..f4ab9c7 100644\n--- a/internal/hooks/hooks.go\n+++ b/internal/hooks/hooks.go\n@@ -174,6 +174,73 @@ func InstallRepo(repo, bin string) (string, error) {\n \treturn msg, nil\n }\n \n+// HandsOver says whether git, running the hook name from dir, reaches\n+// workline: the file is executable and is workline's dispatcher, or runs\n+// `workline hook \u003cname\u003e` or workline's global hook of that name as a\n+// command, before any line that exits. A comment, an echo or a line after\n+// `exit` is not a hand-over.\n+func HandsOver(dir, name string, p Paths) bool {\n+\tpath := filepath.Join(dir, name)\n+\tif fi, err := os.Stat(path); err != nil || fi.IsDir() || fi.Mode()\u00260o111 == 0 {\n+\t\treturn false // git skips a hook it cannot execute\n+\t}\n+\tif p.Hooks != \"\" \u0026\u0026 filepath.Clean(dir) == filepath.Clean(p.Hooks) {\n+\t\treturn true\n+\t}\n+\tdata, err := os.ReadFile(path)\n+\tif err != nil {\n+\t\treturn false\n+\t}\n+\tlines := strings.Split(string(data), \"\\n\")\n+\tif len(lines) \u003e 1 \u0026\u0026 strings.HasPrefix(lines[1], \"# workline hook dispatcher\") {\n+\t\treturn true\n+\t}\n+\tunquote := func(w string) string { return strings.Trim(w, `\"';`) }\n+\tglobal := \"\"\n+\tif p.Hooks != \"\" {\n+\t\tglobal = filepath.Join(p.Hooks, name)\n+\t}\n+\tfor _, line := range lines {\n+\t\tf := strings.Fields(line)\n+\t\tif len(f) == 0 || strings.HasPrefix(f[0], \"#\") {\n+\t\t\tcontinue\n+\t\t}\n+\t\tif f[0] == \"exit\" {\n+\t\t\treturn false // what follows never runs\n+\t\t}\n+\t\tfor i, w := range f {\n+\t\t\tif strings.HasPrefix(w, \"#\") {\n+\t\t\t\tbreak\n+\t\t\t}\n+\t\t\tif !commandAt(f, i) {\n+\t\t\t\tcontinue\n+\t\t\t}\n+\t\t\tw = unquote(w)\n+\t\t\tif global != \"\" \u0026\u0026 filepath.Clean(w) == global {\n+\t\t\t\treturn true\n+\t\t\t}\n+\t\t\tif filepath.Base(w) == \"workline\" \u0026\u0026 i+2 \u003c len(f) \u0026\u0026 f[i+1] == \"hook\" \u0026\u0026 unquote(f[i+2]) == name {\n+\t\t\t\treturn true\n+\t\t\t}\n+\t\t}\n+\t}\n+\treturn false\n+}\n+\n+// commandAt says whether the i-th word of a shell line stands where a\n+// command is run, not as an argument (`echo workline hook …`).\n+func commandAt(f []string, i int) bool {\n+\tif i == 0 {\n+\t\treturn true\n+\t}\n+\tswitch prev := f[i-1]; prev {\n+\tcase \"exec\", \"command\", \"npx\", \"\u0026\u0026\", \"||\", \"then\", \"do\", \"!\", \"if\", \"else\":\n+\t\treturn true\n+\tdefault:\n+\t\treturn strings.HasSuffix(prev, \";\")\n+\t}\n+}\n+\n func writeDispatchers(dir, bin, next string) error {\n \tif err := os.MkdirAll(dir, 0o755); err != nil {\n \t\treturn err\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}