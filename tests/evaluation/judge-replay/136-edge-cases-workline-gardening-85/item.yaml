evidence: "ci/github/workline-gardening.yml:67-68 `workline route ... > line.json || status=$?` then `echo \"status=$status\" >> \"$GITHUB_OUTPUT\"` — the output is written before anything in the step can fail; line 85-90 `status=${{ steps.line.outputs.status }} ... exit \"$status\"`: with an empty value bash's `exit \"\"` says 'numeric argument required' and exits 2 (checked) — An empty status is not reachable (the only command that can fail before the echo is guarded by `|| status=$?`; a cancelled step skips Verdict, which has no `if: always()`), and even then the step would fail, not pass. The interpolation is of a self-produced `$?` integer."
