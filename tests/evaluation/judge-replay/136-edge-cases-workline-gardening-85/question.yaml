{"material":"## The finding\n\nimportant: Verdict step interpolates status into shell, empty status passes\n\nWhy: In the gardening verdict step, if the \"line\" step fails before writing status (for example when the job aborts earlier), the interpolated status is empty, so `[ \"$status\" = 3 ]` is false and `exit \"\"` is run. In bash, `exit \"\"` fails with a numeric argument required error rather than meaning success or failure of the line. The failure then comes from an obscure shell error and not from a stated status.\n\nIts cause, quoted:\n\n```\nstatus=${{ steps.line.outputs.status }}\n```\n\n## ci/github/workline-gardening.yml, lines 70 to 100\n\n```\n70            report=$(jq -r '\"\\(.status) — \\(.summary)\",\n71              ((.steps // [])[] | select(.result.calls) | .name as $n | .result.calls[] |\n72                \"- agent, \\($n): \\(.model // .asked // \"?\") \\(.[\"tokens-in\"] // 0) tokens in, \\(.[\"tokens-out\"] // 0) out\"),\n73              ((.steps // [])[] | .name as $n | (.result.notes // [])[] | \"- note from the agent, \\($n): \\(split(\"\\n\")[0])\"),\n74              ((.findings // [])[] | (.message // \"\" | split(\"\\n\")) as $l |\n75                \"- \\(.rule) \\(.where // \"\"): \\($l[0])\\(if ($l | length) \u003e 1 and ($l[-1] | startswith(\"(\")) then \" \" + $l[-1] else \"\" end)\")' line.json)\n76            echo \"$report\"\n77            { echo \"### workline gardening ($ai)\"; echo; echo \"$report\"; } \u003e\u003e \"$GITHUB_STEP_SUMMARY\"\n78  \n79        - uses: actions/upload-artifact@v4\n80          if: steps.line.outputs.proposed == 'true'\n81          with: {name: workline-runs, path: \"line.json\\n.workline-runs\", include-hidden-files: true}\n82  \n83        - name: Verdict\n84          run: |\n85            status=${{ steps.line.outputs.status }}\n86            if [ \"$status\" = 3 ]; then\n87              echo \"::warning title=workline::the agent could not be reached; the docs are listed in the summary, for a person\"\n88              exit 0\n89            fi\n90            exit \"$status\"\n91  \n92    apply:\n93      needs: judge\n94      if: always() \u0026\u0026 needs.judge.outputs.proposed == 'true'\n95      runs-on: ubuntu-latest\n96      # issues: the product owner's acts (comments, closings, milestones) and\n97      # its report issue.\n98      permissions: {contents: write, pull-requests: write, issues: write}\n99      steps:\n100        - id: app\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}