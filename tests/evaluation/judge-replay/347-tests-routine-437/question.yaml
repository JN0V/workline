ncase: merge/cmd-normal-routine-merges-alone\nabout: \"With `forge: cmd:\u003ccommand\u003e` (#322): at `normal`, workline's own records merge request, opened by a bot, unlabelled, its head's verdict passed: the policy asks the command to note it (`comment`, the merge recorded), to hold the yes on its head (`accept`) and to turn auto-merge on (`auto-merge`), as on GitHub and GitLab — no operation beyond those `cautious` uses (ADR-0042, amended).\"\ngiven:\n  repo: documented\n  config:\n    forge: 'cmd:sh \"$FIXTURES/forges/merging-routine.sh\"'\n    merge: {autonomy: normal}\n  setup:\n    - \"git init -q --bare ../origin.git \u0026\u0026 git remote add origin ../origin.git \u0026\u0026 git push -q origin main\"\n    - \"git checkout -qb workline/documentalist/suspect \u0026\u0026 sed -i '/^checked:/a judged: 1a2b3c4' docs/tech/auth.md \u0026\u0026 git commit -qam 'docs: record the docs judged' -m 'Workline-Role: documentalist' \u0026\u0026 git push -q origin workline/documentalist/suspect \u0026\u0026 git checkout -q main\"\nrun: {follow: [--base, main]}\nexpect:\n  status: pass\n  findings: [{rule: auto-merge-on, where: \"#9\", message: \"with no person's yes, workline's own records\"}]\n  files:\n    .git/forge-requests.jsonl: {contains: ['\"operation\":\"comment\"', 'workline:merge-alone=records', '\"operation\":\"accept\"', '\"ok\":true', '\"operation\":\"auto-merge\"', '\"on\":true']}\n```\n\nNot shown, past 300 lines: internal/engine/routine_test.go, docs/spec/role-contract.md, tests/conformance/cases/merge/gitlab-normal-routine-merges-alone.yaml, tests/conformance/cases/merge/normal-routine-merges-alone.yaml. A test in them may exercise it.\n","question":"Is this finding about the tests true: is the behaviour it names left without a test that would fail were it wrong? Judge from the tests shown, not from whether the code is right. Answer yes when no test shown reaches the code the finding quotes, when the one that does asserts nothing of that behaviour, or when it would pass either way. Answer no, naming the test, if a test exercises it and would fail without it; no too if the change needs no test (a rename, a message) or if the finding only guesses."}