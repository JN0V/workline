{"material":"## The finding\n\nimportant: History read failure path has no test\n\nWhy: The change makes a failed read of the deeper history abort the run with an error, instead of silently using an empty list. No test or conformance case drives commits() failing, so reverting this to the old swallow would pass every test.\n\nIts cause, quoted:\n\n```\nif deepErr != nil {\n\t\t\treturn nil, fmt.Errorf(\"the base's history, for what a revert undoes: %w\", deepErr)\n\t\t}\n```\n\n## The code it stands on\n\nAs it reads at 9077b5b: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/engine/routine.go, lines 406 to 502: `demotions`, the function the cause lies in\n\n```\n406  // demotions reads which kinds of workline's routine merge requests wait for\n407  // a person's yes again. A revert on base of one merged with no person's yes\n408  // — the base's last revertWindow commits read, each revert once — demotes\n409  // its kind: an issue opened, kept open until a person closes it, and the\n410  // merge request told. It returns each kind demoted and the issue that\n411  // keeps it.\n412  func demotions(f forge.Forge, o FollowOptions, baseTip string, res *Result) (map[string]string, error) {\n413  \tb, ok := f.(forge.Backlog)\n414  \tif !ok {\n415  \t\treturn nil, nil\n416  \t}\n417  \t// Every parent: a revert merged with a merge commit is on its second.\n418  \thistory, err := commits(o.Repo, baseTip, revertWindow)\n419  \tif err != nil {\n420  \t\treturn nil, err\n421  \t}\n422  \tvar deeper []logged // what a revert may name, read once if needed\n423  \tvar deepErr error\n424  \tdemoted := map[string]string{}\n425  \tfor i, r := range history {\n426  \t\tolder := func() []logged {\n427  \t\t\tif deeper == nil \u0026\u0026 deepErr == nil {\n428  \t\t\t\tdeeper, deepErr = commits(o.Repo, baseTip, mergeWindow)\n429  \t\t\t}\n430  \t\t\tat := slices.IndexFunc(deeper, func(c logged) bool { return c.sha == r.sha })\n431  \t\t\tif at \u003c 0 {\n432  \t\t\t\treturn history[i+1:]\n433  \t\t\t}\n434  \t\t\treturn deeper[at+1:]\n435  \t\t}\n436  \t\tn, revert := revertOf(o.Repo, r, older)\n437  \t\tif deepErr != nil {\n438  \t\t\treturn nil, fmt.Errorf(\"the base's history, for what a revert undoes: %w\", deepErr)\n439  \t\t}\n440  \t\tsha, msg := r.sha, r.msg\n441  \t\tif revert \u0026\u0026 n == 0 {\n442  \t\t\t// Said, never taken for a revert of nothing workline merged.\n443  \t\t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"revert-unread\", Where: short(sha),\n444  \t\t\t\tMessage: fmt.Sprintf(\"`%s` reverts something no merge request in the base's last %d commits is: if it undid one merged with no person's yes, its kind is not sent back to a person's yes\", firstSentence(msg), mergeWindow)})\n445  \t\t}\n446  \t\tif n == 0 {\n447  \t\t\tcontinue\n448  \t\t}\n449  \t\tt := forge.Target{Kind: \"merge-request\", ID: n}\n450  \t\tnotes, err := b.Notes(t)\n451  \t\tswitch {\n452  \t\tcase errors.Is(err, forge.ErrUnreachable) \u0026\u0026 !forge.Refused(err):\n453  \t\t\treturn nil, err\n454  \t\tcase err != nil:\n455  \t\t\tcontinue // no merge request of that number here\n456  \t\t}\n457  \t\tself := forge.Self(f)\n458  \t\tkind, alone := ownNote(notes, \"merge-alone=\", self)\n459  \t\tif !alone || !slices.Contains(RoutineKinds, kind) {\n460  \t\t\tcontinue\n461  \t\t}\n462  \t\tif _, read := ownNote(notes, \"merge-demoted=\"+sha, self); read {\n463  \t\t\tcontinue // read already: its issue opened, closed since or not\n464  \t\t}\n465  \t\twhere, subject := forge.MergeRef(f, n), firstSentence(msg)\n466  \t\tbody := fmt.Sprintf(\"**%s merged with no person's yes, and was reverted** by %s, `%s`. Its kind, %s — %s —, now waits for a person's yes, the label `workline:accepted`, on each merge request, as at `cautious`.\\n\\n**To let workline merge its %s merge requests alone again, close this issue.** Leave it open while you are not sure.\",\n467  \t\t\twhere, short(sha), subject, kind, kindSays[kind], kind)\n468  \t\tid, err := f.OpenIssue(demotedTitle(kind), body, forge.Marker(\"merge-demoted=\"+sha))\n469  \t\tif err != nil {\n470  \t\t\tif errors.Is(err, forge.ErrUnreachable) \u0026\u0026 !forge.Refused(err) {\n471  \t\t\t\treturn nil, err\n472  \t\t\t}\n473  \t\t\t// Held in this run all the same; read again at the next.\n474  \t\t\tdemoted[kind] = where + \" reverted\"\n475  \t\t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"demotion-unrecorded\", Level: \"warn\", Where: where,\n476  \t\t\t\tMessage: fmt.Sprintf(\"merged with no person's yes, reverted by %s: workline's %s merge requests wait for a person's yes in this run, but the issue that keeps it could not be opened: %s\", short(sha), kind, forge.Said(err))})\n477  \t\t\tcontinue\n478  \t\t}\n479  \t\t// Held from this run, whether the forge lists the issue yet or not.\n480  \t\tissue := fmt.Sprintf(\"#%d\", id)\n481  \t\tdemoted[kind] = issue\n482  \t\tif err := f.Comment(t, fmt.Sprintf(\"**Reverted** by %s: workline's %s merge requests wait for a person's yes again, until a person closes %s.\", short(sha), kind, issue),\n483  \t\t\tforge.Marker(\"merge-demoted=\"+sha)); err != nil {\n484  \t\t\treturn nil, err\n485  \t\t}\n486  \t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"merge-demoted\", Level: \"warn\", Where: where,\n487  \t\t\tMessage: fmt.Sprintf(\"merged with no person's yes, reverted by %s, `%s`: workline's %s merge requests wait for a person's yes again, until a person closes %s\", short(sha), subject, kind, issue)})\n488  \t}\n489  \topen, err := b.Issues()\n490  \tif err != nil {\n491  \t\treturn nil, err\n492  \t}\n493  \tfor _, is := range open {\n494  \t\tfor _, kind := range RoutineKinds {\n495  \t\t\t// The engine's: its title, and its marker in the body.\n496  \t\t\tif is.Title == demotedTitle(kind) \u0026\u0026 strings.Contains(is.Body, \"\u003c!-- workline:merge-demoted=\") \u0026\u0026 demoted[kind] == \"\" {\n497  \t\t\t\tdemoted[kind] = fmt.Sprintf(\"#%d\", is.ID)\n498  \t\t\t}\n499  \t\t}\n500  \t}\n501  \treturn demoted, nil\n502  }\n```\n\n### internal/engine/routine.go, lines 53 to 68: `commits`, named by the finding\n\n```\n53  // commits are the last n commits of tip's history, every parent, newest\n54  // first, with their messages: a commit before its parents, whatever their\n55  // dates.\n56  func commits(repo, tip string, n int) ([]logged, error) {\n57  \tout, err := git(repo, nil, \"log\", \"--topo-order\", \"-n\", strconv.Itoa(n), \"--format=%H%x1f%B%x1e\", tip)\n58  \tif err != nil {\n59  \t\treturn nil, err\n60  \t}\n61  \tvar all []logged\n62  \tfor _, rec := range strings.Split(out, \"\\x1e\") {\n63  \t\tif sha, msg, ok := strings.Cut(strings.TrimSpace(rec), \"\\x1f\"); ok {\n64  \t\t\tall = append(all, logged{sha, msg})\n65  \t\t}\n66  \t}\n67  \treturn all, nil\n68  }\n```\n\n### internal/engine/routine.go, lines 283 to 332: `revertOf`, called by `demotions`\n\n```\n283  // revertOf is the merge request commit r reverts, 0 when it names none\n284  // found, and whether r is a revert at all. Named in its message — git's\n285  // words naming the commit reverted, GitLab's or GitHub's naming the merge\n286  // request —, else found by the title it quotes: GitHub's own revert says\n287  // only `Revert \"\u003ctitle\u003e\"`. Among the merges with that title in older, the\n288  // commits older than r, newest first, the one r undoes exactly — the same\n289  // change, inverted — is taken, else the newest.\n290  func revertOf(repo string, r logged, older func() []logged) (int, bool) {\n291  \tsubject, _, _ := strings.Cut(r.msg, \"\\n\")\n292  \tif !revertSubject.MatchString(subject) \u0026\u0026 !strings.Contains(r.msg, \"This reverts \") \u0026\u0026 !revertsPull.MatchString(r.msg) {\n293  \t\treturn 0, false\n294  \t}\n295  \tfor _, re := range []*regexp.Regexp{revertsRequest, revertsPull} {\n296  \t\tif m := re.FindStringSubmatch(r.msg); m != nil {\n297  \t\t\tn, _ := strconv.Atoi(m[1])\n298  \t\t\treturn n, true\n299  \t\t}\n300  \t}\n301  \tif m := revertsCommit.FindStringSubmatch(r.msg); m != nil {\n302  \t\tif was, err := git(repo, nil, \"log\", \"-1\", \"--format=%B\", m[1]); err == nil {\n303  \t\t\tif n, _ := requestOf(was); n \u003e 0 {\n304  \t\t\t\treturn n, true\n305  \t\t\t}\n306  \t\t}\n307  \t}\n308  \tm := revertSubject.FindStringSubmatch(subject)\n309  \tif m == nil {\n310  \t\treturn 0, true\n311  \t}\n312  \tif n, _ := requestOf(m[1]); n \u003e 0 {\n313  \t\treturn n, true // `Revert \"\u003ctitle\u003e (#N)\"`\n314  \t}\n315  \tundone, first := \"\", 0\n316  \tfor _, c := range older() {\n317  \t\tn, title := requestOf(c.msg)\n318  \t\tif n == 0 || title != m[1] {\n319  \t\t\tcontinue\n320  \t\t}\n321  \t\tif undone == \"\" {\n322  \t\t\tundone = patchID(repo, r.sha, r.sha+\"^\")\n323  \t\t}\n324  \t\tif undone != \"\" \u0026\u0026 patchID(repo, c.sha+\"^1\", c.sha) == undone {\n325  \t\t\treturn n, true\n326  \t\t}\n327  \t\tif first == 0 {\n328  \t\t\tfirst = n\n329  \t\t}\n330  \t}\n331  \treturn first, true\n332  }\n```\n\n### internal/engine/follow.go, lines 630 to 635: `short`, called by `demotions`\n\n```\n630  func short(commit string) string {\n631  \tif len(commit) \u003e 7 {\n632  \t\treturn commit[:7]\n633  \t}\n634  \treturn commit\n635  }\n```\n\n### internal/engine/merge.go, lines 69 to 78: `short`, called by `demotions`\n\n```\n69  // short says why the review of a head that passed falls short, \"\" when it\n70  // does not.\n71  func (v *HeadVerdict) short() string {\n72  \tfor _, f := range v.Findings {\n73  \t\tif slices.Contains(shortReview, f.Rule) {\n74  \t\t\treturn fmt.Sprintf(\"its review falls short (%s): %s\", f.Rule, firstSentence(f.Message))\n75  \t\t}\n76  \t}\n77  \treturn \"\"\n78  }\n```\n\n### internal/engine/merge.go, lines 125 to 128: `firstSentence`, called by `demotions`\n\n```\n125  func firstSentence(s string) string {\n126  \ts, _, _ = strings.Cut(s, \"\\n\")\n127  \treturn s\n128  }\n```\n\n### internal/forge/merge.go, lines 96 to 98: `Refused`, called by `demotions`\n\n```\n96  // Refused says whether err is the forge refusing a request — a token that\n97  // may not, a request it does not take — rather than not answering.\n98  func Refused(err error) bool { return refusal(err) }\n```\n\n### internal/forge/merge.go, lines 133 to 143: `Self`, called by `demotions`\n\n```\n133  // Self is who f's token writes as — on GitHub the App's bot, else the\n134  // token's user —, \"\" when the forge does not say: a merge request it\n135  // opened is workline's own, as one a bot opened (ADR-0042, `normal`).\n136  func Self(f any) string {\n137  \tif s, ok := f.(interface{ self() (string, error) }); ok {\n138  \t\tif who, err := s.self(); err == nil {\n139  \t\t\treturn who\n140  \t\t}\n141  \t}\n142  \treturn \"\"\n143  }\n```\n\n### internal/forge/forge.go, lines 332 to 333: `Marker`, called by `demotions`\n\n```\n332  // Marker is the hidden text that makes a comment findable again.\n333  func Marker(key string) string { return \"\u003c!-- workline:\" + key + \" --\u003e\" }\n```\n\nNot shown, past 200 lines: `ownNote` (internal/engine/routine.go:388-404, called by `demotions`); `MergeRef` (internal/forge/merge.go:106-112, called by `demotions`); `demotedTitle` (internal/engine/routine.go:383-386, called by `demotions`); `Said` (internal/forge/merge.go:100-104, called by `demotions`); `Said` (internal/scale/scale.go:344-351, called by `demotions`); `mergePolicy` (internal/engine/merge.go:408-547, calls `demotions`). What would prove or refute the finding may lie in them.\n\nNot shown, defined in too many places to tell which: `Notes` (5 definitions), `OpenIssue` (5 definitions), `Comment` (6 definitions), `Issues` (5 definitions).\n\n## What the change did to internal/engine/routine.go, near the cause\n\n```diff\ndiff --git a/internal/engine/routine.go b/internal/engine/routine.go\nnew file mode 100644\nindex 0000000..aaf4ef5\n--- /dev/null\n+++ b/internal/engine/routine.go\n@@ -0,0 +1,525 @@\n+package engine\n+\n+import (\n+\t\"errors\"\n+\t\"fmt\"\n+\t\"regexp\"\n+\t\"slices\"\n+\t\"strconv\"\n+\t\"strings\"\n+\n+\t\"github.com/JN0V/workline/internal/backlog\"\n+\t\"github.com/JN0V/workline/internal/forge\"\n+\t\"github.com/JN0V/workline/internal/verdict\"\n+)\n+\n+// The merge policy's `normal` level (ADR-0042, amended): workline's own\n+// routine merge requests merge with no person's yes — every commit\n+// workline's own, checked by its tree, the line passed on the head with\n+// every agent's review whole. Each such merge is recorded on the merge\n+// request; a revert of one sends its kind back to a person's yes\n+// (ADR-0026), in an issue a person closes to restore it.\n+\n+// MergeNormal is the merge policy's level where workline's own routine\n+// merge requests need no person's yes (role.MergeLevels).\n+const MergeNormal = \"normal\"\n+\n+// The kinds of workline's routine merge requests, told by what their change\n+// is, never by their branch's name nor a trailer: the higher wins.\n+const (\n+\tkindRecords = \"records\" // only the lines recording when docs were read\n+\tkindDerived = \"derived\" // derived blocks regenerated, and records\n+\tkindDocs    = \"docs\"    // doc pages a role wrote\n+)\n+\n+// RoutineKinds are the kinds, from the narrowest.\n+var RoutineKinds = []string{kindRecords, kindDerived, kindDocs}\n+\n+// kindSays says what a kind's change is, for a person.\n+var kindSays = map[string]string{\n+\tkindRecords: \"it only records when docs were read\",\n+\tkindDerived: \"it regenerates derived blocks\",\n+\tkindDocs:    \"it changes doc pages a role wrote\",\n+}\n+\n+// revertWindow is how many commits of the base's history, from its tip,\n+// are read for reverts: each is read once, its demotion kept in an issue;\n+// mergeWindow, how many for the merge a revert quoting a title undoes.\n+const (\n+\trevertWindow = 100\n+\tmergeWindow  = 1000\n+)\n+\n+// commits are the last n commits of tip's history, every parent, newest\n+// first, with their messages: a commit before its parents, whatever their\n+// dates.\n+func commits(repo, tip string, n int) ([]logged, error) {\n+\tout, err := git(repo, nil, \"log\", \"--topo-order\", \"-n\", strconv.Itoa(n), \"--format=%H%x1f%B%x1e\", tip)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tvar all []logged\n+\tfor _, rec := range strings.Split(out, \"\\x1e\") {\n+\t\tif sha, msg, ok := strings.Cut(strings.TrimSpace(rec), \"\\x1f\"); ok {\n+\t\t\tall = append(all, logged{sha, msg})\n+\t\t}\n+\t}\n+\treturn all, nil\n+}\n+\n+// routineCandidate says whether a merge request may be workline's own\n+// routine one, at `normal`: from a role's branch of this repository\n+// (`workline/\u003crole\u003e/\u003ctask\u003e`), opened by workline — a bot, or the user\n+// `follow`'s token writes as —, not a release tool's. Its commits, its\n+// kind and its head's verdict are weighed after (weighRoutine).\n+func routineCandidate(f forge.Forge, o FollowOptions, mr forge.MergeRequest) bool {\n+\trole, task, ok := strings.Cut(strings.TrimPrefix(mr.Branch, \"workline/\"), \"/\")\n+\tswitch {\n+\tcase o.Merge != MergeNormal, !mr.Here, !strings.HasPrefix(mr.Branch, \"workline/\"), !ok, role == \"\", task == \"\":\n+\t\treturn false\n+\tcase o.Release != nil \u0026\u0026 o.Release(mr.Branch):\n+\t\treturn false\n+\t}\n+\treturn mr.Bot || mr.Author != \"\" \u0026\u0026 mr.Author == forge.Self(f)\n+}\n+\n+// notOwn names the first commit of the branch, past base, that is not\n+// workline's own as OwnCommit tells it — by its tree, never its trailer\n+// alone —; \"\" when every one is.\n+func notOwn(repo, baseTip, tip string) (string, error) {\n+\tout, err := git(repo, nil, \"rev-list\", \"--reverse\", baseTip+\"..\"+tip)\n+\tif err != nil {\n+\t\treturn \"\", err\n+\t}\n+\tfor _, c := range strings.Fields(out) {\n+\t\tif OwnCommit(repo, c, baseTip) == \"\" {\n+\t\t\treturn commitSaid(repo, c), nil\n+\t\t}\n+\t}\n+\treturn \"\", nil\n+}\n+\n+// routineKind is the kind of the branch's change since it left base:\n+// records when it changes only the lines recording when docs were read,\n+// derived when it changes derived blocks besides, docs else.\n+func routineKind(repo, baseTip, tip string) (string, error) {\n+\tfrom, err := git(repo, nil, \"merge-base\", baseTip, tip)\n+\tif err != nil {\n+\t\treturn \"\", err\n+\t}\n+\tchanges, err := git(repo, nil, \"diff\", \"--name-status\", \"--no-renames\", \"-z\", from, tip)\n+\tif err != nil {\n+\t\treturn \"\", err\n+\t}\n+\tkind := kindRecords\n+\tparts := strings.Split(strings.TrimSuffix(changes, \"\\x00\"), \"\\x00\")\n+\tfor i := 0; i+1 \u003c len(parts); i += 2 {\n+\t\tif parts[i] != \"M\" {\n+\t\t\treturn kindDocs, nil\n+\t\t}\n+\t\twas, ok1 := blob(repo, from, parts[i+1])\n+\t\tnow, ok2 := blob(repo, tip, parts[i+1])\n+\t\tif !ok1 || !ok2 {\n+\t\t\treturn \"\", fmt.Errorf(\"%s, changed on the branch, could not be read at %s and %s\", parts[i+1], short(from), short(tip))\n+\t\t}\n+\t\tswitch {\n+\t\tcase unrecorded(was) == unrecorded(now):\n+\t\tcase underived(unrecorded(was)) == underived(unrecorded(now)):\n+\t\t\tkind = kindDerived\n+\t\tdefault:\n+\t\t\treturn kindDocs, nil\n+\t\t}\n+\t}\n+\treturn kind, nil\n+}\n+\n+// underived is a doc with its derived blocks emptied.\n+func underived(doc string) string {\n+\treturn derived.ReplaceAllString(doc, \"\u003c!-- workline:derive $1 --\u003e\u003c!-- workline:end --\u003e\")\n+}\n+\n+// weighed is a merge request as weigh read it, and how it acts on it.\n+type weighed struct {\n+\tmr           forge.MergeRequest\n+\tst           forge.MergeState\n+\tbaseTip, tip string\n+\te            *inLine\n+\tsay          func(rule, level, msg string)\n+\ttakeBack     func(why string) error\n+}\n+\n+// weighRoutine weighs one of workline's own merge requests no person said\n+// yes to, at `normal`, and does what the policy says of it: auto-merge on\n+// and the yes held on its head with no person's yes, the merge recorded on\n+// it; or why it waits for a person's. It returns it when it is in line.\n+func weighRoutine(f forge.Forge, m forge.Merger, o FollowOptions, w weighed, demoted map[string]string, hand map[string]kept) (*inLine, error) {\n+\tmr, st, tip, e := w.mr, w.st, w.tip, w.e\n+\tours := st.AutoMerge \u0026\u0026 st.AutoMergeBot\n+\tif st.Draft {\n+\t\tif ours {\n+\t\t\tif err := w.takeBack(\"marked a draft\"); err != nil {\n+\t\t\t\treturn nil, err\n+\t\t\t}\n+\t\t\tw.say(\"draft\", \"\", \"workline's own, marked a draft: auto-merge turned off, until a person labels it `workline:accepted`\")\n+\t\t\treturn nil, nil\n+\t\t}\n+\t\tw.say(\"draft\", \"\", \"workline's own, but a draft: nothing turned on\")\n+\t\treturn nil, nil\n+\t}\n+\twho, err := notOwn(o.Repo, w.baseTip, tip)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tif who != \"\" {\n+\t\tif ours {\n+\t\t\tif err := w.takeBack(who + \" is not workline's own: put the label to accept it\"); err != nil {\n+\t\t\t\treturn nil, err\n+\t\t\t}\n+\t\t}\n+\t\tw.say(\"waits-for-a-yes\", \"\", fmt.Sprintf(\"from workline's branch, but %s is not workline's own: it waits for a person's yes, the label `workline:accepted`\", who))\n+\t\treturn nil, nil\n+\t}\n+\tkind, err := routineKind(o.Repo, w.baseTip, tip)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tif issue, ok := demoted[kind]; ok {\n+\t\tif ours {\n+\t\t\tif err := w.takeBack(kind + \" waits for a person's yes since a revert: put the label to accept it\"); err != nil {\n+\t\t\t\treturn nil, err\n+\t\t\t}\n+\t\t}\n+\t\tw.say(\"waits-for-a-yes\", \"warn\", fmt.Sprintf(\"workline's own %s (%s), but its %s merge requests wait for a person's yes since one was reverted (%s): the label `workline:accepted`\", kind, kindSays[kind], kind, issue))\n+\t\treturn nil, nil\n+\t}\n\n(cut)\n```\n\n## The tests that touch internal/engine/routine.go\n\nThe test files in internal/engine/ and those naming `routine`, as they read at 9077b5b.\n\n### internal/engine/engine_test.go\n\n```\npackage engine\n\nimport \"testing\"\n\nfunc TestAskAgain(t *testing.T) {\n\tfor _, c := range []struct {\n\t\tpromoteAfter int\n\t\twant         string // tier of each attempt after the first, until it stops\n\t}{\n\t\t{0, \"\"},\n\t\t{1, \"standard\"},\n\t\t{2, \"light standard\"},\n\t\t{3, \"light light standard\"},\n\t} {\n\t\tgot, tier := \"\", \"light\"\n\t\tfor failures := 1; ; failures++ {\n\t\t\tretry, next := askAgain(failures, c.promoteAfter, tier)\n\t\t\tif !retry {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\ttier = next\n\t\t\tgot += \" \" + tier\n\t\t}\n\t\tif got != \" \"+c.want \u0026\u0026 !(c.want == \"\" \u0026\u0026 got == \"\") {\n\t\t\tt.Errorf(\"promote-after %d: attempts after the first on %q, want %q\", c.promoteAfter, got, c.want)\n\t\t}\n\t}\n}\n\n// An answer broken in one claim is read claim by claim; a claim holding\n// code pasted with its tabs, or a text cut by ` #`, is mended as the whole\n// answer would be (agent.Mend), never counted as unreadable.\nfunc TestClaimsOneByOneMended(t *testing.T) {\n\tanswer := \"- claim:\\n    quote: |\\n\\tif ok {\\n    why: covered by #20 too\\n\" +\n\t\t\"- claim: {quote: \\\"a\\\"\\n\" +\n\t\t\"- claim:\\n    quote: |\\n        x\\n}\\n\" + // a line at the start of the line: the item broken, not cut\n\t\t\"- claim:\\n    why: see #3 below\\n```\\nThat is all.\\n\"\n\tread, broken, mended := claimsOneByOne(answer)\n\tif read != 2 || len(broken) != 2 || len(mended) != 2 || mended[1][0] != '2' {\n\t\tt.Fatalf(\"read %d, broken %v, mended %q\", read, broken, mended)\n\t}\n\tclaims := claimsRead(answer)\n\tc := claims[0].Value.(map[string]any)\n\tif c[\"quote\"] != \"\\tif ok {\\n\" || c[\"why\"] != \"covered by #20 too\" {\n\t\tt.Errorf(\"the claim was not read as written: %q\", c)\n\t}\n\tif c := claims[1].Value.(map[string]any); c[\"why\"] != \"see #3 below\" {\n\t\tt.Errorf(\"the claim before the fence was not read as written: %q\", c)\n\t}\n\tif b := broken[1].Value.(map[string]any)[\"unreadable\"]; b != \"- claim:\\n    quote: |\\n        x\\n}\" {\n\t\tt.Errorf(\"the broken claim is not kept whole: %q\", b)\n\t}\n\t// A line saying no count is said as it is.\n\tif got := mendedTogether([]string{\"2 blocks\", \"a block\", \"1 text\", \"1 blocks\", \"a block\"}); len(got) != 3 || got[0] != \"3 blocks\" || got[1] != \"a block\" {\n\t\tt.Errorf(\"mended together: %q\", got)\n\t}\n}\n\nfunc TestOverBudgetSummary(t *testing.T) {\n\tconst head = \"the task was over the role's context budget and nobody judged it: a person does\"\n\tif got := overBudgetSummary(\"\"); got != head {\n\t\tt.Errorf(\"empty: got %q\", got)\n\t}\n\tif got := overBudgetSummary(\"docs to check\"); got != head+\" (docs to check)\" {\n\t\tt.Errorf(\"said: got %q\", got)\n\t}\n}\n```\n\n### internal/engine/follow_test.go\n\n```\npackage engine\n\nimport (\n\t\"errors\"\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"strings\"\n\t\"testing\"\n)\n\n// A gardening branch a person committed to, main moved under it: named\n// when git finds a conflict; when git cannot tell, said as such\n// (`conflict-unread`), never as a conflict it may not be; left without a\n// word when it merges.\nfunc TestFollowAPersonsBranch(t *testing.T) {\n\trepo := t.TempDir()\n\trun := func(args ...string) {\n\t\tt.Helper()\n\t\tcmd := exec.Command(\"git\", append([]string{\"-C\", repo, \"-c\", \"core.hooksPath=/dev/null\", \"-c\", \"user.name=T\", \"-c\", \"user.email=t@example.invalid\"}, args...)...)\n\t\tif out, err := cmd.CombinedOutput(); err != nil {\n\t\t\tt.Fatalf(\"git %v: %s\", args, out)\n\t\t}\n\t}\n\twrite := func(p, s string) {\n\t\tif err := os.WriteFile(filepath.Join(repo, p), []byte(s), 0o644); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\trun(\"init\", \"-q\", \"-b\", \"main\