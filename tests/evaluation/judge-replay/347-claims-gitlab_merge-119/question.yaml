{"material":"## The finding\n\nimportant: GitLab pushers are read only inside a window and may be empty\n\nWhy: GitLab push events are queried only from a week before the merge request was opened. A person's push to the branch before that is never seen. The result is a non-nil empty slice when no event matches, for example when events are missing or expired. `weighRoutine` accepts an empty list because its check is a loop over nothing. So \"every push by the App\" is not verified, and a branch a person pushed to earlier can merge alone.\n\nIts cause, quoted:\n\n```\nwho := []string{}\n```\n\nThe author's claim it contradicts, quoted from what they said:\n\n\u003e every push to its branch made by the App, as the forge names the pusher (GitHub's repository activity, GitLab's push events)\n\n## The code it stands on\n\nAs it reads at 0518025: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/forge/gitlab_merge.go, lines 97 to 126: `pushers`, the function the cause lies in\n\n```\n97  // pushers are who pushed to branch, oldest first, as the project's push\n98  // events name them, from a week before the merge request was opened:\n99  // workline's own branch is pushed as its merge request is opened.\n100  func (g *gitlab) pushers(branch, opened string) ([]string, error) {\n101  \tq := \"projects/:id/events?action=pushed\u0026per_page=100\"\n102  \tif t, err := time.Parse(time.RFC3339, opened); err == nil {\n103  \t\tq += \"\u0026after=\" + t.AddDate(0, 0, -7).Format(\"2006-01-02\")\n104  \t}\n105  \tout, err := g.api(\"--paginate\", q)\n106  \tif err != nil {\n107  \t\treturn nil, err\n108  \t}\n109  \tevents, err := pages[struct {\n110  \t\tAuthor string `json:\"author_username\"`\n111  \t\tPush   struct {\n112  \t\t\tRef     string `json:\"ref\"`\n113  \t\t\tRefType string `json:\"ref_type\"`\n114  \t\t} `json:\"push_data\"`\n115  \t}](out)\n116  \tif err != nil {\n117  \t\treturn nil, err\n118  \t}\n119  \twho := []string{}\n120  \tfor i := len(events) - 1; i \u003e= 0; i-- { // newest first: oldest first\n121  \t\tif e := events[i]; e.Push.RefType == \"branch\" \u0026\u0026 e.Push.Ref == branch {\n122  \t\t\twho = append(who, e.Author)\n123  \t\t}\n124  \t}\n125  \treturn who, nil\n126  }\n```\n\n### internal/engine/routine.go, lines 303 to 437: `weighRoutine`, the function the symptom lies in\n\n```\n303  // weighRoutine weighs one of workline's own merge requests no person said\n304  // yes to, at `normal`, and does what the policy says of it: auto-merge on\n305  // and the yes held on its head with no person's yes, the merge recorded on\n306  // it; or why it waits for a person's. It returns it when it is in line.\n307  func weighRoutine(f forge.Forge, m forge.Merger, o FollowOptions, w weighed, n *normal, hand map[string]kept) (*inLine, error) {\n308  \tmr, st, tip, e := w.mr, w.st, w.tip, w.e\n309  \tours := st.AutoMerge \u0026\u0026 st.AutoMergeBot\n310  \twaits := func(level, why string) (*inLine, error) {\n311  \t\tif ours {\n312  \t\t\tif err := w.takeBack(why + \": put the label to accept it\"); err != nil {\n313  \t\t\t\treturn nil, err\n314  \t\t\t}\n315  \t\t}\n316  \t\tw.say(\"waits-for-a-yes\", level, why+\": it waits for a person's yes, the label `workline:accepted`\")\n317  \t\treturn nil, nil\n318  \t}\n319  \tif st.Draft {\n320  \t\tif ours {\n321  \t\t\tif err := w.takeBack(\"marked a draft\"); err != nil {\n322  \t\t\t\treturn nil, err\n323  \t\t\t}\n324  \t\t\tw.say(\"draft\", \"\", \"workline's own, marked a draft: auto-merge turned off, until a person labels it `workline:accepted`\")\n325  \t\t\treturn nil, nil\n326  \t\t}\n327  \t\tw.say(\"draft\", \"\", \"workline's own, but a draft: nothing turned on\")\n328  \t\treturn nil, nil\n329  \t}\n330  \t// Who pushed, as the forge says: a commit says anything of itself.\n331  \tif st.Pushers == nil {\n332  \t\treturn waits(\"\", \"opened by workline, but who pushed to its branch the forge does not say\")\n333  \t}\n334  \tfor _, p := range st.Pushers {\n335  \t\tif p != n.app {\n336  \t\t\twho := \"a hand the forge does not name\"\n337  \t\t\tif p != \"\" {\n338  \t\t\t\twho = \"@\" + p\n339  \t\t\t}\n340  \t\t\treturn waits(\"\", fmt.Sprintf(\"opened by workline, but %s pushed to its branch\", who))\n341  \t\t}\n342  \t}\n343  \twho, err := notOwn(o.Repo, w.baseTip, tip, n.committer)\n344  \tif err != nil {\n345  \t\treturn nil, err\n346  \t}\n347  \tif who != \"\" {\n348  \t\treturn waits(\"\", fmt.Sprintf(\"from workline's branch, but %s is not workline's own\", who))\n349  \t}\n350  \tpage, err := notAllowed(o.Repo, w.baseTip, tip, o.IsDoc, n.steers)\n351  \tif err != nil {\n352  \t\treturn nil, err\n353  \t}\n354  \tif page != \"\" {\n355  \t\treturn waits(\"\", \"workline's own, but it changes \"+page)\n356  \t}\n357  \tkind, err := routineKind(o.Repo, w.baseTip, tip, func(docs []string) bool { return regenerates(o, tip, docs) })\n358  \tif err != nil {\n359  \t\treturn nil, err\n360  \t}\n361  \tissue, held := n.demoted[kind]\n362  \tif all, ok := n.demoted[kindAll]; ok \u0026\u0026 !held {\n363  \t\tissue, held = all, true\n364  \t}\n365  \tif held {\n366  \t\treturn waits(\"warn\", fmt.Sprintf(\"workline's own %s (%s), but its %s merge requests wait for a person's yes since a revert (%s)\", kind, kindSays[kind], kind, issue))\n367  \t}\n368  \tif !st.AutoMerge \u0026\u0026 st.AutoMergeAt != \"\" {\n369  \t\t// The veto by turning auto-merge off: it stays off until a person's\n370  \t\t// yes, as at `cautious`.\n371  \t\tif err := m.Accept(tip, false, \"auto-merge turned off since it was turned on: put the label to accept it\"); err != nil {\n372  \t\t\treturn nil, err\n373  \t\t}\n374  \t\tw.say(\"vetoed\", \"\", fmt.Sprintf(\"workline's own %s, its auto-merge turned off since it was turned on: left off until a person labels it `workline:accepted`\", kind))\n375  \t\treturn nil, nil\n376  \t}\n377  \tif st.ChecksUnread != \"\" {\n378  \t\tw.say(\"checks-unread\", \"warn\", \"its head's checks could not be read, only the line's verdict counts: \"+st.ChecksUnread)\n379  \t}\n380  \tif st.Checks == \"failure\" {\n381  \t\tw.say(\"checks-red\", \"warn\", fmt.Sprintf(\"workline's own %s, but a check failed on its head (%s): out of line, the next one comes up\", kind, short(tip)))\n382  \t\treturn nil, nil\n383  \t}\n384  \tv, err := verdictOf(m, hand, tip)\n385  \tif err != nil {\n386  \t\tif errors.Is(err, forge.ErrUnreachable) \u0026\u0026 !forge.Refused(err) {\n387  \t\t\treturn nil, err\n388  \t\t}\n389  \t\tw.say(\"verdict-unread\", \"warn\", fmt.Sprintf(\"workline's own %s; its head's verdict could not be read: %s\", kind, forge.Said(err)))\n390  \t\treturn nil, nil\n391  \t}\n392  \tswitch v.class {\n393  \tcase \"\":\n394  \t\tw.say(\"verdict-missing\", \"\", fmt.Sprintf(\"workline's own %s; no verdict of the line on its head (%s) yet: it waits for it, the next one comes up meanwhile\", kind, short(tip)))\n395  \t\treturn e, nil\n396  \tcase verdictHeld, verdictRed, verdictShort:\n397  \t\t// Held by the yes not given on this head (the status Accepted;\n398  \t\t// GitLab, the head's pipeline red): auto-merge left as it is, for\n399  \t\t// the next head the line passes.\n400  \t\trule := map[string]string{verdictHeld: \"verdict-red\", verdictRed: \"verdict-red\", verdictShort: \"review-short\"}[v.class]\n401  \t\tif err := m.Accept(tip, false, v.why); err != nil {\n402  \t\t\treturn nil, err\n403  \t\t}\n404  \t\tw.say(rule, \"warn\", fmt.Sprintf(\"workline's own %s, but %s: no yes on its head, out of line\", kind, v.why))\n405  \t\treturn nil, nil\n406  \t}\n407  \twhy := fmt.Sprintf(\"workline's own %s — %s —, opened and pushed by its App, every commit its own; its head's verdict passed, every agent's review whole\", kind, kindSays[kind])\n408  \tif err := m.Accept(tip, true, \"with no person's yes: \"+why); err != nil {\n409  \t\treturn nil, err\n410  \t}\n411  \tif st.AutoMerge {\n412  \t\te.ready = true\n413  \t\treturn e, nil\n414  \t}\n415  \t// The record, where a person sees it and the engine finds it again\n416  \t// when a revert names this merge request.\n417  \tt := forge.Target{Kind: \"merge-request\", ID: mr.ID}\n418  \tbody := fmt.Sprintf(\"**Merging with no person's yes**: the project's merge policy is `normal`, and this is workline's own %s: %s. Opened and pushed by workline's App, every commit its own, and the line passed on its head (%s), every agent's review whole. To hold it, mark it a draft or turn auto-merge off. Reverted, workline's %s merge requests wait for a person's yes again.\",\n419  \t\tkind, kindSays[kind], short(tip), kind)\n420  \tif err := f.Comment(t, body, forge.Marker(\"merge-alone=\"+kind)); err != nil {\n421  \t\treturn nil, err\n422  \t}\n423  \tmerged, err := m.AutoMerge(mr, tip, true)\n424  \tswitch {\n425  \tcase errors.Is(err, forge.ErrUnreachable) \u0026\u0026 !forge.Refused(err):\n426  \t\treturn nil, err\n427  \tcase err != nil:\n428  \t\tw.say(\"auto-merge-refused\", \"warn\", fmt.Sprintf(\"workline's own %s, its head's verdict passed, but the forge refused to turn auto-merge on: %s\", kind, forge.Said(err)))\n429  \t\treturn nil, nil\n430  \tcase merged:\n431  \t\tw.say(\"merged-at-once\", \"\", fmt.Sprintf(\"with no person's yes, %s: merged at once, the forge's rules met already\", why))\n432  \t\treturn nil, nil\n433  \t}\n434  \tw.say(\"auto-merge-on\", \"\", fmt.Sprintf(\"with no person's yes, %s: auto-merge turned on, the forge merges it once its checks pass\", why))\n435  \te.ready = true\n436  \treturn e, nil\n437  }\n```\n\n### internal/forge/merge.go, lines 137 to 149: `App`, named by the finding\n\n```\n137  // App is the bot workline's token writes as — GitHub's App\n138  // (WORKLINE_APP), GitLab's project bot —, and the name its jobs commit\n139  // with; \"\" when the token is a person's, or the forge does not say. Only\n140  // what it opened, pushed and committed is workline's own work at\n141  // `normal` (ADR-0042): a person's token is the one agents use too.\n142  func App(f any) (login, committer string, err error) {\n143  \tif a, ok := f.(interface {\n144  \t\tapp() (string, string, error)\n145  \t}); ok {\n146  \t\treturn a.app()\n147  \t}\n148  \treturn \"\", \"\", nil\n149  }\n```\n\n### internal/forge/github.go, lines 27 to 29: `api`, called by `pushers`\n\n```\n27  func (g *github) api(args ...string) ([]byte, error) {\n28  \treturn run(g.repo, \"gh\", append([]string{\"api\"}, args...)...)\n29  }\n```\n\n### internal/forge/gitlab.go, lines 268 to 279: `pages`, called by `pushers`\n\n```\n268  // pages decodes the arrays a paginated call prints, one a page.\n269  func pages[T any](out []byte) ([]T, error) {\n270  \tvar all []T\n271  \tfor dec := json.NewDecoder(bytes.NewReader(out)); dec.More(); {\n272  \t\tvar page []T\n273  \t\tif err := dec.Decode(\u0026page); err != nil {\n274  \t\t\treturn nil, fmt.Errorf(\"%w: unexpected answer: %v\", ErrUnreachable, err)\n275  \t\t}\n276  \t\tall = append(all, page...)\n277  \t}\n278  \treturn all, nil\n279  }\n```\n\nNot shown, past 200 lines: `Parse` (internal/agent/agent.go:74-110, called by `pushers`); `api` (internal/forge/gitlab.go:122-194, called by `pushers`); `MergeState` (internal/forge/command.go:273-281, calls `pushers`); `MergeState` (internal/forge/gitlab_merge.go:16-95, calls `pushers`). What would prove or refute the finding may lie in them.\n\n## What the change did to internal/forge/gitlab_merge.go, near the cause\n\n```diff\ndiff --git a/internal/forge/gitlab_merge.go b/internal/forge/gitlab_merge.go\nindex 8c93cfd..9a59781 100644\n--- a/internal/forge/gitlab_merge.go\n+++ b/internal/forge/gitlab_merge.go\n@@ -67,6 +69,11 @@ func (g *gitlab) MergeState(mr MergeRequest) (MergeState, error) {\n \tfor i := len(versions) - 1; i \u003e= 0; i-- { // newest first: oldest first\n \t\tst.Pushes = append(st.Pushes, Push{Head: versions[i].Head, At: versions[i].At})\n \t}\n+\tif mr.Here {\n+\t\tif st.Pushers, err = g.pushers(mr.Branch, v.Created); err != nil {\n+\t\t\treturn MergeState{}, err\n+\t\t}\n+\t}\n \tout, err = g.api(\"--paginate\", path(t)+\"/notes?sort=asc\u0026order_by=created_at\u0026per_page=100\")\n \tif err != nil {\n \t\treturn MergeState{}, err\n@@ -87,6 +94,37 @@ func (g *gitlab) MergeState(mr MergeRequest) (MergeState, error) {\n \treturn st, nil\n }\n \n+// pushers are who pushed to branch, oldest first, as the project's push\n+// events name them, from a week before the merge request was opened:\n+// workline's own branch is pushed as its merge request is opened.\n+func (g *gitlab) pushers(branch, opened string) ([]string, error) {\n+\tq := \"projects/:id/events?action=pushed\u0026per_page=100\"\n+\tif t, err := time.Parse(time.RFC3339, opened); err == nil {\n+\t\tq += \"\u0026after=\" + t.AddDate(0, 0, -7).Format(\"2006-01-02\")\n+\t}\n+\tout, err := g.api(\"--paginate\", q)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tevents, err := pages[struct {\n+\t\tAuthor string `json:\"author_username\"`\n+\t\tPush   struct {\n+\t\t\tRef     string `json:\"ref\"`\n+\t\t\tRefType string `json:\"ref_type\"`\n+\t\t} `json:\"push_data\"`\n+\t}](out)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\twho := []string{}\n+\tfor i := len(events) - 1; i \u003e= 0; i-- { // newest first: oldest first\n+\t\tif e := events[i]; e.Push.RefType == \"branch\" \u0026\u0026 e.Push.Ref == branch {\n+\t\t\twho = append(who, e.Author)\n+\t\t}\n+\t}\n+\treturn who, nil\n+}\n+\n // pipelineStatus reads a GitLab pipeline's status as the merge policy sums\n // checks up: success, pending, failure; \"\" for one manual or skipped.\n func pipelineStatus(status string) string {\n```\n\n(2 hunks further from the cause not shown.)\n","question":"Is this finding about the author's claim true: does the code 