evidence: "internal/forge/gitlab_merge.go:100-104 pushers: events read with `after=<opened - 7 days>` only; line 118 `who := []string{}` returns an empty, non-nil list when no push event matches. internal/engine/routine.go:331-343 waits only on `st.Pushers == nil`; an empty list passes the \"every push by the App\" check. — PR claims \"every push to its branch made by the App, as the forge names the pusher (…GitLab's push events)\". On GitHub (github_merge.go:115) Pushers stays nil when the activity lists none, so the MR waits; on GitLab a push outside the window, or none listed, reads as \"all by the App\". The commit-level check (notOwn) still runs, which bounds the damage."
