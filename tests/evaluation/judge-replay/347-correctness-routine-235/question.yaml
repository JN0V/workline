{"material":"## The finding\n\nimportant: Draft with own auto-merge on is skipped at start\n\nWhy: In mergePolicy a candidate with auto-merge on enters weigh, but a pull request labelled by nobody whose auto-merge was turned on by a person is handled as a yes with AutoMergeBy. A routine pull request whose auto-merge a person turned on is then treated as accepted by that person, bypassing routine checks, which is intended; but when routine and AutoMergeBot, the 'ours' path never re-checks notOwn before the verdict if st.AutoMerge is already on, only takes back on failure; ok. However the final 'if st.AutoMerge { e.ready = true }' returns ready without verifying kind record exists.\n\nIts cause, quoted:\n\n```\nif st.AutoMerge {\n\t\te.ready = true\n\t\treturn e, nil\n\t}\n```\n\n## The code it stands on\n\nAs it reads at 0a3a5d3: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/engine/routine.go, lines 148 to 261: `weighRoutine`, the function the cause lies in\n\n```\n148  // weighRoutine weighs one of workline's own merge requests no person said\n149  // yes to, at `normal`, and does what the policy says of it: auto-merge on\n150  // and the yes held on its head with no person's yes, the merge recorded on\n151  // it; or why it waits for a person's. It returns it when it is in line.\n152  func weighRoutine(f forge.Forge, m forge.Merger, o FollowOptions, w weighed, demoted map[string]string, hand map[string]kept) (*inLine, error) {\n153  \tmr, st, tip, e := w.mr, w.st, w.tip, w.e\n154  \tours := st.AutoMerge \u0026\u0026 st.AutoMergeBot\n155  \tif st.Draft {\n156  \t\tif ours {\n157  \t\t\tif err := w.takeBack(\"marked a draft\"); err != nil {\n158  \t\t\t\treturn nil, err\n159  \t\t\t}\n160  \t\t\tw.say(\"draft\", \"\", \"workline's own, marked a draft: auto-merge turned off, until a person labels it `workline:accepted`\")\n161  \t\t\treturn nil, nil\n162  \t\t}\n163  \t\tw.say(\"draft\", \"\", \"workline's own, but a draft: nothing turned on\")\n164  \t\treturn nil, nil\n165  \t}\n166  \twho, err := notOwn(o.Repo, w.baseTip, tip)\n167  \tif err != nil {\n168  \t\treturn nil, err\n169  \t}\n170  \tif who != \"\" {\n171  \t\tif ours {\n172  \t\t\tif err := w.takeBack(who + \" is not workline's own: put the label to accept it\"); err != nil {\n173  \t\t\t\treturn nil, err\n174  \t\t\t}\n175  \t\t}\n176  \t\tw.say(\"waits-for-a-yes\", \"\", fmt.Sprintf(\"from workline's branch, but %s is not workline's own: it waits for a person's yes, the label `workline:accepted`\", who))\n177  \t\treturn nil, nil\n178  \t}\n179  \tkind, err := routineKind(o.Repo, w.baseTip, tip)\n180  \tif err != nil {\n181  \t\treturn nil, err\n182  \t}\n183  \tif issue, ok := demoted[kind]; ok {\n184  \t\tif ours {\n185  \t\t\tif err := w.takeBack(kind + \" waits for a person's yes since a revert: put the label to accept it\"); err != nil {\n186  \t\t\t\treturn nil, err\n187  \t\t\t}\n188  \t\t}\n189  \t\tw.say(\"waits-for-a-yes\", \"warn\", fmt.Sprintf(\"workline's own %s (%s), but its %s merge requests wait for a person's yes since one was reverted (%s): the label `workline:accepted`\", kind, kindSays[kind], kind, issue))\n190  \t\treturn nil, nil\n191  \t}\n192  \tif !st.AutoMerge \u0026\u0026 st.AutoMergeAt != \"\" {\n193  \t\t// The veto by turning auto-merge off: it stays off until a person's\n194  \t\t// yes, as at `cautious`.\n195  \t\tif err := m.Accept(tip, false, \"auto-merge turned off since it was turned on: put the label to accept it\"); err != nil {\n196  \t\t\treturn nil, err\n197  \t\t}\n198  \t\tw.say(\"vetoed\", \"\", fmt.Sprintf(\"workline's own %s, its auto-merge turned off since it was turned on: left off until a person labels it `workline:accepted`\", kind))\n199  \t\treturn nil, nil\n200  \t}\n201  \tif st.ChecksUnread != \"\" {\n202  \t\tw.say(\"checks-unread\", \"warn\", \"its head's checks could not be read, only the line's verdict counts: \"+st.ChecksUnread)\n203  \t}\n204  \tif st.Checks == \"failure\" {\n205  \t\tw.say(\"checks-red\", \"warn\", fmt.Sprintf(\"workline's own %s, but a check failed on its head (%s): out of line, the next one comes up\", kind, short(tip)))\n206  \t\treturn nil, nil\n207  \t}\n208  \tv, err := verdictOf(m, hand, tip)\n209  \tif err != nil {\n210  \t\tif errors.Is(err, forge.ErrUnreachable) \u0026\u0026 !forge.Refused(err) {\n211  \t\t\treturn nil, err\n212  \t\t}\n213  \t\tw.say(\"verdict-unread\", \"warn\", fmt.Sprintf(\"workline's own %s; its head's verdict could not be read: %s\", kind, forge.Said(err)))\n214  \t\treturn nil, nil\n215  \t}\n216  \tswitch v.class {\n217  \tcase \"\":\n218  \t\tw.say(\"verdict-missing\", \"\", fmt.Sprintf(\"workline's own %s; no verdict of the line on its head (%s) yet: it waits for it, the next one comes up meanwhile\", kind, short(tip)))\n219  \t\treturn e, nil\n220  \tcase verdictHeld, verdictRed, verdictShort:\n221  \t\t// Held by the yes not given on this head (the status Accepted;\n222  \t\t// GitLab, the head's pipeline red): auto-merge left as it is, for\n223  \t\t// the next head the line passes.\n224  \t\trule := map[string]string{verdictHeld: \"verdict-red\", verdictRed: \"verdict-red\", verdictShort: \"review-short\"}[v.class]\n225  \t\tif err := m.Accept(tip, false, v.why); err != nil {\n226  \t\t\treturn nil, err\n227  \t\t}\n228  \t\tw.say(rule, \"warn\", fmt.Sprintf(\"workline's own %s, but %s: no yes on its head, out of line\", kind, v.why))\n229  \t\treturn nil, nil\n230  \t}\n231  \twhy := fmt.Sprintf(\"workline's own %s — %s —, every commit workline's own, checked by its tree; its head's verdict passed, every agent's review whole\", kind, kindSays[kind])\n232  \tif err := m.Accept(tip, true, \"with no person's yes: \"+why); err != nil {\n233  \t\treturn nil, err\n234  \t}\n235  \tif st.AutoMerge {\n236  \t\te.ready = true\n237  \t\treturn e, nil\n238  \t}\n239  \t// The record, where a person sees it and the engine finds it again\n240  \t// when a revert names this merge request.\n241  \tt := forge.Target{Kind: \"merge-request\", ID: mr.ID}\n242  \tbody := fmt.Sprintf(\"**Merging with no person's yes**: the project's merge policy is `normal`, and this is workline's own %s: %s. Every commit is workline's own, checked by its tree, and the line passed on its head (%s), every agent's review whole. To hold it, mark it a draft or turn auto-merge off. Reverted, workline's %s merge requests wait for a person's yes again.\",\n243  \t\tkind, kindSays[kind], short(tip), kind)\n244  \tif err := f.Comment(t, body, forge.Marker(\"merge-alone=\"+kind)); err != nil {\n245  \t\treturn nil, err\n246  \t}\n247  \tmerged, err := m.AutoMerge(mr, tip, true)\n248  \tswitch {\n249  \tcase errors.Is(err, forge.ErrUnreachable) \u0026\u0026 !forge.Refused(err):\n250  \t\treturn nil, err\n251  \tcase err != nil:\n252  \t\tw.say(\"auto-merge-refused\", \"warn\", fmt.Sprintf(\"workline's own %s, its head's verdict passed, but the forge refused to turn auto-merge on: %s\", kind, forge.Said(err)))\n253  \t\treturn nil, nil\n254  \tcase merged:\n255  \t\tw.say(\"merged-at-once\", \"\", fmt.Sprintf(\"with no person's yes, %s: merged at once, the forge's rules met already\", why))\n256  \t\treturn nil, nil\n257  \t}\n258  \tw.say(\"auto-merge-on\", \"\", fmt.Sprintf(\"with no person's yes, %s: auto-merge turned on, the forge merges it once its checks pass\", why))\n259  \te.ready = true\n260  \treturn e, nil\n261  }\n```\n\n### internal/engine/routine.go, lines 86 to 100: `notOwn`, named by the finding\n\n```\n86  // notOwn names the first commit of the branch, past base, that is not\n87  // workline's own as OwnCommit tells it — by its tree, never its trailer\n88  // alone —; \"\" when every one is.\n89  func notOwn(repo, baseTip, tip string) (string, error) {\n90  \tout, err := git(repo, nil, \"rev-list\", \"--reverse\", baseTip+\"..\"+tip)\n91  \tif err != nil {\n92  \t\treturn \"\", err\n93  \t}\n94  \tfor _, c := range strings.Fields(out) {\n95  \t\tif OwnCommit(repo, c, baseTip) == \"\" {\n96  \t\t\treturn commitSaid(repo, c), nil\n97  \t\t}\n98  \t}\n99  \treturn \"\", nil\n100  }\n```\n\n### internal/engine/routine.go, lines 102 to 131: `routineKind`, called by `weighRoutine`\n\n```\n102  // routineKind is the kind of the branch's change since it left base:\n103  // records when it changes only the lines recording when docs were read,\n104  // derived when it changes derived blocks besides, docs else.\n105  func routineKind(repo, baseTip, tip string) (string, error) {\n106  \tfrom, err := git(repo, nil, \"merge-base\", baseTip, tip)\n107  \tif err != nil {\n108  \t\treturn \"\", err\n109  \t}\n110  \tchanges, err := git(repo, nil, \"diff\", \"--name-status\", \"--no-renames\", \"-z\", from, tip)\n111  \tif err != nil {\n112  \t\treturn \"\", err\n113  \t}\n114  \tkind := kindRecords\n115  \tparts := strings.Split(strings.TrimSuffix(changes, \"\\x00\"), \"\\x00\")\n116  \tfor i := 0; i+1 \u003c len(parts); i += 2 {\n117  \t\tif parts[i] != \"M\" {\n118  \t\t\treturn kindDocs, nil\n119  \t\t}\n120  \t\twas, _ := blob(repo, from, parts[i+1])\n121  \t\tnow, _ := blob(repo, tip, parts[i+1])\n122  \t\tswitch {\n123  \t\tcase unrecorded(was) == unrecorded(now):\n124  \t\tcase underived(unrecorded(was)) == underived(unrecorded(now)):\n125  \t\t\tkind = kindDerived\n126  \t\tdefault:\n127  \t\t\treturn kindDocs, nil\n128  \t\t}\n129  \t}\n130  \treturn kind, nil\n131  }\n```\n\n### internal/engine/follow.go, lines 630 to 635: `short`, called by `weighRoutine`\n\n```\n630  func short(commit string) string {\n631  \tif len(commit) \u003e 7 {\n632  \t\treturn commit[:7]\n633  \t}\n634  \treturn commit\n635  }\n```\n\n### internal/engine/merge.go, lines 69 to 78: `short`, called by `weighRoutine`\n\n```\n69  // short says why the review of