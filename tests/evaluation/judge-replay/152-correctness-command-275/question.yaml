{"material":"## The finding\n\nimportant: Ticks error from command forge is swallowed, treated as no ticks\n\nWhy: For a command forge, any non-unreachable error from ticks is turned into nil, nil. A failure is then indistinguishable from \"forge does not say\", and also the returned a.Ticks is dropped on error. Acceptable as intended, but the returned value on ErrUnreachable passes partial data along with the error.\n\nIts cause, quoted:\n\n```\nif err != nil \u0026\u0026 !errors.Is(err, ErrUnreachable) {\n\t\treturn nil, nil\n\t}\n```\n\n## internal/forge/command.go, lines 260 to 280\n\n```\n260  \tvar a struct {\n261  \t\tNative bool `json:\"native\"`\n262  \t}\n263  \terr := c.call(\"add-sub-issue\", map[string]any{\"parent\": parent, \"child\": child}, \u0026a)\n264  \treturn a.Native, err\n265  }\n266  \n267  // Ticks reads the answer to ticks: the boxes ticked in the issue's body,\n268  // each {item, done, author, insider, bot} (docs/spec/forge-command.md); a\n269  // forge that refuses the operation does not say who ticked: nil.\n270  func (c *command) Ticks(id int) ([]Tick, error) {\n271  \tvar a struct {\n272  \t\tTicks []Tick `json:\"ticks\"`\n273  \t}\n274  \terr := c.call(\"ticks\", map[string]any{\"id\": id}, \u0026a)\n275  \tif err != nil \u0026\u0026 !errors.Is(err, ErrUnreachable) {\n276  \t\treturn nil, nil\n277  \t}\n278  \treturn a.Ticks, err\n279  }\n280  \n```\n\n## What the change did to internal/forge/command.go\n\n```diff\ndiff --git a/internal/forge/command.go b/internal/forge/command.go\nindex a94e487..467efa7 100644\n--- a/internal/forge/command.go\n+++ b/internal/forge/command.go\n@@ -263,3 +263,17 @@ func (c *command) AddSubIssue(parent, child int) (bool, error) {\n \terr := c.call(\"add-sub-issue\", map[string]any{\"parent\": parent, \"child\": child}, \u0026a)\n \treturn a.Native, err\n }\n+\n+// Ticks reads the answer to ticks: the boxes ticked in the issue's body,\n+// each {item, done, author, insider, bot} (docs/spec/forge-command.md); a\n+// forge that refuses the operation does not say who ticked: nil.\n+func (c *command) Ticks(id int) ([]Tick, error) {\n+\tvar a struct {\n+\t\tTicks []Tick `json:\"ticks\"`\n+\t}\n+\terr := c.call(\"ticks\", map[string]any{\"id\": id}, \u0026a)\n+\tif err != nil \u0026\u0026 !errors.Is(err, ErrUnreachable) {\n+\t\treturn nil, nil\n+\t}\n+\treturn a.Ticks, err\n+}\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}