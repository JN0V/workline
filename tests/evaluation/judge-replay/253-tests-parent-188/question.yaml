{"material":"## The finding\n\nimportant: ReadEvidence test-proof branches untested\n\nWhy: The new paths in ReadEvidence (a test missing gives NoTest and 'not proved'; a test unread gives TestUnread; a test found gives 'read from the code'; TestUnread deduplicated) have no unit test. Every test calls ReadEvidence with tests=nil, so a regression there passes. Only the conformance cases and the live run cover it.\n\nIts cause, quoted:\n\n```\nif where != \"\" \u0026\u0026 tests != nil {\n```\n\n## The code it stands on\n\nAs it reads at cd59ce8: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/backlog/parent.go, lines 129 to 248: `ReadEvidence`, the function the cause lies in\n\n```\n129  // ReadEvidence writes a parent's report from its parts: what each became\n130  // and what closed it; each item of its Verification proved by a part\n131  // delivered that quotes it — in its own Verification, or in the text of\n132  // the pull request or commit that closed it — and, when it names a test,\n133  // that test found in the code by tests (nil: not looked for); or said not\n134  // proved.\n135  func ReadEvidence(parent forge.Issue, parts []Part, role string, tests TestFinder) Evidence {\n136  \tev := Evidence{Parts: len(parts)}\n137  \tvar b strings.Builder\n138  \tfmt.Fprintf(\u0026b, \"**The parts of this need**, as they close: kept up to date by the %s role, which never closes this issue — accepting the need is a person's.\\n\\n\", strings.ReplaceAll(role, \"-\", \" \"))\n139  \tb.WriteString(\"| Part | State | Closed by |\\n|---|---|---|\\n\")\n140  \tfor _, p := range parts {\n141  \t\ttitle, state, by := p.Issue.Title, \"open\", \"—\"\n142  \t\tswitch {\n143  \t\tcase p.Gone:\n144  \t\t\ttitle, state = \"\", \"gone from the forge (deleted or moved): its part not delivered here\"\n145  \t\tcase !p.Issue.Closed \u0026\u0026 slices.Contains(p.Issue.Labels, LabelReady):\n146  \t\t\tstate = \"open, ready\"\n147  \t\tcase !p.Issue.Closed:\n148  \t\tcase p.Issue.Reason == \"not_planned\":\n149  \t\t\tstate = \"closed as not planned: its part of the need not delivered\"\n150  \t\tcase p.Issue.Reason == \"duplicate\":\n151  \t\t\tstate = \"closed as a duplicate: its part not delivered here\"\n152  \t\tcase p.Issue.Reason == \"completed\":\n153  \t\t\tstate = \"closed as completed\"\n154  \t\tdefault:\n155  \t\t\tstate = \"closed\"\n156  \t\t}\n157  \t\tif p.Issue.Closed || p.Gone {\n158  \t\t\tev.Closed++\n159  \t\t\tif !p.Delivered() {\n160  \t\t\t\tev.Undone = append(ev.Undone, p.ID)\n161  \t\t\t}\n162  \t\t}\n163  \t\tif p.Delivered() {\n164  \t\t\tby = \"by hand: no pull request nor commit linked\"\n165  \t\t\tif p.Unread != nil {\n166  \t\t\t\tby = \"not read: the forge did not say\"\n167  \t\t\t\tev.Unread = append(ev.Unread, p)\n168  \t\t\t}\n169  \t\t\tif len(p.Closers) \u003e 0 {\n170  \t\t\t\tvar refs []string\n171  \t\t\t\tfor _, c := range p.Closers {\n172  \t\t\t\t\trefs = append(refs, closerName(c))\n173  \t\t\t\t}\n174  \t\t\t\tby = strings.Join(refs, \", \")\n175  \t\t\t}\n176  \t\t}\n177  \t\tfmt.Fprintf(\u0026b, \"| #%d %s | %s | %s |\\n\", p.ID, cell(title), state, by)\n178  \t}\n179  \tev.AllClosed = ev.Parts \u003e 0 \u0026\u0026 ev.Closed == ev.Parts\n180  \tnotYet := map[bool]string{true: \"**Not proved**\", false: \"**Not proved yet**\"}[ev.AllClosed]\n181  \titems := VerificationItems(parent.Body)\n182  \tif len(items) == 0 {\n183  \t\tb.WriteString(\"\\nThis issue has no Verification of its own: nothing to prove its parts against; a person judges from the parts alone.\\n\")\n184  \t} else {\n185  \t\tb.WriteString(\"\\n**Its Verification**, each item against the parts delivered — proved when a part's Verification, or what closed it, quotes it, and a test it names is in the code:\\n\\n\")\n186  \t\tfor _, item := range items {\n187  \t\t\twhere := proof(item, parts)\n188  \t\t\tif where != \"\" \u0026\u0026 tests != nil {\n189  \t\t\t\tvar in, missing, unread []string\n190  \t\t\t\tfor _, name := range TestNames(item) {\n191  \t\t\t\t\tpath, err := tests(name)\n192  \t\t\t\t\tswitch {\n193  \t\t\t\t\tcase err != nil:\n194  \t\t\t\t\t\tunread = append(unread, \"`\"+name+\"`\")\n195  \t\t\t\t\t\tif why := fmt.Sprintf(\"`%s` (%v)\", name, err); !slices.Contains(ev.TestUnread, why) {\n196  \t\t\t\t\t\t\tev.TestUnread = append(ev.TestUnread, why)\n197  \t\t\t\t\t\t}\n198  \t\t\t\t\tcase path == \"\":\n199  \t\t\t\t\t\tmissing = append(missing, \"`\"+name+\"`\")\n200  \t\t\t\t\tcase path == name || strings.HasPrefix(name, path+\"::\"):\n201  \t\t\t\t\t\tin = append(in, \"`\"+name+\"`\") // a file, or a test in it, named by its path\n202  \t\t\t\t\tdefault:\n203  \t\t\t\t\t\tin = append(in, fmt.Sprintf(\"`%s` in %s\", name, path))\n204  \t\t\t\t\t}\n205  \t\t\t\t}\n206  \t\t\t\tswitch {\n207  \t\t\t\tcase len(missing) \u003e 0:\n208  \t\t\t\t\tev.Unproved = append(ev.Unproved, item)\n209  \t\t\t\t\tev.NoTest = append(ev.NoTest, missing...)\n210  \t\t\t\t\tfmt.Fprintf(\u0026b, \"- %s: \\\"%s\\\" — %s, but the code holds no test %s: a test named is no proof until it is there.\\n\", notYet, item, where, strings.Join(missing, \", \"))\n211  \t\t\t\t\tcontinue\n212  \t\t\t\tcase len(unread) \u003e 0:\n213  \t\t\t\t\t// Never said missing when git could not say: not looked for.\n214  \t\t\t\t\tev.Unproved = append(ev.Unproved, item)\n215  \t\t\t\t\tfmt.Fprintf(\u0026b, \"- %s: \\\"%s\\\" — %s, but the test %s could not be looked for in the code: not proved until it is read.\\n\", notYet, item, where, strings.Join(unread, \", \"))\n216  \t\t\t\t\tcontinue\n217  \t\t\t\t}\n218  \t\t\t\tif len(in) \u003e 0 {\n219  \t\t\t\t\twhere += \"; the test \" + strings.Join(in, \", \") + \", read from the code\"\n220  \t\t\t\t}\n221  \t\t\t}\n222  \t\t\tif where != \"\" {\n223  \t\t\t\tfmt.Fprintf(\u0026b, \"- Proved: \\\"%s\\\" — %s.\\n\", item, where)\n224  \t\t\t\tcontinue\n225  \t\t\t}\n226  \t\t\tev.Unproved = append(ev.Unproved, item)\n227  \t\t\tfmt.Fprintf(\u0026b, \"- %s: \\\"%s\\\" — no part delivered quotes it.\\n\", notYet, item)\n228  \t\t}\n229  \t}\n230  \tif !ev.AllClosed {\n231  \t\tfmt.Fprintf(\u0026b, \"\\n**%d of %d parts closed.** Once all are, a person accepts this need by closing this issue.\\n\", ev.Closed, ev.Parts)\n232  \t} else {\n233  \t\tfmt.Fprintf(\u0026b, \"\\n**All %d parts are closed: for a person to accept.** Close this issue as completed to accept the need; or keep it open — reopen a part, or open one for what is missing.\", ev.Parts)\n234  \t\tvar missing []string\n235  \t\tif len(ev.Undone) \u003e 0 {\n236  \t\t\tmissing = append(missing, \"the part of \"+issueList(ev.Undone)+\" not delivered\")\n237  \t\t}\n238  \t\tif n := len(ev.Unproved); n \u003e 0 {\n239  \t\t\tmissing = append(missing, fmt.Sprintf(\"%d item(s) of its Verification not proved\", n))\n240  \t\t}\n241  \t\tif len(missing) \u003e 0 {\n242  \t\t\tb.WriteString(\" Before accepting: \" + strings.Join(missing, \"; \") + \".\")\n243  \t\t}\n244  \t\tb.WriteString(\"\\n\")\n245  \t}\n246  \tev.Body = strings.TrimRight(b.String(), \"\\n\")\n247  \treturn ev\n248  }\n```\n\n### internal/backlog/parent.go, lines 109 to 114: `Delivered`, called by `ReadEvidence`\n\n```\n109  // Delivered says whether a part's work is done: closed, and not as not\n110  // planned nor as a duplicate. GitLab and the local forge keep no reason: a\n111  // closing there is taken as done.\n112  func (p Part) Delivered() bool {\n113  \treturn !p.Gone \u0026\u0026 p.Issue.Closed \u0026\u0026 p.Issue.Reason != \"not_planned\" \u0026\u0026 p.Issue.Reason != \"duplicate\"\n114  }\n```\n\n### internal/backlog/parent.go, lines 375 to 384: `closerName`, called by `ReadEvidence`\n\n```\n375  // closerName says what closed an issue as the forge names it.\n376  func closerName(c forge.Closer) string {\n377  \tswitch {\n378  \tcase c.Kind == \"commit\":\n379  \t\treturn \"commit \" + c.Ref\n380  \tcase strings.HasPrefix(c.Ref, \"!\"):\n381  \t\treturn \"merge request \" + c.Ref\n382  \t}\n383  \treturn \"pull request \" + c.Ref\n384  }\n```\n\n### internal/backlog/parent.go, lines 386 to 389: `cell`, called by `ReadEvidence`\n\n```\n386  // cell is a text fit for a table's cell: one line, no column mark.\n387  func cell(s string) string {\n388  \treturn strings.ReplaceAll(squeeze(s), \"|\", `\\|`)\n389  }\n```\n\n### internal/backlog/parent.go, lines 67 to 84: `VerificationItems`, called by `ReadEvidence`\n\n```\n67  // VerificationItems are the items of a body's Verification section: each\n68  // list item, or, with no list, the section whole.\n69  func VerificationItems(body string) []string {\n70  \ttext := strings.TrimSpace(work.Sections(body)[\"Verification\"])\n71  \tif text == \"\" {\n72  \t\treturn nil\n73  \t}\n74  \tvar items []string\n75  \tfor _, l := range strings.Split(text, \"\\n\") {\n76  \t\tif m := verificationItem.FindStringSubmatch(l); m != nil {\n77  \t\t\titems = append(items, m[1])\n78  \t\t}\n79  \t}\n80  \tif len(items) == 0 {\n81  \t\treturn []string{squeeze(text)}\n82  \t}\n83  \treturn items\n84  }\n```\n\n### internal/backlog/parent.go, lines 250 to 275: `proof`, called by `ReadEvidence`\n\n```\n250  // proof says which part delivered quotes a Verification item, and where;\n251  // \"\" when none does.\n252  func proof(item string, parts []Part) string {\n253  \twant := plain(item)\n254  \tif want == \"\" {\n255  \t\treturn \"\"\n256  \t}\n257  \tfor _, p := range parts {\n258  \t\tif !p.Delivered() {\n259  \t\t\tcontinue\n260  \t\t}\n261  \t\tclosed := \"\"\n262  \t\tif len(p.Closers) \u003e 0 {\n263  \t\t\tclosed = \", closed by \" + closerName(p.Closers[0])\n264  \t\t}\n265  \t\tif strings.Contains(plain(work.Sections(p.Issue.Body)[\"Verification\"]), want) {\n266  \t\t\treturn fmt.Sprintf(\"quoted in #%d's Verification%s\", p.ID, closed)\n267  \t\t}\n268  \t\tfor _, c := range p.Closers {\n269  \t\t\tif strings.Contains(plain(c.Text), want) {\n270  \t\t\t\treturn fmt.Sprintf(\"quoted by %s, which closed #%d\", closerName(c), p.ID)\n271  \t\t\t}\n272  \t\t}\n273  \t}\n274  \treturn \"\"\n275  }\n```\n\n### internal/backlog/backlog.go, lines 1225 to 1231: `issueList`, called by `ReadEvidence`\n\n```\n1225  func issueList(ids []int) string {\n1226  \tvar out []string\n1227  \tfor _, id := range ids {\n1228  \t\tout = append(out, fmt.Sprintf(\"#%d\", id))\n1229  \t}\n1230  \treturn strings.Join(out, \", \")\n1231  }\n```\n\n### internal/backlog/spec.go, lines 41 to 48: `String`, called by `ReadEvidence`\n\n```\n41  // String is the record as the comment hides it.\n42  func (r SpecReview) String() string {\n43  \tstopped := \"\"\n44  \tif r.Stopped {\n45  \t\tstopped = \" stopped\"\n46  \t}\n47  \treturn fmt.Sprintf(\"\u003c!-- workline:spec-review body=%s round=%d open=%d in=%s%s --\u003e\", r.Body, r.Round, r.Open, strings.Join(r.In, \",\"), stopped)\n48  }\n```\n\nNot shown, past 200 lines: `TestNames` (internal/backlog/parent.go:299-318, called by `ReadEvidence`); `evidence` (internal/builtin/productowner/productowner.go:633-665, calls `ReadEvidence`). What would prove or refute the finding may lie in them.\n\n## What the change did to internal/backlog/parent.go, near the cause\n\n```diff\ndiff --git a/internal/backlog/parent.go b/internal/backlog/parent.go\nindex 4ecaf19..19959a4 100644\n--- a/internal/backlog/parent.go\n+++ b/internal/backlog/parent.go\n@@ -176,9 +182,44 @@ func ReadEvidence(parent forge.Issue, parts []Part, role string) Evidence {\n \tif len(items) == 0 {\n \t\tb.WriteString(\"\\nThis issue has no Verification of its own: nothing to prove its parts against; a person judges from the parts alone.\\n\")\n \t} else {\n-\t\tb.WriteString(\"\\n**Its Verification**, each item against the parts delivered — proved when a part's Verification, o