{"material":"## The finding\n\nimportant: whole-chars can push a task past the role's budget\n\nWhy: taskChars adds any whole-chars above the default on top of taskMaxChars, but the role's budget is fixed at 48000 tokens, about 57k characters. A project setting whole-chars to roughly 37000 or more produces a task over the budget. Prompt then refuses it, and the night's gardening goes unjudged.\n\nIts cause, quoted:\n\n```\nreturn taskMaxChars + max(0, wholeChars(s)-wholeCharsDefault)\n```\n\n## The code it stands on\n\nAs it reads at 4b27dd6: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/builtin/documentalist/freshness.go, lines 80 to 84: `taskChars`, the function the cause lies in\n\n```\n80  // taskChars caps a task: the room the doc and the words around its sources\n81  // take is kept, whatever the sources may take.\n82  func taskChars(s Settings) int {\n83  \treturn taskMaxChars + max(0, wholeChars(s)-wholeCharsDefault)\n84  }\n```\n\n### internal/builtin/documentalist/freshness.go, lines 72 to 78: `wholeChars`, called by `taskChars`\n\n```\n72  // wholeChars is the project's cap on the sources of one doc judged whole.\n73  func wholeChars(s Settings) int {\n74  \tif s.WholeChars \u003e 0 {\n75  \t\treturn s.WholeChars\n76  \t}\n77  \treturn wholeCharsDefault\n78  }\n```\n\n### internal/builtin/documentalist/documentalist.go, lines 1237 to 1347: `docTask`, calls `taskChars`\n\n```\n1237  // docTask writes a task putting docs before the agent, each with why it is\n1238  // there and what it is judged against, under the header saying the kind.\n1239  func docTask(header string, suspects map[string]*suspectDoc, s Settings, pl *places, repo string) (string, map[string]map[string]string, error) {\n1240  \theader += citeTask\n1241  \tmaxDocs := s.AIMaxCalls\n1242  \tpaths := make([]string, 0, len(suspects))\n1243  \tfor p := range suspects {\n1244  \t\tpaths = append(paths, p)\n1245  \t}\n1246  \tsort.Strings(paths)\n1247  \tvar b strings.Builder\n1248  \tb.WriteString(header)\n1249  \tjudged := map[string]map[string]string{}\n1250  \tfiles, err := trackedFiles(repo)\n1251  \tif err != nil {\n1252  \t\treturn \"\", nil, err\n1253  \t}\n1254  \tfor _, p := range paths {\n1255  \t\tif maxDocs \u003e 0 \u0026\u0026 len(judged) \u003e= maxDocs {\n1256  \t\t\tbreak\n1257  \t\t}\n1258  \t\tsd := suspects[p]\n1259  \t\tif sd.tooLarge || sd.note != \"\" {\n1260  \t\t\tcontinue // a person judges it, or it is judged in parts\n1261  \t\t}\n1262  \t\twant := map[string]string{}\n1263  \t\tvar short []string\n1264  \t\tnames := make([]string, 0, len(sd.doc.Checked))\n1265  \t\tfor n := range sd.doc.Checked {\n1266  \t\t\tnames = append(names, n)\n1267  \t\t}\n1268  \t\tsort.Strings(names)\n1269  \t\tfor _, n := range names {\n1270  \t\t\twhere, err := pl.get(n)\n1271  \t\t\tif err != nil {\n1272  \t\t\t\treturn \"\", nil, err\n1273  \t\t\t}\n1274  \t\t\tfull, err := git(where.dir, \"rev-parse\", where.rev)\n1275  \t\t\tif err != nil {\n1276  \t\t\t\treturn \"\", nil, err\n1277  \t\t\t}\n1278  \t\t\twant[n] = full\n1279  \t\t\tif n == \"\" {\n1280  \t\t\t\tshort = append(short, full[:7])\n1281  \t\t\t} else {\n1282  \t\t\t\tshort = append(short, n+\": \"+full[:7])\n1283  \t\t\t}\n1284  \t\t}\n1285  \t\tchecked := \"checked: \" + strings.Join(short, \"\")\n1286  \t\tif len(names) \u003e 1 || (len(names) == 1 \u0026\u0026 names[0] != \"\") {\n1287  \t\t\tchecked = \"checked: {\" + strings.Join(short, \", \") + \"}\"\n1288  \t\t}\n1289  \t\tcontent, err := os.ReadFile(filepath.Join(repo, p))\n1290  \t\tif err != nil {\n1291  \t\t\treturn \"\", nil, err\n1292  \t\t}\n1293  \t\tvar entry strings.Builder\n1294  \t\tif sd.whole {\n1295  \t\t\tfmt.Fprintf(\u0026entry, \"## %s\\n\\nIf you vouch for every sentence it keeps, your patch sets `%s`: the commit this doc is judged against now, not the commit that changed a source.\", p, checked)\n1296  \t\t\tif full := want[\"\"]; full != \"\" {\n1297  \t\t\t\tfmt.Fprintf(\u0026entry, \" If you cannot, it leaves `checked` as it is and sets `judged: %s` instead.\", full[:7])\n1298  \t\t\t}\n1299  \t\t} else {\n1300  \t\t\t// Not every source could be given whole: nobody can vouch for\n1301  \t\t\t// the doc from this task, so `checked` stays (ADR-0014).\n1302  \t\t\tfmt.Fprintf(\u0026entry, \"## %s\\n\\nNot every source of this doc could be given whole in this task, so `checked` cannot move: your patch fixes what you find wrong, leaves `checked` as it is\", p)\n1303  \t\t\tif full := want[\"\"]; full != \"\" {\n1304  \t\t\t\tfmt.Fprintf(\u0026entry, \" and sets `judged: %s`, the commit it is judged at\", full[:7])\n1305  \t\t\t}\n1306  \t\t\tentry.WriteString(\". A person reads it against its sources, then moves `checked`.\")\n1307  \t\t}\n1308  \t\tentry.WriteString(\"\\n\\nWhy it is here:\\n\\n\")\n1309  \t\tfor _, w := range sd.why {\n1310  \t\t\tfmt.Fprintf(\u0026entry, \"- %s\\n\", strings.ReplaceAll(w, \"\\n\", \"\\n  \"))\n1311  \t\t}\n1312  \t\t// Line counts the engine counted (ADR-0014, step 2): told, so the\n1313  \t\t// agent neither vouches for them nor counts them itself.\n1314  \t\tif off := countsOff(repo, files, sd.doc, string(content)); len(off) \u003e 0 {\n1315  \t\t\tentry.WriteString(\"\\nLine counts this doc states wrong, counted by the engine in the files as they are now. Bring each to the engine's number: that change needs no `claim`, the engine's count being the evidence (a count is not words a file holds, so it cannot be quoted from one). `checked` cannot move while one stands.\\n\\n\")\n1316  \t\t\tfor _, c := range off {\n1317  \t\t\t\tfmt.Fprintf(\u0026entry, \"- %s\\n\", c.message())\n1318  \t\t\t}\n1319  \t\t}\n1320  \t\tif isAuthority(s, p) {\n1321  \t\t\tfmt.Fprintf(\u0026entry, \"\\nThis doc is an authority (`truth: doc`): the code follows it, not the reverse. Do not change what it says. \"+\n1322  \t\t\t\t\"If the code now disagrees with it, return an `issue` titled %q, saying where they disagree and quoting both; \"+\n1323  \t\t\t\t\"your patch then only sets %s, the disagreement being tracked by the issue.\\n\", \"The code disagrees with \"+p, map[bool]string{true: \"`checked` and `verified`\", false: \"`judged`\"}[sd.whole])\n1324  \t\t}\n1325  \t\tfor _, e := range sd.evidence {\n1326  \t\t\tentry.WriteString(\"\\n\" + e + \"\\n\")\n1327  \t\t}\n1328  \t\tentry.WriteString(\"\\nThe doc as it is now, with its line numbers:\\n\\n```\\n\")\n1329  \t\tfor i, l := range strings.Split(strings.TrimSuffix(string(content), \"\\n\"), \"\\n\") {\n1330  \t\t\tfmt.Fprintf(\u0026entry, \"%4d | %s\\n\", i+1, l)\n1331  \t\t}\n1332  \t\tentry.WriteString(\"```\\n\\n\")\n1333  \t\tif len(header)+entry.Len() \u003e taskChars(s) {\n1334  \t\t\tsd.tooLarge = true\n1335  \t\t\tcontinue\n1336  \t\t}\n1337  \t\tif b.Len()+entry.Len() \u003e taskChars(s) {\n1338  \t\t\tbreak\n1339  \t\t}\n1340  \t\tb.WriteString(entry.String())\n1341  \t\tjudged[p] = want\n1342  \t}\n1343  \tif len(judged) == 0 {\n1344  \t\treturn \"\", nil, nil\n1345  \t}\n1346  \treturn b.String(), judged, nil\n1347  }\n```\n\n### internal/agent/prompt.go, lines 59 to 105: `Prompt`, named by the finding\n\n```\n59  // Prompt assembles what the agent reads, in the contract's order: persona\n60  // (returned apart, as the system prompt), knowledge, instruction, the task,\n61  // the output contract, and the policy last.\n62  func Prompt(req Request) (system, user string, err error) {\n63  \tsystem, _ = facet(req, \"persona.md\")\n64  \tif system == \"\" {\n65  \t\tsystem = fmt.Sprintf(\"You are the %s of a software project. %s\", req.Role.Name, req.Role.Mission)\n66  \t}\n67  \tvar b strings.Builder\n68  \tfor _, k := range req.Role.Context.Knowledge {\n69  \t\ttext, ok := facet(req, filepath.Join(\"knowledge\", k))\n70  \t\tif !ok {\n71  \t\t\treturn \"\", \"\", fmt.Errorf(\"knowledge file %q not found\", k)\n72  \t\t}\n73  \t\tb.WriteString(text + \"\\n\\n\")\n74  \t}\n75  \tinstruction, ok := facet(req, \"instruction.md\")\n76  \tif !ok {\n77  \t\treturn \"\", \"\", fmt.Errorf(\"role %q has no instruction.md\", req.Role.Name)\n78  \t}\n79  \tb.WriteString(instruction + \"\\n\\n\")\n80  \ttask, err := os.ReadFile(filepath.Join(req.RunDir, \"in\", \"task.md\"))\n81  \tif err != nil {\n82  \t\treturn \"\", \"\", err\n83  \t}\n84  \tb.WriteString(\"# Task\\n\\n\" + string(task) + \"\\n\\n\")\n85  \tif fb, err := os.ReadFile(filepath.Join(req.RunDir, \"out\", \"feedback.md\")); err == nil {\n86  \t\tb.WriteString(\"# Your previous answer was refused\\n\\n\" + string(fb) + \"\\n\" +\n87  \t\t\t\"Your new answer replaces it whole: give again, unchanged, every proposal and every change of it not refused above, and change only what is refused.\\n\\n\")\n88  \t}\n89  \tb.WriteString(\"# Answer\\n\\nAnswer with YAML only, no prose and no code fence: a list of proposals, each item holding exactly one of:\\n\\n\")\n90  \tfor _, k := range req.Role.Intentions {\n91  \t\tb.WriteString(contracts[k] + \"\\n\")\n92  \t}\n93  \tb.WriteString(\"\\n\" + BlockScalars + \"\\n\\nYou cannot act, only propose; anything else is refused.\\n\\n\")\n94  \tif policy, ok := facet(req, \"policy.md\"); ok {\n95  \t\tb.WriteString(\"# Rules\\n\\n\" + policy)\n96  \t}\n97  \tuser = b.String()\n98  \tif budget := req.Role.Context.Budget; budget \u003e 0 {\n99  \t\tchars := len(system) + len(user)\n100  \t\tif tokens := Tokens(chars); tokens \u003e budget {\n101  \t\t\treturn \"\", \"\", fmt.Errorf(\"prompt is about %d tokens (%d characters at %s), over the role's budget of %d\", tokens, chars, TokensRatio, budget)\n102  \t\t}\n103  \t}\n104  \treturn system, user, nil\n105  }\n```\n\n## What the change did to internal/builtin/documentalist/freshness.go, near the cause\n\n```diff\ndiff --git a/internal/builtin/documentalist/freshness.go b/internal/builtin/documentalist/freshness.go\nindex 83554dd..a3b5f3b 100644\n--- a/internal/builtin/documentalist/freshness.go\n+++ b/internal/builtin/documentalist/freshness.go\n@@ -66,7 +66,7 @@ func staleDocs(docs []*Doc, pl *places, f Freshness, now time.Time, skip func(st\n // unless the project sets `whole-chars`. A doc whose sources do not fit is\n // left for a person, or judged in parts: confirming it without reading them\n // would only fake its freshness. Characters, not tokens: the engine measures\n-// a task before the call, with no tokenizer (about four characters a token).\n+// a task before the call, with no tokenizer (agent.Tokens).\n const wholeCharsDefault = 20000\n \n // wholeChars is the project's cap on the sources of one doc judged whole.\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}