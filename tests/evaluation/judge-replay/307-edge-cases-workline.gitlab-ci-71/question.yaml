{"material":"## The finding\n\nimportant: Only the first 100 notes are read\n\nWhy: The newest 100 notes are fetched. On a busy merge request, 100 or more newer notes, such as discussion or system notes, can push both the ready note and the reviewer's comment out of the page. `last` becomes \"none\" and the run is treated as ready, so a full review runs again after a plain push.\n\nIts cause, quoted:\n\n```\n/notes?order_by=updated_at\u0026sort=desc\u0026per_page=100\n```\n\n## The code it stands on\n\nAs it reads at c01886f: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### ci/gitlab/workline.gitlab-ci.yml, lines 56 to 86: the lines around the cause, no function found around it (no language it knows)\n\n```\n56  # Every lens of the reviewer once when the merge request becomes ready\n57  # (ADR-0020). Marking a draft ready starts no pipeline: the next one is\n58  # the run on ready when the merge request is no draft and its note\n59  # \"marked this merge request as **ready**\" is newer than the reviewer's\n60  # comment, or there is no comment yet. Read with GITLAB_TOKEN, else the\n61  # job's token; unread, one lens, said (roles/reviewer/docs/run.md).\n62  .workline:ready: \u0026ready\n63    - |\n64      lenses=; last=; auth=\"JOB-TOKEN: $CI_JOB_TOKEN\"\n65      [ -z \"${GITLAB_TOKEN:-}\" ] || auth=\"PRIVATE-TOKEN: $GITLAB_TOKEN\"\n66      mr=\"$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID\"\n67      get() { curl -fsS --header \"$auth\" \"$mr$1\"; }\n68      draft=${CI_MERGE_REQUEST_DRAFT:-}\n69      [ -n \"$draft\" ] || draft=$(get \"\" | jq -r .draft) || draft=\n70      if [ \"$draft\" = false ]; then\n71        last=$(get \"/notes?order_by=updated_at\u0026sort=desc\u0026per_page=100\" | jq -r '[.[] | select((.system and .body == \"marked this merge request as **ready**\") or (.body | contains(\"\u003c!-- workline:sticky=reviewer/summary --\u003e\")))][0] | if . == null then \"none\" elif .system then \"ready\" else \"reviewed\" end') || last=\n72      fi\n73      case \"$draft:$last\" in\n74        false:ready|false:none) lenses=\"--input lenses=all\"; echo \"workline: the merge request is ready and not reviewed since: every lens of the reviewer, once\" ;;\n75        false:reviewed|true:) ;;\n76        *) echo \"workline: whether the merge request just became ready could not be read: one lens of the reviewer\" ;;\n77      esac\n78  \n79  .workline:\n80    image: $WORKLINE_IMAGE:$WORKLINE_VERSION\n81    variables: {GIT_DEPTH: 0}         # the whole history: docs are compared since their `checked`, the release since its tag\n82    rules:\n83      - if: $CI_PIPELINE_SOURCE == \"merge_request_event\"\n84    before_script:\n85      - *trust\n86      - workline version\n```\n\n### internal/review/review.go, lines 22 to 63: `Page`, named by the finding\n\n```\n22  // Page writes one self-contained page, in the repository's git folder, and\n23  // returns its path. It needs nothing but a browser.\n24  func Page(repo, name, title, intro string, sections []Section) (string, error) {\n25  \tvar b strings.Builder\n26  \tb.WriteString(`\u003c!doctype html\u003e\u003chtml\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003ctitle\u003eworkline — ` + html.EscapeString(title) + `\u003c/title\u003e\u003cstyle\u003e\n27  :root{--bg:#fff;--fg:#1f2328;--mute:#59636e;--add:#dafbe1;--del:#ffebe9;--hunk:#ddf4ff;--line:#d1d9e0}\n28  @media (prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--mute:#9198a1;--add:#12361f;--del:#3d1519;--hunk:#0c2d4a;--line:#3d444d}}\n29  body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif;margin:0 auto;max-width:1100px;padding:16px}\n30  h1{font-size:20px}h2{font-size:16px;margin:28px 0 4px}.meta,.stat{color:var(--mute);white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px}\n31  .msg{white-space:pre-wrap;margin:6px 0 10px}.file{border:1px solid var(--line);border-radius:6px;margin:10px 0;overflow-x:auto}\n32  .name{padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600;font-family:ui-monospace,monospace}\n33  pre{margin:0;font:12px/1.5 ui-monospace,monospace}pre span{display:block;padding:0 10px;white-space:pre}\n34  .a{background:var(--add)}.d{background:var(--del)}.h{background:var(--hunk);color:var(--mute)}\n35  \u003c/style\u003e\u003c/head\u003e\u003cbody\u003e`)\n36  \tfmt.Fprintf(\u0026b, \"\u003ch1\u003e%s\u003c/h1\u003e\", html.EscapeString(title))\n37  \tif intro != \"\" {\n38  \t\tfmt.Fprintf(\u0026b, \"\u003cp class=meta\u003e%s\u003c/p\u003e\", html.EscapeString(intro))\n39  \t}\n40  \tfor _, s := range sections {\n41  \t\tfmt.Fprintf(\u0026b, \"\u003ch2\u003e%s\u003c/h2\u003e\", html.EscapeString(s.Heading))\n42  \t\tif s.Meta != \"\" {\n43  \t\t\tfmt.Fprintf(\u0026b, \"\u003cdiv class=meta\u003e%s\u003c/div\u003e\", html.EscapeString(s.Meta))\n44  \t\t}\n45  \t\tif s.Message != \"\" {\n46  \t\t\tfmt.Fprintf(\u0026b, \"\u003cdiv class=msg\u003e%s\u003c/div\u003e\", html.EscapeString(s.Message))\n47  \t\t}\n48  \t\tif s.Stat != \"\" {\n49  \t\t\tfmt.Fprintf(\u0026b, \"\u003cdiv class=stat\u003e%s\u003c/div\u003e\", html.EscapeString(s.Stat))\n50  \t\t}\n51  \t\twritePatch(\u0026b, s.Patch)\n52  \t}\n53  \tb.WriteString(\"\u003c/body\u003e\u003c/html\u003e\\n\")\n54  \tdir, err := gitOut(repo, \"rev-parse\", \"--absolute-git-dir\")\n55  \tif err != nil {\n56  \t\treturn \"\", err\n57  \t}\n58  \tpath := filepath.Join(dir, \"workline\", name)\n59  \tif err := os.MkdirAll(filepath.Dir(path), 0o755); err != nil {\n60  \t\treturn \"\", err\n61  \t}\n62  \treturn path, os.WriteFile(path, []byte(b.String()), 0o644)\n63  }\n```\n\n## What the change did to ci/gitlab/workline.gitlab-ci.yml, near the cause\n\n```diff\ndiff --git a/ci/gitlab/workline.gitlab-ci.yml b/ci/gitlab/workline.gitlab-ci.yml\nindex 32d115d..58f1313 100644\n--- a/ci/gitlab/workline.gitlab-ci.yml\n+++ b/ci/gitlab/workline.gitlab-ci.yml\n@@ -53,6 +53,28 @@ variables:\n .workline:claude: \u0026claude           # the agent, only when the project gives its token\n   - ai=none\n   - if [ -n \"$CLAUDE_CODE_OAUTH_TOKEN\" ]; then npm install -g --silent @anthropic-ai/claude-code \u0026\u0026 ai=claude; fi\n+# Every lens of the reviewer once when the merge request becomes ready\n+# (ADR-0020). Marking a draft ready starts no pipeline: the next one is\n+# the run on ready when the merge request is no draft and its note\n+# \"marked this merge request as **ready**\" is newer than the reviewer's\n+# comment, or there is no comment yet. Read with GITLAB_TOKEN, else the\n+# job's token; unread, one lens, said (roles/reviewer/docs/run.md).\n+.workline:ready: \u0026ready\n+  - |\n+    lenses=; last=; auth=\"JOB-TOKEN: $CI_JOB_TOKEN\"\n+    [ -z \"${GITLAB_TOKEN:-}\" ] || auth=\"PRIVATE-TOKEN: $GITLAB_TOKEN\"\n+    mr=\"$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID\"\n+    get() { curl -fsS --header \"$auth\" \"$mr$1\"; }\n+    draft=${CI_MERGE_REQUEST_DRAFT:-}\n+    [ -n \"$draft\" ] || draft=$(get \"\" | jq -r .draft) || draft=\n+    if [ \"$draft\" = false ]; then\n+      last=$(get \"/notes?order_by=updated_at\u0026sort=desc\u0026per_page=100\" | jq -r '[.[] | select((.system and .body == \"marked this merge request as **ready**\") or (.body | contains(\"\u003c!-- workline:sticky=reviewer/summary --\u003e\")))][0] | if . == null then \"none\" elif .system then \"ready\" else \"reviewed\" end') || last=\n+    fi\n+    case \"$draft:$last\" in\n+      false:ready|false:none) lenses=\"--input lenses=all\"; echo \"workline: the merge request is ready and not reviewed since: every lens of the reviewer, once\" ;;\n+      false:reviewed|true:) ;;\n+      *) echo \"workline: whether the merge request just became ready could not be read: one lens of the reviewer\" ;;\n+    esac\n \n .workline:\n   image: $WORKLINE_IMAGE:$WORKLINE_VERSION\n@@ -69,11 +91,12 @@ workline:judge:\n   stage: test\n   script:\n     - *claude\n+    - *ready\n     - status=0\n     - \u003e\n       workline route merge-request --ai \"$ai\" --no-apply --push-to-merge-request\n       --forge gitlab --target merge-request:$CI_MERGE_REQUEST_IID --branch \"$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME\"\n-      --input range=$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA\n+      --input range=$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA $lenses\n       --code-quality gl-code-quality.json --summary workline-summary.md --summary workline-summary.html --json \u003e line.json || status=$?\n     - exit $status\n   # An agent out of reach (3) warns, not taken for the change's fault: a\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}