n\t\tt.Error(\"the head read as the author's\")\n\t}\n\tif len(locate(saidByAuthor(said), \"no change in behaviour.\")) == 0 {\n\t\tt.Error(\"the author's words not found\")\n\t}\n\tif !trailer.MatchString(\"  Co-Authored-By: A \u003ca@b\u003e\") || trailer.MatchString(\"  Follow-up: no change\") {\n\t\tt.Error(\"trailers\")\n\t}\n}\n\n// On a merge request the turn runs over every lens, one with nothing to\n// read passed over: a run count names the same place whether an issue is\n// closed or not.\nfunc TestLensesInTurnPassOver(t *testing.T) {\n\tt.Setenv(\"WORKLINE_EVENT\", \"merge-request\")\n\ts := Settings{Lenses: []string{\"correctness\", \"intent\", \"claims\"}, LensesPerPush: 1}\n\tskip := map[string]string{\"intent\": \"no issue\"}\n\tfor runs, want := range []string{\"correctness\", \"claims\", \"claims\", \"correctness\"} {\n\t\tgot, _, err := lenses(t.TempDir(), s, Record{Runs: runs}, skip)\n\t\tif err != nil || len(got) != 1 || got[0] != want {\n\t\t\tt.Errorf(\"runs %d: %v %v, want %s\", runs, got, err, want)\n\t\t}\n\t}\n}\n\n// An issue is given by its Need, Verification and Scope; one without them,\n// whole.\nfunc TestIssueText(t *testing.T) {\n\ttext := issueText(\u0026forge.Issue{ID: 4, Title: \"Mean\", Body: \"## Need\\n\\nA mean.\\n\\n## Validation\\n\\nRead it.\\n\\n## Scope\\n\\ncalc/\\n\"})\n\tif !strings.Contains(text, \"#### Need\\n\\nA mean.\") || !strings.Contains(text, \"#### Scope\\n\\ncalc/\") || strings.Contains(text, \"Read it.\") {\n\t\tt.Errorf(\"sections:\\n%s\", text)\n\t}\n\tif text := issueText(\u0026forge.Issue{ID: 5, Title: \"Bug\", Body: \"It crashes on [].\"}); !strings.Contains(text, \"It crashes on [].\") {\n\t\tt.Errorf(\"no section, the body whole:\\n%s\", text)\n\t}\n}\n```\n\n### internal/builtin/reviewer/lines_test.go\n\n```\npackage reviewer\n\nimport (\n\t\"strings\"\n\t\"testing\"\n\n\t\"github.com/JN0V/workline/internal/forge\"\n)\n\n// A comment's key: lines added above keep it, a line changed gets a new\n// one, two lines reading alike stay apart by which one they are, two\n// lenses apart by their names; a line not read is keyed by its number, so\n// two of a file gone at the head do not share a key (#277).\nfunc TestLineKey(t *testing.T) {\n\tbefore := []string{\"package a\", \"\", \"func A() int {\", \"\\treturn 1\", \"}\", \"func B() int {\", \"\\treturn 1\", \"}\"}\n\tmoved := append([]string{\"// A comment above.\", \"\"}, before...)\n\tchanged := append([]string{}, before...)\n\tchanged[3] = \"\\treturn 2\"\n\tkey := func(lines []string, n int, by string) string { return lineKeyOf(lines, \"a.go\", n, by) }\n\tif key(before, 4, \"correctness\") != key(moved, 6, \"correctness\") {\n\t\tt.Error(\"a line moved by lines added above got a new key\")\n\t}\n\tif key(before, 4, \"correctness\") == key(changed, 4, \"correctness\") {\n\t\tt.Error(\"a line changed kept its key\")\n\t}\n\tif key(before, 4, \"correctness\") == key(before, 7, \"correctness\") {\n\t\tt.Error(\"two lines reading alike share a key\")\n\t}\n\tif key(before, 4, \"correctness\") == key(before, 4, \"tests\") {\n\t\tt.Error(\"two lenses on one line share a key\")\n\t}\n\tif key(nil, 3, \"correctness\") == key(nil, 9, \"correctness\") {\n\t\tt.Error(\"two lines of a file not read share a key\")\n\t}\n\tif k := key(before, 4, \"a--lens\"); strings.Contains(k, \"--\") || !strings.HasPrefix(k, \"a-lens/\") {\n\t\tt.Errorf(\"a key holding a run of dashes would end its marker: %s\", k)\n\t}\n}\n\n// The summary comment's review region holds each finding in full, for an\n// engine that posts no comment on a line; one that does replaces it.\nfunc TestSummaryReviewRegion(t *testing.T) {\n\tlines := []forge.LineComment{{Path: \"a.go\", Line: 4, Key: \"correctness/x\", Body: \"**Important: A returns 1**\\n\\nwhy it fails\"}}\n\tbody := summaryComment(Review{Summary: \"1 findings on the change\"}, 0, nil, lines)\n\tfrom, end := strings.Index(body, forge.ReviewHere), strings.Index(body, forge.ReviewEnd)\n\tif from \u003c 0 || end \u003c from || !strings.Contains(body[from:end], \"\u003e why it fails\") || !strings.Contains(body[from:end], \"`a.go:4`\") {\n\t\tt.Fatalf(\"the region does not hold the finding in full:\\n%s\", body)\n\t}\n\tfilled := forge.FillReview(body, \"**On their lines**: 1 comment\")\n\tif strings.Contains(filled, \"why it fails\") || strings.Contains(filled, \"workline:review\") || !strings.Contains(filled, \"**On their lines**: 1 comment\\n\\n| \") \u0026\u0026 !strings.Contains(filled, \"**On their lines**: 1 comment\\n\\nNo finding\") {\n\t\tt.Errorf(\"filled:\\n%s\", filled)\n\t}\n}\n```\n\n### internal/builtin/reviewer/reach_test.go\n\n```\npackage reviewer\n\nimport (\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"strings\"\n\t\"testing\"\n)\n\nfunc gitRepo(t *testing.T, files map[string]string) string {\n\tt.Helper()\n\trepo := t.TempDir()\n\tfor name, text := range files {\n\t\tp := filepath.Join(repo, name)\n\t\tos.MkdirAll(filepath.Dir(p), 0o755)\n\t\tos.WriteFile(p, []byte(text), 0o644)\n\t}\n\tfor _, args := range [][]string{{\"init\", \"-q\"}, {\"add\", \".\"}, {\"-c\", \"user.name=t\", \"-c\", \"user.email=t@t\", \"commit\", \"-qm\", \"start\"}} {\n\t\tcmd := exec.Command(\"git\", append([]string{\"-C\", repo}, args...)...)\n\t\tcmd.Env = append(os.Environ(), \"GIT_CONFIG_GLOBAL=/dev/null\", \"GIT_CONFIG_NOSYSTEM=1\")\n\t\tif out, err := cmd.CombinedOutput(); err != nil {\n\t\t\tt.Fatalf(\"git %v: %v: %s\", args, err, out)\n\t\t}\n\t}\n\treturn repo\n}\n\nconst calcGo = `package calc\n\n// Mean is the average of every value.\nfunc Mean(values []int) int {\n\treturn sum(values) / len(values)\n}\n\n// Report says the mean.\nfunc Report(values []int) string {\n\treturn fmt.Sprint(Mean(values))\n}\n`\n\nconst sumGo = `package calc\n\n// sum adds the values after the first.\nfunc sum(values []int) int {\n\ttotal := 0\n\tfor _, v := range values[1:] {\n\t\ttotal += v\n\t}\n\treturn total\n}\n\nfunc unrelated() {}\n`\n\n// The judge's code: the cause's function whole, the function it calls in\n// another file and the one calling it, whole, up to the cap; the rest named\n// with where it lies; never a test, nor a function it does not reach.\nfunc TestReach(t *testing.T) {\n\trepo := gitRepo(t, map[string]string{\n\t\t\"calc/calc.go\":      calcGo,\n\t\t\"calc/sum.go\":       sumGo,\n\t\t\"calc/calc_test.go\": \"package calc\\n\\nfunc TestMean() { Mean(nil) }\\n\",\n\t\t\"other/other.go\":    \"package other\\n\\nfunc sum(v []int) int { return 0 }\\n\\nfunc use() int { return sum(nil) }\\n\",\n\t})\n\t// An unexported Go function is called only from its own package.\n\tg := Finding{Cause: Quote{Path: \"calc/sum.go\", Quote: \"total += v\"}}\n\tif got := reach(repo, \"HEAD\", nil, g, 7, 0, 200); !strings.Contains(got, \"`Mean`, calls `sum`\") || strings.Contains(got, \"other.go\") {\n\t\tt.Errorf(\"the callers of sum:\\n%s\", got)\n\t}\n\tf := Finding{Title: \"Mean leaves out the first value\", Why: \"sum skips one\",\n\t\tCause: Quote{Path: \"calc/calc.go\", Quote: \"return sum(values) / len(values)\"}}\n\tgot := reach(repo, \"HEAD\", []string{\"**/*_test.*\"}, f, 5, 0, 200)\n\tfor _, want := range []string{\n\t\t\"### calc/calc.go, lines 3 to 6: `Mean`, the function the cause lies in\",\n\t\t\"### calc/sum.go, lines 3 to 10: `sum`, called by `Mean`\",\n\t\t\"6  \\tfor _, v := range values[1:] {\",\n\t\t\"### calc/calc.go, lines 8 to 11: `Report`, calls `Mean`\",\n\t} {\n\t\tif !strings.Contains(got, want) {\n\t\t\tt.Errorf(\"missing %q in:\\n%s\", want, got)\n\t\t}\n\t}\n\tfor _, not := range []string{\"unrelated\", \"TestMean\", \"Not shown\"} {\n\t\tif strings.Contains(got, not) {\n\t\t\tt.Errorf(\"holds %q:\\n%s\", not, got)\n\t\t}\n\t}\n\tgot = reach(repo, \"HEAD\", nil, f, 5, 0, 10)\n\tif !strings.Contains(got, \"Not shown, past 10 lines: `sum` (calc/sum.go:3-10, called by `Mean`)\") ||\n\t\t!strings.Contains(got, \"`Report`, calls `Mean`\") {\n\t\tt.Errorf(\"the cap: sum named, Report (4 lines) still fits:\\n%s\", got)\n\t}\n\tif got := reach(repo, \"HEAD\", nil, f, 5, 0, 0); !strings.Contains(got, \"lines 1 to 11: the lines around the cause\") || strings.Contains(got, \"sum.go\") {\n\t\tt.Errorf(\"judge-lines-max 0: the lines around only:\\n%s\", got)\n\t}\n\t// A function the finding names, in another language than the cause's.\n\tf.Why = \"the result is handed to `Report` unchecked\"\n\tf.Cause = Quote{Path: \"run.sh\", Quote: \"echo\"}\n\trepo = gitRepo(t, map[string]string{\"calc/calc.go\": calcGo, \"calc/sum.go\": sumGo, \"run.sh\": \"#!/bin/sh\\nset -e\\necho mean\\n\"})\n\tgot = reach(repo, \"HEAD\", nil, f, 3, 0, 200)\n\tif !strings.Contains(got, \"no function found around it (shell)\") || !strings.Contains(got, \"`Report`, named by the finding\") {\n\t\tt.Errorf(\"a function named across languages:\\n%s\", got)\n\t}\n}\n\n// A function's bounds and calls with no parser: braces, indentation, `end`.\nfunc TestEnclosingByLanguage(t *testing.T) {\n\tfiles := map[string]string{\n\t\t\"a.sh\":   \"#!/bin/sh\\n# api calls the forge.\\napi() {\\n  curl \\\"$1\\\" | jq '{a: .b}'\\n}\\nall() {\\n  api \\\"$1\\\" # {\\n  echo done\\n}\\nall x\\n\",\n\t\t\"a.py\":   \"import os\\n\\n\\ndef load(\\n    path,\\n):\\n    if path:\\n        return parse(path)\\n\\n    return None\\n\\n\\ndef parse(p):\\n    return p\\n\",\n\t\t\"a.js\":   \"const add = (a, b) =\u003e {\\n  return sum(a, b);\\n};\\n\\nfunction sum(a, b) {\\n  if (a) {\\n    return a + b;\\n  }\\n}\\n\",\n\t\t\"a.rb\":   \"class A\\n  def total(xs)\\n    xs.each do |x|\\n      puts x\\n    end\\n  end\\nend\\n\",\n\t\t\"a.java\": \"class A {\\n  public static int twice(int x)\\n  {\\n    return helper(x) * 2;\\n  }\\n  int helper(int x) { return x; }\\n}\\n\",\n\t}\n\trepo := gitRepo(t, files)\n\tr := \u0026reacher{repo: repo, head: \"HEAD\", files: map[string][]string{}}\n\tfor _, c := range []struct {\n\t\tfile     string\n\t\tat       int\n\t\tname     string\n\t\tfrom, to int\n\t\tcalls    string\n\t}{\n\t\t{\"a.sh\", 7, \"all\", 6, 9, \"api\"},\n\t\t{\"a.sh\", 4, \"api\", 2, 5, \"\"},\n\t\t{\"a.py\", 8, \"load\", 4, 10, \"parse\"},\n\t\t{\"a.js\", 7, \"sum\", 5, 9, \"\"},\n\t\t{\"a.js\", 2, \"add\", 1, 3, \"sum\"},\n\t\t{\"a.rb\", 4, \"total\", 2, 6, \"puts\"},\n\t\t{\"a.java\", 4, \"twice\", 2, 5, \"helper\"},\n\t} {\n\t\tf, ok := r.enclosing(c.file, c.at)\n\t\tif !ok || f.name != c.name || f.from != c.from || f.to != c.to || (c.calls != \"\" \u0026\u0026 !strings.Contains(\" \"+strings.Join(f.calls, \" \")+\" \", \" \"+c.calls+\" \")) {\n\t\t\tt.Errorf(\"%s:%d = %+v, %v; want %s %d-%d calling %s\", c.file, c.at, f, ok, c.name, c.from, c.to, c.calls)\n\t\t}\n\t}\n\tif f, ok := r.enclosing(\"a.sh\", 10); ok {\n\t\tt.Errorf(\"a script's top level is no function: %+v\", f)\n\t}\n\tif got := r.defs([]string{\"api\", \"parse\", \"helper\", \"nowhere\"}, nil); len(got[\"api\"]) != 1 || len(got[\"parse\"]) != 1 || len(got[\"helper\"]) != 1 || len(got[\"nowhere\"]) != 0 {\n\t\tt.Errorf(\"defs: %+v\", got)\n\t}\n}\n\nfunc TestNamedIn(t *testing.T) {\n\tnames, weak := namedIn(\"The `comments` operation emits no `bot` field, and Agreement accepts it; see load_all() and run(x). Report says readBlock. Last\")\n\tif got := strings.Join(names, \" \"); got != \"comments bot Agreement load_all run readBlock\" {\n\t\tt.Errorf(\"namedIn = %q\", got)\n\t}\n\tif got := strings.Join(weak, \" \"); got != \"The Report Last\" {\n\t\tt.Errorf(\"namedIn, weak = %q\", got)\n\t}\n}\n\n// A brace in a string, a character, a comment is not the code's; a quote\n// left open on the line, an apostrophe or a lifetime, hides nothing.\nfunc TestStripCode(t *testing.T) {\n\tfor _, c := range []struct {\n\t\tline  string\n\t\tshell bool\n\t\twant  string\n\t}{\n\t\t{`if c == '{' { // }`, false, `if c ==  { `},\n\t\t{`s := \"a\\\\\" + \"}\"; x {`, false, `s :=  + ; x {`},\n\t\t{\"r := `\\\\` + f() {\", false, \"r :=  + f() {\"},\n\t\t{`fn f\u003c'a\u003e(x: \u0026'a str) {`, false, `fn f\u003ca str) {`}, // a lifetime taken for a quote, its brace kept\n\t\t{`jq '{a: .b}' \"$x\" # }`, true, `jq   `},\n\t\t{`echo \"${#x}\" {`, true, `echo  {`},\n\t\t{`msg := \"it goes on`, false, `msg := `},\n\t} {\n\t\tif got := stripCode(c.line, c.shell); got != c.want {\n\t\t\tt.Errorf(\"stripCode(%q) = %q, want %q\", c.line, got, c.want)\n\t\t}\n\t}\n}\n\n// A symptom in the function its cause lies in is not shown again as lines\n// around it.\nfunc TestReachSymptomInTheCauseFunction(t *testing.T) {\n\trepo := gitRepo(t, map[string]string{\"calc/calc.go\": calcGo, \"calc/sum.go\": sumGo})\n\tf := Finding{Cause: Quote{Path: \"calc/sum.go\", Quote: \"total := 0\"}, Symptom: \u0026Quote{Path: \"calc/sum.go\", Quote: \"return total\"}}\n\tgot := reach(repo, \"HEAD\", nil, f, 5, 9, 8)\n\tif strings.Count(got, \"### calc/sum.go\") != 1 {\n\t\tt.Errorf(\"sum shown once:\\n%s\", got)\n\t}\n}\n```\n\nNot shown, past 300 lines: internal/builtin/reviewer/record_test.go, internal/builtin/reviewer/reviewer_test.go, internal/builtin/reviewer/specforge_test.go, internal/builtin/reviewer/tests_test.go, docs/spec/backlog-acts.md, docs/spec/conformance.md, docs/spec/conformance/evaluation.md, docs/spec/forge-command.md, docs/spec/model-grid.md, docs/spec/role-adapting.md, docs/spec/role-contract.md, docs/spec/role-outcome.md, docs/spec/routing.md, internal/agent/prompt_test.go, internal/backlog/opening_test.go, internal/backlog/plain_test.go, internal/backlog/spec_test.go, internal/routing/adopt_test.go, tests/conformance/cases/backlog/issue-closed-not-recreated.yaml, tests/conformance/cases/backlog/issue-two-roles-one-issue.yaml, tests/conformance/cases/product-owner/description-proposed-when-cautious.yaml, tests/conformance/cases/product-owner/description-revised-for-a-comment.yaml, tests/conformance/cases/product-owner/description-rewritten-on-real-issues.yaml, tests/conformance/cases/product-owner/description-rewritten-plain.yaml, tests/conformance/cases/product-owner/ready-held-while-