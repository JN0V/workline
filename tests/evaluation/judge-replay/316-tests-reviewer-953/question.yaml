{"material":"## The finding\n\nimportant: Fallback of the review to the removed-line \"On\" has no test\n\nWhy: f.On is set for the removed-line branch (a finding on a line the change removed), and for the exposed line. Only the added and kept line cases are covered. A wrong On for removed lines would post on the wrong line, with no test failing.\n\nIts cause, quoted:\n\n```\nf.On = st.Change.Removed[f.Cause.Path][at[0].From-1].At\n```\n\n## The code it stands on\n\nAs it reads at adf03f5: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/builtin/reviewer/reviewer.go, lines 870 to 976: `found`, the function the cause lies in\n\n```\n870  // found reads one finding a lens answered, and finds its quotes again: its\n871  // cause in the file at the head of the range, or among the lines the change\n872  // removed; its symptom, when it gives one, in its file. Related: its cause\n873  // lies on a line the change added or removed, or on a kept line beside a\n874  // removal. why says why it is dropped.\n875  func found(repo string, st state, lens string, cites bool, v any) (Finding, string) {\n876  \tvar raw struct {\n877  \t\tSeverity string `json:\"severity\"`\n878  \t\tTitle    string `json:\"title\"`\n879  \t\tWhy      string `json:\"why\"`\n880  \t\tFix      string `json:\"fix\"`\n881  \t\tSeen     string `json:\"seen\"`\n882  \t\tClaim    string `json:\"claim\"`\n883  \t\tDecision string `json:\"decision\"`\n884  \t\tCause    *Quote `json:\"cause\"`\n885  \t\tSymptom  *Quote `json:\"symptom\"`\n886  \t}\n887  \t// Through JSON: YAML would not read back a quote starting with a tab.\n888  \tdata, _ := json.Marshal(v)\n889  \tif err := json.Unmarshal(data, \u0026raw); err != nil {\n890  \t\treturn Finding{Title: fmt.Sprint(v)}, \"it does not read: \" + err.Error()\n891  \t}\n892  \tf := Finding{Lens: lens, Severity: strings.ToLower(strings.TrimSpace(raw.Severity)), Title: strings.TrimSpace(raw.Title), Why: strings.TrimSpace(raw.Why), Fix: strings.TrimSpace(raw.Fix), Seen: strings.TrimSpace(raw.Seen), Symptom: raw.Symptom}\n893  \tif f.Severity != \"important\" {\n894  \t\tf.Severity = \"nit\"\n895  \t}\n896  \t// A decision is never important: a person answers it, no judge (#126).\n897  \tif f.Decision = strings.TrimSpace(raw.Decision); f.Decision != \"\" {\n898  \t\tf.Severity = \"question\"\n899  \t}\n900  \tif raw.Cause == nil || strings.TrimSpace(raw.Cause.Quote) == \"\" || strings.TrimSpace(raw.Cause.Path) == \"\" {\n901  \t\treturn f, \"it quotes no cause\"\n902  \t}\n903  \t// A lens checking the author's claims quotes the claim: found again in\n904  \t// what the author said, or the finding is dropped (#126).\n905  \tif cites {\n906  \t\tf.Claim = strings.TrimSpace(raw.Claim)\n907  \t\tif f.Claim == \"\" {\n908  \t\t\treturn f, \"it quotes no claim of the author\"\n909  \t\t}\n910  \t\tif len(locate(saidByAuthor(st.Testimony), f.Claim)) == 0 {\n911  \t\t\treturn f, \"its claim is not found in what the author said\"\n912  \t\t}\n913  \t}\n914  \tf.Cause = Quote{Path: clean(raw.Cause.Path), Quote: raw.Cause.Quote}\n915  \tif st.Spec != nil {\n916  \t\treturn inSpec(repo, st, f)\n917  \t}\n918  \t// A cause quoted from the issue the change closes: what it asks and the\n919  \t// change does not do, the author's to do (#126).\n920  \tif strings.HasPrefix(f.Cause.Path, \"#\") {\n921  \t\tis := issueOf(st, f.Cause.Path)\n922  \t\tif is == nil {\n923  \t\t\treturn f, fmt.Sprintf(\"its cause names %s, not an issue the change closes\", f.Cause.Path)\n924  \t\t}\n925  \t\tif len(locate(strings.Split(is.Text, \"\\n\"), f.Cause.Quote)) == 0 {\n926  \t\t\treturn f, fmt.Sprintf(\"its cause is not found in %s, as the lenses were given it\", f.Cause.Path)\n927  \t\t}\n928  \t\tf.Where, f.Related, f.Symptom = f.Cause.Path, true, nil\n929  \t\treturn f, \"\"\n930  \t}\n931  \ttext, ok := fileAt(repo, st.Head, f.Cause.Path)\n932  \tvar places []Place\n933  \tif ok {\n934  \t\tplaces = locate(strings.Split(text, \"\\n\"), f.Cause.Quote)\n935  \t}\n936  \t// The change's: a line it added, then a kept line beside a removal, then\n937  \t// a line it removed, even one also kept elsewhere (#224).\n938  \tfor _, in := range []func(string, int) bool{st.Change.addedAt, st.Change.exposedAt} {\n939  \t\tfor _, p := range places {\n940  \t\t\tfor n := p.From; n \u003c= p.To \u0026\u0026 f.Where == \"\"; n++ {\n941  \t\t\t\tif in(f.Cause.Path, n) {\n942  \t\t\t\t\tf.Where, f.Related, f.On = fmt.Sprintf(\"%s:%d\", f.Cause.Path, p.From), true, n\n943  \t\t\t\t}\n944  \t\t\t}\n945  \t\t}\n946  \t}\n947  \tif f.Where == \"\" {\n948  \t\tvar removed []string\n949  \t\tfor _, l := range st.Change.Removed[f.Cause.Path] {\n950  \t\t\tremoved = append(removed, l.Text)\n951  \t\t}\n952  \t\tif at := locate(removed, f.Cause.Quote); len(at) \u003e 0 {\n953  \t\t\tf.On = st.Change.Removed[f.Cause.Path][at[0].From-1].At\n954  \t\t\tf.Where, f.Related = fmt.Sprintf(\"%s:%d\", f.Cause.Path, f.On), true\n955  \t\t}\n956  \t}\n957  \tif f.Where == \"\" \u0026\u0026 len(places) \u003e 0 {\n958  \t\tf.Where = fmt.Sprintf(\"%s:%d\", f.Cause.Path, places[0].From)\n959  \t\tf.Line = norm(strings.Split(text, \"\\n\")[places[0].From-1])\n960  \t}\n961  \tif f.Where == \"\" {\n962  \t\treturn f, fmt.Sprintf(\"its cause is not found in %s, as it reads at %s nor among the lines the change removed\", f.Cause.Path, short(st.Head))\n963  \t}\n964  \t// A question is the change's to raise, or nobody's: never an issue.\n965  \tif f.Decision != \"\" \u0026\u0026 !f.Related {\n966  \t\treturn f, \"a question on what the change does not touch, never an issue\"\n967  \t}\n968  \tif f.Symptom != nil {\n969  \t\tf.Symptom.Path = clean(f.Symptom.Path)\n970  \t\ttext, ok := fileAt(repo, st.Head, f.Symptom.Path)\n971  \t\tif !ok || len(locate(strings.Split(text, \"\\n\"), f.Symptom.Quote)) == 0 {\n972  \t\t\treturn f, fmt.Sprintf(\"its symptom is not found in %s as it reads\", f.Symptom.Path)\n973  \t\t}\n974  \t}\n975  \treturn f, \"\"\n976  }\n```\n\n### internal/intent/intent.go, lines 163 to 183: `Marshal`, called by `found`\n\n```\n163  // Marshal writes proposals as Read reads them: YAML, or JSON — which YAML\n164  // reads too — when the YAML written would not read back: the YAML library\n165  // writes a text starting with a tab as a block it then refuses (\"found a\n166  // tab character where an indentation space is expected\"), and code quoted\n167  // from a file often starts with one.\n168  func Marshal(in []Intention) ([]byte, error) {\n169  \tlist := make([]map[string]any, len(in))\n170  \tfor i, x := range in {\n171  \t\tlist[i] = map[string]any{x.Kind: x.Value}\n172  \t}\n173  \tdata, err := yaml.Marshal(list)\n174  \tif err != nil {\n175  \t\treturn nil, err\n176  \t}\n177  \tvar back []map[string]any\n178  \tif yaml.Unmarshal(data, \u0026back) == nil {\n179  \t\treturn data, nil\n180  \t}\n181  \tdata, err = json.MarshalIndent(list, \"\", \"  \")\n182  \treturn append(data, '\\n'), err\n183  }\n```\n\n### internal/role/config.go, lines 17 to 17: `Error`, called by `found`\n\n```\n17  func (e *ConfigError) Error() string { return \".workline/config.yaml: \" + e.msg }\n```\n\n### internal/builtin/reviewer/diff.go, lines 167 to 202: `locate`, called by `found`\n\n```\n167  // locate finds a quote in a file's lines, spaces and line breaks aside: an\n168  // agent often quotes two lines as one, or one line as two. It returns every\n169  // place it is found.\n170  func locate(lines []string, quote string) []Place {\n171  \twant := norm(quote)\n172  \tif want == \"\" {\n173  \t\treturn nil\n174  \t}\n175  \tvar text strings.Builder\n176  \tvar lineAt []int // the line each character of text comes from\n177  \tfor i, l := range lines {\n178  \t\tn := norm(l)\n179  \t\tif n == \"\" {\n180  \t\t\tcontinue\n181  \t\t}\n182  \t\tif text.Len() \u003e 0 {\n183  \t\t\ttext.WriteByte(' ')\n184  \t\t\tlineAt = append(lineAt, i+1)\n185  \t\t}\n186  \t\ttext.WriteString(n)\n187  \t\tfor range len(n) {\n188  \t\t\tlineAt = append(lineAt, i+1)\n189  \t\t}\n190  \t}\n191  \tall := text.String()\n192  \tvar found []Place\n193  \tfor start := 0; ; {\n194  \t\ti := strings.Index(all[start:], want)\n195  \t\tif i \u003c 0 {\n196  \t\t\treturn found\n197  \t\t}\n198  \t\tat := start + i\n199  \t\tfound = append(found, Place{lineAt[at], lineAt[at+len(want)-1]})\n200  \t\tstart = at + 1\n201  \t}\n202  }\n```\n\n### internal/builtin/reviewer/intent.go, lines 164 to 168: `saidByAuthor`, called by `found`\n\n```\n164  // saidByAuthor is the testimony without its head: where a claim is found\n165  // again.\n166  func saidByAuthor(t string) []string {\n167  \treturn strings.Split(strings.TrimPrefix(t, testimonyHead), \"\\n\")\n168  }\n```\n\n### internal/builtin/reviewer/reviewer.go, lines 1731 to 1737: `clean`, called by `found`\n\n```\n1731  func clean(p string) string {\n1732  \tp = strings.TrimSpace(p)\n1733  \tfor _, pre := range []string{\"./\", \"a/\", \"b/\"} {\n1734  \t\tp = strings.TrimPrefix(p, pre)\n1735  \t}\n1736  \treturn filepath.ToSlash(filepath.Clean(p))\n1737  }\n```\n\n### internal/builtin/reviewer/spec.go, lines 318 to 339: `inSpec`, called by `found`\n\n```\n318  // inSpec finds a spec finding's quotes again: its cause in the spec, as\n319  // the lenses were given it; its symptom, when it gives one, in the code at\n320  // head. Every finding on a spec is its author's to fix.\n321  func inSpec(repo string, st state, f Finding) (Finding, string) {\n322  \tsp := st.Spec\n323  \tif f.Cause.Path != sp.Path {\n324  \t\treturn f, fmt.Sprintf(\"its cause names %s, not the spec reviewed, %s\", f.Cause.Path, sp.Path)\n325  \t}\n326  \tplaces := locate(strings.Split(sp.Text, \"\\n\"), f.Cause.Quote)\n327  \tif len(places) == 0 {\n328  \t\treturn f, fmt.Sprintf(\"its cause is not found in %s, as the lenses were given it\", sp.Path)\n329  \t}\n330  \tf.Where, f.Related = fmt.Sprintf(\"%s:%d\", sp.Path, places[0].From), true\n331  \tif f.Symptom != nil {\n332  \t\tf.Symptom.Path = clean(f.Symptom.Path)\n333  \t\ttext, ok := fileAt(repo, st.Head, f.Symptom.Path)\n334  \t\tif !ok || len(locate(strings.Split(text, \"\\n\"), f.Symptom.Quote)) == 0 {\n335  \t\t\treturn f, fmt.Sprintf(\"its symptom is not found in %s as it reads at %s\", f.Symptom.Path, short(st.Head))\n336  \t\t}\n337  \t}\n338  \treturn f, \"\"\n339  }\n```\n\nNot shown, past 200 lines: `issueOf` (internal/builtin/reviewer/intent.go:42-51, called by `found`); `fileAt` (internal/builtin/reviewer/diff.go:135-139, called by `found`); `norm` (internal/builtin/reviewer/diff.go:160-162, called by `found`); `short` (internal/builtin/reviewer/reviewer.go:1739-1744, called by `found`); `lineKeyOf` (internal/builtin/reviewer/lines.go:68-88, calls `found`); `lineBody` (internal/builtin/reviewer/lines.go:98-121, calls `found`); `enclosing` (internal/builtin/reviewer/reach.go:115-138, calls `found`); `defs` (internal/builtin/reviewer/reach.go:356-407, calls `found`); `reach` (internal/builtin/reviewer/reach.go:519-641, calls `found`); `prepare` (internal/builtin/reviewer/reviewer.go:182-324, calls `found`); `ask` (internal/builtin/reviewer/reviewer.go:481-569, calls `found`); `readLenses` (internal/builtin/reviewer/reviewer.go:663-868, calls `found`); and 8 more. What would prove or refute the finding may lie in them.\n\n## What the change did to internal/builtin/reviewer/reviewer.go, near the cause\n\n```diff\ndiff --git a/internal/builtin/reviewer/reviewer.go b/internal/builtin/reviewer/reviewer.go\nindex 9cd3d98..0daba1d 100644\n--- a/internal/builtin/reviewer/reviewer.go\n+++ b/internal/builtin/reviewer/reviewer.go\n@@ -938,7 +939,7 @@ func found(repo string, st state, lens string, cites bool, v any) (Finding, stri\n \t\tfor _, p := range places {\n \t\t\t