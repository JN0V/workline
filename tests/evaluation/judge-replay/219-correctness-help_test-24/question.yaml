{"material":"## The finding\n\nimportant: Conformance test crashes on blank line in help listing\n\nWhy: strings.Fields(l)[0] panics with index out of range if a line of the list is empty, for example if the listing ends with a trailing newline or a command's help wraps.\n\nIts cause, quoted:\n\n```\nname := strings.Fields(l)[0]\n```\n\n## tests/conformance/help_test.go, lines 9 to 37\n\n```\n9  // Every command `workline --help` lists answers `workline \u003ccommand\u003e --help`\n10  // with its own usage on stdout, and exits 0: a person or a script holding\n11  // only the binary finds each command's arguments and options.\n12  func TestEveryCommandHasHelp(t *testing.T) {\n13  \tout, err := exec.Command(engineBin, \"--help\").Output()\n14  \tif err != nil {\n15  \t\tt.Fatalf(\"workline --help: %v\", err)\n16  \t}\n17  \t_, list, ok := strings.Cut(string(out), \"\\nCommands:\\n\")\n18  \tif !ok {\n19  \t\tt.Fatalf(\"workline --help lists no commands:\\n%s\", out)\n20  \t}\n21  \tlist, _, _ = strings.Cut(list, \"\\n\\n\")\n22  \tn := 0\n23  \tfor _, l := range strings.Split(list, \"\\n\") {\n24  \t\tname := strings.Fields(l)[0]\n25  \t\tn++\n26  \t\tcmd := exec.Command(engineBin, name, \"--help\")\n27  \t\tcmd.Env = hermeticEnv()\n28  \t\tgot, err := cmd.Output()\n29  \t\tif err != nil || !strings.HasPrefix(string(got), \"usage: workline \") {\n30  \t\t\tt.Errorf(\"workline %s --help: %v\\n%s\", name, err, got)\n31  \t\t}\n32  \t}\n33  \tif n \u003c 10 {\n34  \t\tt.Errorf(\"workline --help lists %d commands\", n)\n35  \t}\n36  }\n37  \n```\n\n## What the change did to tests/conformance/help_test.go\n\n```diff\ndiff --git a/tests/conformance/help_test.go b/tests/conformance/help_test.go\nnew file mode 100644\nindex 0000000..3ce2cad\n--- /dev/null\n+++ b/tests/conformance/help_test.go\n@@ -0,0 +1,36 @@\n+package conformance\n+\n+import (\n+\t\"os/exec\"\n+\t\"strings\"\n+\t\"testing\"\n+)\n+\n+// Every command `workline --help` lists answers `workline \u003ccommand\u003e --help`\n+// with its own usage on stdout, and exits 0: a person or a script holding\n+// only the binary finds each command's arguments and options.\n+func TestEveryCommandHasHelp(t *testing.T) {\n+\tout, err := exec.Command(engineBin, \"--help\").Output()\n+\tif err != nil {\n+\t\tt.Fatalf(\"workline --help: %v\", err)\n+\t}\n+\t_, list, ok := strings.Cut(string(out), \"\\nCommands:\\n\")\n+\tif !ok {\n+\t\tt.Fatalf(\"workline --help lists no commands:\\n%s\", out)\n+\t}\n+\tlist, _, _ = strings.Cut(list, \"\\n\\n\")\n+\tn := 0\n+\tfor _, l := range strings.Split(list, \"\\n\") {\n+\t\tname := strings.Fields(l)[0]\n+\t\tn++\n+\t\tcmd := exec.Command(engineBin, name, \"--help\")\n+\t\tcmd.Env = hermeticEnv()\n+\t\tgot, err := cmd.Output()\n+\t\tif err != nil || !strings.HasPrefix(string(got), \"usage: workline \") {\n+\t\t\tt.Errorf(\"workline %s --help: %v\\n%s\", name, err, got)\n+\t\t}\n+\t}\n+\tif n \u003c 10 {\n+\t\tt.Errorf(\"workline --help lists %d commands\", n)\n+\t}\n+}\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}