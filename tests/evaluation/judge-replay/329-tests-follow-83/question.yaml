{"material":"## The finding\n\nimportant: Verdict-only mode has no test\n\nWhy: `--verdict-only` is new. It makes follow keep the verdict and return before doing anything else. It is also the path the new `verdict` CI job relies on to keep the verdict. The tests shown cover neither this early return nor the refusal when `--verdict` is missing. If the early return were removed, a verdict-only job would run the whole follow, and nothing would fail.\n\nIts cause, quoted:\n\n```\nif o.VerdictOnly {\n\t\tres.Summary = \"the line's verdict kept, nothing else followed\"\n\t\treturn res\n\t}\n```\n\n## The code it stands on\n\nAs it reads at 3e401fb: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/engine/follow.go, lines 17 to 140: `Follow`, the function the cause lies in\n\n```\n17  // Follow keeps a role's release merge requests (fixElsewhere's, ADR-0017)\n18  // on the tip of base, as a release tool keeps its own branch: run when base\n19  // moves, it rebuilds each open one whose branch base moved under, by\n20  // redoing the branch's change on base's new tip, and force-pushes it — the\n21  // merge request stays the same (ADR-0034). A branch already on base's tip\n22  // is left as it is; one a person committed to is never rebuilt over them;\n23  // one whose change no longer applies is left for a person.\n24  //\n25  // With gardening, run when gardening runs, it tends the roles' other merge\n26  // requests too, one a task (ADR-0006): each base moved under is rebuilt\n27  // the same way, or closed, one comment saying why, when nothing of it is\n28  // left to merge — base holds its change already, base changed the lines it\n29  // changed, or it only records when docs were read. One a person committed\n30  // to is left to them, and named only when it no longer merges (ADR-0034,\n31  // amended).\n32  //\n33  // With People, the project's choice, it merges base into each person's\n34  // merge request left in conflict with it only on lines workline writes,\n35  // those settled: a doc's record of when it was checked, a derived block\n36  // (ADR-0041; settle.go).\n37  //\n38  // With Merge, the project's merge policy, it turns the forge's auto-merge\n39  // on for each merge request a person accepted, its head's verdict passed,\n40  // and brings the first in line up to date with base, one at a time\n41  // (ADR-0042; merge.go). Verdict, a head's verdict the line wrote, is kept\n42  // first, in hand for this run and, where the forge keeps it, for the next.\n43  func Follow(o FollowOptions) *Result {\n44  \trepo, forgeSpec, base, gardening := o.Repo, o.Forge, o.Base, o.Gardening\n45  \tres := \u0026Result{Status: verdict.Pass, Applied: []string{}, Refused: []string{}}\n46  \tfail := func(err error) *Result {\n47  \t\tres.Status = verdict.Block\n48  \t\tif errors.Is(err, forge.ErrUnreachable) {\n49  \t\t\tres.Status = verdict.BlockedExternal\n50  \t\t}\n51  \t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"follow-failed\", Message: err.Error()})\n52  \t\treturn res\n53  \t}\n54  \tf, err := forge.Open(forgeSpec, repo)\n55  \tif err != nil {\n56  \t\treturn fail(err)\n57  \t}\n58  \tif f == nil {\n59  \t\treturn fail(errors.New(\"follow needs a forge: \" + forge.Missing))\n60  \t}\n61  \tif base == \"\" {\n62  \t\tif base, err = git(repo, nil, \"symbolic-ref\", \"-q\", \"--short\", \"HEAD\"); err != nil {\n63  \t\t\treturn fail(errors.New(\"on no branch: give the branch the merge requests go into with --base\"))\n64  \t\t}\n65  \t}\n66  \tlocal := forge.KeepsBranches(f)\n67  \thand := map[string]kept{}\n68  \tm, merges := f.(forge.Merger)\n69  \tswitch {\n70  \tcase o.Verdict != \"\" \u0026\u0026 o.Merge != \"\" \u0026\u0026 merges \u0026\u0026 !local:\n71  \t\tfinding, err := keepVerdict(m, o.Verdict, hand)\n72  \t\tif err != nil {\n73  \t\t\treturn fail(err)\n74  \t\t}\n75  \t\tres.Findings = append(res.Findings, finding)\n76  \tcase o.Verdict != \"\" \u0026\u0026 o.Merge != \"\":\n77  \t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"verdict-not-kept\", Level: \"warn\",\n78  \t\t\tMessage: \"this forge has no auto-merge workline can turn on: the line's verdict is not kept\"})\n79  \tcase o.Verdict != \"\":\n80  \t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"verdict-not-kept\",\n81  \t\t\tMessage: \"the project sets no merge policy (`merge:`): the line's verdict is not kept\"})\n82  \t}\n83  \tif o.VerdictOnly {\n84  \t\tres.Summary = \"the line's verdict kept, nothing else followed\"\n85  \t\treturn res\n86  \t}\n87  \topen, err := f.OpenMergeRequests(\"workline/\")\n88  \tif err != nil {\n89  \t\treturn fail(err)\n90  \t}\n91  \tn, rebuilt, closed := 0, 0, 0\n92  \tfor _, branch := range open {\n93  \t\trole, task, ok := strings.Cut(strings.TrimPrefix(branch, \"workline/\"), \"/\")\n94  \t\tif !ok || task != \"release\" \u0026\u0026 !gardening {\n95  \t\t\tcontinue\n96  \t\t}\n97  \t\tn++\n98  \t\tfinding, err := follow(repo, base, branch, role, local, task != \"release\")\n99  \t\tif err != nil {\n100  \t\t\treturn fail(err)\n101  \t\t}\n102  \t\tswitch finding.Rule {\n103  \t\tcase \"\":\n104  \t\t\tcontinue\n105  \t\tcase \"no-longer-applies\":\n106  \t\t\tres.Status = verdict.Human\n107  \t\tcase \"rebuilt\":\n108  \t\t\trebuilt++\n109  \t\tcase \"closed\":\n110  \t\t\t// The forge's own close, its comment saying why; the branch\n111  \t\t\t// stays, for the next run of the task to propose again from.\n112  \t\t\tif err := f.CloseMergeRequest(branch, \"Closed by workline's \"+role+\": \"+finding.Message+\".\", forge.Marker(\"closed\")); err != nil {\n113  \t\t\t\treturn fail(err)\n114  \t\t\t}\n115  \t\t\tclosed++\n116  \t\t}\n117  \t\tres.Findings = append(res.Findings, finding)\n118  \t}\n119  \tif gardening {\n120  \t\tres.Summary = fmt.Sprintf(\"%d merge requests of the roles open, %d rebuilt on %s, %d closed\", n, rebuilt, base, closed)\n121  \t} else {\n122  \t\tres.Summary = fmt.Sprintf(\"%d release merge requests open, %d rebuilt on %s\", n, rebuilt, base)\n123  \t}\n124  \to.Base = base\n125  \tif o.People {\n126  \t\tsum, err := people(f, o, local, res)\n127  \t\tif err != nil {\n128  \t\t\treturn fail(err)\n129  \t\t}\n130  \t\tres.Summary += \"; \" + sum\n131  \t}\n132  \tif o.Merge != \"\" {\n133  \t\tsum, err := mergePolicy(f, o, local, res, hand)\n134  \t\tif err != nil {\n135  \t\t\treturn fail(err)\n136  \t\t}\n137  \t\tres.Summary += \"; \" + sum\n138  \t}\n139  \treturn res\n140  }\n```\n\n### internal/role/config.go, lines 17 to 17: `Error`, called by `Follow`\n\n```\n17  func (e *ConfigError) Error() string { return \".workline/config.yaml: \" + e.msg }\n```\n\n### internal/engine/engine.go, lines 2605 to 2614: `git`, called by `Follow`\n\n```\n2605  func git(repo string, stdin io.Reader, args ...string) (string, error) {\n2606  \tcmd := exec.Command(\"git\", append([]string{\"-C\", repo, \"-c\", \"core.quotePath=off\"}, args...)...)\n2607  \tcmd.Stdin = stdin\n2608  \tvar out, errOut strings.Builder\n2609  \tcmd.Stdout, cmd.Stderr = \u0026out, \u0026errOut\n2610  \tif err := cmd.Run(); err != nil {\n2611  \t\treturn \"\", fmt.Errorf(\"git %s: %v: %s\", args[0], err, strings.TrimSpace(errOut.String()))\n2612  \t}\n2613  \treturn strings.TrimSpace(out.String()), nil\n2614  }\n```\n\n### internal/forge/forge.go, lines 325 to 330: `KeepsBranches`, called by `Follow`\n\n```\n325  // KeepsBranches says whether f's merge requests come from local branches:\n326  // nothing is pushed to a remote, nor fetched from one.\n327  func KeepsBranches(f Forge) bool {\n328  \t_, ok := f.(interface{ keepsBranches() })\n329  \treturn ok\n330  }\n```\n\n### internal/engine/merge.go, lines 133 to 153: `keepVerdict`, called by `Follow`\n\n```\n133  // keepVerdict keeps the verdict the file holds on its head where only the\n134  // token `follow` holds writes it (GitHub: the status workline/verdict, by\n135  // the App; a writer's own status is never read), and has it in hand for\n136  // this run: the pipeline that judged the head reads it there (GitLab).\n137  func keepVerdict(m forge.Merger, file string, hand map[string]kept) (verdict.Finding, error) {\n138  \tdata, err := os.ReadFile(file)\n139  \tif err != nil {\n140  \t\treturn verdict.Finding{}, fmt.Errorf(\"the verdict to keep: %w\", err)\n141  \t}\n142  \tvar v HeadVerdict\n143  \tif err := json.Unmarshal(data, \u0026v); err != nil || v.Head == \"\" || v.Status == \"\" {\n144  \t\treturn verdict.Finding{}, fmt.Errorf(\"the verdict to keep, %s: no head and status in it (%v)\", file, err)\n145  \t}\n146  \tclass, why := v.class()\n147  \tif err := m.KeepVerdict(v.Head, class, why); err != nil {\n148  \t\treturn verdict.Finding{}, err\n149  \t}\n150  \thand[v.Head] = kept{class, why}\n151  \treturn verdict.Finding{Rule: \"verdict-kept\", Where: short(v.Head),\n152  \t\tMessage: fmt.Sprintf(\"the line's verdict on %s: %s, %s\", short(v.Head), class, why)}, nil\n153  }\n```\n\n### internal/forge/forge.go, lines 332 to 333: `Marker`, called by `Follow`\n\n```\n332  // Marker is the hidden text that makes a comment findable again.\n333  func Marker(key string) string { return \"\u003c!-- workline:\" + key + \" --\u003e\" }\n```\n\nNot shown, past 200 lines: `follow` (internal/engine/follow.go:142-243, called by `Follow`); `people` (internal/engine/settle.go:54-100, called by `Follow`); `mergePolicy` (internal/engine/merge.go:384-503, called by `Follow`); `followCmd` (cmd/workline/main.go:70-131, calls `Follow`). What would prove or refute the finding may lie in them.\n\nNot shown, defined in too many places to tell which: `Open` (3 definitions), `OpenMergeRequests` (5 definitions), `CloseMergeRequest` (5 definitions), `Verdict` (5 definitions).\n\n## What the change did to internal/engine/follow.go, near the cause\n\n```diff\ndiff --git a/internal/engine/follow.go b/internal/engine/follow.go\nindex af8d0ca..3e1bfbd 100644\n--- a/internal/engine/follow.go\n+++ b/internal/engine/follow.go\n@@ -34,6 +34,12 @@ import (\n // merge request left in conflict with it only on lines workline writes,\n // those settled: a doc's record of when it was checked, a derived block\n // (ADR-0041; settle.go).\n+//\n+// With Merge, the project's merge policy, it turns the forge's auto-merge\n+// on for each merge request a person accepted, its head's verdict passed,\n+// and brings the first in line up to date with base, one at a time\n+// (ADR-0042; merge.go). Verdict, a head's verdict the line wrote, is kept\n+// first, in hand for this run and, where the forge keeps it, for the next.\n func Follow(o FollowOptions) *Result {\n \trepo, forgeSpec, base, gardening := o.Repo, o.Forge, o.Base, o.Gardening\n \tres := \u0026Result{Status: verdict.Pass, Applied: []string{}, Refused: []string{}}\n@@ -57,11 +63,31 @@ func Follow(o FollowOptions) *Result {\n \t\t\treturn fail(errors.New(\"on no branch: give the branch the merge requests go into with --base\"))\n \t\t}\n \t}\n+\tlocal := forge.KeepsBranches(f)\n+\thand := map[string]kept{}\n+\tm, merges := f.(forge.Merger)\n+\tswitch {\n+\tcase o.Verdict != \"\" \u0026\u0026 o.Merge != \"\" \u0026\u0026 merges \u0026\u0026 !local:\n+\t\tfinding, err := keepVerdict(m, o.Verdict, hand)\n+\t\tif err != nil {\n+\t\t\treturn fail(err)\n+\t\t}\n+\t\tres.Findings = append(res.Findings, finding)\n+\tcase o.Verdict != \"\" \u0026\u0026 o.Merge != \"\":\n+\t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"verdict-not-kept\", Level: \"warn\",\n+\t\t\tMessage: \"this forge has no auto-merge workline can turn on: the line's verdict is not kept\"})\n+\tcase o.Verdict != \"\":\n+\t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"verdict-not-kept\",\n+\t\t\tMessage: \"the project sets no merge policy (`merge:`): the line's verdict is not kept\"})\n+\t}\n+\tif o.VerdictOnly {\n+\t\tres.Summary = \"the line's verdict kept, nothing else followed\"\n+\t\treturn res\n+\t}\n \topen, err := f.OpenMergeRequests(\"workline/\")\n \tif err != nil {\n \t\treturn fail(err)\n \t}\n-\tlocal := forge.KeepsBranches(f)\n \tn, rebuilt, closed := 0, 0, 0\n \tfor _, branch := range open {\n \t\trole, task, ok := strings.Cut(strings.TrimPrefix(branch, \"workline/\"), \"/\")\n@@ -95,14 +121,21 @@ func Follow(o FollowOptions) *Result {\n \t} else {\n \t\tres.Summary = fmt.Sprintf(\"%d release merge requests open, %d rebuilt on %s\", n, rebuilt, base)\n \t}\n+\to.Base = base\n \tif o.People {\n-\t\to.Base = base\n \t\tsum, err := people(f, o, local, res)\n \t\tif err != nil {\n \t\t\treturn fail(err)\n \t\t}\n \t\tres.Summary += \"; \" + sum\n \t}\n+\tif o.Merge != \"\" {\n+\t\tsum, err := mergePolicy(f, o, local, res, hand)\n+\t\tif err != nil {\n+\t\t\treturn fail(err)\n+\t\t}\n+\t\tres.Summary += \"; \" + sum\n+\t}\n \treturn res\n }\n \n```\n\n## The tests that touch internal/engine/follow.go\n\nThe test files in internal/engine/ and those naming `follow`, as they read at 3e401fb.\n\n### internal/engine/engine_test.go\n\n```\npackage engine\n\nimport \"testing\"\n\nfunc TestAskAgain(t *testing.T) {\n\tfor _, c := range []struct {\n\t\tpromoteAfter int\n\t\twant         string // tier of each attempt after the first, until it stops\n\t}{\n\t\t{0, \"\"},\n\t\t{1, \"standard\"},\n\t\t{2, \"light standard\"},\n\t\t{3, \"light light standard\"},\n\t} {\n\t\tgot, tier := \"\", \"light\"\n\t\tfor failures := 1; ; failures++ {\n\t\t\tretry, next := askAgain(failures, c.promoteAfter, tier)\n\t\t\tif !retry {\n\t\t\t\tbreak\n\t\t\t}\n\t\t\ttier = next\n\t\t\tgot += \" \" + tier\n\t\t}\n\t\tif got != \" \"+c.want \u0026\u0026 !(c.want == \"\" \u0026\u0026 got == \"\") {\n\t\t\tt.Errorf(\"promote-after %d: attempts after the first on %q, want %q\", c.promoteAfter, got, c.want)\n\t\t}\n\t}\n}\n\n// An answer broken in one claim is read claim by claim; a claim holding\n// code pasted with its tabs, or a text cut by ` #`, is mended as the whole\n// answer would be (agent.Mend), never counted as unreadable.\nfunc TestClaimsOneByOneMended(t *testing.T) {\n\tanswer := \"- claim:\\n    quote: |\\n\\tif ok {\\n    why: covered by #20 too\\n\" +\n\t\t\"- claim: {quote: \\\"a\\\"\\n\" +\n\t\t\"- claim:\\n    quote: |\\n        x\\n}\\n\" + // a line at the start of the line: the item broken, not cut\n\t\t\"- claim:\\n    why: see #3 below\\n```\\nThat is all.\\n\"\n\tread, broken, mended := claimsOneByOne(answer)\n\tif read != 2 || len(broken) != 2 || len(mended) != 2 || mended[1][0] != '2' {\n\t\tt.Fatalf(\"read %d, broken %v, mended %q\", read, broken, mended)\n\t}\n\tclaims := claimsRead(answer)\n\tc := claims[0].Value.(map[string]any)\n\tif c[\"quote\"] != \"\\tif ok {\\n\" || c[\"why\"] != \"covered by #20 too\" {\n\t\tt.Errorf(\"the claim was not read as written: %q\", c)\n\t}\n\tif c := claims[1].Value.(map[string]any); c[\"why\"] != \"see #3 below\" {\n\t\tt.Errorf(\"the claim before the fence was not read as written: %q\", c)\n\t}\n\tif b := broken[1].Value.(map[string]any)[\"unreadable\"]; b != \"- claim:\\n    quote: |\\n        x\\n}\" {\n\t\tt.Errorf(\"the broken claim is not kept whole: %q\", b)\n\t}\n\t// A line saying no count is said as it is.\n\tif got := mendedTogether([]string{\"2 blocks\", \"a block\", \"1 text\", \"1 blocks\", \"a block\"}); len(got) != 3 || got[0] != \"3 blocks\" || got[1] != \"a block\" {\n\t\tt.Errorf(\"mended together: %q\", got)\n\t}\n}\n\nfunc TestOverBudgetSummary(t *testing.T) {\n\tconst head = \"the task was over the role's context budget and nobody judged it: a person does\"\n\tif got := overBudgetSummary(\"\"); got != head {\n\t\tt.Errorf(\"empty: got %q\", got)\n\t}\n\tif got := overBudgetSummary(\"docs to check\"); got != head+\" (docs to check)\" {\n\t\tt.Errorf(\"said: got %q\", got)\n\t}\n}\n```\n\n### internal/engine/follow_test.go\n\n```\npackage engine\n\nimport (\n\t\"errors\"\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"strings\"\n\t\"testing\"\n)\n\n// A gardening branch a person committed to, main moved under it: named\n// when git finds a conflict; when git cannot tell, said as such\n// (`conflict-unread`), never as a conflict it may not be; left without a\n// word when it merges.\nfunc TestFollowAPersonsBranch(t *testing.T) {\n\trepo := t.TempDir()\n\trun := func(args ...string) {\n\t\tt.Helper()\n\t\tcmd := exec.Command(\"git\", append([]string{\"-C\", repo, \"-c\", \"core.hooksPath=/dev/null\", \"-c\", \"user.name=T\", \"-c\", \"user.email=t@example.invalid\"}, args...)...)\n\t\tif out, err := cmd.CombinedOutput(); err != nil {\n\t\t\tt.Fatalf(\"git %v: %s\", args, out)\n\t\t}\n\t}\n\twrite := func(p, s string) {\n\t\tif err := os.WriteFile(filepath.Join(repo, p), []byte(s), 0o644); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t}\n\trun(\"init\", \"-q\", \"-b\", \"main\")\n\twrite(\"doc.md\", \"---\\nchecked: 111\\n---\\nOne hour.\\n\")\n\trun(\"add\", \"doc.md\")\n\trun(\"commit\", \"-q\", \"-m\", \"docs: one hour\")\n\trun(\"checkout\", \"-q\", \"-b\", \"workline/documentalist/suspect\")\n\twrite(\"doc.md\", \"---\\nchecked: 111\\n---\\nTwo hours.\\n\")\n\trun(\"commit\", \"-q\", \"-am\", \"docs: two hours\", \"-m\", OwnTrailer+\": documentalist\")\n\twrite(\"note.md\", \"A person's note.\\n\")\n\trun(\"add\", \"note.md\")\n\trun(\"commit\", \"-q\", \"-m\", \"docs: a person's note\")\n\trun(\"checkout\", \"-q\", \"main\")\n\twrite(\"other.md\", \"Elsewhere.\\n\")\n\trun(\"add\", \"other.md\")\n\trun(\"commit\", \"-q\", \"-m\", \"docs: elsewhere\")\n\n\tbranch := \"workline/documentalist/suspect\"\n\tif f, err := follow(repo, \"main\", branch, \"documentalist\", true, true); err != nil || f.Rule != \"\" {\n\t\tt.Errorf(\"merging still: %+v, %v; want nothing said\", f, err)\n\t}\n\twas := conflicts\n\tdefer func() { conflicts = was }()\n\tconflicts = func(string, string, string) (bool, error) { return false, errors.New(\"git merge-tree: unknown option\") }\n\tif f, err := follow(repo, \"main\", branch, \"documentalist\", true, true); err != nil || f.Rule != \"conflict-unread\" || f.Level != \"warn\" {\n\t\tt.Errorf(\"git failing: %+v, %v; want conflict-unread, a warning\", f, err)\n\t}\n\tconflicts = was\n\twrite(\"doc.md\", \"---\\nchecked: 111\\n---\\nNinety minutes.\\n\")\n\trun(\"commit\", \"-q\", \"-am\", \"docs: ninety minutes\")\n\tif f, err := follow(repo, \"main\", branch, \"documentalist\", true, true); err != nil || f.Rule != \"not-rebuilt\" {\n\t\tt.Errorf(\"in conflict: %+v, %v; want not-rebuilt\", f, err)\n\t}\n}\n\n// A doc's header lines recording when it was read are left out, in a\n// front matter or a README's header; the same words in its body, or in a\n// doc with no header, are kept: they say what the doc says.\nfunc TestUnrecorded(t *testing.T) {\n\tcases := []struct{ doc, want string }{\n\t\t{\"---\\nsources: [a.go]\\nchecked: 111\\njudged: 222\\njudged-in-parts: 333\\nverified: agent:x\\n---\\n# T\\n\\njudged: kept\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\njudged: kept\\n\"},\n\t\t{\"\u003c!-- workline\\nsources: [a.go]\\njudged: 222\\n--\u003e\\n# T\\n\", \"\u003c!-- workline\\nsources: [a.go]\\n--\u003e\\n# T\\n\"},\n\t\t{\"# T\\n\\njudged: 222\\n\", \"# T\\n\\njudged: 222\\n\"},\n\t\t{\"---\\njudged: 222\\nno end\\n\", \"---\\njudged: 222\\nno end\\n\"},\n\t}\n\tfor _, c := range cases {\n\t\tif got := unrecorded(c.doc); got != c.want {\n\t\t\tt.Errorf(\"unrecorded(%q) = %q, want %q\", c.doc, got, c.want)\n\t\t}\n\t}\n}\n\nfunc TestMergeDocFrontMatterByKey(t *testing.T) {\n\told := \"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\"\n\tcases := []struct {\n\t\tname, ours, theirs, want string\n\t\tok                       bool\n\t}{\n\t\t{\"base moved checked, the branch added judged beside it\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 222\\n---\\n# T\\n\\nOne hour.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\njudged: 333\\n---\\n# T\\n\\nTwo hours.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 222\\njudged: 333\\n---\\n# T\\n\\nTwo hours.\\n\", true},\n\t\t{\"both moved checked: base's, the later judgement\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 222\\n---\\n# T\\n\\nOne hour.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 333\\n---\\n# T\\n\\nOne hour.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 222\\n---\\n# T\\n\\nOne hour.\\n\", true},\n\t\t{\"the branch added a key first\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 222\\n---\\n# T\\n\\nOne hour.\\n\",\n\t\t\t\"---\\ntype: reference\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\",\n\t\t\t\"---\\ntype: reference\\nsources: [a.go]\\nchecked: 222\\n---\\n# T\\n\\nOne hour.\\n\", true},\n\t\t{\"both changed the same sentence\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nNinety minutes.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nTwo hours.\\n\",\n\t\t\t\"\", false},\n\t\t{\"README's header, merged as a front matter\",\n\t\t\t\"\u003c!-- workline\\nsources: [a.go]\\nchecked: 222\\n--\u003e\\n# T\\n\\nOne hour.\\n\",\n\t\t\t\"\u003c!-- workline\\nsources: [a.go]\\nchecked: 111\\njudged: 333\\n--\u003e\\n# T\\n\\nTwo hours.\\n\",\n\t\t\t\"\u003c!-- workline\\nsources: [a.go]\\nchecked: 222\\njudged: 333\\n--\u003e\\n# T\\n\\nTwo hours.\\n\", true},\n\t}\n\tfor _, c := range cases {\n\t\tfrom := old\n\t\tif strings.HasPrefix(c.ours, \"\u003c!--\") {\n\t\t\tfrom = \"\u003c!-- workline\\nsources: [a.go]\\nchecked: 111\\n--\u003e\\n# T\\n\\nOne hour.\\n\"\n\t\t}\n\t\tgot, ok := mergeDoc(t.TempDir(), from, c.ours, c.theirs)\n\t\tif ok != c.ok || (ok \u0026\u0026 got != c.want) {\n\t\t\tt.Errorf(\"%s: got %v %q, want %v %q\", c.name, ok, got, c.ok, c.want)\n\t\t}\n\t}\n}\n\n// On a person's branch (ADR-0041), a doc is settled only where every\n// conflict is in a line workline writes: a header key of its own both\n// changed takes base's, another is a clash; a derived block is base's; the\n// rest is git's own merge, a conflict there the person's.\nfunc TestSettleDoc(t *testing.T) {\n\trepo := t.TempDir()\n\tif out, err := exec.Command(\"git\", \"init\", \"-q\", repo).CombinedOutput(); err != nil {\n\t\tt.Fatalf(\"git init: %s\", out)\n\t}\n\told := \"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\"\n\tcases := []struct {\n\t\tname, branch, base, want string\n\t\tok                       bool\n\t}{\n\t\t{\"checked both moved: base's; the branch's text kept\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 222\\n---\\n# T\\n\\nTwo hours.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 333\\nverified: agent:x\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 333\\nverified: agent:x\\n---\\n# T\\n\\nTwo hours.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\", true},\n\t\t{\"a derived block both changed: base's\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e4\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e5\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e5\u003c!-- workline:end --\u003e cases.\\n\", true},\n\t\t{\"sources both changed: the person's\",\n\t\t\t\"---\\nsources: [a.go, b.go]\\nchecked: 222\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"---\\nsources: [a.go, c.go]\\nchecked: 333\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"\", false},\n\t\t{\"a sentence both changed: the person's\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 222\\n---\\n# T\\n\\nTwo hours.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 333\\n---\\n# T\\n\\nNinety minutes.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\",\n\t\t\t\"\", false},\n\t\t{\"the words beside a derived block both changed: the person's\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e4\u003c!-- workline:end --\u003e cases pass.\\n\",\n\t\t\t\"---\\nsources: [a.go]\\nchecked: 111\\n---\\n# T\\n\\nOne hour.\\n\\n\u003c!-- workline:derive n --\u003e5\u003c!-- workline:end --\u003e cases run.\\n\",\n\t\t\t\"\", false},\n\t}\n\tfor _, c := range cases {\n\t\tgot, ok, err := settleDoc(repo, \"docs/t.md\", old, c.branch, c.base)\n\t\tif err != nil || ok != c.ok || (ok \u0026\u0026 got != c.want) {\n\t\t\tt.Errorf(\"%s: got %v %q (%v), want %v %q\", c.name, ok, got, err, c.ok, c.want)\n\t\t}\n\t}\n\t// A derive marker with no end of its own is no block: the person's\n\t// text after it, up to another block's end, is never taken for base's.\n\tunclosed := \"# T\\n\\n\u003c!-- workline:derive a --\u003e stray\\n\\nMy words.\\n\\n\u003c!-- workline:derive n --\u003e3\u003c!-- workline:end --\u003e cases.\\n\"\n\tonBase := \"# T\\n\\n\u003c!-- workline:derive a --\u003e stray\\n\\nTheir words.\\n\\n\u003c!-- workline:derive n --\u003e5\u003c!-- workline:end --\u003e cases.\\n\"\n\tif got := asBase(unclosed, onBase); got != \"# T\\n\\n\u003c!-- workline:derive a --\u003e stray\\n\\nMy words.\\n\\n\u003c!-- workline:derive n --\u003e5\u003c!-- workline:end --\u003e cases.\\n\" {\n\t\tt.Errorf(\"an unclosed marker: %q\", got)\n\t}\n\t// A header not set one key a line is merged as text: both moving\n\t// `checked` beside a list of sources is left to the person.\n\tlisted := \"---\\nsources:\\n  - a.go\\nchecked: 111\\n---\\n# T\\n\"\n\tif _, ok, err := settleDoc(repo, \"docs/t.md\", listed, strings.Replace(listed, \"111\", \"222\", 1), strings.Replace(listed, \"111\", \"333\", 1)); ok || err != nil {\n\t\tt.Errorf(\"a header of several lines a key: settled (%v), want it left\", err)\n\t}\n}\n```\n\n### tests/conformance/cases/cli/help-command-lists-every-command.yaml\n\n```\ncase: cli/help-command-lists-every-command\nabout: workline help is --help.\ngiven: {repo: basic}\nrun: {cli: [help]}\nexpect:\n  exit: 0\n  stdout: [\"  run-role \", \"  route \", \"  apply \", \"  review \", \"  gate \", \"  item \", \"  issues \", \"  docs \", \"  sample \", \"  follow \", \"  init \", \"  setup \", \"  doctor \", \"  hooks \", \"  version \", \"  help \", \"hook, builtin\", \"workline \u003ccommand\u003e --help\"]\n```\n\n### tests/conformance/cases/cli/help-lists-every-command.yaml\n\n```\ncase: cli/help-lists-every-command\nabout: workline --help lists every command a person may run, one line each, on stdout, and exits 0.\ngiven: {repo: basic}\nrun: {cli: [--help]}\nexpect:\n  exit: 0\n  stdout: [\"  run-role \", \"  route \", \"  apply \", \"  review \", \"  gate \", \"  item \", \"  issues \", \"  docs \", \"  sample \", \"  follow \", \"  init \", \"  setup \", \"  doctor \", \"  hooks \", \"  version \", \"  help \", \"hook, builtin\", \"workline \u003ccommand\u003e --help\"]\n```\n\n### tests/conformance/cases/documentalist/comment-disagrees-reported.yaml\n\n```\ncase: documentalist/comment-disagrees-reported\nabout: \"A comment given as the only reason for a fix is reported for a person (`comment-disagrees`, at the comment's file), and the place it changed left as it was, the agent not asked again (ADR-0014, steps 2 and 4).\"\ngiven:\n  repo: documented\n  setup: [\"sed -i 's|// Tokens last one hour.|// Tokens last thirty minutes.|' src/auth/token.go \u0026\u0026 git commit -qam 'docs(auth): say how long tokens last'\"]\nrun: {role: documentalist, event: merge-request, ai: \"cmd:sh $FIXTURES/agents/follow-the-comment.sh confirms\"}\nexpect:\n  status: pass\n  agent-calls: 1\n  applied: [patch]\n  findings: [{rule: comment-disagrees, where: src/auth/token.go, message: \"src/auth/token.go:3\"}]\n  files: {\"docs/tech/auth.md\": {contains: \"one hour\", lacks: \"thirty\"}}\n```\n\n### tests/conformance/cases/documentalist/comment-not-evidence-refused.yaml\n\n```\ncase: documentalist/comment-not-evidence-refused\nabout: \"A fix whose only cited source is a code comment is refused (`comment-not-evidence`): a stale comment won over the code's setting (workline #29). Here the comment says thirty minutes, the setting still one hour: the place is left as it was, reported for a person, and the agent not asked again (ADR-0014, steps 2 and 4).\"\ngiven:\n  repo: documented\n  setup: [\"sed -i 's|// Tokens last one hour.|// Tokens last thirty minutes.|' src/auth/token.go \u0026\u0026 git commit -qam 'docs(auth): say how long tokens last'\"]\nrun: {role: documentalist, event: merge-request, ai: \"cmd:sh $FIXTURES/agents/follow-the-comment.sh stubborn\"}\nexpect:\n  status: pass\n  agent-calls: 1\n  applied: [patch]\n  findings:\n    - {rule: comment-not-evidence, where: docs/tech/auth.md, message: \"src/auth/token.go:3\"}\n    - {rule: comment-disagrees, where: src/auth/token.go, message: \"src/auth/token.go:3\"}\n  files: {\"docs/tech/auth.md\": {contains: \"one hour\", lacks: \"thirty\"}}\n```\n\n### tests/conformance/cases/documentalist/comment-style-unknown-reported.yaml\n\n```\ncase: documentalist/comment-style-unknown-reported\nabout: \"A quote from a file whose type the comment test does not know is taken as code, and said: once per type, in the findings, so a comment there passing as evidence is not silent (docs/research/documentalist-genericity.md).\"\ngiven:\n  repo: documented\n  setup:\n    - \"git mv src/auth/token.go src/auth/token.qqq \u0026\u0026 printf 'ttl ~ 3600 ~~ Tokens last one hour.\\\\n' \u003e src/auth/token.qqq \u0026\u0026 sed -i 's|src/auth/token.go|src/auth/token.qqq|' docs/tech/auth.md \u0026\u0026 git add -A \u0026\u0026 git commit -qm 'refactor(auth): tokens in a new format' \u0026\u0026 C=$(git rev-parse --short HEAD) \u0026\u0026 sed -i \\\"s/^checked: .*/checked: $C/\\\" docs/tech/auth.md \u0026\u0026 git commit -qam 'docs(auth): confirm'\"\n    - \"sed -i 's|Tokens last one hour.|Tokens last thirty minutes.|' src/auth/token.qqq \u0026\u0026 git commit -qam 'docs(auth): say how long tokens last'\"\nrun: {role: documentalist, event: merge-request, ai: \"cmd:sh $FIXTURES/agents/follow-the-comment.sh stubborn src/auth/token.qqq\"}\nexpect:\n  status: pass\n  agent-calls: 1\n  applied: [patch]\n  findings:\n    - {rule: comment-style-unknown, where: src/auth/token.qqq, message: \".qqq\"}\n  no-findings: [{rule: comment-not-evidence}]\n```\n\nNot shown, past 300 lines: docs/spec/backlog-acts.md, docs/spec/conformance.md, docs/spec/conformance/cases.md, docs/spec/forge-command.md, docs/spec/model-grid.md, docs/spec/role-contract.md, docs/spec/role-outcome.md, docs/spec/routing.md, internal/backlog/change_test.go, internal/backlog/sections_test.go, tests/conformance/cases/documentalist/doc-fixed-in-a-rebased-merge-request.yaml, tests/conformance/cases/documentalist/doc-fixed-in-a-squashed-merge-request.yaml, tests/conformance/cases/documentalist/docstring-not-evidence-refused.yaml, tests/conformance/cases/documentalist/gardening-branch-a-person-committed-to-is-left.yaml, tests/conformance/cases/documentalist/gardening-branch-close-refused-said.yaml, tests/conformance/cases/documentalist/gardening-branch-closed-when-main-changed-its-lines-on-gitlab.yaml, tests/conformance/cases/documentalist/gardening-branch-closed-when-main-fixed-it.yaml, tests/conformance/cases/documentalist/gardening-branch-follows-main.yaml, tests/co