-\t\t\tif !found || err != nil || len(st.Split) == 0 {\n-\t\t\t\tbreak // its children not recorded yet: watched again\n+\t\t\tfor child, blockers := range st.After {\n+\t\t\t\town[child] = append(own[child], blockers...)\n \t\t\t}\n \t\t\tif all == nil {\n \t\t\t\tlist, err := f.AllIssues()\n \t\t\t\tif err != nil {\n-\t\t\t\t\treturn nil, nil, err\n+\t\t\t\t\treturn nil, nil, nil, err\n \t\t\t\t}\n \t\t\t\tall = map[int]forge.Issue{}\n \t\t\t\tfor _, x := range list {\n@@ -166,7 +201,24 @@ func findUndone(f forge.Backlog, role string, open map[int]forge.Issue, done []D\n \t\t\tstanding = append(standing, d)\n \t\t}\n \t}\n-\treturn standing, undone, nil\n+\treturn standing, undone, own, nil\n+}\n+\n+// splitState is a split parent's state as its comment holds it: empty\n+// when it has none; nil when it does not read — never taken for none.\n+func splitState(f forge.Backlog, role string, id int) (*State, error) {\n+\tnotes, err := f.Notes(forge.Target{Kind: \"issue\", ID: id})\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tst, found, err := ReadState(forge.Bodies(notes), role)\n+\tswitch {\n+\tcase err != nil:\n+\t\treturn nil, nil\n+\tcase !found:\n+\t\treturn \u0026State{}, nil\n+\t}\n+\treturn st, nil\n }\n \n func priorityName(n string) string {\n```\n\n(2 hunks further from the cause not shown.)\n\n## The tests that touch internal/backlog/undo.go\n\nThe test files in internal/backlog/ and those naming `undo`, as they read at cd59ce8.\n\n### internal/backlog/acts_test.go\n\n```\npackage backlog\n\nimport \"testing\"\n\nfunc TestSuggestFromActs(t *testing.T) {\n\tfor _, c := range []struct {\n\t\tlevel        string\n\t\tdone, undone int\n\t\twant         string\n\t}{\n\t\t{Normal, 9, 0, \"\"},            // too few\n\t\t{Normal, 10, 0, Enterprising}, // none undone\n\t\t{Normal, 10, 1, \"\"},           // one in ten: not more\n\t\t{Normal, 10, 2, Cautious},     // more than one in ten\n\t\t{Enterprising, 10, 0, \"\"},     // already the most\n\t\t{Enterprising, 20, 3, Normal}, // more than one in ten\n\t\t{Cautious, 30, 0, \"\"},         // the report's, from the proposals\n\t\t{\"unknown\", 30, 10, \"\"},       // a level not read: nothing\n\t} {\n\t\tif got, _ := SuggestFromActs(c.level, c.done, c.undone); got != c.want {\n\t\t\tt.Errorf(\"%s, %d done, %d undone: %q, want %q\", c.level, c.done, c.undone, got, c.want)\n\t\t}\n\t}\n}\n```\n\n### internal/backlog/agreement_test.go\n\n```\npackage backlog\n\nimport (\n\t\"encoding/json\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"testing\"\n\n\t\"github.com/JN0V/workline/internal/forge\"\n)\n\nconst role = \"product-owner\"\n\nvar proposal = \"@zed, the product owner read this issue.\\n\\n\" + engineBlock +\n\t\"\\n\\n```yaml\\nneed: Every row exported.\\nscope: WriteRows.\\n```\\n\u003c/details\u003e\\n\\n\" + ProposalMarker(role, 1)\n\n// Who agrees is the last word, after the last proposal, of the reporter\n// or a person of the project: a stranger's or a bot's comment is not\n// theirs to take back, nor to give.\nfunc TestAgreement(t *testing.T) {\n\tis := forge.Issue{ID: 9, Author: \"zed\"}\n\treporter := func(body string) forge.Note { return forge.Note{Body: body, Author: \"zed\"} }\n\tinsider := func(body string) forge.Note { return forge.Note{Body: body, Author: \"dev\", Insider: true} }\n\tstranger := func(body string) forge.Note { return forge.Note{Body: body, Author: \"mia\"} }\n\tbot := forge.Note{Body: \"agreed\", Author: \"project_1_bot_0a\", Insider: true, Bot: true}\n\task := forge.Note{Body: \"@zed, to refine this issue: which export?\\n\\n\" + AskMarker(role, 2)}\n\tfor _, c := range []struct {\n\t\tname  string\n\t\tnotes []forge.Note\n\t\twant  string\n\t}{\n\t\t{\"the reporter agrees\", []forge.Note{{Body: proposal}, reporter(\"Agreed!\\n\\nThanks.\")}, \"zed\"},\n\t\t{\"a person of the project agrees\", []forge.Note{{Body: proposal}, insider(\"agreed\")}, \"dev\"},\n\t\t{\"a stranger's +1 after it changes nothing\", []forge.Note{{Body: proposal}, reporter(\"agreed\"), stranger(\"+1\")}, \"zed\"},\n\t\t{\"a bot after it changes nothing\", []forge.Note{{Body: proposal}, reporter(\"agreed\"), {Body: \"linked\", Author: \"ci\", Bot: true}}, \"zed\"},\n\t\t{\"the same people's later word takes it back\", []forge.Note{{Body: proposal}, reporter(\"agreed\"), reporter(\"Wait, not the JSON export.\")}, \"\"},\n\t\t{\"a stranger cannot agree\", []forge.Note{{Body: proposal}, stranger(\"agreed\")}, \"\"},\n\t\t{\"nor a bot\", []forge.Note{{Body: proposal}, bot}, \"\"},\n\t\t{\"nor someone unnamed\", []forge.Note{{Body: proposal}, {Body: \"agreed\"}}, \"\"},\n\t\t{\"an agreement before the proposal is not to it\", []forge.Note{reporter(\"agreed\"), {Body: proposal}}, \"\"},\n\t\t{\"a question is not agreed to\", []forge.Note{{Body: proposal}, reporter(\"hm\"), ask, reporter(\"agreed\")}, \"\"},\n\t\t{\"one final dot aside\", []forge.Note{{Body: proposal}, reporter(\"agreed.\")}, \"zed\"},\n\t\t{\"case and one bang aside\", []forge.Note{{Body: proposal}, reporter(\"AGREED!\")}, \"zed\"},\n\t\t{\"one final mark aside, no more\", []forge.Note{{Body: proposal}, reporter(\"agreed!!!\")}, \"\"},\n\t\t{\"nor a spaced mark\", []forge.Note{{Body: proposal}, reporter(\"agreed .\")}, \"\"},\n\t\t{\"more than the word is an answer\", []forge.Note{{Body: proposal}, reporter(\"Agreed, but not the scope\")}, \"\"},\n\t} {\n\t\tif got := Agreement(c.notes, is, role); got != c.want {\n\t\t\tt.Errorf(\"%s: %q, want %q\", c.name, got, c.want)\n\t\t}\n\t}\n}\n\n// The agreement a refine carries is checked again on the forge: only a\n// refine carries one, and only with the sections last proposed.\nfunc TestCheckAgreed(t *testing.T) {\n\tpath := filepath.Join(t.TempDir(), \"forge.json\")\n\tstate := forge.FakeState{Issues: []forge.FakeItem{{ID: 9, Author: \"zed\", Labels: []string{},\n\t\tComments: []forge.FakeComment{{Body: proposal}, {Body: \"agreed\", Author: \"zed\"}}}}}\n\tdata, _ := json.Marshal(state)\n\tif err := os.WriteFile(path, data, 0o644); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tf := \u0026forge.Fake{Path: path}\n\tp := \u0026Plan{issues: map[int]forge.Issue{9: {ID: 9, Author: \"zed\"}}}\n\n\tready := Proposal{Do: \"ready\", Issue: 9, Agreed: \"zed\"}\n\tif rule, _ := p.checkAgreed(f, role, \u0026ready); rule != \"\" || ready.Agreed != \"\" {\n\t\tt.Errorf(\"a ready carrying an agreement: %q, agreed %q — want it cleared\", rule, ready.Agreed)\n\t}\n\tsame := Proposal{Do: \"refine\", Issue: 9, Agreed: \"zed\", Need: \"Every row exported.\", Scope: \"WriteRows.\"}\n\tif rule, why := p.checkAgreed(f, role, \u0026same); rule != \"\" {\n\t\tt.Errorf(\"the text agreed to: %s %s\", rule, why)\n\t}\n\tother := Proposal{Do: \"refine\", Issue: 9, Agreed: \"zed\", Need: \"Something else.\", Scope: \"WriteRows.\"}\n\tif rule, _ := p.checkAgreed(f, role, \u0026other); rule != \"not-agreed\" {\n\t\tt.Errorf(\"another text: %q, want not-agreed\", rule)\n\t}\n\twho := Proposal{Do: \"refine\", Issue: 9, Agreed: \"dev\", Need: \"Every row exported.\", Scope: \"WriteRows.\"}\n\tif rule, _ := p.checkAgreed(f, role, \u0026who); rule != \"not-agreed\" {\n\t\tt.Errorf(\"someone else named: %q, want not-agreed\", rule)\n\t}\n}\n```\n\n### internal/backlog/backlog_test.go\n\n```\npackage backlog\n\nimport (\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"strings\"\n\t\"testing\"\n)\n\n// A quote is found at the lines that hold it, not from an earlier line that\n// only shares its first word (workline's BACKLOG.md, imported on a copy:\n// an item's issue began with the end of the item before).\nfunc TestLocate(t *testing.T) {\n\trepo := t.TempDir()\n\ttext := \"- **Releases.** Left: the sandbox,\\n  then doctor - and init.\\n- **Install.** Done: releases.\\n  Left: a reusable action.\\n\"\n\tos.WriteFile(filepath.Join(repo, \"BACKLOG.md\"), []byte(text), 0o644)\n\tt.Setenv(\"GIT_CONFIG_GLOBAL\", os.DevNull) // the machine's hooks stay out\n\tt.Setenv(\"GIT_CONFIG_NOSYSTEM\", \"1\")\n\tfor _, c := range [][]string{{\"init\", \"-q\"}, {\"add\", \".\"}, {\"-c\", \"user.name=T\", \"-c\", \"user.email=t@x.invalid\", \"commit\", \"-qm\", \"x\"}} {\n\t\tif out, err := exec.Command(\"git\", append([]string{\"-C\", repo}, c...)...).CombinedOutput(); err != nil {\n\t\t\tt.Fatal(string(out))\n\t\t}\n\t}\n\tfrom, to, got, ok := Locate(repo, \"BACKLOG.md\", \"- **Install.** Done: releases. Left: a reusable action.\")\n\tif !ok || from != 3 || to != 4 || got != \"- **Install.** Done: releases.\\n  Left: a reusable action.\" {\n\t\tt.Fatalf(\"Locate = %d, %d, %q, %v\", from, to, got, ok)\n\t}\n}\n\n// A parent's task list is added once, after its text, and rewritten in\n// place when a resumed split lists its children again.\nfunc TestListChildren(t *testing.T) {\n\tbody := ListChildren(\"Two needs.\\n\\n## Scope\\n\\nsrc.\", []int{10})\n\twant := \"Two needs.\\n\\n## Scope\\n\\nsrc.\\n\\n## Sub-issues\\n\\n- [ ] #10\"\n\tif body != want {\n\t\tt.Fatalf(\"first list = %q\", body)\n\t}\n\tif again := ListChildren(body, []int{10, 11}); again != want+\"\\n- [ ] #11\" {\n\t\tt.Fatalf(\"list rewritten = %q\", again)\n\t}\n}\n\n// Two children are one when their titles differ only in case or spaces;\n// distinct titles, or one title under two parents, are not.\nfunc TestSplitKey(t *testing.T) {\n\tsame := SplitKey(9, \"Keep the last row\")\n\tfor _, title := range []string{\"Keep the last row\", \"keep the LAST row\", \"  Keep  the last\\trow \"} {\n\t\tif SplitKey(9, title) != same {\n\t\t\tt.Errorf(\"SplitKey(9, %q) differs from %q's\", title, \"Keep the last row\")\n\t\t}\n\t}\n\tif SplitKey(9, \"Quote commas\") == same || SplitKey(10, \"Keep the last row\") == same {\n\t\tt.Error(\"another title, or another parent, gives the same key\")\n\t}\n}\n\n// The text proposed to an outsider is read back from the engine's own block,\n// whatever fences the agent's words hold; what the comment shows holds no\n// fence of the agent's either.\nfunc TestProposalReadBack(t *testing.T) {\n\tc := Proposal{Do: \"refine\", Added: []string{\"Need\", \"Scope\"}, Sources: []string{\"src/a.go\"},\n\t\tWhy:       \"It says:\\n```yaml\\nneed: not this\\n```\",\n\t\tNeed:      \"Rows kept.\\n```\\nstray\\n```\",\n\t\tScope:     \"src/a.go\",\n\t\tQuestions: \"Which one? ```yaml\\nscope: nor this\\n```\"}\n\tbody := ProposalComment(\"zed\", c, \"product-owner\") + \"\\n\\n\" + ProposalMarker(\"product-owner\", 1)\n\tp := LastProposal([]string{body}, \"product-owner\")\n\tif p == nil || p.Scope != \"src/a.go\" || !strings.HasPrefix(p.Need, \"Rows kept.\") || strings.Contains(p.Need, \"```\") {\n\t\tt.Fatalf(\"read back %+v from:\\n%s\", p, body)\n\t}\n\tif n := strings.Count(body, \"```\"); n != 2 {\n\t\tt.Errorf(\"%d fences in the comment, want the engine's two:\\n%s\", n, body)\n\t}\n}\n\n// A text is cut into its questions: a list's items each one, the options\n// of one question kept together, a sentence before it left out.\nfunc TestQuestions(t *testing.T) {\n\tfor text, want := range map[string]string{\n\t\t\"- Do X\\n- Since when?\":                        \"since when?\",\n\t\t\"Which do you mean:\\n- the CLI or\\n- the API?\": \"which do you mean: - the cli or - the api?\",\n\t\t\"Thanks. Is it\\n1) fast or\\n2) slow?\":          \"is it 1) fast or 2) slow?\",\n\t\t\"E.g. which file? Does a.go fail?\":             \"e.g. which file?|does a.go fail?\",\n\t} {\n\t\tif got := strings.Join(questions(text), \"|\"); got != want {\n\t\t\tt.Errorf(\"questions(%q) = %q, want %q\", text, got, want)\n\t\t}\n\t}\n}\n\n// A question asked in an earlier comment is told whatever leads it there —\n// the reporter named, the sentence before it, spaces and case aside.\nfunc TestAskedBefore(t *testing.T) {\n\tcomments := []string{\n\t\t\"@ann, to refine this issue: Which rows are lost: the last one, or any? Since when? Does a.go fail? Is it v1.3? Which file?\\n\\n\" + AskMarker(\"product-owner\", 1),\n\t\t\"Not sure.\",\n\t}\n\tfor q, want := range map[string]string{\n\t\t\"Which rows are lost: the last one, or any?\":    \"asked-before\",\n\t\t\"  which ROWS are lost:\\nthe last one, or any?\": \"asked-before\",\n\t\t\"Is it every export? Since when?\":               \"asked-before\",\n\t\t\"Which export?\":                                 \"\",\n\t\t\"Or any?\":                                       \"\", // a question that only ends an earlier one is a new one\n\t\t\"When?\":                                         \"\", // nor one that ends the lead's\n\t\t\"Does b.go fail?\":                               \"\", // a dot in a name is no sentence's end\n\t\t\"Does a.go fail?\":                               \"asked-before\",\n\t\t\"Thanks! Since when?\":                           \"asked-before\", // a sentence ends at \"! \"\n\t\t\"Is it v1.2?\":                                   \"\",             // a version's dot cuts nothing\n\t\t\"Is it v1.3?\":                                   \"asked-before\",\n\t\t\"- Since when?\":                                 \"asked-before\", // a list's bullet aside, each form\n\t\t\"* Since when?\":                                 \"asked-before\",\n\t\t\"• Since when?\":                                 \"asked-before\",\n\t\t\"1. Since when?\":                                \"asked-before\",\n\t\t\"2) Since when?\":                                \"asked-before\",\n\t\t\"Okay. - Since when?\":                           \"asked-before\", // a bullet after a sentence cut\n\t\t\"E.g. which file?\":                              \"\",             // \"e.g.\" ends no sentence: not cut to \"which file?\"\n\t\t\"Okay. Which file?\":                             \"asked-before\",\n\t\t\"- Do X\\n- Since when?\":                         \"asked-before\", // a list's item before it, on its own line\n\t\t\"Which file:\\n- a.go or\\n- which file?\":         \"\",             // options of one question, not items: not cut\n\t} {\n\t\tc := Proposal{Do: \"ask\", Questions: q}\n\t\tif rule, _ := conversation(\"product-owner\", comments, \u0026c); rule != want {\n\t\t\tt.Errorf(\"%q: rule %q, want %q\", q, rule, want)\n\t\t}\n\t}\n\tif e := ReadExchange(append(comments, \"@ann, still: Which export?\\n\\n\"+AskMarker(\"product-owner\", 2)), \"product-owner\"); e.Rounds != 2 || e.Answered {\n\t\tt.Errorf(\"exchange = %+v, want two rounds, the last not answered\", e)\n\t}\n\t// A person quoting the engine's comment, its marker inside, answers it;\n\t// it is not a round of the engine's.\n\tquoted := \"\u003e \" + strings.ReplaceAll(comments[0], \"\\n\", \"\\n\u003e \") + \"\\n\\nSince Monday.\"\n\tif e := ReadExchange([]string{comments[0], quoted}, \"product-owner\"); e.Rounds != 1 || !e.Answered {\n\t\tt.Errorf(\"exchange with a quoted ask = %+v, want one round, answered\", e)\n\t}\n}\n```\n\n### internal/backlog/hand_test.go\n\n```\npackage backlog\n\nimport (\n\t\"slices\"\n\t\"testing\"\n\n\t\"github.com/JN0V/workline/internal/forge\"\n)\n\n// The kinds back to propose: the record's, a closing reopened since — not\n// one still closed —, an act undone since (found undone already: no issue\n// state read here) — each once.\nfunc TestDemoted(t *testing.T) {\n\th := \u0026Hand{\n\t\tRecord: Record{\n\t\t\tPropose: []string{\"split\"},\n\t\t\tClosed: []Closing{\n\t\t\t\t{Issue: 3, Act: \"close-duplicate\"}, {Issue: 4, Act: \"close-duplicate\"}, // both reopened: once\n\t\t\t\t{Issue: 5, Act: \"close-obsolete\"}, // still closed: not demoted\n\t\t\t\t{Issue: 6, Act: \"split\"},          // reopened, its kind demoted already: once\n\t\t\t},\n\t\t},\n\t\tUndone: []Undo{{Issue: 7, Act: \"rename\"}, {Issue: 8, Act: \"rename\"}, {Issue: 9, Act: \"split\"}},\n\t}\n\topen := []forge.Issue{{ID: 3}, {ID: 4}, {ID: 6}, {ID: 7}}\n\tgot := h.Demoted(open)\n\tslices.Sort(got)\n\tif want := []string{\"close-duplicate\", \"rename\", \"split\"}; !slices.Equal(got, want) {\n\t\tt.Errorf(\"got %v, want %v\", got, want)\n\t}\n\tif got := (\u0026Hand{}).Demoted(nil); len(got) != 0 {\n\t\tt.Errorf(\"nothing demoted: got %v\", got)\n\t}\n}\n```\n\n### tests/conformance/cases/documentalist/derived-block-beside-a-fix.yaml\n\n```\ncase: documentalist/derived-block-beside-a-fix\nabout: When gardening, a doc the agent fixes keeps its regenerated derived block; the agent's patch of the same doc does not undo it.\ngiven:\n  repo: documented\n  setup:\n    - \"sed -i 's/3600/7200/' src/auth/token.go \u0026\u0026 git commit -qam 'feat(auth): keep users signed in for two hours'\"\n    - \"sed -i '6a The code holds \u003c!-- workline:derive auth-files --\u003e3\u003c!-- workline:end --\u003e files.' docs/tech/auth.md\"\n  config: {roles: {documentalist: {settings: {derive: {auth-files: \"ls src/auth | wc -l\"}}}}}\nrun: {role: documentalist, event: schedule, ai: \"fake:doc-fixed-beside-derived\"}\nexpect:\n  status: pass\n  agent-calls: 1\n  findings: [{rule: derived-stale, where: docs/tech/auth.md}]\n  files:\n    \"docs/tech/auth.md\": {contains: \"\u003c!-- workline:derive auth-files --\u003e1\u003c!-- workline:end --\u003e\"}\n  applied: [patch, patch]\n```\n\nNot shown, past 300 lines: internal/backlog/board_test.go, internal/backlog/change_test.go, internal/backlog/obsolete_test.go, internal/backlog/opening_test.go, internal/backlog/order_test.go, internal/backlog/parent_test.go, internal/backlog/spec_test.go, internal/backlog/undo_test.go, docs/spec/backlog-acts.md, tests/conformance/cases/product-owner/close-a-duplicate.yaml, tests/conformance/cases/product-owner/depend-act-sets-native-link.yaml, tests/conformance/cases/product-owner/rename-undo-in-report.yaml, tests/conformance/cases/product-owner/sample-an-undo-counts-once.yaml, tests/conformance/cases/product-owner/split-opens-children-with-sections.yaml, tests/conformance/cases/product-owner/undo-depend-demotes.yaml, tests/conformance/cases/product-owner/undo-ready-demotes.yaml, tests/conformance/cases/product-owner/undo-rename-demotes.yaml. A test in them may exercise it.\n","question":"Is this finding about the tests true: is 