{"material":"## The finding\n\nimportant: Unread state in the open-parent split branch untested\n\nWhy: The second change (`st == nil || len(st.Split) == 0`) guards the live-split case against a nil state. The new test only passes closed parents, so a nil dereference there would not be caught.\n\nIts cause, quoted:\n\n```\nif st == nil || len(st.Split) == 0 {\n```\n\n## The code it stands on\n\nAs it reads at cd59ce8: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/backlog/undo.go, lines 75 to 205: `findUndone`, the function the cause lies in\n\n```\n75  // findUndone reads what a person did to the acts the record keeps: those\n76  // undone, with their evidence, and those that still stand; and the\n77  // blockers the role set on each open issue (own). An act whose issue is\n78  // closed, or whose value a person set to a third, is no longer the role's\n79  // to watch.\n80  func findUndone(f forge.Backlog, role string, open map[int]forge.Issue, done []Done) (standing []Done, undone []Undo, own map[int][]int, err error) {\n81  \tvar all map[int]forge.Issue // read once, when a split is watched\n82  \town = map[int][]int{}\n83  \tfor _, d := range done {\n84  \t\tis, isOpen := open[d.Issue]\n85  \t\tif !isOpen {\n86  \t\t\tif d.Act != \"split\" {\n87  \t\t\t\tcontinue\n88  \t\t\t}\n89  \t\t\t// A parent closed while its children still wait on siblings:\n90  \t\t\t// those links are still the role's own, read from its state\n91  \t\t\t// until no child that waits is open (ADR-0028). A parent the\n92  \t\t\t// forge no longer gives is let go; one whose state does not\n93  \t\t\t// read is kept, read again at the next run.\n94  \t\t\tst, err := splitState(f, role, d.Issue)\n95  \t\t\tswitch {\n96  \t\t\tcase errors.Is(err, forge.ErrUnreachable):\n97  \t\t\t\treturn nil, nil, nil, err\n98  \t\t\tcase err != nil:\n99  \t\t\t\tcontinue\n100  \t\t\tcase st == nil:\n101  \t\t\t\tstanding = append(standing, d)\n102  \t\t\t\tcontinue\n103  \t\t\t}\n104  \t\t\twaiting := false\n105  \t\t\tfor child, blockers := range st.After {\n106  \t\t\t\tif _, ok := open[child]; ok {\n107  \t\t\t\t\town[child], waiting = append(own[child], blockers...), true\n108  \t\t\t\t}\n109  \t\t\t}\n110  \t\t\tif waiting {\n111  \t\t\t\tstanding = append(standing, d)\n112  \t\t\t}\n113  \t\t\tcontinue\n114  \t\t}\n115  \t\tvar evidence string\n116  \t\tgone := false\n117  \t\tswitch d.Act {\n118  \t\tcase \"rename\":\n119  \t\t\tswitch {\n120  \t\t\tcase is.Title == d.Was:\n121  \t\t\t\tevidence = fmt.Sprintf(\"#%d renamed back to %q by a person; the role had set %q\", d.Issue, d.Was, d.Set)\n122  \t\t\tcase is.Title != d.Set:\n123  \t\t\t\tgone = true\n124  \t\t\t}\n125  \t\tcase \"order\":\n126  \t\t\tswitch now := strconv.Itoa(Priority(is)); {\n127  \t\t\tcase now == d.Was:\n128  \t\t\t\tevidence = fmt.Sprintf(\"#%d's priority put back to %s by a person; the role had set %s\", d.Issue, priorityName(d.Was), priorityName(d.Set))\n129  \t\t\tcase now != d.Set:\n130  \t\t\t\tgone = true\n131  \t\t\t}\n132  \t\tcase \"milestone\":\n133  \t\t\tswitch {\n134  \t\t\tcase is.Milestone == d.Was:\n135  \t\t\t\tevidence = fmt.Sprintf(\"#%d put back in %s by a person; the role had put it in %q\", d.Issue, milestoneName(d.Was), d.Set)\n136  \t\t\tcase is.Milestone != d.Set:\n137  \t\t\t\tgone = true\n138  \t\t\t}\n139  \t\tcase \"depend\":\n140  \t\t\t// A blocker the role added, still open, no longer one: a person\n141  \t\t\t// took the link or the line off. All closed: nothing to watch.\n142  \t\t\tnow, left := Blockers(is), 0\n143  \t\t\tfor _, f := range strings.Split(d.Set, \",\") {\n144  \t\t\t\tb, err := strconv.Atoi(f)\n145  \t\t\t\tif err == nil {\n146  \t\t\t\t\town[d.Issue] = append(own[d.Issue], b)\n147  \t\t\t\t}\n148  \t\t\t\tif _, isOpen := open[b]; err != nil || !isOpen {\n149  \t\t\t\t\tcontinue\n150  \t\t\t\t}\n151  \t\t\t\tleft++\n152  \t\t\t\tif !slices.Contains(now, b) \u0026\u0026 evidence == \"\" {\n153  \t\t\t\t\tevidence = fmt.Sprintf(\"#%d no longer waits on #%d: a person took off the link the role set\", d.Issue, b)\n154  \t\t\t\t}\n155  \t\t\t}\n156  \t\t\tgone = left == 0\n157  \t\tcase \"ready\":\n158  \t\t\tif !slices.Contains(is.Labels, LabelReady) {\n159  \t\t\t\tevidence = fmt.Sprintf(\"#%d's label %s taken off by a person; the role had moved it to ready\", d.Issue, LabelReady)\n160  \t\t\t}\n161  \t\tcase \"split\":\n162  \t\t\tst, err := splitState(f, role, d.Issue)\n163  \t\t\tif err != nil {\n164  \t\t\t\treturn nil, nil, nil, err\n165  \t\t\t}\n166  \t\t\tif st == nil || len(st.Split) == 0 {\n167  \t\t\t\tbreak // its children not recorded yet, or its state unread: watched again\n168  \t\t\t}\n169  \t\t\tfor child, blockers := range st.After {\n170  \t\t\t\town[child] = append(own[child], blockers...)\n171  \t\t\t}\n172  \t\t\tif all == nil {\n173  \t\t\t\tlist, err := f.AllIssues()\n174  \t\t\t\tif err != nil {\n175  \t\t\t\t\treturn nil, nil, nil, err\n176  \t\t\t\t}\n177  \t\t\t\tall = map[int]forge.Issue{}\n178  \t\t\t\tfor _, x := range list {\n179  \t\t\t\t\tall[x.ID] = x\n180  \t\t\t\t}\n181  \t\t\t}\n182  \t\t\tclosed := 0\n183  \t\t\tfor _, id := range st.Split {\n184  \t\t\t\tch, ok := all[id]\n185  \t\t\t\tswitch {\n186  \t\t\t\tcase ok \u0026\u0026 ch.Closed \u0026\u0026 ch.Reason == \"not_planned\":\n187  \t\t\t\t\tevidence = fmt.Sprintf(\"#%d, split from #%d by the role, closed as not planned by a person\", id, d.Issue)\n188  \t\t\t\tcase !ok || ch.Closed: // closed, or gone from the forge: deleted, moved\n189  \t\t\t\t\tclosed++\n190  \t\t\t\t}\n191  \t\t\t\tif evidence != \"\" {\n192  \t\t\t\t\tbreak\n193  \t\t\t\t}\n194  \t\t\t}\n195  \t\t\tgone = evidence == \"\" \u0026\u0026 closed == len(st.Split) // no child left open: nothing left to undo\n196  \t\t}\n197  \t\tswitch {\n198  \t\tcase evidence != \"\":\n199  \t\t\tundone = append(undone, Undo{Issue: d.Issue, Act: d.Act, Evidence: evidence})\n200  \t\tcase !gone:\n201  \t\t\tstanding = append(standing, d)\n202  \t\t}\n203  \t}\n204  \treturn standing, undone, own, nil\n205  }\n```\n\n### internal/backlog/undo.go, lines 207 to 222: `splitState`, called by `findUndone`\n\n```\n207  // splitState is a split parent's state as its comment holds it: empty\n208  // when it has none; nil when it does not read — never taken for none.\n209  func splitState(f forge.Backlog, role string, id int) (*State, error) {\n210  \tnotes, err := f.Notes(forge.Target{Kind: \"issue\", ID: id})\n211  \tif err != nil {\n212  \t\treturn nil, err\n213  \t}\n214  \tst, found, err := ReadState(forge.Bodies(notes), role)\n215  \tswitch {\n216  \tcase err != nil:\n217  \t\treturn nil, nil\n218  \tcase !found:\n219  \t\treturn \u0026State{}, nil\n220  \t}\n221  \treturn st, nil\n222  }\n```\n\n### internal/backlog/order.go, lines 39 to 47: `Priority`, called by `findUndone`\n\n```\n39  // Priority is an issue's level, the most pressing of its labels; 0 when\n40  // it has none.\n41  func Priority(is forge.Issue) int {\n42  \tset := PriorityLabels(is)\n43  \tif len(set) == 0 {\n44  \t\treturn 0\n45  \t}\n46  \treturn slices.Min(set)\n47  }\n```\n\n### internal/backlog/undo.go, lines 224 to 229: `priorityName`, called by `findUndone`\n\n```\n224  func priorityName(n string) string {\n225  \tif n == \"0\" || n == \"\" {\n226  \t\treturn \"none\"\n227  \t}\n228  \treturn n\n229  }\n```\n\n### internal/backlog/undo.go, lines 231 to 236: `milestoneName`, called by `findUndone`\n\n```\n231  func milestoneName(m string) string {\n232  \tif m == \"\" {\n233  \t\treturn \"no milestone\"\n234  \t}\n235  \treturn fmt.Sprintf(\"%q\", m)\n236  }\n```\n\n### internal/backlog/depend.go, lines 44 to 56: `Blockers`, called by `findUndone`\n\n```\n44  // Blockers are the issues one waits on, open or closed: