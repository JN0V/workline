{"material":"## The finding\n\nimportant: Ticks array indexed wrongly when oldest edit truncated\n\nWhy: In github.Ticks, nodes are sorted ascending and the \"i == 0 \u0026\u0026 Total \u003e len(nodes)\" skip assumes the first fetched node is the oldest of the kept window. With `first: 100` GitHub returns the newest 100, so after sorting the first is the oldest of those. That works. But a deleted-diff node (Diff == nil) at i == 0 is skipped via the earlier `continue`, so the baseline `before` stays \"\" and the next version's every ticked box is reported as a new tick by that editor. This attributes old ticks to the wrong person.\n\nIts cause, quoted:\n\n```\nif n.Diff == nil { // a version deleted from the history\n\t\t\tcontinue\n\t\t}\n```\n\n## internal/forge/github.go, lines 408 to 438\n\n```\n408  \t\t\t\t\t\t} `json:\"nodes\"`\n409  \t\t\t\t\t} `json:\"userContentEdits\"`\n410  \t\t\t\t} `json:\"issue\"`\n411  \t\t\t} `json:\"repository\"`\n412  \t\t} `json:\"data\"`\n413  \t}\n414  \tif err := decode(out, \u0026v); err != nil {\n415  \t\treturn nil, err\n416  \t}\n417  \tedits := v.Data.Repository.Issue.Edits\n418  \tnodes := edits.Nodes\n419  \tsort.SliceStable(nodes, func(i, j int) bool { return nodes[i].EditedAt \u003c nodes[j].EditedAt })\n420  \tvar ticks []Tick\n421  \tbefore := \"\"\n422  \tfor i, n := range nodes {\n423  \t\tif n.Diff == nil { // a version deleted from the history\n424  \t\t\tcontinue\n425  \t\t}\n426  \t\tif i == 0 \u0026\u0026 edits.Total \u003e len(nodes) {\n427  \t\t\t// Older versions not read: this one is only what the next are\n428  \t\t\t// read against, its boxes nobody's.\n429  \t\t\tbefore = *n.Diff\n430  \t\t\tcontinue\n431  \t\t}\n432  \t\twho := Note{}\n433  \t\tif n.Editor != nil {\n434  \t\t\twho.Author, who.Bot = n.Editor.Login, n.Editor.Type == \"Bot\"\n435  \t\t\tif !who.Bot {\n436  \t\t\t\tif who.Insider, err = g.writer(who.Author); err != nil {\n437  \t\t\t\t\t// A token that may not read permissions: who ticked is\n438  \t\t\t\t\t// not known, and the tick is no yes — said, not failed.\n```\n\n## What the change did to internal/forge/github.go\n\n```diff\ndiff --git a/internal/forge/github.go b/internal/forge/github.go\nindex 08fbfdd..aa7dbc8 100644\n--- a/internal/forge/github.go\n+++ b/internal/forge/github.go\n@@ -17,7 +17,10 @@ import (\n // endpoints. Tried live on 2026-09-24: comment, label added (GitHub creates a\n // missing label), label removed, and every write replayed without duplicates.\n // Not yet tried live: OpenIssue.\n-type github struct{ repo string }\n+type github struct {\n+\trepo    string\n+\twriters map[string]bool // who may write to the repository, read once each\n+}\n \n func (g *github) api(args ...string) ([]byte, error) {\n \treturn run(g.repo, \"gh\", append([]string{\"api\"}, args...)...)\n@@ -371,3 +374,95 @@ func (g *github) SetMilestone(id int, title string) error {\n \t_, err = g.api(\"-X\", \"PATCH\", fmt.Sprintf(\"repos/{owner}/{repo}/issues/%d\", id), \"-F\", fmt.Sprintf(\"milestone=%d\", n))\n \treturn err\n }\n+\n+// ticksQuery reads an issue body's versions, each with who wrote it: GitHub\n+// keeps no event for a box ticked, its edit history does (userContentEdits,\n+// each node the whole body as that edit left it, newest first: `first`\n+// is the newest, `last` the oldest).\n+const ticksQuery = `query($owner: String!, $name: String!, $number: Int!) {\n+  repository(owner: $owner, name: $name) { issue(number: $number) {\n+    userContentEdits(first: 100) { totalCount nodes { editedAt diff editor { login __typename } } } } } }`\n+\n+// Ticks reads the boxes ticked from the body's edit history: each version\n+// against the one before, given to its editor. Only who has write access\n+// edits a body they did not write (GitHub's roles); the editor is a person\n+// of the project when GitHub gives them write, maintain or admin.\n+func (g *github) Ticks(id int) ([]Tick, error) {\n+\tout, err := g.api(\"graphql\", \"-f\", \"query=\"+ticksQuery, \"-F\", \"owner={owner}\", \"-F\", \"name={repo}\", \"-F\", fmt.Sprintf(\"number=%d\", id))\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tvar v struct {\n+\t\tData struct {\n+\t\t\tRepository struct {\n+\t\t\t\tIssue struct {\n+\t\t\t\t\tEdits struct {\n+\t\t\t\t\t\tTotal int `json:\"totalCount\"`\n+\t\t\t\t\t\tNodes []struct {\n+\t\t\t\t\t\t\tEditedAt string  `json:\"editedAt\"`\n+\t\t\t\t\t\t\tDiff     *string `json:\"diff\"`\n+\t\t\t\t\t\t\tEditor   *struct {\n+\t\t\t\t\t\t\t\tLogin string `json:\"login\"`\n+\t\t\t\t\t\t\t\tType  string `json:\"__typename\"`\n+\t\t\t\t\t\t\t} `json:\"editor\"`\n+\t\t\t\t\t\t} `json:\"nodes\"`\n+\t\t\t\t\t} `json:\"userContentEdits\"`\n+\t\t\t\t} `json:\"issue\"`\n+\t\t\t} `json:\"repository\"`\n+\t\t} `json:\"data\"`\n+\t}\n+\tif err := decode(out, \u0026v); err != nil {\n+\t\treturn nil, err\n+\t}\n+\tedits := v.Data.Repository.Issue.Edits\n+\tnodes := edits.Nodes\n+\tsort.SliceStable(nodes, func(i, j int) bool { return nodes[i].EditedAt \u003c nodes[j].EditedAt })\n+\tvar ticks []Tick\n+\tbefore := \"\"\n+\tfor i, n := range nodes {\n+\t\tif n.Diff == nil { // a version deleted from the history\n+\t\t\tcontinue\n+\t\t}\n+\t\tif i == 0 \u0026\u0026 edits.Total \u003e len(nodes) {\n+\t\t\t// Older versions not read: this one is only what the next are\n+\t\t\t// read against, its boxes nobody's.\n+\t\t\tbefore = *n.Diff\n+\t\t\tcontinue\n+\t\t}\n+\t\twho := Note{}\n+\t\tif n.Editor != nil {\n+\t\t\twho.Author, who.Bot = n.Editor.Login, n.Editor.Type == \"Bot\"\n+\t\t\tif !who.Bot {\n+\t\t\t\tif who.Insider, err = g.writer(who.Author); err != nil {\n+\t\t\t\t\t// A token that may not read permissions: who ticked is\n+\t\t\t\t\t// not known, and the tick is no yes — said, not failed.\n+\t\t\t\t\twho = Note{}\n+\t\t\t\t}\n+\t\t\t}\n+\t\t}\n+\t\tticks = append(ticks, TicksBetween(before, *n.Diff, who)...)\n+\t\tbefore = *n.Diff\n+\t}\n+\treturn ticks, nil\n+}\n+\n+// writer says whether login may write to the repository: a person of the\n+// project, as an author association of owner, member or collaborator.\n+func (g *github) writer(login string) (bool, error) {\n+\tif g.writers == nil {\n+\t\tg.writers = map[string]bool{}\n+\t}\n+\tif w, ok := g.writers[login]; ok {\n+\t\treturn w, nil\n+\t}\n+\tout, err := g.api(\"repos/{owner}/{repo}/collaborators/\"+url.PathEscape(login)+\"/permission\", \"--jq\", \".permission\")\n+\tif errors.Is(err, errNotFound) {\n+\t\tout, err = nil, nil\n+\t}\n+\tif err != nil {\n+\t\treturn false, err\n+\t}\n+\tp := strings.TrimSpace(string(out))\n+\tg.writers[login] = p == \"admin\" || p == \"maintain\" || p == \"write\"\n+\treturn g.writers[login], nil\n+}\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}