n of the project ticking its box in the report, the measure beside it; the settings are not touched.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 9, title: \"Rows lost on Windows\", body: \"Not the same bug.\", labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - id: 13\n        title: \"Backlog — product owner\"\n        body: \"Back to propose after a wrong closing: close-duplicate.\\n- [x] Set close-duplicate back to act: 2 of its closings still closed, 1 reopened. \u003c!-- workline:proposal=act/close-duplicate --\u003e\\n\"\n        labels: []\n        ticks: [{item: \"Set close-duplicate back to act: 2 of its closings still closed, 1 reopened. \u003c!-- workline:proposal=act/close-duplicate --\u003e\", done: true, author: dev, insider: true}]\n        comments: [\"```yaml\\nclosed:\\n  - {issue: 4, act: close-duplicate}\\n  - {issue: 5, act: close-duplicate}\\nwrong:\\n  - {issue: 9, act: close-duplicate}\\npropose: [close-duplicate]\\n```\\n\\n\u003c!-- workline:sticky=product-owner/acts --\u003e\"]\nrun: {role: product-owner, event: schedule, ai: none}\nexpect:\n  agent-calls: 0\n  findings: [{rule: back-to-act, where: \"#13\"}]\n  forge:\n    issues:\n      - {id: 13, body-contains: \"close-duplicate set back to act by @dev\", comment-lacks: \"propose: [close-duplicate]\"}\n      - {id: 13, body-lacks: \"Back to propose after a wrong closing\"}\n```\n\n### tests/conformance/cases/product-owner/broken-state-writes-nothing.yaml\n\n```\ncase: product-owner/broken-state-writes-nothing\nabout: An issue whose engine comment does not read is never acted on; nothing is written on it, not even a repaired comment.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 7, title: \"Export drops the last row\", body: \"Every CSV file: the export drops the last row.\", labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: 0000000\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - {id: 12, title: \"Last row missing in CSV\", body: \"In my CSV export the last row is missing.\", labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go\\nconfirmed: \\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\nrun: {role: product-owner, event: schedule, ai: fake:close-duplicate}\nexpect:\n  findings: [{rule: state-broken, where: \"#12\"}]\n  forge:\n    issues:\n      - {id: 12, closed: false, comments: 1, comment-contains: \"sources: [src/export/csv.go\\n\"}\n```\n\n### tests/conformance/cases/product-owner/capped-act-read-again.yaml\n\n```\ncase: product-owner/capped-act-read-again\nabout: An act proposed only because the run's cap was reached has its issue read again at the next run — first, before an issue never read — though nothing changed on it; read again, the proposal leaves the report, decided anew or not. A proposal left to a person by its mode is neither read again nor dropped for that.\ngiven:\n  repo: backlog\n  config:\n    roles:\n      product-owner:\n        settings: {issues-per-run: 1}\n  forge:\n    issues:\n      - {id: 9, title: \"Rows lost\", body: \"Some rows are lost.\", labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - {id: 10, title: \"Gone\", body: \"Something gone.\", labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - id: 11\n        title: \"Backlog — product owner\"\n        body: \"An earlier report.\"\n        labels: []\n        comments: [\"```yaml\\nproposed:\\n  - {issue: 9, act: refine, line: 'Refine #9', capped: true}\\n  - {issue: 10, act: close-obsolete, line: 'Close #10 as obsolete'}\\n```\\n\\n\u003c!-- workline:sticky=product-owner/acts --\u003e\"]\n      - {id: 12, title: \"Never read\", body: \"New.\", labels: [], comments: [\"```yaml\\nsources: [README.md]\\nconfirmed: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\nrun: {role: product-owner, event: schedule, ai: fake:proposes-nothing}\nexpect:\n  run-files:\n    in/task.md: {contains: \"## #9 Rows lost\\n\\nSections\", not-contains: \"## #12 Never read\\n\\nSections\"}\n  forge:\n    issues:\n      - {id: 11, comment-contains: \"Close #10 as obsolete\", comment-lacks: \"Refine #9\"}\n```\n\n### tests/conformance/cases/product-owner/changed-import-lines-read-again.yaml\n\n```\ncase: product-owner/changed-import-lines-read-again\nabout: \"A commit changes the lines of an imported file an issue was opened from (its import= key): that issue is read again with the lines as they were when it was last read and as they are now; an issue imported from lines no commit changed is not, though they moved (ADR-0032).\"\ngiven:\n  repo: backlog\n  setup:\n    - |\n      cat \u003e ROADMAP.md \u003c\u003c'MD'\n      # Roadmap\n\n      Where the project is going.\n\n      ## Next\n\n      1. **Keep the last row.** WriteRows stops one row short.\n         It loses data on every export.\n      2. **Sort the columns.** By name, then by type.\n      MD\n      git add ROADMAP.md \u0026\u0026 git commit -qm 'docs: a roadmap' \u0026\u0026 git tag imported\n    - |\n      cat \u003e ROADMAP.md \u003c\u003c'MD'\n      # Roadmap\n\n      Where the project is going.\n\n      ## Next\n\n      1. **Keep the last row.** WriteRows stops one row short.\n         It loses data on every export,\n         and the header too.\n      2. **Sort the columns.** By name, then by type.\n      MD\n      git commit -qam 'docs: the header too'\n  forge:\n    issues:\n      - {id: 4, title: \"Keep the last row\", body: \"1. **Keep the last row.** WriteRows stops one row short.\\n   It loses data on every export.\\n\\nOpened from `ROADMAP.md`, lines 7 to 8 by the product-owner role.\\n\\n\u003c!-- workline:import=ROADMAP.md:0a1b2c3d4e5f --\u003e\", labels: [], comments: [\"```yaml\\nsources: []\\nconfirmed: imported\\njudged: imported\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - {id: 5, title: \"Sort the columns\", body: \"2. **Sort the columns.** By name, then by type.\\n\\nOpened from `ROADMAP.md`, lines 9 to 9 by the product-owner role.\\n\\n\u003c!-- workline:import=ROADMAP.md:5f4e3d2c1b0a --\u003e\", labels: [], comments: [\"```yaml\\nsources: []\\nconfirmed: imported\\njudged: imported\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\nrun: {role: product-owner, event: schedule, ai: fake:proposes-nothing}\nexpect:\n  findings:\n    - {rule: need-changed, where: \"#4\", message: \"the lines of ROADMAP.md it was opened from changed: #4 (import, read again)\"}\n  no-findings:\n    - {rule: need-changed, where: \"#5\"}\n  run-files:\n    in/task.md: {contains: \"Was:\\n\u003e 1. **Keep the last row.** WriteRows stops one row short.\\n\u003e    It loses data on every export.\\nNow:\\n\u003e 1. **Keep the last row.** WriteRows stops one row short.\\n\u003e    It loses data on every export,\\n\u003e    and the header too.\\n\", not-contains: \"## #5\"}\n  forge:\n    issues:\n      - {id: 6, title: \"Backlog — product owner\", body-contains: \"- [ ] `ROADMAP.md`, lines 7 to 9, which #4 Keep the last row was opened from, changed (\"}\n      - {id: 6, body-contains: \"  - #4 Keep the last row, opened from those lines: read again with the change: nothing proposed.\\n\"}\n```\n\n### tests/conformance/cases/product-owner/changed-import-lines-unread-said.yaml\n\n```\ncase: product-owner/changed-import-lines-unread-said\nabout: \"An imported issue whose lines git cannot follow — the commit it was opened at gone, after a force-push or beyond a shallow clone — is said in a warning, never read as unchanged (ADR-0032; principle 12).\"\ngiven:\n  repo: backlog\n 