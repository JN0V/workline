{"material":"## The finding\n\nimportant: Unchanged-body half of the case asserts nothing\n\nWhy: For issue 10 the state already holds `answered: 7d6b5529bb37`. The check that the comment contains that string passes whether or not the state is rewritten, and whether or not the issue is wrongly re-read. Only the `issues-read` not-contains \"10\" check covers the \"same body, not read again\" claim. That check is a loose substring match, and \"10\" may also match other text in the file.\n\nIts cause, quoted:\n\n```\n{id: 10, comment-contains: \"answered: 7d6b5529bb37\"}\n```\n\n## The code it stands on\n\nAs it reads at b1f5dd3: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### tests/conformance/cases/product-owner/spec-review-restarting-not-taken-as-answered.yaml, lines 18 to 36: the lines around the cause, no function found around it (no language it knows)\n\n```\n18            - \"**workline reviewer**, its spec.\\n\\n| | | Where | Finding |\\n|---|---|---|---|\\n| warns | unverifiable | `#9:11` | Important: The Verification proves nothing |\\n\\n\u003c!-- workline:spec-review body=d424ff914f28 round=1 open=1 in=Verification --\u003e\\n\\n\u003c!-- workline:sticky=reviewer/spec --\u003e\"\n19        - id: 10\n20          title: Rows lost again\n21          body: \"## Need\\n\\nThe monthly report counts every sale.\\n\\n## Verification\\n\\nA test writes three rows.\\n\\n## Validation\\n\\nAnn opens a known day.\\n\\n## Scope\\n\\nsrc/export/csv.go\"\n22          author: ann\n23          insider: true\n24          labels: [workline:to-refine]\n25          comments:\n26            - \"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\nbody: 7d6b5529bb37\\nanswered: 7d6b5529bb37\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"\n27            - \"**workline reviewer**, its spec.\\n\\n\u003c!-- workline:spec-review body=7d6b5529bb37 round=1 open=1 in=Verification --\u003e\\n\\n\u003c!-- workline:sticky=reviewer/spec --\u003e\"\n28  run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}\n29  expect:\n30    forge:\n31      issues:\n32        - {id: 9, comment-contains: \"answered: d424ff914f28\"}\n33        - {id: 10, comment-contains: \"answered: 7d6b5529bb37\"}\n34    run-files:\n35      in/task.md: {contains: \"The reviewer's findings on its spec, round 1\"}\n36      in/issues-read: {contains: \"9\", not-contains: \"10\"}\n```\n\n### internal/role/role.go, lines 63 to 88: `For`, named by the finding\n\n```\n63  // For returns the needs of a task of that kind: the role's, with what\n64  // model.tasks sets for the kind in their place.\n65  func (m Model) For(kind string) Model {\n66  \tt, ok := m.Tasks[kind]\n67  \tif !ok {\n68  \t\treturn m\n69  \t}\n70  \tout := m\n71  \tout.Tasks = nil\n72  \tif t.Capability != \"\" {\n73  \t\tout.Capability = t.Capability\n74  \t}\n75  \tif t.Tier != \"\" {\n76  \t\tout.Tier = t.Tier\n77  \t}\n78  \tif t.Effort != \"\" {\n79  \t\tout.Effort = t.Effort\n80  \t}\n81  \tif t.PromoteAfter != 0 {\n82  \t\tout.PromoteAfter = t.PromoteAfter\n83  \t}\n84  \tif t.Timeout != \"\" {\n85  \t\tout.Timeout = t.Timeout\n86  \t}\n87  \treturn out\n88  }\n```\n\n## What the change did to tests/conformance/cases/product-owner/spec-review-restarting-not-taken-as-answered.yaml, near the cause\n\n```diff\ndiff --git a/tests/conformance/cases/product-owner/spec-review-restarting-not-taken-as-answered.yaml b/tests/conformance/cases/product-owner/spec-review-restarting-not-taken-as-answered.yaml\nnew file mode 100644\nindex 0000000..03465c3\n--- /dev/null\n+++ b/tests/conformance/cases/product-owner/spec-review-restarting-not-taken-as-answered.yaml\n@@ -0,0 +1,36 @@\n+case: product-owner/spec-review-restarting-not-taken-as-answered\n+about: \"The review a product owner answered is kept by the body that review read, not by its round (#128): a new review that restarts at round 1, on a body changed since, is read again and given to the agent, though round 1 was answered before; a review already given, the same body, is not read again for it.\"\n+given:\n+  repo: backlog\n+  config:\n+    routing:\n+      events: {schedule: [product-owner, reviewer]}\n+  forge:\n+    issues:\n+      - id: 9\n+        title: Rows lost\n+        body: \"Rows lost.\\n\\n## Need\\n\\nThe monthly report counts every sale.\\n\\n## Verification\\n\\nSessions feel right to the users.\\n\\n## Validation\\n\\nAnn opens a known day.\\n\\n## Scope\\n\\nsrc/export/csv.go\"\n+        author: ann\n+        insider: true\n+        labels: [workline:to-refine]\n+        comments:\n+          - \"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\nbody: d424ff914f28\\nanswered: aaaaaaaaaaaa\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"\n+          - \"**workline reviewer**, its spec.\\n\\n| | | Where | Finding |\\n|---|---|---|---|\\n| warns | unverifiable | `#9:11` | Important: The Verification proves nothing |\\n\\n\u003c!-- workline:spec-review body=d424ff914f28 round=1 open=1 in=Verification --\u003e\\n\\n\u003c!-- workline:sticky=reviewer/spec --\u003e\"\n+      - id: 10\n+        title: Rows lost again\n+        body: \"## Need\\n\\nThe monthly report counts every sale.\\n\\n## Verification\\n\\nA test writes three rows.\\n\\n## Validation\\n\\nAnn opens a known day.\\n\\n## Scope\\n\\nsrc/export/csv.go\"\n+        author: ann\n+        insider: true\n+        labels: [workline:to-refine]\n+        comments:\n+          - \"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\nbody: 7d6b5529bb37\\nanswered: 7d6b5529bb37\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"\n+          - \"**workline reviewer**, its spec.\\n\\n\u003c!-- workline:spec-review body=7d6b5529bb37 round=1 open=1 in=Verification --\u003e\\n\\n\u003c!-- workline:sticky=reviewer/spec --\u003e\"\n+run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}\n+expect:\n+  forge:\n+    issues:\n+      - {id: 9, comment-contains: \"answered: d424ff914f28\"}\n+      - {id: 10, comment-contains: \"answered: 7d6b5529bb37\"}\n+  run-files:\n+    in/task.md: {contains: \"The reviewer's findings on its spec, round 1\"}\n+    in/issues-read: {contains: \"9\", not-contains: \"10\"}\n```\n\n## The tests that touch tests/conformance/cases/product-owner/spec-review-restarting-not-taken-as-answered.yaml\n\nThe test files in tests/conformance/cases/product-owner/ and those naming `spec-review-restarting-not-taken-as-answered`, as they read at b1f5dd3.\n\n### tests/conformance/cases/product-owner/accepted-by-a-label.yaml\n\n```\ncase: product-owner/accepted-by-a-label\nabout: A person accepts the drafts with one label, workline:accepted — which only someone allowed to triage can set — and the engine, with no agent, takes the draft lines out and moves the issue to ready, an outsider's too; one still lacking a section stays to refine. The agent cannot accept for a person — the label is read on the issue, not in a proposal.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 9, title: \"Rows lost\", body: \"Some rows are lost.\\n\\n## Need\\n\\n*Draft by the product owner: edit it, then delete this line to make it yours.* \u003c!-- workline:draft --\u003e\\n\\nThe monthly report counts every sale.\\n\\n## Verification\\n\\nA test writes three rows.\\n\\n## Validation\\n\\n*Draft by the product owner: edit it, then delete this line to make it yours.* \u003c!-- workline:draft --\u003e\\n\\nAnn opens a known day.\\n\\n## Scope\\n\\nsrc/export/csv.go\", author: zed, insider: false, labels: [workline:to-refine, workline:draft, workline:accepted], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - {id: 10, title: \"No scope\", body: \"## Need\\n\\n*Draft by the product owner: edit it, then delete this line to make it yours.* \u003c!-- workline:draft --\u003e\\n\\nA need.\\n\\n## Verification\\n\\nB.\\n\\n## Validation\\n\\nC.\", author: ann, insider: true, labels: [workline:to-refine, workline:draft, workline:accepted], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - {id: 11, title: \"Not accepted\", body: \"## Need\\n\\n*Draft by the product owner: edit it, then delete this line to make it yours.* \u003c!-- workline:draft --\u003e\\n\\nA need.\\n\\n## Verification\\n\\nB.\\n\\n## Validation\\n\\nC.\\n\\n## Scope\\n\\nD.\", author: ann, insider: true, labels: [workline:to-refine, workline:draft], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\nrun: {role: product-owner, event: schedule, ai: fake:ready-eleven}\nexpect:\n  findings: [{rule: not-ready, where: \"#10\"}, {rule: not-ready, where: \"#11\"}]\n  forge:\n    issues:\n      - {id: 9, labels: [workline:ready], body-contains: \"## Need\\n\\nThe monthly report counts every sale.\", body-lacks: \"workline:draft\"}\n      - {id: 9, comment-contains: \"body: \"}\n      - {id: 10, labels: [workline:to-refine, workline:draft, workline:accepted]}\n      - {id: 11, labels: [workline:to-refine, workline:draft]}\n```\n\n### tests/conformance/cases/product-owner/acts-recorded-with-day-and-level.yaml\n\n```\ncase: product-owner/acts-recorded-with-day-and-level\nabout: An act the role did alone is kept in its record with its kind, its issue, the autonomy level it was done at and the day, for the weekly sample to draw.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 7, title: \"Export drops the last row\", body: \"Every CSV file: the export drops the last row.\", labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: 0000000\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - {id: 12, title: \"Last row missing in CSV\", body: \"In my CSV export the last row is missing.\", labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: 0000000\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\nrun: {role: product-owner, event: schedule, ai: fake:close-duplicate}\nexpect:\n  status: pass\n  forge:\n    issues:\n      - {id: 12, closed: true}\n      - {id: 13, title: \"Backlog — product owner\", comment-contains: \"did:\\n    - issue: 12\\n      act: close-duplicate\\n      level: normal\\n      day: \\\"20\"}\n```\n\n### tests/conformance/cases/product-owner/acts-ticked-or-slipped-not-recorded.yaml\n\n```\ncase: product-owner/acts-ticked-or-slipped-not-recorded\nabout: A proposal a person of the project ticked, done by the engine, is the person's act, and a slipped milestone moved by the engine is its own; neither is recorded as an act the role did alone.\ngiven:\n  repo: backlog\n  setup: [\"git tag v1.0.0\"]\n  config:\n    roles:\n      product-owner:\n        settings:\n          acts: {rename: {mode: propose, max: 5}}\n  forge:\n    milestones: [v1.0.0, v1.9.0]\n    issues:\n      - {id: 9, title: \"bug\", body: \"The export loses the last row.\", author: ann, insider: true, labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - {id: 11, title: \"Rows lost\", body: \"Some rows are lost.\", milestone: v1.0.0, labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\"]}\n      - id: 10\n        title: \"Backlog — product owner\"\n        body: \"## Proposed\\n\\n- [x] Rename #9 from \\\"bug\\\" to \\\"The CSV export drops the last row\\\": \\\"bug\\\" says nothing. \u003c!-- workline:proposal=9/rename --\u003e\\n\"\n        labels: []\n        ticks: [{item: \"Rename #9 from \\\"bug\\\" to \\\"The CSV export drops the last row\\\": \\\"bug\\\" says nothing. \u003c!-- workline:proposal=9/rename --\u003e\", done: true, author: dev, insider: true}]\n        comments: [\"```yaml\\nproposed:\\n  - issue: 9\\n    act: rename\\n    line: 'Rename #9 from \\\"bug\\\" to \\\"The CSV export drops the last row\\\": \\\"bug\\\" says nothing.'\\n    proposal: {do: rename, issue: 9, title: The CSV export drops the last row, why: '\\\"bug\\\" says nothing.'}\\n```\\n\\n\u003c!-- workline:sticky=product-owner/acts --\u003e\"]\nrun: {role: product-owner, event: schedule, ai: none}\nexpect:\n  agent-calls: 0\n  forge:\n    issues:\n      - {id: 9, title: \"The CSV export drops the last row\"}\n      - {id: 11, milestone: v1.9.0}\n      - {id: 10, body-contains: \"Ticked by @dev.\", comment-lacks: \"did:\"}\n```\n\n### tests/conformance/cases/product-owner/agreed-and-accepted-applied.yaml\n\n```\ncase: product-owner/agreed-and-accepted-applied\nabout: A reply `agreed` and the label workline:accepted together — the reply settles the answer, so the engine writes the text last proposed and moves the issue to ready, with no agent.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 9, title: \"Rows lost\", body: \"Some rows are lost.\", author: zed, insider: false, labels: [workline:to-refine, workline:accepted], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\", \"@zed, the product owner read this issue.\\n\\n\u003cdetails\u003e\u003csummary\u003eAs the engine reads it\u003c/summary\u003e\\n\\n```yaml\\nneed: Every row exported.\\nverification: A test writes three rows.\\nvalidation: Zed opens a known day.\\nscope: WriteRows in src/export/csv.go.\\nsources: [src/export/csv.go]\\n```\\n\u003c/details\u003e\\n\\n\u003c!-- workline:product-owner/proposal=1 --\u003e\", {author: zed, body: \"Agreed!\\n\\nThanks.\"}]}\nrun: {role: product-owner, event: schedule, ai: fake:proposes-nothing}\nexpect:\n  agent-calls: 0\n  forge:\n    issues:\n      - {id: 9, body-contains: \"Some rows are lost.\\n\\n## Need\\n\\nEvery row exported.\", body-lacks: \"workline:draft\", labels: [workline:ready]}\n```\n\n### tests/conformance/cases/product-owner/agreed-text-already-written.yaml\n\n```\ncase: product-owner/agreed-text-already-written\nabout: A reply `agreed` to a text the body already holds — written by its reporter since — writes nothing again.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 9, title: \"Rows lost\", body: \"Some rows are lost.\\n\\n## Need\\n\\nEvery row, written by zed.\\n\\n## Verification\\n\\nA test writes three rows.\\n\\n## Validation\\n\\nZed opens a known day.\\n\\n## Scope\\n\\nWriteRows in src/export/csv.go.\", author: zed, insider: false, labels: [workline:to-refine], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\", \"@zed, the product owner read this issue.\\n\\n\u003cdetails\u003e\u003csummary\u003eAs the engine reads it\u003c/summary\u003e\\n\\n```yaml\\nneed: Every row exported.\\nverification: A test writes three rows.\\nvalidation: Zed opens a known day.\\nscope: WriteRows in src/export/csv.go.\\nsources: [src/export/csv.go]\\n```\\n\u003c/details\u003e\\n\\n\u003c!-- workline:product-owner/proposal=1 --\u003e\", {author: zed, body: \"Agreed!\\n\\nThanks.\"}]}\nrun: {role: product-owner, event: schedule, ai: fake:proposes-nothing}\nexpect:\n  no-findings: [{rule: not-agreed}]\n  forge:\n    issues:\n      - {id: 9, body-contains: \"Every row, written by zed.\", body-lacks: \"Every row exported.\", labels: [workline:to-refine]}\n```\n\n### tests/conformance/cases/product-owner/answer-read-then-follow-up.yaml\n\n```\ncase: product-owner/answer-read-then-follow-up\nabout: Its reporter answered, not enough to refine the issue; the role asks a narrower question, a second round, thanking them — the engine numbers the round in its marker.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 9, title: \"Rows lost\", body: \"Some rows are lost.\", author: ann, insider: true, labels: [], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\n\u003c!-- workline:sticky=product-owner/state --\u003e\", \"@ann, to refine this issue: When are rows lost?\\n\\n\u003c!-- workline:product-owner/ask --\u003e\", \"Every time I export.\"]}\nrun: {role: product-owner, event: schedule, ai: fake:ask-after-answer}\nexpect:\n  run-files:\n    in/task.md: {contains: \"(The product owner wrote:) @ann, to refine this issue: When are rows lost?\"}\n  forge:\n    issues:\n      - {id: 9, comments: 4}\n      - {id: 9, comment-contains: \"@ann, thank you; to refine this issue, still: Which export loses them: CSV or JSON?\"}\n      - {id: 9, comment-contains: \"\u003c!-- workline:product-owner/ask=2 --\u003e\"}\n```\n\n### tests/conformance/cases/product-owner/answer-read-then-ready.yaml\n\n```\ncase: product-owner/answer-read-then-ready\nabout: An issue whose reporter was asked, then answered and wrote the missing sections, is read again with the conversation shown — the question asked and the answer — and moved to ready.\ngiven:\n  repo: backlog\n  forge:\n    issues:\n      - {id: 9, title: \"Rows lost\", body: \"Some rows are lost.\\n\\n## Need\\n\\nThe monthly report counts every sale.\\n\\n## Verification\\n\\nA test writes three rows.\\n\\n## Validation\\n\\nAnn opens a known day.\\n\\n## Scope\\n\\nsrc/export/csv.go\", author: ann, insider: true, labels: [workline:to-refine], comments: [\"```yaml\\nsources: [src/export/csv.go]\\nconfirmed: d8c4dff\\njudged: d8c4dff\\n```\\n\\