{"material":"## The finding\n\nimportant: Reverts older than 100 commits are never read\n\nWhy: With no record on the forge, `demotions` reads only the last `revertWindow` (100) commits of the base. The same fallback applies when the recorded commit is no ancestor of the base tip, for example after a force-push. A revert of a merge that went in with no person's yes, sitting further back, is never read. Its kind stays free to merge alone, even though the docs say every revert is read.\n\nIts cause, quoted:\n\n```\nargs = append(args, \"-n\", strconv.Itoa(n), tip)\n```\n\nThe author's claim it contradicts, quoted from what they said:\n\n\u003e every revert on the base is read once\n\n## The code it stands on\n\nAs it reads at 0518025: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/engine/demote.go, lines 132 to 153: `commits`, the function the cause lies in\n\n```\n132  // commits are tip's history, every parent, newest first, with their\n133  // messages, a commit before its parents whatever their dates: the n last,\n134  // or those past from when it is given.\n135  func commits(repo, tip, from string, n int) ([]logged, error) {\n136  \targs := []string{\"log\", \"--topo-order\", \"--format=%H%x1f%B%x1e\"}\n137  \tif from != \"\" {\n138  \t\targs = append(args, from+\"..\"+tip)\n139  \t} else {\n140  \t\targs = append(args, \"-n\", strconv.Itoa(n), tip)\n141  \t}\n142  \tout, err := git(repo, nil, args...)\n143  \tif err != nil {\n144  \t\treturn nil, err\n145  \t}\n146  \tvar all []logged\n147  \tfor _, rec := range strings.Split(out, \"\\x1e\") {\n148  \t\tif sha, msg, ok := strings.Cut(strings.TrimSpace(rec), \"\\x1f\"); ok {\n149  \t\t\tall = append(all, logged{sha, msg})\n150  \t\t}\n151  \t}\n152  \treturn all, nil\n153  }\n```\n\n### internal/engine/demote.go, lines 265 to 353: `demotions`, the function the symptom lies in\n\n```\n265  // demotions reads the base's reverts past the record, demotes their kinds,\n266  // lifts those a person may lift, writes the record back, and returns each\n267  // kind demoted (kindAll: every kind) with the issue that says it.\n268  func demotions(f forge.Forge, o FollowOptions, baseTip, app string, res *Result) (map[string]string, error) {\n269  \tb, ok := f.(forge.Backlog)\n270  \tif !ok {\n271  \t\treturn nil, nil\n272  \t}\n273  \trec, err := readRecord(o.Repo)\n274  \tif err != nil {\n275  \t\treturn nil, err\n276  \t}\n277  \twas := rec.text()\n278  \tfrom := \"\"\n279  \tif rec.read != \"\" \u0026\u0026 isAncestor(o.Repo, rec.read, baseTip) {\n280  \t\tfrom = rec.read\n281  \t}\n282  \t// Every parent: a revert merged with a merge commit is on its second.\n283  \thistory, err := commits(o.Repo, baseTip, from, revertWindow)\n284  \tif err != nil {\n285  \t\treturn nil, err\n286  \t}\n287  \tvar deeper []logged // what a revert may name, read once if needed\n288  \tvar deepErr error\n289  \tfor i, r := range history {\n290  \t\tolder := func() []logged {\n291  \t\t\tif deeper == nil \u0026\u0026 deepErr == nil {\n292  \t\t\t\tdeeper, deepErr = commits(o.Repo, baseTip, \"\", mergeWindow)\n293  \t\t\t}\n294  \t\t\tat := slices.IndexFunc(deeper, func(c logged) bool { return c.sha == r.sha })\n295  \t\t\tif at \u003c 0 {\n296  \t\t\t\treturn history[i+1:]\n297  \t\t\t}\n298  \t\t\treturn deeper[at+1:]\n299  \t\t}\n300  \t\tn, revert := revertOf(o.Repo, r, older)\n301  \t\tif deepErr != nil {\n302  \t\t\treturn nil, fmt.Errorf(\"the base's history, for what a revert undoes: %w\", deepErr)\n303  \t\t}\n304  \t\tif !revert {\n305  \t\t\tcontinue\n306  \t\t}\n307  \t\tkind := kindAll // a revert of nothing found: every kind, failing closed\n308  \t\tif n \u003e 0 {\n309  \t\t\tnotes, err := b.Notes(forge.Target{Kind: \"merge-request\", ID: n})\n310  \t\t\tswitch {\n311  \t\t\tcase errors.Is(err, forge.ErrUnreachable) \u0026\u0026 !forge.Refused(err):\n312  \t\t\t\treturn nil, err\n313  \t\t\tcase err != nil:\n314  \t\t\t\tnotes = nil // no merge request of that number here\n315  \t\t\t}\n316  \t\t\talone, ok := ownNote(notes, \"merge-alone=\", app)\n317  \t\t\tswitch {\n318  \t\t\tcase ok \u0026\u0026 slices.Contains(RoutineKinds, alone):\n319  \t\t\t\tkind = alone\n320  \t\t\tcase err == nil:\n321  \t\t\t\tcontinue // a merge request merged with a person's yes, or never by workline\n322  \t\t\t}\n323  \t\t}\n324  \t\tif kind == kindAll {\n325  \t\t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"revert-unread\", Level: \"warn\", Where: short(r.sha),\n326  \t\t\t\tMessage: fmt.Sprintf(\"`%s` reverts something workline cannot tie to a merge request: every kind of its own merge requests waits for a person's yes, until a person says\", firstSentence(r.msg))})\n327  \t\t}\n328  \t\trec.demoted = append(rec.demoted, demotion{kind: kind, revert: r.sha, request: n})\n329  \t}\n330  \trec.read = baseTip\n331  \tdemoted := map[string]string{}\n332  \tvar kept []demotion\n333  \tfor _, d := range rec.demoted {\n334  \t\tlifted, err := demote(f, b, \u0026d, app, res)\n335  \t\tif err != nil {\n336  \t\t\treturn nil, err\n337  \t\t}\n338  \t\tif lifted {\n339  \t\t\tcontinue\n340  \t\t}\n341  \t\tkept = append(kept, d)\n342  \t\tif _, ok := demoted[d.kind]; !ok {\n343  \t\t\tdemoted[d.kind] = map[bool]string{true: fmt.Sprintf(\"#%d\", d.issue), false: \"its issue not opened yet\"}[d.issue \u003e 0]\n344  \t\t}\n345  \t}\n346  \trec.demoted = kept\n347  \tif rec.text() != was {\n348  \t\tif err := writeRecord(o.Repo, rec); err != nil {\n349  \t\t\treturn nil, err\n350  \t\t}\n351  \t}\n352  \treturn demoted, nil\n353  }\n```\n\n### internal/engine/engine.go, lines 2605 to 2614: `git`, called by `commits`\n\n```\n2605  func git(repo string, stdin io.Reader, args ...string) (string, error) {\n2606  \tcmd := exec.Command(\"git\", append([]string{\"-C\", repo, \"-c\", \"core.quotePath=off\"}, args...)...)\n2607  \tcmd.Stdin = stdin\n2608  \tvar out, errOut strings.Builder\n2609  \tcmd.Stdout, cmd.Stderr = \u0026out, \u0026errOut\n2610  \tif err := cmd.Run(); err != nil {\n2611  \t\treturn \"\", fmt.Errorf(\"git %s: %v: %s\", args[0], err, strings.TrimSpace(errOut.String()))\n2612  \t}\n2613  \treturn strings.TrimSpace(out.String()), nil\n2614  }\n```\n\n### internal/engine/demote.go, lines 155 to 204: `revertOf`, calls `commits`\n\n```\n155  // revertOf is the merge request commit r reverts, 0 when it names none\n156  // found, and whether r is a revert at all. Named in its message — git's\n157  // words naming the commit reverted, GitLab's or GitHub's naming the merge\n158  // request —, else found by the title it quotes: GitHub's own revert says\n159  // only `Revert \"\u003ctitle\u003e\"`. Among the merges with that title in older, the\n160  // commits older than r, newest first, the one r undoes exactly — the same\n161  // change, inverted — is taken, else the newest.\n162  func revertOf(repo string, r logged, older func() []logged) (int, bool) {\n163  \tsubject, _, _ := strings.Cut(r.msg, \"\\n\")\n164  \tif !revertSubject.MatchString(subject) \u0026\u0026 !strings.Contains(r.msg, \"This reverts \") \u0026\u0026 !revertsPull.MatchString(r.msg) {\n165  \t\treturn 0, false\n166  \t}\n167  \tfor _, re := range []*regexp.Regexp{revertsRequest, revertsPull} {\n168  \t\tif m := re.FindStringSubmatch(r.msg); m != nil {\n169  \t\t\tn, _ := strconv.Atoi(m[1])\n170  \t\t\treturn n, true\n171  \t\t}\n172  \t}\n173  \tif m := revertsCommit.FindStringSubmatch(r.msg); m != nil {\n174  \t\tif was, err := git(repo, nil, \"log\", \"-1\", \"--format=%B\", m[1]); err == nil {\n175  \t\t\tif n, _ := requestOf(was); n \u003e 0 {\n176  \t\t\t\treturn n, true\n177  \t\t\t}\n178  \t\t}\n179  \t}\n180  \tm := revertSubject.FindStringSubmatch(subject)\n181  \tif m == nil {\n182  \t\treturn 0, true\n183  \t}\n184  \tif n, _ := requestOf(m[1]); n \u003e 0 {\n185  \t\treturn n, true // `Revert \"\u003ctitle\u003e (#N)\"`\n186  \t}\n187  \tundone, first := \"\", 0\n188  \tfor _, c := range older() {\n189  \t\tn, title := requestOf(c.msg)\n190  \t\tif n == 0 || title != m[1] {\n191  \t\t\tcontinue\n192  \t\t}\n193  \t\tif undone == \"\" {\n194  \t\t\tundone = patchID(repo, r.sha, r.sha+\"^\")\n195  \t\t}\n196  \t\tif undone != \"\" \u0026\u0026 patchID(repo, c.sha+\"^1\", c.sha) == undone {\n197  \t\t\treturn n, true\n198  \t\t}\n199  \t\tif first == 0 {\n200  \t\t\tfirst = n\n201  \t\t}\n202  \t}\n203  \treturn first, true\n204  }\n```\n\n### internal/engine/engine.go, lines 928 to 937: `trailers`, calls `commits`\n\n```\n928  // trailers name, in an engine's commit, the role, and the agents and models\n929  // that wrote what it commits: a later reader of the doc stands apart from\n930  // them (ADR-0005; the weekly sample, ADR-0014 step 4).\n931  func (s *runState) trailers() string {\n932  \tt := OwnTrailer + \": \" + s.Role\n933  \tfor _, m := range s.Models {\n934  \t\tt += \"\\n\" + ModelTrailer + \": \" + m\n935  \t}\n936  \treturn t\n937  }\n```\n\n### internal/engine/engine.go, lines 1321 to 1337: `openMergeRequest`, calls `commits`\n\n```\n1321  // openMergeRequest commits what the run's patches wrote on the role's branch\n1322  // for this task, force-pushes it, opens its merge request or updates the one\n1323  // open, and puts the working tree back on the branch it was on. The role\n1324  // names the task's key and the title in out/merge-request.yaml.\n1325  func openMergeRequest(f forge.Forge, st runState, runDir string) (int, error) {\n1326  \tvar mr struct{ Key, Title, Body string }\n1327  \tif data, err := os.ReadFile(filepath.Join(runDir, \"out\", \"merge-request.yaml\")); err == nil {\n1328  \t\tif err := yaml.Unmarshal(data, \u0026mr); err != nil {\n1329  \t\t\treturn 0, fmt.Errorf(\"out/merge-request.yaml: %w\", err)\n1330  \t\t}\n1331  \t}\n1332  \tmr.Key = mergeRequestKey(st, runDir)\n1333  \tif mr.Title == \"\" {\n1334  \t\tmr.Title = \"chore(\" + st.Role + \"): what the \" + st.Role + \" proposes\"\n1335  \t}\n1336  \treturn ProposeBranch(f, st.Repo, st.Role, mr.Key, mr.Title, mr.Body, st.trailers(), st.Written)\n1337  }\n```\n\nNot shown, past 200 lines: `commitOntoBase` (internal/engine/engine.go:1145-1205, calls `commits`); `pushToMergeRequest` (internal/engine/engine.go:1207-1246, calls `commits`); `commitOnto` (internal/engine/engine.go:1248-1292, calls `commits`); `ProposeBranch` (internal/engine/engine.go:1357-1401, calls `commits`); `tips` (internal/engine/follow.go:315-343, calls `commits`); `personsCommit` (internal/engine/follow.go:345-362, calls `commits`); `recommit` (internal/engine/follow.go:604-628, calls `commits`); `pushedAfter` (internal/engine/merge.go:322-376, calls `commits`); `routineCandidate` (internal/engine/routine.go:60-74, calls `commits`); `settle` (internal/engine/settle.go:107-200, calls `commits`); `updateMessage` (internal/engine/settle.go:202-208, calls `commits`); `mergeMessage` (internal/engine/settle.go:241-252, calls `commits`); and 2 more. What would prove or refute the finding may lie in them.\n\nNot shown, defined in too many places to tell which: `Read` (4 definitions).\n\n## What the change did to internal/engine/demote.go, near the cause\n\n```diff\ndiff --git a/internal/engine/demote.go b/internal/engine/demote.go\nnew file mode 100644\nindex 0000000..159f789\n--- /dev/null\n+++ b/internal/engine/demote.go\n@@ -0,0 +1,435 @@\n+package engine\n+\n+import (\n+\t\"errors\"\n+\t\"fmt\"\n+\t\"regexp\"\n+\t\"slices\"\n+\t\"strconv\"\n+\t\"strings\"\n+\n+\t\"github.com/JN0V/workline/internal/forge\"\n+\t\"github.com/JN0V/workline/internal/verdict\"\n+)\n+\n+// A revert demotes (ADR-0042, `normal`; ADR-0026): a revert on the base of\n+// a merge request workline merged with no person's yes sends its kind back\n+// to a person's yes; a revert it cannot tie to a merge request, every kind.\n+// Each is read once: the engine's record on the forge, the ref recordRef,\n+// keeps the last base commit read and each demotion with the issue that\n+// says it. A demotion is lifted when a person who may push and merge closes\n+// that issue — never a bot, nor someone else.\n+\n+// recordRef is the engine's record of the merge policy on the forge.\n+const recordRef = \"refs/workline/merge-policy\"\n+\n+// revertWindow is how many commits of the base's history are read for\n+// reverts when no record says where the last run stopped; mergeWindow, how\n+// many for the merge a revert quoting a title undoes.\n+const (\n+\trevertWindow = 100\n+\tmergeWindow  = 1000\n+)\n+\n+// demotion is a kind sent back to a person's yes: the revert that did it,\n+// the merge request it reverted (0: none found), the issue that says it (0:\n+// none could be opened as workline's own yet).\n+type demotion struct {\n+\tkind, revert string\n+\trequest      int\n+\tissue        int\n+}\n+\n+// record is what the engine keeps of the merge policy: the last base commit\n+// read for reverts, and the demotions in force.\n+type record struct {\n+\tread     string\n+\tdemoted  []demotion\n+\twas, sha string // the record's commit as read, \"\" none\n+}\n+\n+// readRecord reads the record from origin; an empty one when there is none.\n+func readRecord(repo string) (record, error) {\n+\tout, err := git(repo, nil, \"ls-remote\", \"origin\", recordRef)\n+\tif err != nil {\n+\t\treturn record{}, fmt.Errorf(\"%w: %v\", forge.ErrUnreachable, err)\n+\t}\n+\tsha, _, _ := strings.Cut(out, \"\\t\")\n+\tif sha = strings.TrimSpace(sha); sha == \"\" {\n+\t\treturn record{}, nil\n+\t}\n+\tif _, err := git(repo, nil, \"fetch\", \"-q\", \"origin\", recordRef); err != nil {\n+\t\treturn record{}, fmt.Errorf(\"%w: %v\", forge.ErrUnreachable, err)\n+\t}\n+\tmsg, err := git(repo, nil, \"log\", \"-1\", \"--format=%B\", sha)\n+\tif err != nil {\n+\t\treturn record{}, err\n+\t}\n+\tr := record{was: sha}\n+\tfor _, l := range strings.Split(msg, \"\\n\") {\n+\t\tf := strings.Fields(l)\n+\t\tswitch {\n+\t\tcase len(f) == 2 \u0026\u0026 f[0] == \"read\":\n+\t\t\tr.read = f[1]\n+\t\tcase len(f) == 5 \u0026\u0026 f[0] == \"demoted\":\n+\t\t\tn, _ := strconv.Atoi(f[3])\n+\t\t\ti, _ := strconv.Atoi(f[4])\n+\t\t\tr.demoted = append(r.demoted, demotion{kind: f[1], revert: f[2], request: n, issue: i})\n+\t\t}\n+\t}\n+\treturn r, nil\n+}\n+\n+// text is the record as its commit's message.\n+func (r record) text() string {\n+\tvar b strings.Builder\n+\tb.WriteString(\"workline: the merge policy's record (ADR-0042)\\n\\nThe last base commit read for reverts, and each kind of workline's own\\nmerge requests sent back to a person's yes: kind, revert, merge request\\nreverted, issue.\\n\\n\")\n+\tfmt.Fprintf(\u0026b, \"read %s\\n\", r.read)\n+\tfor _, d := range r.demoted {\n+\t\tfmt.Fprintf(\u0026b, \"demoted %s %s %d %d\\n\", d.kind, d.revert, d.request, d.issue)\n+\t}\n+\treturn b.String()\n+}\n+\n+// writeRecord pushes the record to origin when it changed, its last\n+// version as lease: a record moved meanwhile is no record overwritten.\n+func writeRecord(repo string, r record) error {\n+\ttree, err := gitIn(repo, \"\", \"mktree\")\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\targs := []string{\"-c\", \"user.name=workline\", \"-c\", \"user.email=workline@noreply.invalid\", \"commit-tree\", tree, \"-m\", r.text()}\n+\tif r.was != \"\" {\n+\t\targs = append(args, \"-p\", r.was)\n+\t}\n+\tcommit, err := git(repo, nil, args...)\n+\tif err != nil {\n+\t\treturn err\n+\t}\n+\tif _, err := git(repo, nil, \"push\", \"-q\", \"--force-with-lease=\"+recordRef+\":\"+r.was, \"origin\", commit+\":\"+recordRef); err != nil {\n+\t\treturn fmt.Errorf(\"%w: the merge policy's record (%s) not written: %v\", forge.ErrUnreachable, recordRef, err)\n+\t}\n+\treturn nil\n+}\n+\n+// The ways a revert names what it reverts: git's own message, GitLab's\n+// revert of a merge request, GitHub's revert pull request; and how a\n+// merge on the base names its merge request: GitHub's squash or merge\n+// subject, GitLab's merge commit.\n+var (\n+\trevertsCommit  = regexp.MustCompile(`(?m)^This reverts commit ([0-9a-f]{7,40})\\b`)\n+\trevertsRequest = regexp.MustCompile(`(?m)This reverts merge request !(\\d+)\\b`)\n+\trevertsPull    = regexp.MustCompile(`(?m)^Reverts (?:[\\w.-]+/[\\w.-]+)?#(\\d+)\\b`)\n+\trevertSubject  = regexp.MustCompile(`^Revert \"(.*)\"`)\n+\tsquashSubject  = regexp.MustCompile(`\\((?:#|!)(\\d+)\\)\\s*$`)\n+\tmergeSubject   = regexp.MustCompile(`^Merge pull request #(\\d+)\\b`)\n+\tmergeRequestOf = regexp.MustCompile(`(?m)^See merge request \\S*!(\\d+)\\b`)\n+)\n+\n+// logged is a commit of the base's history and its message.\n+type logged struct{ sha, msg string }\n+\n+// commits are tip's history, every parent, newest first, with their\n+// messages, a commit before its parents whatever their dates: the n last,\n+// or those past from when it is given.\n+func commits(repo, tip, from string, n int) ([]logged, error) {\n+\targs := []string{\"log\", \"--topo-order\", \"--format=%H%x1f%B%x1e\"}\n+\tif from != \"\" {\n+\t\targs = append(args, from+\"..\"+tip)\n+\t} else {\n+\t\targs = append(args, \"-n\", strconv.Itoa(n), tip)\n+\t}\n+\tout, err := git(repo, nil, args...)\n+\tif err != nil {\n+\t\treturn nil, err\n+\t}\n+\tvar all []logged\n+\tfor _, rec := range strings.Split(out, \"\\x1e\") {\n+\t\tif sha, msg, ok := strings.Cut(strings.TrimSpace(rec), \"\\x1f\"); ok {\n+\t\t\tall = append(all, logged{sha, msg})\n+\t\t}\n+\t}\n+\treturn all, nil\n+}\n+\n+// revertOf is the merge request commit r reverts, 0 when it names none\n+// found, and whether r is a revert at all. Named in its message — git's\n+// words naming the commit reverted, GitLab's or GitHub's naming the merge\n+// request —, else found by the title it quotes: GitHub's own revert says\n+// only `Revert \"\u003ctitle\u003e\"`. Among the merges with that title in older, the\n+// commits older than r, newest first, the one r undoes exactly — the same\n+// change, inverted — is taken, else the newest.\n+func revertOf(repo string, r logged, older func() []logged) (int, bool) {\n+\tsubject, _, _ := strings.Cut(r.msg, \"\\n\")\n+\tif !revertSubject.MatchString(subject) \u0026\u0026 !strings.Contains(r.msg, \"This reverts \") \u0026\u0026 !revertsPull.MatchString(r.msg) {\n+\t\treturn 0, false\n+\t}\n+\tfor _, re := range []*regexp.Regexp{revertsRequest, revertsPull} {\n+\t\tif m := re.FindStringSubmatch(r.msg); m != nil {\n+\t\t\tn, _ := strconv.Atoi(m[1])\n+\t\t\treturn n, true\n+\t\t}\n+\t}\n+\tif m := revertsCommit.FindStringSubmatch(r.msg); m != nil {\n+\t\tif was, err := git(repo, nil, \"log\", \"-1\", \"--format=%B\", m[1]); err == nil {\n+\t\t\tif n, _ := requestOf(was); n \u003e 0 {\n+\t\t\t\treturn n, true\n+\t\t\t}\n+\t\t}\n+\t}\n+\tm := revertSubject.FindStringSubmatch(subject)\n+\tif m == nil {\n+\t\treturn 0, true\n+\t}\n+\tif n, _ := requestOf(m[1]); n \u003e 0 {\n+\t\treturn n, true // `Revert \"\u003ctitle\u003e (#N)\"`\n+\t}\n+\tundone, first := \"\", 0\n+\tfor _, c := range older() {\n+\t\tn, title := requestOf(c.msg)\n+\t\tif n == 0 || title != m[1] {\n+\t\t\tcontinue\n+\t\t}\n+\t\tif undone == \"\" {\n+\t\t\tundone = patchID(repo, r.sha, r.sha+\"^\")\n\n(cut)\n```\n","question":"Is this finding about the author's claim true: does the code quoted, as it reads, contradict the claim quoted, as the author made it? Answer no if the code does what the claim says, if the claim says nothing the code could contradict, or if the finding only guesses."}