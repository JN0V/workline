evidence: "internal/builtin/reviewer/reach.go:285-306 stripCode strips only \"…\", `…` and // or # comments; a rune/char literal '{' or '}' and a JS regex literal /{/ reach braceEnd (259-281) and change depth. `case c == '\"'` also opens a bogus string to the end of the line. — Applies to the C-like family (C, Java, JS, TS, Rust…), shell, and Go when the file does not parse (goEnclosing's parsed=false). The PR's later commit 2fac5063 \"braces in quotes, a symptom shown once\" touches this; the verdict rests on the code read."
