{"material":"## The finding\n\nimportant: Brace matching counts braces in rune literals and raw regex\n\nWhy: stripCode only handles double quotes and backticks. A rune literal such as '{' or '}' in Go, C or Java, or a single-quoted string in JavaScript, changes the depth. The function ends at the wrong line, so the judge is shown a truncated or overlong function. In shell, a single-quoted string such as '{a: .b}' is not stripped either.\n\nIts cause, quoted:\n\n```\ncase c == '\"' || (c == '`' \u0026\u0026 !shell):\n```\n\n## The code it stands on\n\nAs it reads at 7592b24: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/builtin/reviewer/reach.go, lines 284 to 308: `stripCode`, the function the cause lies in\n\n```\n284  // stripCode drops a line's strings and comment, roughly: their braces are\n285  // not the code's.\n286  func stripCode(line string, shell bool) string {\n287  \tvar b strings.Builder\n288  \tvar quote rune\n289  \tprev := ' '\n290  \tfor _, c := range line {\n291  \t\tswitch {\n292  \t\tcase quote != 0:\n293  \t\t\tif c == quote \u0026\u0026 prev != '\\\\' {\n294  \t\t\t\tquote = 0\n295  \t\t\t}\n296  \t\tcase c == '\"' || (c == '`' \u0026\u0026 !shell):\n297  \t\t\tquote = c\n298  \t\tcase c == '#' \u0026\u0026 shell \u0026\u0026 (prev == ' ' || prev == '\\t' || b.Len() == 0):\n299  \t\t\treturn b.String()\n300  \t\tcase c == '/' \u0026\u0026 prev == '/' \u0026\u0026 !shell:\n301  \t\t\treturn b.String()\n302  \t\tdefault:\n303  \t\t\tb.WriteRune(c)\n304  \t\t}\n305  \t\tprev = c\n306  \t}\n307  \treturn b.String()\n308  }\n```\n\n### internal/builtin/reviewer/record.go, lines 29 to 32: `String`, called by `stripCode`\n\n```\n29  // String is the record as the summary comment and the local file hold it.\n30  func (r Record) String() string {\n31  \treturn fmt.Sprintf(\"\u003c!-- workline:record reviewed=%s runs=%d --\u003e\", strings.Join(r.Reviewed, \",\"), r.Runs)\n32  }\n```\n\n### internal/builtin/reviewer/reach.go, lines 255 to 282: `braceEnd`, calls `stripCode`\n\n```\n255  // braceEnd is the line a function's braces close on: its first brace within\n256  // six lines of its definition, before any `;`; 0 when there is none.\n257  func braceEnd(lines []string, def int, shell bool) int {\n258  \tdepth, opened := 0, false\n259  \tfor n := def; n \u003c= len(lines); n++ {\n260  \t\tline := stripCode(lines[n-1], shell)\n261  \t\tfor _, c := range line {\n262  \t\t\tswitch c {\n263  \t\t\tcase ';':\n264  \t\t\t\tif !opened \u0026\u0026 !shell {\n265  \t\t\t\t\treturn 0\n266  \t\t\t\t}\n267  \t\t\tcase '{':\n268  \t\t\t\tdepth++\n269  \t\t\t\topened = true\n270  \t\t\tcase '}':\n271  \t\t\t\tdepth--\n272  \t\t\t\tif opened \u0026\u0026 depth == 0 {\n273  \t\t\t\t\treturn n\n274  \t\t\t\t}\n275  \t\t\t}\n276  \t\t}\n277  \t\tif !opened \u0026\u0026 n-def \u003e= 6 {\n278  \t\t\treturn 0\n279  \t\t}\n280  \t}\n281  \treturn 0\n282  }\n```\n\n## What the change did to internal/builtin/reviewer/reach.go, near the cause\n\n```diff\ndiff --git a/internal/builtin/reviewer/reach.go b/internal/builtin/reviewer/reach.go\nnew file mode 100644\nindex 0000000..b07844b\n--- /dev/null\n+++ b/internal/builtin/reviewer/reach.go\n@@ -0,0 +1,627 @@\n+package reviewer\n+\n+// What a judge reads of the code around a finding (#127): the function its\n+// cause lies in, whole; then the functions the finding names, those that\n+// function calls and those calling it, whole, up to judge-lines-max lines\n+// all together, the rest named. Found with no build (docs/research/\n+// code-navigation.md): Go by its own parser; other languages by a\n+// definition pattern for their extension, and braces, indentation or an\n+// `end` for a function's bounds; references by word search at the head.\n+\n+import (\n+\t\"fmt\"\n+\t\"go/ast\"\n+\t\"go/parser\"\n+\t\"go/token\"\n+\t\"path\"\n+\t\"regexp\"\n+\t\"slices\"\n+\t\"strings\"\n+\n+\t\"github.com/JN0V/workline/internal/pathglob\"\n+)\n+\n+// language is how functions are found in a family of files.\n+type language struct {\n+\tname string\n+\texts []string\n+\tdef  string // a definition's pattern, NAME standing for its name\n+\tbody string // go, braces, indent (Python), end (Ruby, Lua)\n+}\n+\n+var languages = []language{\n+\t{\"Go\", []string{\".go\"}, `^func\\s+(?:\\([^)]*\\)\\s*)?(NAME)\\s*[\\[(]`, \"go\"},\n+\t{\"shell\", []string{\".sh\", \".bash\", \".zsh\", \".ksh\"}, `^\\s*(?:function\\s+(NAME)\\b|(NAME)\\s*\\(\\s*\\))`, \"braces\"},\n+\t{\"Python\", []string{\".py\"}, `^\\s*(?:async\\s+)?def\\s+(NAME)\\s*\\(`, \"indent\"},\n+\t{\"Ruby\", []string{\".rb\"}, `^\\s*def\\s+(?:self\\.)?(NAME)\\b`, \"end\"},\n+\t{\"Lua\", []string{\".lua\"}, `^\\s*(?:local\\s+)?function\\s+(?:[\\w.:]*[.:])?(NAME)\\s*\\(`, \"end\"},\n+\t{\"C-like\", []string{\".c\", \".h\", \".cc\", \".cpp\", \".cxx\", \".hpp\", \".hh\", \".java\", \".cs\", \".js\", \".jsx\", \".mjs\", \".cjs\", \".ts\", \".tsx\", \".rs\", \".kt\", \".kts\", \".swift\", \".php\", \".scala\", \".dart\", \".groovy\"},\n+\t\t`(?:\\b(?:function|fn|fun|func|def)\\s+(NAME)\\b|\\b(?:const|let|var)\\s+(NAME)\\s*=\\s*(?:async\\s+)?(?:function\\b|\\([^)]*\\)\\s*=\u003e|[A-Za-z_$][\\w$]*\\s*=\u003e)|^\\s*(?:[\\w$:\u003c\u003e,*\u0026\\[\\]~.]+\\s+)*(NAME)\\s*\\([^;{]*(?:\\{.*)?$)`, \"braces\"},\n+}\n+\n+// notCalls are words a pattern would take for a function's name: the\n+// keywords that open a block with a parenthesis.\n+var notCalls = map[string]bool{\"if\": true, \"for\": true, \"while\": true, \"switch\": true, \"catch\": true, \"return\": true,\n+\t\"else\": true, \"do\": true, \"new\": true, \"throw\": true, \"await\": true, \"case\": true, \"typeof\": true, \"sizeof\": true,\n+\t\"elif\": true, \"until\": true, \"with\": true, \"foreach\": true, \"func\": true, \"function\": true, \"fn\": true, \"fun\": true,\n+\t\"def\": true, \"go\": true, \"defer\": true, \"select\": true, \"range\": true, \"make\": true, \"len\": true, \"append\": true}\n+\n+func languageOf(file string) *language {\n+\text := strings.ToLower(path.Ext(file))\n+\tfor i := range languages {\n+\t\tif slices.Contains(languages[i].exts, ext) {\n+\t\t\treturn \u0026languages[i]\n+\t\t}\n+\t}\n+\treturn nil\n+}\n+\n+func (l *language) pattern(name string) *regexp.Regexp {\n+\tn := `[A-Za-z_$][\\w$]*`\n+\tif name != \"\" {\n+\t\tn = regexp.QuoteMeta(name)\n+\t}\n+\treturn regexp.MustCompile(strings.ReplaceAll(l.def, \"NAME\", n))\n+}\n+\n+// defined is the name a line defines, by the language's pattern; \"\" none.\n+func (l *language) defined(line string, re *regexp.Regexp) string {\n+\tm := re.FindStringSubmatch(line)\n+\tif m == nil {\n+\t\treturn \"\"\n+\t}\n+\tfor _, g := range m[1:] {\n+\t\tif g != \"\" {\n+\t\t\tif notCalls[g] {\n+\t\t\t\treturn \"\"\n+\t\t\t}\n+\t\t\treturn g\n+\t\t}\n+\t}\n+\treturn \"\"\n+}\n+\n+// fn is a function found: its file, its lines (its doc comment included),\n+// its name, and what it is to the finding.\n+type fn struct {\n+\tfile     string\n+\tfrom, to int\n+\tname     string\n+\twhy      string\n+\tcalls    []string // the names it calls, in order\n+}\n+\n+func (f fn) lines() int  { return f.to - f.from + 1 }\n+func (f fn) key() string { return fmt.Sprintf(\"%s:%d\", f.file, f.from) }\n+\n+// reacher finds functions in the repository at one commit, each file read\n+// once.\n+type reacher struct {\n+\trepo, head string\n+\tskip       []string // test files: what the tests judge reads apart\n+\tfiles      map[string][]string\n+}\n+\n+func (r *reacher) lines(file string) []string {\n+\tif l, ok := r.files[file]; ok {\n+\t\treturn l\n+\t}\n+\ttext, _ := fileAt(r.repo, r.head, file)\n+\tl := strings.Split(strings.TrimSuffix(text, \"\\n\"), \"\\n\")\n+\tr.files[file] = l\n+\treturn l\n+}\n+\n+// enclosing is the function a file's line lies in; ok false when none is found.\n+func (r *reacher) enclosing(file string, at int) (fn, bool) {\n+\tl := languageOf(file)\n+\tif l == nil {\n+\t\treturn fn{}, false\n+\t}\n+\tlines := r.lines(file)\n+\tif l.body == \"go\" {\n+\t\tif f, ok, parsed := goEnclosing(file, lines, at); parsed {\n+\t\t\treturn f, ok\n+\t\t}\n+\t}\n+\tre := l.pattern(\"\")\n+\tfor n := min(at, len(lines)); n \u003e= 1; n-- {\n+\t\tname := l.defined(lines[n-1], re)\n+\t\tif name == \"\" {\n+\t\t\tcontinue\n+\t\t}\n+\t\tif f, ok := bounds(l, file, lines, n, name); ok \u0026\u0026 f.to \u003e= at {\n+\t\t\treturn f, true\n+\t\t}\n+\t}\n+\treturn fn{}, false\n+}\n+\n+// at is the function defined on a file's line n.\n+func (r *reacher) at(file string, n int, name string) (fn, bool) {\n+\tl := languageOf(file)\n+\tlines := r.lines(file)\n+\tif l.body == \"go\" {\n+\t\tif f, ok, parsed := goEnclosing(file, lines, n); parsed {\n+\t\t\treturn f, ok \u0026\u0026 f.name == name\n+\t\t}\n+\t}\n+\treturn bounds(l, file, lines, n, name)\n+}\n+\n+// goEnclosing finds, with Go's parser, the function declared around line at;\n+// parsed false when the file does not parse.\n+func goEnclosing(file string, lines []string, at int) (fn, bool, bool) {\n+\tfset := token.NewFileSet()\n+\tsrc := strings.Join(lines, \"\\n\") + \"\\n\"\n+\taf, err := parser.ParseFile(fset, file, src, parser.ParseComments|parser.SkipObjectResolution)\n+\tif err != nil {\n+\t\treturn fn{}, false, false\n+\t}\n+\tfor _, d := range af.Decls {\n+\t\tfd, ok := d.(*ast.FuncDecl)\n+\t\tif !ok {\n+\t\t\tcontinue\n+\t\t}\n+\t\tfrom, to := fset.Position(fd.Pos()).Line, fset.Position(fd.End()).Line\n+\t\tif fd.Doc != nil {\n+\t\t\tfrom = fset.Position(fd.Doc.Pos()).Line\n+\t\t}\n+\t\tif at \u003c from || at \u003e to {\n+\t\t\tcontinue\n+\t\t}\n+\t\tf := fn{file: file, from: from, to: to, name: fd.Name.Name}\n+\t\tseen := map[string]bool{fd.Name.Name: true}\n+\t\tast.Inspect(fd, func(n ast.Node) bool {\n+\t\t\tc, ok := n.(*ast.CallExpr)\n+\t\t\tif !ok {\n+\t\t\t\treturn true\n+\t\t\t}\n+\t\t\tfun := c.Fun\n+\t\t\tif ix, ok := fun.(*ast.IndexExpr); ok {\n+\t\t\t\tfun = ix.X\n+\t\t\t}\n+\t\t\tvar name string\n+\t\t\tswitch e := fun.(type) {\n+\t\t\tcase *ast.Ident:\n+\t\t\t\tname = e.Name\n+\t\t\tcase *ast.SelectorExpr:\n+\t\t\t\tname = e.Sel.Name\n+\t\t\t}\n+\t\t\tif name != \"\" \u0026\u0026 !seen[name] {\n+\t\t\t\tseen[name] = true\n+\t\t\t\tf.calls = append(f.calls, name)\n+\t\t\t}\n\n(cut)\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}