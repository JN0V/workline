{"material":"## The finding\n\nimportant: Label removal for set-aside issues with no state\n\nWhy: The labels-follow-state block runs for every open issue; st is dereferenced in HasDraft(is.Body, st) and st.Aside. When the issue has no state, st may be nil and this panics. Elsewhere the code treats st as possibly nil (IsDraft checks st == nil).\n\nIts cause, quoted:\n\n```\nif slices.Contains(is.Labels, l) \u0026\u0026 (l == LabelDraft || st.Aside != \"\") \u0026\u0026 !slices.Contains(remove, l) {\n```\n\n## The code it stands on\n\nAs it reads at 1ef286d: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/backlog/ledger.go, lines 433 to 581: `Persist`, the function the cause lies in\n\n```\n433  // Persist writes what the run leaves on each issue (ADR-0038): its record\n434  // in its state comment, edited in place; the label workline:proposed on an\n435  // issue waiting on a person, off one that no longer waits, off one a\n436  // person accepted; 👀 on a person's comments read, and one line in reply.\n437  // The old report, read this run, is closed with a link to the filter.\n438  // Each write is idempotent: a resumed run writes the same.\n439  func (p *Plan) Persist(f forge.Forge, role string) error {\n440  \tb, ok := f.(forge.Backlog)\n441  \tif !ok {\n442  \t\treturn nil\n443  \t}\n444  \tids := slices.Clone(p.Visit)\n445  \tfor _, q := range p.Record.Proposed {\n446  \t\tids = append(ids, q.Issue)\n447  \t}\n448  \tfor _, c := range p.Record.Closed {\n449  \t\tids = append(ids, c.Issue)\n450  \t}\n451  \tfor _, d := range p.Record.Did {\n452  \t\tids = append(ids, d.Issue)\n453  \t}\n454  \tfor _, d := range p.Decisions {\n455  \t\tif d.Mode != Off \u0026\u0026 d.Act.Issue \u003e 0 {\n456  \t\t\tids = append(ids, d.Act.Issue)\n45