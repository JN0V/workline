evidence: "internal/backlog/ledger.go:241-249: an issue enters `l.Aside` only after `ReadState` found and parsed its state (`if !found || err != nil { continue }` precedes `setAside(f, is, st)`); backlog.go:993-996 builds `p.SetAside` from `l.Aside` alone. So a set-aside issue always has a readable state, and Persist's `continue` at ledger.go:482-485 never skips one; ledger.go:530-538 then runs for it with st.Aside set at line 498 or kept from the state. — The premise 'set-aside with no state' cannot occur: being set aside is derived from the state comment. An issue with the role's labels and no state (e.g. a split child labelled at engine.go:2250) is not set aside and is not what the finding names. The conformance case labels-follow-the-state.yaml covers set-aside this run (#9) and an earlier one (#12)."
