{"material":"## The finding\n\nimportant: \"Every line starting with /\" is not escaped: indented lines are skipped\n\nWhy: `Inert` skips every line indented four or more columns, and a tab now counts as four. It takes any such line for indented code. In CommonMark an indented line directly after a paragraph line is a continuation, not code. The same goes for a tab-indented line after text, and for a line in a list item. A line such as `text\\n\\t/close` is therefore left unescaped. If GitLab's quick-action extractor skips only fenced blocks, the engine's own text would run the action. The change widens this skip to tabs, so the blanket claim does not hold.\n\nIts cause, quoted:\n\n```\ncase indent \u003e 3:\n\t\t\t// Indented code, or a line inside a fenced block: never a\n\t\t\t// fence (CommonMark).\n```\n\nThe author's claim it contradicts, quoted from what they said:\n\n\u003e every line the engine writes that starts with `/` is escaped.\n\n## The code it stands on\n\nAs it reads at 9fcc416: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/backlog/ledger.go, lines 627 to 656: `Inert`, the function the cause lies in\n\n```\n627  // Inert is a text the role writes on a forge with every line that starts\n628  // with `/` escaped, outside fenced code: GitLab runs a quick action at a\n629  // line's start when a comment or a description is written, and when it is\n630  // edited (ADR-0038). The escape shows as the `/` it was.\n631  func Inert(text string) string {\n632  \tlines := strings.Split(text, \"\\n\")\n633  \tfence := 0 // the backticks of the fenced block the line is in; 0 outside\n634  \tfor i, l := range lines {\n635  \t\tt := strings.TrimSpace(l)\n636  \t\tn := len(t) - len(strings.TrimLeft(t, \"`\"))\n637  \t\tindent := len(strings.ReplaceAll(l[:len(l)-len(strings.TrimLeft(l, \" \\t\"))], \"\\t\", \"    \"))\n638  \t\tswitch {\n639  \t\tcase indent \u003e 3:\n640  \t\t\t// Indented code, or a line inside a fenced block: never a\n641  \t\t\t// fence (CommonMark).\n642  \t\tcase fence == 0 \u0026\u0026 n \u003e= 3 \u0026\u0026 !strings.Contains(t[n:], \"`\"):\n643  \t\t\t// A fence opens only with no backtick after it: \"```x```\" is\n644  \t\t\t// inline code, its line text like any other.\n645  \t\t\tfence = n\n646  \t\t\tcontinue\n647  \t\tcase fence \u003e 0 \u0026\u0026 n \u003e= fence \u0026\u0026 strings.Trim(t, \"`\") == \"\":\n648  \t\t\tfence = 0\n649  \t\t\tcontinue\n650  \t\t}\n651  \t\tif fence == 0 {\n652  \t\t\tlines[i] = slashLine.ReplaceAllString(l, `$1\\/`)\n653  \t\t}\n654  \t}\n655  \treturn strings.Join(lines, \"\\n\")\n656  }\n```\n\n### internal/backlog/backlog.go, lines 122 to 160: `FormatState`, calls `Inert`\n\n```\n122  // FormatState is the body of an issue's state comment, its marker left to\n123  // the forge's Sticky.\n124  func FormatState(s State) string {\n125  \tdata, _ := yaml.Marshal(struct {\n126  \t\tSources   []string          `yaml:\"sources,flow\"`\n127  \t\tConfirmed string            `yaml:\"confirmed\"`\n128  \t\tJudged    string            `yaml:\"judged,omitempty\"`\n129  \t\tComments  int               `yaml:\"comments,omitempty\"`\n130  \t\tBody      string            `yaml:\"body,omitempty\"`\n131  \t\tPriority  int               `yaml:\"priority,omitempty\"`\n132  \t\tTitle     string            `yaml:\"title,omitempty\"`\n133  \t\tSplit     []int             `yaml:\"split,flow,omitempty\"`\n134  \t\tAfter     map[int][]int     `yaml:\"after,flow,omitempty\"`\n135  \t\tKept      []string          `yaml:\"kept,flow,omitempty\"`\n136  \t\tSections  map[string]string `yaml:\"sections,omitempty\"`\n137  \t\tWrote     map[string]string `yaml:\"wrote,omitempty\"`\n138  \t\tAnswered  string            `yaml:\"answered,omitempty\"`\n139  \t\tDeleted   []string          `yaml:\"deleted,flow,omitempty\"`\n140  \t\tProposed  []Pending         `yaml:\"proposed,omitempty\"`\n141  \t\tDone      []Done            `yaml:\"done,omitempty\"`\n142  \t\tUndone    []Undo            `yaml:\"undone,omitempty\"`\n143  \t\tDid       []Did             `yaml:\"did,omitempty\"`\n144  \t\tClosed    string            `yaml:\"closed,omitempty\"`\n145  \t\tLabel     string            `yaml:\"label,omitempty\"`\n146  \t\tAside     string            `yaml:\"aside,omitempty\"`\n147  \t\tHeard     *int              `yaml:\"heard,omitempty\"`\n148  \t\tRevisions int               `yaml:\"revisions,omitempty\"`\n149  \t}{s.Sources, s.Confirmed, s.Judged, s.Comments, s.Body, s.Priority, s.Title, s.Split, s.After, s.Kept, s.Sections, s.Wrote, s.Answered, s.Deleted,\n150  \t\ts.Proposed, s.Done, s.Undone, s.Did, s.Closed, s.Label, s.Aside, s.Heard, s.Revisions})\n151  \t// A fence in a text the agent wrote must not end the block: the block's\n152  \t// is longer than any run of backticks in it.\n153  \tfence := fenceFor(string(data))\n154  \tblock := fence + \"yaml\\n\" + string(data) + fence\n155  \tsay := s.say()\n156  \tif say == \"\" {\n157  \t\treturn \"What workline knows of this issue; edited by the engine, not by hand.\\n\\n\" + block\n158  \t}\n159  \treturn Inert(strings.ReplaceAll(say, \"```\", \"'''\")) + \"\\n\\n\u003cdetails\u003e\u003csummary\u003eWhat workline knows of this issue, edited by the engine\u003c/summary\u003e\\n\\n\" + block + \"\\n\\n\u003c/details\u003e\"\n160  }\n```\n\n### internal/backlog/backlog.go, lines 1375 to 1407: `Refine`, calls `Inert`\n\n```\n1375  // Refine is an issue's body with the sections it lacks written: one there\n1376  // but empty (an issue form's \"_No response_\") filled in place, one missing\n1377  // added after the text, which stays as it is; added and kept name the\n1378  // sections written and those already there, left alone.\n1379  func Refine(body string, c Proposal, role string) (string, []string, []string) {\n1380  \thave := work.Sections(body)\n1381  \tgiven := map[string]string{\"Need\": c.Need, \"Verification\": c.Verification, \"Validation\": c.Validation, \"Scope\": c.Scope}\n1382  \tbody = strings.TrimRight(body, \" \\r\\n\")\n1383  \tvar added, kept []string\n1384  \tfor _, name := range Sections {\n1385  \t\ttext := Inert(strings.TrimSpace(given[name])) // no quick action run on GitLab when the body is written\n1386  \t\tif text == \"\" || slices.Contains(c.Refused, name) {\n1387  \t\t\tcontinue\n1388  \t\t}\n1389  \t\tif slices.Contains(drafted, name) {\n1390  \t\t\ttext = DraftLine(role) + \"\\n\\n\" + text\n1391  \t\t}\n1392  \t\told, ok := have[name]\n1393  \t\tswitch {\n1394  \t\tcase ok \u0026\u0026 strings.TrimSpace(old) != \"\" \u0026\u0026 slices.Contains(c.Revise, name) \u0026\u0026 squeeze(old) != squeeze(text):\n1395  \t\t\tbody = fill(body, name, text) // the role's own, rewritten to answer the reviewer (#128)\n1396  \t\tcase ok \u0026\u0026 strings.TrimSpace(old) != \"\":\n1397  \t\t\tkept = append(kept, name)\n1398  \t\t\tcontinue\n1399  \t\tcase ok:\n1400  \t\t\tbody = fill(body, name, text)\n1401  \t\tdefault:\n1402  \t\t\tbody += \"\\n\\n## \" + name + \"\\n\\n\" + text\n1403  \t\t}\n1404  \t\tadded = append(added, name)\n1405  \t}\n1406  \treturn body, added, kept\n1407  }\n```\n\n### internal/engine/engine.go, lines 2015 to 2040: `announce`, calls `Inert`\n\n```\n2015  // announce tells an issue it looks obsolete (ADR-0024): the label first —\n2016  // a comment without it reads as kept open, never the other way round —,\n2017  // then the comment to its reporter, with the block read back at the next\n2018  // runs.\n2019  func (a *applier) announce(c backlog.Proposal) error {\n2020  \tb := a.forge.(forge.Backlog)\n2021  \tis, err := a.forge.Issue(c.Issue)\n2022  \tif err != nil {\n2023  \t\treturn err\n2024  \t}\n2025  \thead, err := git(a.repo, nil, \"rev-parse\", \"--short\", \"HEAD\")\n2026  \tif err != nil {\n2027  \t\treturn err\n2028  \t}\n2029  \tt := forge.Target{Kind: \"issue\", ID: c.Issue}\n2030  \tif err := b.EnsureLabel(backlog.LabelObsolete, \"cfd3d7\", \"Announced obsolete: closed after a delay unless someone writes or takes this label off\"); err != nil {\n2031  \t\treturn err\n2032  \t}\n2033  \tif err := a.forge.Label(t, []string{backlog.LabelObsolete}, nil); err != nil {\n2034  \t\treturn err\n2035  \t}\n2036  \tdays := backlog.Settings(a.settings)[\"close-obsolete\"].Delay()\n2037  \tann := backlog.Announcement{Quote: *c.Quote, Why: c.Why, Commit: head,\n2038  \t\tAnnounced: time.Now().Format(\"2006-01-02\"), By: a.model}\n2039  \treturn a.forge.Comment(t, backlog.Inert(backlog.AnnouncementComment(is.Author, c, a.role, ann, days)), backlog.AnnounceMarker(a.role))\n2040  }\n```\n\n### internal/engine/engine.go, lines 2042 to 2070: `keepOpen`, calls `Inert`\n\n```\n2042  // keepOpen settles an issue's announcement as obsolete: kept open, its\n2043  // label taken off, its evidence recorded in the state so it is not\n2044  // announced again for it, and the issue told why when no person kept it.\n2045  func keepOpen(f forge.Forge, role string, c backlog.Proposal) error {\n2046  \tb := f.(forge.Backlog)\n2047  \tt := forge.Target{Kind: \"issue\", ID: c.Issue}\n2048  \tcomments, err := b.Comments(t)\n2049  \tif err != nil {\n2050  \t\treturn err\n2051  \t}\n2052  \tst, _, err := backlog.ReadState(comments, role)\n2053  \tif err != nil {\n2054  \t\treturn fmt.Errorf(\"#%d: its state comment: %w\", t.ID, err)\n2055  \t}\n2056  \tkey := backlog.ObsoleteKey(*c.Quote)\n2057  \tif !slices.Contains(st.Kept, key) {\n2058  \t\tst.Kept = append(st.Kept, key)\n2059  \t}\n2060  \tif err := f.Label(t, nil, []string{backlog.LabelObsolete}); err != nil {\n2061  \t\treturn err\n2062  \t}\n2063  \tif err := f.Sticky(t, backlog.FormatState(*st), backlog.StateMarker(role), false); err != nil {\n2064  \t\treturn err\n2065  \t}\n2066  \tif !c.Say {\n2067  \t\treturn nil\n2068  \t}\n2069  \treturn f.Comment(t, backlog.Inert(backlog.KeptComment(c.Why)), backlog.KeptMarker(role))\n2070  }\n```\n\nNot shown, past 200 lines: `Persist` (internal/backlog/ledger.go:433-571, calls `Inert`); `apply` (internal/engine/engine.go:1790-2013, calls `Inert`); `refining` (internal/engine/engine.go:2364-2425, calls `Inert`). What would prove or refute the finding may lie in them.\n\n## What the change did to internal/backlog/ledger.go, near the cause\n\n```diff\ndiff --git a/internal/backlog/ledger.go b/internal/backlog/ledger.go\nnew file mode 100644\nindex 0000000..c3c847b\n--- /dev/null\n+++ b/internal/backlog/ledger.go\n@@ -0,0 +1,656 @@\n+package backlog\n+\n+import (\n+\t\"errors\"\n+\t\"fmt\"\n+\t\"regexp\"\n+\t\"slices\"\n+\t\"strings\"\n+\t\"time\"\n+\n+\t\"go.yaml.in/yaml/v3\"\n+\n+\t\"github.com/JN0V/workline/internal/forge\"\n+)\n+\n+// What the role holds is kept on each issue, never in a report (ADR-0038):\n+// the acts it proposes there, waiting on a person's yes; the acts it did\n+// alone, a person may undo; what it did, each with its day — all in the\n+// issue's own state comment, its one comment, edited in place. An issue\n+// waiting on a person bears the label workline:proposed (GitLab:\n+// workline::proposed): a saved filter on it is what waits on a person.\n+// What the role knows of the whole backlog is read from these, each run;\n+// none of it is kept anywhere else.\n+\n+// The labels of a proposal (ADR-0038): the role's, on an issue waiting on\n+// a person; and a person's yes, read in either spelling.\n+const (\n+\tLabelProposed  = \"workline:proposed\"\n+\tscopedProposed = \"workline::proposed\"\n+\tscopedAccepted = \"workline::accepted\"\n+)\n+\n+// ProposedLabel is the label the role puts on an issue waiting on a person,\n+// as the forge names it: scoped on GitLab.\n+func ProposedLabel(f any) string {\n+\tif forge.ScopedLabels(f) {\n+\t\treturn scopedProposed\n+\t}\n+\treturn LabelProposed\n+}\n+\n+// AcceptedLabel is the label a person agrees with, as the role creates it\n+// on the forge: scoped on GitLab, so it replaces workline::proposed where\n+// the plan has scoped labels exclusive. Either spelling is a yes.\n+func AcceptedLabel(f any) string {\n+\tif forge.ScopedLabels(f) {\n+\t\treturn scopedAccepted\n+\t}\n+\treturn LabelAccepted\n+}\n+\n+// acceptedLabels are a person's yes, in both spellings.\n+var acceptedLabels = []string{LabelAccepted, scopedAccepted}\n+\n+// Proposed says whether an issue bears the role's label, either spelling.\n+func Proposed(is forge.Issue) bool {\n+\treturn slices.Contains(is.Labels, LabelProposed) || slices.Contains(is.Labels, scopedProposed)\n+}\n+\n+// UndoneMax is how many acts of a kind done alone a person undoes, across\n+// the issues, before that kind is proposed on every issue; one undone is\n+// proposed again on its own issue only (ADR-0038, amended).\n+const (\n+\tUndoneMax      = 3\n+\tUndoneMaxLimit = 20\n+)\n+\n+// ProposalsMax is how many issues may wait on a person at once before the\n+// role slows down: past it, a run reads only the issues a person answered\n+// on (ADR-0038: silence is never a yes).\n+const (\n+\tProposalsMax      = 10\n+\tProposalsMaxLimit = 100\n+)\n+\n+// plusOne is a comment that says nothing but agreement or a vote: never an\n+// answer to read.\n+var plusOne = regexp.MustCompile(`^(?:[+-]1|:[+-]1:|:thumbsup:|:thumbsdown:|👍|👎|\\s)+$`)\n+\n+// Counted are an issue's comments that count (ADR-0038): its reporter's\n+// and the project's people's — never a bot's, an outsider's, an author\n+// the forge does not name, the engine's own, nor a bare \"+1\".\n+func Counted(notes []forge.Note, is forge.Issue) []forge.Note {\n+\tvar out []forge.Note\n+\tfor _, n := range notes {\n+\t\tif _, engine := EngineMarker(n.Body); engine || strings.Contains(n.Body, \"\u003c!-- workline:\") {\n+\t\t\tcontinue\n+\t\t}\n+\t\tif n.Bot || n.Author == \"\" || (n.Author != is.Author \u0026\u0026 !n.Insider) || plusOne.MatchString(strings.TrimSpace(n.Body)) {\n+\t\t\tcontinue\n+\t\t}\n+\t\tout = append(out, n)\n+\t}\n+\treturn out\n+}\n+\n+// Heard is how many counted comments the state says the role read; a\n+// state written before it counted them (no `heard`) counted every\n+// comment not the engine's (`comments`): those it holds are taken as\n+// read, never more than there are now.\n+func Heard(st *State, counted int) int {\n+\tswitch {\n+\tcase st == nil:\n+\t\treturn counted\n+\tcase st.Heard == nil:\n+\t\treturn min(st.Comments, counted)\n+\t}\n+\treturn *st.Heard\n+}\n+\n+// ID is a pending proposal's key: its issue and kind, or the text an\n+// issue to open would be opened from.\n+func (q Pending) ID() string {\n+\tif q.Key != \"\" {\n+\t\treturn q.Key\n+\t}\n+\treturn fmt.Sprintf(\"%d/%s\", q.Issue, q.Act)\n+}\n+\n+// Undrafted says whether a proposal on an issue was recorded with its line\n+// alone, the act not kept — by an engine before acts were recorded: its\n+// issue is read again, and the act drafted then.\n+func (q Pending) Undrafted() bool { return q.Proposal == nil \u0026\u0026 q.Key == \"\" \u0026\u0026 q.Issue \u003e 0 }\n+\n+// Doable says whether the engine can do a proposal a person accepted: what\n+// it would do recorded, and not one only a person or the import does.\n+func (q Pending) Doable() bool {\n+\tc := q.Proposal\n+\treturn c != nil \u0026\u0026 c.Do != \"open\" \u0026\u0026 !c.Spent \u0026\u0026 !(c.Do == \"milestone\" \u0026\u0026 c.Milestone == \"\")\n+}\n+\n+// Answer is a person's comment on an issue waiting on them, read as\n+// \"revise\" (ADR-0038): the issue read again with it, 👀 put on each, the\n+// drafts rewritten in place, one line in reply.\n+type Answer struct {\n+\tNotes    []string `yaml:\"notes,flow\"` // the comments read, by the forge's id\n+\tWho      string   `yaml:\"who\"`        // the last one's author\n+\tRevision int      `yaml:\"revision\"`   // this revision's number, from 1\n+}\n+\n+// Ledger is what the role holds, read from each open issue's state: the\n+// record it keeps there, as one; and, the first run after a report\n+// issue, that report's record, moved to the issues (ADR-0038).\n+type Ledger struct {\n+\tReport int    // an open report issue of an earlier engine: its record read once, then it is closed\n+\tRecord Record // the issues' records, as one\n+\tBroken error  // the old report's record does not read\n+\tStates map[int]*State\n+\tNotes  map[int][]forge.Note\n+\t// Aside are the issues a person took workline:proposed off since the\n+\t// last run, without accepting: \"not now\", that issue only, until it\n+\t// changes.\n+\tAside map[int]bool\n+\t// Undone are the role's acts a person undid since the last run, other\n+\t// than closings; Standing, those still watched (ADR-0026).\n+\tUndone   []Undo\n+\tStanding []Done\n+\t// Own are the blockers the role set on each open issue: a depend's, a\n+\t// split's after (ADR-0028).\n+\tOwn map[int][]int\n+\t// Signs are what a person did that a run with no agent still writes:\n+\t// a yes, an answer, a label taken off, an act undone, the report to\n+\t// move.\n+\tSigns []string\n+}\n+\n+// Demoted are the kinds of act proposed on every issue: those a person\n+// undid at least max times, across the issues (UndoneMax).\n+func (l *Ledger) Demoted(max int) []string {\n+\treturn demoted(append(slices.Clone(l.Record.Undone), l.Undone...), l.Record.Wrong, max)\n+}\n+\n+// demoted counts the acts undone, closings reopened among them, by kind:\n+// a kind undone max times or more is proposed everywhere.\n+func demoted(undone []Undo, wrong []Closing, max int) []string {\n+\tif max \u003c= 0 {\n+\t\tmax = UndoneMax\n+\t}\n+\tcount := map[string]int{}\n+\tfor _, u := range undone {\n+\t\tcount[u.Act]++\n+\t}\n+\tfor _, c := range wrong {\n+\t\tcount[c.Act]++\n+\t}\n+\tvar out []string\n+\tfor _, kind := range ActKinds {\n+\t\tif count[kind] \u003e= max {\n+\t\t\tout = append(out, kind)\n+\t\t}\n+\t}\n+\treturn out\n+}\n+\n\n(cut)\n```