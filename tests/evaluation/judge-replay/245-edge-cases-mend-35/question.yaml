{"material":"## The finding\n\nimportant: Two slips in one answer are not mended\n\nWhy: Mend runs only one repair, chosen by the first error message. If an answer holds both a tab-indented block and a value that opens on a quoted phrase, untab runs first and the second slip still fails to parse. The probe after the fix then fails, so the original answer comes back unmended and the agent is asked again. The new block-scalar guard makes mixed answers likelier, because code quotes with tabs now sit next to quoted titles.\n\nIts cause, quoted:\n\n```\nif n == 0 || yaml.Unmarshal([]byte(fixed), \u0026probe) != nil {\n```\n\n## The code it stands on\n\nAs it reads at 3ab81f5: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/agent/mend.go, lines 13 to 45: `Mend`, the function the cause lies in\n\n```\n13  // Mend fixes the slips that leave agents' answers unreadable or cut,\n14  // before any YAML reader takes them, and says what it mended: code quoted\n15  // with its tabs under a block scalar, when the answer fails on a tab (#157);\n16  // a value opening on a quoted phrase and going on after it, when the answer\n17  // fails there (#128); and a plain free text cut by ` #`, read whole (#156). The block's text and\n18  // the line's are kept exactly as written; an answer that still does not read\n19  // comes back as it came. Why and the rules: docs/spec/role-contract.md,\n20  // \"One run\", step 3.\n21  func Mend(answer string) (string, []string) {\n22  \tvar said []string\n23  \tvar probe any\n24  \tif err := yaml.Unmarshal([]byte(answer), \u0026probe); err != nil {\n25  \t\tvar fixed string\n26  \t\tvar n int\n27  \t\tswitch {\n28  \t\tcase strings.Contains(err.Error(), \"tab character\"):\n29  \t\t\tfixed, n = untab(answer)\n30  \t\t\tsaid = append(said, fmt.Sprintf(\"%d block(s) of code indented with tabs (the YAML reader refuses a tab as indentation): indented with spaces, their text kept as written\", n))\n31  \t\tcase strings.Contains(err.Error(), \"did not find expected key\"):\n32  \t\t\tfixed, n = unquote(answer)\n33  \t\t\tsaid = append(said, fmt.Sprintf(\"%d value(s) opening on a quoted phrase and going on after it (the YAML reader takes the quotes for the whole value): read whole, as written\", n))\n34  \t\t}\n35  \t\tif n == 0 || yaml.Unmarshal([]byte(fixed), \u0026probe) != nil {\n36  \t\t\treturn answer, nil\n37  \t\t}\n38  \t\tanswer = fixed\n39  \t}\n40  \tif fixed, n := unhash(answer); n \u003e 0 {\n41  \t\tanswer = fixed\n42  \t\tsaid = append(said, fmt.Sprintf(\"%d plain text(s) holding ` #` (the YAML reader reads the rest as a comment and drops it): read whole, as written\", n))\n43  \t}\n44  \treturn answer, said\n45  }\n```\n\n### internal/role/config.go, lines 17 to 17: `Error`, called by `Mend`\n\n```\n17  func (e *ConfigError) Error() string { return \".workline/config.yaml: \" + e.msg }\n```\n\n### internal/agent/mend.go, lines 94 to 167: `untab`, called by `Mend`\n\n```\n94  // untab gives the block scalars of an answer whose lines are indented with\n95  // tabs their indentation in spaces, and says how many it changed. A block's\n96  // lines are those after its header indented more than its key, blank, or\n97  // starting with a tab before its indentation is reached (code pasted as it\n98  // is in the file): those are indented as its first line, their text kept.\n99  func untab(answer string) (string, int) {\n100  \tlines := strings.Split(answer, \"\\n\")\n101  \tchanged := 0\n102  \tfor i := 0; i \u003c len(lines); i++ {\n103  \t\tm := blockHeader.FindStringSubmatchIndex(lines[i])\n104  \t\tif m == nil {\n105  \t\t\tcontinue\n106  \t\t}\n107  \t\thead := lines[i]\n108  \t\tparent := len(head[m[2]:m[3]]) + len(head[m[4]:m[5]]) // the key's column\n109  \t\tif m[6] \u003c 0 \u0026\u0026 m[5] \u003e m[4] {\n110  \t\t\tparent -= 2 // `- |`: the dash's column\n111  \t\t}\n112  \t\tif strings.ContainsAny(head[m[10]:m[11]], \"123456789\") {\n113  \t\t\tcontinue // its indentation said already\n114  \t\t}\n115  \t\t// The block's lines, and its indentation: its first line's, in\n116  \t\t// spaces, or two more than its key's.\n117  \t\tend, indent := i+1, -1\n118  \t\tfor ; end \u003c len(lines); end++ {\n119  \t\t\tl := lines[end]\n120  \t\t\tif strings.TrimSpace(l) == \"\" {\n121  \t\t\t\tcontinue\n122  \t\t\t}\n123  \t\t\tk := len(l) - len(strings.TrimLeft(l, \" \"))\n124  \t\t\tif k \u003c= parent \u0026\u0026 l[k] != '\\t' {\n125  \t\t\t\tbreak\n126  \t\t\t}\n127  \t\t\tif indent \u003c 0 {\n128  \t\t\t\tindent = k\n129  \t\t\t\tif k \u003c= parent {\n130  \t\t\t\t\tindent = parent + 2\n131  \t\t\t\t}\n132  \t\t\t}\n133  \t\t}\n134  \t\tif indent \u003c 0 {\n135  \t\t\tcontinue\n136  \t\t}\n137  \t\ttouched := false\n138  \t\tfirst := true\n139  \t\tfor j := i + 1; j \u003c end; j++ {\n140  \t\t\tl := lines[j]\n141  \t\t\tif strings.TrimSpace(l) == \"\" {\n142  \t\t\t\tif strings.Contains(l, \"\\t\") {\n143  \t\t\t\t\tlines[j], touched = \"\", true\n144  \t\t\t\t}\n145  \t\t\t\tcontinue\n146  \t\t\t}\n147  \t\t\tk := len(l) - len(strings.TrimLeft(l, \" \"))\n148  \t\t\tif k \u003c indent \u0026\u0026 l[k] == '\\t' {\n149  \t\t\t\tl, touched = strings.Repeat(\" \", indent)+l[k:], true\n150  \t\t\t\tlines[j] = l\n151  \t\t\t}\n152  \t\t\tif first \u0026\u0026 len(l) \u003e indent \u0026\u0026 l[indent] == '\\t' \u0026\u0026 indent-parent \u003e= 1 \u0026\u0026 indent-parent \u003c= 9 {\n153  \t\t\t\t// The reader finds a block's indentation on its first line\n154  \t\t\t\t// and stops at a tab: said, it reads the tab as text.\n155  \t\t\t\tat := m[9]\n156  \t\t\t\tlines[i] = head[:at] + fmt.Sprint(indent-parent) + head[at:]\n157  \t\t\t\ttouched = true\n158  \t\t\t}\n159  \t\t\tfirst = false\n160  \t\t}\n161  \t\tif touched {\n162  \t\t\tchanged++\n163  \t\t}\n164  \t\ti = end - 1\n165  \t}\n166  \treturn strings.Join(lines, \"\\n\"), changed\n167  }\n```\n\n### internal/agent/mend.go, lines 52 to 88: `unquote`, called by `Mend`\n\n```\n52  // unquote reads whole the values quotedThenMore matches, rewritten\n53  // double-quoted as the agent wrote them, quotes included, and says how many.\n54  // A block scalar's lines are its text, code quoted as it is: left alone.\n55  func unquote(answer string) (string, int) {\n56  \tlines := strings.Split(answer, \"\\n\")\n57  \tn := 0\n58  \tblock := -1 // in a block scalar: its key's column\n59  \tfor i, l := range lines {\n60  \t\tif block \u003e= 0 {\n61  \t\t\tk := len(l) - len(strings.TrimLeft(l, \" \"))\n62  \t\t\tif strings.TrimSpace(l) == \"\" || k \u003e block || l[k] == '\\t' {\n63  \t\t\t\tcontinue\n64  \t\t\t}\n65  \t\t\tblock = -1\n66  \t\t}\n67  \t\tif h := blockHeader.FindStringSubmatchIndex(l); h != nil {\n68  \t\t\tblock = len(l[h[2]:h[3]]) + len(l[h[4]:h[5]])\n69  \t\t\tif h[6] \u003c 0 \u0026\u0026 h[5] \u003e h[4] {\n70  \t\t\t\tblock -= 2 // `- |`: the dash's column\n71  \t\t\t}\n72  \t\t\tcontinue\n73  \t\t}\n74  \t\tm := quotedThenMore.FindStringSubmatch(strings.TrimRight(l, \" \\t\\r\"))\n75  \t\t// Closed on the quote it opened with, it is one quoted text whose\n76  \t\t// inner quotes were left unescaped: the agent is asked again.\n77  \t\tif m == nil || strings.HasSuffix(m[3], m[2][:1]) {\n78  \t\t\tcontinue\n79  \t\t}\n80  \t\tvar b bytes.Buffer\n81  \t\tenc := json.NewEncoder(\u0026b)\n82  \t\tenc.SetEscapeHTML(false)\n83  \t\tenc.Encode(m[2] + m[3])\n84  \t\tlines[i] = m[1] + strings.TrimSpace(b.String())\n85  \t\tn++\n86  \t}\n87  \treturn strings.Join(lines, \"\\n\"), n\n88  }\n```\n\n### internal/agent/claude.go, lines 133 to 179: `proposalsFrom`, calls `Mend`\n\n```\n133  // proposalsFrom extracts the YAML list from an answer, tolerating a code fence,\n134  // and says what Mend mended of it. The answer itself is tried first: a\n135  // proposal may hold a code fence of its own (a doc's code block, moved by a\n136  // patch). Only when it does not read is it taken from between the first and\n137  // the last fence lines.\n138  func proposalsFrom(answer string) ([]byte, []string, error) {\n139  \ts := strings.TrimSpace(answer)\n140  \tif s == \"[]\" { // nothing to propose, said: a part whose share says nothing of the doc\n141  \t\treturn []byte(\"[]\\n\"), nil, nil\n142  \t}\n143  \ts, mended := Mend(s)\n144  \tvar list []map[string]any\n145  \tif err := yaml.Unmarshal([]byte(s), \u0026list); err != nil || len(list) == 0 {\n146  \t\t// What the reader says is kept: the agent is asked again with it.\n147  \t\twhy := \"an empty list\"\n148  \t\tif err != nil {\n149  \t\t\twhy = err.Error()\n150  \t\t}\n151  \t\tlines := strings.Split(s, \"\\n\")\n152  \t\tfirst, last := -1, -1\n153  \t\tfor i, l := range lines {\n154  \t\t\tif strings.HasPrefix(l, \"```\") {\n155  \t\t\t\tif first \u003c 0 {\n156  \t\t\t\t\tfirst = i\n157  \t\t\t\t}\n158  \t\t\t\tlast = i\n159  \t\t\t}\n160  \t\t}\n161  \t\tif first \u003c 0 || last == first {\n162  \t\t\treturn nil, nil, fmt.Errorf(\"expected a YAML list of proposals (%s)\", why)\n163  \t\t}\n164  \t\ts, mended = Mend(strings.TrimSpace(strings.Join(lines[first+1:last], \"\\n\")))\n165  \t\tlist = nil\n166  \t\tif err := yaml.Unmarshal([]byte(s), \u0026list); err != nil || len(list) == 0 {\n167  \t\t\tif err != nil {\n168  \t\t\t\twhy = err.Error()\n169  \t\t\t}\n170  \t\t\treturn nil, nil, fmt.Errorf(\"expected a YAML list of proposals (%s)\", why)\n171  \t\t}\n172  \t}\n173  \tfor i, m := range list {\n174  \t\tif len(m) != 1 {\n175  \t\t\treturn nil, nil, fmt.Errorf(\"proposal %d holds %d kinds; each holds exactly one\", i+1, len(m))\n176  \t\t}\n177  \t}\n178  \treturn []byte(s + \"\\n\"), mended, nil\n179  }\n```\n\nNot shown, past 200 lines: `unhash` (internal/agent/mend.go:169-261, called by `Mend`); `claimsRead` (internal/engine/engine.go:741-752, calls `Mend`); `claimsOneByOne` (internal/engine/engine.go:754-771, calls `Mend`). What would prove or refute the finding may lie in them.\n\nNot shown, defined in too many places to tell which: `Run` (5 definitions).\n\n## What the change did to internal/agent/mend.go, near the cause\n\n```diff\ndiff --git a/internal/agent/mend.go b/internal/agent/mend.go\nindex 2b919cb..a074b99 100644\n--- a/internal/agent/mend.go\n+++ b/internal/agent/mend.go\n@@ -10,10 +10,11 @@ import (\n \t\"go.yaml.in/yaml/v3\"\n )\n \n-// Mend fixes the two slips that leave agents' answers unreadable or cut,\n+// Mend fixes the slips that leave agents' answers unreadable or cut,\n // before any YAML reader takes them, and says what it mended: code quoted\n-// with its tabs under a block scalar, when the answer fails on a tab (#157),\n-// and a plain free text cut by ` #`, read whole (#156). The block's text and\n+// with its tabs under a block scalar, when the answer fails on a tab (#157);\n+// a value opening on a quoted phrase and going on after it, when the answer\n+// fails there (#128); and a plain free text cut by ` #`, read whole (#156). The block's text and\n // the line's are kept exactly as written; an answer that still does not read\n // comes back as it came. Why and the rules: docs/spec/role-contract.md,\n // \"One run\", step 3.\n@@ -21,15 +22,20 @@ func Mend(answer string) (string, []string) {\n \tvar said []string\n \tvar probe any\n \tif err := yaml.Unmarshal([]byte(answer), \u0026probe); err != nil {\n-\t\tif !strings.Contains(err.Error(), \"tab character\") {\n-\t\t\treturn answer, nil\n+\t\tvar fixed string\n+\t\tvar n int\n+\t\tswitch {\n+\t\tcase strings.Contains(err.Error(), \"tab character\"):\n+\t\t\tfixed, n = untab(answer)\n+\t\t\tsaid = append(said, fmt.Sprintf(\"%d block(s) of code indented with tabs (the YAML reader refuses a tab as indentation): indented with spaces, their text kept as written\", n))\n+\t\tcase strings.Contains(err.Error(), \"did not find expected key\"):\n+\t\t\tfixed, n = unquote(answer)\n+\t\t\tsaid = append(said, fmt.Sprintf(\"%d value(s) opening on a quoted phrase and going on after it (the YAML reader takes the quotes for the whole value): read whole, as written\", n))\n \t\t}\n-\t\tfixed, n := untab(answer)\n \t\tif n == 0 || yaml.Unmarshal([]byte(fixed), \u0026probe) != nil {\n \t\t\treturn answer, nil\n \t\t}\n \t\tanswer = fixed\n-\t\tsaid = append(said, fmt.Sprintf(\"%d block(s) of code indented with tabs (the YAML reader refuses a tab as indentation): indented with spaces, their text kept as written\", n))\n \t}\n \tif fixed, n := unhash(answer); n \u003e 0 {\n \t\tanswer = fixed\n@@ -38,6 +44,49 @@ func Mend(answer string) (string, []string) {\n \treturn answer, said\n }\n \n+// quotedThenMore is a line whose value opens on a quoted phrase and goes\n+// on after its closing quote: `title: \"Idle for 60 minutes\" is unclear`.\n+// No comment after the quote: `x: \"a\" # note` reads already.\n+var quotedThenMore = regexp.MustCompile(`^( *(?:- +)*[A-Za-z][\\w-]*: +)(\"[^\"\\\\]*\"|'[^']*')([ \\t]*[^ \\t#].*)$`)\n+\n+// unquote reads whole the values quotedThenMore matches, rewritten\n+// double-quoted as the agent wrote them, quotes included, and says how many.\n+// A block scalar's lines are its text, code quoted as it is: left alone.\n+func unquote(answer string) (string, int) {\n+\tlines := strings.Split(answer, \"\\n\")\n+\tn := 0\n+\tblock := -1 // in a block scalar: its key's column\n+\tfor i, l := range lines {\n+\t\tif block \u003e= 0 {\n+\t\t\tk := len(l) - len(strings.TrimLeft(l, \" \"))\n+\t\t\tif strings.TrimSpace(l) == \"\" || k \u003e block || l[k] == '\\t' {\n+\t\t\t\tcontinue\n+\t\t\t}\n+\t\t\tblock = -1\n+\t\t}\n+\t\tif h := blockHeader.FindStringSubmatchIndex(l); h != nil {\n+\t\t\tblock = len(l[h[2]:h[3]]) + len(l[h[4]:h[5]])\n+\t\t\tif h[6] \u003c 0 \u0026\u0026 h[5] \u003e h[4] {\n+\t\t\t\tblock -= 2 // `- |`: the dash's column\n+\t\t\t}\n+\t\t\tcontinue\n+\t\t}\n+\t\tm := quotedThenMore.FindStringSubmatch(strings.TrimRight(l, \" \\t\\r\"))\n+\t\t// Closed on the quote it opened with, it is one quoted text whose\n+\t\t// inner quotes were left unescaped: the agent is asked again.\n+\t\tif m == nil || strings.HasSuffix(m[3], m[2][:1]) {\n+\t\t\tcontinue\n+\t\t}\n+\t\tvar b bytes.Buffer\n+\t\tenc := json.NewEncoder(\u0026b)\n+\t\tenc.SetEscapeHTML(false)\n+\t\tenc.Encode(m[2] + m[3])\n+\t\tlines[i] = m[1] + strings.TrimSpace(b.String())\n+\t\tn++\n+\t}\n+\treturn strings.Join(lines, \"\\n\"), n\n+}\n+\n // blockHeader is a line opening a block scalar: `key: |`, `- key: \u003e-`,\n // `- |`, an indentation indicator or a comment after it.\n var blockHeader = regexp.MustCompile(`^( *)((?:- +)*)([^\\s#'\"\\-][^#]*?:[ \\t]+)?([|\u003e])([1-9]?[+-]?|[+-][1-9])[ \\t]*(#.*)?$`)\n```\n","question":"Is this finding about the code true: does the code quoted, as it reads, fail the way the finding says? Answer no if it is not a defect, if the code shown handles it, or if the finding only guesses."}