{"material":"## The finding\n\nimportant: The verdict is kept as a commit status, not the git note the PR describes\n\nWhy: The PR says the verdict is kept as a git note on the head, with \"No artifact, no further App permission\". The case instead expects a commit status `workline/verdict` written by the bot. Writing a status is a different forge write, and it may need a permission the App does not have. The Scope does not allow it, and the PR does not say it is done.\n\nIts cause, quoted:\n\n```\n- {commit: feat/sessions, name: workline/verdict, state: success, by: workline-bot}\n```\n\n## The code it stands on\n\nAs it reads at 022c017: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### tests/conformance/cases/merge/verdict-only-keeps-it-and-nothing-else.yaml, lines 16 to 32: the lines around the cause, no function found around it (no language it knows)\n\n```\n16          author: dana\n17          labels: [workline:accepted]\n18          label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: \"2026-01-04T10:00:00Z\"}]\n19          comments: []\n20  run: {follow: [--base, main, --verdict, ../verdict.json, --verdict-only]}\n21  expect:\n22    status: pass\n23    summary: \"the line's verdict kept, nothing else followed\"\n24    findings: [{rule: verdict-kept, message: \"pass\"}]\n25    no-findings: [{rule: auto-merge-on}, {rule: updated}]\n26    not-pushed: [feat/sessions]\n27    forge:\n28      merge-requests:\n29        - {id: 7, auto-merge: false}\n30      statuses:\n31        - {commit: feat/sessions, name: workline/verdict, state: success, by: workline-bot}\n32        - {commit: feat/sessions, name: workline/accepted, absent: true}\n```\n\n## What the change did to tests/conformance/cases/merge/verdict-only-keeps-it-and-nothing-else.yaml, near the cause\n\n```diff\ndiff --git a/tests/conformance/cases/merge/verdict-only-keeps-it-and-nothing-else.yaml b/tests/conformance/cases/merge/verdict-only-keeps-it-and-nothing-else.yaml\nnew file mode 100644\nindex 0000000..a16eabb\n--- /dev/null\n+++ b/tests/conformance/cases/merge/verdict-only-keeps-it-and-nothing-else.yaml\n@@ -0,0 +1,32 @@\n+case: merge/verdict-only-keeps-it-and-nothing-else\n+about: \"`workline follow --verdict \u003cfile\u003e --verdict-only`, the job of its own GitHub's concurrency never cancels (#321's review): the line's verdict on the head is kept — the status `workline/verdict`, by the token —, and nothing else is done: no auto-merge turned on, no yes held, no merge request brought up to date; the `follow` job after it does that (ADR-0042).\"\n+given:\n+  repo: documented\n+  config: {merge: {autonomy: cautious}}\n+  setup:\n+    - \"git init -q --bare ../origin.git \u0026\u0026 git remote add origin ../origin.git \u0026\u0026 git push -q origin main\"\n+    - \"git checkout -qb feat/sessions \u0026\u0026 sed -i 's/3600/7200/' src/auth/token.go \u0026\u0026 git commit -qam 'feat(auth): keep users signed in for two hours' \u0026\u0026 git push -q origin feat/sessions \u0026\u0026 git checkout -q main\"\n+    - \"sh \\\"$FIXTURES/verdict.sh\\\" feat/sessions pass ../verdict.json\"\n+    - \"echo moved \u003e moved.txt \u0026\u0026 git add moved.txt \u0026\u0026 git commit -qm 'feat: main moves' \u0026\u0026 git push -q origin main\"\n+  forge:\n+    merge-requests:\n+      - id: 7\n+        branch: feat/sessions\n+        base: main\n+        author: dana\n+        labels: [workline:accepted]\n+        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: \"2026-01-04T10:00:00Z\"}]\n+        comments: []\n+run: {follow: [--base, main, --verdict, ../verdict.json, --verdict-only]}\n+expect:\n+  status: pass\n+  summary: \"the line's verdict kept, nothing else followed\"\n+  findings: [{rule: verdict-kept, message: \"pass\"}]\n+  no-findings: [{rule: auto-merge-on}, {rule: updated}]\n+  not-pushed: [feat/sessions]\n+  forge:\n+    merge-requests:\n+      - {id: 7, auto-merge: false}\n+    statuses:\n+      - {commit: feat/sessions, name: workline/verdict, state: success, by: workline-bot}\n+      - {commit: feat/sessions, name: workline/accepted, absent: true}\n```\n\n## What the change is for: the issue the change closes\n\nAs the issue reads now. A finding quoting it gives its number as the path: `path: \"#4\"`.\n\n### Issue #321: A pull request a person accepted merges by itself, kept up to date\n\n#### Need\n\nThe maintainer needs pull requests they accepted to merge with no more clicks, so updates and the release order stop waiting on them.\n\n#### Verification\n\n- Conformance cases on the fake forge, one per scenario above, plus:\n  - a label put by someone who cannot write: ignored;\n  - a pull request whose auto-merge a person turned on by hand: joins the queue;\n  - a fork's accepted pull request: auto-merge on, never updated, named when behind;\n  - the documentalist's own branch behind: rebuilt as ADR-0034 does, not merged into;\n  - release-please's branch behind: updated as Update branch does;\n  - GitHub with `GITHUB_TOKEN`, no App: said, nothing turned on;\n  - an unknown level under `merge:`: refused, the levels named.\n- Tried for real on a sandbox repository with the GitHub App: two accepted pull requests and a release pair. The merges start `follow` and release-please on `main`. Recorded in a `tried` page.\n\n#### Scope\n\n- Decided in [ADR-0042](https://github.com/JN0V/workline/blob/main/docs/adr/0042-the-engine-merges-by-the-projects-policy.md) (proposed in [#323](https://github.com/JN0V/workline/pull/323)); its \"For the person\" points are settled before the build. Research: [merging.md](https://github.com/JN0V/workline/blob/main/docs/research/merging.md).\n- `internal/engine/follow.go`: which pull requests are admitted (the label, who put it, the head's verdicts); auto-merge on and off; the queue on a push to the base, one at a time; the order (the release fix before the release); the reset on a push after the label.\n- A branch in conflict on workline's lines is merged as [#319](https://github.com/JN0V/workline/issues/319) builds it; a clean update does not wait on #319.\n- `internal/forge`: turn auto-merge on and off (GitHub GraphQL `enablePullRequestAutoMerge`, `disablePullRequestAutoMerge`; GitLab's merge API `auto_merge`, `cancel_auto_merge`); read its state, whether a pull request is behind, its head's checks. On the GitHub, GitLab, local, `cmd:` ([forge-command.md](https://github.com/JN0V/workline/blob/main/docs/spec/forge-command.md)) and fake forges.\n- Each head's verdicts where `follow` reads them: today only `out/verdict.yaml`, a job's artifact.\n- `internal/role/config.go`: the `merge:` key, off unless set.\n- `.github/workflows/workline.yml` and the `ci/` templates: `pull_request: labeled`, `follow` after the judge, the App token.\n- The `workline:accepted` label's description: a yes to a pull request too.\n- Docs: [config.md](https://github.com/JN0V/workline/blob/main/docs/config.md), [concepts.md](https://github.com/JN0V/workline/blob/main/docs/concepts.md#people), [ADR-0011](https://github.com/JN0V/workline/blob/main/docs/adr/0011-the-review-is-on-the-merge-request-not-the-push.md) and [ADR-0020](https://github.com/JN0V/workline/blob/main/docs/adr/0020-the-reviewer-finds-the-engine-verifies-the-person-merges.md) amended, [AGENTS.md](https://github.com/JN0V/workline/blob/main/AGENTS.md) (an agent never puts `workline:accepted`), ADR-0042's status. The ADR's Consequences list each change.\n- Not here: the `normal` level ([#322](https://github.com/JN0V/workline/issues/322), parked); GitLab merge trains.\n\n","question":"Is this finding about the change's purpose true, judged against the issue the change closes, shown here? Answer yes when the issue asks, in its Need or its Verification, what the change shown does not do or prove, or when the change does what the issue's Scope leaves out. The change shown is the whole merge request, its commits reviewed before included: answer no if any of it does it, if the issue does not ask it, or if the finding only guesses."}