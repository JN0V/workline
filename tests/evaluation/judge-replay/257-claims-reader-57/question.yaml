{"material":"## The finding\n\nimportant: \"Never blocking\" contradicted by setting-missing\n\nWhy: ReaderChecks emits a `setting-missing` problem when `paragraph-words` or `cell-words` is 0 or unset.\nThe case reader-threshold-unset expects `status: block` for it. So a reader check can block the run,\nwhich contradicts \"reported, never blocking\" in the MR text and in the code comment.\n\nIts cause, quoted:\n\n```\nout = append(out, Problem{Rule: \"setting-missing\", Key: \"setting-missing reader.\" + name,\n```\n\nThe author's claim it contradicts, quoted from what they said:\n\n\u003e Reported, never blocking; one finding a page, with its lines:\n\n## The code it stands on\n\nAs it reads at 159cbeb: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/builtin/documentalist/reader.go, lines 48 to 79: `ReaderChecks`, the function the cause lies in\n\n```\n48  // ReaderChecks runs the reader checks on the user pages. A threshold that is\n49  // not set is said, never skipped silently.\n50  func ReaderChecks(t Tree, r Reader) []Problem {\n51  \tvar out []Problem\n52  \tfor _, set := range []struct {\n53  \t\tname string\n54  \t\tv    int\n55  \t}{{\"paragraph-words\", r.ParagraphWords}, {\"cell-words\", r.CellWords}} {\n56  \t\tif name, v := set.name, set.v; v \u003c= 0 {\n57  \t\t\tout = append(out, Problem{Rule: \"setting-missing\", Key: \"setting-missing reader.\" + name,\n58  \t\t\t\tMessage: fmt.Sprintf(\"reader.%s is not set, so this size was not checked; set it, or turn the rule off with `enforce`\", name)})\n59  \t\t}\n60  \t}\n61  \tpages := userPages(t, r)\n62  \tfor _, p := range pages {\n63  \t\tlines := scan(t.Docs[p])\n64  \t\tout = append(out, unlinkedRefs(t, p, lines)...)\n65  \t\tif r.ParagraphWords \u003e 0 {\n66  \t\t\tout = append(out, longParagraphs(p, lines, r.ParagraphWords)...)\n67  \t\t}\n68  \t\tif r.CellWords \u003e 0 {\n69  \t\t\tout = append(out, longCells(p, lines, r.CellWords)...)\n70  \t\t}\n71  \t\tif why := explainsFlow(p, lines, r.Flow); why != \"\" \u0026\u0026 !hasDiagram(lines) {\n72  \t\t\tout = append(out, Problem{Rule: \"flow-without-diagram\", Where: p, Key: \"flow-without-diagram \" + p,\n73  \t\t\t\tMessage: fmt.Sprintf(\"%s, and holds no diagram: open it with one — a few blocks, a few words each — and keep the detail in the text below\", why)})\n74  \t\t}\n75  \t}\n76  \tout = append(out, unreachable(t, r, pages)...)\n77  \tsort.SliceStable(out, func(i, j int) bool { return out[i].Where \u003c out[j].Where })\n78  \treturn out\n79  }\n```\n\n### tests/conformance/cases/documentalist/reader-threshold-unset.yaml, lines 1 to 18: the lines around the symptom, no function found around it (no language it knows)\n\n```\n1  case: documentalist/reader-threshold-unset\n2  about: \"A reader threshold a project sets to 0 is said, never read as a pass (#193): `setting-missing` blocks, as for a budget; the other reader checks still run.\"\n3  given:\n4    repo: documented\n5    config:\n6      roles: {documentalist: {settings: {reader: {paragraph-words: 0}}}}\n7    setup:\n8      - |\n9        printf '# Shop\\n\\nAs ADR-0003 says.\\n' \u003e README.md\n10        git add . \u0026\u0026 git commit -qm 'docs: cite a decision'\n11  run: {role: documentalist, event: schedule, ai: none}\n12  expect:\n13    status: block\n14    findings:\n15      - {rule: setting-missing, message: \"reader.paragraph-words\"}\n16      - {rule: reference-unlinked, where: README.md}\n17    no-findings:\n18      - {rule: setting-missing, message: \"reader.cell-words\"}\n```\n\n### internal/builtin/documentalist/hygiene.go, lines 111 to 121: `words`, named by the finding\n\n```\n111  // words counts the words of prose: tokens holding a letter or a digit, so\n112  // list markers and table bars are not words.\n113  func words(s string) int {\n114  \tn := 0\n115  \tfor _, f := range strings.Fields(s) {\n116  \t\tif strings.IndexFunc(f, func(r rune) bool { return r \u003e 127 || r \u003e= '0' \u0026\u0026 r \u003c= '9' || r|0x20 \u003e= 'a' \u0026\u0026 r|0x20 \u003c= 'z' }) \u003e= 0 {\n117  \t\t\tn++\n118  \t\t}\n119  \t}\n120  \treturn n\n121  }\n```\n\n### internal/builtin/documentalist/derive.go, lines 87 to 114: `block`, named by the finding\n\n```\n87  // block returns a derived block as it should read, or \"\" when it cannot be\n88  // regenerated.\n89  func (d *deriver) block(doc, name, inner string) string {\n90  \tcmd, ok := d.commands[name]\n91  \tif !ok {\n92  \t\td.findings = append(d.findings, verdict.Finding{Rule: \"derive-unknown\", Where: doc, Level: \"block\",\n93  \t\t\tMessage: fmt.Sprintf(\"%q is not declared in the documentalist's `derive` settings, so this fact cannot be regenerated\", name)})\n94  \t\treturn \"\"\n95  \t}\n96  \tout, seen := d.outputs[name]\n97  \tif !seen \u0026\u0026 d.failed[name] == nil {\n98  \t\tvar err error\n99  \t\tif out, err = run(d.repo, cmd); err != nil {\n100  \t\t\td.failed[name] = err\n101  \t\t} else {\n102  \t\t\td.outputs[name] = out\n103  \t\t}\n104  \t}\n105  \tif err := d.failed[name]; err != nil {\n106  \t\td.findings = append(d.findings, verdict.Finding{Rule: \"derive-failed\", Where: doc, Level: \"block\",\n107  \t\t\tMessage: fmt.Sprintf(\"%q (%s) failed: %v\", name, cmd, err)})\n108  \t\treturn \"\"\n109  \t}\n110  \tif strings.HasPrefix(inner, \"\\n\") {\n111  \t\tout = \"\\n\" + out + \"\\n\" // a block on lines of its own stays so\n112  \t}\n113  \treturn \"\u003c!-- workline:derive \" + name + \" --\u003e\" + out + \"\u003c!-- workline:end --\u003e\"\n114  }\n```\n\n### internal/builtin/documentalist/reader.go, lines 36 to 46: `userPages`, called by `ReaderChecks`\n\n```\n36  // userPages are the docs the reader checks look at, sorted.\n37  func userPages(t Tree, r Reader) []string {\n38  \tvar out []string\n39  \tfor p := range t.Docs {\n40  \t\tif matchAny(r.Pages, p) \u0026\u0026 !matchAny(r.Skip, p) \u0026\u0026 !isHistory(p) {\n41  \t\t\tout = append(out, p)\n42  \t\t}\n43  \t}\n44  \tsort.Strings(out)\n45  \treturn out\n46  }\n```\n\n### internal/builtin/documentalist/hygiene.go, lines 84 to 109: `scan`, called by `ReaderChecks`\n\n```\n84  // scan splits a doc into lines, skipping its frontmatter.\n85  func scan(content string) []line {\n86  \tall := strings.Split(strings.TrimSuffix(content, \"\\n\"), \"\\n\")\n87  \t_, start := header(content)\n88  \tvar out []line\n89  \tfence := \"\"\n90  \tfor i := start; i \u003c len(all); i++ {\n91  \t\tl := line{n: i + 1, text: all[i]}\n92  \t\tt := strings.TrimSpace(all[i])\n93  \t\tswitch {\n94  \t\tcase fence != \"\":\n95  \t\t\tl.code = true\n96  \t\t\tif strings.HasPrefix(t, fence) {\n97  \t\t\t\tfence = \"\"\n98  \t\t\t}\n99  \t\tcase strings.HasPrefix(t, \"```\") || strings.HasPrefix(t, \"~~~\"):\n100  \t\t\tl.code, fence = true, t[:3]\n101  \t\tdefault:\n102  \t\t\tif lv := len(t) - len(strings.TrimLeft(t, \"#\")); lv \u003e 0 \u0026\u0026 lv \u003c= 6 \u0026\u0026 strings.HasPrefix(t[lv:], \" \") {\n103  \t\t\t\tl.heading = lv\n104  \t\t\t}\n105  \t\t}\n106  \t\tout = append(out, l)\n107  \t}\n108  \treturn out\n109  }\n```\n\n### internal/builtin/documentalist/reader.go, lines 90 to 139: `unlinkedRefs`, called by `ReaderChecks`\n\n```\n90  // unlinkedRefs are the decisions, docs and issues a page names without a\n91  // link: a reader cannot follow ADR-0026, docs/x.md or #128. A doc is named\n92  // when the name is a file of the repository, from the page or the root; a\n93  // name in a code span is an example, not a reference.\n94  func unlinkedRefs(t Tree, p string, lines []line) []Problem {\n95  \tvar found []string\n96  \tn := 0\n97  \tvar hidden hiddenText\n98  \tfor _, l := range lines {\n99  \t\tif l.code || l.heading \u003e 0 { // a code span ends with its paragraph\n100  \t\t\thidden.span = 0\n101  \t\t}\n102  \t\tif l.code {\n103  \t\t\tcontinue\n104  \t\t}\n105  \t\ttext := hidden.strip(l.text)\n106  \t\tif refLink.MatchString(l.text) { // a link's definition is the link\n107  \t\t\tcontinue\n108  \t\t}\n109  \t\ttext = wholeLink.ReplaceAllString(text, \" \")\n110  \t\tvar refs []string\n111  \t\trefs = append(refs, adrRef.FindAllString(text, -1)...)\n112  \t\tfor _, m := range issueRef.FindAllStringSubmatch(text, -1) {\n113  \t\t\trefs = append(refs, m[1])\n114  \t\t}\n115  \t\tfor _, m := range docRef.FindAllString(text, -1) {\n116  \t\t\tfor _, f := range []string{path.Join(path.Dir(p), m), path.Clean(m)} {\n117  \t\t\t\tif f != p \u0026\u0026 t.Files[f] {\n118  \t\t\t\t\trefs = append(refs, m)\n119  \t\t\t\t\tbreak\n120  \t\t\t\t}\n121  \t\t\t}\n122  \t\t}\n123  \t\tfor _, ref := range refs {\n124  \t\t\tn++\n125  \t\t\tif len(found) \u003c 5 {\n126  \t\t\t\tfound = append(found, fmt.Sprintf(\"line %d `%s`\", l.n, ref))\n127  \t\t\t}\n128  \t\t}\n129  \t}\n130  \tif n == 0 {\n131  \t\treturn nil\n132  \t}\n133  \tmore := \"\"\n134  \tif n \u003e len(found) {\n135  \t\tmore = fmt.Sprintf(\" and %d more\", n-len(found))\n136  \t}\n137  \treturn []Problem{{Rule: \"reference-unlinked\", Where: p, Key: \"reference-unlinked \" + p, Size: n,\n138  \t\tMessage: fmt.Sprintf(\"%d decision, doc or issue named without a link: %s%s; make each a link the reader can follow\", n, strings.Join(found, \", \"), more)}}\n139  }\n```\n\n### internal/builtin/documentalist/reader.go, lines 253 to 273: `longCells`, called by `ReaderChecks`\n\n```\n253  // longCells are the table cells over max words: a table is read across, one\n254  // short sentence a cell.\n255  func longCells(p string, lines []line, max int) []Problem {\n256  \tvar at []string\n257  \tfor _, l := range lines {\n258  \t\tif l.code || !tableLine.MatchString(l.text) || tableRule.MatchString(l.text) {\n259  \t\t\tcontinue\n260  \t\t}\n261  \t\trow := strings.ReplaceAll(strings.Trim(strings.TrimSpace(l.text), \"|\"), `\\|`, \"\")\n262  \t\tfor _, cell := range strings.Split(row, \"|\") {\n263  \t\t\tif w := words(linkURL.ReplaceAllString(cell, \"]\")); w \u003e max {\n264  \t\t\t\tat = append(at, fmt.Sprintf(\"line %d (%d words)\", l.n, w))\n265  \t\t\t}\n266  \t\t}\n267  \t}\n268  \tif len(at) == 0 {\n269  \t\treturn nil\n270  \t}\n271  \treturn []Problem{{Rule: \"cell-too-long\", Where: p, Key: \"cell-too-long \" + p, Size: len(at),\n272  \t\tMessage: fmt.Sprintf(\"%d table cell(s) over %d words: %s; keep one short sentence and a link, the detail on the page it links to\", len(at), max, strings.Join(at, \", \"))}}\n273  }\n```\n\nNot shown, past 200 lines: `longParagraphs` (internal/builtin/documentalist/reader.go:213-251, called by `ReaderChecks`); `explainsFlow` (internal/builtin/documentalist/reader.go:277-288, called by `ReaderChecks`); `hasDiagram` (internal/builtin/documentalist/reader.go:295-304, called by `ReaderChecks`); `unreachable` (internal/builtin/documentalist/reader.go:306-361, called by `ReaderChecks`); `Pre` (internal/builtin/documentalist/documentalist.go:563-1135, calls `ReaderChecks`). What would prove or refute the finding may lie in them.\n\n## What the change did to internal/builtin/documentalist/reader.go, near the cause\n\n```diff\ndiff --git a/internal/builtin/documentalist/reader.go b/internal/builtin/documentalist/reader.go\nnew file mode 100644\nindex 0000000..26e081f\n--- /dev/null\n+++ b/internal/builtin/documentalist/reader.go\n@@ -0,0 +1,361 @@\n+package documentalist\n+\n+import (\n+\t\"fmt\"\n+\t\"path\"\n+\t\"regexp\"\n+\t\"sort\"\n+\t\"strings\"\n+)\n+\n+// The reader checks (#193): whether a user page serves its reader, beside\n+// whether it is true. Computed with no agent, when gardening: a decision,\n+// doc or issue named without a link, a paragraph or a table cell too long\n+// to be read at a glance, a page explaining a flow with no diagram, a user\n+// page no navigation reaches. Reported, never blocking: a proposal for the\n+// page, not a verdict on the change.\n+\n+// Reader says which docs are user pages and how much a reader takes at once\n+// (roles/documentalist/role.yaml, `reader`).\n+type Reader struct {\n+\t// Pages: the user pages, among the docs the role reads; Skip: those left\n+\t// out (specs). Records — decisions, research, history — are always left\n+\t// out: they are read for what was true then, not as a guide.\n+\tPages []string `json:\"pages\"`\n+\tSkip  []string `json:\"skip\"`\n+\t// Navigation: the pages a reader starts from; every user page must be\n+\t// reached from one, link after link through user pages.\n+\tNavigation []string `json:\"navigation\"`\n+\t// Flow: pages that explain a flow and need a diagram, beside any page\n+\t// with a \"How it works\" heading.\n+\tFlow           []string `json:\"flow\"`\n+\tParagraphWords int      `json:\"paragraph-words\"`\n+\tCellWords      int      `json:\"cell-words\"`\n+}\n+\n+// userPages are the docs the reader checks look at, sorted.\n+func userPages(t Tree, r Reader) []string {\n+\tvar out []string\n+\tfor p := range t.Docs {\n+\t\tif matchAny(r.Pages, p) \u0026\u0026 !matchAny(r.Skip, p) \u0026\u0026 !isHistory(p) {\n+\t\t\tout = append(out, p)\n+\t\t}\n+\t}\n+\tsort.Strings(out)\n+\treturn out\n+}\n+\n+// ReaderChecks runs the reader checks on the user pages. A threshold that is\n+// not set is said, never skipped silently.\n+func ReaderChecks(t Tree, r Reader) []Problem {\n+\tvar out []Problem\n+\tfor _, set := range []struct {\n+\t\tname string\n+\t\tv    int\n+\t}{{\"paragraph-words\", r.ParagraphWords}, {\"cell-words\", r.CellWords}} {\n+\t\tif name, v := set.name, set.v; v \u003c= 0 {\n+\t\t\tout = append(out, Problem{Rule: \"setting-missing\", Key: \"setting-missing reader.\" + name,\n+\t\t\t\tMessage: fmt.Sprintf(\"reader.%s is not set, so this size was not checked; set it, or turn the rule off with `enforce`\", name)})\n+\t\t}\n+\t}\n+\tpages := userPages(t, r)\n+\tfor _, p := range pages {\n+\t\tlines := scan(t.Docs[p])\n+\t\tout = append(out, unlinkedRefs(t, p, lines)...)\n+\t\tif r.ParagraphWords \u003e 0 {\n+\t\t\tout = append(out, longParagraphs(p, lines, r.ParagraphWords)...)\n+\t\t}\n+\t\tif r.CellWords \u003e 0 {\n+\t\t\tout = append(out, longCells(p, lines, r.CellWords)...)\n+\t\t}\n+\t\tif why := explainsFlow(p, lines, r.Flow); why != \"\" \u0026\u0026 !hasDiagram(lines) {\n+\t\t\tout = append(out, Problem{Rule: \"flow-without-diagram\", Where: p, Key: \"flow-without-diagram \" + p,\n+\t\t\t\tMessage: fmt.Sprintf(\"%s, and holds no diagram: open it with one — a few blocks, a few words each — and keep the detail in the text below\", why)})\n+\t\t}\n+\t}\n+\tout = append(out, unreachable(t, r, pages)...)\n+\tsort.SliceStable(out, func(i, j int) bool { return out[i].Where \u003c out[j].Where })\n+\treturn out\n+}\n+\n+var (\n+\t// A link, its text included: what it says is linked; the end of one\n+\t// whose text began on the line above.\n+\twholeLink = regexp.MustCompile(`!?\\[[^\\]]*\\]\\([^)]*\\)|\\[[^\\]]*\\]\\[[^\\]]*\\]|\\]\\([^)]*\\)|\u003c[a-z]+://[^\u003e]*\u003e|https?://\\S+`)\n+\tadrRef    = regexp.MustCompile(`\\bADR[- ]?\\d+\\b`)\n+\tissueRef  = regexp.MustCompile(`(?:^|[\\s(,;:])(#\\d+)\\b`)\n+\tdocRef    = regexp.MustCompile(`[\\w./-]*\\w\\.md\\b`)\n+)\n+\n+// unlinkedRefs are the decisions, docs and issues a page names without a\n+// link: a reader cannot follow ADR-0026, docs/x.md or #128. A doc is named\n+// when the name is a file of the repository, from the page or the root; a\n+// name in a code span is an example, not a reference.\n+func unlinkedRefs(t Tree, p string, lines []line) []Problem {\n+\tvar found []string\n+\tn := 0\n+\tvar hidden hiddenText\n+\tfor _, l := range lines {\n+\t\tif l.code || l.heading \u003e 0 { // a code span ends with its paragraph\n+\t\t\thidden.span = 0\n+\t\t}\n+\t\tif l.code {\n+\t\t\tcontinue\n+\t\t}\n+\t\ttext := hidden.strip(l.text)\n+\t\tif refLink.MatchString(l.text) { // a link's definition is the link\n+\t\t\tcontinue\n+\t\t}\n+\t\ttext = wholeLink.ReplaceAllString(text, \" \")\n+\t\tvar refs []string\n+\t\trefs = append(refs, adrRef.FindAllString(text, -1)...)\n+\t\tfor _, m := range issueRef.FindAllStringSubmatch(text, -1) {\n+\t\t\trefs = append(refs, m[1])\n+\t\t}\n+\t\tfor _, m := range docRef.FindAllString(text, -1) {\n+\t\t\tfor _, f := range []string{path.Join(path.Dir(p), m), path.Clean(m)} {\n+\t\t\t\tif f != p \u0026\u0026 t.Files[f] {\n+\t\t\t\t\trefs = append(refs, m)\n+\t\t\t\t\tbreak\n+\t\t\t\t}\n+\t\t\t}\n+\t\t}\n+\t\tfor _, ref := range refs {\n+\t\t\tn++\n+\t\t\tif len(found) \u003c 5 {\n+\t\t\t\tfound = append(found, fmt.Sprintf(\"line %d `%s`\", l.n, ref))\n+\t\t\t}\n+\t\t}\n+\t}\n+\tif n == 0 {\n+\t\treturn nil\n+\t}\n+\tmore := \"\"\n+\tif n \u003e len(found) {\n+\t\tmore = fmt.Sprintf(\" and %d more\", n-len(found))\n+\t}\n+\treturn []Problem{{Rule: \"reference-unlinked\", Where: p, Key: \"reference-unlinked \" + p, Size: n,\n+\t\tMessage: fmt.Sprintf(\"%d decision, doc or issue named without a link: %s%s; make each a link the reader can follow\", n, strings.Join(found, \", \"), more)}}\n+}\n+\n+// hiddenText takes out of prose, line after line, what a reader does not\n+// read as a reference: HTML comments and code spans (examples), either of\n+// which may run over several lines. A code span ends with its paragraph.\n+type hiddenText struct {\n+\tcomment bool\n+\tspan    int // the backticks the open code span closes with; 0 when none is open\n+}\n+\n+func (h *hiddenText) strip(text string) string {\n+\tif strings.TrimSpace(text) == \"\" {\n+\t\th.span = 0\n+\t}\n+\tvar out strings.Builder\n+\tfor text != \"\" {\n+\t\tswitch {\n+\t\tcase h.comment:\n+\t\t\ti := strings.Index(text, \"--\u003e\")\n+\t\t\tif i \u003c 0 {\n+\t\t\t\treturn out.String()\n+\t\t\t}\n+\t\t\ttext, h.comment = text[i+3:], false\n+\t\tcase h.span \u003e 0:\n+\t\t\ti := closingRun(text, h.span)\n+\t\t\tif i \u003c 0 {\n+\t\t\t\treturn out.String()\n+\t\t\t}\n+\t\t\ttext, h.span = text[i+h.span:], 0\n+\t\tdefault:\n+\t\t\tc, b := strings.Index(text, \"\u003c!--\"), strings.IndexByte(text, '`')\n+\t\t\tswitch {\n+\t\t\tcase c \u003c 0 \u0026\u0026 b \u003c 0:\n+\t\t\t\tout.WriteString(text)\n+\t\t\t\treturn out.String()\n+\t\t\tcase c \u003e= 0 \u0026\u0026 (b \u003c 0 || c \u003c b):\n+\t\t\t\tout.WriteString(text[:c] + \" \")\n+\t\t\t\ttext, h.comment = text[c+4:], true\n+\t\t\tdefault:\n+\t\t\t\tout.WriteString(text[:b] + \" \")\n+\t\t\t\tn := len(text[b:]) - len(strings.TrimLeft(text[b:], \"`\"))\n+\t\t\t\ttext, h.span = text[b+n:], n\n+\t\t\t}\n+\t\t}\n+\t}\n+\treturn out.String()\n+}\n+\n+// closingRun is where a run of exactly n backticks starts in text, or -1.\n+func closingRun(text string, n int) int {\n+\tfor i := 0; i \u003c len(text); {\n+\t\tif text[i] != '`' {\n+\t\t\ti++\n+\t\t\tcontinue\n+\t\t}\n+\t\tj := i\n\n(cut)\n```\n","question":"Is this finding about the author's claim true: does the code quoted, as it reads, contradict the claim quoted, as the author made it? Answer no if the code does what the claim says, if the claim says nothing the code could contradict, or if the finding only guesses."}