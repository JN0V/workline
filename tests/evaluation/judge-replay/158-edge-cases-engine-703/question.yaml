{"material":"## The finding\n\nimportant: Unindented lines of an item silently dropped\n\nWhy: answerItems keeps only lines starting with a space, a tab, or empty, so a line at column 0 inside an item is discarded. This happens when code is pasted under a block scalar without indentation, the case Mend's docs name. The item is then read from truncated text, for example a quote cut short, and counts as read. Or it breaks and is reported with part of its text missing. The lost lines are counted nowhere, and no finding mentions them.\n\nIts cause, quoted:\n\n```\ncase len(items) \u003e 0 \u0026\u0026 (strings.HasPrefix(l, \" \") || strings.HasPrefix(l, \"\\t\") || l == \"\"):\n```\n\n## internal/engine/engine.go, lines 688 to 718\n\n```\n688  \n689  // unreadFeedback is what the agent is told when nothing of its answer read.\n690  func unreadFeedback(why string) string {\n691  \treturn \"- agent-invalid-output: \" + why + \"\\n\\nNothing of that answer could be read: send it again as valid YAML. \" +\n692  \t\tagent.BlockScalars + \"\\n\"\n693  }\n694  \n695  // answerItems cuts an answer into its top-level list items: each starts\n696  // with \"- \" at the start of a line and runs to the next.\n697  func answerItems(answer string) []string {\n698  \tvar items []string\n699  \tfor _, l := range strings.Split(answer, \"\\n\") {\n700  \t\tswitch {\n701  \t\tcase strings.HasPrefix(l, \"- \"):\n702  \t\t\titems = append(items, l+\"\\n\")\n703  \t\tcase len(items) \u003e 0 \u0026\u0026 (strings.HasPrefix(l, \" \") || strings.HasPrefix(l, \"\\t\") || l == \"\"): // a tab: code pasted as it is, which Mend indents\n704  \t\t\titems[len(items)-1] += l + \"\\n\"\n705  \t\t}\n706  \t}\n707  \treturn items\n708  }\n709  \n710  // claimsRead are the items of an answer that read as a claim each.\n711  func claimsRead(answer string) []intent.Intention {\n712  \tvar out []intent.Intention\n713  \tfor _, item := range answerItems(answer) {\n714  \t\titem, _ = agent.Mend(item)\n715  \t\tvar one []map[string]any\n716  \t\tif yaml.Unmarshal([]byte(item), \u0026one) == nil \u0026\u0026 len(one) == 1 \u0026\u0026 len(one[0]) == 1 \u0026\u0026 one[0][\"claim\"] != nil {\n717  \t\t\tout = append(out, intent.Intention{Kind: \"claim\", Value: one[0][\"claim\"]})\n718  \t\t}\n```\n\n## What the change did to internal/engine/engine.go\n\n```diff\ndiff --git a/internal/engine/engine.go b/internal/engine/engine.go\nindex 530b03b..d4e21b6 100644\n--- a/internal/engine/engine.go\n+++ b/internal/engine/engine.go\n@@ -612,13 +612,16 @@ func askParts(r *role.Role, o Options, ag agent.Agent, runDir string, tasks []st\n \t\t\t// reader: the items are read one by one, the broken ones kept\n \t\t\t// as unreadable claims, which the role counts as dropped.\n \t\t\traw, _ := os.ReadFile(filepath.Join(dir, \"out\", \"agent-answer.txt\"))\n-\t\t\tread, broken := claimsOneByOne(string(raw))\n+\t\t\tread, broken, mended := claimsOneByOne(string(raw))\n \t\t\tif read == 0 {\n \t\t\t\tunanswered(\"invalid\", err.Error())\n \t\t\t\tcontinue\n \t\t\t}\n \t\t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"part-partly-read\", Where: name, Level: \"warn\",\n \t\t\t\tMessage: fmt.Sprintf(\"the answer to this part was not valid as a whole: %d claims read one by one, %d that could not be read counted as dropped\", read, len(broken))})\n+\t\t\tfor _, m := range mended {\n+\t\t\t\tres.Findings = append(res.Findings, verdict.Finding{Rule: \"answer-mended\", Where: name, Level: \"warn\", Message: m})\n+\t\t\t}\n \t\t\tif err := intent.Write(filepath.Join(dir, \"out\", \"intentions.yaml\"), append(claimsRead(string(raw)), broken...)); err != nil {\n \t\t\t\treturn err\n \t\t\t}\n@@ -668,7 +671,7 @@ func partUnread(err error, dir string, claims bool) string {\n \tif errors.Is(err, agent.ErrInvalidOutput) {\n \t\tif claims {\n \t\t\traw, _ := os.ReadFile(filepath.Join(dir, \"out\", \"agent-answer.txt\"))\n-\t\t\tif read, _ := claimsOneByOne(string(raw)); read \u003e 0 {\n+\t\t\tif read, _, _ := claimsOneByOne(string(raw)); read \u003e 0 {\n \t\t\t\treturn \"\"\n \t\t\t}\n \t\t}\n@@ -697,7 +700,7 @@ func answerItems(answer string) []string {\n \t\tswitch {\n \t\tcase strings.HasPrefix(l, \"- \"):\n \t\t\titems = append(items, l+\"\\n\")\n-\t\tcase len(items) \u003e 0 \u0026\u0026 (strings.HasPrefix(l, \" \") || l == \"\"):\n+\t\tcase len(items) \u003e 0 \u0026\u0026 (strings.HasPrefix(l, \" \") || strings.HasPrefix(l, \"\\t\") || l == \"\"): // a tab: code pasted as it is, which Mend indents\n \t\t\titems[len(items)-1] += l + \"\\n\"\n \t\t}\n \t}\n@@ -708,6 +711,7 @@ func answerItems(answer string) []string {\n func claimsRead(answer string) []intent.Intention {\n \tvar out []intent.Intention\n \tfor _, item := range answerItems(answer) {\n+\t\titem, _ = agent.Mend(item)\n \t\tvar one []map[string]any\n \t\tif yaml.Unmarshal([]byte(item), \u0026one) == nil \u0026\u0026 len(one) == 1 \u0026\u0026 len(one[0]) == 1 \u0026\u0026 one[0][\"claim\"] != nil {\n \t\t\tout = append(out, intent.Intention{Kind: \"claim\", Value: one[0][\"claim\"]})\n@@ -717,17 +721,22 @@ func claimsRead(answer string) []intent.Intention {\n }\n \n // claimsOneByOne counts the items that read as claims, and returns the\n-// others as claims with nothing to check, which the role drops.\n-func claimsOneByOne(answer string) (int, []intent.Intention) {\n+// others as claims with nothing to check, which the role drops, and what\n+// was mended of those read (agent.Mend).\n+func claimsOneByOne(answer string) (int, []intent.Intention, []string) {\n \tread := len(claimsRead(answer))\n \tvar broken []intent.Intention\n+\tvar mended []string\n \tfor _, item := range answerItems(answer) {\n+\t\titem, said := agent.Mend(item)\n \t\tvar one []map[string]any\n \t\tif yaml.Unmarshal([]byte(item), \u0026one) != nil || len(one) != 1 || len(one[0]) != 1 || one[0][\"claim\"] == nil {\n \t\t\tbroken = append(broken, intent.Intention{Kind: \"claim\", Value: map[string]any{\"unreadable\"