{"material":"## The finding\n\nimportant: A page with only items to settle claims nothing waits on the person\n\nWhy: A proposal that is for a person to settle gets no box and is not counted in `decide`. On the slipped-milestone case (`slipped-without-a-milestone-proposed`) `decide`, `checks` and `accept` are all 0. The *What to do* section then says \"Nothing waits on you\" while *To decide* lists \"For you to settle\". The updated case only checks `body-contains` for the settle line, so it cannot catch the contradiction or a wrong count.\n\nIts cause, quoted:\n\n```\nif decide+checks+accept == 0 \u0026\u0026 !paused {\n```\n\n## The code it stands on\n\nAs it reads at c950651: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/backlog/report.go, lines 52 to 98: `whatToDo`, the function the cause lies in\n\n```\n52  // whatToDo is the report's top: what waits on a person, how long it\n53  // takes, and whether the role is about to pause or paused.\n54  func (p *Plan) whatToDo(decide, checks, did int) string {\n55  \tvar items []string\n56  \tr, max := p.Record, p.config.IgnoredMax\n57  \tpaused := max \u003e 0 \u0026\u0026 r.Ignored \u003e= max\n58  \tif paused {\n59  \t\titems = append(items, fmt.Sprintf(\"**Paused**: %d runs in a row proposed something and nobody ticked a box, wrote here or undid an act. No agent is asked until a person does; tick this to resume:\\n\\n  - [ ] Resume %s\", r.Ignored, TickMarker(KeyResume)))\n60  \t}\n61  \taccept := len(p.Record.ToAccept)\n62  \tif decide \u003e 0 {\n63  \t\titems = append(items, fmt.Sprintf(\"**%s to decide** (*To decide*): tick a box to agree, and the role does it at its next run; leave it unticked to say no.\", plural(decide, \"proposal\")))\n64  \t}\n65  \tif checks \u003e 0 {\n66  \t\titems = append(items, fmt.Sprintf(\"**%s to check** (*To check*): what an issue was built on changed; read it, then tick its box.\", plural(checks, \"change\")))\n67  \t}\n68  \tif decide+checks+accept == 0 \u0026\u0026 !paused {\n69  \t\titems = append(items, \"**Nothing waits on you.** Below: what is next, and what the role did.\")\n70  \t}\n71  \tif accept \u003e 0 {\n72  \t\titems = append(items, fmt.Sprintf(\"**%s to accept** (*To accept*): close each once you checked what its parts delivered.\", plural(accept, \"need\")))\n73  \t}\n74  \tswitch {\n75  \tcase max == 0:\n76  \t\titems = append(items, fmt.Sprintf(\"**Never paused** (ignored-runs-max: 0): the agent is asked on every run, though nobody answered the last %d.\", r.Ignored))\n77  \tcase !paused \u0026\u0026 r.Ignored \u003e 0 \u0026\u0026 len(r.Proposed) \u003e 0:\n78  \t\twhen := \"before the next run\"\n79  \t\tif left := max - r.Ignored; left \u003e 1 {\n80  \t\t\twhen = fmt.Sprintf(\"within %d runs\", left)\n81  \t\t}\n82  \t\titems = append(items, fmt.Sprintf(\"**Answer %s, or the role pauses**: nobody answered its last %s (it pauses at %d). A tick, a comment here or an act undone is an answer.\", when, plural(r.Ignored, \"run\"), max))\n83  \t}\n84  \tif did \u003e 0 {\n85  \t\tthem := \"them\"\n86  \t\tif did == 1 {\n87  \t\t\tthem = \"it\"\n88  \t\t}\n89  \t\titems = append(items, fmt.Sprintf(\"**%s done alone this run**: check %s under *What the role did*, and undo what you disagree with.\", plural(did, \"act\"), them))\n90  \t}\n91  \tif level, why := p.Record.Measure.Suggest(); level != \"\" {\n92  \t\titems = append(items, fmt.Sprintf(\"**Suggested**: `autonomy: %s` — %s. Set it in the project's settings if you agree; the role never changes it.\", level, why))\n93  \t}\n94  \tif level, why := SuggestFromRecord(p.Record); level != \"\" {\n95  \t\titems = append(items, fmt.Sprintf(\"**Suggested** from the acts done alone: `autonomy: %s` — %s. Set it in the project's settings if you agree; the role never changes it.\", level, why))\n96  \t}\n97  \treturn \"\\n## What to do\\n\\n- \" + strings.Join(items, \"\\n- \") + \"\\n\"\n98  }\n```\n\n### internal/backlog/report.go, lines 100 to 157: `toDecide`, the function the symptom lies in\n\n```\n100  // toDecide is the report's boxes: each proposal, under the issue it is\n101  // on, saying what a tick does; the kinds a person can set back to act. It\n102  // says how many boxes it holds.\n103  func (p *Plan) toDecide() (string, int) {\n104  \tvar order []int\n105  \tbyIssue := map[int][]string{}\n106  \tvar opens []string\n107  \tn := 0\n108  \tfor _, q := range p.Record.Proposed {\n109  \t\tline := q.Line\n110  \t\tswitch {\n111  \t\tcase q.Proposal != nil \u0026\u0026 q.Doable():\n112  \t\t\tline = offer(*q.Proposal)\n113  \t\tcase q.Proposal != nil \u0026\u0026 q.Proposal.Do == \"open\", q.Key != \"\":\n114  \t\t\tline = strings.TrimSuffix(line, \".\") + \". Opened when the import runs again, or open it yourself.\"\n115  \t\tcase q.Undrafted():\n116  \t\t\tline = plainLine(line) + \" Drafted when the agent next reads it.\"\n117  \t\t}\n118  \t\tbox := \"- [ ] \" + line + \" \" + TickMarker(q.TickKey())\n119  \t\tif q.Proposal != nil \u0026\u0026 !q.Doable() \u0026\u0026 q.Proposal.Do != \"open\" {\n120  \t\t\t// A person's to settle — its reporter's rounds spent, a slip\n121  \t\t\t// with nowhere to go: no box a tick could not do.\n122  \t\t\tbox = \"- For you to settle: \" + line\n123  \t\t} else if q.Agreed != \"\" {\n124  \t\t\t// Ticked already: nothing left to decide, only to say.\n125  \t\t\tbox = fmt.Sprintf(\"- Ticked by %s: %s It is drafted, then done, at the next run that reads it with an agent.\", q.Agreed, plainLine(q.Line))\n126  \t\t} else {\n127  \t\t\tn++\n128  \t\t}\n129  \t\tif q.Issue == 0 {\n130  \t\t\topens = append(opens, box)\n131  \t\t\tcontinue\n132  \t\t}\n133  \t\tif _, ok := byIssue[q.Issue]; !ok {\n134  \t\t\torder = append(order, q.Issue)\n135  \t\t}\n136  \t\tbyIssue[q.Issue] = append(byIssue[q.Issue], box)\n137  \t}\n138  \tvar b strings.Builder\n139  \tfor _, id := range order {\n140  \t\thead := fmt.Sprintf(\"**#%d %s**\", id, p.title(id))\n141  \t\tif why := p.readFor(id); why != \"\" {\n142  \t\t\thead += \" — \" + why\n143  \t\t}\n144  \t\tb.WriteString(\"\\n\" + head + \"\\n\\n\" + strings.Join(byIssue[id], \"\\n\") + \"\\n\")\n145  \t}\n146  \tif len(opens) \u003e 0 {\n147  \t\tb.WriteString(\"\\n**Issues to open**\\n\\n\" + strings.Join(opens, \"\\n\") + \"\\n\")\n148  \t}\n149  \tif back := p.backToAct(); back != \"\" {\n150  \t\tn += len(p.Record.Propose)\n151  \t\tb.WriteString(back)\n152  \t}\n153  \tif b.Len() == 0 {\n154  \t\treturn \"\", 0\n155  \t}\n156  \treturn \"\\n## To decide\\n\\nTick a box to agree: the engine does it at its next run, as written. Leave it unticked to say no.\\n\" + b.String(), n\n157  }\n```\n\n### internal/role/role.go, lines 63 to 88: `For`, named by the finding\n\n```\n63  // For returns the needs of a task of that kind: the role's, with what\n64  // model.tasks sets for the kind in their place.\n65  func (m Model) For(kind string) Model {\n66  \tt, ok := m.Tasks[kind]\n67  \tif !ok {\n68  \t\treturn m\n69  \t}\n70  \tout := m\n71  \tout.Tasks = nil\n72  \tif t.Capability != \"\" {\n73  \t\tout.Capability = t.Capability\n74  \t}\n75  \tif t.Tier != \"\" {\n76  \t\tout.Tier = t.Tier\n77  \t}\n78  \tif t.Effort != \"\" {\n79  \t\tout.Effort = t.Effort\n80  \t}\n81  \tif t.PromoteAfter != 0 {\n82  \t\tout.PromoteAfter = t.PromoteAfter\n83  \t}\n84  \tif t.Timeout != \"\" {\n85  \t\tout.Timeout = t.Timeout\n86  \t}\n87  \treturn out\n88  }\n```\n\n### internal/backlog/hand.go, lines 22 to 24: `TickMarker`, called by `whatToDo`\n\n```\n22  // TickMarker is the hidden key that ends a line of the report a person\n23  // may tick.\n24  func TickMarker(key string) string { return forge.Marker(\"proposal=\" + key) }\n```\n\n### internal/backlog/board.go, lines 246 to 252: `plural`, called by `what