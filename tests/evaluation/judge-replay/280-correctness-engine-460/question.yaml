{"material":"## The finding\n\nimportant: Findings whose level is empty set to warn, hiding errors\n\nWhy: Every finding with an empty Level becomes warn, including ones that were errors by default. Intents are also dropped (intents = nil), so even an applied part of a mixed result is lost.\n\nIts cause, quoted:\n\n```\nif f.Level == \"\" { f.Level = \"warn\" }\n```\n\n## The code it stands on\n\nAs it reads at 5c46147: the function the cause lies in, whole; then the functions the finding names, those the cause's function calls and those calling it, up to 200 lines all together (judge-lines-max). Found with no build: a call may be missed, a name taken for another of the same name.\n\n### internal/engine/engine.go, lines 445 to 475: the lines around the cause, in `run` (lines 242 to 572, longer than judge-lines-max)\n\n```\n445  \t\t\t\t\treturn err\n446  \t\t\t\t}\n447  \t\t\t\tintents, v = kept, nv\n448  \t\t\t\tv.Findings = append(left, v.Findings...)\n449  \t\t\t}\n450  \t\t}\n451  \t}\n452  \t// On an event whose steps all run (schedule, ADR-0037), a proposal\n453  \t// still refused once asked again is upkeep left for later: nothing of\n454  \t// it applied, each refusal said as a warning, the next run asks again.\n455  \t// The check did its job: the line is not failed for it (ADR-0037,\n456  \t// amended). Anything else that does not pass still fails it.\n457  \tif v.Status == verdict.Block \u0026\u0026 failures \u003e 0 \u0026\u0026 line != nil \u0026\u0026 !line.StopsAtFirst(o.Event) {\n458  \t\tsaid := make([]verdict.Finding, len(v.Findings))\n459  \t\tfor i, f := range v.Findings {\n460  \t\t\tif f.Level == \"\" {\n461  \t\t\t\tf.Level = \"warn\"\n462  \t\t\t}\n463  \t\t\tsaid[i] = f\n464  \t\t}\n465  \t\tv = \u0026verdict.Verdict{Status: verdict.Pass, Findings: said,\n466  \t\t\tSummary: \"the agent's proposal was refused, nothing of it applied; asked again at the next run (\" + v.Summary + \")\"}\n467  \t\tintents = nil\n468  \t}\n469  \tres.Status, res.Summary = v.Status, v.Summary\n470  \tres.Findings = append(res.Findings, v.Findings...)\n471  \t// A role keeping a backlog reads its report on every run, acts or not:\n472  \t// a closing undone, a box ticked, runs nobody answered (ADR-0025).\n473  \tkeeps := slices.ContainsFunc(r.Intentions, func(k string) bool { return slices.Contains(backlog.Kinds, k) })\n474  \t// Blocked, a run applies only what its role names to tell why\n475  \t// (`on-block`): the reviewer's comment, its record in it (#226). The\n```\n\n### internal/role/role.go, lines 140 to 148: `Accepts`, called by `run`\n\n```\n140  // Accepts reports whether the role can run on event.\n141  func (r *Role) Accepts(event string) bool {\n142  \tfor _, e := range r.Events {\n143  \t\tif e == event {\n144  \t\t\treturn true\n145  \t\t}\n146  \t}\n147  \treturn false\n148  }\n```\n\n### internal/role/role.go, lines 170 to 188: `LoadProjectConfig`, called by `run`\n\n```\n170  // LoadProjectConfig reads \u003crepo\u003e/.workline/config.yaml. A missing file is an\n171  // empty config; an unreadable or invalid one is an error.\n172  func LoadProjectConfig(repo string) (*ProjectConfig, error) {\n173  \tvar c ProjectConfig\n174  \tdata, err := os.ReadFile(filepath.Join(repo, \".workline\", \"config.yaml\"))\n175  \tif os.IsNotExist(err) {\n176  \t\treturn \u0026c, nil\n177  \t}\n178  \tif err != nil {\n179  \t\treturn nil, err\n180  \t}\n181  \tif err := CheckConfig(data); err != nil {\n182  \t\treturn nil, err\n183  \t}\n184  \tif err := yaml.Unmarshal(data, \u0026c); err != nil {\n185  \t\treturn nil, \u0026ConfigError{err.Error()}\n186  \t}\n187  \treturn \u0026c, nil\n188  }\n```\n\n### internal/agent/agent.go, lines 74 to 110: `Parse`, called by `run`\n\n```\n74  // Parse turns an agent spec into an agent. \"none\" (or \"\") returns nil: no agent.\n75  //\n76  //\tnone                  no AI; the role's without-ai rule applies\n77  //\tclaude                Claude Code, headless (claude -p), on the model