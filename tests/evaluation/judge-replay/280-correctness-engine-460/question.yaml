urn nil, fmt.Errorf(\"unknown agent %q (known: none, claude, claude:\u003cmodel\u003e@\u003ceffort\u003e, cmd:\u003ccommand\u003e, fake:\u003cfile\u003e, unavailable:\u003creason\u003e)\", spec)\n110  }\n```\n\n### internal/engine/engine.go, lines 2580 to 2603: `newRunDir`, called by `run`\n\n```\n2580  // newRunDir creates the run's folder inside the repository's git directory,\n2581  // where it is never tracked and never shows up as a change.\n2582  func newRunDir(repo, roleName string) (string, error) {\n2583  \tbase := filepath.Join(repo, \".workline\", \"runs\")\n2584  \tif out, err := exec.Command(\"git\", \"-C\", repo, \"rev-parse\", \"--absolute-git-dir\").Output(); err == nil {\n2585  \t\tbase = filepath.Join(strings.TrimSpace(string(out)), \"workline\", \"runs\")\n2586  \t}\n2587  \tif d := os.Getenv(\"WORKLINE_RUNS_DIR\"); d != \"\" {\n2588  \t\tbase = d // in CI, somewhere an artifact can carry it to the job that applies\n2589  \t}\n2590  \tid := fmt.Sprintf(\"%s-%s\", time.Now().UTC().Format(\"20060102T150405.000000000\"), roleName)\n2591  \tdir := filepath.Join(base, id)\n2592  \tfor _, d := range []string{\"in/input\", \"out\"} {\n2593  \t\tif err := os.MkdirAll(filepath.Join(dir, d), 0o755); err != nil {\n2594  \t\t\treturn \"\", err\n2595  \t\t}\n2596  \t}\n2597  \tif old, err := os.ReadDir(base); err == nil \u0026\u0026 len(old) \u003e keepRuns {\n2598  \t\tfor _, e := range old[:len(old)-keepRuns] { // names start with a timestamp, so the oldest come first\n2599  \t\t\tos.RemoveAll(filepath.Join(base, e.Name()))\n2600  \t\t}\n2601  \t}\n2602  \treturn dir, nil\n2603  }\n```\n\n### internal/engine/engine.go, lines 2616 to 2627: `writeInputs`, called by `run`\n\n```\n2616  func writeInputs(runDir string, inputs map[string]string, settings map[string]any) error {\n2617  \tfor k, v := range inputs {\n2618  \t\tif err := os.WriteFile(filepath.Join(runDir, \"in\", \"input\", k), []byte(v), 0o644); err != nil {\n2619  \t\t\treturn err\n2620  \t\t}\n2621