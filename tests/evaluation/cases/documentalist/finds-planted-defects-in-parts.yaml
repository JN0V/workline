case: documentalist/finds-planted-defects-in-parts
about: "ADR-0009's measure, in parts: the same doc and defects as finds-planted-defects-whole, judged a source at a time (parts-always, part-chars), then one fix; its `checked` does not move. Beside it, a clean control doc on a source the same commit changes, true in every line: judged in parts too, it ends `checked` (ADR-0014, step 4; #482). Compare the checks passed, and the tokens."
given:
  repo: service
  config: {roles: {documentalist: {settings: {judge-in-parts: true, parts-always: true, part-chars: 1500, parts-move-checked: true}}}}
  setup:
    # The clean control: every line true before the change and after it.
    - "printf -- '---\\ntype: reference\\nsources: [src/service/config.go]\\nchecked: HEAD\\n---\\n# Configuration defaults\\n\\n`Load` fills each field of `Config` left unset with its default. The read\\ntimeout defaults to 30 seconds, the session TTL to 24 hours, and the log\\nlevel to `info`. A field the configuration sets is kept as it is.\\n' > docs/tech/defaults.md && git add docs/tech/defaults.md && git commit -qm 'docs: describe the configuration defaults' && C=$(git rev-parse --short HEAD) && sed -i \"s/checked: HEAD/checked: $C/\" docs/tech/defaults.md && git commit -qam 'docs: confirm the defaults doc'"
    - "sed -i 's/DefaultPort           = 8080/DefaultPort           = 9090/; s/DefaultMaxConnections = 100/DefaultMaxConnections = 250/' src/service/config.go && sed -i 's/keeps each session for the configured session TTL./keeps each session twelve hours, whatever the configuration./; s/ttl: c.SessionTTL,/ttl: 12 * time.Hour,/' src/service/store.go && sed -i 's/VerifyToken/CheckToken/g' src/service/auth.go && printf '\\n// Health answers 200 while the service runs.\\nfunc Health(w http.ResponseWriter, r *http.Request) { w.WriteHeader(http.StatusOK) }\\n' >> src/service/server.go && git commit -qam 'feat(service): new defaults, fixed session length, rename token check'"
run: {role: documentalist, event: merge-request}
grade:
  - {status: pass}
  # Found wrong, in one source, early in the doc.
  - {file-lacks: {docs/tech/service.md: "port 8080"}}
  - {file-contains: {docs/tech/service.md: "9090"}}
  # A count, in the middle.
  - {file-lacks: {docs/tech/service.md: "At most 100"}}
  - {file-contains: {docs/tech/service.md: "250"}}
  # A sentence the store and the configuration both speak to.
  - {file-lacks: {docs/tech/service.md: "lasts the configured session TTL"}}
  # A name renamed, late in the doc.
  - {file-lacks: {docs/tech/service.md: "`VerifyToken`"}}
  - {file-contains: {docs/tech/service.md: "CheckToken"}}
  # What stayed true stays: no false alarm.
  - {file-contains: {docs/tech/service.md: "503 Service Unavailable"}}
  - {file-contains: {docs/tech/service.md: "HMAC-SHA256"}}
  - {file-contains: {docs/tech/service.md: "lost when the service stops"}}
  - {file-contains: {docs/tech/service.md: "30 seconds"}}
  # Never `checked` over a planted falsehood (ADR-0014, step 4).
  - {never-confirms: {docs/tech/service.md: "port 8080"}}
  - {never-confirms: {docs/tech/service.md: "At most 100"}}
  - {never-confirms: {docs/tech/service.md: "lasts the configured session TTL"}}
  - {never-confirms: {docs/tech/service.md: "`VerifyToken`"}}
  - {checked-unchanged: docs/tech/service.md}
  # The clean control, read in parts, ends `checked`; its text unchanged.
  - {checked-is-head: docs/tech/defaults.md}
  - {body-unchanged: docs/tech/defaults.md}
