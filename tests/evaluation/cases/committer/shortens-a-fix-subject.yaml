case: committer/shortens-a-fix-subject
about: A message this repository's hook refused, replayed on its own commit; the rewrite fixes what was refused and keeps the author's words.
given: {workline-commit: 446d5a2}
run:
  role: committer
  event: commit-msg
  message: |-
    fix(config): refuse keys the engine does not know, instead of ignoring them

    Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>
grade:
  - {status: pass}
  - {agent-calls-max: 1}
  - {subject-max: 72}
  # 0.6: "unknown keys" for "keys the engine does not know" is a fair cut, and
  # its author said so (2026-09-25); telling a fair paraphrase from a betrayal
  # of the author's words is the judge's work, not a word count's.
  - {keeps-words: 0.6}
  - {no-vague-words: true}
  - {judge: "Does the rewritten subject say what the author's subject said, without narrowing, widening or changing its meaning?"}
