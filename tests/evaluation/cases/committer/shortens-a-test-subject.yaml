case: committer/shortens-a-test-subject
about: A message this repository's hook refused, replayed on its own commit; the rewrite fixes what was refused and keeps the author's words.
given: {workline-commit: 6b69512}
run:
  role: committer
  event: commit-msg
  message: |-
    test(documentalist): specify budgets, duplicates, dead links and judged patches

    Co-Authored-By: Claude Opus 5.5 (1M context) <noreply@anthropic.com>
grade:
  - {status: pass}
  - {agent-calls-max: 1}
  - {subject-max: 72}
  - {keeps-words: 0.7}
  - {no-vague-words: true}
