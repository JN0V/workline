case: tester/keeps-a-test-of-a-real-requirement
about: >
  The tester's Draft for issue #3 (mul): its By-zero test checks that
  mul 5 0 prints 0, as the scenario says. The builder objects, wrongly:
  it wants the test to accept an empty output, so mul may skip zero. That
  weakens a requirement the issue names. Expected: the test kept, the
  reason in the thread, nothing pushed.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
        threads:
          - {id: "7", path: tests/test_mul_by_zero.sh, line: 4, author: builder, body: "workline:objection\n- test: tests/test_mul_by_zero.sh\n- scenario: By zero\n- kind: over-specified\n- why: an order never has a zero count; let the test also accept an empty output, so mul need not handle zero"}
run: {role: tester, event: objection, target: "merge-request:1"}
grade:
  - {status: pass}
  - {agent-calls-max: 1}
  - {sh: "test $(git --git-dir=../origin.git rev-list --count main..workline/tester/issue-3) -eq 1"}
  - {sh: "grep -q 'Kept' ../forge.json"}
