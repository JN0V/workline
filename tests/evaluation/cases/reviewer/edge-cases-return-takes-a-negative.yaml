case: reviewer/edge-cases-return-takes-a-negative
about: "Edge cases, negative: Return puts units back without Add's guard, so a negative count takes units out unchecked, below zero. Its test returns two."
given:
  repo: shop
  setup:
    - |
      git checkout -q -b feature
      cat >> shop/stock.go <<'GO'

      // Return puts back n units of sku, from an order cancelled.
      func (s *Stock) Return(sku string, n int) {
      	s.mu.Lock()
      	defer s.mu.Unlock()
      	s.left[sku] += n
      }
      GO
      cat >> shop/stock_test.go <<'GO'

      func TestReturn(t *testing.T) {
      	s := NewStock()
      	s.Return("tea", 2)
      	if s.Left("tea") != 2 {
      		t.Errorf("left %d, want 2", s.Left("tea"))
      	}
      }
      GO
      git commit -qam 'feat(stock): put back what a cancelled order took'
run: {role: reviewer, event: review, input: {range: main..HEAD}}
review:
  defects:
    - lens: edge-cases
      kind: negative-input
      at: [{file: shop/stock.go, lines: [47, 50], text: "func (s *Stock) Return(sku string, n int) {"}]
