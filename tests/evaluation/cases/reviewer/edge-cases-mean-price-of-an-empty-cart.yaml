case: reviewer/edge-cases-mean-price-of-an-empty-cart
about: "Edge cases, empty: MeanPrice divides by the number of items, and an empty cart divides by zero. Its test covers two items."
given:
  repo: shop
  setup:
    - |
      git checkout -q -b feature
      cat >> shop/cart.go <<'GO'

      // MeanPrice is the mean unit price of the cart's items, in cents,
      // rounded down.
      func MeanPrice(items []Item) int {
      	sum := 0
      	for _, it := range items {
      		sum += it.Price
      	}
      	return sum / len(items)
      }
      GO
      cat >> shop/cart_test.go <<'GO'

      func TestMeanPrice(t *testing.T) {
      	if got := MeanPrice([]Item{{"tea", 450, 2}, {"cup", 1200, 1}}); got != 825 {
      		t.Errorf("MeanPrice = %d, want 825", got)
      	}
      }
      GO
      git commit -qam 'feat(cart): the mean unit price'
run: {role: reviewer, event: review, input: {range: main..HEAD}}
review:
  defects:
    - lens: edge-cases
      kind: empty-input
      at: [{file: shop/cart.go, lines: [39, 39], text: "return sum / len(items)"}]
