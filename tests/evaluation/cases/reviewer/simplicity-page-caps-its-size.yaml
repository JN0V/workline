case: reviewer/simplicity-page-caps-its-size
about: "Simplicity, plain (ADR-0068, step 4): the twin of simplicity-page-builds-a-pager. #9 asks that a page hold at most 100 items; the change caps the size in Page, one line and a named constant, with the test the Verification asks. Nothing to find: no lens, simplicity included, may flag the cap."
given:
  repo: shop
  setup:
    - |
      git checkout -q -b feature
      cat > shop/page.go <<'GO'
      package shop

      // maxPageSize is the most items a page holds.
      const maxPageSize = 100

      // Page returns page p of the items, counted from 1, size items a page
      // and at most maxPageSize; nil past the last page, or for a page or a
      // size below 1.
      func Page(items []Item, p, size int) []Item {
      	if p < 1 || size < 1 {
      		return nil
      	}
      	size = min(size, maxPageSize)
      	from := (p - 1) * size
      	if from >= len(items) {
      		return nil
      	}
      	return items[from:min(from+size, len(items))]
      }
      GO
      cat >> shop/page_test.go <<'GO'

      func TestPageHoldsAtMost100(t *testing.T) {
      	items := make([]Item, 150)
      	if got := Page(items, 1, 1000); len(got) != 100 {
      		t.Errorf("page 1 of 1000: %d items, want 100", len(got))
      	}
      	if got := Page(items, 2, 1000); len(got) != 50 {
      		t.Errorf("page 2 of 1000: %d items, want 50", len(got))
      	}
      }
      GO
      git commit -qam 'feat(page): a page holds at most 100 items' -m 'Closes #9.'
  forge:
    issues:
      - id: 9
        title: A page holds at most 100 items
        body: "## Need\n\nA caller asking for a page of 1000 items gets at most 100, so one page never holds the whole catalogue.\n\n## Verification\n\nA test of Page on 150 items, a page size of 1000: page 1 holds 100 items, page 2 holds 50.\n\n## Scope\n\nshop/page.go, shop/page_test.go\n"
        labels: []
        comments: []
    merge-requests: []
run: {role: reviewer, event: review, input: {range: main..HEAD}}
review:
  not:
    - {file: shop/page.go, lines: [3, 4], text: "const maxPageSize = 100", why: "a named cap is what the Need asks, no more"}
    - {file: shop/page.go, lines: [13, 13], text: "size = min(size, maxPageSize)", why: "the one line that closes #9"}
