# A scenario kept as today, its guard named: a test the base holds
# (#1359); the new behaviour's scenario gets its test, red on the base.
- patch:
    file: tests/test_mul_two_by_three.sh
    content: |
      # Scenario: Two by three
      . ./lib.sh
      [ "$(mul 2 3)" = 6 ]
- covers: {scenario: "Add unchanged", reason: "kept as today: guarded by `tests.test_add`."}
- covers: {scenario: "Two by three", tests: ["test_mul_two_by_three"]}
