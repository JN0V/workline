# The tester's agent answering a test the review finds missing (#1265):
# the test added in two of its tests, where one file is asked.
- patch:
    file: tests/test_mul_two_by_three.sh
    content: |
      # Scenario: Two by three
      # Given the library, When I multiply 2 by 3, Then I get 6.
      . ./lib.sh
      [ "$(mul 2 3)" = 6 ]
      [ "$(mul -2 3)" = -6 ]
- patch:
    file: tests/test_mul_by_zero.sh
    content: |
      # Scenario: By zero
      # Given the library, When I multiply 5 by 0, Then I get 0.
      . ./lib.sh
      [ "$(mul 5 0)" = 0 ]
      [ "$(mul -5 0)" = 0 ]
- note: "A negative factor, in both tests."
