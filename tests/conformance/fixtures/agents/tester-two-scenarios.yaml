- patch:
    file: tests/test_mul_two_by_three.sh
    content: |
      # Scenario: Two by three
      # Given the library, When I multiply 2 by 3, Then I get 6.
      . ./lib.sh
      [ "$(mul 2 3)" = 6 ]
- patch:
    file: tests/test_mul_by_zero.sh
    content: |
      # Scenario: By zero
      # Given the library, When I multiply 5 by 0, Then I get 0.
      . ./lib.sh
      [ "$(mul 5 0)" = 0 ]
