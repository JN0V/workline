# A C test whose build breaks on the base, declared by its file: no
# language pack names a C test (#1293).
- patch:
    file: tests/test_mul.c
    content: |
      #include <assert.h>

      int mul(int a, int b);

      int main(void) {
          assert(mul(2, 3) == 6);
          return 0;
      }
- covers: {scenario: Multiply, tests: [tests/test_mul.c]}
