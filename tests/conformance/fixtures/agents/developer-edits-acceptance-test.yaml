# The developer's agent writing #3's mul, and loosening one of the
# tester's frozen tests to fit it.
- patch:
    file: lib.sh
    content: |
      add() { echo $(($1 + $2)); }
      mul() { echo $(($1 * $2)); }
- patch:
    file: tests/test_mul_by_zero.sh
    content: |
      # Scenario: By zero
      . ./lib.sh
      true
