- patch:
    file: tests/test_mul_two_by_three.sh
    content: |
      # Scenario: Two by three
      . ./lib.sh
      [ "$(mul 2 3)" = 6 ]
- patch:
    file: tests/test_mul_by_zero.sh
    content: |
      # Scenario: By zero
      . ./lib.sh
      [ "$(mul 5 0)" = 0 ]
- patch:
    file: lib.sh
    content: |
      add() { echo $(($1 + $2)); }
      mul() { echo $(($1 * $2)); }
