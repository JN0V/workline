        status: contradicted
        quote: "It logs at the `info` level by default."
        source: {path: src/service/config.go, lines: "11", quote: 'DefaultLogLevel       = "warn"'}
        why: "the default log level is warn"
    - claim:
        lines: "16"
        status: partial
        quote: "At most 100 requests are served at once"
