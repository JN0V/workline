# A judge that may read (ADR-0045) asks for a file git does not track, a
# path outside the repository and the head of a file; then says yes.
calls:
  - - read: {path: notes.txt, why: "a note beside the code"}
    - read: {path: ../outside.txt, why: "what lies beside the repository"}
    - read: {path: calc/calc.go, lines: "1-3", why: "the head of the file"}
  - - note: "yes: the division takes one less than the count."
