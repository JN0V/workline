- refine:
    issue: 13
    description: "A cache would help. Every run parses every file again, which takes a long time on a large repository with many files in many folders, and the time grows with each file added, so a project with thousands of files waits minutes for a run that changes nothing, while a cache of the files parsed, kept between runs and keyed by each file's content, would let a run parse only the files that changed since the last one, and would make a run on a large repository as fast as one on a small repository, which is what the people running it every night on their large repositories expect from a tool like this one today."
    why: "too long on purpose"
