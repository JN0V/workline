    description: "Adding the reviewer to a project whose `.workline/config.yaml` has an empty `routing:` key (`routing:` or `routing: ~`) writes a broken config, or loses the reviewer without a word.\n\n<details><summary>The cause in the code</summary>\n\n`AddReviewer`, in `internal/routing/adopt.go` at line 112, takes the empty key for a mapping: `events := child(child(top, \"routing\"), \"events\")`. Since ccffcb2, `SetAutonomy` turns an empty key into a mapping and refuses a scalar; `AddReviewer` should do the same.\n\n</details>"
