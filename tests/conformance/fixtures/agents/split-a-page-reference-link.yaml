# split-a-page-and-its-links, docs/auth.md linking to the part moved by a
# reference-style link, whose definition follows it.
- patch: |
    --- /dev/null
    +++ b/docs/sessions-length.md
    @@ -0,0 +1,9 @@
    +---
    +sources: [src/token.go]
    +checked: 776e6be
    +---
    +# How long a session lasts
    +
    +A session lasts as long as its token, and a token lasts one hour unless it is
    +refreshed. When it expires, the user is asked to sign in again, and anything
    +they had not saved is kept in the browser until they come back to the page. See [the spec](https://example.com/token).
    --- a/docs/sessions.md
    +++ b/docs/sessions.md
