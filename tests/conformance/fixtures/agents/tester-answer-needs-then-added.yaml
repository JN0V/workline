# The tester's agent answering a test the review finds missing: it names
# the file it lacks; given that file, it adds the test.
calls:
  - - note: "needs: lib.sh — the mul a test of a negative factor calls is not given"
  - - patch:
        file: tests/test_mul_two_by_three.sh
        content: |
          # Scenario: Two by three
          # Given the library, When I multiply 2 by 3, Then I get 6.
          . ./lib.sh
          [ "$(mul 2 3)" = 6 ]
          [ "$(mul -2 3)" = -6 ]
    - note: "Two by three now also multiplies a negative factor, the behaviour the review found untested."
