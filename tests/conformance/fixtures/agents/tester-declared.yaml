# Tests named for nothing, each scenario's declared (ADR-0065, change 4):
# by the report's id whole, or by its name alone.
- patch:
    file: tests/test_mul_case_a.sh
    content: |
      . ./lib.sh
      [ "$(mul 2 3)" = 6 ]
- patch:
    file: tests/test_mul_case_b.sh
    content: |
      . ./lib.sh
      [ "$(mul 5 0)" = 0 ]
- covers: {scenario: Two by three, tests: [test_mul_case_a]}
- covers: {scenario: By zero, tests: [tests.test_mul_case_b]}
