# A scenario kept as it is today gets its guard: a test that passes on
# the base, declared with the reason "kept as today"; the new
# behaviour's scenario gets its test, red on the base.
- patch:
    file: tests/test_mul_two_by_three.sh
    content: |
      # Scenario: Two by three
      . ./lib.sh
      [ "$(mul 2 3)" = 6 ]
- patch:
    file: tests/test_add_unchanged.sh
    content: |
      # Scenario: Add unchanged
      . ./lib.sh
      [ "$(add 2 3)" = 5 ]
- covers: {scenario: "Two by three", tests: ["test_mul_two_by_three"]}
- covers: {scenario: "Add unchanged", tests: ["test_add_unchanged"], reason: "kept as today"}
