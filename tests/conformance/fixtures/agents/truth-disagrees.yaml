# The documentalist's answer when docs/tech/auth.md is the authority and the
# code moved tokens to two hours: the doc stays as it is, checked again, and
# the disagreement goes to an issue.
- patch: |
    --- a/docs/tech/auth.md
    +++ b/docs/tech/auth.md
    @@ -3,3 +3,4 @@ type: reference
     sources: [src/auth/token.go]
    -checked: 9bf650b
    +checked: 1a8e5a4
    +verified: agent:documentalist
     ---
- issue:
    title: "The code disagrees with docs/tech/auth.md"
    body: "docs/tech/auth.md line 10 says access tokens last one hour; src/auth/token.go line 4 now sets TokenTTL = 7200."
