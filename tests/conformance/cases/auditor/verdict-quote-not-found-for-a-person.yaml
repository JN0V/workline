case: auditor/verdict-quote-not-found-for-a-person
about: "An act the judge says wrong is false only when the engine finds its quote again in the item it names, the code outside its comments (ADR-0046): a quote found nowhere leaves it unproven, for a person, never counted false; the week's comment says so."
given:
  repo: vouched
  env: {AUDIT: misquote}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "git checkout -q -b feat && printf 'package notes\\n\\n// Extra is never a number.\\nconst Extra = 12\\n' > src/notes/extra.go && git add src/notes/extra.go && GIT_AUTHOR_DATE=2026-01-07T09:00:00Z GIT_COMMITTER_DATE=2026-01-07T09:00:00Z git commit -q -m 'feat(notes): add an extra note'"
    - "git push -q origin feat:refs/pull/30/head && git checkout -q main && git merge -q --squash feat && GIT_AUTHOR_DATE=2026-01-07T12:00:00Z GIT_COMMITTER_DATE=2026-01-07T12:00:00Z git commit -q -m 'feat(notes): add an extra note (#30)' && git push -q origin main"
  forge:
    issues:
      - {"id": 20, "title": "Export rows", "body": "### Need\nExport the rows as CSV.\n\n### Validation\nI export my rows.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: ready, level: normal, day: '2026-01-06', line: 'Moved #20 to ready'}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
    merge-requests:
      - id: 30
        title: Add an extra note
        branch: feat
        base: main
        labels: []
        merged-at: "2026-01-07T12:00:00Z"
        merged-as: main
        comments:
          - |
            **workline reviewer** — 1 findings on the change; lenses: correctness.

            | | | Where | Finding |
            |---|---|---|---|
            | warns | correctness | `src/notes/extra.go:4` | Important: Extra is not a note's number |

            <!-- workline:record reviewed=0123456789abcdef0123456789abcdef01234567 runs=1 -->

            <!-- workline:sticky=reviewer/summary -->
run: {sample: [--week, 2026-W02, --judge, 'cmd:sh "$FIXTURES/agents/audit-acts.sh"'], then: apply}
expect:
  findings:
    - {rule: act-unproven, where: "#20", message: "\"the reporter withdrew it\" is not in #20; for a person"}
    - {rule: act-unproven, where: "#30 src/notes/extra.go:4", message: "\"Extra is never a number\" is a comment (src/notes/extra.go:3), not the code: a comment is not evidence"}
  no-findings:
    - {rule: act-false, where: "#20"}
    - {rule: act-false, where: "#30 src/notes/extra.go:4"}
  forge:
    issues:
      - {id: 21, title: "workline: the weekly sample of every role's acts", comment-contains: "| **unproven** |"}
      - {id: 21, comment-contains: "- **#20**: said wrong, not proven, for a person:\n  - \"the reporter withdrew it\" is not in #20\n"}
