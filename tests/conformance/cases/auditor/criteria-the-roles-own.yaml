case: auditor/criteria-the-roles-own
about: "The role's own criteria: a kind of act with `criteria/<kind>.md` in its role's folder and no copy in the auditor's is judged against that file (ADR-0070 §3). Here the product owner's `ready` has its own criteria and the auditor's folder holds none for it: the auditor is asked the role's file."
given:
  repo: vouched
  env: {WORKLINE_ROLES: "$WORK/roles"}
  setup:
    - "mkdir ../roles && for r in \"$FIXTURES\"/../../../roles/*/; do ln -s \"$(cd \"$r\" && pwd)\" \"../roles/$(basename \"$r\")\"; done"
    - "rm ../roles/auditor ../roles/product-owner && cp -r \"$FIXTURES/../../../roles/auditor\" ../roles/auditor && cp -r \"$FIXTURES/../../../roles/product-owner\" ../roles/product-owner"
    - "rm ../roles/auditor/criteria/product-owner/ready.md && mkdir ../roles/product-owner/criteria && printf 'ROLE-OWN-CRITERIA: a ready issue says what it asks.\\n' > ../roles/product-owner/criteria/ready.md"
  forge:
    issues:
      - {"id": 20, "title": "Issue 20", "body": "Issue 20.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: ready, level: normal, day: '2026-01-06', line: 'Did ready on #20'}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
    merge-requests: []
run: {sample: [--week, 2026-W02, --judge, 'cmd:sh "$FIXTURES/agents/audit-by-criteria.sh" ROLE-OWN-CRITERIA'], then: apply}
expect:
  status: pass
  findings:
    - {rule: act-stands, where: "#20", message: "the product owner's `ready` on #20"}
  no-findings:
    - {rule: sample-not-read, where: "#20"}
    - {rule: act-false, where: "#20"}
    - {rule: act-unproven, where: "#20"}
