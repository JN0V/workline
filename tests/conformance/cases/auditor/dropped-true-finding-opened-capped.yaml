expect:
  status: pass
  findings:
    - {rule: sample-acts, message: "31 acts, finding dropped, by the reviewer"}
    - {rule: defect-opened, where: "#1"}
    - {rule: defect-opened, where: "#2"}
    - {rule: defect-opened, where: "#3"}
  no-findings:
    - {rule: defect-opened, where: "#4"}
  forge:
    issues:
      - {id: 1, labels: [needs-triage], body-contains: ["its judge dropped it", "Found by the auditor role"]}
      - {id: 2, labels: [needs-triage]}
      - {id: 3, labels: [needs-triage]}
      - {id: 4, title: "workline: the weekly sample of every role's acts", comment-contains: "not opened: at most 3 a week"}
      - {id: 5, absent: true}
