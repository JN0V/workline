case: auditor/dropped-true-finding-opened-capped
about: "A finding the reviewer's judge dropped that the auditor finds true, its cause still in the code, is opened as an issue, `needs-triage`, through the one way every role opens one, at most three a week (ADR-0046); the rest are said, not opened."
given:
  repo: vouched
  env: {AUDIT: defects}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "git checkout -q -b feat && printf 'package notes\\n\\n' > src/notes/extra.go && for i in $(seq 1 31); do printf 'const E%02d = %d\\n' $i $i >> src/notes/extra.go; done && git add src/notes/extra.go && GIT_AUTHOR_DATE=2026-01-07T09:00:00Z GIT_COMMITTER_DATE=2026-01-07T09:00:00Z git commit -q -m 'feat(notes): add the extra notes'"
    - "git push -q origin feat:refs/pull/30/head && git checkout -q main && git merge -q --squash feat && GIT_AUTHOR_DATE=2026-01-07T12:00:00Z GIT_COMMITTER_DATE=2026-01-07T12:00:00Z git commit -q -m 'feat(notes): add the extra notes (#30)' && git push -q origin main"
  forge:
    issues: []
    merge-requests:
      - id: 30
        title: Add the extra notes
        branch: feat
        base: main
        labels: []
        merged-at: "2026-01-07T12:00:00Z"
