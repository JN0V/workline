case: auditor/criteria-an-auditor-copys-kinds-refused
about: "A copy of the auditor's folder (`WORKLINE_ROLES`) that still holds `kinds/<kind>.md`: the act is not judged, and the report names that old file and where it goes, not a missing generic question."
given:
  repo: vouched
  env: {WORKLINE_ROLES: "$WORK/roles"}
  setup:
    - "mkdir ../roles && for r in \"$FIXTURES\"/../../../roles/*/; do ln -s \"$(cd \"$r\" && pwd)\" \"../roles/$(basename \"$r\")\"; done"
    - "rm ../roles/auditor && cp -r \"$FIXTURES/../../../roles/auditor\" ../roles/auditor && rm ../roles/auditor/criteria/product-owner/ready.md && mkdir -p ../roles/auditor/kinds && printf 'OLD-PATH-CRITERIA: a ready issue is one a person wrote.\\n' > ../roles/auditor/kinds/ready.md"
  forge:
    issues:
      - {"id": 20, "title": "Issue 20", "body": "Issue 20.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: ready, level: normal, day: '2026-01-06', line: 'Did ready on #20'}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
    merge-requests: []
run: {sample: [--week, 2026-W02, --judge, 'cmd:sh "$FIXTURES/agents/audit-by-criteria.sh" NO-CRITERIA-GIVEN'], then: apply}
expect:
  status: pass
  findings:
    - {rule: sample-not-read, where: "#20", message: "kinds/ready.md is read no more: move it to"}
  no-findings:
    - {rule: act-stands, where: "#20"}
