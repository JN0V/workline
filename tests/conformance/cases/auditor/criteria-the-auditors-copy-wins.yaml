case: auditor/criteria-the-auditors-copy-wins
about: "The auditor's copy wins: a kind of act also in the auditor's criteria for that role (`criteria/<role>/<kind>.md`) is judged against the auditor's copy, never the role's own (ADR-0070 §3). Here the product owner's `ready` has both: the auditor is asked the auditor's file."
given:
  repo: vouched
  env: {WORKLINE_ROLES: "$WORK/roles"}
  setup:
    - "mkdir ../roles && for r in \"$FIXTURES\"/../../../roles/*/; do ln -s \"$(cd \"$r\" && pwd)\" \"../roles/$(basename \"$r\")\"; done"
    - "rm ../roles/auditor ../roles/product-owner && cp -r \"$FIXTURES/../../../roles/auditor\" ../roles/auditor && cp -r \"$FIXTURES/../../../roles/product-owner\" ../roles/product-owner"
    - "rm ../roles/auditor/kinds/ready.md && mkdir -p ../roles/auditor/criteria/product-owner ../roles/product-owner/criteria && printf 'AUDITOR-COPY-CRITERIA: a ready issue is one a person wrote.\\n' > ../roles/auditor/criteria/product-owner/ready.md && printf 'ROLE-OWN-CRITERIA: a ready issue says what it asks.\\n' > ../roles/product-owner/criteria/ready.md"
  forge:
    issues:
      - {"id": 20, "title": "Issue 20", "body": "Issue 20.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: ready, level: normal, day: '2026-01-06', line: 'Did ready on #20'}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
    merge-requests: []
run: {sample: [--week, 2026-W02, --judge, 'cmd:sh "$FIXTURES/agents/audit-by-criteria.sh" AUDITOR-COPY-CRITERIA ROLE-OWN-CRITERIA'], then: apply}
expect:
  status: pass
  findings:
    - {rule: act-stands, where: "#20", message: "the product owner's `ready` on #20"}
  no-findings:
    - {rule: sample-not-read, where: "#20"}
    - {rule: act-false, where: "#20"}
    - {rule: act-unproven, where: "#20"}
