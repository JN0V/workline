case: auditor/criteria-none-says-the-generic-question-missing
about: "No criteria: a kind of act with criteria nowhere (not the project's, the auditor's nor its role's) is not judged against any kind's question; the auditor's generic question stands in, and until its text ships the report says that generic question is missing, the act left for a person (ADR-0070 §3)."
given:
  repo: vouched
  env: {WORKLINE_ROLES: "$WORK/roles"}
  setup:
    - "mkdir ../roles && for r in \"$FIXTURES\"/../../../roles/*/; do ln -s \"$(cd \"$r\" && pwd)\" \"../roles/$(basename \"$r\")\"; done"
    - "rm ../roles/auditor ../roles/product-owner && cp -r \"$FIXTURES/../../../roles/auditor\" ../roles/auditor && cp -r \"$FIXTURES/../../../roles/product-owner\" ../roles/product-owner"
    - "rm ../roles/auditor/criteria/product-owner/ready.md"
    - "mkdir -p .workline/roles/auditor/criteria/product-owner ../roles/auditor/criteria/product-owner ../roles/product-owner/criteria && printf '  \\n\\n\\t\\n' > .workline/roles/auditor/criteria/product-owner/ready.md && printf '\\n   \\n' > ../roles/auditor/criteria/product-owner/ready.md && printf '\\n\\n' > ../roles/product-owner/criteria/ready.md"
  forge:
    issues:
      - {"id": 20, "title": "Issue 20", "body": "Issue 20.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: ready, level: normal, day: '2026-01-06', line: 'Did ready on #20'}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
    merge-requests: []
run: {sample: [--week, 2026-W02, --judge, 'cmd:sh "$FIXTURES/agents/audit-by-criteria.sh" NO-CRITERIA-GIVEN'], then: apply}
expect:
  status: pass
  findings:
    - {rule: sample-not-read, where: "#20", message: "generic question"}
  no-findings:
    - {rule: act-stands, where: "#20"}
