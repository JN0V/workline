case: auditor/sample-draws-the-developers-code
about: "The weekly sample draws the developer's code too, one in ten of its merge requests merged in the week (ADR-0046, the developer's row): its own commits on the head (`Workline-Role: developer`, `Workline-Model`), the tester's under them left out, and the record on its pull request. The auditor re-checks it against the issue, the diff of its commits and its proof: a code that subtracts the wrong way is found false with the diff's words; the judge's independence from the model that acted is said."
given:
  repo: curated
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -q -b workline/developer/3 && printf '. ./lib.sh\\n[ \"$(sub 5 3)\" = 2 ]\\n' > tests/test_sub.sh && git add tests/test_sub.sh && GIT_AUTHOR_DATE=2026-01-06T09:00:00Z GIT_COMMITTER_DATE=2026-01-06T09:00:00Z git commit -q -m 'test: the acceptance tests of #3' -m 'Workline-Role: tester\nWorkline-Model: claude:claude-sonnet-5'"
    - "printf 'sub() { echo $(($2 - $1)); }\\n' >> lib.sh && GIT_AUTHOR_DATE=2026-01-07T09:00:00Z GIT_COMMITTER_DATE=2026-01-07T09:00:00Z git commit -q -am 'Subtract two numbers' -m 'Workline-Role: developer\nWorkline-Model: claude:claude-sonnet-5'"
    - "git push -q origin workline/developer/3:refs/pull/1/head && git checkout -q main && git merge -q --squash workline/developer/3 && GIT_AUTHOR_DATE=2026-01-07T12:00:00Z GIT_COMMITTER_DATE=2026-01-07T12:00:00Z git commit -q -m 'Subtract two numbers (#1)' && git tag m1 && git push -q origin main"
    - "git branch -q -D workline/developer/3"
  forge:
    issues:
      - id: 3
        title: "Subtract two numbers"
        labels: []
        body: "## Need\n\nI want to subtract a count from a price.\n\n## Validation\n\n- **Five minus three:** Given the library, When I subtract 3 from 5, Then I get 2.\n\n---\n\n## Scope\n\n- `lib.sh`: a `sub` function beside `add`.\n"
    merge-requests:
      - id: 1
        title: "Subtract two numbers"
        branch: workline/developer/3
        base: main
        labels: []
        merged-at: "2026-01-07T12:00:00Z"
        merged-as: m1
        comments:
          - |
            **The developer**'s record of this pull request, for its next runs and the auditor.

            <!-- workline:developer-act {"act":"code","issue":3,"proof":{"result":"green","command":"sh run-tests.sh {report}","passed":4},"code":["lib.sh"]} -->
            <!-- workline:sticky=developer/code -->
run: {sample: [--week, 2026-W02, --judge, 'cmd:sh "$FIXTURES/agents/audit-acts.sh"'], then: apply}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: sample-acts, message: "1 act, code written, by the developer on the merge requests merged in the commits"}
    - {rule: act-false, where: "#1", message: "the code the developer wrote, on #1: Subtract two numbers — false: diff says \"$(($2 - $1))\""}
    - {rule: act-false, where: "#1", message: "independence: provider (claude-sonnet-5 → cmd)"}
  forge:
    issues:
      - {id: 4, title: "workline: the weekly sample of every role's acts", comment-contains: "| developer | code written | 1 | 1 |"}
      - {id: 4, comment-contains: "| #1 | developer, code written | 2026-01-07 | Subtract two numbers (claude:claude-sonnet-5) | **false** |"}
