case: auditor/count-agrees-with-a-thumb-up
about: "The maintainer agrees with a week in one click (ADR-0046): a 👍 on its comment, by a person who may write, agrees with all its rows; a reaction by one who may not counts for nothing. The count, written from every week's hidden rows, says so, and names the weeks that read nothing."
given:
  repo: vouched
  forge:
    issues:
      - id: 1
        title: "workline: the weekly sample of every role's acts"
        body: "Each week…"
        labels: []
        comments:
          - "### 2026-W01\n\nTwo acts.\n\n<!-- workline:rows [{\"n\":1,\"role\":\"documentalist\",\"kind\":\"checked\",\"ref\":\"docs/a.md\",\"verdict\":\"true\"},{\"n\":2,\"role\":\"product-owner\",\"kind\":\"ready\",\"ref\":\"#7\",\"verdict\":\"false\"}] -->\n\n<!-- workline:sample:2026-W01 -->"
        reactions-by:
          "1": [{emoji: "+1", author: lead, writer: true}, {emoji: "-1", author: zed}]
    merge-requests: []
run: {sample: [--week, 2026-W02, --judge, none], then: apply}
expect:
  status: pass
  applied: [comment, count]
  forge:
    issues:
      - {id: 1, comments: 3, comment-contains: "### The count, every week"}
      - {id: 1, comment-contains: "| documentalist | `checked` moved | 3 | 1 | 0 | 0 | 2 | 1 | 0 | 2 |\n| product owner | `ready` | 1 | 0 | 1 | 0 | 0 | 1 | 0 | 0 |"}
      - {id: 1, comment-contains: "| 2026-W01 | 2 of 2 | 1 | 👍 by lead |\n| 2026-W02 | 0 of 2 | 0 | unanswered |"}
      - {id: 1, comment-contains: "Weeks that read nothing: 2026-W02."}
