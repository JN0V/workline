case: developer/pr-says-unproven-scenario
about: >
  The tester's Draft says a scenario no test proves: the developer's pull
  request lists it under Unproven, with the tester's reason, for the
  reviewer's tests lens to weigh, its name inert. One kept as today with
  no test guarding it is left off until the tester writes guards.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"unproven\":[{\"scenario\":\"By zero, ask @ann\",\"why\":\"a person reads the printed table by eye\"},{\"scenario\":\"Add unchanged\",\"why\":\"kept as today: no existing test was found that checks it, so nothing guards it\"}]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  agent-calls: 1
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - id: 2
        branch: workline/developer/3
        body-contains: ["## Unproven\n\nScenarios of the issue no test proves, as the tester said, each with its reason: the reviewer's tests lens weighs whether a test can prove it.\n\n- **By zero, ask @​ann**: a person reads the printed table by eye\n"]
        body-lacks: ["Add unchanged", "@ann"]
