case: developer/takes-asks-the-product-owner-for-scope
about: >
  The developer's first step writes code only outside the issue's Scope
  (#1084; ADR-0063, §9): README.md, which #2's Scope does not name. The
  patch is refused, nothing within the bounds is left, and the step asks
  the product owner for the file: #2 goes back to refine, the product
  owner's state, the file and the developer's note on it with the mark
  the product owner reads, no pull request. Before, the issue was left
  claimed and silent for a day.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: "fake:developer-only-outside-scope"}
expect:
  status: pass
  summary: "took #2; 1 of its agent's proposals refused at apply; its code needs README.md, outside the issue's Scope: #2 sent back to refine, the product owner asked to widen it"
  agent-calls: 1
  findings: [{rule: outside-scope, level: warn, where: README.md}, {rule: scope-asked, level: warn, where: "#2"}]
  not-pushed: [workline/developer/2]
  forge:
    issues:
      - id: 2
        labels: ["workline:to-refine"]
        comment-contains: ["**The developer** sends this issue back to refine.", "its code needs `README.md`, outside its Scope: it asks the product owner to widen it", "documented in README.md", "<!-- workline:scope-ask at=", "\"asked\":[\"README.md\"]"]
        comment-lacks: "Why no pull request"
