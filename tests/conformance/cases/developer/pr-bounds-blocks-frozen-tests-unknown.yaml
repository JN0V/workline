case: developer/pr-bounds-blocks-frozen-tests-unknown
about: >
  The bounds on the pull request (ADR-0058, step 1) never pass on frozen
  tests they cannot read (principle 12): the developer's record names
  an acceptance test frozen at a start commit this clone does not hold,
  and no tester's record names it; the check blocks,
  frozen-tests-unknown, rather than let the test's edit past.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && printf '. ./lib.sh\\n[ 1 ]\\n' > tests/test_mul_by_zero.sh && git add -A && git commit -qm 'feat: mul for #3' -m 'Workline-Role: developer' && git checkout -q main"
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"from\":\"0123456789abcdef0123456789abcdef01234567\",\"acceptance\":[\"tests/test_mul_by_zero.sh\"],\"code\":[\"lib.sh\"]} -->\n<!-- workline:sticky=developer/code -->"
run: {develop: [--bounds, --merge-request, "2"], ai: none}
expect:
  status: block
  agent-calls: 0
  summary: "frozen tests unknown"
  findings:
    - {rule: frozen-tests-unknown, where: tests/test_mul_by_zero.sh, message: "cannot be read"}
