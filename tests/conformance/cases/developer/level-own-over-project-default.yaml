case: developer/level-own-over-project-default
about: >
  Each role its own level (ADR-0060, §3): the project's default
  `autonomy: enterprising`, the developer's own `autonomy: cautious`.
  The developer runs at cautious — three review rounds alone before its
  issue is blocked for a person, where normal runs five — and its task
  says the level is the role's setting.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  config:
    autonomy: enterprising
    roles:
      tester: {settings: {test-command: "sh run-tests.sh {report}"}}
      developer: {settings: {autonomy: cautious}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "took #3; proven green, its pull request ready"
  run-files:
    in/task.md: {contains: ["- Autonomy: cautious (role setting): 3 review rounds on your pull request, then its issue is blocked for a person."]}
