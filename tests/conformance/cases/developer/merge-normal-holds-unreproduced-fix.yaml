case: developer/merge-normal-holds-unreproduced-fix
about: >
  No failing test, no fix merged alone (ADR-0060, decision 4): at
  `normal`, the developer's pull request for #3, an issue labelled
  `bug`, is workline's own, its head's verdict passed, the reviewer's
  verdict on its head; but its record
  names no tester's Draft its code started from, so no test red on main
  ever showed the bug. A fix with no failing test proves nothing: it
  waits for a person's yes, said once on it, and why.
given:
  repo: tested-draft
  config: {merge: {autonomy: normal}}
  setup:
    - "git checkout -q -b workline/developer/3 && GIT_COMMITTER_NAME=workline-bot git commit -q --amend --no-edit && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_COMMITTER_NAME=workline-bot git commit -qam 'fix: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main"
  forge:
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    issues:
      - id: 3
        title: "mul gives a sum"
        labels: ["bug", "workline:developing"]
        body: "## Need\n\nmul 2 3 gives 5.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        author: workline-bot
        bot: true
        title: "mul gives a sum"
        body: "Closes #3"
        labels: []
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z", by: workline-bot}]
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:at head=4feb95cd88448f137d793775c4ad7b591c1ac175 run=7 -->\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: waits-for-a-yes, where: "#2", message: "a fix: its issue labelled `bug`, but its code starts from no tester's Draft: no test red on the base shows the bug"}
  no-findings: [{rule: auto-merge-on}, {rule: merged-at-once}]
  not-pushed: [workline/developer/3]
  summary-file: ["none accepted into main"]
  forge:
    merge-requests:
      - {id: 2, auto-merge: false, labels: [], comment-contains: ["Waiting for a person's yes", "a bug's fix merges once a test that failed on the base proves the bug", "workline:merge-waits=unreproduced"]}
    statuses:
      - {commit: "workline/developer/3", name: workline/accepted, absent: true}
