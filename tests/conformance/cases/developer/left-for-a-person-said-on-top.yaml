case: developer/left-for-a-person-said-on-top
about: >
  Files only a person changes, refused at apply, are named on top of the
  pull request, under Left for a person, where the reviewer's intent
  lens and the person read first: its agent wrote the code and a gate's
  files. The pull request still says `Closes #2`; nothing else changes.
given:
  repo: tested
  setup:
    - "printf 'exit 1\\n' > check.sh && git add check.sh && git commit -q -m 'chore: a check'"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    gates: {default: {checks: [{id: own, run: "sh check.sh", output: exit}]}}
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`, `check.sh`, `.workline/config.yaml`, `.github/workflows/ci.yml`.\n"}
run: {develop: [], ai: "fake:developer-gate-file"}
expect:
  status: pass
  agent-calls: 1
  pushed:
    workline/developer/2:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - id: 1
        branch: workline/developer/2
        body-contains: ["Closes #2\n\n## Left for a person\n\nRefused at apply: only a person changes these files.", "- `.github/workflows/ci.yml`: a gate's definition or the CI's"]
    issues:
      - {id: 2, labels: ["workline:developing"]}
