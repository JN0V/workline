case: developer/worktree-seals-included-credential
about: >
  A runner's git credentials in a file the repository's config includes
  (gitlab-runner 19.6: `include.path`, #722; ADR-0056, step 2). A
  credential helper there is sealed: the empty `credential.helper` the
  agent's environment sets is read last and empties the list, includes
  too; the agent asks git for a credential and gets none, the run goes
  on. A token written there is refused as anywhere else
  (worktree-refuses-included-token): the template takes it out first.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "printf '[credential]\\n\\thelper = \"!f() { echo username=gitlab-ci-token; echo password=planted; }; f\"\\n' > ../runner.ext.conf"
    - "git config include.path \"$(cd .. && pwd)/runner.ext.conf\""
  env:
    EDIT: reach
    GH_CONFIG_DIR: "$XDG_CONFIG_HOME/gh"
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-edits-worktree.sh"'}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: credential-in-reach}]
  pushed:
    workline/developer/2:
      lib.sh: "# credential: none; ssh agent: none; gh config: empty"
