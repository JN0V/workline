case: developer/draft-conflicting-with-main-blocks
about: >
  The tester's Draft was pushed, then main changed a file the Draft
  changed too (#1941): main does not merge into the Draft. No code is
  written on a stale base: its agent is not asked, the issue is
  blocked, not claimed, the file in conflict said on it.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
    - "printf '. ./lib.sh\\n[ \"$(mul 5 0)\" = 0 ] || exit 1\\n' > tests/test_mul_by_zero.sh && git add tests && git commit -q -m 'test: another zero' && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "#3: the tester's Draft conflicts with the base; blocked for a person"
  agent-calls: 0
  findings: [{rule: draft-behind, level: warn, where: "#3", message: "they conflict in `tests/test_mul_by_zero.sh`"}]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["**The developer** blocks this issue.", "`tests/test_mul_by_zero.sh`", "brought up to date with the base"]
    merge-requests:
      - id: 2
        absent: true
