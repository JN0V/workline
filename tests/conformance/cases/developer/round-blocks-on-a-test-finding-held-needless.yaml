case: developer/round-blocks-on-a-test-finding-held-needless
about: >
  A test finding sent to the tester still blocks the merge, and the
  tester answered on the pull request that no test is needed (#1265):
  no round settles it, the reviewer and the tester disagree. Its issue
  is blocked for a person, the reason on it and on the pull request,
  no agent asked; read again since, the same review asked nothing.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\"},\"round\":0,\"review-runs\":2,\"tester\":[\"tests|lib.sh|mul of a negative factor has no test\"]} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **blocks** | tests | `lib.sh:2` | Important: mul of a negative factor has no test — nothing runs mul -2 3. |\n\n<!-- workline:record reviewed=1111111 runs=3 -->\n<!-- workline:sticky=reviewer/summary -->"
          - "**The tester** answers a test finding of this review on `lib.sh:2`, sent to its Draft ([the thread](https://forge.example/1#7)): **None needed**: Two by three's test already runs mul, a negative factor is no behaviour a scenario asks.\n\n<!-- workline:sticky=tester/tester-answer-7 -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "the review blocks on test findings the tester holds needless: its issue #3 blocked"
  agent-calls: 0
  findings: [{rule: tests-disputed, level: warn, where: "merge request 2"}]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["still blocks on 1 test finding the tester answered no test is needed for: the reviewer and the tester do not agree"]
    merge-requests:
      - id: 2
        comment-contains: ["**Blocked**: the review still blocks on 1 test finding", "\"handed\":true"]
