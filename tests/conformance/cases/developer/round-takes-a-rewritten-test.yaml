case: developer/round-takes-a-rewritten-test
about: >
  The tester rewrote an acceptance test on an objection, its own commit
  on its Draft's branch, its record naming the new blob (ADR-0055). The
  developer's pull request started from the Draft before it: it holds
  the old test. The rewrite is a round (#939), with nothing else asked:
  the round takes the test as the tester's record names it into its
  branch, its agent reading it in its worktree, proves it with the
  rest and pushes it. Its record follows the tester's Draft, so the
  bounds hold the new blob.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer'"
    - "git checkout -q workline/tester/issue-3 && printf '# Scenario: Two by three\\n# Given the library, When I multiply 2 by 3, Then I get 6.\\n. ./lib.sh\\n[ \"$(mul 2 3)\" -eq 6 ] && [ \"$(mul 3 2)\" -eq 6 ]\\n' > tests/test_mul_two_by_three.sh && git commit -qam 'test: rewrite tests/test_mul_two_by_three.sh on an objection' -m 'Workline-Role: tester' && git checkout -q workline/developer/3"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3 && git fetch -q origin"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"eca7751834305f71777b8a23f4f87c2933fca770\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\nNo finding on the commits reviewed.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: 'cmd:cat >/dev/null; if grep -q "mul 3 2" tests/test_mul_two_by_three.sh; then echo "- note: the worktree holds the rewrite"; else echo "- note: the worktree holds the old test"; fi'}
expect:
  status: pass
  summary: "round 1 of 5 on merge request 2, its fix pushed, the tests green"
  agent-calls: 1
  no-findings: [{rule: agent-failed}, {rule: acceptance-test-edit}]
  pushed:
    workline/developer/3:
      tests/test_mul_two_by_three.sh: "$(mul 3 2)"
      lib.sh: "$1 * $2"
  run-files:
    in/task.md: {contains: ["Review round 1 of 5", "the tester rewrote `tests/test_mul_two_by_three.sh`"]}
  forge:
    merge-requests:
      - id: 2
        comment-contains: ["review round 1 of 5: its fix pushed, the project's tests green", "the worktree holds the rewrite", "the tester rewrote `tests/test_mul_two_by_three.sh`", "\"round\":1"]
