case: developer/edits-an-executable-file
about: >
  A file of mode 755, a project's script, is the developer's to edit
  like any text file: its patch changes the text, not the mode, so it
  is applied and the mode kept (#1330). A patch changing a mode stays
  refused (engine/patch-a-mode-change-refused).
given:
  repo: tested-draft
  setup:
    - "git checkout -q main && git update-index --chmod=+x lib.sh && chmod +x lib.sh && git commit -qm 'chore: make lib.sh executable' && git checkout -q workline/tester/issue-3 && git rebase -q main"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  env: {PATH: "$FIXTURES/claude:$PATH"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: claude}
expect:
  status: pass
  summary: "took #3; proven green, its pull request ready"
  agent-calls: 1
  no-findings: [{rule: engine-error}, {rule: proof-red}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
