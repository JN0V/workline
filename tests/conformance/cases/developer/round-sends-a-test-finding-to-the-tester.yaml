case: developer/round-sends-a-test-finding-to-the-tester
about: >
  The review asks one finding alone, of its tests lens, on a line of
  code: a behaviour with no test (#1265). In a team the reviewer asks the
  tester for it. No agent is called and no round counted: the finding
  goes on the tester's Draft, an objection of kind missing on a line of
  its tests, naming the pull request; the record keeps it sent, never
  asked again. The issue is not blocked.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\"},\"round\":0,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **warns** | tests | `lib.sh:2` | Important: mul of a negative factor has no test — nothing runs mul -2 3. |\n\n<!-- workline:record reviewed=1111111 runs=2 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "1 test finding of the review sent to the tester: no round counted"
  agent-calls: 0
  findings: [{rule: tests-to-the-tester, level: info, where: "merge request 2"}]
  not-pushed: [workline/developer/3]
  forge:
    issues:
      - id: 3
        labels: ["workline:ready", "workline:developing"]
    merge-requests:
      - id: 1
        comment-contains: ["sends the review's test findings on pull request 2 to the tester", "1 posted now"]
        threads:
          - {path: tests/test_mul_by_zero.sh, line: 4, contains: ["workline:objection", "- kind: missing", "on pull request 2, `lib.sh:2`", "mul of a negative factor has no test"]}
      - id: 2
        comment-contains: ["sent to its Draft !1, no round counted", "\"tester\":[\"tests|lib.sh|mul of a negative factor has no test\"]", "\"review-runs\":2"]
        comment-lacks: ["\"round\":1"]
