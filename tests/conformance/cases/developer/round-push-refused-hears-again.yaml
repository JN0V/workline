case: developer/round-push-refused-hears-again
about: >
  A round whose agent ran, but whose push the forge refused (#1329): its
  record is written only once its commit landed, so a person's comment
  it read is not marked heard. The next round, the push let through,
  reads the same comment and records it heard.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
    - "printf '#!/bin/sh\\necho refused by the forge >&2\\nexit 1\\n' > ../origin.git/hooks/pre-receive && chmod +x ../origin.git/hooks/pre-receive"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"red\",\"passed\":1,\"red\":[\"test_mul_two_by_three\"]},\"round\":1,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - {body: "mul still adds: please multiply.", author: alice, insider: true}
run:
  sh: >
    workline develop --merge-request 2 --ai "fake:$FIXTURES/agents/developer-writes-mul.yaml" --forge "fake:$PWD/../forge.json" --json > first.json;
    grep -c '"heard"' ../forge.json;
    rm ../origin.git/hooks/pre-receive && git fetch -q origin && git reset -q --hard origin/workline/developer/3 &&
    workline develop --merge-request 2 --ai "fake:$FIXTURES/agents/developer-writes-mul.yaml" --forge "fake:$PWD/../forge.json" --json > second.json;
    echo "second $?"
expect:
  stdout: ["0\nsecond 0"]
  files:
    first.json: {contains: "\"agent-calls\": 1", lacks: "its fix pushed"}
    second.json: {contains: "round 2 of 5 on merge request 2, its fix pushed"}
    ../forge.json: {contains: "heard"}
