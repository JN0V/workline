case: developer/pr-bounds-blocks-tester-record-unread
about: >
  The bounds on the pull request (ADR-0058, step 1) never pass on frozen
  tests they cannot read (principle 12): the tester's Draft for the
  issue holds no record the engine can read; the check blocks,
  frozen-tests-unknown, the Draft named.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && printf '. ./lib.sh\\n[ 1 ]\\n' > tests/test_mul_by_zero.sh && git add -A && git commit -qm 'feat: mul for #3' -m 'Workline-Role: developer' && git checkout -q main"
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen, but no record."]
      - id: 2
        branch: workline/developer/3
        base: main
        title: "Multiply two numbers"
        body: "Closes #3"
run: {develop: [--bounds, --merge-request, "2"], ai: none}
expect:
  status: block
  agent-calls: 0
  findings:
    - {rule: frozen-tests-unknown, where: "merge request 1"}
