case: developer/merge-normal-holds-fix-reviewed-before-head
about: >
  A review of an older commit is no review of the head (ADR-0065,
  change 2): at `normal`, the developer's pull request for #3, an issue
  labelled `bug`, is workline's own, its bug reproduced, its head's
  verdict passed, no finding open; but the reviewer's summary names a
  commit before its head: what was pushed since, nobody read. It waits
  for a review of its head or a person's yes, said once on it.
given:
  repo: tested-draft
  config: {merge: {autonomy: normal}}
  setup:
    - "git checkout -q -b workline/developer/3 && GIT_COMMITTER_NAME=workline-bot git commit -q --amend --no-edit && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_COMMITTER_NAME=workline-bot git commit -qam 'fix: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main"
  forge:
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    issues:
      - id: 3
        title: "mul gives a sum"
        labels: ["bug", "workline:developing"]
        body: "## Need\n\nmul 2 3 gives 5.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        author: workline-bot
        bot: true
        title: "mul gives a sum"
        body: "Closes #3"
        labels: []
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z", by: workline-bot}]
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"from\":\"workline/tester/issue-3\",\"acceptance\":[\"tests.test_mul_two_by_three\",\"tests.test_mul_by_zero\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:at head=1111111111111111111111111111111111111111 run=7 -->\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: waits-for-a-yes, where: "#2", message: "a fix: its issue labelled `bug`, but the reviewer's verdict is on 1111111, not on its head 4feb95c"}
  no-findings: [{rule: auto-merge-on}, {rule: merged-at-once}]
  not-pushed: [workline/developer/3]
  summary-file: ["none accepted into main"]
  forge:
    merge-requests:
      - {id: 2, auto-merge: false, labels: [], comment-contains: ["Waiting for a person's yes", "not on its head 4feb95c", "workline:merge-waits=unreviewed"]}
    statuses:
      - {commit: "workline/developer/3", name: workline/accepted, absent: true}
