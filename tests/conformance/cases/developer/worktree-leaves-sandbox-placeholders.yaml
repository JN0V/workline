case: developer/worktree-leaves-sandbox-placeholders
about: >
  A sandbox denying writes to a path absent from the worktree binds an
  empty file over it, and leaves it there: Claude Code's, around the
  commands its agent runs, plants .env*, package.json and 15 more (#745).
  An empty file the worktree adds is no code: the worktree's diff leaves
  it out, refused nowhere, never pushed.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  env: {EDIT: placeholders}
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-edits-worktree.sh"'}
expect:
  status: pass
  summary: "took #2; proven green, its pull request ready"
  agent-calls: 1
  no-findings: [{rule: outside-scope}]
  pushed:
    workline/developer/2:
      lib.sh: "mul()"
      tests/test_mul.sh: "mul 2 3"
  pushed-lacks:
    workline/developer/2:
      .env: ""
      .env.test: ""
      .env.test.local: ""
      package.json: ""
