case: developer/red-opens-draft
about: >
  A test red on the developer's code (ADR-0054, step 3): its pull
  request opens as a Draft, which wakes no agent, closing the issue so
  the pick skips it while it is open, its Verification naming each test
  red. The proof is kept in the claim's record, for the auditor
  (ADR-0046).
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul-wrong"}
expect:
  status: pass
  summary: "took #3; a Draft: red"
  agent-calls: 1
  findings: [{rule: proof-red, level: warn, where: "#3", message: "2 tests red on its code: tests.test_mul_by_zero, tests.test_mul_two_by_three"}]
  no-findings: [{rule: proof-green}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    issues:
      - id: 3
        comment-contains: ['"proof":{"result":"red","command":"sh run-tests.sh {report}","passed":1,"red":["tests.test_mul_by_zero","tests.test_mul_two_by_three"]}']
    merge-requests:
      - id: 2
        branch: workline/developer/3
        draft: true
        body-contains: ["Closes #3", "**a Draft**", "1 passed, 2 red.", "red: `tests.test_mul_two_by_three`"]
