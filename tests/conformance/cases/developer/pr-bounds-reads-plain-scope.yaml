case: developer/pr-bounds-reads-plain-scope
about: >
  A Scope's paths in plain words are the Scope's when the repository
  holds them (#901): `lib.sh`, written without backticks, is in it. A
  word in backticks with a slash whose first folder the repository lacks
  is not a path: `dorny/paths-filter`, an Action the Scope names, holds
  nothing, so a file the branch adds there is beyond the Scope, said,
  never refused (ADR-0065, change 2).
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && mkdir dorny && printf 'x\\n' > dorny/paths-filter && git add -A && git commit -qm 'feat: mul for #3' -m 'Workline-Role: developer' && git checkout -q main"
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\nlib.sh, a mul function beside add, the way `dorny/paths-filter` tells what changed.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        base: main
        title: "Multiply two numbers"
        body: "Closes #3"
run: {develop: [--bounds, --merge-request, "2"], ai: none}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: beyond-scope, level: info, where: dorny/paths-filter}
  no-findings: [{rule: beyond-scope, where: lib.sh}]
