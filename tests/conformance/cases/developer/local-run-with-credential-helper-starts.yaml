case: developer/local-run-with-credential-helper-starts
about: >
  The forge guards the project, not the agent's environment (ADR-0058,
  principle 6): on a person's machine git hands a credential, a helper
  and a header as nearly every machine has. The engine refuses nothing:
  its agent starts with the person's rights, its code is pushed, and the
  forge's guards decide what merges.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git config credential.helper store"
    - "git config http.https://github.com/.extraheader 'AUTHORIZATION: basic eC1hY2Nlc3MtdG9rZW46cGxhbnRlZA=='"
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-edits-worktree.sh"'}
expect:
  status: pass
  agent-calls: 1
  stdout-lacks: ["eC1hY2Nlc3MtdG9rZW46cGxhbnRlZA"]
  pushed:
    workline/developer/2:
      lib.sh: "mul()"
