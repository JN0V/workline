case: developer/gate-finding-of-an-older-head-waits
about: >
  The gates' report names an older head than its branch's: a round just
  pushed its fix, the gates have not run on it yet. Their findings are
  not asked: the report on the new head wakes the next round.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\nNo finding on the commits reviewed.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
          - "### Gates: 1 new finding\n\nOn `2222222`, only what this change adds since `1111111` counts; what was there before is counted, not shown.\n\n| Gate | Check | New | Before it |\n|---|---|---|---|\n| `lint` | `shellcheck` | 1 | 0 |\n\n- **`SC2003`** (`shellcheck`), 1 new: `lib.sh:2`. mul adds where it should multiply\n\n<!-- workline:sticky=gates/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "nothing new since its last round"
  agent-calls: 0
