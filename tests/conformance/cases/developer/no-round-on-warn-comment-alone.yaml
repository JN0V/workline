case: developer/no-round-on-warn-comment-alone
about: >
  The only blocking verdict on the developer's pull request was read on
  an older head, and its round has run on it. The warn lenses now comment
  on the new head: their run counts as a reviewer run, yet it brings no
  verdict on the new head. No round starts: no agent is called, the
  stale finding is not sent again.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"round\":1,\"review-runs\":1,\"review-at\":\"1111111111111111111111111111111111111111\",\"seen\":[\"correctness|lib.sh|mul adds its operands\"],\"rounds\":[{\"n\":1,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply.\"],\"result\":\"green\"}]} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **blocks** | correctness | `lib.sh:2` | Important: mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply. |\n\n<!-- workline:at head=1111111111111111111111111111111111111111 run=7 -->\n<!-- workline:findings [{\"lens\":\"correctness\",\"holds\":\"blocks\",\"where\":\"lib.sh:2\",\"severity\":\"Important\",\"text\":\"mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply.\"}] -->\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
          - "**workline reviewer, the lenses that warn** — nothing yet.\n\n<!-- workline:record reviewed= runs=1 -->\n\n<!-- workline:sticky=reviewer/warn -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  agent-calls: 0
  not-pushed: [workline/developer/3]
