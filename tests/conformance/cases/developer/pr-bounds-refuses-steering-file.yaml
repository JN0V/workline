case: developer/pr-bounds-refuses-steering-file
about: >
  The bounds on the pull request (ADR-0058, step 1): a developer's branch
  adding AGENTS.md, a file that steers agents, blocks, steering-file,
  whatever the Scope; a CI workflow blocks too, gate-file.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && printf 'Be terse.\\n' > AGENTS.md && mkdir -p .github/workflows && printf 'on: push\\n' > .github/workflows/x.yml && git add -A && git commit -qm 'feat: mul for #3' -m 'Workline-Role: developer' && git checkout -q main"
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        title: "Multiply two numbers"
        body: "Closes #3"
run: {develop: [--bounds, --merge-request, "2"], ai: none}
expect:
  status: block
  agent-calls: 0
  findings:
    - {rule: steering-file, where: AGENTS.md, message: "a file that steers agents"}
    - {rule: gate-file, where: .github/workflows/x.yml}
