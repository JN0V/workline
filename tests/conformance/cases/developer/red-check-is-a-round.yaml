case: developer/red-check-is-a-round
about: >
  A project's check red on the developer's pull request is a round, like
  a gate's finding (#917): its `test` check failed at its branch's head,
  every project check there done, and neither the reviewer nor the gates
  have anything new. The round asks it, the end of its failed steps' log
  in its task, fixes it within the issue's bounds and pushes the fix.
  workline's own checks are not asked. Its record keeps the head the
  checks were read at: the same head is not asked twice.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    head-checks:
      workline/developer/3:
        - {name: test, workflow: test, state: failure, job: 41, log: "2026-11-02T22:28:54.3390482Z ##[group]Run sh run-tests.sh\n2026-11-02T22:34:56.3602416Z --- FAIL: test_mul_two_by_three (0.01s)\n2026-11-02T22:34:56.3603400Z     mul 2 3: want 6, got 5\n2026-11-02T22:34:56.4395746Z ##[error]Process completed with exit code 1.\n"}
        - {name: lint, workflow: test, state: success, job: 42}
        - {name: judge, workflow: workline, state: failure, job: 43, log: "the reviewer's own run failed"}
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\nNo finding on the commits reviewed.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "round 1 of 5 on merge request 2, its fix pushed, the tests green"
  agent-calls: 1
  pushed:
    workline/developer/3:
      lib.sh: "$1 * $2"
  run-files:
    in/task.md:
      contains: ["Review round 1 of 5", "a project check `test`: red at `", "--- FAIL: test_mul_two_by_three (0.01s)", "mul 2 3: want 6, got 5", "##[error]Process completed with exit code 1."]
      not-contains: ["`judge`", "the reviewer's own run failed", "2026-11-02T22", "##[group]"]
  forge:
    merge-requests:
      - id: 2
        comment-contains: ["review round 1 of 5: its fix pushed", "a project check `test`: red at `", "\"checks-at\":\"", "\"seen\":[\"checks|test\"]"]
