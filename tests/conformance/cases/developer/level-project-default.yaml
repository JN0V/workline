case: developer/level-project-default
about: >
  The project's default level (ADR-0060, §3): `autonomy: enterprising`
  at the top, the developer setting none of its own, runs at
  enterprising — eight review rounds alone before its issue is blocked
  for a person — and its task says the level is the project's default.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  config:
    autonomy: enterprising
    roles:
      tester: {settings: {test-command: "sh run-tests.sh {report}"}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  run-files:
    in/task.md: {contains: ["- Autonomy: enterprising (project default): 8 review rounds on your pull request, then its issue is blocked for a person."]}
