case: developer/objects-again-on-another-line
about: >
  An objection the developer made to a frozen test, answered and still
  open on its line, does not silence the next one (#899): a later round's
  objection to the same test, on another line, opens its own comment
  there. The developer's comment counts what was posted.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
        threads:
          - id: "7"
            path: tests/test_mul_by_zero.sh
            line: 2
            author: builder
            body: "workline:objection\n- test: tests/test_mul_by_zero.sh\n- scenario: By zero\n- kind: wrong\n- why: an earlier word\n\n<!-- workline:line=objection-tests/test_mul_by_zero.sh -->"
            replies:
              - body: "**Kept**: the scenario names the value 0, which the test checks.\n\n<!-- workline:tester-answer -->"
run: {develop: [], ai: "fake:developer-objects"}
expect:
  status: pass
  agent-calls: 1
  forge:
    merge-requests:
      - id: 1
        comment-contains: ["The developer** objects to the tester's tests of #3", "1 posted now"]
        comment-lacks: ["still open from before"]
        threads:
          - {path: tests/test_mul_by_zero.sh, line: 2, contains: ["an earlier word"]}
          - {path: tests/test_mul_by_zero.sh, line: 4, contains: ["workline:objection", "- why: The scenario asks for 0"]}
