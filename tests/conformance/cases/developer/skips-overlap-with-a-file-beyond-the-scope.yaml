case: developer/skips-overlap-with-a-file-beyond-the-scope
about: >
  A file the developer changed beyond an issue's Scope holds it too
  (ADR-0065, change 2): #1's Scope names src/lib.sh, its pull request
  lists go.mod under Beyond the Scope. #2, whose Scope names go.mod, is
  passed over as overlapping #1; #3, clear, is taken. The held pull
  request's whole diff is #1256's.
given:
  repo: tested
  forge:
    issues:
      - {id: 1, title: "Add", labels: ["workline:ready", "workline:developing"], body: "## Need\n\nI want to add.\n\n## Scope\n\n- `src/lib.sh`: `add`.\n"}
      - {id: 2, title: "Bump", labels: ["workline:ready"], body: "## Need\n\nI want the module bumped.\n\n## Scope\n\n- `go.mod`: the version.\n"}
      - {id: 3, title: "Document", labels: ["workline:ready"], body: "## Need\n\nI want it said.\n\n## Scope\n\n- `docs/usage.md`.\n"}
    merge-requests:
      - {id: 4, branch: workline/developer/1, title: "feat: add", body: "Closes #1\n\n## Changes\n\n- Code: `src/lib.sh`, `go.mod`.\n\n## Beyond the Scope\n\nFiles changed beyond the issue's Scope, the product owner's hint, each with its agent's reason: the reviewer's intent lens judges each.\n\n- `go.mod`: add needs a newer module\n\n## Verification\n\n- proven\n"}
run: {develop: [], ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "took #3"
  agent-calls: 1
  forge:
    issues:
      - {id: 2, labels: ["workline:ready"], comment-contains: ["its Scope's `go.mod` overlaps #1's, taken"]}
      - {id: 3, labels: ["workline:developing"]}
