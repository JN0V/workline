case: developer/claude-not-done-list-posted
about: >
  A "Not done:" note written as a list, its parts `- part: why`, holds
  no kind the developer writes: never read as proposals and refused,
  its words posted whole on the pull request.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  env:
    PATH: "$FIXTURES/claude:$PATH"
    ANSWER: 'Not done:\n- negatives: the issue does not say their sign\n- the CI job: only a person changes it'
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: claude}
expect:
  status: pass
  summary: "took #3; proven green, its pull request ready"
  agent-calls: 1
  findings:
    - {rule: agent-words-unread}
  no-findings: [{rule: agent-invalid-output}, {rule: no-code}, {rule: intention-refused}, {rule: answer-mended}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - id: 2
        draft: false
        body-contains: ["## Its agent's words", "- negatives: the issue does not say their sign"]
