case: developer/no-acceptance-test-applied-said-in-its-pull-request
about: >
  An issue the tester handed over because no acceptance test applies: it
  is ready, its tester's comment recording that no test applies and why,
  and no tester's Draft is open. The developer does not wait for a Draft:
  it builds the issue with no frozen test, and its pull request, closing
  the issue, says that no acceptance test applied.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
        comments: ["**The tester** finds that no acceptance test applies to this issue.\n\n<!-- workline:tester-proof {\"kind\":\"none\",\"reason\":\"the multiply step's code is not in the task: no test can be written from it.\"} -->\n<!-- workline:sticky=tester/issue -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  agent-calls: 1
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - id: 1
        branch: workline/developer/3
        body-contains: ["Closes #3", "no acceptance test applied"]
