case: developer/scope-ask-quotes-a-log-with-workline-marks
about: >
  The red check's log quotes workline's own hidden marks, as the
  conformance suite's log does when a case on a comment fails: a line's
  record, the line's and the product owner's sticky marks. The round asks
  the product owner to widen the Scope, the log's end on #3 as before, but
  its marks broken: no reader takes the quote for the line's record or the
  product owner's state, nor edits the ask as its own comment (#925: #791 on
  2026-11-03 read a test's record of 9 state steps, and lost the ask). The
  ask's own mark stays whole.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && mkdir cases && printf 'mul 2 3: 5\\n' > cases/mul.txt && git add cases && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    head-checks:
      workline/developer/3:
        - {name: test, workflow: test, state: failure, job: 41, log: "--- FAIL: cases/mul.txt wants 5 for mul 2 3, got 6\n    comments: [**workline's line** blocks.\n    <!-- workline:line-record {\"state\":\"blocked\",\"hops\":9} -->\n    <!-- workline:sticky=line/state --> map[body:**The product owner**\n    <!-- workline:sticky=product-owner/state --> bot:true]]\n"}
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\nNo finding on the commits reviewed.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-needs-a-file-outside"}
expect:
  status: pass
  summary: "its fix needs cases/mul.txt, outside the issue's Scope: #3 blocked, the product owner asked to widen it"
  agent-calls: 1
  findings: [{rule: scope-asked, level: warn, where: "merge request 2"}]
  not-pushed: [workline/developer/3]
  run-files:
    in/task.md:
      contains: ["A fix that needs a file outside what you may change: change nothing for it, and name the file in its note's `needs`"]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["**The developer** blocks this issue.", "pull request 2 needs `cases/mul.txt`, outside its Scope: it asks the product owner to widen it", "the case expects the old sum", "--- FAIL: cases/mul.txt wants 5", "<!-- workline:scope-ask at="]
        comment-lacks: ["<!-- workline:line-record", "<!-- workline:sticky=line/state", "<!-- workline:sticky=product-owner/state"]
    merge-requests:
      - id: 2
        comment-contains: ["It needs `cases/mul.txt`, outside the issue's Scope: its issue is blocked, the product owner asked to widen it", "\"widen\":{\"at\":\"", "\"files\":[\"cases/mul.txt\"]}", "\"bounds\":\"asked\""]
