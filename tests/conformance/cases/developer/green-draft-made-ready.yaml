case: developer/green-draft-made-ready
about: >
  The developer's Draft, opened red, is marked ready for review once
  every project check at its branch's head is green, no cap reached
  (#969): as a pull request proven green at first opens ready. Its
  rounds made it green; nothing new is asked, so the round asks no
  agent, marks it ready and says so on it: the reviewer and the merge
  policy take it from there. workline's own checks are not read.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  forge:
    head-checks:
      workline/developer/3:
        - {name: test, workflow: test, state: success, job: 41}
        - {name: lint, workflow: test, state: success, job: 42}
        - {name: judge, workflow: workline, state: pending, job: 43}
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        draft: true
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"round\":1,\"review-runs\":1,\"rounds\":[{\"n\":1,\"result\":\"green\"}]} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "every project check green at its head, no cap reached: merge request 2 marked ready for review"
  agent-calls: 0
  forge:
    merge-requests:
      - id: 2
        draft: false
        comment-contains: ["**The developer**: every project check green at `", "marked ready for review"]
