case: developer/scope-person-only-path-part-of
about: >
  The issue's Scope names a CI workflow, a path only a person changes;
  its agent writes the code and leaves the workflow, as it must. The
  pull request is part of #3, never closing it, the workflow named on
  top, Left for a person: merged, the issue stays open for it.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply, checked in CI.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n- `.github/workflows/ci.yml`: a step that runs the tests.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  agent-calls: 1
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - id: 2
        branch: workline/developer/3
        draft: false
        body-contains: ["Part of #3\n\n## Left for a person", "- `.github/workflows/ci.yml`: in the issue's Scope, only a person changes it.", "The developer's code for part of #3"]
        body-lacks: ["Closes #3", "proven on the project's tests"]
