case: developer/merge-normal-admits-developer-fix
about: >
  A developer fix merges by the policy (ADR-0054, step 7): at `normal`,
  the developer's pull request for #3, an issue labelled `bug`, is
  workline's own — opened and pushed by its App, every commit the App's,
  the tester's or the developer's by its `Workline-Role` trailer, its
  record on it naming #3 —, its head's verdict passed, no finding of the
  reviewer's open but a nit. The kind is the issue's label, never the
  agent's say: a fix needs no person's yes. `workline follow` sets
  `workline/accepted` on its head, records on it that it merges with no
  person's yes, as `code`, and why, for the auditor (ADR-0046), and
  turns auto-merge on (ADR-0042).
given:
  repo: tested-draft
  config: {merge: {autonomy: normal}}
  setup:
    - "git checkout -q -b workline/developer/3 && GIT_COMMITTER_NAME=workline-bot git commit -q --amend --no-edit && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_COMMITTER_NAME=workline-bot git commit -qam 'fix: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main"
  forge:
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    issues:
      - id: 3
        title: "mul gives a sum"
        labels: ["bug", "workline:developing"]
        body: "## Need\n\nmul 2 3 gives 5.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        author: workline-bot
        bot: true
        title: "mul gives a sum"
        body: "Closes #3"
        labels: []
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z", by: workline-bot}]
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | naming | `lib.sh:2` | Nit: a one-letter name. |\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: auto-merge-on, where: "#2", message: "with no person's yes, workline's own code — the developer's code for #3, a fix: its issue labelled `bug` —"}
  no-findings: [{rule: waits-for-a-yes}, {rule: merge-app-unknown}]
  not-pushed: [workline/developer/3]
  summary-file: ["accepted into main, #2", "auto-merge turned on for 1"]
  forge:
    merge-requests:
      - {id: 2, auto-merge: true, labels: [], comment-contains: ["Merging with no person's yes", "workline's own code", "a fix: its issue labelled `bug`", "workline:merge-alone=code"]}
    statuses:
      - {commit: "workline/developer/3", name: workline/accepted, state: success, by: workline-bot, description: "with no person's yes: workline's own code"}
