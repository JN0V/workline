case: developer/green-draft-capped-stays-draft
about: >
  The developer's Draft whose record holds a cap reached stays a Draft,
  every project check green all the same (#969): a cap leaves it to a
  person, as at its opening. Said in the verdict, nothing written on it.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  forge:
    head-checks:
      workline/developer/3:
        - {name: test, workflow: test, state: success, job: 41}
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        draft: true
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"caps\":[{\"setting\":\"ai-max-turns\",\"spent\":301,\"allows\":300}],\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-nothing"}
expect:
  status: pass
  agent-calls: 0
  findings: [{rule: draft-kept, level: info, where: "merge request 2", message: "a Draft kept: its record holds a cap reached (ai-max-turns): a person marks it ready"}]
  forge:
    merge-requests:
      - {id: 2, draft: true, comments: 2}
