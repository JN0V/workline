case: developer/objection-names-a-declared-test
about: >
  An objection names a declared test (#913, ADR-0065 change 4): the agent
  gives `test_mul_by_zero` as its scenario, not the issue's "By zero".
  The tester's record declares which test covers which scenario; the
  task lists it, and the engine posts the objection on the scenario the
  named test covers, read from that declaration, never from the test's
  name. A function's name the tester declared for nothing (`TestByZero`)
  maps to no scenario any more.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  env:
    PATH: "$FIXTURES/claude:$PATH"
    OBJECTIONS: '- test: tests/test_mul_by_zero.sh\n  line: 4\n  scenario: test_mul_by_zero\n  kind: over-specified\n  why: The scenario asks for 0, the test for an error.\n'
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **By zero:** Given 5, When it is multiplied by 0, Then it gives 0.\n- **Two by three:** Given 2, When it is multiplied by 3, Then it gives 6.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"covers\":{\"By zero\":[\"tests.test_mul_by_zero\"],\"Two by three\":[\"tests.test_mul_two_by_three\"]}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: claude}
expect:
  status: pass
  agent-calls: 1
  run-files:
    in/task.md: {contains: ["scenario: <one of: By zero | Two by three>", "Which test covers which scenario", "- By zero: `tests.test_mul_by_zero`"]}
  no-findings: [{rule: agent-words-unread}, {rule: agent-invalid-output}, {rule: not-the-developers}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  pushed-lacks:
    workline/developer/3:
      .workline/objections.yaml: "test"
  forge:
    merge-requests:
      - id: 1
        comment-contains: ["The developer** objects to the tester's tests of #3", "1 posted now"]
        threads:
          - {path: tests/test_mul_by_zero.sh, line: 4, contains: ["workline:objection", "- scenario: By zero", "- kind: over-specified"], lacks: ["- scenario: test_mul_by_zero"]}
