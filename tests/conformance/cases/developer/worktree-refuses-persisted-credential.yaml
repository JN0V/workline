case: developer/worktree-refuses-persisted-credential
about: >
  Checked, not trusted (ADR-0056, step 2, principles 6 and 7): the
  checkout persisted its token in the repository's git config, as
  actions/checkout does unless told `persist-credentials: false`. The
  agent's git would send it from the worktree: the engine does not start
  the agent, blocks and says which key holds it, never its value; the
  issue is not claimed, nothing is pushed.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git config http.https://github.com/.extraheader 'AUTHORIZATION: basic eC1hY2Nlc3MtdG9rZW46cGxhbnRlZA=='"
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-edits-worktree.sh"'}
expect:
  status: block
  summary: "a credential is in the agent's reach"
  agent-calls: 0
  findings: [{rule: credential-in-reach, where: "http.https://github.com/.extraheader", message: "persist-credentials: false"}]
  stdout-lacks: ["eC1hY2Nlc3MtdG9rZW46cGxhbnRlZA"]
  forge:
    issues:
      - {id: 2, labels: ["workline:ready"], comments: 0}
