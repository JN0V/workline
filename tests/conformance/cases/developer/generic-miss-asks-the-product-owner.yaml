case: developer/generic-miss-asks-the-product-owner
about: >
  A test the generic patterns miss (ADR-0065, change 3; #1226): no
  test-paths set, the developer's agent writes check/mul_check.sh, a test
  by the project's habits but by no pattern the engine knows. The fence
  treats it as code, outside #2's Scope: never a silent pass, never a
  hard block. The step asks the product owner for it, #2 back to refine.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: "fake:developer-writes-a-test-generic-misses"}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: outside-scope, level: warn, where: check/mul_check.sh}, {rule: scope-asked, level: warn, where: "#2"}]
  not-pushed: [workline/developer/2]
  forge:
    issues:
      - id: 2
        labels: ["workline:to-refine"]
        comment-contains: ["its code needs `check/mul_check.sh`, outside its Scope: it asks the product owner to widen it", "\"asked\":[\"check/mul_check.sh\"]"]
