case: developer/proof-runs-touched-packages
about: >
  The proof runs on the folders the change touches (#703): the
  developer's proof-command names `{packages}`, as the curator's proof
  command does, and gets the folders of its code and of the tester's
  acceptance tests that hold tests. lib.sh lies in a folder holding none;
  the acceptance tests lie in tests/: only `./tests` runs. The claim's
  record and the Verification say so, and that the pull request's own CI
  runs the whole suite.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  config:
    roles:
      tester: {settings: {test-command: "sh run-tests.sh {report}", test-paths: ["tests/test_*.sh"]}}
      developer: {settings: {proof-command: 'test "{packages}" = ./tests && sh run-tests.sh {report}'}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "took #3; proven green, its pull request ready"
  findings: [{rule: proof-green, level: info, where: "#3", message: "3 tests passed on its code, none red"}]
  forge:
    issues:
      - id: 3
        comment-contains: ['"scope":"touched","packages":["./tests"]']
    merge-requests:
      - id: 2
        branch: workline/developer/3
        draft: false
        body-contains: ["On the folders its code and the acceptance tests touch: `./tests`. This pull request's own CI runs the whole suite."]
