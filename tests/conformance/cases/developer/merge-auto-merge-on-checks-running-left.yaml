case: developer/merge-auto-merge-on-checks-running-left
about: >
  An auto-merge on whose checks still run is left to the forge (#993):
  the developer's fix for #3, its auto-merge on, a required check still
  running, the forge saying it could not merge it now. `workline follow`
  merges nothing and turns nothing off: the forge merges it once that
  check ends.
given:
  repo: tested-draft
  config: {merge: {autonomy: normal}}
  setup:
    - "git checkout -q -b workline/developer/3 && GIT_COMMITTER_NAME=workline-bot git commit -q --amend --no-edit && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_COMMITTER_NAME=workline-bot git commit -qam 'fix: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main"
  forge:
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    issues:
      - id: 3
        title: "mul gives a sum"
        labels: ["bug", "workline:developing"]
        body: "## Need\n\nmul 2 3 gives 5.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        author: workline-bot
        bot: true
        title: "mul gives a sum"
        body: "Closes #3"
        labels: []
        auto-merge: true
        auto-merge-at: "2026-01-04T09:05:00Z"
        auto-merge-by: workline-bot
        checks: pending
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z", by: workline-bot}]
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"from\":\"workline/tester/issue-3\",\"acceptance\":[\"tests.test_mul_two_by_three\",\"tests.test_mul_by_zero\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2}} -->\n<!-- workline:sticky=developer/code -->"
          - "**Merging with no person's yes**: the project's merge policy is `normal`.\n\n<!-- workline:merge-alone=code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | naming | `lib.sh:2` | Nit: a one-letter name. |\n\n<!-- workline:at head=4feb95cd88448f137d793775c4ad7b591c1ac175 run=7 -->\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  no-findings: [{rule: merged-at-once}, {rule: auto-merge-on}, {rule: waits-for-a-yes}]
  not-pushed: [workline/developer/3]
  summary-file: ["accepted into main, #2"]
  forge:
    merge-requests:
      - {id: 2, merged: false, auto-merge: true}
