case: developer/round-undoing-green-blocks
about: >
  A green pull request, a review finding whose fix turns a frozen test
  red (#987); its round's agent makes the fix, and does not object to
  the test. The fix is not pushed,
  the green head kept; nothing else would move, so the issue goes
  Blocked for a person, the red tests and the finding on it.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | intent | `lib.sh:2` | Important: mul multiplies, outside the Scope. Make it add. |\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul-wrong"}
expect:
  status: pass
  summary: "round 1 of 5 on merge request 2; its fix turns the tests red on a green head: not pushed; no objection left for the tester at this head: #3 blocked for a person"
  agent-calls: 1
  findings:
    - {rule: green-kept, level: warn, where: "merge request 2", message: "test_mul_two_by_three"}
    - {rule: green-held, level: warn, where: "merge request 2"}
  not-pushed: [workline/developer/3]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["its fix of the review turns the frozen tests red", "test_mul_two_by_three", "mul multiplies, outside the Scope"]
    merge-requests:
      - id: 2
        comment-contains: ["not pushed: the green head kept", "\"result\":\"not-pushed\"", "\"bounds\":\"blocked\""]
