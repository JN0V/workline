case: developer/objection-open-not-posted-twice
about: >
  An objection still open on its line is not posted twice (#899): a later
  round's same objection, on the same test and line, adds no comment, and
  the developer's comment says it is still open from before.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
        threads:
          - id: "7"
            path: tests/test_mul_by_zero.sh
            line: 4
            author: builder
            body: "workline:objection\n- test: tests/test_mul_by_zero.sh\n- scenario: By zero\n- kind: over-specified\n- why: The scenario asks for 0.\n\n<!-- workline:line=objection-tests/test_mul_by_zero.sh:4 -->"
run: {develop: [], ai: "fake:developer-objects"}
expect:
  status: pass
  agent-calls: 1
  forge:
    merge-requests:
      - id: 1
        comment-contains: ["The developer** objects to the tester's tests of #3", "1 still open from before, not posted again"]
        comment-lacks: ["posted now"]
        threads:
          - {path: tests/test_mul_by_zero.sh, line: 4}
