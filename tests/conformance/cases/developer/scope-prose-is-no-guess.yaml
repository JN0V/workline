case: developer/scope-prose-is-no-guess
about: >
  Only a line `Guessed:` marks a Scope a guess (#970): its words saying
  no code was given are English prose, which the engine no longer reads
  (ADR-0065, change 2; #1228). #2's `src/` overlaps #1's, taken: #2
  waits on it.
given:
  repo: tested
  forge:
    issues:
      - {id: 1, title: "Add", labels: ["workline:ready", "workline:developing", "enhancement"], body: "## Need\n\nI want to add.\n\n## Scope\n\n- `src/lib.sh`: `add`.\n"}
      - {id: 2, title: "Multiply", labels: ["workline:ready", "bug"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\nThe `mul` function (`src/`). The paths come from the error text, because no `mul` code was given in this run.\n"}
    merge-requests:
      - {id: 4, branch: workline/developer/1, title: "feat: add", body: "Closes #1"}
run: {develop: [], ai: "fake:developer-nothing"}
expect:
  status: pass
  forge:
    issues:
      - {id: 2, labels: ["workline:ready", "bug"], comment-contains: ["**The developer** waits on this issue.", "overlaps #1's, taken"]}
