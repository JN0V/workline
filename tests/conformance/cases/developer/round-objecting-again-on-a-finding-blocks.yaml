case: developer/round-objecting-again-on-a-finding-blocks
about: >
  A round objected to a frozen test at this head on a review finding, no
  check red, its issue waiting for the tester (#987); the tester kept
  the test. Its answer is news: the finding is asked again at the same
  head, the tester's answer named. Its agent objects again and writes
  no fix: no second wait at the same head, so the issue goes Blocked
  for a person rather than waiting in Doing with nothing asked.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
    - "sed -i \"s/@head@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
        threads:
          - id: "7"
            path: tests/test_mul_by_zero.sh
            line: 4
            body: "workline:objection\n- test: tests/test_mul_by_zero.sh\n- scenario: By zero\n- kind: contradicts\n- why: The test expects 5 where the scenario asks for the product."
            replies:
              - created: "2026-01-06T10:00:00Z"
                body: |
                  **Kept**: the scenario names the value 0, which the test checks.
                  <!-- workline:tester-act {"act":"kept","at":"tests-written","scenario":{"name":"By zero","text":"Given the library, When I multiply 5 by 0, Then I get 0."},"test":"tests/test_mul_by_zero.sh"} -->

                  <!-- workline:tester-answer -->
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"review-runs\":1,\"round\":1,\"rounds\":[{\"n\":1,\"asked\":[\"warns intent `lib.sh:2`: Important: mul multiplies, outside the Scope.\"],\"result\":\"not-pushed\",\"bounds\":\"objected\"}],\"widen\":{\"at\":\"@head@\",\"scope\":\"x\",\"objected\":true,\"review\":true}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| warns | intent | `lib.sh:2` | Important: mul multiplies, outside the Scope. Make it add. |\n\n<!-- workline:findings [{\"lens\":\"intent\",\"holds\":\"warns\",\"where\":\"lib.sh:2\",\"severity\":\"Important\",\"text\":\"mul multiplies, outside the Scope. Make it add.\"}] -->\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-objects-no-fix"}
expect:
  status: pass
  summary: "round 2 of 5 on merge request 2; objected again at this head after the tester's answer: #3 blocked for a person"
  agent-calls: 1
  findings: [{rule: objection-held, level: warn, where: "merge request 2"}]
  no-findings: [{rule: objected}]
  not-pushed: [workline/developer/3]
  run-files:
    in/task.md: {contains: ["the tester kept `tests/test_mul_by_zero.sh`", "mul multiplies, outside the Scope"]}
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["objected again at this head, after the tester's answer", "the tester kept `tests/test_mul_by_zero.sh`"]
    merge-requests:
      - id: 2
        comment-contains: ["objected again at this head after the tester's answer", "\"bounds\":\"blocked\""]
