case: developer/round-given-back-counts-its-rounds-afresh
about: >
  The rounds start afresh: the developer handed its pull request 2 to
  a person after its fifth round, and the person gave it back (its
  issue #3 is not blocked). The round that runs is round 1 of 5, not
  a second hand-off: the record counts it as round 1.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"red\",\"passed\":1,\"red\":[\"test_mul_two_by_three\"]},\"round\":5,\"review-runs\":6,\"seen\":[\"correctness|lib.sh|mul adds its operands\"],\"rounds\":[{\"n\":1,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands\"]},{\"n\":2,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands\"]},{\"n\":3,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands\"]},{\"n\":4,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands\"]},{\"n\":5,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands\"]},{\"n\":6,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands\"],\"person\":true}],\"handed\":true} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **blocks** | correctness | `lib.sh:2` | Important: mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply. |\n\n<!-- workline:findings [{\"lens\":\"correctness\",\"holds\":\"blocks\",\"where\":\"lib.sh:2\",\"severity\":\"Important\",\"text\":\"mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply.\"}] -->\n<!-- workline:record reviewed=1111111 runs=7 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "round 1 of 5 on merge request 2, its fix pushed, the tests green"
  agent-calls: 1
  run-files:
    in/task.md: {contains: ["Review round 1 of 5", "mul adds its operands"]}
  forge:
    merge-requests:
      - id: 2
        comment-contains: ["review round 1 of 5: its fix pushed, the project's tests green", "\"round\":1,", "workline:sticky=developer/code"]
        comment-lacks: ["\"handed\":true"]
