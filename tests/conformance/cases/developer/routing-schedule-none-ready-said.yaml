case: developer/routing-schedule-none-ready-said
about: >
  A scheduled run that finds no ready issue to take says so in the
  line's summary and passes, the agent not asked, nothing claimed: the
  night leaves a line a person, and the auditor, can read (principle
  12: said, never silent).
given:
  repo: tested
  config:
    routing: {events: {schedule: [developer]}}
  forge:
    issues:
      - {id: 1, title: "Subtract", labels: ["workline:to-refine"], body: "## Need\n\nI want to subtract.\n"}
      - {id: 2, title: "Multiply", labels: ["workline:ready"], assignees: [alice], body: "## Need\n\nI want to multiply.\n"}
run: {route: schedule, open-merge-request: true, ai: "cmd:true", summary: true}
expect:
  status: pass
  summary-file: ["no ready issue waits for the developer"]
  agent-calls: 0
  forge:
    issues:
      - {id: 1, labels: ["workline:to-refine"], comments: 0}
      - {id: 2, labels: ["workline:ready"], comments: 0}
