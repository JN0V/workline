case: developer/guessed-scope-waits-on-nothing
about: >
  A Scope its writer marked as a guess, a line `Guessed:` (#970): its
  paths are no reason to wait. #2's guessed `src/` overlaps #1's,
  taken: #2 is taken all the same.
given:
  repo: tested
  forge:
    issues:
      - {id: 1, title: "Add", labels: ["workline:ready", "workline:developing"], body: "## Need\n\nI want to add.\n\n## Scope\n\n- `src/lib.sh`: `add`.\n"}
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\nGuessed: no code was read for it.\n\n- `src/`: a `mul` function.\n"}
      - {id: 3, title: "Document", labels: ["workline:ready"], body: "## Need\n\nI want it said.\n\n## Scope\n\n- `docs/usage.md`.\n"}
    merge-requests:
      - {id: 4, branch: workline/developer/1, title: "feat: add", body: "Closes #1"}
run: {develop: [], ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "took #2"
  forge:
    issues:
      - {id: 2, labels: ["workline:ready", "workline:developing"], comment-lacks: "waits on this issue"}
