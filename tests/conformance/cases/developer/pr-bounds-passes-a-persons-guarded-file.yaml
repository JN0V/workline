case: developer/pr-bounds-passes-a-persons-guarded-file
about: >
  A person's guarded file on the line's own pull request: a
  workline/developer/3 branch holds the agent's commit on the Scope's
  file, and a commit a person made on docs/policy.md, a path CODEOWNERS
  lists. The agent's commit carries workline's App identity and trailer;
  the person's, neither. The bounds do not block on the person's file,
  and the check says a person wrote it.
given:
  repo: tested-draft
  setup:
    - "git checkout -q main && mkdir -p docs && printf 'Review every change.\\n' > docs/policy.md && printf '/CODEOWNERS @owner\\n/docs/policy.md @owner\\n' > CODEOWNERS && git add -A && git commit -qm 'chore: what never merges alone'"
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_AUTHOR_NAME='workline-jn0v[bot]' GIT_AUTHOR_EMAIL='1+workline-jn0v[bot]@users.noreply.github.com' GIT_COMMITTER_NAME='workline-jn0v[bot]' GIT_COMMITTER_EMAIL='1+workline-jn0v[bot]@users.noreply.github.com' git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer'"
    - "echo 'Name each scenario.' >> docs/policy.md && GIT_AUTHOR_NAME='A Person' GIT_AUTHOR_EMAIL='person@example.invalid' GIT_COMMITTER_NAME='A Person' GIT_COMMITTER_EMAIL='person@example.invalid' git commit -qam 'docs: the policy as its owner wants it' && git checkout -q main"
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        title: "Multiply two numbers"
        body: "Closes #3"
run: {develop: [--bounds, --merge-request, "2"], ai: none}
expect:
  status: pass
  agent-calls: 0
  no-findings: [{rule: steering-file, where: docs/policy.md}, {rule: gate-file}]
  forge:
    merge-requests:
      - id: 2
        comment-contains: ['"act":"bounds"', "a person wrote"]
