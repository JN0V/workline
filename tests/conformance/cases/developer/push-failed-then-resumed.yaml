case: developer/push-failed-then-resumed
about: >
  A developer run that committed its code on its branch, then failed to
  push it, is resumed (`workline apply`): the code already on the branch
  is pushed as it is, its pull request opened. Nothing new to commit is
  said, never a failure on git's "nothing to commit" (#739).
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
    - "printf '#!/bin/sh\\n[ -e refused-once ] && exit 0\\ntouch refused-once\\necho the remote refuses this push once >&2\\nexit 1\\n' > ../origin.git/hooks/pre-receive && chmod +x ../origin.git/hooks/pre-receive"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul", then: resume}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: already-committed, level: info, where: workline/developer/3}]
  no-findings: [{rule: engine-error}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - id: 2
        branch: workline/developer/3
        draft: false
        title: "feat: multiply two numbers"
        body-contains: ["Closes #3"]
