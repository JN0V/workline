case: developer/code-build-broken-asked-again
about: >
  The developer's code that does not build is the agent's to mend
  (#1083): its lib.sh leaves a brace out, the project's runner reports
  the tests that built and fails, no test red. As for the tester's test
  that does not build, the agent is asked once more with the error; its
  second answer builds, green: its pull request opens ready, never a
  Draft red for a typo.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  config:
    roles:
      tester:
        settings:
          # A build first, as a compiled project's runner has: a lib.sh
          # that does not parse reports the tests that built, and fails.
          test-command: >-
            sh -n lib.sh || { printf '<testsuites><testsuite name="tests"><testcase classname="tests" name="test_add" time="0.01"/></testsuite></testsuites>' > {report}; exit 1; }; sh run-tests.sh {report}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "cmd:sh $FIXTURES/agents/developer-writes-mul-broken-once.sh"}
expect:
  status: pass
  summary: "took #3; proven green, its pull request ready"
  agent-calls: 2
  run-files:
    out/feedback.md: {contains: ["build-broken", "its code does not build"]}
  no-findings: [{rule: proof-red}]
  pushed:
    workline/developer/3:
      lib.sh: "mul() { echo $(($1 * $2)); }"
  forge:
    merge-requests:
      - {id: 2, branch: workline/developer/3, draft: false}
