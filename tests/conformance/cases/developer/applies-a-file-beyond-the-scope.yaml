case: developer/applies-a-file-beyond-the-scope
about: >
  The Scope is a hint, not a fence (ADR-0065, change 2; #1228): the
  developer's agent writes #2's mul in lib.sh, its test, and a line of
  README.md, which #2's Scope does not name. Every patch is applied; the
  pull request lists README.md under Beyond the Scope, its agent's reason
  missing said, for the reviewer's intent lens. Nothing refused.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: "fake:developer-outside-scope"}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: beyond-scope, level: info, where: "#2", message: "README.md"}]
  no-findings: [{rule: outside-scope}, {rule: scope-asked}]
  pushed:
    workline/developer/2:
      lib.sh: "mul()"
      tests/test_mul.sh: "mul 2 3"
      README.md: "It multiplies now"
  forge:
    issues:
      - id: 2
        labels: ["workline:developing"]
        comment-lacks: ["Refused at apply", "workline:scope-ask"]
    merge-requests:
      - id: 1
        branch: workline/developer/2
        body-contains: ["## Beyond the Scope", "- `README.md`: no reason given by its agent"]
        body-lacks: ["`README.md`; the product owner adds"]
