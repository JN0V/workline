case: developer/unopened-gives-claim-back
about: >
  Its pull request does not open (#856): here its code, written on the
  tester's Draft, conflicts with what main changed since in the same
  lines. The claim is given back at once, the reason in the claim's own
  comment, its record counting the failure: the next run takes the
  issue again, once. The working tree is left as it was: its code was
  written apart, never in the checkout (#1372).
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
    - "printf 'add() { echo $(($1 + $2)); }\\nsub() { echo $(($1 - $2)); }\\n' > lib.sh && git commit -q -am 'feat: subtract' && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: block
  summary: "its merge request did not open"
  findings: [{rule: not-opened, where: workline/developer/3, message: "conflicts with what the base changed since in lib.sh"}]
  no-findings: [{rule: engine-error}]
  not-pushed: [workline/developer/3]
  files:
    lib.sh: {contains: "sub()", lacks: "mul()"}
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        comments: 1
        comment-contains: ["**The developer** gives this issue back.", "- **Why**: its pull request did not open: `", "lib.sh", "takes it again at a next run, once", "\"unopened\":1"]
        comment-lacks: ["takes this issue", "{why}"]
    merge-requests:
      - id: 2
        absent: true
