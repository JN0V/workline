case: developer/claude-objection-in-file
about: >
  An objection goes in a file, not in prose (#746): the question names
  the worktree's objections file and its shape; claude writes it there.
  The engine reads it, posts the objection on the test's line of the
  tester's Draft, and takes the file out of the diff: it reaches no
  branch, and no bound refuses it.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  env:
    PATH: "$FIXTURES/claude:$PATH"
    OBJECTIONS: '- test: tests/test_mul_by_zero.sh\n  line: 4\n  scenario: By zero\n  kind: over-specified\n  why: The scenario asks for 0, the test for an error.\n'
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: claude}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: agent-words-unread}, {rule: agent-invalid-output}, {rule: not-the-developers}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  pushed-lacks:
    workline/developer/3:
      .workline/objections.yaml: "test"
  forge:
    merge-requests:
      - id: 1
        comment-contains: ["The developer** objects to 1 of the tester's tests of #3"]
        threads:
          - {path: tests/test_mul_by_zero.sh, line: 4, contains: ["workline:objection", "- scenario: By zero", "- kind: over-specified"]}
