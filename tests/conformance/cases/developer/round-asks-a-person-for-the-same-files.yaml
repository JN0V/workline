case: developer/round-asks-a-person-for-the-same-files
about: >
  A Scope ask is keyed by its files, not by the head (ADR-0063, §9;
  #1073, from a trial): the product owner was asked for cases/mul.txt at
  an older head, and sent #3 back to ready without it. The round, at a
  new head, needs cases/mul.txt again: the same set, so #3 is blocked for
  a person, with no mark that wakes the product owner. A new file would
  be a new ask (round-asks-again-for-new-files).
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && mkdir cases && printf 'mul 2 3: 5\\n' > cases/mul.txt && git add cases && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    head-checks:
      workline/developer/3:
        - {name: test, workflow: test, state: failure, job: 41, log: "--- FAIL: cases/mul.txt wants 5 for mul 2 3, got 6\n"}
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"round\":1,\"review-runs\":1,\"seen\":[\"checks|test\"],\"rounds\":[{\"n\":1,\"asked\":[\"a project check `test`: red at `abc1234`\"],\"result\":\"no-code\",\"bounds\":\"asked\"}],\"checks-at\":\"0123456789abcdef0123456789abcdef01234567\",\"widen\":{\"at\":\"0123456789abcdef0123456789abcdef01234567\",\"scope\":\"503615c901c4\",\"files\":[\"cases/mul.txt\"]}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\nNo finding on the commits reviewed.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-fixes-outside-its-scope"}
expect:
  status: pass
  summary: "its fix still needs cases/mul.txt, asked already, its Scope not holding them: #3 blocked for a person"
  agent-calls: 1
  not-pushed: [workline/developer/3]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["still needs `cases/mul.txt`, outside its Scope, asked already", "a person on the loop widens the Scope"]
        comment-lacks: "workline:scope-ask"
