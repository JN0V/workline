case: developer/picks-first-ready-unassigned
about: >
  The developer's pick (ADR-0054, step 1): the first ready issue in the
  backlog's order, assigned to nobody. With an agent, the engine claims
  it, no agent asked yet: the claim label, since GitHub assigns no issue
  to an App, and a comment on it holding the record the auditor reads
  (ADR-0046) — the commit read, the issue taken. An issue not ready is
  passed over; the next ready one is left as it is.
given:
  repo: tested
  forge:
    issues:
      - {id: 1, title: "Subtract", labels: ["workline:to-refine"], body: "## Need\n\nI want to subtract.\n"}
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
      - {id: 3, title: "Divide", labels: ["workline:ready"], body: "## Need\n\nI want to divide.\n\n## Scope\n\n- `div.sh`.\n"}
run: {develop: [], ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "took #2"
  agent-calls: 1
  forge:
    issues:
      - id: 2
        labels: ["workline:ready", "workline:developing"]
        comment-contains: ["The developer", "workline:developer-act", '"act":"pick"', '"issue":2']
      - {id: 3, labels: ["workline:ready"], comments: 0}
      - {id: 1, labels: ["workline:to-refine"], comments: 0}
