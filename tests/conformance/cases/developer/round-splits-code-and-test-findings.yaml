case: developer/round-splits-code-and-test-findings
about: >
  The review asks a code finding and a test finding (#1265): the round's
  agent is asked the code finding alone, the test finding said as the
  tester's, not its to fix; the round sends it to the tester's Draft, an
  objection of kind missing, and pushes its fix of the code.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"red\"},\"round\":0,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **blocks** | correctness | `lib.sh:2` | Important: mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply. |\n| **warns** | tests | `lib.sh:2` | Important: mul of a negative factor has no test — nothing runs mul -2 3. |\n\n<!-- workline:record reviewed=1111111 runs=2 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "round 1 of 5 on merge request 2, its fix pushed, the tests green"
  agent-calls: 1
  findings: [{rule: tests-to-the-tester, level: info, where: "merge request 2"}]
  pushed:
    workline/developer/3:
      lib.sh: "$1 * $2"
  run-files:
    in/task.md:
      contains: ["## What to fix", "mul adds its operands", "## Sent to the tester, not yours", "Write no test for them"]
  forge:
    merge-requests:
      - id: 1
        threads:
          - {path: tests/test_mul_by_zero.sh, line: 4, contains: ["- kind: missing", "mul of a negative factor has no test"]}
      - id: 2
        comment-contains: ["review round 1 of 5", "Sent to the tester, its to add or to hold needless", "\"tester\":[\"tests|lib.sh|mul of a negative factor has no test\"]"]
