case: developer/merge-normal-admits-fix-rebased-since-review
about: >
  A rebase is no new change (#1254, #286): at `normal`, the developer's
  fix for #3 was reviewed, its summary at its head then; main moved, the
  branch was rebased on it, its commits new ids for the same changes.
  The reviewer, finding nothing new, writes no summary on the new head;
  the merge policy reads its record instead, by patch id as the reviewer
  does, and merges the fix with no person's yes.
given:
  repo: tested-draft
  config: {merge: {autonomy: normal}}
  setup:
    - "git checkout -q -b workline/developer/3 && GIT_COMMITTER_NAME=workline-bot git commit -q --amend --no-edit && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_COMMITTER_NAME=workline-bot git commit -qam 'fix: mul for #3' -m 'Workline-Role: developer'"
    - "old=$(git rev-parse HEAD) && c=$(git rev-list main..HEAD | paste -sd, -) && p=$(git rev-list main..HEAD | git diff-tree --stdin -p --no-color --no-renames | git patch-id --verbatim | cut -d' ' -f1 | paste -sd, -) && sed -i \"s/@old@/$old/; s/@commits@/$c/; s/@patches@/$p/\" \"$FORGE_FILE\""
    - "git checkout -q main && printf 'notes\\n' > NOTES && git add NOTES && GIT_COMMITTER_DATE=2026-01-03T01:00:00Z git commit -qm 'docs: notes' && git checkout -q workline/developer/3 && GIT_COMMITTER_NAME=workline-bot git rebase -q main"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main"
  forge:
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    issues:
      - id: 3
        title: "mul gives a sum"
        labels: ["bug", "workline:developing"]
        body: "## Need\n\nmul 2 3 gives 5.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        author: workline-bot
        bot: true
        title: "mul gives a sum"
        body: "Closes #3"
        labels: []
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z", by: workline-bot}]
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"from\":\"workline/tester/issue-3\",\"acceptance\":[\"tests.test_mul_two_by_three\",\"tests.test_mul_by_zero\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:at head=@old@ run=7 -->\n<!-- workline:record reviewed=@commits@ patches=@patches@ runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: auto-merge-on, where: "#2", message: "with no person's yes, workline's own code — the developer's code for #3, a fix: its issue labelled `bug` —"}
  no-findings: [{rule: waits-for-a-yes}]
  forge:
    merge-requests:
      - {id: 2, auto-merge: true, comment-contains: ["workline:merge-alone=code"]}
