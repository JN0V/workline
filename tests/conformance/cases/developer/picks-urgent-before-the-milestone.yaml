case: developer/picks-urgent-before-the-milestone
about: >
  The developer's pick: an Urgent issue (priority 1) comes before the
  routine issues of a milestone. #2, ready, priority 3, in milestone
  v1.0, and #3, ready, priority 1, in none: the developer takes #3.
given:
  repo: tested
  forge:
    milestones: [v1.0]
    issues:
      - {id: 2, title: "Multiply", milestone: v1.0, labels: ["workline:ready", "workline:priority/3"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
      - {id: 3, title: "Divide", labels: ["workline:ready", "workline:priority/1"], body: "## Need\n\nI want to divide.\n\n## Scope\n\n- `div.sh`.\n"}
run: {develop: [], ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "took #3"
  agent-calls: 1
  forge:
    issues:
      - id: 3
        comment-contains: ["The developer", "workline:developer-act", '"act":"pick"', '"issue":3']
      - {id: 2, comments: 0}
