case: developer/partial-refused-says-part-of
about: >
  A pull request that leaves part of its issue out never closes it. Its
  agent wrote the code and a gate's files, refused at apply as a
  person's to change: the pull request says `Part of #2`, not
  `Closes #2`, and an issue for a person holds the rest, a sub-issue of
  #2, opened with it.
given:
  repo: tested
  setup:
    - "printf 'exit 1\\n' > check.sh && git add check.sh && git commit -q -m 'chore: a check'"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    gates: {default: {checks: [{id: own, run: "sh check.sh", output: exit}]}}
  forge:
    sub-issues: true
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`, `check.sh`, `.workline/config.yaml`, `.github/workflows/ci.yml`.\n"}
run: {develop: [], ai: "fake:developer-gate-file"}
expect:
  status: pass
  agent-calls: 1
  pushed:
    workline/developer/2:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - id: 1
        branch: workline/developer/2
        body-contains: ["Part of #2\n", "## Left out", "`check.sh`"]
        body-lacks: ["Closes #2"]
    issues:
      - id: 2
        closed: false
      - id: 3
        title: "A person's part of #2: Multiply"
        parent: 2
        body-contains: ["Part of #2.", "## Need", "## Validation", "- **", "---", "## Scope", "`check.sh`", "`.workline/config.yaml`", "`.github/workflows/ci.yml`"]
