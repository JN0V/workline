case: developer/merge-normal-holds-developer-feature
about: >
  A developer feature waits for a person's yes (ADR-0054, step 7): at
  `normal`, the developer's pull request for #3 passes every gate as a
  fix would — workline's own, its head's verdict passed, no finding
  open —, but its issue is labelled `enhancement`: a feature. The kind
  is the issue's label, never the agent's say. `workline follow` turns
  nothing on for it, sets no yes on its head, and says so in its
  findings and once in a comment on it: the label that accepts it. The
  comment is the decision's record, for the auditor (ADR-0046).
given:
  repo: tested-draft
  config: {merge: {autonomy: normal}}
  setup:
    - "git checkout -q -b workline/developer/3 && GIT_COMMITTER_NAME=workline-bot git commit -q --amend --no-edit && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_COMMITTER_NAME=workline-bot git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main"
  forge:
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["enhancement", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        author: workline-bot
        bot: true
        title: "Multiply two numbers"
        body: "Closes #3"
        labels: []
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z", by: workline-bot}]
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2}} -->\n<!-- workline:sticky=developer/code -->"
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: waits-for-a-yes, where: "#2", message: "the developer's code for #3, a feature: its issue labelled `enhancement`"}
  no-findings: [{rule: auto-merge-on}, {rule: merged-at-once}]
  not-pushed: [workline/developer/3]
  summary-file: ["none accepted into main"]
  forge:
    merge-requests:
      - {id: 2, auto-merge: false, labels: [], comment-contains: ["**Waiting for a person's yes**", "the developer's code for #3, a feature", "put the label `workline:accepted`", "workline:merge-waits=feature"]}
    statuses:
      - {commit: "workline/developer/3", name: workline/accepted, absent: true}
