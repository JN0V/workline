case: developer/proof-red-quotes-compiler-lines
about: >
  A review round whose fix does not compile (#1209): Gradle's last lines
  say only BUILD FAILED, the Kotlin compiler's `e:` lines above them say
  why. The round's proof-red reason quotes the lines the tester's
  build-errors rows read first, then the build tool's tail, as the
  tester's own reason does (#1192), so the cause shows without the CI's
  log.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles:
      tester:
        settings:
          # A Gradle build of many modules: one module's tests ran and
          # passed, the app's code did not compile.
          test-command: >-
            printf '<testsuites><testsuite name="tests"><testcase classname="tests" name="test_add" time="0.01"/></testsuite></testsuites>' > {report};
            echo '> Task :app:compileDebugKotlin FAILED';
            echo "e: file://$PWD/app/src/main/java/SettingsScreen.kt:180:62 Unresolved reference 'settings_grid'.";
            echo 'FAILURE: Build failed with an exception.';
            echo '* What went wrong:';
            echo "Execution failed for task ':app:compileDebugKotlin'.";
            echo '* Try:';
            echo '> Run with --scan to get full insights.';
            echo '> Get more help at https://help.gradle.org.';
            echo 'BUILD FAILED in 23s';
            exit 1
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"red\",\"passed\":1,\"red\":[\"test_mul_two_by_three\"]}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **blocks** | correctness | `lib.sh:2` | Important: mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply. |\n\n<!-- workline:findings [{\"lens\":\"correctness\",\"holds\":\"blocks\",\"where\":\"lib.sh:2\",\"severity\":\"Important\",\"text\":\"mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply.\"}] -->\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "round 1 of 5 on merge request 2, its fix pushed, the tests red"
  findings:
    - {rule: proof-red, where: "merge request 2", message: "the test command failed, no test red: exit status 1: its errors: e: file://"}
    - {rule: proof-red, where: "merge request 2", message: "SettingsScreen.kt:180:62 Unresolved reference 'settings_grid'.; its output ends: "}
    - {rule: proof-red, where: "merge request 2", message: "BUILD FAILED in 23s"}
