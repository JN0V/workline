case: developer/round-fixes-beyond-the-scope
about: >
  A round's fix lies beyond the issue's Scope (#921; ADR-0065, change 2):
  the project check `test` is red, and the fix is in cases/mul.txt, which
  #3's Scope does not name. The agent makes it there: pushed, its commit
  listing cases/mul.txt under Beyond the Scope, where the reviewer's
  intent lens reads it; the round's comment and the record list it too.
  Before, the round asked the product owner and blocked #3.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && mkdir cases && printf 'mul 2 3: 5\\n' > cases/mul.txt && git add cases && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    head-checks:
      workline/developer/3:
        - {name: test, workflow: test, state: failure, job: 41, log: "--- FAIL: cases/mul.txt wants 5 for mul 2 3, got 6\n"}
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":2},\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\nNo finding on the commits reviewed.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-fixes-outside-its-scope"}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: beyond-scope, level: info, where: "merge request 2", message: "cases/mul.txt"}]
  no-findings: [{rule: scope-asked}, {rule: outside-scope}]
  pushed:
    workline/developer/3:
      cases/mul.txt: "mul 2 3: 6"
  pushed-message:
    workline/developer/3: "Beyond the Scope:\n\n- `cases/mul.txt`: no reason given by its agent"
  run-files:
    in/task.md:
      contains: ["A fix that lies in a file beyond the issue's Scope: make it there, and say why in `.workline/beyond.yaml`"]
  forge:
    issues:
      - id: 3
        labels: ["workline:developing"]
        comment-lacks: ["workline:scope-ask", "blocks this issue"]
    merge-requests:
      - id: 2
        comment-contains: ["Beyond the Scope, the issue's Scope a hint; the reviewer's intent lens judges each:\n\n- `cases/mul.txt`", "\"beyond\":[{\"file\":\"cases/mul.txt\"}]"]
