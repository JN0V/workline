case: developer/cap-reached-pushes-draft
about: >
  A cap reached (ADR-0054, step 3): the run's agent spent its
  ai-max-tokens. Its code is green, yet pushed as a Draft, the cap said
  in its Verification and kept in the claim's record, for the auditor
  (ADR-0046): a run that needed more than it may spend is a person's to
  read.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles:
      tester: {settings: {test-command: "sh run-tests.sh {report}"}}
      developer: {settings: {ai-max-tokens: 2000}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-writes-mul-costly.sh"'}
expect:
  status: pass
  summary: "took #3; a Draft: green, a cap reached"
  agent-calls: 1
  findings:
    - {rule: proof-green, level: info, where: "#3"}
    - {rule: cap-reached, level: warn, where: ai-max-tokens, message: "the run spent 5000, ai-max-tokens allows 2000"}
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    issues:
      - id: 3
        comment-contains: ['"caps":[{"setting":"ai-max-tokens","spent":5000,"allows":2000}]']
    merge-requests:
      - id: 2
        branch: workline/developer/3
        draft: true
        body-contains: ["Closes #3", "**a Draft**", "Cap reached: ai-max-tokens, 5000 spent of 2000."]
