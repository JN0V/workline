case: developer/agent-env-has-no-token
about: >
  No forge token in the agent's hands (ADR-0054, principle 6): the
  engine calls the developer's agent with the forge's tokens, the App's
  key and the signing key taken out of its environment, its own login
  left. It proposes; the engine pushes and opens the pull request.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  env: {GH_TOKEN: "ghs_planted", GITHUB_TOKEN: "ghs_planted", GITLAB_TOKEN: "glpat-planted", WORKLINE_GITLAB_TOKEN: "glpat-planted", CI_JOB_TOKEN: "planted", WORKLINE_APP_PRIVATE_KEY: "planted", ANTHROPIC_API_KEY: "the-agent-s-own"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-reads-its-env.sh"'}
expect:
  status: pass
  agent-calls: 1
  pushed:
    workline/developer/3:
      lib.sh: "# tokens seen: none; login seen: yes"
