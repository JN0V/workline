case: developer/worktree-reverts-frozen-test
about: >
  The tester's frozen tests are read-only to the developer (ADR-0055):
  the agent edits one in the worktree, and its diff there is reverted
  (ADR-0056), said and kept in the record; the test stays as the
  tester's Draft holds it, and the code goes on, proven green on it.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  env: {EDIT: frozen}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-edits-worktree.sh"'}
expect:
  status: pass
  summary: "took #3; 1 of its agent's proposals refused at apply; proven green, its pull request ready"
  agent-calls: 1
  findings: [{rule: acceptance-test-edit, level: warn, where: tests/test_mul_by_zero.sh}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
      tests/test_mul_by_zero.sh: "= 0 ]"
  pushed-lacks:
    workline/developer/3:
      tests/test_mul_by_zero.sh: "= 1 ]"
  forge:
    issues:
      - id: 3
        comment-contains: ['"rule":"acceptance-test-edit"']
