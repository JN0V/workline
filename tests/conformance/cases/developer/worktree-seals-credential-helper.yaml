case: developer/worktree-seals-credential-helper
about: >
  A person's machine, as most are (ADR-0056, step 2, principle 6): git
  has a credential helper, an ssh agent runs, gh has a config. The engine
  does not refuse: it starts the agent in an environment where git runs
  no helper and prompts no one, ssh has no agent nor key, and gh reads an
  empty config. The agent asks git for a credential and gets none; the
  run goes on and the engine pushes its code.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git config credential.helper '!f() { echo username=someone; echo password=planted; }; f'"
  env:
    EDIT: reach
    SSH_AUTH_SOCK: "/tmp/planted-agent.sock"
    GH_CONFIG_DIR: "$XDG_CONFIG_HOME/gh"
  forge:
    issues:
      - {id: 2, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function.\n"}
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-edits-worktree.sh"'}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: credential-in-reach}]
  pushed:
    workline/developer/2:
      lib.sh: "# credential: none; ssh agent: none; gh config: empty"
