case: developer/round-five-blocks-on-code-sends-tests
about: >
  Past the fifth round, the review asks a code finding and a test
  finding (#1265): the issue is blocked on the code finding alone, the
  reviewer and the developer not agreeing on it; the test finding still
  goes to the tester's Draft, not counted against them.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\"},\"round\":5,\"review-runs\":5} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **blocks** | correctness | `lib.sh:2` | Important: mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply. |\n| **warns** | tests | `lib.sh:2` | Important: mul of a negative factor has no test — nothing runs mul -2 3. |\n\n<!-- workline:record reviewed=1111111 runs=6 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "past round 5: its issue #3 blocked"
  agent-calls: 0
  findings: [{rule: review-blocked, level: warn, where: "merge request 2"}]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["the review still asks 1 finding: the reviewer and the developer do not agree"]
    merge-requests:
      - id: 1
        threads:
          - {path: tests/test_mul_by_zero.sh, line: 4, contains: ["- kind: missing", "mul of a negative factor has no test"]}
      - id: 2
        comment-contains: ["**Blocked**: 5 rounds, and the review still asks 1 finding", "\"tester\":[\"tests|lib.sh|mul of a negative factor has no test\"]"]
