case: developer/unopened-twice-blocks
about: >
  Its pull request did not open once already on this issue, said in the
  claim's comment, and does not open again (#856): the issue is blocked,
  the claim off, the reason on it. No run takes it again until a person
  moves it back, so a failure that repeats is no loop.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
    - "printf 'add() { echo $(($1 + $2)); }\\nsub() { echo $(($1 - $2)); }\\n' > lib.sh && git commit -q -am 'feat: subtract' && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
        comments: ["**The developer** gives this issue back.\n\n<!-- workline:developer-act {\"act\":\"unopened\",\"issue\":3,\"unopened\":1} -->\n<!-- workline:sticky=developer/claim -->"]
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: "fake:developer-writes-mul"}
expect:
  status: block
  findings: [{rule: not-opened, where: workline/developer/3}]
  not-pushed: [workline/developer/3]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comments: 1
        comment-contains: ["**The developer** blocks this issue.", "its pull request did not open: `", "(2 times)", "moves the issue back by its label", "\"unopened\":2"]
        comment-lacks: ["gives this issue back"]
