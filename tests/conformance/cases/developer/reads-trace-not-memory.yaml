case: developer/reads-trace-not-memory
about: >
  A round is a fresh run with no memory (ADR-0054): what the rounds
  before did, it reads from its record on the pull request, the round
  count with it; the reviewer's runs it read already are not a new
  verdict. Here round 1 is recorded, the reviewer ran again: round 2,
  the first round told in its question.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready", "workline:developing"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"acceptance\":[\"tests/test_mul_by_zero.sh\",\"tests/test_mul_two_by_three.sh\"],\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"red\",\"passed\":1,\"red\":[\"test_mul_two_by_three\"]},\"round\":1,\"review-runs\":1,\"seen\":[\"correctness|lib.sh|mul adds its operands\"],\"rounds\":[{\"n\":1,\"asked\":[\"blocks correctness `lib.sh:2`: Important: mul adds its operands\"],\"result\":\"red\"}]} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer**\n\n| | | Where | Finding |\n|---|---|---|---|\n| **blocks** | correctness | `lib.sh:2` | Important: mul adds its operands — mul 2 3 gives 5, not 6. Fix: multiply. |\n| warns | style | `lib.sh:2` | Nit: name the operands — $1 and $2 read poorly. |\n\n<!-- workline:record reviewed=1111111 runs=2 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {develop: [--merge-request, "2"], ai: "fake:developer-writes-mul"}
expect:
  status: pass
  summary: "round 2 of 5"
  agent-calls: 1
  run-files:
    in/task.md:
      contains: ["Review round 2 of 5", "you remember none of it", "Round 1: 1 asked, the tests red", "I want to multiply.", "**still there** after a round", "1 nit too: not asked"]
      not-contains: ["name the operands", "# Skill: five-whys"]
  forge:
    merge-requests:
      - id: 2
        comment-contains: ["\"round\":2", "\"review-runs\":2", "Review round 1:", "Review round 2:"]
