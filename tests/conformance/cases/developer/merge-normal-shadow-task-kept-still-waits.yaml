case: developer/merge-normal-shadow-task-kept-still-waits
about: >
  Shadow asks, never acts (docs/adr/0073): `merge.shadow` lists `task`,
  `merge.alone` does not. The developer's pull request for #3, a task,
  passes every gate, changes no test, and the judge said yes on its
  head: it still waits for a person's yes, as any task at `normal`.
given:
  repo: tested-draft
  config: {merge: {autonomy: normal, shadow: [task]}, roles: {tester: {settings: {test-paths: ["tests/**"]}}}}
  setup:
    - "git checkout -q main && git checkout -q -b workline/developer/3 && printf 'add() {\\n  echo $(($1 + $2))\\n}\\n' > lib.sh && GIT_COMMITTER_NAME=workline-bot git commit -qam 'refactor: add on three lines for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && sed -i \"s/@head@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\" && git checkout -q main"
  forge:
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    issues:
      - id: 3
        title: "Write add on three lines"
        labels: ["task", "workline:developing"]
        body: "## Need\n\nadd reads on one line.\n\n## Scope\n\n- `lib.sh`: `add`.\n"
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        author: workline-bot
        bot: true
        title: "Write add on three lines"
        body: "Closes #3"
        labels: []
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z", by: workline-bot}]
        comments:
          - "**The developer**'s record of this pull request, for its next runs and the auditor.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"proof\":{\"result\":\"green\",\"passed\":1}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — no finding on the change.\n\nNo finding on the commits reviewed.\n\n<!-- workline:kept head=@head@ -->\n<!-- workline:at head=@head@ run=7 -->\n<!-- workline:record reviewed=@head@ runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: waits-for-a-yes, where: "#2", message: "the developer's code for #3, a task: its issue labelled `task`"}
  no-findings: [{rule: auto-merge-on}, {rule: merged-at-once}]
  forge:
    merge-requests:
      - {id: 2, auto-merge: false, comment-contains: ["**Waiting for a person's yes**", "workline:merge-waits=task"]}
    statuses:
      - {commit: "workline/developer/3", name: workline/accepted, absent: true}
