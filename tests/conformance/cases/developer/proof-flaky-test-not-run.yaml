case: developer/proof-flaky-test-not-run
about: >
  A flaky-n-of-n proof whose named test the report does not hold proves
  nothing (principle 12): the tester named `test_retry`, which the
  project's runner never reports. Not proven, said; its pull request
  opens as a Draft.
given:
  repo: tested
  setup:
    - "printf '[ $(($$ %% 2)) = 0 ]\\n' > tests/test_flaky.sh && git add tests/test_flaky.sh && git commit -qm 'test: a flaky test' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 2
        title: "The flaky test fails one run in two"
        labels: ["workline:ready"]
        body: "## Need\n\nA maintainer needs the flaky test reliable.\n\n## Validation\n\n- **Reliable:** Given the suite, When the flaky test runs 3 times, Then it passes 3 times.\n\n## Scope\n\n- `tests/test_flaky.sh`\n"
        comments: ["**The tester** records the proof of this issue: flaky-n-of-n, no new test.\n\n<!-- workline:tester-proof {\"kind\":\"flaky-n-of-n\",\"reason\":\"its flakiness cannot be shown red on demand\",\"test\":\"test_retry\",\"runs\":3} -->\n<!-- workline:sticky=tester/issue -->"]
run: {develop: [], ai: "fake:developer-fixes-flaky"}
expect:
  status: pass
  summary: "took #2; a Draft: unproven"
  findings: [{rule: proof-not-run, level: warn, where: "#2", message: "the named test `test_retry` was not reported, run 1 of 3"}]
