case: developer/proof-keeps-its-run
about: >
  The developer's proof never reaches the line's own runs (#953): the
  job keeps its runs in WORKLINE_RUNS_DIR, and a project's test suite
  that starts workline's engines writes and prunes its runs there, the
  live one first. The proof's command runs without the line's own
  variables: this one, standing for such a suite, empties the folder
  it is told of. The run keeps its verdict: proven green, its pull
  request opened.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  env: {WORKLINE_RUNS_DIR: "$WORK/runs"}
  config:
    roles: {tester: {settings: {test-command: 'if [ -n "$WORKLINE_RUNS_DIR$WORKLINE_RUN_DIR" ]; then rm -rf "$WORKLINE_RUNS_DIR" "$WORKLINE_RUN_DIR"; fi; sh run-tests.sh {report}'}}}
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:developer-writes-mul"}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: proof-green, level: info, where: "#3", message: "3 tests passed on its code, none red"}]
  no-findings: [{rule: engine-error}]
  pushed:
    workline/developer/3:
      lib.sh: "mul()"
  forge:
    merge-requests:
      - {id: 2, branch: workline/developer/3, draft: false}
