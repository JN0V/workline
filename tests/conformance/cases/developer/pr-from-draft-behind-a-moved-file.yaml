case: developer/pr-from-draft-behind-a-moved-file
about: >
  The tester's Draft was pushed, then main moved the file the issue's
  code goes in (#1941). Main is merged into the Draft first, in the
  run's clone only: its agent's worktree holds main's paths, its diff
  applies on main, and its branch carries the Draft and main both, the
  tester's branch not pushed.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
    - "mkdir src && git mv lib.sh src/lib.sh && printf '. ./src/lib.sh\\n' > lib.sh && git add lib.sh && git commit -q -m 'refactor: move the library to src' && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `src/lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {develop: [], ai: 'cmd:sh "$FIXTURES/agents/developer-edits-moved-file.sh"'}
expect:
  status: pass
  summary: "took #3; proven green, its pull request ready"
  agent-calls: 1
  no-findings: [{rule: engine-error}, {rule: proof-red}]
  pushed:
    workline/developer/3:
      src/lib.sh: "mul()"
      lib.sh: ". ./src/lib.sh"
      tests/test_mul_by_zero.sh: "mul 5 0"
  pushed-log:
    workline/developer/3:
      - "test: the acceptance tests of #3"
      - "Merge branch 'main' into the tester's Draft"
      - "feat(src): multiply two numbers"
      - "src/lib.sh"
  pushed-lacks:
    workline/tester/issue-3:
      src/lib.sh: "add"
  forge:
    issues:
      - id: 3
        labels: ["workline:developing"]
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        body-contains: ["Closes #3"]
