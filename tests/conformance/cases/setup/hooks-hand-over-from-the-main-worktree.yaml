case: setup/hooks-hand-over-from-the-main-worktree
about: From the main worktree of a repository that has a linked one, as before, the global hooks run workline, then hand over to the repository's own pre-push in .git/hooks; a guard there refuses the push, saying so.
given:
  repo: basic
  setup:
    - git init -q --bare ../remote.git && git remote add origin "$PWD/../remote.git"
    - git worktree add -q ../linked -b side
    - "printf '#!/bin/sh\\necho \"guard: the repository refuses this push\" >&2\\nexit 1\\n' > .git/hooks/pre-push && chmod +x .git/hooks/pre-push"
  env: {GIT_CONFIG_GLOBAL: "$XDG_CONFIG_HOME/gitconfig", WORKLINE_AI: none}
run: {sh: "workline hooks install --global && git push -q origin main"}
expect:
  exit: 1
  stderr: ["guard: the repository refuses this push"]
