case: setup/doctor-repository-not-adopted
about: In a repository with no CI and docs that declare no sources, the doctor says docs are judged nowhere — no merge request in CI, no gardening — and that it tracks nothing.
given:
  repo: basic
run: {doctor: true}
expect:
  status: pass
  findings:
    - {rule: docs-judged-nowhere, level: warn, message: "no gardening"}
    - {rule: nothing-tracked, message: "none of the 1 docs"}
