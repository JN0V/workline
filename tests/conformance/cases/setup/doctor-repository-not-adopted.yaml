case: setup/doctor-repository-not-adopted
about: In a repository that routes no pre-push and whose docs declare no sources, the doctor says the documentalist does not run before a push and tracks nothing.
given:
  repo: basic
run: {doctor: true}
expect:
  status: pass
  findings:
    - {rule: documentalist-not-before-push}
    - {rule: nothing-tracked, message: "none of the 1 docs"}
