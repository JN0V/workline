case: setup/hooks-hand-over-from-a-linked-worktree-pre-push
about: From a linked worktree (git worktree add), the global hooks run workline, then hand over to the repository's own pre-push in .git/hooks, the folder its worktrees share; a guard there refuses the push, saying so.
given:
  repo: basic
  setup:
    - git init -q --bare ../remote.git && git remote add origin "$PWD/../remote.git"
    - git worktree add -q ../linked -b side
    - "printf '#!/bin/sh\\necho \"guard: the repository refuses this push\" >&2\\nexit 1\\n' > .git/hooks/pre-push && chmod +x .git/hooks/pre-push"
  env: {GIT_CONFIG_GLOBAL: "$XDG_CONFIG_HOME/gitconfig", WORKLINE_AI: none}
run: {sh: "workline hooks install --global && cd ../linked && git push -q origin side"}
expect:
  exit: 1
  stderr: ["guard: the repository refuses this push"]
