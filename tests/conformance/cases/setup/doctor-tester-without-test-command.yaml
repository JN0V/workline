case: setup/doctor-tester-without-test-command
about: >
  The tester is routed and no test-command is set: `workline doctor` says
  so before a run refuses it, with the setting to add (#1284).
given:
  repo: documented
  config:
    forge: local
    routing: {events: {issue: [product-owner, tester, developer]}}
run: {doctor: true}
expect:
  status: pass
  findings:
    - {rule: test-command-missing, where: tester, message: "no test-command is set, and the developer and the tester are routed"}
