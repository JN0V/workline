case: setup/doctor-gitlab-issue-hook-off
about: >
  On GitLab, the webhook to the project's own trigger URL with
  WORKLINE_TASK=issue, its issue events off: it starts nothing on a
  label, and the doctor warns, naming `workline setup`, which turns them
  on.
given:
  repo: documented
  config:
    routing: {events: {issue: [developer]}}
  forge:
    merge-requests: []
    hooks: [{id: 4, url: "https://gitlab.example/api/v4/projects/1/ref/main/trigger/pipeline?token={token}&variables[WORKLINE_TASK]=issue", issues_events: false}]
run: {doctor: true, forge: gitlab}
expect:
  status: pass
  checks:
    - {rule: issue-hook-off, level: warn, message: "does not fire on issue events", fix: "workline setup --yes"}
