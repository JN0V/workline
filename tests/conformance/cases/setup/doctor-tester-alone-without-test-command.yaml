case: setup/doctor-tester-alone-without-test-command
about: >
  The tester alone is routed and no test-command is set: `workline
  doctor` names the tester alone, and its fix gives an example for more
  than one language (#1284).
given:
  repo: documented
  config:
    forge: local
    routing: {events: {merge-request: [tester]}}
run: {doctor: true}
expect:
  status: pass
  findings:
    - {rule: test-command-missing, where: tester, message: "no test-command is set (the tester's, which the developer's proof runs too), and the tester is routed", fix: "gotestsum --junitfile {report}"}
