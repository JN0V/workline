case: setup/doctor-gitlab-issue-hook-best-of-two
about: >
  On GitLab, two webhooks to the project's trigger URL with
  WORKLINE_TASK=issue: the doctor reads the one that works — on issue
  events, not disabled, on the default branch — whatever their order.
given:
  repo: documented
  config:
    routing: {events: {issue: [developer]}}
  forge:
    merge-requests: []
    hooks:
      - {id: 4, url: "https://gitlab.example/api/v4/projects/1/ref/main/trigger/pipeline?token={token}&variables[WORKLINE_TASK]=issue", issues_events: true, alert_status: disabled}
      - {id: 5, url: "https://gitlab.example/api/v4/projects/1/ref/main/trigger/pipeline?token={token}&variables[WORKLINE_TASK]=issue", issues_events: true}
      - {id: 6, url: "https://gitlab.example/api/v4/projects/1/ref/main/trigger/pipeline?token={token}&variables[WORKLINE_TASK]=issue", issues_events: false}
    triggers: [{id: 2, description: "workline: the issue webhook (ADR-0059)", token: glptt-hidden-from-everyone-000, owner: someone}]
run: {doctor: true, forge: gitlab}
expect:
  status: pass
  checks:
    - {rule: issue-hook, level: ok}
  stdout-lacks: [issue-hook-disabled, issue-hook-off]
