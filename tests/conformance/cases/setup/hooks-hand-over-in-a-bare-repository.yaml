case: setup/hooks-hand-over-in-a-bare-repository
about: From a bare repository, which has no worktree, the global pre-push runs workline, then the repository's own pre-push in its hooks/; a guard there refuses the push, saying so.
given:
  repo: basic
  setup:
    - git clone -q --bare . ../mirror.git && git init -q --bare ../remote.git
    - "printf '#!/bin/sh\\necho \"guard: the mirror refuses this push\" >&2\\nexit 1\\n' > ../mirror.git/hooks/pre-push && chmod +x ../mirror.git/hooks/pre-push"
  env: {GIT_CONFIG_GLOBAL: "$XDG_CONFIG_HOME/gitconfig", WORKLINE_AI: none}
run: {sh: "workline hooks install --global && cd ../mirror.git && git push -q ../remote.git main"}
expect:
  exit: 1
  stderr: ["guard: the mirror refuses this push"]
