case: routing/size-crossing-by-the-product-owner-waits-for-a-person
about: >
  The product owner's own run too big for its context (ADR-0064, step 3;
  #1168): #9 names a file of 160,000 characters, and refining it is over
  the product owner's budget. No role is left to ask on its size: the
  line blocks #9 for a person at once, the size said, never woken again
  on the same input.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {code-bytes-max: 0} # the lines bound it alone: a task over the context budget (#1152)
    routing: {events: {issue: [product-owner]}}
  setup:
    - "awk 'BEGIN { for (i = 1; i <= 400; i++) printf \"// %0396d\\n\", i }' > src/huge.go && git add src && git commit -qm 'feat: one huge file'"
  forge:
    issues:
      - {id: 9, title: "Huge", body: "Rows lost in `src/huge.go`.", labels: ["workline:to-refine"], author: ann, insider: true}
run: {route: reconcile, open-merge-request: true, ai: "cmd:cat > /dev/null; echo '[]'", then: again}
expect:
  agent-calls: 0
  findings:
    - {rule: prompt-over-budget, message: "the agent was not asked"}
    - {rule: size-crossed-own, level: warn, where: "#9", message: "the product owner's run on it is too big for its context"}
    - {rule: size-crossed-own, level: warn, where: "#9", message: "no role is left to ask: a person narrows or splits it, or raises the setting named: moved to blocked"}
  no-findings: [{rule: state-revisit}, {rule: size-crossed}]
  forge:
    issues:
      - id: 9
        labels: ["workline:blocked"]
        comment-contains: ["the product owner's run on it is too big for its context"]
