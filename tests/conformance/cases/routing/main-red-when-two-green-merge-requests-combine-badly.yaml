case: routing/main-red-when-two-green-merge-requests-combine-badly
about: >
  Two merge requests, each green alone, break main together (ADR-0050):
  one turns godot on and ends main.go's comment with a period, the other,
  based on main before it, adds a comment with none. Main's run after the
  second merge compares with main's tip before it, whose findings main's
  run kept, and is red: the finding is new there. The issue says the run
  is red, what main gained, and lists the finding, kept while main holds
  it.
given:
  repo: linted
  setup:
    - "git checkout -qb godot && printf 'linters: {enable: [errcheck, godot]}\\n' > .golangci.yml && sed -i 's|^// main runs, then cleans up$|&.|' main.go && git add . && git commit -qm 'build: end every comment with a period'"
    - "git checkout -qb helper main && printf '\\n// helper says hello\\nfunc helper() {}\\n' >> main.go && git commit -qam 'feat: add a helper'"
    - "git checkout -q main && git merge -q --no-ff godot -m 'Merge pull request #1 from godot' && git merge -q --no-ff helper -m 'Merge pull request #2 from helper'"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  forge: {issues: []}
  config:
    routing: {events: {merge-request: [committer, documentalist, "gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run:
  route: main
  input: {range: "HEAD^1..HEAD"}
  kept-on-main: "HEAD^1"
  main-issue: true
  summary: true
expect:
  status: block
  steps: ["gate:merge", documentalist]
  findings:
    - {rule: over-threshold, where: lint, message: "1 new error finding, at most 0 allowed (3 there before it"}
    - {rule: over-threshold, where: lint, message: "main.go:8 godot"}
    - {rule: main-issue, message: "issue #1 kept"}
  summary-file: ["lint 1 new, 3 before it", "the merge base's kept on main, not run again"]
  forge:
    issues:
      - id: 1
        body-contains: ["**The default branch's run is red**", "each merge request was checked alone, against its own base", "Merge pull request #2 from helper", "`main.go:8` `lint/godot`"]
        body-lacks: "each marked in"
      - {id: 2, absent: true}
