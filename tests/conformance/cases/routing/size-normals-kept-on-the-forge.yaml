case: routing/size-normals-kept-on-the-forge
about: >
  The normal size is measured per project (ADR-0064, step 2): the 85th
  percentile of the fresh tokens its done issues spent, per kind, an
  issue and a run of each role, read from the line's records on the
  forge. Done is closed by a merge request: ten bugs done measure the
  bug's normal, 91k an issue, the developer's 90k a run, each from ten
  runs. One feature done is too few: its normal is the seed, 400k an
  issue, a run its role's ai-max-tokens. A bug closed as not planned, or
  closed by hand, counts for nothing; one with no record is not the
  line's. Kept in one comment on one issue; the open bug #20 is said past
  its normal, its total and its two runs; #21 is not; the feature #22, of
  effort High, has its seeds doubled, so it is not. Reported only.
given:
  repo: backlog
  config:
    roles: {product-owner: {settings: {effort: auto}}}
  forge:
    issues:
      - {id: 1, title: "Bug 1", closed: true, reason: completed, closed-by: [{kind: pull-request, ref: "#101", text: "fix: it"}], labels: [bug], body: "## Need\n\nFixed.\n", comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"0a1b2c3d4e5f\",\"hops\":3,\"spent\":{\"developer\":[10000],\"product-owner\":[1000]}} -->\n<!-- workline:sticky=line/state -->"]}
