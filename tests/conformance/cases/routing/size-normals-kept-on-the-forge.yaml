expect:
  status: pass
  summary: "normals of 11 issues done"
  forge:
    issues:
      - id: 31
        title: "workline: the normal size of an issue"
        comment-contains:
          - "| Kind | Done | An issue | developer, a run | product-owner, a run | tester, a run |"
          - "| bug | 10 | 91k (p85) | 90k (p85) | 1k (p85) | 300k (seed) |"
          - "| feature | 1 | 400k (seed) | 500k (seed) | none (no ai-max-tokens) | 300k (seed) |"
          - "#20 (bug): 97k, past its normal of 91k"
          - "#20 (bug): a developer run of 95k, past its normal of 90k"
          - "#20 (bug): a product-owner run of 2k, past its normal of 1k"
        comment-lacks: ["#21", "#22", "9000k", "8000k"]
