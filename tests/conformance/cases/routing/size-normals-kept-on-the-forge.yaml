case: routing/size-normals-kept-on-the-forge
about: >
  The normal size is measured per project (ADR-0064, step 2): the 85th
  percentile of the fresh tokens its done issues spent, per kind, an
  issue and a run of each role, read from the line's records on the
  forge. Ten bugs done measure the bug's normal: 91k an issue, the
  developer's 90k a run. One feature done is too few: its normal is the
  seed, 400k an issue, a run its role's ai-max-tokens. An issue closed
  as not planned counts for nothing. Kept in one comment on one issue,
  written again in place; the open bug #20, at 97k, is said past its
  normal, #21 is not. Reported only: nothing stops on it.
given:
  repo: backlog
  forge:
    issues:
      - {id: 1, title: "Bug 1", closed: true, reason: completed, labels: [bug], body: "## Need\n\nFixed.\n", comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"0a1b2c3d4e5f\",\"hops\":3,\"spent\":{\"developer\":[10000],\"product-owner\":[1000]}} -->\n<!-- workline:sticky=line/state -->"]}
