case: routing/parent-bug-symptom-green-closes
about: >
  A bug's parent, split once its tests were written (#1212): the
  tester's Draft of #3 holds the reporter's symptom as two red tests,
  and both parts are closed, their fix on main. The reconciler wakes the
  product owner on it with no agent, the tester first: it lays the
  Draft's tests over main's current commit and proves them green three
  runs out of three, said on the parent. At level normal, the product
  owner closes the parent as completed alone, the tests named.
given:
  repo: tested-draft
  setup:
    - "git checkout -q main && printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'fix: multiply'"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [product-owner, tester]}}
  forge:
    sub-issues: true
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        base: main
        draft: true
        body: "The acceptance tests of #3."
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main~1\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests.test_mul_by_zero\",\"tests.test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
    issues:
      - id: 3
        title: "Multiplying gives a wrong total"
        labels: [bug]
        author: ann
        insider: true
        body: "## Need\n\nI multiply and the total is wrong.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n## Verification\n\n- A shell test a scenario.\n\n## Scope\n\nlib.sh"
        comments:
          - "```yaml\nsources: [lib.sh]\nconfirmed: d8c4dff\njudged: d8c4dff\nsplit: [6, 7]\n```\n\n<!-- workline:sticky=product-owner/state -->"
      - {id: 6, title: "Multiply two numbers", body: "Part of #3.", labels: [], parent: 3, closed: true, reason: completed, closed-by: [{kind: pull-request, ref: "#13", text: "fix: multiply"}]}
      - {id: 7, title: "Multiply by zero", body: "Part of #3.", labels: [], parent: 3, closed: true, reason: completed, closed-by: [{kind: pull-request, ref: "#14", text: "fix: multiply by zero"}]}
run: {route: reconcile, open-merge-request: true, ai: "fake:blocked-three"}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: state-parent-symptom, level: info, where: "#3"}
    - {rule: state-parent, level: info, where: "#3", message: "a parent, 2 of its 2 parts closed"}
  no-findings: [{rule: parent-accepted-by-a-person}]
  forge:
    issues:
      - id: 3
        closed: true
        comment-contains:
          - "**The reporter's symptom is gone**: its reproduction tests `tests.test_mul_by_zero`, `tests.test_mul_two_by_three` green on main at"
          - "Fixed: its parts are closed, and its reproduction tests `tests.test_mul_by_zero`, `tests.test_mul_two_by_three` green on main"
