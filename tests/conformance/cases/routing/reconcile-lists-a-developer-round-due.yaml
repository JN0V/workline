case: routing/reconcile-lists-a-developer-round-due
about: >
  The reconciler catches a review round an event missed: the
  developer's pull request has a gate's finding at its branch's head
  that no round asked, its issue doing, which wakes nobody. With
  `--input reconcile=list` it says the pull request due, starts
  nothing and asks no agent: the CI job starts its round's own run.
  A pull request read already is not listed.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 + $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3 && git checkout -q -b workline/developer/4 main && git push -q origin workline/developer/4 && git checkout -q main"
    - "sed -i \"s/@head@/$(git rev-parse workline/developer/3)/g; s/@short@/$(git rev-parse --short=7 workline/developer/3)/g; s/@head4@/$(git rev-parse workline/developer/4)/g; s/@short4@/$(git rev-parse --short=7 workline/developer/4)/g\" \"$FORGE_FILE\""
  config:
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - {id: 3, title: "Multiply two numbers", labels: ["workline:developing"], body: "## Need\n\nI want to multiply.\n"}
      - {id: 4, title: "Divide two numbers", labels: ["workline:developing"], body: "## Need\n\nI want to divide.\n"}
    merge-requests:
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
          - "### Gates: 1 new finding\n\nOn `@short@`, only what this change adds since `1111111` counts; what was there before is counted, not shown.\n\n- **`SC2003`** (`shellcheck`), 1 new: `lib.sh:2`. mul adds where it should multiply\n\n<!-- workline:sticky=gates/summary -->"
      - id: 5
        branch: workline/developer/4
        title: "Divide two numbers"
        body: "Closes #4"
        comments:
          - "**The developer**'s record.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":4,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1,\"gates-at\":\"@head4@\"} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
          - "### Gates: 1 new finding\n\nOn `@short4@`, only what this change adds since `1111111` counts; what was there before is counted, not shown.\n\n- **`SC2003`** (`shellcheck`), 1 new: `lib.sh:3`. div adds\n\n<!-- workline:sticky=gates/summary -->"
run: {route: reconcile, open-merge-request: true, ai: "fake:developer-nothing", input: {reconcile: list}}
expect:
  status: pass
  summary: "reconcile: 0 issues due:; 1 review round due: merge request 2"
  agent-calls: 0
  forge:
    merge-requests:
      - {id: 2, comments: 3}
      - {id: 5, comments: 3}
