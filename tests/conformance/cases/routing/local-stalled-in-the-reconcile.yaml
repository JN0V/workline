case: routing/local-stalled-in-the-reconcile
about: >
  With `forge: local`, the developer's pull request `!2` has a head
  that has not moved for 12 h, the line's verdict kept on it red at
  the reviewer's step, and nothing is due. The reconcile's summary
  lists it as stalled, with its age (12 h) and the verdict's step
  (reviewer).
given:
  repo: local-fix
  env: {WORKLINE_CLOCK: "2026-01-03T12:00:00Z"}
  config:
    forge: local
    merge: {autonomy: normal}
    routing: {events: {merge-request: [committer, reviewer]}}
  setup:
    - "mkdir -p .git/workline/verdicts && printf '{\"class\":\"red\",\"why\":\"the line\\047s verdict on its head is block (reviewer block): review-finding\"}\\n' > .git/workline/verdicts/$(git rev-parse workline/developer/3).json"
run:
  sh: >
    workline route reconcile --ai "fake:$FIXTURES/agents/review-nothing.yaml" --json
expect:
  exit: 0
  stdout: ["\"summary\": \"reconcile: nothing due", "stalled", "!2", "12 h", "reviewer"]
