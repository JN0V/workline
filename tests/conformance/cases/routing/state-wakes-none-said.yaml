case: routing/state-wakes-none-said
about: >
  The issue line runs only what the issue's state wakes (ADR-0059):
  Blocked wakes nobody, whatever other label it still bears. No step
  runs, no agent is asked; the line says why.
given:
  repo: tested
  config:
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - {id: 3, title: "Multiply", labels: ["workline:ready", "workline:blocked"], body: "## Need\n\nI want to multiply.\n"}
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "#3 wakes no role: its state, blocked, wakes no role"
  agent-calls: 0
  findings: [{rule: state-wakes-none, level: info, where: "#3"}]
  no-findings: [{rule: issue-passed}]
