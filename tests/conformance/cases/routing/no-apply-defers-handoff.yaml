case: routing/no-apply-defers-handoff
about: With --no-apply, a handoff cannot run in the judging job; the line says so instead of dropping it.
given:
  repo: released
  config: {routing: {events: {merge: [hands-over]}, handoffs: [{from: hands-over, to: documentalist}]}}
run: {route: merge, ai: "fake:changelog-and-handoff", no-apply: true}
expect: {status: pass, steps: [hands-over], findings: [{rule: handoff-deferred}]}
