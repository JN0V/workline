case: routing/size-backstop-x-large-lifts-it
about: >
  A person's `x-large` lifts the backstop to 16 times the normal
  (ADR-0064, §5; #1174). Bug #9 was blocked at its backstop, 1.7M fresh
  tokens; a person put `workline:size/x-large` on it and moved it back to
  refine. Its backstop is now 6.4M: the product owner's step runs.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner]}}
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        author: ann
        insider: true
        labels: [workline:to-refine, bug, workline:size/x-large]
        body: "## Need\n\nA user exporting rows loses the last one.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n"
        comments:
          - "**workline's line** blocks this issue.\n\n<!-- workline:line-record {\"state\":\"blocked\",\"body\":\"0a1b2c3d4e5f\",\"hops\":2,\"from\":\"ready\",\"since\":\"2026-11-01T00:00:00Z\",\"backstop\":1600000,\"spent\":{\"product-owner\":[500000],\"tester\":[500000],\"developer\":[700000]}} -->\n<!-- workline:sticky=line/state -->"
run: {route: issue, target: {issue: 9}, ai: "cmd:sh $FIXTURES/agents/costly.sh 1000"}
expect:
  agent-calls: 1
  no-findings: [{rule: backstop-crossed, where: "#9"}]
  forge:
    issues:
      - id: 9
        labels: [workline:to-refine, bug, workline:size/x-large]
        comment-lacks: ["\"backstop\""]
