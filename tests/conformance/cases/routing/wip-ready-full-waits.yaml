case: routing/wip-ready-full-waits
about: >
  Given Ready at its limit of 5 (routing.wip, shipped), the issue line
  naming a sixth issue waiting for its tests does not start the tester
  (ADR-0059, decision 9): it waits, said on the issue in the line's
  comment, its labels as they were. No agent asked.
given:
  repo: tested
  config:
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - {id: 1, title: "Add", labels: ["workline:ready"], body: "## Need\n\nI want to add.\n"}
      - {id: 2, title: "Subtract", labels: ["workline:ready"], body: "## Need\n\nI want to subtract.\n"}
      - {id: 3, title: "Divide", labels: ["workline:ready"], body: "## Need\n\nI want to divide.\n"}
      - {id: 4, title: "Round", labels: ["workline:ready"], body: "## Need\n\nI want to round.\n"}
      - {id: 5, title: "Negate", labels: ["workline:ready"], body: "## Need\n\nI want to negate.\n"}
      - {id: 7, title: "Square", labels: ["workline:developing"], body: "## Need\n\nI want to square.\n"}
      - id: 6
        title: "Multiply"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n"
run: {route: issue, target: {issue: 6}, open-merge-request: true, ai: "fake:tester-two-scenarios"}
expect:
  status: pass
  agent-calls: 0
  summary: "issue: #6 waits: ready holds 5 open issues, its limit 5"
  findings: [{rule: state-waits, level: info, where: "#6", message: "its state, tests, waits to wake the tester: ready holds 5 open issues, its limit 5 (routing.wip)"}]
  forge:
    issues:
      - id: 6
        labels: ["workline:needs-tests"]
        comments: 1
        comment-contains: ["**workline's line** waits to start this issue's next step.", "ready holds 5 open issues, its limit 5", "when there is room", "\"waits\":\"ready\""]
