case: routing/drafts-wait-review-missing-reviewer-alone
about: >
  The reviewer was asked on the drafts' body and wrote no review
  (#1070), only drafts waiting (#1150): woken once more for the
  reviewer, the reviewer alone, the product owner not called.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner, reviewer]}}
  forge:
    issues:
      - id: 9
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine, workline:proposed]
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n<!-- workline:draft -->\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - {body: "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nbody: 1cf7c41e922f\n```\n\n<!-- workline:sticky=product-owner/state -->", created: "2099-01-01T09:00:00Z"}
          - "**workline's line** last woke the reviewer on this issue, in its state refine (1 state step so far).\n\n<!-- workline:line-record {\"state\":\"refine\",\"body\":\"1cf7c41e922f\",\"hops\":1,\"asked\":\"1cf7c41e922f\",\"alone\":\"reviewer\",\"v\":1} -->\n<!-- workline:sticky=line/state -->"
run: {route: issue, target: {issue: 9}, ai: none, input: {reconcile: list}}
expect:
  status: pass
  summary: "issue: #9 due, the reviewer: not started"
  agent-calls: 0
  findings:
    - {rule: state-review-missing, where: "#9"}
