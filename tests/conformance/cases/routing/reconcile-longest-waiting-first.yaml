case: routing/reconcile-longest-waiting-first
about: >
  More steps due than reconcile-max: the reconciler starts the one
  waiting longest first, not the backlog's first (#960). #3, new in
  Ready since 15:47, has waited longer than #2, due again since its
  last run at 18:04; #1, due again on a record that says no last run,
  goes after both. Before, #1 and #2 came first each run, and a new
  issue waited behind the old ones for hours.
given:
  repo: tested
  config:
    routing: {events: {issue: [developer]}, reconcile-max: 2}
  forge:
    issues:
      - id: 1
        title: "Add"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to add.\n"
        labeled: {"workline:ready": "2026-10-01T09:00:00Z"}
        comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"0ld\",\"labeled\":\"2026-10-01T09:00:00Z\",\"hops\":1} -->\n<!-- workline:sticky=line/state -->"]
      - id: 2
        title: "Subtract"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to subtract.\n"
        labeled: {"workline:ready": "2026-10-01T09:00:00Z"}
        comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"0ld\",\"labeled\":\"2026-10-01T09:00:00Z\",\"hops\":1,\"ran\":\"2026-11-03T18:04:00Z\"} -->\n<!-- workline:sticky=line/state -->"]
      - id: 3
        title: "Multiply"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n"
        labeled: {"workline:ready": "2026-11-03T15:47:00Z"}
run: {route: reconcile, open-merge-request: true, ai: "fake:developer-nothing", input: {reconcile: list}}
expect:
  status: pass
  agent-calls: 0
  summary: "reconcile: 2 issues due: #3 #2"
  findings: [{rule: reconcile-left, level: info, where: "#1", message: "past reconcile-max (2)"}]
  forge:
    issues:
      - {id: 1, comments: 1}
      - {id: 3, comments: 0}
