case: routing/reconcile-lists-a-green-draft
about: >
  The reconciler catches a developer's Draft its rounds made green
  (#969): every project check at its head is green, no cap reached,
  nothing new to fix. With `--input reconcile=list` it says the pull
  request due, so its round marks it ready; it starts nothing and asks
  no agent. A Draft whose check still runs is not listed.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 workline/developer/3 && git checkout -q -b workline/developer/4 main && git push -q origin workline/developer/4 && git checkout -q main"
  config:
    routing: {events: {issue: [developer]}}
  forge:
    head-checks:
      workline/developer/3:
        - {name: test, workflow: test, state: success, job: 41}
      workline/developer/4:
        - {name: test, workflow: test, state: pending, job: 46}
    issues:
      - {id: 3, title: "Multiply two numbers", labels: ["workline:developing"], body: "## Need\n\nI want to multiply.\n"}
      - {id: 4, title: "Divide two numbers", labels: ["workline:developing"], body: "## Need\n\nI want to divide.\n"}
    merge-requests:
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        draft: true
        comments:
          - "**The developer**'s record.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
      - id: 5
        branch: workline/developer/4
        title: "Divide two numbers"
        body: "Closes #4"
        draft: true
        comments:
          - "**The developer**'s record.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":4,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {route: reconcile, open-merge-request: true, ai: "fake:developer-nothing", input: {reconcile: list}}
expect:
  status: pass
  summary: "reconcile: 0 issues due:; 1 review round due: merge request 2"
  agent-calls: 0
  forge:
    merge-requests:
      - {id: 2, draft: true, comments: 2}
      - {id: 5, draft: true, comments: 2}
