case: routing/ready-back-from-scope-says-its-round
about: >
  #4 back to ready from the developer's Scope ask (#1013), its line run
  on a person's machine: its step is the review round on pull request 5,
  said with its command; the developer is not run to claim it again.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git checkout -q -b workline/developer/4 && git push -q origin main workline/developer/4 && git checkout -q main"
    - "sed -i \"s/@head4@/$(git rev-parse workline/developer/4)/g\" \"$FORGE_FILE\""
  config:
    routing: {events: {issue: [developer]}}
  forge:
    head-checks:
      workline/developer/4:
        - {name: test, workflow: test, state: failure, job: 46}
    issues:
      - {id: 4, title: "Divide two numbers", labels: ["workline:ready"], body: "## Need\n\nI want to divide.\n"}
    merge-requests:
      - id: 5
        branch: workline/developer/4
        title: "Divide two numbers"
        body: "Closes #4"
        comments:
          - "**The developer**'s record.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":4,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1,\"checks-at\":\"@head4@\",\"widen\":{\"at\":\"@head4@\",\"scope\":\"x\",\"files\":[\"cases/div.txt\"]}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {route: issue, target: {issue: 4}, open-merge-request: true, ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "issue: #4's step is the review round on merge request 5, due"
  agent-calls: 0
  findings:
    - {rule: review-round-due, level: info, where: "merge request 5", message: "run `workline develop --merge-request 5`"}
  forge:
    issues:
      - {id: 4, labels: ["workline:ready"]}
    merge-requests:
      - {id: 5, comments: 2}
