case: routing/state-own-edit-not-due-again
about: >
  A role's own write is no new input for it (ADR-0063, §3, amended): the
  product owner's run writes the issue's Scope, and the line
  records the body as that run left it. The same step asked again, with
  nothing else changed, runs nothing: no second agent call.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner, tester, developer]}}
  forge:
    issues:
      - id: 9
        title: Rows lost
        body: "## Need\n\nThe monthly report counts every sale.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n"
        author: ann
        insider: true
        labels: [workline:to-refine]
        labeled: {"workline:to-refine": "2026-11-08T06:40:00Z"}
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {route: issue, target: {issue: 9}, ai: fake:refine-scope-only, then: again}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: done, where: "#9", message: "Refined #9: Scope"}
    - {rule: state-acted, where: "#9"}
  forge:
    issues:
      - id: 9
        labels: [workline:to-refine]
        body-contains: "`WriteRows` in `src/export/csv.go`."
