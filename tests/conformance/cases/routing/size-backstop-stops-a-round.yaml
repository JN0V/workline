case: routing/size-backstop-stops-a-round
about: >
  A review round is stopped at its issue's backstop (ADR-0064, §5; the
  panel of 2026-11-08; #1174). #4's runs, its pull request's rounds
  counted, spent 1.7M fresh tokens, past its backstop of 1.6M; a red
  check makes a round due on pull request 5. The round is not due: the
  line says it on the pull request, kept open, and blocks #4 for a
  person, no agent called.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git checkout -q -b workline/developer/4 && git push -q origin main workline/developer/4 && git checkout -q main"
    - "sed -i \"s/@head4@/$(git rev-parse workline/developer/4)/g\" \"$FORGE_FILE\""
  config:
    routing: {events: {issue: [developer]}}
  forge:
    head-checks:
      workline/developer/4:
        - {name: test, workflow: test, state: failure, job: 46}
    issues:
      - id: 4
        title: "Divide two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to divide.\n"
        comments:
          - "**workline's line** last woke the developer on this issue.\n\n<!-- workline:line-record {\"state\":\"ready\",\"body\":\"0a1b2c3d4e5f\",\"hops\":1,\"spent\":{\"product-owner\":[300000],\"tester\":[400000],\"developer\":[500000,500000]}} -->\n<!-- workline:sticky=line/state -->"
    merge-requests:
      - id: 5
        branch: workline/developer/4
        title: "Divide two numbers"
        body: "Closes #4"
        comments:
          - "**The developer**'s record.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":4,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1,\"checks-at\":\"@head4@\",\"widen\":{\"at\":\"@head4@\",\"scope\":\"x\",\"files\":[\"cases/div.txt\"]}} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {route: issue, target: {issue: 4}, open-merge-request: true, ai: "fake:developer-nothing"}
expect:
  status: pass
  summary: "issue: #4's step is the review round on merge request 5, not run: #4 blocked at its backstop"
  agent-calls: 0
  findings:
    - {rule: backstop-crossed, level: warn, where: "merge request 5", message: "1.7M fresh tokens spent on it, all runs, reaching its backstop of 1.6M"}
  no-findings: [{rule: review-round-due, where: "merge request 5"}]
  forge:
    issues:
      - {id: 4, labels: ["workline:blocked"], comment-contains: ["\"backstop\":1600000"]}
    merge-requests:
      - {id: 5, comments: 2}
