case: routing/size-x-large-is-a-persons
about: >
  The product owner never grants x-large (ADR-0064, §3; #1171): asked on
  #3's size, it answers `size` with `tier: x-large`, and keeps #3 blocked
  for a person. The grant is dropped, said: x-large is a person's answer,
  so the backstop never follows a tier the line granted itself. No tier
  label is put; #3 waits for a person.
given:
  repo: tested
  setup:
    - "mkdir -p src && awk 'BEGIN { printf \"# \"; for (i = 1; i <= 2000; i++) printf \"%050d\", i; printf \"\\n\" }' > src/wide.sh && git add src && git commit -qm 'src' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [product-owner, tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        author: ann
        insider: true
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Scope\n\n- `src/wide.sh`\n"
run: {route: reconcile, open-merge-request: true, ai: "cmd:sh $FIXTURES/agents/size-granted.sh x-large blocked", then: again}
expect:
  agent-calls: 1
  findings:
    - {rule: size-person, where: "#3", message: "`x-large` is a person's answer, never the role's"}
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-lacks: ["Granted #3"]
