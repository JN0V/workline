case: routing/item-not-ready
about: An issue without validation criteria cannot move to ready; its labels do not change.
given:
  repo: basic
  forge: {issues: [{id: 7, body: "## Need\nExport as CSV\n## Verification\nA test exports three rows\n## Scope\nsrc/export", labels: [], comments: []}]}
run: {route: ready, item: 7}
expect: {status: block, findings: [{rule: not-ready, where: "Validation"}], forge: {issues: [{id: 7, labels: []}]}}
