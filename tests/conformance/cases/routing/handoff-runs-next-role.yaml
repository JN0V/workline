case: routing/handoff-runs-next-role
about: A declared handoff runs the next role on the "handoff" event, after the role that asked.
given:
  repo: released
  config: {routing: {events: {merge: [hands-over]}, handoffs: [{from: hands-over, to: documentalist}]}}
run: {route: merge, ai: "fake:changelog-and-handoff"}
expect: {status: pass, steps: [hands-over, "documentalist (handoff)"]}
