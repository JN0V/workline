case: routing/question-unanswered-wakes-the-product-owner
about: >
  Normal, no answer, on the line (ADR-0060): an issue in refine the
  product owner acted on, its body and labels as then, waits on a
  question with no answer for 24 h, counted from the question's comment
  as the forge dates it. The reconciler tells the delay passed, with no
  agent, and wakes the product owner once: it takes its assumption, and
  the issue moves on. The record keeps what it woke it for.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner]}}
  forge:
    issues:
      - id: 9
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: Should `--verbose=false` print the plain line, as `--short` does?\n\n<!-- workline:product-owner/ask -->", created: "2026-10-01T23:50:00Z"}
          - "**workline's line** last woke the product-owner on this issue, in its state refine (1 state step so far).\n\n<!-- workline:line-record {\"state\":\"refine\",\"body\":\"206c8bcea856\",\"hops\":1} -->\n<!-- workline:sticky=line/state -->"
run: {route: reconcile, ai: "fake:assume-plain-line"}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: state-timeout, level: info, where: "#9", message: "its question of 2026-10-01 23:50 UTC got no answer in 24 h (acts.ask.wait): the product-owner takes its assumption"}
  forge:
    issues:
      - id: 9
        labels: [workline:ready]
        body-contains: ", the question of 2026-10-01 unanswered after 24 h: `--verbose=false` prints the plain line, as other flags do."
        comment-contains: "\"timeout\":\"ask=1\""
