case: routing/wip-ready-untested-put-back-said
about: >
  A person put workline:ready back on an issue the line had moved to
  Tests for its tests: the move undone is theirs to make again
  (ADR-0059, amended). The line does not move it again: it says once on
  the issue which label a person must put on it, its labels as they
  were, and the issue is still not counted in Ready's limit.
given:
  repo: tested
  config:
    routing: {events: {issue: [tester, developer]}, wip: {ready: 1}}
  forge:
    issues:
      - id: 1
        title: "Add"
        labels: ["workline:ready"]
        labeled: {"workline:ready": "2026-11-01T09:00:00Z"}
        body: "## Need\n\nI want to add.\n\n## Validation\n\n- **Two and three:** Given the library, When I add 2 and 3, Then I get 5.\n"
        comments: ["**workline's line** moves this issue to tests, for its tests.\n\n<!-- workline:line-record {\"state\":\"tests\",\"body\":\"0\",\"labeled\":\"2026-10-31T09:00:00Z\",\"hops\":2,\"retest\":\"ready\"} -->\n<!-- workline:sticky=line/state -->"]
run: {route: reconcile, open-merge-request: true, ai: "fake:tester-two-scenarios"}
expect:
  status: pass
  agent-calls: 0
  findings: [{rule: state-untested-kept, level: info, where: "#1", message: "a person put workline:ready back after the line moved it to tests"}]
  forge:
    issues:
      - id: 1
        labels: ["workline:ready"]
        comments: 1
        comment-contains: ["**workline's line** finds this issue without its tests, and leaves it.", "by its label `workline:needs-tests`", "\"retest-kept\":\"2026-11-01T09:00:00Z\""]
