case: routing/tester-block-is-due
about: >
  A pull request whose line's verdict is blocked at the tester's green
  proof, with no comment yet: the reconcile, listing, does not leave
  its issue at "waits on its review, its checks, then its merge". It
  says the issue waits for a named person (the proof cannot run here),
  and the step that blocked.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main"
  config:
    routing: {events: {issue: [developer]}}
  forge:
    statuses:
      - {commit: "workline/developer/3", name: workline/verdict, state: failure, description: "red: the line's verdict on its head is block (tester block): check-error", by: workline-bot}
    issues:
      - {id: 3, title: "Multiply two numbers", labels: ["workline:developing"], body: "## Need\n\nI want to multiply.\n"}
    merge-requests:
      - id: 2
        branch: workline/developer/3
        title: "Multiply two numbers"
        body: "Closes #3"
        comments:
          - "**The developer**'s record.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"round\":1,\"review-runs\":1} -->\n<!-- workline:sticky=developer/code -->"
          - "**workline reviewer** — 0 findings on the change.\n\n<!-- workline:record reviewed=1111111 runs=1 -->\n<!-- workline:sticky=reviewer/summary -->"
run: {route: reconcile, open-merge-request: true, ai: none, input: {reconcile: list}}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: state-waits, where: "#3", message: "tester"}
    - {rule: state-waits, where: "#3", message: "person"}
