case: routing/apply-defers-handoff
about: "`workline apply` records a handoff but runs no role; it says the next role is still to run."
given:
  repo: released
  config: {routing: {events: {merge: [hands-over]}, handoffs: [{from: hands-over, to: documentalist}]}}
run: {route: merge, ai: "fake:changelog-and-handoff", no-apply: true, then: resume}
expect: {status: pass, applied: [patch, handoff], findings: [{rule: handoff-deferred}]}
