case: routing/size-split-on-a-crossing
about: >
  The product owner splits an issue too big for the line (ADR-0064, step
  4; #1172): `split` is off, as by default. On #3, waiting for its tests,
  the tester's prompt is over its context budget; asked on its size, the
  product owner, told it may split it, answers a split `too-big: true`
  into two parts that pass apart, and keeps #3 blocked for a person. Past
  its size, split turns on: #4 and #5 are opened, to refine, and #3
  stays open, blocked, until a person accepts it from its parts.
given:
  repo: tested
  setup:
    - "mkdir -p src && awk 'BEGIN { printf \"# \"; for (i = 1; i <= 2000; i++) printf \"%050d\", i; printf \"\\n\" }' > src/wide.sh && git add src && git commit -qm 'src' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [product-owner, tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply and divide two numbers"
        labels: ["workline:needs-tests"]
        author: ann
        insider: true
        body: "## Need\n\nI want to multiply and divide.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **Six by three:** Given the library, When I divide 6 by 3, Then I get 2.\n\n---\n\n## Scope\n\n- `src/wide.sh`\n"
run: {route: reconcile, open-merge-request: true, ai: "cmd:sh $FIXTURES/agents/size-split.sh 3 big blocked", then: again}
expect:
  agent-calls: 1
  findings:
    - {rule: state-revisit, level: info, where: "#3", message: "the tester's run on it crossed its size"}
  no-findings: [{rule: split-depth}]
  run-files:
    in/task.md: {contains: ["`split` with `too-big: true`"]}
  forge:
    issues:
      - {id: 3, labels: ["workline:blocked"], comment-contains: ["split: [4, 5]"]}
      - {id: 4, title: "Multiply two numbers", labels: ["workline:to-refine", "workline:draft"]}
      - {id: 5, title: "Divide two numbers"}
