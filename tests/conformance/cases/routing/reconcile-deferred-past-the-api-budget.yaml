case: routing/reconcile-deferred-past-the-api-budget
about: >
  The reconciler, its forge's API budget under a tenth and the reset
  more than a few minutes away, is deferred too (#804): it lists none
  due, reads no issue's comments, and ends with no failure; the next
  hour's reconcile, after the reset, starts what is due.
given:
  repo: tested
  config:
    routing: {events: {issue: [developer]}}
  forge:
    budget: {resource: graphql, remaining: 0, limit: 1000, reset-in: 1800}
    issues:
      - {id: 3, title: "Multiply", labels: ["workline:ready"], body: "## Need\n\nI want to multiply.\n"}
run: {route: reconcile, open-merge-request: true, ai: "fake:developer-nothing", input: {reconcile: list}}
expect:
  status: pass
  summary: "reconcile: deferred: API budget low: 0 of 1000 graphql calls left this hour"
  agent-calls: 0
  findings: [{rule: api-budget-deferred, level: warn}]
  forge:
    issues:
      - {id: 3, comments: 0, comments-read: 0}
