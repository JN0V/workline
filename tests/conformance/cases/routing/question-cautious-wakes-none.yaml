case: routing/question-cautious-wakes-none
about: >
  Cautious waits for the answer, however long (ADR-0060): a question
  unanswered for a week wakes no role; the issue waits in refine, said
  with the question's day (#1082).
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner]}}
    roles:
      product-owner:
        settings:
          autonomy: cautious
  forge:
    issues:
      - id: 10
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: Should `--verbose=false` print the plain line, as `--short` does?\n\n<!-- workline:product-owner/ask -->", created: "2026-10-01T23:50:00Z"}
          - "**workline's line** last woke the product owner on this issue, in its state refine (1 state step so far).\n\n<!-- workline:line-record {\"state\":\"refine\",\"body\":\"206c8bcea856\",\"hops\":1} -->\n<!-- workline:sticky=line/state -->"
run: {route: reconcile, ai: none, input: {reconcile: list}}
expect:
  status: pass
  agent-calls: 0
  summary: "reconcile: 0 issues due:"
  findings:
    - {rule: state-waits, level: info, where: "#10", message: "its question of 2026-10-01 23:50 UTC waits on its reporter, until it is answered (acts.ask.wait: never)"}
  no-findings: [{rule: state-timeout}, {rule: state-acted}]
