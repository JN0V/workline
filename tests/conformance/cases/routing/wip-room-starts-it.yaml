case: routing/wip-room-starts-it
about: >
  When Ready has room again, the reconciler finds the waiting issue's
  step due (ADR-0059, decision 9): one ready issue went to Doing, Ready
  holds 4 of 5. In CI it says the issue due, for the job that starts
  its run; nothing written here, no agent asked.
given:
  repo: tested
  config:
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - {id: 1, title: "Add", labels: ["workline:developing"], body: "## Need\n\nI want to add.\n"}
      - {id: 2, title: "Subtract", labels: ["workline:ready"], body: "## Need\n\nI want to subtract.\n"}
      - {id: 3, title: "Divide", labels: ["workline:ready"], body: "## Need\n\nI want to divide.\n"}
      - {id: 4, title: "Round", labels: ["workline:ready"], body: "## Need\n\nI want to round.\n"}
      - {id: 5, title: "Negate", labels: ["workline:ready"], body: "## Need\n\nI want to negate.\n"}
      - id: 6
        title: "Multiply"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n"
        comments: ["**workline's line** waits to start this issue's next step.\n\n<!-- workline:line-record {\"state\":\"\",\"body\":\"\",\"hops\":0,\"waits\":\"ready\"} -->\n<!-- workline:sticky=line/state -->"]
run: {route: reconcile, open-merge-request: true, ai: "fake:tester-two-scenarios", input: {reconcile: list, skip: developer}}
expect:
  status: pass
  agent-calls: 0
  summary: "reconcile: 1 issue due: #6"
  findings: [{rule: state-wakes, level: info, where: "#6", message: "its state, tests, wakes the tester"}]
  forge:
    issues:
      - {id: 6, comments: 1}
