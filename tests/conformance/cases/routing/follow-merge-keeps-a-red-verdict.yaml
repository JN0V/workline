case: routing/follow-merge-keeps-a-red-verdict
about: "A person's commit blocks the line — its subject is no conventional commit; main moves, and `workline follow` merges it into their pull request, settling a `checked` line (ADR-0041). The line on that merge judges the commits before it, through its first parent: still blocked, never turned green unjudged."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run:
  follow: [--base, main]
  then-line: {event: merge-request, branch: feat/sessions, range: "main..HEAD", ai: none}
expect:
  status: block
  findings:
    - {rule: merged, where: feat/sessions}
    - {rule: format, level: block}
  merged: {feat/sessions: main}
  agent-calls: 0
