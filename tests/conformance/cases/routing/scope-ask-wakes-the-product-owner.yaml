case: routing/scope-ask-wakes-the-product-owner
about: >
  The developer blocked its issue to ask for a file outside its Scope
  (#921): its round's fix needs it. The reconciler, seeing it blocked
  for the first time, wakes the product owner at once, no news needed,
  told the developer asks. It widens the Scope with the file and sends
  the issue back to ready, where the developer resumes on its pull
  request.
given:
  repo: tested
  config:
    routing: {events: {issue: [product-owner]}}
  forge:
    issues:
      - id: 3
        title: "Multiply"
        labels: ["workline:blocked"]
        author: ann
        insider: true
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given 2 and 3, When I multiply, Then I get 6.\n\n---\n\n## Verification\n\nA test of mul.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
        comments:
          - "**workline's line** last woke the developer.\n\n<!-- workline:line-record {\"state\":\"ready\",\"body\":\"8a828a06be19\",\"hops\":3} -->\n<!-- workline:sticky=line/state -->"
          - "**The developer** blocks this issue.\n\n- **Why**: the fix of pull request 2 needs `run-tests.sh`, outside its Scope: it asks the product owner to widen it.\n- **Next**: the product owner widens the Scope and moves it back to ready, the developer resumes on pull request 2; or keeps it blocked, why not said.\n\n<!-- workline:scope-ask at=1111111 files=run-tests.sh -->\n<!-- workline:sticky=developer/claim -->"
run: {route: reconcile, open-merge-request: true, ai: "fake:widen-scope-and-unblock"}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: state-revisit, level: info, where: "#3", message: "blocked, read again by the product-owner: the developer asks to widen its Scope with `run-tests.sh`"}
  run-files:
    in/task.md: {contains: ["the developer asks to widen its Scope with `run-tests.sh`", "`unblock` it `to: ready`"]}
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        body-contains: "- `run-tests.sh`: the runner the fix changes"
        comment-contains: ["Moved #3 out of Blocked, to ready"]
