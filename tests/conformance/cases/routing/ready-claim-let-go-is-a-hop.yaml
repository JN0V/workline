case: routing/ready-claim-let-go-is-a-hop
about: >
  Back from Doing to Ready is a state step (#894): #3, its claim let go,
  wakes the developer again, one hop more in its record, which now says
  when the line woke it and the issues the developer held then (#5). A
  developer taking and letting go an issue for good stops at the hop
  cap: #4, its claim let go at 8 hops, goes to Blocked, the count said
  on it, never woken in a loop. No agent asked.
given:
  repo: tested
  config:
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply"
        labels: ["workline:ready"]
        labeled: {"workline:ready": "2026-11-01T10:48:29Z", "workline:developing": "2026-11-01T10:49:33Z"}
        body: "## Need\n\nI want to multiply.\n"
        comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"8a828a06be19\",\"labeled\":\"2026-11-01T10:48:29Z\",\"hops\":1,\"woke\":\"2026-11-01T10:48:40Z\"} -->\n<!-- workline:sticky=line/state -->"]
      - id: 4
        title: "Multiply again"
        labels: ["workline:ready"]
        labeled: {"workline:ready": "2026-11-01T10:48:29Z", "workline:developing": "2026-11-01T10:49:33Z"}
        body: "## Need\n\nI want to multiply.\n"
        comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"8a828a06be19\",\"labeled\":\"2026-11-01T10:48:29Z\",\"hops\":8,\"woke\":\"2026-11-01T10:48:40Z\"} -->\n<!-- workline:sticky=line/state -->"]
      - {id: 5, title: "Divide", labels: ["workline:developing"], body: "## Need\n\nI want to divide.\n"}
run: {route: reconcile, open-merge-request: true, ai: none}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: state-freed, level: info, where: "#3"}
    - {rule: state-wakes, level: info, where: "#3", message: "its state, ready, wakes the developer"}
    - {rule: hops-capped, level: warn, where: "#4", message: "9 state steps on this issue, past max-hops (8)"}
  forge:
    issues:
      - {id: 3, labels: ["workline:ready"], comments: 1, comment-contains: ["\"hops\":2", "\"woke\":\"20", "\"held\":[5]"]}
      - {id: 4, labels: ["workline:blocked"], comments: 1, comment-contains: ["**workline's line** blocks this issue.", "\"hops\":9"]}
