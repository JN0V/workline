case: routing/size-split-predicted-at-ready
about: >
  The product owner predicts an issue's size at ready (ADR-0064, §2;
  #1172): the line wakes it on #3, in refine. Its task tells it #3's
  normal here, the seed of 400k fresh tokens an issue, no issue done yet,
  and to split it, or grant it `large`, when well past it, before any
  other role runs on it. It predicts #3 too big, and splits it
  `too-big: true`, `split` off as by default: #4 and #5 are opened, and
  #3 is not made ready.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    routing: {events: {issue: [product-owner, tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply and divide two numbers"
        labels: ["workline:to-refine"]
        author: ann
        insider: true
        body: "## Need\n\nI want to multiply and divide.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **Six by three:** Given the library, When I divide 6 by 3, Then I get 2.\n\n---\n\n## Verification\n\nA shell test a scenario.\n\n## Scope\n\n- `lib.sh`: `mul` and `div` beside `add`.\n"
run: {route: reconcile, open-merge-request: true, ai: "cmd:sh $FIXTURES/agents/size-split.sh 3 big"}
expect:
  agent-calls: 1
  run-files:
    in/task.md: {contains: ["Its size, before `ready`", "400k fresh tokens an issue of its kind (the seed", "`split` it with `too-big: true`", "`size` with `tier: large`, then `ready`"]}
  forge:
    issues:
      - {id: 3, labels: ["workline:to-refine"], comment-contains: ["split: [4, 5]"]}
      - {id: 4, title: "Multiply two numbers"}
      - {id: 5, title: "Divide two numbers"}
