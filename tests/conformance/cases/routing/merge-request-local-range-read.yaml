case: routing/merge-request-local-range-read
about: >
  With `forge: local`, `workline route merge-request --target
  merge-request:1` with no range, its branch checked out, judges the
  range the merge request names, its base to its branch: no engine
  error for a missing input (#1285).
given:
  repo: basic
  setup:
    - "git checkout -qb workline/developer/1 && echo one > one.txt && git add one.txt && git commit -qm 'fix: write one'"
    - |
      mkdir -p .git/workline/merge-requests && cat > .git/workline/merge-requests/1.md <<'MR'
      ---
      title: "fix: write one"
      state: open
      labels: []
      branch: workline/developer/1
      base: main
      ---

      Closes #1
      MR
  config:
    forge: local
    routing: {events: {merge-request: [committer]}}
run: {route: merge-request, target: {merge-request: 1}, ai: none}
expect:
  status: pass
  steps: [committer]
  no-findings: [{rule: engine-error}]
