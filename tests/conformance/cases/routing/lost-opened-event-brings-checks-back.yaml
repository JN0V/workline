case: routing/lost-opened-event-brings-checks-back
about: >
  Lost opened event: an open line pull request (the developer's branch
  for issue 3) whose head has had no check suite from GitHub Actions for
  an hour, past the 15 minutes the reconciler allows. The reconciler
  brings the head's checks back by pushing the branch up to date with
  main as the App (workline-bot): main moved on since the branch left
  it, so origin's branch becomes its own tip merged with main's tip.
given:
  repo: tested-draft
  setup:
    - "git checkout -q -b workline/developer/3 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && git commit -qam 'feat: mul for #3' -m 'Workline-Role: developer' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/developer/3 && git checkout -q main && echo news > NEWS.md && git add NEWS.md && git commit -qm 'docs: news' && git push -q origin main"
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - {id: 3, title: "Multiply two numbers", labels: ["workline:developing"], body: "## Need\n\nI want to multiply.\n"}
    merge-requests:
      - id: 2
        branch: workline/developer/3
        base: main
        title: "Multiply two numbers"
        body: "Closes #3"
        pushes: [{head: workline/developer/3, at: "2026-11-05T07:00:00Z", by: workline-bot}]
        comments: []
run: {route: reconcile, open-merge-request: true, ai: "fake:developer-nothing"}
expect:
  agent-calls: 0
  merged: {workline/developer/3: main}
