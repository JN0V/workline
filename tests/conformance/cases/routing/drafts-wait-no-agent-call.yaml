case: routing/drafts-wait-no-agent-call
about: >
  Drafts waiting out the product owner's delay call no agent (#1127):
  the product owner wrote the Validation as a draft, so the body
  changed since the line's last step, and the reviewer read the body as
  it is with no important finding. Nothing the product owner could
  write moves it before a person's answer or the delay: the line says
  the drafts wait, and the day they are taken as written. No agent call.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner, reviewer]}}
  forge:
    issues:
      - id: 9
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine, workline:proposed]
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n<!-- workline:draft -->\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - {body: "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nbody: 1cf7c41e922f\n```\n\n<!-- workline:sticky=product-owner/state -->", created: "2099-01-01T09:00:00Z"}
          - "**workline's line** last woke the product owner on this issue, in its state refine (1 state step so far).\n\n<!-- workline:line-record {\"state\":\"refine\",\"body\":\"0a1b2c3d4e5f\",\"hops\":1} -->\n<!-- workline:sticky=line/state -->"
          - "**The reviewer** read this spec: nothing holds it from ready.\n\n<!-- workline:spec-review body=1cf7c41e922f round=1 open=0 in= -->\n<!-- workline:sticky=reviewer/spec -->"
run: {route: issue, target: {issue: 9}, ai: "fake:ready-nine"}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: state-waits, level: info, where: "#9", message: "its drafts wait on a person's yes: the product owner takes them as written on 2099-01-02 09:00 UTC (acts.ask.wait: 24 h)"}
  no-findings: [{rule: state-wakes}, {rule: state-timeout}]
  forge:
    issues:
      - {id: 9, labels: [workline:to-refine, workline:proposed], comments: 3}
