case: routing/state-tests-wake-the-tester
about: >
  An issue the product owner refined goes to its tests,
  workline:needs-tests (ADR-0059, decision 3). The issue line naming it
  runs the role its state wakes, the tester, read from the routing's
  table, not every step of the event: its tests written, proven red,
  opened as a Draft. Each scenario has its test in the Draft's Tests
  table and the tests pass the project's lint: the issue moves to ready,
  every other state's label off, said on it. No agent decides the move.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    gates: {lint: {checks: [{id: fixme, run: "! grep -rq FIXME tests", output: exit}]}}
    routing: {events: {issue: [tester, developer], merge-request: ["gate:lint"]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests", "workline:to-refine"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-two-scenarios"}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: state-wakes, level: info, where: "#3", message: "its state, tests, wakes the tester"}
    - {rule: state-moved, level: info, where: "#3", message: "the issue moves to ready"}
  pushed:
    workline/tester/issue-3:
      tests/test_mul_two_by_three.sh: "Scenario: Two by three"
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        comments: 1
        comment-contains: ["**The tester** wrote the acceptance tests of this issue, as a Draft.", "each of its 2 scenarios has its test", "- **Next**: it is ready"]
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        body-contains: ["Refs #3", "## Tests", "| Two by three |", "| By zero |"]
