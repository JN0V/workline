case: routing/ready-patch-not-applied-said-once
about: >
  Said once: #3's developer run failed twice in a row because its
  patch did not apply. The stop is said in one comment on the issue,
  which names the error as printed, the two runs, and what restarts
  the work: its tester's Draft or `main` moving.
given:
  repo: tested
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n"
        comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"8a828a06be19\",\"hops\":1,\"errors\":{\"by\":{\"apply\":2},\"first\":{\"apply\":\"2026-11-05T05:00:00Z\"},\"last\":\"2026-11-05T07:00:00Z\",\"kind\":\"apply\",\"said\":\"the diff does not apply: cmd/workline/main.go\"},\"v\":1} -->\n<!-- workline:sticky=line/state -->"]
run: {route: reconcile, open-merge-request: true, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - id: 3
        comments: 1
        comment-contains: ["the diff does not apply: cmd/workline/main.go", "2", "Draft", "`main`"]
