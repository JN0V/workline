case: routing/parent-early-yes-closes
about: >
  A person labelled a split parent workline:accepted before the line
  proposed its closing, and its last part closed before the line read it
  again (#1213). A yes on a parent stands while all its parts are
  closed: the reconciler wakes the product owner on it with no agent,
  and the parent is closed on that yes, the yes named — never left open
  with the label on and nothing to wake it.
given:
  repo: tested
  config:
    routing: {events: {issue: [product-owner]}}
  forge:
    sub-issues: true
    issues:
      - id: 4
        title: "Time-lapse counts"
        labels: [workline:accepted]
        author: ann
        insider: true
        body: "## Need\n\nThe time-lapse counter is right.\n\n## Verification\n\n- Counts only frames saved."
        label-events: [{label: workline:accepted, added: true, author: dev, insider: true, created: "2026-11-08T18:00:00Z"}]
        comments:
          - "```yaml\nsources: [src/calc.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nsplit: [6, 7]\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline's line** waits for a person on this issue.\n\n<!-- workline:line-record {\"state\":\"\",\"body\":\"7cbc981adecb\",\"hops\":0,\"v\":1,\"labels\":\"-\",\"parts\":\"6\"} -->\n<!-- workline:sticky=line/state -->"
      - {id: 6, title: "Count only frames saved", body: "Part of #4.", labels: [], parent: 4, closed: true, reason: completed, closed-by: [{kind: pull-request, ref: "#13", text: "fix: count frames saved"}]}
      - {id: 7, title: "Number restored frames", body: "Part of #4.", labels: [], parent: 4, closed: true, reason: completed, closed-by: [{kind: pull-request, ref: "#14", text: "fix: number restored frames"}]}
run: {route: reconcile, open-merge-request: true, ai: "fake:blocked-three"}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: state-parent, level: info, where: "#4", message: "a parent, 2 of its 2 parts closed, a person's yes on it"}
    - {rule: done-as-accepted, where: "#4", message: "Closed #4 as completed"}
  no-findings: [{rule: parent-to-accept, where: "#4"}]
  forge:
    issues:
      - id: 4
        closed: true
        comment-contains: ["Accepted: its parts are closed", "@dev having accepted it (workline:accepted)"]
