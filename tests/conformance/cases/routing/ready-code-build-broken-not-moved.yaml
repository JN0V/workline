case: routing/ready-code-build-broken-not-moved
about: >
  The developer's code still does not build once asked again (#1083): a
  machine error, never a Draft opened red nor an issue left silent
  (ADR-0063, I3). Nothing is pushed, no label put on: #3 keeps
  workline:ready and its hops, and the line's record says the error and
  when the developer runs again.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3 && git checkout -q main"
  env: {ALWAYS: "1", WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    roles:
      tester:
        settings:
          test-command: >-
            sh -n lib.sh || { printf '<testsuites><testsuite name="tests"><testcase classname="tests" name="test_add" time="0.01"/></testsuite></testsuites>' > {report}; exit 1; }; sh run-tests.sh {report}
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "cmd:sh $FIXTURES/agents/developer-writes-mul-broken-once.sh"}
expect:
  agent-calls: 2
  findings:
    - {rule: state-wakes, level: info, where: "#3", message: "its state, ready, wakes the developer"}
    - {rule: build-broken, where: "#3", message: "its code does not build"}
  no-findings: [{rule: proof-red}]
  not-pushed: [workline/developer/3]
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        comment-contains: ["**workline's line** saw the developer's run on this issue fail (build).", "1 of 2 tries", "\"hops\":1", "\"errors\":{\"by\":{\"build\":1}"]
