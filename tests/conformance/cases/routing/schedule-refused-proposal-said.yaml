case: routing/schedule-refused-proposal-said
about: 'On schedule (fail-fast false), an agent''s proposal still refused once asked again is upkeep left for later (ADR-0037, amended): nothing of it applied, each refusal said as a warning, the step passes — the line is not failed by a check that did its job. Anything else that does not pass still fails it.'
given:
  repo: documented
  setup: ["sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"]
run: {role: documentalist, event: schedule, ai: "fake:doc-fixed-misquoted"}
expect:
  status: pass
  agent-calls: 2
  applied: []
  findings: [{rule: misquoted, where: docs/tech/auth.md, level: warn}]
  files:
    docs/tech/auth.md: {contains: "Access tokens last one hour."}
