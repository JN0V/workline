case: routing/claim-part-of-merged-blocks
about: >
  The developer's pull request merged as part of the issue, `Part of
  #3`, a part left for a person: the issue stays open and claimed, no
  pull request open for it. Past claim-hours, on the body its agent ran
  on, the line blocks it for a person, its reason written: never a
  developer's run again on the same input, nor a second pull request.
given:
  repo: tested
  config:
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply"
        labels: ["workline:developing"]
        labeled: {"workline:ready": "2025-12-31T09:00:00Z", "workline:developing": "2026-01-01T09:00:00Z"}
        body: "## Need\n\nI want to multiply.\n"
        comments: ["**The developer** takes this issue.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"code\":[\"lib.sh\"],\"body\":\"8a828a06be19\"} -->\n<!-- workline:sticky=developer/claim -->"]
run: {route: reconcile, open-merge-request: true, ai: "fake:developer-nothing"}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: no-code-spent, level: warn, where: "#3", message: "or its pull request merged part of it or closed, and its claim, workline:developing put on 2026-01-01, passed claim-hours (24) with its body unchanged"}
  no-findings: [{rule: state-wakes}, {rule: claim-released}]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["its body unchanged", "a person"]
