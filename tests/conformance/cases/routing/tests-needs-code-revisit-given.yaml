case: routing/tests-needs-code-revisit-given
about: >
  A tester said once it lacks calc/calc.go, and the issue was blocked
  before it was given it (#1157). A revisit moved it back to its tests,
  nothing in it changed. The tester runs once, given that file, not on
  the input it said lacks code; said lacking again, the step moves the
  issue to Blocked.
given:
  repo: go-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA Go test.\n\n## Scope\n\n- A `Mul` function beside `Add`.\n"
        comments:
          - "**workline's line** blocks this issue.\n\n<!-- workline:line-record {\"state\":\"blocked\",\"from\":\"tests\",\"body\":\"7ac82fbdcadd\",\"hops\":1,\"since\":\"2026-10-28T08:00:00Z\",\"revisited\":\"2026-11-05T07:00:00Z\",\"v\":1,\"last-run\":{\"tester\":{\"state\":\"tests\",\"body\":\"7ac82fbdcadd\",\"labels\":\"-\",\"said\":\"calc/calc.go\",\"times\":1}}} -->\n<!-- workline:sticky=line/state -->"
run: {route: issue, target: {issue: 3}, ai: "fake:tester-needs-code"}
expect:
  agent-calls: 1
  findings:
    - {rule: state-given, level: info, where: "#3", message: "the tester said it lacks code on this same input: run again, given calc/calc.go"}
    - {rule: needs-spent, level: warn, where: "#3", message: "the tester said again it lacks code in its state tests"}
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
