case: routing/drafts-cautious-line-says-waits
about: >
  At cautious, drafts wait for a person however long (ADR-0060): a
  split's child whose Need and Validation are the product owner's
  drafts is never taken as written. The line's comment says so, why
  and what comes next, never only who it last woke (#1195).
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner]}}
    roles:
      product-owner:
        settings:
          autonomy: cautious
  forge:
    issues:
      - id: 9
        title: "workline version --verbose=false"
        author: "workline-jn0v[bot]"
        insider: false
        labels: [workline:to-refine, workline:draft]
        labeled: {"workline:draft": "2026-10-01T09:00:00Z"}
        body: "## Need\n\n<!-- workline:draft -->\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n<!-- workline:draft -->\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
run: {route: issue, target: {issue: 9}, ai: none}
expect:
  status: pass
  agent-calls: 0
  forge:
    issues:
      - id: 9
        labels: [workline:to-refine, workline:draft]
        comment-contains: "**workline's line** waits for a person on this issue.\n\n- **Why**: its drafts, since 2026-10-01 09:00 UTC, wait on a person's yes (acts.ask.wait: never).\n- **Next**: a person labels it `workline:accepted` to take them, or edits them, which wakes the product owner.\n\n**workline's line** last woke the product owner"
