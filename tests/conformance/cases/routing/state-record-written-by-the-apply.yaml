case: routing/state-record-written-by-the-apply
about: >
  Judged with no write token (--no-apply), the issue line leaves its
  record to the job that applies (`workline apply --line`), after the
  runs (ADR-0059): the tester's Draft opened, the issue moved to ready,
  then the line's record written on it. The judging job writes nothing.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run:
  route: issue
  target: {issue: 3}
  open-merge-request: true
  no-apply: true
  ai: "fake:tester-two-scenarios"
  then: resume
  apply-from: {line: true}
expect:
  status: pass
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        comments: 2
        comment-contains: ["**The tester** wrote the acceptance tests", "<!-- workline:line-record {\"state\":\"tests\""]
    merge-requests:
      - {id: 1, branch: workline/tester/issue-3, draft: true}
