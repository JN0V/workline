case: routing/size-empty-runs-read
about: >
  A record edited by hand to hold a role with an empty list of runs is
  read as that role having spent nothing: `workline size` measures the
  rest and never stops on it. The open bug #20, its developer's list
  emptied, is said past its normal by its total alone.
given:
  repo: backlog
  forge:
    issues:
      - {id: 20, title: "Rows lost", labels: [bug, "workline:ready"], body: "## Need\n\nRows lost.\n", comments: ["<!-- workline:line-record {\"state\":\"ready\",\"body\":\"0a1b2c3d4e5f\",\"hops\":3,\"spent\":{\"developer\":[],\"product-owner\":[900000]}} -->\n<!-- workline:sticky=line/state -->"]}
run: {size: []}
expect:
  status: pass
  forge:
    issues:
      - id: 21
        title: "workline: the normal size of an issue"
        comment-contains:
          - "#20 (bug): 900k, past its normal of 400k"
        comment-lacks: ["a developer run"]
