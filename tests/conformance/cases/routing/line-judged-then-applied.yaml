case: routing/line-judged-then-applied
about: "`workline apply` applies every run a line judged with --no-apply, without calling the agent again."
given:
  repo: documented
  setup: ["sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"]
  forge: {merge-requests: [{id: 1, labels: [], comments: []}]}
run: {route: merge-request, input: {range: "HEAD~1..HEAD"}, target: {merge-request: 1}, ai: "fake:comment-and-label", no-apply: true, then: resume}
expect:
  status: pass
  agent-calls: 1
  applied: [label, comment]
  forge: {merge-requests: [{id: 1, comments: 1, labels: [docs-checked]}]}
