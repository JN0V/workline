case: routing/state-refine-unrefined-read-again
about: >
  A bug in refine whose first product owner run named its sources and
  nothing more (#951): the line wakes the product owner again on the
  same body, told what its last read left, with the code it named. Its
  Verification and Scope are written.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner]}}
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        author: ann
        insider: true
        labels: [workline:to-refine, bug]
        body: "## Need\n\nA user exporting rows loses the last one.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n"
        comments:
          - "```yaml\nsources: [src/export]\nconfirmed: d8c4dff\nbody: 8a05ec2b42f7\nkind: bug\nsilent: 'it lacks Verification and Scope, and the agent drafted nothing nor asked'\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline's line** last woke the product owner on this issue, in its state refine (1 state step so far).\n\n<!-- workline:line-record {\"state\":\"refine\",\"body\":\"8a05ec2b42f7\",\"hops\":1} -->\n<!-- workline:sticky=line/state -->"
run: {route: issue, target: {issue: 9}, ai: fake:refine-nine-after-sources}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: state-unrefined, where: "#9", message: "woken again, 1 of 2"}
    - {rule: state-wakes, where: "#9"}
  run-files:
    in/task.md: {contains: ["Left unrefined when last read: it lacks Verification and Scope", "Sources: src/export."]}
  forge:
    issues:
      - id: 9
        body-contains: ["## Verification", "A test writes three rows", "## Scope"]
