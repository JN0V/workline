case: routing/size-error-blocked-at-once
about: >
  A task too big for the role's context is never run again (#1160): on #3,
  waiting for its tests, the Scope names one line of 100,000 characters,
  over the tester's context budget even cut to one line. The agent is not
  asked; the run is a machine error of kind size, which no try on the same
  input mends. The line blocks #3 in that run, saying the prompt's size,
  the budget and what to change — never "run again", never 2 more runs on
  the same input. The same reconcile run again starts nothing.
given:
  repo: tested
  setup:
    - "mkdir -p src && awk 'BEGIN { printf \"# \"; for (i = 1; i <= 2000; i++) printf \"%050d\", i; printf \"\\n\" }' > src/wide.sh && git add src && git commit -qm 'src' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Scope\n\n- `src/wide.sh`\n"
run: {route: reconcile, open-merge-request: true, ai: "cmd:cat > /dev/null; echo '[]'", then: again}
expect:
  agent-calls: 0
  findings:
    - {rule: prompt-over-budget, message: "over the role's budget of 60000 (context.budget in its role.yaml)"}
    - {rule: machine-error-size, level: warn, where: "#3", message: "the tester's task is too big for its context: the agent was not asked"}
    - {rule: machine-error-size, level: warn, where: "#3", message: "lower code-lines-max in the tester's settings, or narrow the issue's Scope; a run again on the same input fails the same: moved to blocked"}
  no-findings: [{rule: state-retry}, {rule: state-waits}, {rule: no-test-written}]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["over the role's budget of 60000", "lower code-lines-max in the tester's settings"]
        comment-lacks: ["1 of 2 tries"]
