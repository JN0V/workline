case: routing/schedule-failing-fast-blocks-on-a-refusal
about: 'A project that sets `fail-fast: {schedule: true}` keeps a refused proposal a block on schedule, as on a gate''s event: nothing applied, the run fails.'
given:
  repo: documented
  setup: ["sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"]
  config:
    routing: {fail-fast: {schedule: true}}
run: {role: documentalist, event: schedule, ai: "fake:doc-fixed-misquoted"}
expect:
  status: block
  applied: []
  findings: [{rule: misquoted, where: docs/tech/auth.md}]
