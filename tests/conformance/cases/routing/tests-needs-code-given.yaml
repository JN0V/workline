case: routing/tests-needs-code-given
about: >
  A tester short of code says what it lacks (ADR-0063, §6; #1047): its
  agent writes no test and names calc/calc.go. The issue keeps
  workline:needs-tests, never sent back to refine as "no test possible";
  the tester's comment says what it lacks, the line's that it gives it
  at the next run. The same reconcile run again starts nothing: it says
  when.
given:
  repo: go-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_CLOCK: "2026-11-05T08:00:00Z"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA Go test.\n\n## Scope\n\n- A `Mul` function beside `Add`.\n"
run: {route: reconcile, open-merge-request: true, ai: "fake:tester-needs-code", then: again}
expect:
  agent-calls: 1
  findings:
    - {rule: needs-code, level: info, where: "#3", message: "calc/calc.go"}
    - {rule: state-waits, level: info, where: "#3", message: "the tester said it lacks code (calc/calc.go): run again from 2026-11-05 08:10 UTC"}
  no-findings: [{rule: no-test-possible}, {rule: tests-refused}]
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - id: 3
        labels: ["workline:needs-tests"]
        comment-contains: ["**The tester** wrote no tests for this issue yet: it lacks code.", "`calc/calc.go`", "**workline's line** gives the tester the code it said it lacks."]
