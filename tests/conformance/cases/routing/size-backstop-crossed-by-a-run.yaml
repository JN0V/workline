case: routing/size-backstop-crossed-by-a-run
about: >
  A run that takes an issue to its backstop blocks it at once, for a
  person, not for the product owner (ADR-0064, §5; #1174). Bug #9's runs
  spent 1.5M fresh tokens, under its backstop of 1.6M: the product
  owner's step in refine runs, and spends 200k. Its record counts them,
  1.7M in all, and #9 is blocked in the same step, the backstop said; no
  later step, nor the product owner's size question, runs on it.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner]}}
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        author: ann
        insider: true
        labels: [workline:to-refine, bug]
        body: "## Need\n\nA user exporting rows loses the last one.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n"
        comments:
          - "**workline's line** last woke the developer on this issue.\n\n<!-- workline:line-record {\"state\":\"ready\",\"body\":\"0a1b2c3d4e5f\",\"hops\":2,\"spent\":{\"product-owner\":[300000],\"tester\":[500000],\"developer\":[700000]}} -->\n<!-- workline:sticky=line/state -->"
run: {route: issue, target: {issue: 9}, ai: "cmd:sh $FIXTURES/agents/costly.sh 200000"}
expect:
  agent-calls: 1
  findings:
    - {rule: backstop-crossed, level: warn, where: "#9", message: "1.7M fresh tokens spent on it, all runs, reaching its backstop of 1.6M"}
  no-findings: [{rule: size-crossed, where: "#9"}, {rule: size-crossed-again, where: "#9"}]
  forge:
    issues:
      - id: 9
        labels: [bug, workline:blocked]
        comment-contains: ["\"product-owner\":[300000,200000]", "\"backstop\":1600000", "1.7M fresh tokens spent on it so far"]
