case: routing/ready-overlap-gone-wakes
about: >
  An issue the developer passed over for an overlap is due again once
  its Scope overlaps no claim held (#998), though the claim it waited on
  still holds. #3's Scope, written before the `Guessed:` mark, says no
  code was given: a guess, it overlaps nothing now. #4 still overlaps
  #5, its pull request open: it waits on. No agent asked, nothing
  written: the CI starts each run.
given:
  repo: tested
  config:
    routing: {events: {issue: [developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply"
        labels: ["workline:ready", "bug"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: `mul`. No `mul` code was given in this run.\n"
        comments:
          - "<!-- workline:line-record {\"state\":\"ready\",\"body\":\"970b75497876\",\"hops\":1,\"woke\":\"2026-11-03T10:48:40Z\",\"held\":[5]} -->\n<!-- workline:sticky=line/state -->"
          - "**The developer** waits on this issue.\n\n- **Why**: its Scope's `lib.sh` overlaps #5's, taken.\n- **Next**: #5 merged or let go; the developer looks at this issue again at its next run.\n\n<!-- workline:sticky=developer/claim -->"
      - id: 4
        title: "Multiply again"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
        comments:
          - "<!-- workline:line-record {\"state\":\"ready\",\"body\":\"05d9d8d501ac\",\"hops\":1,\"woke\":\"2026-11-03T10:48:40Z\",\"held\":[5]} -->\n<!-- workline:sticky=line/state -->"
          - "**The developer** waits on this issue.\n\n- **Why**: its Scope's `lib.sh` overlaps #5's, taken.\n- **Next**: #5 merged or let go; the developer looks at this issue again at its next run.\n\n<!-- workline:sticky=developer/claim -->"
      - id: 5
        title: "Add"
        labels: ["workline:developing", "enhancement"]
        body: "## Need\n\nI want to add.\n\n## Scope\n\n- `lib.sh`: `add`.\n"
    merge-requests:
      - {id: 6, branch: workline/developer/5, title: "feat: add", body: "Closes #5"}
run: {route: reconcile, open-merge-request: true, ai: "fake:developer-nothing", input: {reconcile: list}}
expect:
  status: pass
  summary: "reconcile: 1 issue due: #3"
  agent-calls: 0
  findings:
    - {rule: state-freed, level: info, where: "#3", message: "its Scope overlaps no issue held now"}
    - {rule: state-acted, level: info, where: "#4"}
  no-findings: [{rule: state-freed, where: "#4"}]
