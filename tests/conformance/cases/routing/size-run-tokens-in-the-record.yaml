case: routing/size-run-tokens-in-the-record
about: >
  Each step's fresh tokens are counted in the line's record on the
  issue, by role, a run a number (ADR-0064, step 2): the issue's total
  holds across machines, a run's calls being lost with its CI job. A
  bug in refine whose record holds a tester's run of 7000 and an earlier
  product owner's of 1000: the product owner runs again, 2000 in and 500
  out, and the record adds 2500 to its runs; the comment says 10500 so
  far, under its backstop: nothing stops on it.
given:
  repo: backlog
  config:
    routing: {events: {issue: [product-owner]}}
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        author: ann
        insider: true
        labels: [workline:to-refine, bug]
        body: "## Need\n\nA user exporting rows loses the last one.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n"
        comments:
          - "```yaml\nsources: [src/export]\nconfirmed: d8c4dff\nbody: 8a05ec2b42f7\nkind: bug\nsilent: 'it lacks Verification and Scope, and the agent drafted nothing nor asked'\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline's line** last woke the product owner on this issue, in its state refine (1 state step so far).\n\n<!-- workline:line-record {\"state\":\"refine\",\"body\":\"8a05ec2b42f7\",\"hops\":1,\"spent\":{\"product-owner\":[1000],\"tester\":[7000]}} -->\n<!-- workline:sticky=line/state -->"
run: {route: issue, target: {issue: 9}, ai: fake:refine-nine-costly}
expect:
  status: pass
  agent-calls: 1
  forge:
    issues:
      - id: 9
        comment-contains:
          - "\"spent\":{\"product-owner\":[1000,2500],\"tester\":[7000]}"
          - "10.5k fresh tokens spent on it so far"
