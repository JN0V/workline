case: documentalist/split-a-page-pointer-list
about: "A split may leave a list of six one-line pointers in the part's place: each item is a pointer of its own, within the 30 words, though the list holds 59."
given:
  repo: untidy
  # as split-a-page-pointer-on-two-lines, sections of 80 words: the list is 54
  setup:
    - "printf '      freshness: {stale-after-days: 3650}\\n' >> .workline/config.yaml && git add .workline && git rm -q docs/faq.md && sed -i \"s|^they had not saved.*|& See [the spec](https://example.com/token).|\" docs/sessions.md && git commit -qam 'docs: drop the faq; ten years fresh'"
    - "C=$(git rev-parse --short HEAD) && printf -- '---\\nsources: [src/token.go]\\nchecked: %s\\n---\\n' $C | cat - docs/sessions.md > x && mv x docs/sessions.md && sed -i 's/folder-lines: 30/folder-lines: 24/; s/section-words: 30/section-words: 80/' .workline/config.yaml && git add .workline docs/sessions.md && git commit -qm 'docs: track the sessions doc'"
run: {role: documentalist, event: schedule, ai: "fake:split-a-page-pointer-list"}
expect:
  status: pass
  applied: [patch]
  files:
    docs/sessions.md: {lacks: "A session lasts", contains: "- What happens to unsaved work is on [the page](sessions-length.md)."}
    docs/sessions-length.md: {contains: "Signing out ends the session."}
