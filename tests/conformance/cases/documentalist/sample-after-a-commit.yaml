case: documentalist/sample-after-a-commit
about: The sample reads only what was vouched for after the commit `sample.after` names (the release that made `checked` earned, ADR-0014 step 0); what came before is never drawn, though its week is sampled.
given:
  repo: vouched
  setup:
    - "git tag earned HEAD~1"
  config: {roles: {documentalist: {settings: {sample: {after: earned}}}}}
run: {sample: [--week, 2026-W01, --judge, "fake:sample-ttl-false"]}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: sample-empty}
  no-findings:
    - {rule: vouched-false, where: docs/tech/auth.md}
