case: documentalist/release-docs-nightly-with-nothing-due
about: "The nightly run of the release's docs alone does nothing, with no agent call, when no release pull request holds docs due: its release pull request open with every doc judged since the last tag, it passes with no question for the agent (ADR-0050, §7)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "echo '// keep' >> src/main.go && git add src/main.go && git commit -qm 'chore: a file no doc describes' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '# Changelog' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'chore(main): release 1.0.1' && git push -q origin release-please--branches--main && git checkout -q main"
  forge: {merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]}
run: {route: release, args: [--target, merge-request:release], ai: "fake:doc-fixed", no-apply: true}
expect:
  status: pass
  agent-calls: 0
  steps: ["documentalist (release #1)"]
  no-findings: [{rule: suspect, where: docs/tech/auth.md}]
  files:
    CHANGELOG.md: {exists: false}
  forge:
    merge-requests:
      - {id: 1, comments: 0}
      - {id: 2, absent: true}
