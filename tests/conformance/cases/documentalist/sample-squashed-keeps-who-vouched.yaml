case: documentalist/sample-squashed-keeps-who-vouched
about: "A doc vouched for in a merge request a squash merged keeps who vouched for it: the squash drops the commit's trailers from the branch, so the sample reads them on the commit of the merge request's head that moved the same `checked` (ADR-0046), names the merge request, and never has the model that vouched read it (ADR-0005)."
given:
  repo: vouched
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -q -b fee && mkdir -p src/fee && printf 'package fee\\n\\nconst Rate = 1\\n' > src/fee/fee.go && printf -- '---\\nsources: [src/fee/fee.go]\\nchecked: HEAD\\n---\\n# Fees\\n\\nThe rate is 1.\\n' > docs/tech/fee.md && git add src/fee docs/tech/fee.md && GIT_AUTHOR_DATE=2026-01-20T09:00:00Z GIT_COMMITTER_DATE=2026-01-20T09:00:00Z git commit -q -m 'feat(fee): charge a fee'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/fee.md && sed -i '3a verified: agent:documentalist' docs/tech/fee.md && GIT_AUTHOR_DATE=2026-01-20T10:00:00Z GIT_COMMITTER_DATE=2026-01-20T10:00:00Z git commit -qam 'docs: bring the docs in line with the code' -m \"$(printf 'Workline-Role: documentalist\\nWorkline-Model: fake:same-model')\""
    - "git push -q origin fee:refs/pull/7/head && git checkout -q main && git merge -q --squash fee && GIT_AUTHOR_DATE=2026-01-20T12:00:00Z GIT_COMMITTER_DATE=2026-01-20T12:00:00Z git commit -q -m 'feat(fee): charge a fee (#7)' && git push -q origin main"
    - "git branch -q -D fee && git reflog expire --expire=now --all && git gc -q --prune=now"
  forge:
    issues: []
    merge-requests:
      - {id: 7, title: "Charge a fee", branch: fee, base: main, labels: [], merged-at: "2026-01-20T12:00:00Z", merged-as: main}
run: {sample: [--week, 2026-W04, --judge, "fake:same-model"]}
expect:
  status: human
  agent-calls: 1
  findings:
    - {rule: sample-window, message: "1 doc vouched for"}
    - {rule: sample-not-read, where: docs/tech/fee.md, message: "the judge answered with the model that vouched (same-model)"}
    - {rule: sample-not-read, where: docs/tech/fee.md, message: "(#7) at `checked:"}
  no-findings:
    - {rule: vouched-true, where: docs/tech/fee.md}
