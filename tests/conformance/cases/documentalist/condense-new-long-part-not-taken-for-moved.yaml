case: documentalist/condense-new-long-part-not-taken-for-moved
about: 'Only lines moved are moved: a new part written into a new doc, and headings made of words the doc''s headings do not hold, are refused (`written-anew`), though a part as long left the doc, cut in two on the way.'
given:
  repo: untidy
  setup: ["git rm -q docs/faq.md && sed -i 's/sessions.md#how-long-a-session-lasts/sessions.md/' docs/auth.md && git commit -qam 'docs: drop the faq'"]
run: {role: documentalist, event: schedule, ai: "fake:condense-moves-and-adds"}
expect:
  applied: []
  findings:
    - {rule: written-anew, where: docs/more/session-length.md, message: "A user who ticks the box"}
    - {rule: written-anew, where: docs/more/session-length.md, message: "## Remember me"}
  files:
    docs/sessions.md: {contains: "## How long a session lasts"}
