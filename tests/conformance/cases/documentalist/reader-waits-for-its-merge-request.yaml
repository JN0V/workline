case: documentalist/reader-waits-for-its-merge-request
about: "A page a reader merge request changes, waiting for review, is not read again while it waits (#256, as ADR-0013 holds a doc); said on its findings."
given:
  repo: documented
  setup:
    - |
      git init -q --bare ../origin.git && git remote add origin ../origin.git
      printf '# Shop\n\nSee [the guide](docs/guide.md).\n' > README.md
      printf '# Guide\n\n%s\n\nSee [the setup](setup.md) for more.\n' 'Install the tool with `make install`, then run it once in each repository you want it to watch, and it will look at every commit you make there before the commit leaves your machine, and it will tell you what it found in a short list that gives the file and the line of each finding, so that you can fix it before anyone else reads it, and it keeps doing so for every push until the day you remove it with `make uninstall`, which takes about 2 seconds and leaves nothing behind on your machine.' > docs/guide.md
      printf '# Setup\n\nOne step.\n' > docs/setup.md
      git add . && git commit -qm 'docs: a guide' && git push -q origin main
    - "git checkout -qb workline/documentalist/reader-docs-guide-md && sed -i '1i <!-- workline\\nreader: 0123456789ab\\n-->' docs/guide.md && git commit -qam 'docs: read docs/guide.md for its reader' && git push -q origin workline/documentalist/reader-docs-guide-md && git checkout -q main"
  config: {roles: {documentalist: {settings: {freshness: {stale-after-days: 100000}}}}}
  forge:
    merge-requests:
      - {id: 4, branch: "workline/documentalist/reader-docs-guide-md", base: main, labels: [], comments: []}
run: {role: documentalist, event: schedule, ai: "fake:reader-nothing", open-merge-request: true, no-apply: true}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: paragraph-too-long, where: docs/guide.md, message: "workline/documentalist/reader-docs-guide-md holds it and waits for review"}
