case: documentalist/release-branch-on-another-base-left-alone
about: "A release branch of the documentalist built on another branch than the one given — a maintenance branch's release — is never rebuilt onto it (#184)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb maint && echo 'fix' > src/auth/fix.txt && git add src/auth/fix.txt && git commit -qm 'fix(auth): a maintenance fix' && git push -q origin maint"
    - "git checkout -qb workline/documentalist/release && sed -i 's/one hour/two hours/' docs/tech/auth.md && git commit -qam 'docs: bring the docs in line with the code' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/release && git checkout -q main"
    - "sed -i 's/^checked: .*/checked: abcdef1/' docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc' && git push -q origin main"
  forge: {merge-requests: [{id: 2, branch: workline/documentalist/release, base: maint, labels: [], comments: []}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: not-rebuilt, where: workline/documentalist/release, message: "another branch"}]
  not-pushed: [workline/documentalist/release]
