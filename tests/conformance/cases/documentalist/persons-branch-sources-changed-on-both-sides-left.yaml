case: documentalist/persons-branch-sources-changed-on-both-sides-left
about: "main and a person's branch both changed docs/tech/auth.md's `sources`, beside its `checked` (ADR-0041): `sources` is the person's, not a line workline writes, so it is left to them and named; nothing is pushed."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && printf 'package auth\\n\\n// End signs a user out.\\nfunc End() {}\\n' > src/auth/session.go && sed -i 's|^sources: .*|sources: [src/auth/token.go, src/auth/session.go]|; s/^checked: .*/checked: 2222222/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): sign users out' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's|^sources: .*|sources: [src/auth/token.go, src/auth/refresh.go]|; s/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: not-merged, where: feat/sessions, level: warn, message: "in conflict with main in docs/tech/auth.md: left to its author, nothing pushed"}]
  no-findings: [{rule: merged, where: feat/sessions}]
  not-pushed: [feat/sessions]
