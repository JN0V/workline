case: documentalist/gardening-branch-a-person-committed-to-is-left
about: "Gardening never rebuilds nor closes a merge request of its own a person committed to: it is left to them, and named in the night's summary when it is in conflict with main; one that still merges is left without a word (#303)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/documentalist/suspect && sed -i 's/^checked: .*/&\\njudged: 1a8e5a4/; s/one hour/two hours/' docs/tech/auth.md && git commit -qam 'docs: bring the docs in line with the code' -m 'Workline-Role: documentalist' && echo 'More.' >> docs/tech/auth.md && git commit -qam 'docs: a word more' && git push -q origin workline/documentalist/suspect && git checkout -q main"
    - "git checkout -qb workline/documentalist/stale && sed -i 's/^checked: .*/&\\njudged: 1a8e5a4/' docs/product/sign-in.md && git commit -qam 'docs: read again the docs not confirmed for too long' -m 'Workline-Role: documentalist' && echo 'More.' >> docs/product/sign-in.md && git commit -qam 'docs: another word' && git push -q origin workline/documentalist/stale && git checkout -q main"
    - "sed -i 's/one hour/ninety minutes/' docs/tech/auth.md && git commit -qam 'docs: tokens last ninety minutes' && git push -q origin main"
  forge:
    merge-requests:
      - {id: 4, branch: workline/documentalist/suspect, base: main, labels: [], comments: []}
      - {id: 5, branch: workline/documentalist/stale, base: main, labels: [], comments: []}
run: {follow: [--gardening, --base, main], summary: true}
expect:
  status: pass
  findings: [{rule: not-rebuilt, where: workline/documentalist/suspect, message: "in conflict with main"}]
  no-findings:
    - {rule: not-rebuilt, where: workline/documentalist/stale}
    - {rule: closed, where: workline/documentalist/suspect}
    - {rule: closed, where: workline/documentalist/stale}
  not-pushed: [workline/documentalist/suspect, workline/documentalist/stale]
  summary-file: ["workline follow", "workline/documentalist/suspect", "in conflict with main", "a word more"]
  forge:
    merge-requests:
      - {id: 4, closed: false, comments: 0}
      - {id: 5, closed: false, comments: 0}
