case: documentalist/persons-branch-merged-on-gitlab
about: "On GitLab, a person's merge request in conflict with main only on a `checked` line gets main merged in, as on GitHub (ADR-0041); one a project access token's user or a service account opened, a bot's as the users API says, is left."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "git checkout -qb chore/bump && sed -i 's/^checked: .*/checked: 4444444/' docs/tech/auth.md && echo 'go 1.24' > go.mod && git add go.mod && git commit -qam 'chore: bump go' && git push -q origin chore/bump && git checkout -q main"
    - "git checkout -qb ci/lint && sed -i 's/^checked: .*/checked: 5555555/' docs/tech/auth.md && git commit -qam 'ci: lint' && git push -q origin ci/lint && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge:
    merge-requests:
      - {id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}
      - {id: 8, branch: chore/bump, base: main, author: project_1_bot_3f2a, labels: [], comments: []}
      - {id: 9, branch: ci/lint, base: main, author: ci-service, labels: [], comments: []}
    bots: [ci-service]
run: {follow: [--base, main], forge: gitlab}
expect:
  status: pass
  findings: [{rule: merged, where: feat/sessions, message: "docs/tech/auth.md"}]
  no-findings:
    - {rule: merged, where: chore/bump}
    - {rule: not-merged, where: chore/bump}
    - {rule: merged, where: ci/lint}
    - {rule: not-merged, where: ci/lint}
  merged: {feat/sessions: main}
  pushed:
    feat/sessions: {docs/tech/auth.md: "checked: 3333333\n---", src/auth/token.go: "7200"}
  pushed-message: {feat/sessions: "Merge branch 'main' into feat/sessions"}
  not-pushed: [chore/bump, ci/lint]
