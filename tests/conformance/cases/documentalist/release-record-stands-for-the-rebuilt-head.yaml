case: documentalist/release-record-stands-for-the-rebuilt-head
about: "On a release tool's pull request, by the run on `release` (the night's, ADR-0050), a doc judged with nothing to fix gets its `judged` in a merge request of its own, naming the release's head, and the documentalist's comment there keeps that head and its sources' ids. Once that merge request is merged, the tool rebuilds its branch: a new head, the same version bump. The doc pins the version the bump replaces, and its two sources are as judged: it is not judged again, no fix is proposed, and the release is no longer held (ADR-0034, amended 2026-10-19). Before, each merge moved `judged` to a head the next rebuild dropped, and a new merge request opened: workline's 0.36.0 release, #502 to #505."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "mkdir -p ci && printf 'VERSION: v1.0.0  # x-release-please-version\\n' > ci/build.yml && printf '// Built for v1.0.0 (x-release-please-version)\\n' >> src/auth/token.go && printf '\\n## Releases\\n\\nPin it in your job: `AUTH_VERSION: v1.0.0`.\\n' >> docs/tech/auth.md && sed -i 's|^sources: .*|sources: [src/auth/token.go, ci/build.yml]|' docs/tech/auth.md && git add ci && git commit -qam 'feat(auth): say the release it pins'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc' && git tag v1.0.0 && git push -q origin main"
    - "git checkout -qb release-please--branches--main && sed -i 's/v1.0.0/v1.1.0/' src/auth/token.go ci/build.yml && git commit -qam 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]}
run:
  role: documentalist
  event: release
  target: {merge-request: 1}
  ai: 'cmd:sh "$FIXTURES/agents/judged-only.sh"'
  push-to-merge-request: true
  then: again
  again-after:
    - "git fetch -q origin && git checkout -q main && git merge -q --squash origin/workline/documentalist/release && git commit -qm 'docs: bring the docs in line with the code (#2)' && git push -q origin main"
    - "git checkout -q -B release-please--branches--main main && sed -i 's/v1.0.0/v1.1.0/' src/auth/token.go ci/build.yml && git commit -qam 'chore(main): release 1.1.0' && git push -qf origin release-please--branches--main && git checkout -q --detach"
expect:
  status: pass
  agent-calls: 1
  applied: []
  findings:
    - {rule: fixed-elsewhere, where: docs/tech/auth.md, message: "merge request #2"}
    - {rule: suspect, where: docs/tech/auth.md, message: "its sources unchanged since: not put before an agent again"}
  forge:
    merge-requests:
      - {id: 1, comments: 1, comment-contains: "<!-- workline:doc-judged-at-release"}
      - {id: 2, branch: workline/documentalist/release, base: main}
      - {id: 3, absent: true}
