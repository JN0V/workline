case: documentalist/persons-branch-deleted-meanwhile-not-recreated
about: "The person deletes their branch while workline merges main into it (ADR-0041): workline's push holds a lease on the tip it read, so it never brings the branch back; the summary says so. The deletion is made by the clone's pre-push hook, while workline pushes."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
    - "printf '#!/bin/sh\\n[ -f ../deleted ] && exit 0\\ntouch ../deleted\\nunset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE\\ngit --git-dir=../origin.git update-ref -d refs/heads/feat/sessions\\n' > .git/hooks/pre-push && chmod +x .git/hooks/pre-push"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: merge-refused, where: feat/sessions, level: warn, message: "the branch was deleted while workline merged main into it"}]
  no-findings: [{rule: merged, where: feat/sessions}]
  gone: [feat/sessions]
