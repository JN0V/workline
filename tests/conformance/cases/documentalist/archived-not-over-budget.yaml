case: documentalist/archived-not-over-budget
about: An archived doc, or an archived root agent file, is not reported over its budget.
given:
  repo: untidy
  setup:
    - "{ printf -- '---\\narchived: 2026-10-04\\n---\\n\\n'; cat docs/sessions.md; } > s && mv s docs/sessions.md && { printf -- '---\\narchived: true\\n---\\n\\n'; cat AGENTS.md; } > a && mv a AGENTS.md && git commit -qam 'docs: archive the sessions and the agents file'"
run: {role: documentalist, event: schedule, ai: none}
expect:
  status: pass
  findings: [{rule: section-too-long, where: "docs/history.md#the-first-year"}]
  no-findings:
    - {rule: doc-too-long, where: docs/sessions.md}
    - {rule: agent-file-too-long, where: AGENTS.md}
