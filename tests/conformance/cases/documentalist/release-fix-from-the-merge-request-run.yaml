case: documentalist/release-fix-from-the-merge-request-run
about: "Applying a release pull request's own CI run (#331): whether it is the release's is the applying job's settings' word, not the run's: told it is not, the fix still goes to a merge request of its own on the release's base (ADR-0017), the release branch pushed to by workline's App alone."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge:
    merge-requests:
      - id: 1
        branch: release-please--branches--main
        base: main
        labels: []
        comments: []
        pushes: [{head: release-please--branches--main, at: "2026-01-03T00:00:00Z", by: workline-bot}]
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  push-to-merge-request: true
  no-apply: true
  then: resume
  apply-from: {merge-request: 1, base: main, head: release-please--branches--main, run: {release: ""}}
expect:
  status: block
  applied: [patch, comment]
  findings: [{rule: fixed-elsewhere, where: docs/tech/auth.md, level: block, message: "merge request #2"}]
  pushed:
    workline/documentalist/release: {docs/tech/auth.md: "Access tokens last two hours."}
    release-please--branches--main: {docs/tech/auth.md: "Access tokens last one hour."}
  forge:
    merge-requests:
      - {id: 1, comments: 1, comment-contains: "<!-- workline:doc-judged-at-release", comment-lacks: "git apply"}
      - {id: 2, branch: workline/documentalist/release, base: main}
