case: documentalist/only-what-the-range-changed
about: "Given the commits of a merge request, a doc is read only if one of them touched its sources or itself: a doc made suspect by an earlier commit is not read there, as at a push, and no agent is called for it; gardening judges it (ADR-0050)."
given:
  repo: documented
  setup:
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
    - "echo 'package main' > main.go && git add main.go && git commit -qm 'feat: add an entry point'"
run: {role: documentalist, event: merge-request, input: {range: "HEAD~1..HEAD"}, ai: "fake:doc-fixed"}
expect:
  status: pass
  agent-calls: 0
  no-findings: [{rule: suspect}]
