case: documentalist/release-pull-request-night-stops-at-its-tokens
about: "On a release pull request, judged then applied as at night: twelve docs due, five a call, the run allowed 1,000 tokens (`ai-max-tokens`), which its first call spends. That call's five fixes go to workline/documentalist/release; the seven docs left still hold the release, for the agent at the next night's run, said; nothing past the cap is asked (#572)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "for i in 01 02 03 04 05 06 07 08 09 10 11; do printf '%s\\n' '---' 'type: reference' 'sources: [src/auth/token.go]' 'checked: HEAD' '---' \"# Sessions $i\" '' 'A session lasts as long as its token.' > docs/tech/session-$i.md; done && git add docs && git commit -qm 'docs: the sessions'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: HEAD/checked: $C/\" docs/tech/session-*.md && git commit -qam 'docs: confirm the sessions docs' && git tag v1.0.0"
    - "printf '\\n// Refreshed on use.\\n' >> src/auth/token.go && git commit -qam 'feat(auth): refresh tokens on use' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge:
    merge-requests:
      - id: 1
        branch: release-please--branches--main
        base: main
        labels: []
        comments: []
        pushes: [{head: release-please--branches--main, at: "2026-01-03T00:00:00Z", by: workline-bot}]
  config: {roles: {documentalist: {settings: {ai-max-calls: 5, ai-max-tokens: 1000}}}}
run: {role: documentalist, event: release, target: {merge-request: 1}, branch: release-please--branches--main, ai: 'cmd:printf ''tokens-in: 1000\n'' > "$WORKLINE_CALL"; sh "$FIXTURES/agents/confirm-every-doc.sh"', push-to-merge-request: true, no-apply: true, then: resume}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: fixed-elsewhere, where: docs/tech/auth.md, message: "merge request #2"}
    - {rule: fixed-elsewhere, where: docs/tech/session-04.md, message: "merge request #2"}
  no-findings:
    - {rule: fixed-elsewhere, where: docs/tech/session-05.md}
  pushed:
    workline/documentalist/release:
      docs/tech/auth.md: "verified: agent:documentalist"
      docs/tech/session-04.md: "verified: agent:documentalist"
  run-files:
    out/verdict.yaml: {contains: ["held: true", "7 docs due hold the release: 7 for the agent"]}
  not-pushed: [release-please--branches--main, main]
  forge:
    merge-requests:
      - {id: 2, branch: workline/documentalist/release, base: main, body-contains: ["`docs/tech/session-04.md`"], body-lacks: ["`docs/tech/session-05.md`"]}
      - {id: 3, absent: true}
