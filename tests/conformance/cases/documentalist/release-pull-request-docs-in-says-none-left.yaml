case: documentalist/release-pull-request-docs-in-says-none-left
about: "The release's docs fixed and merged, the tool's next move has none due: the comment that listed them is edited to say none is left, and the run passes (ADR-0050, §7). None is opened on a release pull request that never had one (release-pull-request-nothing-due-passes)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "echo '// keep' >> src/main.go && git add src/main.go && git commit -qm 'chore: a file no doc describes' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '# Changelog' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'chore(main): release 1.0.1' && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge:
    merge-requests:
      - id: 1
        branch: release-please--branches--main
        base: main
        labels: []
        comments:
          - body: |
              **Docs due for this release** — 1 hold it, until each is judged.

              <!-- workline:sticky=documentalist/release-night -->
            author: workline-bot
            bot: true
run: {role: documentalist, event: merge-request, target: {merge-request: 1}, input: {range: "main..HEAD"}, ai: "fake:doc-fixed", push-to-merge-request: true}
expect:
  status: pass
  agent-calls: 0
  applied: [comment]
  forge:
    merge-requests:
      - {id: 1, comments: 1, comment-contains: "**Docs due for this release**: none left."}
