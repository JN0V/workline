case: documentalist/persons-branch-merge-signed-when-git-signs
about: "A project whose forge refuses unsigned commits gives the bot a key, git set to sign with it (`commit.gpgsign`, `gpg.format: ssh`, `user.signingkey`): main merged into a person's merge request in conflict only on workline's lines (ADR-0041) — as the merge policy brings a release held for its docs up to date (ADR-0042) — is pushed signed with that key, as `git commit` would sign it (#549)."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
    - "ssh-keygen -q -t ed25519 -N '' -C workline -f ../signing && git config gpg.format ssh && git config user.signingkey \"$(cd .. && pwd)/signing\" && git config commit.gpgsign true"
    - "echo \"fixture@example.invalid $(cat ../signing.pub)\" > ../allowed-signers && git config gpg.ssh.allowedSignersFile \"$(cd .. && pwd)/allowed-signers\""
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: merged, where: feat/sessions, message: "main merged in"}]
  merged: {feat/sessions: main}
  pushed:
    feat/sessions: {docs/tech/auth.md: "checked: 3333333\n---", src/auth/token.go: "7200", src/auth/refresh.go: "Refresh renews"}
  signed: {feat/sessions: true}
