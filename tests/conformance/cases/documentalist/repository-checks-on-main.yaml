case: documentalist/repository-checks-on-main
about: "On main after a merge (ADR-0050), the documentalist checks the whole repository, once, no agent asked: a passage written twice, a dead link, in docs the merge did not touch. It judges no doc there: one suspect from before is gardening's, and no task is put to the agent."
given:
  repo: documented
  setup:
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
    - "P='A session lasts as long as its token, and a token lasts one hour unless it is refreshed. When it expires, the user is asked to sign in again, and anything they had not saved is kept in the browser until they come back to the page.' && printf '# Questions\\n\\n%s\\n\\nSee [the guide](guide.md).\\n' \"$P\" > docs/faq.md && printf '# Notes\\n\\n%s\\n' \"$P\" > docs/notes.md && git add docs && git commit -qm 'docs: answer the questions asked'"
    - "echo 'package main' > main.go && git add main.go && git commit -qm 'feat: add an entry point'"
run: {role: documentalist, event: main, input: {range: "HEAD~1..HEAD"}, ai: "fake:doc-fixed"}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: duplicate, where: docs/faq.md}
    - {rule: dead-link, where: docs/faq.md}
  no-findings: [{rule: suspect}, {rule: nothing-tracked}]
