case: documentalist/misquoted-patch-refused
about: A patch whose removed lines are not at the lines it cites is refused, the agent is asked again, and nothing is applied.
given:
  repo: documented
  setup: ["sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"]
run: {role: documentalist, event: merge-request, ai: "fake:doc-fixed-misquoted"}
expect:
  status: block
  agent-calls: 2
  applied: []
  findings: [{rule: misquoted, where: docs/tech/auth.md}]
