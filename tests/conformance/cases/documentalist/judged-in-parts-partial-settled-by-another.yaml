case: documentalist/judged-in-parts-partial-settled-by-another
about: "A passage one part finds partial — its share does not settle it — and another part supports, quoting the source, is settled: no fix is asked of it. A part that cannot see the source deciding the passage must not lead the fix to rewrite what that source supports (workline #29)."
given:
  repo: documented
  setup:
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && sed -i 's#^sources: \\[src/auth/token.go\\]#sources: [src/auth/token.go, src/auth/big.go]#' docs/tech/auth.md && git add -A && git commit -qm 'feat(auth): add the big table'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc'"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && git commit -qam 'refactor(auth): make the big table constant'"
  config: {roles: {documentalist: {settings: {judge-in-parts: true}}}}
run: {role: documentalist, event: merge-request, ai: "fake:parts-partial-but-supported"}
expect:
  status: pass
  agent-calls: 2
  findings: [{rule: suspect, where: docs/tech/auth.md, message: "judged in parts"}]
  files: {"docs/tech/auth.md": {contains: "judged-in-parts:", lacks: "two hours"}}
