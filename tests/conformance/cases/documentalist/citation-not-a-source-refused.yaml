case: documentalist/citation-not-a-source-refused
about: "A claim quoting a file that is not among the doc's sources cites nothing: the fix is refused (`citation-unchecked`), saying which sources it may quote (ADR-0014, step 2)."
given:
  repo: documented
  setup: ["sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"]
run: {role: documentalist, event: merge-request, ai: "cmd:sh $FIXTURES/agents/fix-auth-header.sh moves-checked cites-elsewhere"}
expect:
  status: block
  applied: []
  findings: [{rule: citation-unchecked, where: docs/tech/auth.md, message: "not a file under the doc's sources"}]
