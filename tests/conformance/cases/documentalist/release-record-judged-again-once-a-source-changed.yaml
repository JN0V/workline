case: documentalist/release-record-judged-again-once-a-source-changed
about: "A record the documentalist's comment on a release pull request keeps no longer stands once a source of the doc changed since the head it names: the doc's `judged` names a head the release tool rebuilt, but main changed the code since. Without an agent, the release stays held until the doc is judged again (ADR-0017; ADR-0034, amended 2026-10-19)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "printf '// Built for v1.0.0 (x-release-please-version)\\n' >> src/auth/token.go && printf '\\n## Releases\\n\\nPin it in your job: `AUTH_VERSION: v1.0.0`.\\n' >> docs/tech/auth.md && git commit -qam 'feat(auth): say the release it pins'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc' && git tag v1.0.0"
    - "git checkout -qb release-please--branches--main && sed -i 's/v1.0.0/v1.1.0/' src/auth/token.go && git commit -qam 'chore(main): release 1.1.0' && sed -i \"s/@at@/$(git rev-parse HEAD)/; s/@src@/$(git rev-parse HEAD:src/auth/token.go)/\" \"$FORGE_FILE\" && J=$(git rev-parse --short=7 HEAD) && git checkout -q main && sed -i \"s/^checked: .*/&\\njudged: $J/\" docs/tech/auth.md && git commit -qam 'docs: bring the docs in line with the code (#2)'"
    - "sed -i 's/3600/5400/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for ninety minutes' && git push -q origin main"
    - "git checkout -q -B release-please--branches--main main && sed -i 's/v1.0.0/v1.1.0/' src/auth/token.go && git commit -qam 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge:
    merge-requests:
      - id: 1
        branch: release-please--branches--main
        base: main
        labels: []
        comments:
          - body: |
              **Docs recorded on this release** — kept here.

              <!-- workline:doc-judged-at-release {"at":"@at@","doc":"docs/tech/auth.md","ids":{"src/auth/token.go":"@src@"},"key":"judged"} -->

              <!-- workline:sticky=documentalist/release-judged -->
            author: workline-bot
            bot: true
run: {role: documentalist, event: merge-request, target: {merge-request: 1}, ai: none}
expect:
  status: block
  findings: [{rule: suspect, where: docs/tech/auth.md, level: block, message: "the release waits until it is judged"}]
