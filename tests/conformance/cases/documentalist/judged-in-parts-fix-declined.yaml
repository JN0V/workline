case: documentalist/judged-in-parts-fix-declined
about: "A doc judged in parts whose fix call changes nothing of what the parts found wrong is not said to be fixed: the finding says the fix changed nothing, for a person."
given:
  repo: documented
  setup:
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && sed -i 's#^sources: \\[src/auth/token.go\\]#sources: [src/auth/token.go, src/auth/big.go]#' docs/tech/auth.md && git add -A && git commit -qm 'feat(auth): add the big table'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc'"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
  config: {roles: {documentalist: {settings: {judge-in-parts: true}}}}
run: {role: documentalist, event: merge-request, ai: "fake:parts-fix-declined"}
expect:
  status: pass
  agent-calls: 3
  findings:
    - {rule: suspect, where: docs/tech/auth.md, message: "the fix changed nothing of what they found wrong"}
  no-findings:
    - {rule: suspect, where: docs/tech/auth.md, message: "is fixed"}
