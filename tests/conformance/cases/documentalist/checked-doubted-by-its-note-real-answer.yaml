case: documentalist/checked-doubted-by-its-note-real-answer
about: "The answer of a real run replayed (#449): five docs fixed and vouched for, and a note saying status.md's \"33 tests\" could not be checked against the sources, so it is kept. The note names status.md in its text: its move of `checked` is withheld (`checked-over-note`), `judged` set, the note's words said on that doc for a person. The four docs no note names are vouched for, the clean control among them. The run, the evaluation's drifted-version-bump, moved `checked` on status.md: 20/23."
given:
  repo: drifted
  setup:
    - "mkdir -p .workline && printf 'forge: local\\n' > .workline/config.yaml && git add .workline && git commit -qm 'chore: keep issues in the clone'"
    - "sed -i 's/\"version\": \"1.4.1\"/\"version\": \"1.5.0\"/' Clock/library.json && sed -i 's/#define CLOCK_VERSION \"1.4.1\"/#define CLOCK_VERSION \"1.5.0\"/' Clock/include/Clock.h && sed -i 's|^// Events the clock publishes.$|// Events the clock publishes on the bus, by topic.|' Clock/include/ClockEvents.h && git commit -qam 'feat(clock): 1.5.0'"
run: {role: documentalist, event: merge-request, ai: "fake:drifted-vouched-over-its-note"}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: checked-over-note, where: docs/clock/status.md, message: "\"33 tests\" count could not be checked"}
    - {rule: suspect, where: docs/clock/status.md, message: "not vouched for"}
  no-findings:
    - {rule: checked-over-note, where: docs/clock/README.md}
    - {rule: checked-over-note, where: docs/clock/events.md}
  notes: ["could not be checked against the sources"]
  files:
    docs/clock/status.md: {contains: "checked: f5a13e1\njudged: eb28bad\n"}
    docs/clock/events.md: {contains: "checked: eb28bad\n", lacks: "judged:"}
    docs/clock/README.md: {contains: ["checked: eb28bad\n", "**1.5.0**", "| `Clock.h` | 569 |"]}
    docs/clock/project-context.md: {contains: "checked: eb28bad\n", lacks: "returns hardcoded"}
    docs/getting-started.md: {contains: ["checked: eb28bad\n", "clock@1.5.0"]}
