case: documentalist/persons-branch-from-a-fork-left-on-gitlab
about: "On GitLab, a merge request from another project, in conflict with main only on a `checked` line, is read where GitLab keeps its head, refs/merge-requests/<iid>/head, and left to its author, named (ADR-0041)."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb patch-1 && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin patch-1:refs/merge-requests/9/head && git checkout -q main && git branch -qD patch-1"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge: {merge-requests: [{id: 9, branch: patch-1, base: main, fork: true, author: zed, labels: [], comments: []}]}
run: {follow: [--base, main], forge: gitlab}
expect:
  status: pass
  findings: [{rule: not-merged, where: patch-1, level: warn, message: "from a fork, in conflict with main: left to its author"}]
  no-findings: [{rule: merged, where: patch-1}]
  not-pushed: [patch-1]
