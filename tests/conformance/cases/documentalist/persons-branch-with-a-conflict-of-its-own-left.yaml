case: documentalist/persons-branch-with-a-conflict-of-its-own-left
about: "A person's pull request conflicts with main on a `checked` line and on a line of code both changed (ADR-0041): a merge commit cannot hold a conflict, so nothing is pushed, and the job's summary names the code file, left to its author."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "sed -i 's/3600/5400/' src/auth/token.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for ninety minutes' && git push -q origin main"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: not-merged, where: feat/sessions, level: warn, message: "in conflict with main in src/auth/token.go: left to its author, nothing pushed; workline would settle its own lines in docs/tech/auth.md"}]
  no-findings: [{rule: merged, where: feat/sessions}]
  not-pushed: [feat/sessions]
  summary-file: ["workline follow", "feat/sessions", "src/auth/token.go"]
