case: documentalist/judged-in-parts-fix-declined-not-stamped
about: "When gardening, a doc judged in parts whose fix changes nothing of what the parts found wrong is not recorded as judged: its header gains no `judged-in-parts`, it stays suspect, to be judged again, and each place found wrong, with the code that says otherwise, is listed in its finding and in the issue of docs waiting for a person (#2197)."
given:
  repo: documented
  setup:
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && sed -i 's#^sources: \\[src/auth/token.go\\]#sources: [src/auth/token.go, src/auth/big.go]#' docs/tech/auth.md && git add -A && git commit -qm 'feat(auth): add the big table'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc'"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
  config: {roles: {documentalist: {settings: {judge-in-parts: true}}}}
  forge:
    issues:
      - {id: 4, title: "Docs waiting for a person", body: "- [ ] `docs/other.md` — too large", labels: [], comments: []}
run: {role: documentalist, event: schedule, ai: "fake:parts-fix-declined"}
expect:
  status: pass
  agent-calls: 3
  findings:
    - {rule: suspect, where: docs/tech/auth.md, message: "line 10: \"Access tokens last one hour.\""}
  no-findings:
    - {rule: suspect, where: docs/tech/auth.md, message: "not put before an agent again"}
  files:
    "docs/tech/auth.md": {lacks: "judged-in-parts:"}
  forge:
    issues:
      - {id: 4, body-contains: ["- [ ] `docs/tech/auth.md`", "line 10: \"Access tokens last one hour.\"", "src/auth/token.go, line 4: \"const TokenTTL = 7200\""]}
