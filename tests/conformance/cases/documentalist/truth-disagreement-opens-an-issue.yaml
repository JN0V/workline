case: documentalist/truth-disagreement-opens-an-issue
about: When the code disagrees with a doc it follows, the doc is only checked again, and the disagreement goes to an issue on the project's forge.
given:
  repo: documented
  setup:
    - "mkdir -p .workline && printf 'roles:\\n  documentalist:\\n    settings:\\n      truth: {doc: [\"docs/tech/**\"]}\\n' > .workline/config.yaml"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
  forge: {issues: [], merge-requests: []}
run: {role: documentalist, event: merge-request, ai: "fake:truth-disagrees"}
expect:
  status: pass
  applied: [patch, issue]
  files:
    "docs/tech/auth.md": {contains: "Access tokens last one hour."}
    ".workline/issues": {exists: false}
  forge:
    issues:
      - {id: 1, title: "The code disagrees with docs/tech/auth.md", body-contains: "TokenTTL = 7200"}
