case: documentalist/reader-fix-placed-by-the-lines-it-removes
about: "A reader patch quoting a context line with a space too many is placed by the lines it removes, found once in the page, and the page gets the fix as placed, as a doc the code made suspect does (#592): on #547 one context line off by two spaces withheld a fix whose place was beyond doubt, said as a diff git would read otherwise."
given:
  repo: documented
  setup:
    - |
      printf '# Shop\n\nSee [the guide](docs/guide.md).\n' > README.md
      printf '# Guide\n\n%s\n\nSee [the setup](setup.md) for more.\n' 'Install the tool with `make install`, then run it once in each repository you want it to watch, and it will look at every commit you make there before the commit leaves your machine, and it will tell you what it found in a short list that gives the file and the line of each finding, so that you can fix it before anyone else reads it, and it keeps doing so for every push until the day you remove it with `make uninstall`, which takes about 2 seconds and leaves nothing behind on your machine.' > docs/guide.md
      printf '# Setup\n\nOne step.\n' > docs/setup.md
      git add . && git commit -qm 'docs: a guide'
  config: {roles: {documentalist: {settings: {freshness: {stale-after-days: 100000}}}}}
run: {role: documentalist, event: schedule, ai: "fake:reader-bullets-context-misquoted"}
expect:
  status: pass
  agent-calls: 1
  applied: [patch]
  no-findings:
    - {rule: reader-patch-withheld, where: docs/guide.md}
  files:
    docs/guide.md: {contains: "# Guide\n\n- Install the tool with `make install`, then run it once in each repository it watches.\n- It looks at every commit there before the commit leaves your machine.\n- It lists what it found, the file and the line of each finding, for you to fix first.\n- `make uninstall` removes it in about 2 seconds, leaving nothing behind.\n\nSee [the setup](setup.md) for more.\n"}
