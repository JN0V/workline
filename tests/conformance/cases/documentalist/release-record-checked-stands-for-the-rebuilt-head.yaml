case: documentalist/release-record-checked-stands-for-the-rebuilt-head
about: "As for `judged`, a doc vouched for on a release tool's pull request, by the run on `release` (the night's, ADR-0050), gets its `checked` in a merge request of its own, naming the release's head, kept in the documentalist's comment there with its sources' ids. Once that is merged and the tool rebuilt its branch, the same version bump on the new head, which the doc quotes, makes it suspect no more: it is not judged again (ADR-0034, amended 2026-10-19)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "printf '// Built for v1.0.0 (x-release-please-version)\\n' >> src/auth/token.go && printf '\\n## Releases\\n\\nIt needs the first release after v1.0.0.\\n' >> docs/tech/auth.md && git commit -qam 'feat(auth): say the release it needs'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc' && git tag v1.0.0 && git push -q origin main"
    - "git checkout -qb release-please--branches--main && sed -i 's/v1.0.0/v1.1.0/' src/auth/token.go && git commit -qam 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]}
run:
  role: documentalist
  event: release
  target: {merge-request: 1}
  ai: 'cmd:sh "$FIXTURES/agents/confirm-each-doc.sh"'
  push-to-merge-request: true
  then: again
  again-after:
    - "git fetch -q origin && git checkout -q main && git merge -q --squash origin/workline/documentalist/release && git commit -qm 'docs: bring the docs in line with the code (#2)' && git push -q origin main"
    - "git checkout -q -B release-please--branches--main main && sed -i 's/v1.0.0/v1.1.0/' src/auth/token.go && git commit -qam 'chore(main): release 1.1.0' && git push -qf origin release-please--branches--main && git checkout -q --detach"
expect:
  status: pass
  agent-calls: 1
  applied: []
  findings:
    - {rule: fixed-elsewhere, where: docs/tech/auth.md, message: "merge request #2"}
  forge:
    merge-requests:
      - {id: 1, comments: 1, comment-contains: "`checked` at"}
      - {id: 2, branch: workline/documentalist/release, base: main}
      - {id: 3, absent: true}
