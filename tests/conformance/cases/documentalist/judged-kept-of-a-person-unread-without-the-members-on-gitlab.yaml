case: documentalist/judged-kept-of-a-person-unread-without-the-members-on-gitlab
about: "On GitLab, a token that may not list the project's members (401, the job's own on a self-managed instance, #552): a documentalist's note written by a user who is no bot by its name — a person's token — cannot be told a person of the project's, so it is not taken on its word, and the doc is judged again. The summary says once that the members could not be read, and what that changes."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && printf '\\n// TokenTTL is in seconds.\\n' >> src/auth/token.go && git commit -qam 'docs(auth): say the unit of the lifetime' && git push -q origin feature && git checkout -q --detach"
  forge:
    merge-requests: [{id: 1, branch: feature, base: main, labels: [], comments: []}]
    members: [{username: workline-bot, access_level: 30}]
    members-refused: 401
run: {role: documentalist, event: merge-request, target: {merge-request: 1}, ai: 'cmd:sh "$FIXTURES/agents/judged-only.sh"', push-to-merge-request: true, forge: gitlab, then: again, summary: true}
expect:
  status: pass
  agent-calls: 2
  not-pushed: [feature]
  findings:
    - {rule: members-unread, level: warn, message: "one a person's token wrote is not taken on its word, and the docs it kept are judged again"}
  no-findings: [{rule: record-unread}]
  summary-once: [members-unread]
  forge:
    merge-requests:
      - {id: 1, comments: 1, comment-contains: ["<!-- workline:doc-judged", "<!-- workline:sticky=documentalist/judged -->"]}
