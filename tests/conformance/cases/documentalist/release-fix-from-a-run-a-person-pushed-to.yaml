case: documentalist/release-fix-from-a-run-a-person-pushed-to
about: "Applying the night's run on a release pull request in the job that holds the write token, as gardening's does (ADR-0050), its branch pushed to by someone else than workline's App, as the forge says: whoever did could change that run, so its fix is no merge request the App opens — it goes in a comment, for a person, and the release waits, as for a merge request's own CI run (#331)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge:
    merge-requests:
      - id: 1
        branch: release-please--branches--main
        base: main
        labels: []
        comments: []
        pushes:
          - {head: main, at: "2026-01-03T00:00:00Z", by: workline-bot}
          - {head: release-please--branches--main, at: "2026-01-03T00:01:00Z", by: mallory}
run:
  role: documentalist
  event: release
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  push-to-merge-request: true
  no-apply: true
  then: resume
expect:
  status: pass
  findings: [{rule: fix-in-comment, level: block, message: "@mallory pushed to release-please--branches--main"}]
  not-pushed: [release-please--branches--main]
  gone: [workline/documentalist/release]
  forge:
    merge-requests:
      - {id: 1, comments: 2, comment-contains: "+Access tokens last two hours."}
      - {id: 2, absent: true}
