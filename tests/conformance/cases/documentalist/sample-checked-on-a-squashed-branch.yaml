case: documentalist/sample-checked-on-a-squashed-branch
about: "A doc vouched for at a commit a squash left off the branch, as in 2026-W41 on workline, is read there all the same: the sample fetches the head of each merge request merged in the week from the ref the forge keeps for it (GitHub's refs/pull/<n>/head, GitLab's refs/merge-requests/<iid>/head; ADR-0046)."
given:
  repo: vouched
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -q -b fee && mkdir -p src/fee && printf 'package fee\\n\\nconst Rate = 1\\n' > src/fee/fee.go && printf -- '---\\nsources: [src/fee/fee.go]\\nchecked: HEAD\\n---\\n# Fees\\n\\nThe rate is 1.\\n' > docs/tech/fee.md && git add src/fee docs/tech/fee.md && GIT_AUTHOR_DATE=2026-01-20T09:00:00Z GIT_COMMITTER_DATE=2026-01-20T09:00:00Z git commit -q -m 'feat(fee): charge a fee'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/fee.md && sed -i '3a verified: agent:documentalist' docs/tech/fee.md && GIT_AUTHOR_DATE=2026-01-20T10:00:00Z GIT_COMMITTER_DATE=2026-01-20T10:00:00Z git commit -qam 'docs: bring the docs in line with the code' -m 'Workline-Role: documentalist'"
    - "git push -q origin fee:refs/pull/7/head && git checkout -q main && git merge -q --squash fee && GIT_AUTHOR_DATE=2026-01-20T12:00:00Z GIT_COMMITTER_DATE=2026-01-20T12:00:00Z git commit -q -m 'feat(fee): charge a fee (#7)' && git push -q origin main"
    - "git branch -q -D fee && git reflog expire --expire=now --all && git gc -q --prune=now"
  forge:
    issues: []
    merge-requests:
      - {id: 7, title: "Charge a fee", branch: fee, base: main, labels: [], merged-at: "2026-01-20T12:00:00Z", merged-as: main}
run: {sample: [--week, 2026-W04, --judge, "fake:sample-nothing-false"]}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: sample-window, message: "1 doc vouched for"}
    - {rule: vouched-true, where: docs/tech/fee.md}
  no-findings:
    - {rule: sample-not-read, where: docs/tech/fee.md}
