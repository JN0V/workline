case: documentalist/release-fix-from-a-run-its-pushers-unknown
about: "Applying a release pull request's own CI run (#331), the forge not saying who pushed to its branch since it was created: never taken for the App's alone; the fix goes in a comment, for a person, and the release waits."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]}
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  push-to-merge-request: true
  no-apply: true
  then: resume
  apply-from: {merge-request: 1, base: main, head: release-please--branches--main}
expect:
  status: block
  findings: [{rule: fix-in-comment, level: block, message: "the forge does not say"}]
  gone: [workline/documentalist/release]
  forge:
    merge-requests:
      - {id: 1, comments: 1}
      - {id: 2, absent: true}
