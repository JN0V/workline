case: documentalist/gardening-opens-a-merge-request
about: Gardening with --open-merge-request puts the patch on a branch of its task, pushed, with a merge request open for it; the working tree goes back to the branch it was on, clean.
given:
  repo: documented
  setup:
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  forge: {merge-requests: []}
run: {role: documentalist, event: schedule, ai: "fake:doc-fixed", open-merge-request: true}
expect:
  status: pass
  applied: [patch, issue, issue]   # the two kept issues, docs due and docs waiting for a person, each only kept if already open
  forge:
    merge-requests:
      - {id: 1, branch: "workline/documentalist/suspect", base: main, title: "docs: bring the docs in line with the code",
         body-contains: ["gardening rebuilds it on the new tip, or closes it", "never overwritten"]}
  files:
    docs/tech/auth.md: {contains: "Access tokens last one hour."}
