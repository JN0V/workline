case: documentalist/split-a-page-and-its-links
about: "When gardening, an ordinary page over its budget is split into linked pages, as a person split twelve on 2026-11-23: a whole part moves into a page beside it, a link left in its place; a link elsewhere in the repository to the part moved follows it, its target alone changed; the new page carries the page's `sources` and `checked`, the lines moved being the lines checked. Its link to another site, moved with it, and the headers and links the pages add to their folder, are no new problem."
given:
  repo: untidy
  # no repeated passage: merging one would come before splitting; the page
  # tracked, docs/auth.md links to the part that moves, which links to
  # another site
  setup:
    - "printf '      freshness: {stale-after-days: 3650}\\n' >> .workline/config.yaml && git add .workline && git rm -q docs/faq.md && sed -i \"s|^they had not saved.*|& See [the spec](https://example.com/token).|\" docs/sessions.md && git commit -qam 'docs: drop the faq; ten years fresh'"
    - "C=$(git rev-parse --short HEAD) && printf -- '---\\nsources: [src/token.go]\\nchecked: %s\\n---\\n' $C | cat - docs/sessions.md > x && mv x docs/sessions.md && git add docs/sessions.md && git commit -qm 'docs: track the sessions doc'"
run: {role: documentalist, event: schedule, ai: "fake:split-a-page"}
expect:
  status: pass
  agent-calls: 1
  calls: [{task: split, tier: frontier}]
  applied: [patch]
  files:
    docs/sessions-length.md: {contains: "checked: 776e6be"}
    docs/sessions.md: {contains: "(sessions-length.md)", lacks: "A session lasts"}
    docs/auth.md: {contains: "(sessions-length.md#how-long-a-session-lasts)"}
