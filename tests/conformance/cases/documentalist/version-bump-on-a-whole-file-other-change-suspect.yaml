case: documentalist/version-bump-on-a-whole-file-other-change-suspect
about: "A doc naming a whole file, `ci/job.yml`, is still suspect when the commit that bumps its marked version changes another line of it too: the bump does not hide the other change."
given:
  repo: documented
  setup:
    - "mkdir -p ci && printf 'env:\\n  VERSION: v1.2.0   # x-release-please-version\\n  NAME: tool\\n' > ci/job.yml && printf -- '---\\nsources: [ci/job.yml]\\nchecked: HEAD\\n---\\n# The job\\n\\nThe job runs the release in `VERSION`, under the `NAME` it gives.\\n' > docs/tech/job.md && git add ci docs && git commit -qm 'ci: the job'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/job.md && git commit -qam 'docs: confirm the job doc'"
    - "sed -i -e 's/v1.2.0/v1.3.0/' -e 's/NAME: tool/NAME: other/' ci/job.yml && git commit -qam 'chore(main): release 1.3.0'"
run: {role: documentalist, event: pre-push, input: {range: "HEAD~1..HEAD"}, ai: none}
expect:
  findings: [{rule: suspect, where: docs/tech/job.md}]
