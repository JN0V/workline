case: documentalist/archived-links-still-checked
about: An archived doc's own links are still checked, and a link to it still resolves.
given:
  repo: untidy
  setup: ["{ printf -- '---\\narchived: 2026-10-04\\n---\\n\\n'; cat docs/sessions.md; echo 'See [gone](gone.md).'; } > s && mv s docs/sessions.md && git commit -qam 'docs: archive the sessions'"]
run: {role: documentalist, event: schedule, ai: none}
expect:
  status: pass
  findings: [{rule: dead-link, where: docs/sessions.md, message: gone.md}]
  no-findings: [{rule: dead-link, where: docs/auth.md, message: "sessions.md#how-long-a-session-lasts"}]
