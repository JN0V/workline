case: documentalist/fix-not-applied-said-past-a-header-line
about: "A fix the documentalist proposed on a merged merge request is still said once the doc's header gained a line since (a `judged` naming an older commit): only the header's hunk no longer applies, and the body still holds what the fix changes."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
    - "git checkout -q main && git merge -q --squash feature && GIT_AUTHOR_DATE=2026-01-07T12:00:00Z GIT_COMMITTER_DATE=2026-01-07T12:00:00Z git commit -qm 'feat(auth): keep users signed in for two hours (#1)' && git push -q origin main && git branch -q -D feature"
    - "sed -i \"/^checked:/a judged: $(git rev-parse --short HEAD~2)\" docs/tech/auth.md && git commit -qam 'docs(auth): judged'"
  forge:
    merge-requests:
      - id: 1
        branch: feature
        base: main
        labels: []
        closed: true
        merged: true
        merged-at: "2026-01-07T12:00:00Z"
        merged-as: main
        comments:
          - body: |
              **Proposed by workline's documentalist**, not pushed: workline pushes nothing to a merge request's branch. Apply it with `git apply`:

              ````diff
              diff --git a/docs/tech/auth.md b/docs/tech/auth.md
              --- a/docs/tech/auth.md
              +++ b/docs/tech/auth.md
              @@ -3,3 +3,4 @@
               sources: [src/auth/token.go]
               checked: 9bf650b
              +judged: 1a2b3c4
               ---
              @@ -9,2 +10,2 @@

              -Access tokens last one hour.
              +Access tokens last two hours.
              ````

              <!-- workline:sticky=documentalist/patch -->
            author: workline-bot
            bot: true
run: {role: documentalist, event: schedule, ai: none}
expect:
  status: pass
  findings: [{rule: fix-not-applied, where: docs/tech/auth.md, message: "merge request #1 merged without the fix"}]
  forge:
    issues:
      - {id: 2, title: "Docs waiting for a person", body-contains: "`docs/tech/auth.md` — merge request #1 merged without the fix the documentalist proposed"}
