case: documentalist/release-pull-request-says-which-docs-a-person-judges
about: "On a move of a release tool's pull request, the comment listing its docs due says, for a doc no agent can judge, that a person does, and why: the night's agent would leave it as it is, the release held for it (#543; ADR-0050, §7). The other docs due wait for the night's agent."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && printf '%s\\n' '---' 'type: reference' 'sources: [src/auth/big.go]' 'checked: HEAD' '---' '# Tables' '' 'The big table holds one row a line.' > docs/tech/tables.md && git add src docs && git commit -qm 'feat(auth): add the big table'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: HEAD/checked: $C/\" docs/tech/tables.md && git commit -qam 'docs: confirm the tables doc' && git tag v1.0.0"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && printf '\\n// Refreshed on use.\\n' >> src/auth/token.go && git commit -qam 'feat(auth): refresh tokens on use' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '# Changelog' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]}
  config: {roles: {documentalist: {settings: {parts-max: 1}}}}
run: {role: documentalist, event: merge-request, target: {merge-request: 1}, input: {range: "main..HEAD"}, ai: "fake:doc-fixed", push-to-merge-request: true}
expect:
  status: block
  agent-calls: 0
  applied: [comment]
  summary: "2 docs due hold the release: 1 for a person (docs/tech/tables.md), 1 for the agent at night"
  findings:
    - {rule: suspect, where: docs/tech/tables.md, level: block, message: "a person judges it"}
    - {rule: suspect, where: docs/tech/auth.md, level: block}
  forge:
    merge-requests:
      - id: 1
        comments: 1
        comment-contains:
          - "- `docs/tech/tables.md` — src/auth/big.go changed since it was checked; too large to be judged whole, and its sources too wide to be judged in parts: a person judges it"
          - "- `docs/tech/auth.md` — src/auth/token.go changed since it was checked\n"
          - "Those no agent can judge say so: a person reads each against its sources"
