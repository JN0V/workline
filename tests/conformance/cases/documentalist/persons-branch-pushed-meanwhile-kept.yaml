case: documentalist/persons-branch-pushed-meanwhile-kept
about: "The person pushes to their branch while workline merges main into it (ADR-0041): workline's push is a fast-forward, never forced, so it is refused and their push stays; the summary says so, and the next push to main tries again. Their push is made by the clone's pre-push hook, while workline pushes."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
    - "git clone -q ../origin.git ../person && git -C ../person checkout -q feat/sessions && echo 'Sessions end at sign-out.' > ../person/NOTES.md && git -C ../person add NOTES.md && git -C ../person commit -qm 'docs: notes on sessions'"
    - "printf '#!/bin/sh\\n[ -f ../pushed ] && exit 0\\ntouch ../pushed\\nunset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE\\ngit -C ../person push -q origin feat/sessions\\n' > .git/hooks/pre-push && chmod +x .git/hooks/pre-push"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: merge-refused, where: feat/sessions, level: warn, message: "their push kept, workline's refused; the next push to main tries again"}]
  no-findings: [{rule: merged, where: feat/sessions}]
  pushed: {feat/sessions: {NOTES.md: "Sessions end at sign-out."}}
  pushed-message: {feat/sessions: "docs: notes on sessions"}
  summary-file: ["workline follow", "feat/sessions", "their push kept"]
