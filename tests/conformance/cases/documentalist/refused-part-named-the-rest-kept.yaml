case: documentalist/refused-part-named-the-rest-kept
about: "A patch refused for one of its places is asked again naming that place only, and saying the rest of it holds: the agent keeps the right fix beside it. The agent had withdrawn a right fix with the refused one (16c660b, replayed in ADR-0014's step 3)."
given:
  repo: documented
  setup:
    - "printf '\\n## Signing\\n\\nTokens are signed with HS256.\\n' >> docs/tech/auth.md && git commit -qam 'docs(auth): say how tokens are signed'"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
run: {role: documentalist, event: merge-request, ai: "cmd:sh $FIXTURES/agents/keep-the-held-hunk.sh"}
expect:
  status: pass
  applied: [patch]
  agent-calls: 2
  refused-kept: 1
  files: {"docs/tech/auth.md": {contains: "two hours", lacks: "one hour"}}
