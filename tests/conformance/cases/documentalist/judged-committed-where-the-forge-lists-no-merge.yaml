case: documentalist/judged-committed-where-the-forge-lists-no-merge
about: "A forge that does not say which commit a merge request became (`local`, `cmd:`) could not have gardening read a record back once merged: the record is committed on the merge request's branch, as before, its message naming the doc."
given:
  repo: documented
  setup:
    - "git checkout -qb feature && printf '\\n// TokenTTL is in seconds.\\n' >> src/auth/token.go && git commit -qam 'docs(auth): say the unit of the lifetime' && git checkout -q --detach"
    - |
      mkdir -p .git/workline/merge-requests && cat > .git/workline/merge-requests/1.md <<'MR'
      ---
      title: "docs(auth): the unit of the lifetime"
      state: open
      branch: feature
      base: main
      ---
      MR
  config: {forge: local}
run: {role: documentalist, event: merge-request, target: {merge-request: 1}, ai: 'cmd:sh "$FIXTURES/agents/judged-only.sh"', push-to-merge-request: true}
expect:
  status: pass
  applied: [patch, note]
  findings: [{rule: pushed, where: feature, message: "docs: record when docs/tech/auth.md was judged"}]
  branches: {feature: {docs/tech/auth.md: "judged: "}}
