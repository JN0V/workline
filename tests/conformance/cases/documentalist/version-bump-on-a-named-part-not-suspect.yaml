case: documentalist/version-bump-on-a-named-part-not-suspect
about: "A doc naming a part of a file (ADR-0053) that holds a version, `ci/job.yml#env.VERSION`, is not made suspect by a commit that only puts one version in place of another, on any run: its release tool's bump stays in the history of every later run, and it changes nothing the doc says unless the doc pins the version replaced."
given:
  repo: documented
  setup:
    - "mkdir -p ci && printf 'env:\\n  VERSION: v1.2.0   # x-release-please-version\\n  NAME: tool\\n' > ci/job.yml && printf -- '---\\nsources: [ci/job.yml#env.VERSION]\\nchecked: HEAD\\n---\\n# The job\\n\\nThe job runs the release in `VERSION`: update it to take a newer one.\\n' > docs/tech/job.md && git add ci docs && git commit -qm 'ci: the job'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/job.md && git commit -qam 'docs: confirm the job doc'"
    - "sed -i 's/v1.2.0/v1.3.0/' ci/job.yml && git commit -qam 'chore(main): release 1.3.0'"
run: {role: documentalist, event: pre-push, input: {range: "HEAD~1..HEAD"}, ai: none}
expect:
  status: pass
  no-findings: [{rule: suspect, where: docs/tech/job.md}, {rule: unknown}]
