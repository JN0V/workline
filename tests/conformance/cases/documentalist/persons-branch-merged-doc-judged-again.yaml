case: documentalist/persons-branch-merged-doc-judged-again
about: "main and a person's branch both moved docs/tech/auth.md's `checked`, each having changed its sources; `workline follow` merges main in, main's `checked` kept (ADR-0041). The line on that merge judges the commits before it: the doc is suspect again, the branch's change to its sources coming after main's `checked`, judged, never skipped."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && sed -i \"s/^checked: .*/checked: $(git rev-parse --short HEAD)/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc' && git push -q origin feat/sessions && git checkout -q main"
    - "sed -i '1i // Package auth signs users in.' src/auth/token.go && git commit -qam 'docs(auth): say what the package does' && sed -i \"s/^checked: .*/checked: $(git rev-parse --short HEAD)/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc' && git push -q origin main"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run:
  follow: [--base, main]
  then-line: {event: merge-request, branch: feat/sessions, range: "main..HEAD", ai: none}
expect:
  findings:
    - {rule: merged, where: feat/sessions, message: "docs/tech/auth.md"}
    - {rule: suspect, where: docs/tech/auth.md}
  merged: {feat/sessions: main}
