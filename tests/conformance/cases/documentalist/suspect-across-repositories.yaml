case: documentalist/suspect-across-repositories
about: A change in another repository makes a doc that depends on it suspect.
given:
  repos:                              # built first; each path is exported by name to what follows
    API_REPO: {repo: documented}
  repo: user-guide
  setup: ["cd \"$API_REPO\" && sed -i 's/one hour/two hours/' docs/tech/auth.md && git commit -qam 'docs(auth): tokens now last two hours'"]
run: {role: documentalist, event: schedule, ai: none}
expect:
  findings: [{rule: suspect, where: "guide/sign-in.md"}]
