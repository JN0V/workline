case: documentalist/settings-one-budget-keeps-the-others
about: A project that sets one budget keeps the role's other budgets — settings merge key by key at every depth (role contract, "Settings"); none is reported missing.
given:
  repo: untidy
  config:
    roles:
      documentalist:
        settings:
          budgets: {root-agent-file-lines: 5}   # replaces the fixture's config
run: {role: documentalist, event: schedule, ai: none}
expect:
  status: pass
  findings:
    - {rule: agent-file-too-long, where: AGENTS.md}
  no-findings: [{rule: setting-missing}, {rule: doc-too-long}]
