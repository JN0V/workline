case: documentalist/judged-in-parts-checked-stays
about: "The fix of a doc judged in parts must leave `checked` where it is — nobody read the doc whole — and is refused when it moves it: asked again, and still refused, nothing is applied."
given:
  repo: documented
  setup:
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && sed -i 's#^sources: \\[src/auth/token.go\\]#sources: [src/auth/token.go, src/auth/big.go]#' docs/tech/auth.md && git add -A && git commit -qm 'feat(auth): add the big table'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc'"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
  config: {roles: {documentalist: {settings: {judge-in-parts: true}}}}
run: {role: documentalist, event: merge-request, ai: "fake:parts-fix-moves-checked"}
expect:
  status: block
  agent-calls: 4   # two parts, the fix, the fix asked again
  applied: []
  findings: [{rule: checked-moved-in-parts, where: docs/tech/auth.md}]
  files: {"docs/tech/auth.md": {contains: "checked: 845334e", lacks: "judged-in-parts"}}
