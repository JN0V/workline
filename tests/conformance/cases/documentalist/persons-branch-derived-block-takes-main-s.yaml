case: documentalist/persons-branch-derived-block-takes-main-s
about: "A person's pull request conflicts with main only inside a derived block, a count both changed on the same line (ADR-0041): the block is main's, which gardening regenerates there (ADR-0027); the words around it and the person's code are kept."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "printf '# Stats\\n\\n<!-- workline:derive cases -->3<!-- workline:end --> cases pass.\\n' > docs/stats.md && git add docs/stats.md && git commit -qm 'docs: count the cases'"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/-->3</-->4</' docs/stats.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/-->3</-->5</' docs/stats.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: merged, where: feat/sessions, message: "docs/stats.md"}]
  merged: {feat/sessions: main}
  pushed:
    feat/sessions: {docs/stats.md: "<!-- workline:derive cases -->5<!-- workline:end --> cases pass.", src/auth/token.go: "7200"}
