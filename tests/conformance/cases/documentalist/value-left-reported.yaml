case: documentalist/value-left-reported
about: "A version a fix replaces, still in the same doc or in another declaring the same source file, is reported (`value-left`), never fixed by the engine: a sibling left at the old version (DomoticsCore 16c660b), the bug line beside the tree (ADR-0014, step 2)."
given:
  repo: drifted
  setup:
    - "sed -i 's/\"version\": \"1.4.1\"/\"version\": \"1.5.0\"/' Clock/library.json && git commit -qam 'feat(clock): 1.5.0'"
run: {role: documentalist, event: merge-request, ai: "cmd:sh $FIXTURES/agents/fix-clock-readme.sh version"}
expect:
  status: pass
  applied: [patch]
  findings:
    - {rule: value-left, where: docs/getting-started.md, message: "1.4.1"}
    - {rule: value-left, where: docs/clock/project-context.md, message: "1.4.1"}
  files: {"docs/getting-started.md": {contains: "clock@1.4.1"}}
