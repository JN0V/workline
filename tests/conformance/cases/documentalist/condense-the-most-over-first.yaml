case: documentalist/condense-the-most-over-first
about: "When gardening, of the docs over the same budget the one most over it is condensed first, whatever its name: here docs/zzz.md, 30 lines over a budget of 20, before docs/aaa.md, 22 lines."
given:
  repo: documented
  setup:
    - "for d in aaa:21 zzz:29; do f=docs/${d%%:*}.md; printf '# A page\\n' > $f; for i in $(seq 1 ${d##*:}); do echo \"Line $i.\"; done >> $f; done && git add docs && git commit -qm 'docs: two long pages'"
  config: {roles: {documentalist: {settings: {freshness: {stale-after-days: 100000}, budgets: {doc-lines: 20, section-words: 1000, card-words: {min: 1, max: 1000}, folder-lines: 1000, root-agent-file-lines: 1000}}}}}
run: {role: documentalist, event: schedule, ai: 'cmd:p=$(cat); case "$p" in *"Kind: condense"*) echo "$p" | grep -q "^docs/zzz.md is over its budget" || exit 1;; esac; echo "[]"'}
expect:
  status: pass
  calls: [{task: condense}]
  findings:
    - {rule: doc-too-long, where: docs/aaa.md}
    - {rule: doc-too-long, where: docs/zzz.md}
  no-findings:
    - {rule: agent-unavailable}
