case: documentalist/judged-in-parts-comment-does-not-settle
about: "A part's support quoted from a code comment only is no support (ADR-0014, a comment is not evidence; #106): it does not settle a passage another part finds partial. The passage goes to the fix, told the support rests on a comment, with the source lines around it; the doc's finding says it."
given:
  repo: documented
  setup:
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && sed -i 's#^sources: \\[src/auth/token.go\\]#sources: [src/auth/token.go, src/auth/big.go]#' docs/tech/auth.md && git add -A && git commit -qm 'feat(auth): add the big table'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md && git commit -qam 'docs: confirm the auth doc'"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
  config: {roles: {documentalist: {settings: {judge-in-parts: true}}}}
run: {role: documentalist, event: merge-request, ai: "fake:parts-partial-supported-by-a-comment"}
expect:
  status: pass
  agent-calls: 3   # the two parts, then the fix: the comment settled nothing
  findings: [{rule: suspect, where: docs/tech/auth.md, message: "2 claims kept, 1 resting on a comment only"}]
  run-files:
    in/task.md:
      contains:
        - "To be read together"
        - "Supported only by a comment, which is not evidence: src/auth/token.go, line 3"
        - "const TokenTTL = 7200"   # the code beside the comment, for the fix to read
  files: {"docs/tech/auth.md": {contains: "Access tokens last two hours."}}
