case: documentalist/release-docs-left-at-night-without-an-agent
about: "A night with no agent (`--ai none`, no token given): the gardening line runs no step on the release pull request — nothing there needs judging but by an agent, and its own runs already hold it and say why (ADR-0050, §7). Its head is not checked out."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '# Changelog' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q main"
  forge: {merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]}
run: {route: schedule, ai: none, open-merge-request: true, no-apply: true}
expect:
  agent-calls: 0
  steps: [documentalist]
  files:
    CHANGELOG.md: {exists: false}
  forge:
    merge-requests:
      - {id: 1, comments: 0}
