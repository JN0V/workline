case: documentalist/reader-only-when-gardening
about: "The reader checks run when gardening only (#193): a push or a merge request is about what its commits changed, and whether a page serves its reader is reviewed on a schedule."
given:
  repo: documented
  setup:
    - |
      printf '# Shop\n\nAs ADR-0003 says.\n' > README.md
      git add . && git commit -qm 'docs: cite a decision'
run: {role: documentalist, event: merge-request, ai: none}
expect:
  status: pass
  no-findings:
    - {rule: reference-unlinked}
    - {rule: page-unreachable}
    - {rule: navigation-missing}
