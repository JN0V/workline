case: documentalist/release-pull-request-fixes-every-due-doc-in-one-night
about: "On a release pull request, judged then applied in two jobs as at night: twelve docs due for the agent, four a call (`ai-max-calls`), and one too wide for it. The run goes round three times, each round seeing the fixes before it, kept in its clone, and asking the docs no round asked yet; the three rounds' fixes go to one merge request of the documentalist's, workline/documentalist/release, in one commit, its body naming every doc, and the comment keeps every doc's record. Once it is merged, the release waits for the doc a person judges alone, named (#572). Before, one round, four docs, the eight others waiting for that fix to be merged."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && printf '%s\\n' '---' 'type: reference' 'sources: [src/auth/big.go]' 'checked: HEAD' '---' '# Tables' '' 'The big table holds one row a line.' > docs/tech/tables.md && for i in 01 02 03 04 05 06 07 08 09 10 11; do printf '%s\\n' '---' 'type: reference' 'sources: [src/auth/token.go]' 'checked: HEAD' '---' \"# Sessions $i\" '' 'A session lasts as long as its token.' > docs/tech/session-$i.md; done && git add src docs && git commit -qm 'docs: the big table and the sessions'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: HEAD/checked: $C/\" docs/tech/session-*.md docs/tech/tables.md && git commit -qam 'docs: confirm the tables and sessions docs' && git tag v1.0.0"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && printf '\\n// Refreshed on use.\\n' >> src/auth/token.go && git commit -qam 'feat(auth): refresh tokens on use' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge:
    merge-requests:
      - id: 1
        branch: release-please--branches--main
        base: main
        labels: []
        comments: []
        pushes: [{head: release-please--branches--main, at: "2026-01-03T00:00:00Z", by: workline-bot}]
  config: {roles: {documentalist: {settings: {ai-max-calls: 4, parts-max: 1}}}}
run: {role: documentalist, event: release, target: {merge-request: 1}, branch: release-please--branches--main, ai: 'cmd:sh "$FIXTURES/agents/confirm-every-doc.sh"', push-to-merge-request: true, no-apply: true, then: resume}
expect:
  status: pass
  agent-calls: 3
  findings:
    - {rule: fixed-elsewhere, where: docs/tech/auth.md, message: "merge request #2"}
    - {rule: fixed-elsewhere, where: docs/tech/session-04.md, message: "merge request #2"}
    - {rule: fixed-elsewhere, where: docs/tech/session-11.md, message: "merge request #2"}
  pushed:
    workline/documentalist/release:
      docs/tech/auth.md: "verified: agent:documentalist"
      docs/tech/session-01.md: "verified: agent:documentalist"
      docs/tech/session-04.md: "verified: agent:documentalist"
      docs/tech/session-07.md: "verified: agent:documentalist"
      docs/tech/session-08.md: "verified: agent:documentalist"
      docs/tech/session-11.md: "verified: agent:documentalist"
  run-files:
    out/verdict.yaml: {contains: ["held: true", "1 doc due holds the release: 1 for a person (docs/tech/tables.md)"]}
  not-pushed: [release-please--branches--main, main]
  forge:
    merge-requests:
      - {id: 1, comments: 1, comment-contains: ["`docs/tech/auth.md`, `checked` at", "`docs/tech/session-11.md`, `checked` at"]}
      - {id: 2, branch: workline/documentalist/release, base: main, body-contains: ["for the release", "`docs/tech/auth.md`", "`docs/tech/session-05.md`", "`docs/tech/session-11.md`"]}
      - {id: 3, absent: true}
