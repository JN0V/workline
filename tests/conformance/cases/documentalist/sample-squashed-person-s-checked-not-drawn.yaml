case: documentalist/sample-squashed-person-s-checked-not-drawn
about: "A squash mixes its commits' acts, as in 2026-W41 on workline: a person moved a doc's `checked` on the branch, then the documentalist only judged it and set `verified: agent:documentalist`. The commit the squash made moves `checked` and sets that `verified` at once; the merge request's head says the move was the person's (ADR-0046), so it is not drawn as the documentalist's."
given:
  repo: vouched
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -q -b signer && printf 'package auth\\n\\n// The service signs tokens.\\nconst Signer = \"service\"\\n' > src/auth/signer.go && git add src/auth/signer.go && GIT_AUTHOR_DATE=2026-01-20T09:00:00Z GIT_COMMITTER_DATE=2026-01-20T09:00:00Z git commit -q -m 'feat(auth): name the signer'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/people.md && GIT_AUTHOR_DATE=2026-01-20T09:30:00Z GIT_COMMITTER_DATE=2026-01-20T09:30:00Z git commit -qam 'docs: who signs tokens, read again'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^verified: .*/judged: $C\\nverified: agent:documentalist/\" docs/tech/people.md && GIT_AUTHOR_DATE=2026-01-20T10:00:00Z GIT_COMMITTER_DATE=2026-01-20T10:00:00Z git commit -qam 'docs: bring the docs in line with the code' -m \"$(printf 'Workline-Role: documentalist\\nWorkline-Model: fake:same-model')\""
    - "git push -q origin signer:refs/pull/7/head && git checkout -q main && git merge -q --squash signer && GIT_AUTHOR_DATE=2026-01-20T12:00:00Z GIT_COMMITTER_DATE=2026-01-20T12:00:00Z git commit -q -m 'feat(auth): name the signer (#7)' && git push -q origin main"
    - "git branch -q -D signer && git reflog expire --expire=now --all && git gc -q --prune=now"
  forge:
    issues: []
    merge-requests:
      - {id: 7, title: "Name the signer", branch: signer, base: main, labels: [], merged-at: "2026-01-20T12:00:00Z", merged-as: main}
run: {sample: [--week, 2026-W04, --judge, "fake:sample-nothing-false"]}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: sample-empty, message: "no doc vouched for by the documentalist"}
  no-findings:
    - {rule: sample-window}
    - {rule: vouched-true, where: docs/tech/people.md}
    - {rule: sample-not-read, where: docs/tech/people.md}
