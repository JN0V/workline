case: documentalist/reader-after-another-task
about: "The pages the reader checks flag are read last in each gardening run, after the other tasks (ADR-0048): a night judging a suspect doc asks it first, then, in a round of its own, the reader task, each on a merge request of its own."
given:
  repo: documented
  setup:
    - |
      git init -q --bare ../origin.git && git remote add origin ../origin.git
      printf '# Shop\n\nSee [the guide](docs/guide.md).\n' > README.md
      printf '# Guide\n\n%s\n\nSee [the setup](setup.md) for more.\n' 'Install the tool with `make install`, then run it once in each repository you want it to watch, and it will look at every commit you make there before the commit leaves your machine, and it will tell you what it found in a short list that gives the file and the line of each finding, so that you can fix it before anyone else reads it, and it keeps doing so for every push until the day you remove it with `make uninstall`, which takes about 2 seconds and leaves nothing behind on your machine.' > docs/guide.md
      printf '# Setup\n\nOne step.\n' > docs/setup.md
      git add . && git commit -qm 'docs: a guide'
      echo '// Checked on every request.' >> src/auth/token.go && git commit -qam 'docs(auth): say when tokens are checked'
      git push -q origin main
  config: {roles: {documentalist: {settings: {freshness: {stale-after-days: 100000}}}}}
  forge: {merge-requests: []}
run: {role: documentalist, event: schedule, open-merge-request: true, ai: 'cmd:out=$(sh "$FIXTURES/agents/confirm-each-doc.sh"); if [ -n "$out" ]; then printf "%s\n" "$out"; else echo "[]"; fi'}
expect:
  status: pass
  agent-calls: 2
  forge:
    merge-requests:
      - {id: 1, branch: "workline/documentalist/suspect", base: main}
      - {id: 2, branch: "workline/documentalist/reader-docs-guide-md", base: main, title: "docs: read docs/guide.md for its reader"}
  pushed:
    workline/documentalist/reader-docs-guide-md:
      docs/guide.md: "reader: "
