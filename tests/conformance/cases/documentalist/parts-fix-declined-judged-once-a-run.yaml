case: documentalist/parts-fix-declined-judged-once-a-run
about: "A gardening run judged in CI (no-apply) judges in parts, once each, a doc whose fix changes nothing of what its parts found and the doc waiting past parts-max-per-run: the first is recorded as judged, not asked again in the second round, and each goes to a merge request of its own, the first's listing what its parts found (#2197)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "seq 1 3000 | sed 's/^/var b/' > src/auth/big.go && sed -i 's#^sources: \\[src/auth/token.go\\]#sources: [src/auth/token.go, src/auth/big.go]#' docs/tech/auth.md && sed 's/^# Authentication/# The token table/' docs/tech/auth.md > docs/tech/table.md && git add -A && git commit -qm 'feat(auth): add the big table'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/auth.md docs/tech/table.md && git commit -qam 'docs: confirm the auth docs'"
    - "seq 1 3000 | sed 's/^/const b/' > src/auth/big.go && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
  config: {roles: {documentalist: {settings: {judge-in-parts: true, parts-max-per-run: 2}}}}
  forge: {merge-requests: []}
run: {role: documentalist, event: schedule, ai: "fake:parts-fix-declined-then-nothing", open-merge-request: true, no-apply: true, then: resume}
expect:
  status: pass
  agent-calls: 5   # auth.md: two parts and its fix; table.md: two parts
  forge:
    merge-requests:
      - {id: 1, branch: "workline/documentalist/fix-docs-tech-auth-md", base: main, title: "docs: record when docs/tech/auth.md was judged in parts", body-contains: "line 10: \"Access tokens last one hour.\""}
      - {id: 2, branch: "workline/documentalist/fix-docs-tech-table-md", base: main, body-contains: "`docs/tech/table.md` — judged in parts"}
      - {id: 3, absent: true}
