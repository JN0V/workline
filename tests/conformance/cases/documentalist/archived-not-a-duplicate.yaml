case: documentalist/archived-not-a-duplicate
about: A passage an archived doc shares with another doc is not reported as a duplicate — the archive is left as it is.
given:
  repo: untidy
  setup: ["{ printf -- '---\\narchived: 2026-10-04\\n---\\n\\n'; cat docs/faq.md; } > f && mv f docs/faq.md && git commit -qam 'docs: archive the faq'"]
run: {role: documentalist, event: schedule, ai: none}
expect:
  status: pass
  no-findings: [{rule: duplicate, where: docs/faq.md}]
