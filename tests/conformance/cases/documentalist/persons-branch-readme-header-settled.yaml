case: documentalist/persons-branch-readme-header-settled
about: "README.md keeps its header in an HTML comment, `<!-- workline … -->`, where a front matter would show on the forge: a person's pull request in conflict with main only on its `checked` is settled as a `---` front matter is (ADR-0041), key by key, the person's change to the text kept."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "printf '<!-- workline\\nsources: [src/auth/token.go]\\nchecked: 1111111\\n-->\\n# Shop\\n\\nTokens last one hour.\\n' > README.md && git add README.md && git commit -qm 'docs: say how long tokens last'"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/; s/one hour/two hours/' README.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333\\nverified: agent:claude-code/' README.md && git add src README.md && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: merged, where: feat/sessions, message: "README.md"}]
  merged: {feat/sessions: main}
  pushed:
    feat/sessions: {README.md: "<!-- workline\nsources: [src/auth/token.go]\nchecked: 3333333\nverified: agent:claude-code\n-->\n# Shop\n\nTokens last two hours.\n"}
