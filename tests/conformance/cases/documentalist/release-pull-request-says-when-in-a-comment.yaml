case: documentalist/release-pull-request-says-when-in-a-comment
about: "On a move of a release tool's pull request with docs due, its judging job blocks, and the job that applies still posts one comment on it, where its person looks (principle 14): each doc due, that the agent fixes them at night in a merge request of its own, and how to have the release sooner — the command, or a person moving `checked` (ADR-0050, §7). Seen on workline's 0.38.0 release (#536): only the judging job's log said it."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '# Changelog' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]}
run: {role: documentalist, event: merge-request, target: {merge-request: 1}, input: {range: "main..HEAD"}, ai: "fake:doc-fixed", push-to-merge-request: true, no-apply: true, then: resume}
expect:
  status: pass
  agent-calls: 0
  applied: [comment]
  forge:
    merge-requests:
      - {id: 1, comments: 1, comment-contains: "`workline route release --target merge-request:1 --push-to-merge-request`"}
      - {id: 2, absent: true}
