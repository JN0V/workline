case: documentalist/persons-branch-merge-keeps-its-commits
about: "workline merges main into a person's branch of two commits (ADR-0041): a merge commit, the branch's tip its first parent and main's its second, as the forge's Update branch makes it — every commit of theirs keeps its id, so their clone pulls it as a fast-forward and pushes again — with the trailer of workline's own commits."
given:
  repo: documented
  config: {roles: {documentalist: {settings: {update-branches: conflicts}}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && sed -i 's/^checked: .*/checked: 2222222/; s/one hour/two hours/' docs/tech/auth.md && git commit -qam 'docs: tokens last two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge: {merge-requests: [{id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: merged, where: feat/sessions}]
  merged: {feat/sessions: main}
  pushed:
    feat/sessions: {docs/tech/auth.md: "checked: 3333333\n---\n# Authentication\n\n## Token refresh\n\nAccess tokens last two hours."}
  pushed-message: {feat/sessions: "\n\nWorkline-Role: documentalist"}
