case: documentalist/version-bump-on-a-whole-file-holds-a-pin
about: "A doc naming a whole file, `ci/job.yml`, is suspect on any run when a marked bump of that file replaces a version the doc still states as the one now: the reader would copy the version before (#346)."
given:
  repo: documented
  setup:
    - "mkdir -p ci && printf 'env:\\n  VERSION: v1.2.0   # x-release-please-version\\n  NAME: tool\\n' > ci/job.yml && printf -- '---\\nsources: [ci/job.yml]\\nchecked: HEAD\\n---\\n# The job\\n\\nThe job runs the release in `VERSION`. Pin it in your own job:\\n\\n```yaml\\nVERSION: v1.2.0\\n```\\n' > docs/tech/job.md && git add ci docs && git commit -qm 'ci: the job'"
    - "C=$(git rev-parse --short HEAD) && sed -i \"s/^checked: .*/checked: $C/\" docs/tech/job.md && git commit -qam 'docs: confirm the job doc'"
    - "sed -i 's/v1.2.0/v1.3.0/' ci/job.yml && git commit -qam 'chore(main): release 1.3.0'"
run: {role: documentalist, event: pre-push, input: {range: "HEAD~1..HEAD"}, ai: none}
expect:
  findings: [{rule: suspect, where: docs/tech/job.md, message: "chore(main): release 1.3.0"}]
