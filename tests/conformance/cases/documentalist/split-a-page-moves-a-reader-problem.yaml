case: documentalist/split-a-page-moves-a-reader-problem
about: "A line moved takes its reader problem with it: a part naming a decision unlinked, a problem the page had already, moves into a new page, and the split is applied, the problem still reported where it now is."
given:
  repo: untidy
  # as split-a-page-and-its-links, the part moved naming a decision unlinked
  setup:
    - "printf '      freshness: {stale-after-days: 3650}\\n' >> .workline/config.yaml && git add .workline && git rm -q docs/faq.md && sed -i \"s|^they had not saved.*|& See [the spec](https://example.com/token).|\" docs/sessions.md && git commit -qam 'docs: drop the faq; ten years fresh'"
    - "C=$(git rev-parse --short HEAD) && printf -- '---\\nsources: [src/token.go]\\nchecked: %s\\n---\\n' $C | cat - docs/sessions.md > x && mv x docs/sessions.md && sed -i 's|token).$|token). See ADR-0001.|' docs/sessions.md && git add .workline docs/sessions.md && git commit -qm 'docs: track the sessions doc'"
run: {role: documentalist, event: schedule, ai: "fake:split-a-page-moves-a-reference"}
expect:
  status: pass
  applied: [patch]
  files:
    docs/sessions.md: {lacks: "A session lasts"}
    docs/sessions-length.md: {contains: "See ADR-0001."}
