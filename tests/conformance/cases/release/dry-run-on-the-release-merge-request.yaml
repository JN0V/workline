case: release/dry-run-on-the-release-merge-request
about: "With a release tool's merge request open into the branch, cutting the release now is merging it: the dry run judges its head, checked out then put back, its roles as on that merge request (ADR-0017), with no agent; what would hold it is said in one comment on it, never in the default branch's issue (ADR-0050). Nothing is pushed."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '# Changelog' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q main"
  forge:
    issues: []
    merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]
run: {route: release, args: [--dry-run], dry-run-posted: true}
expect:
  status: pass
  agent-calls: 0
  steps: [documentalist]
  summary: "release, a dry run on #1's head"
  findings:
    - {rule: suspect, where: docs/tech/auth.md, level: warn, message: "this merge request comes from release-please--branches--main"}
    - {rule: release-dry-run, message: "#1: what would hold the release said in its comment"}
  not-pushed: [release-please--branches--main, main]
  files:
    CHANGELOG.md: {exists: false}
  forge:
    issues:
      - {id: 1, absent: true}
    merge-requests:
      - id: 1
        comments: 1
        comment-contains: ["<!-- workline:sticky=release/dry-run -->", "would hold the release if it were cut now, on this release's head", "`docs/tech/auth.md` `documentalist suspect`"]
