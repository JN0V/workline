case: release/at-its-tag-compares-with-the-tag-before
about: "A tag pipeline runs on the release it cuts (GitLab's `workline:release`, ADR-0050): its own tag is that release, not the last one. The docs made suspect since the tag before still hold it, with no agent; before, the tag at HEAD was taken for the last release, and nothing ever held a release checked at its tag."
given:
  repo: documented
  setup:
    - "git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git tag v1.1.0"
run: {route: release, ai: none, forge: none}
expect:
  status: block
  agent-calls: 0
  findings:
    - {rule: suspect, where: docs/tech/auth.md, message: "made suspect since v1.0.0"}
