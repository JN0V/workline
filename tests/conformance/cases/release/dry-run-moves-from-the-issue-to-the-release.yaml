case: release/dry-run-moves-from-the-issue-to-the-release
about: "Once a release merge request is open, what would hold the release is said on it alone (ADR-0050): the dry run's part of the default branch's issue, written a night before any was open, is taken out, main's own part left as it is."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '# Changelog' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q main"
  forge:
    issues:
      - id: 4
        title: "workline: findings on the default branch"
        labels: []
        comments: []
        body: "**Nothing found on the default branch** at `1a8e5a4`.\n\n<!-- workline:main-findings {\"keys\":[]} -->\n\n<!-- workline:release-dry-run -->\n\n### The next release\n\n**A release's dry run**: 1 finding would hold the release if it were cut now.\n\n<!-- workline:release-dry-run-end {\"keys\":[\"8c59455411fe98dd\"]} -->\n"
    merge-requests: [{id: 1, branch: release-please--branches--main, base: main, labels: [], comments: []}]
run: {route: release, args: [--dry-run], dry-run-posted: true}
expect:
  status: pass
  findings:
    - {rule: release-dry-run, message: "issue #4 kept: what would hold the release changed; #1: what would hold the release said in its comment"}
  forge:
    issues:
      - id: 4
        comments: 0
        body-contains: ["Nothing found on the default branch", "<!-- workline:main-findings"]
        body-lacks: ["The next release", "workline:release-dry-run"]
    merge-requests:
      - {id: 1, comments: 1, comment-contains: ["`docs/tech/auth.md` `documentalist suspect`"]}
