case: release/dry-run-warns-runs-every-step
about: "A release's dry run only warns (ADR-0050): a gate the project runs at the release that fails, and a doc made suspect, are said as what would hold it; every step runs though the first would stop the release's line, the line passes, and nothing is left to apply."
given:
  repo: documented
  setup:
    - "git tag v1.0.0"
    - "sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"
  config:
    routing: {events: {release: ["gate:release", documentalist]}}
    gates: {release: {checks: [{id: versions, run: "echo 'the version is not bumped' >&2; exit 1", output: exit}]}}
run: {route: release, args: [--dry-run], forge: none}
expect:
  status: pass
  agent-calls: 0
  steps: ["gate:release", documentalist]
  summary: "2 would hold the release if it were cut now (gate:release 1, documentalist 1); said, never a block"
  findings:
    - {rule: suspect, where: docs/tech/auth.md, level: warn}
  no-findings:
    - {rule: suspect, where: docs/tech/auth.md, level: block}
