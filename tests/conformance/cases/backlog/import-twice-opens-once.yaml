case: backlog/import-twice-opens-once
about: An entry whose id an open issue already carries is not opened again, so an import stopped half-way is run again.
given:
  repo: backlog
  setup:
    - |
      cat > ROADMAP.md <<'MD'
      # Roadmap
      
      ## Priority 1
      
      ### BUG-1 — Export: the header row is never written [HIGH] — **DONE (2026-01-01)**
      
      Fixed long ago.
      
      ### BUG-2 — Export: the last row is lost [HIGH]
      
      WriteRows in src/export/csv.go stops one row short.
      
      #### A note under it
      
      Still part of BUG-2.
      
      ### BUG-3 — Export: an empty row becomes a blank line [LOW]
      
      `WriteRows` writes every row as it is.
      
      ## Priority 2
      
      Not an entry.
      MD
      git add ROADMAP.md && git commit -qm 'docs: a roadmap'
  forge:
    issues:
      - {id: 4, title: "BUG-2 — Export: the last row is lost [HIGH]", body: "Opened by the first import.", labels: [], comments: []}
run: {issues-import: [ROADMAP.md, --apply]}
expect:
  status: pass
  forge:
    issues:
      - {id: 4, comments: 0}
      - {id: 5, title: "BUG-3 — Export: an empty row becomes a blank line [LOW]"}
      - {id: 6, absent: true}
