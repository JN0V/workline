case: backlog/blocked-issue-ordered-after-blocker
about: An issue that waits on an open issue, in the forge's own relation, is ordered after it whatever its priority, and never offered first — `ready` though it is; the first ready issue offered is its blocker, and the run says what waits, with no agent (ADR-0028).
given:
  repo: backlog
  forge:
    issues:
      - {id: 12, title: "Quote commas in exported cells", body: "A comma splits a cell.", labels: [workline:ready, workline:priority/1], blocked-by: [13], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Keep the last row in the CSV export", body: "The export drops its last row.", labels: [workline:ready, workline:priority/3], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 14, title: "Export in JSON", body: "Add a JSON export.", labels: [workline:priority/2], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: next-ready, where: "#13"}
    - {rule: waiting, where: "#12", message: "waits on #13, open"}
  no-findings:
    - {rule: next-ready, where: "#12"}
    - {rule: waiting, where: "#13"}
