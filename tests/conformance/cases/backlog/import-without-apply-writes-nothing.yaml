case: backlog/import-without-apply-writes-nothing
about: Without --apply, `workline issues import` reads the file and says what it would open; nothing reaches the forge.
given:
  repo: backlog
  setup:
    - |
      cat > ROADMAP.md <<'MD'
      # Roadmap
      
      Where the project is going.
      
      ## Next
      
      1. **Keep the last row.** WriteRows stops one row short.
         It loses data on every export.
      2. **A JSON export.** Done in 1.2.
      
      ## Later
      
      - Empty rows become blank lines; skip them.
      MD
      git add ROADMAP.md && git commit -qm 'docs: a roadmap'
  forge: {issues: []}
run: {issues-import: [ROADMAP.md], ai: fake:import-roadmap}
expect:
  status: pass
  agent-calls: 1
  coverage:
    - {lines: "7-8", state: would-open}
    - {lines: "13", state: would-open}
    - {lines: "9", state: done, why: "Done in 1.2."}
  forge:
    issues:
      - {id: 1, absent: true}
