case: merge/off-by-default
about: "Off by default (#321): a project with no `merge:` setting; an accepted pull request, green, behind main; when main moves, `workline follow` touches no auto-merge and brings nothing up to date — the merge policy is the project's choice (ADR-0042)."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "sh \"$FIXTURES/verdict.sh\" feat/sessions pass"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, created: "2026-01-04T10:00:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  no-findings: [{rule: auto-merge-on}, {rule: updated}, {rule: merge-unsupported}]
  not-pushed: [feat/sessions]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted], comments: 0}
