case: merge/accepted-review-not-whole-stays-off
about: "A plain yes is no reading (#1107): a pull request past the reviewer's `parts-max`, labelled `workline:accepted` only — as a saved filter puts it in bulk. Its review is not whole, and the label does not say a person read it whole: the head is marked not accepted, auto-merge stays off, and the summary names `review-not-whole` and the label that takes it (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: failure, description: "short: [review-not-whole] its review falls short (review-not-whole): the change would take 4 parts, each within the role's context budget and diff-lines-max, past parts-max (2)", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: review-short, where: "#7", level: warn, message: "accepted by @dana, but its review falls short (review-not-whole)"}]
  no-findings: [{rule: auto-merge-on}]
  summary-file: ["auto-merge stays off", "a person who read it whole puts `workline:accepted-whole`"]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted]}
    statuses:
      - {commit: feat/sessions, name: workline/accepted, state: failure, by: workline-bot, description: "its review falls short (review-not-whole)"}
