case: merge/accepted-whole-after-a-push-stays
about: "Each yes covers its own head (#1107): a person put `workline:accepted`, an agent pushed, then the person read the new head whole and put `workline:accepted-whole`. The plain label is stale and alone taken off, said in a comment; the whole yes covers the head as it is now, so it stays and takes the review not whole: auto-merge is turned on (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && echo more > more.txt && git add more.txt && git commit -qm 'feat(auth): one more thing' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: failure, description: "short: [review-not-whole] its review falls short (review-not-whole): the change would take 4 parts, past parts-max (2)", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted, workline:accepted-whole]
        label-events:
          - {label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}
          - {label: workline:accepted-whole, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T11:00:00Z"}
        pushes: [{head: "feat/sessions~1", at: "2026-01-04T09:00:00Z"}, {head: feat/sessions, at: "2026-01-04T10:30:00Z"}]
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: accepted-reset, where: "#7", level: warn, message: "was pushed after @dana put `workline:accepted`: that label taken off"}
    - {rule: auto-merge-on, where: "#7", message: "accepted by @dana, read whole by @dana (review-not-whole): auto-merge turned on"}
  forge:
    merge-requests:
      - id: 7
        auto-merge: true
        labels: [workline:accepted-whole]
        comments: 1
        comment-contains: ["workline took `workline:accepted` off", "`workline:accepted-whole`, put by @dana since, covers the head as it is now"]
    statuses:
      - {commit: feat/sessions, name: workline/accepted, state: success, by: workline-bot, description: "accepted by @dana, read whole by @dana (review-not-whole)"}
