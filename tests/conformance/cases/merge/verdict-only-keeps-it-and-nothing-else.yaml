case: merge/verdict-only-keeps-it-and-nothing-else
about: "`workline follow --verdict <file> --verdict-only`, the job of its own GitHub's concurrency never cancels (#321's review): the line's verdict on the head is kept — the status `workline/verdict`, by the token —, and nothing else is done: no auto-merge turned on, no yes held, no merge request brought up to date; the `follow` job after it does that (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "sh \"$FIXTURES/verdict.sh\" feat/sessions pass ../verdict.json"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        comments: []
run: {follow: [--base, main, --verdict, ../verdict.json, --verdict-only]}
expect:
  status: pass
  summary: "the line's verdict kept, nothing else followed"
  findings: [{rule: verdict-kept, message: "pass"}]
  no-findings: [{rule: auto-merge-on}, {rule: updated}]
  not-pushed: [feat/sessions]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false}
    statuses:
      - {commit: feat/sessions, name: workline/verdict, state: success, by: workline-bot}
      - {commit: feat/sessions, name: workline/accepted, absent: true}
