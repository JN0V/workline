case: merge/persons-comment-open-holds-the-merge
about: >
  With `forge: local` at `normal`, the developer's fix `!2` would merge
  with no person's yes, but a person's comment on it has no answer
  yet: `workline follow` merges nothing, main stays where it was,
  `!2` stays open, and the request says a person's comment is open.
given:
  repo: local-fix
  config: {forge: local, merge: {autonomy: normal}}
  setup:
    - "printf '\\n<!-- workline-comment -->\\nmul still adds: please multiply.\\n' >> .git/workline/merge-requests/2.md"
run: {follow: [--base, main, --verdict, .git/verdict.json], forge: local}
expect:
  status: pass
  no-findings: [{rule: merged-at-once}, {rule: issue-closed}]
  files:
    lib.sh: {lacks: "mul()"}
    .git/workline/issues/3.md: {contains: "state: open"}
    .git/workline/merge-requests/2.md: {contains: ["state: open", "a person's comment"], lacks: "state: merged"}
  issues-listed: ["!2    open"]
