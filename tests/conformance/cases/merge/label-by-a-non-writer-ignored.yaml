case: merge/label-by-a-non-writer-ignored
about: "A label put by someone who cannot write to the repository is no yes (ADR-0038's who counts, ADR-0042): `workline follow` turns nothing on, and says who put it."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: zed
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: zed, insider: false, created: "2026-01-04T10:00:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: label-ignored, where: "#7", level: warn, message: "labelled `workline:accepted` by @zed, who may not push nor merge here: no yes"}]
  no-findings: [{rule: auto-merge-on}]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted]}
