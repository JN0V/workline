case: merge/local-fix-merges-alone
about: >
  With `forge: local` at `merge: {autonomy: normal}`, the developer's
  fix of a reproduced bug merges with no person's yes, as a forge's
  auto-merge would (#1322): `!2`, from workline/developer/3, its every
  commit a role's by its trailer, the reviewer's verdict on its head and
  the line's pass kept on it. The local forge has no auto-merge, so
  `workline follow` makes the merge itself, a merge commit into main
  naming `!2`, nothing pushed; then, in the same run, it closes #3, which
  `!2` says it closes. The tester's Draft, `!1`, is left: a draft.
given:
  repo: local-fix
  config: {forge: local, merge: {autonomy: normal}}
run: {follow: [--base, main, --verdict, .git/verdict.json], forge: local}
expect:
  status: pass
  findings:
    - {rule: verdict-kept, message: "pass, the line passed"}
    - {rule: draft, where: "!1", message: "workline's own, but a draft: nothing turned on"}
    - {rule: merged-at-once, where: "!2", message: "with no person's yes, workline's own code — the developer's code for #3, a fix: its issue labelled `bug` —, from a role's branch of this clone"}
    - {rule: issue-closed, where: "#3", message: "!2, which says it closes it, is merged into main"}
    - {rule: state-cleared, where: "#3"}
  no-findings: [{rule: merge-unsupported}, {rule: waits-for-a-yes}]
  branches:
    main: {lib.sh: "mul()"}
  files:
    lib.sh: {contains: "mul()"}
    .git/workline/issues/3.md: {contains: ["state: closed", "Closed by !2, merged into main."], lacks: "workline:developing"}
    .git/workline/merge-requests/2.md: {contains: ["state: merged", "Merging with no person's yes", "It goes into main in this clone, nothing pushed; a merge refused is said on it.", "workline:merge-alone=code"]}
  issues-listed: ["!2    merged"]
