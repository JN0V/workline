case: merge/accepted-whole-red-check-holds
about: "A red check still holds (#1107): a person read the change whole and put `workline:accepted-whole`, but `test` failed on its head. The reading takes the review's place, never a check's: nothing is turned on, and the summary says why (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: failure, description: "short: its review falls short (review-not-whole): the change would take 4 parts, each within the role's context budget and diff-lines-max, past parts-max (2)", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted-whole]
        label-events: [{label: workline:accepted-whole, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        check-runs: [{name: test, state: failure}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: checks-red, where: "#7", level: warn, message: "accepted by @dana, but a check failed on its head"}]
  no-findings: [{rule: auto-merge-on}]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted-whole], comments: 0}
