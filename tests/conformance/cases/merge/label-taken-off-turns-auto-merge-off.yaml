case: merge/label-taken-off-turns-auto-merge-off
about: "The veto by the label (ADR-0042): workline turned auto-merge on for an accepted pull request, and a person took the label off since; `workline follow` turns auto-merge off and leaves it out of line."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "sh \"$FIXTURES/verdict.sh\" feat/sessions pass"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: []
        label-events:
          - {label: workline:accepted, added: true, author: dana, insider: true, created: "2026-01-04T10:00:00Z"}
          - {label: workline:accepted, added: false, author: dana, insider: true, created: "2026-01-04T11:00:00Z"}
        auto-merge: true
        auto-merge-by: workline-bot
        auto-merge-at: "2026-01-04T10:01:00Z"
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: auto-merge-off, where: "#7", message: "was taken off since auto-merge was turned on: auto-merge turned off"}]
  no-findings: [{rule: updated}]
  not-pushed: [feat/sessions]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false}
