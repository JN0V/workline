case: merge/marked-draft-turns-auto-merge-off
about: "My veto (#321), by Draft after the yes: auto-merge on, a person marks the accepted pull request a draft; `workline follow` turns auto-merge off, so marked ready again it does not merge until the label is put again (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        draft: true
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-by: workline-bot
        auto-merge-at: "2026-01-04T10:01:00Z"
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: draft, where: "#7", message: "then marked a draft: auto-merge turned off, until the label is put again"}]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted]}
