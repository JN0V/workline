case: merge/auto-merge-by-hand-joins-the-line
about: "A pull request whose auto-merge a person turned on by hand, with no label, joins the line too (ADR-0042): behind main, it is brought up to date when first; its auto-merge, the person's, is left on."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    merge-requests:
      - {id: 7, branch: feat/sessions, base: main, author: dana, labels: [], auto-merge: true, auto-merge-by: dana, auto-merge-at: "2026-01-04T10:00:00Z", comments: []}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: updated, where: "#7", message: "first in line, brought up to date"}]
  no-findings: [{rule: auto-merge-off}]
  merged: {feat/sessions: main}
  forge:
    merge-requests:
      - {id: 7, auto-merge: true, labels: []}
