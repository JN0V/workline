case: merge/unready-never-holds-the-line
about: "The line never stalls on one not ready (#321's review): accepted first, up to date, but its head not judged yet — a person's, and a fork's whose run keeps no verdict — each waits, named, without holding the rest; one whose check failed is out of line, said, before its verdict is even looked for; the next ready one behind is brought up to date (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/b && echo b > b.txt && git add b.txt && git commit -qm 'feat: b' && git push -q origin feat/b && git checkout -q main"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
    - "git checkout -qb feat/a && echo a > a.txt && git add a.txt && git commit -qm 'feat: a' && git push -q origin feat/a && git checkout -q main"
    - "git checkout -qb feat/c && echo c > c.txt && git add c.txt && git commit -qm 'feat: c' && git push -q origin feat/c && git checkout -q main"
    - "git checkout -qb patch-1 && echo typo > typo.txt && git add typo.txt && git commit -qm 'fix: a typo' && git push -q origin HEAD:refs/pull/9/head && git checkout -q main"
  forge:
    statuses:
      - {commit: feat/b, name: workline/verdict, state: success, description: "pass: the line passed", by: workline-bot}
    merge-requests:
      - {id: 7, branch: feat/a, base: main, author: dana, labels: [workline:accepted], comments: [],
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T09:00:00Z"}]}
      - {id: 9, branch: patch-1, base: main, fork: true, author: zed, labels: [workline:accepted], comments: [],
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T09:30:00Z"}]}
      - {id: 10, branch: feat/c, base: main, author: dana, labels: [workline:accepted], comments: [], checks: failure,
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T09:45:00Z"}]}
      - {id: 8, branch: feat/b, base: main, author: dana, labels: [workline:accepted], auto-merge: true, auto-merge-by: workline-bot, auto-merge-at: "2026-01-04T11:01:00Z", comments: [],
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T11:00:00Z"}]}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: verdict-missing, where: "#7"}
    - {rule: verdict-missing, where: "#9"}
    - {rule: checks-red, where: "#10", level: warn, message: "a check failed on its head"}
    - {rule: updated, where: "#8", message: "first in line, brought up to date"}
  merged: {feat/b: main}
  not-pushed: [feat/a, feat/c]
  summary-file: ["in line into main, #7, #9, #8", "first in line #8, brought up to date"]
