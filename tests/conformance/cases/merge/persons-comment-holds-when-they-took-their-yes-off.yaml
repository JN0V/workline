case: merge/persons-comment-holds-when-they-took-their-yes-off
about: >
  A person writes a question, puts `workline:accepted`, then takes it off themselves. Their own yes no longer answers the question: it holds, nothing merges, the hold is said.
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: zed
        labels: []
        auto-merge: true
        label-events:
          - {label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}
          - {label: workline:accepted, added: false, author: dana, insider: true, writer: true, created: "2026-01-04T10:30:00Z"}
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z", by: zed}]
        comments:
          - {body: "Wait: does this keep a revoked token valid?", author: dana, insider: true, created: "2026-01-04T09:59:58Z"}
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: persons-comment-open, where: "#7", level: warn}]
  no-findings: [{rule: auto-merge-on, where: "#7"}]
