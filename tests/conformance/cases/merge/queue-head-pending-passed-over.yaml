case: merge/queue-head-pending-passed-over
about: >
  The head of the queue, `#7`, was updated at 10:10 (its last push, its
  branch's tip made then), and main moved again: it is behind with its
  checks still pending. `workline follow` runs 31 minutes after that
  update, at 10:41. The head is passed over, said "checks pending past
  30 min", and main is merged into the next pull request, `#8`.
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  env: {WORKLINE_CLOCK: "2026-01-04T10:41:00Z"}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/developer/3 && echo 'One.' > ONE.md && git add ONE.md && GIT_AUTHOR_DATE=2026-01-04T10:10:00Z GIT_COMMITTER_DATE=2026-01-04T10:10:00Z git commit -qm 'docs: one' -m 'Workline-Role: developer' && git push -q origin workline/developer/3 && git checkout -q main"
    - "git checkout -qb workline/developer/4 && echo 'Two.' > TWO.md && git add TWO.md && git commit -qm 'docs: two' -m 'Workline-Role: developer' && git push -q origin workline/developer/4 && git checkout -q main"
    - "echo 'More.' > MORE.md && git add MORE.md && git commit -qm 'docs: more' && git push -q origin main"
  forge:
    statuses:
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "workline/developer/4", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: workline/developer/3
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:05:00Z"
        auto-merge-by: workline-bot
        checks: pending
        behind: true
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z"}, {head: workline/developer/3, at: "2026-01-04T10:10:00Z"}]
        comments: []
      - id: 8
        branch: workline/developer/4
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:06:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/4, at: "2026-01-04T09:00:00Z"}]
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: merged-from-base, where: "#8"}]
  no-findings: [{rule: merged-from-base, where: "#7"}]
  pushed:
    workline/developer/4: {MORE.md: "More.", TWO.md: "Two."}
  not-pushed: [workline/developer/3]
  summary-file: ["#7: passed over", "checks pending past 30 min", "#8: head of the queue"]
