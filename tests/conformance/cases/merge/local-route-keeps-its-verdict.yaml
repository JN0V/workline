case: merge/local-route-keeps-its-verdict
about: >
  With `forge: local` and a merge policy, `workline route merge-request`
  keeps the line's verdict on the head it judged, in the clone, with no
  file to hand over (#1322); `workline follow` reads it there. Here the
  committer refuses the branch's commit: a person's yes on `!1` does not
  merge it, the red verdict named.
given:
  repo: basic
  setup:
    - "git checkout -qb workline/developer/1 && echo one > one.txt && git add one.txt && git commit -qm 'fix: write the first file of the series, the one the rest of the work depends on'"
    - |
      mkdir -p .git/workline/merge-requests && cat > .git/workline/merge-requests/1.md <<'MR'
      ---
      title: "fix: write one"
      state: open
      labels: []
      branch: workline/developer/1
      base: main
      ---

      Closes #1
      MR
  config:
    forge: local
    merge: {autonomy: cautious}
    routing: {events: {merge-request: [committer]}}
run:
  sh: >
    workline issues label '!1' --add workline:accepted &&
    { workline route merge-request --target merge-request:1 --ai none;
    git checkout -q main && workline follow --base main --json; }
expect:
  exit: 0
  stderr: ["verdict-kept", "red", "`workline follow` weighs it"]
  stdout: ["\"rule\": \"verdict-red\"", "the line's verdict on its head is block"]
  files:
    one.txt: {exists: false}
    .git/workline/merge-requests/1.md: {contains: "state: open"}
