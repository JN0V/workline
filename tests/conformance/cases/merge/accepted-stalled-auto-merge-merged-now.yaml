case: merge/accepted-stalled-auto-merge-merged-now
about: "An auto-merge the forge never fired is merged by the line (#993): a person put `workline:accepted`, `workline follow` turned auto-merge on while a check still ran; that check ended green, but GitHub's auto-merge acts on an event and missed it. The forge says it would merge it now (GitHub: `mergeStateStatus` CLEAN): the next `workline follow` merges it, saying the forge had left it (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:05:00Z"
        auto-merge-by: workline-bot
        clean: true
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: merged-at-once, where: "#7", message: "accepted by @dana, its head's verdict passed; auto-merge on since 2026-01-04T10:05:00Z, but the forge had not merged it, its rules met: merged now"}]
  no-findings: [{rule: auto-merge-on}]
  not-pushed: [feat/sessions]
  summary-file: ["1 merged at once"]
  forge:
    merge-requests:
      - {id: 7, merged: true, closed: true, comments: 0}
