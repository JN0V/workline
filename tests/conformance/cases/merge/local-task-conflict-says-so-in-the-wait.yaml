case: merge/local-task-conflict-says-so-in-the-wait
about: >
  Conflict is said: with `forge: local` at `normal`, the developer's pull
  request `!2` closes #3, labelled `task`, so it waits for a person's yes.
  Main changed the same lines of lib.sh since its branch left it. The
  comment on `!2` that asks for the yes says it conflicts with main, since
  the label alone will not merge it.
given:
  repo: local-fix
  config: {forge: local, merge: {autonomy: normal}}
  setup:
    - "sed -i 's/labels: \\[bug,/labels: [task,/' .git/workline/issues/3.md"
    - "printf 'add() { echo $(($1 + $2)); }\\nsub() { echo $(($1 - $2)); }\\n' > lib.sh && git commit -qam 'feat: sub'"
run: {follow: [--base, main, --verdict, .git/verdict.json], forge: local}
expect:
  status: pass
  no-findings: [{rule: merged-at-once}]
  files:
    lib.sh: {lacks: "mul()"}
    .git/workline/merge-requests/2.md:
      contains: ["state: open", "**Waiting for a person's yes**", "conflicts with main", "put the label `workline:accepted`"]
