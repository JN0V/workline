case: merge/queue-head-up-to-date-pending-passed-after-30-min
about: >
  The head of the queue was updated by workline (main merged into its
  branch, pushed at 10:00): no longer behind, its checks still pending
  31 minutes after, past the 30 minutes the head keeps its place. It is
  passed over, said, and the next one, #8, is updated alone.
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  env: {WORKLINE_CLOCK: "2026-01-04T10:31:00Z"}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/developer/3 && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' -m 'Workline-Role: developer' && git push -q origin workline/developer/3 && git checkout -q main"
    - "git checkout -qb workline/developer/4 main && echo A > A.md && git add A.md && git commit -qm 'docs: a' -m 'Workline-Role: developer' && git push -q origin workline/developer/4 && git checkout -q main"
    - "echo 'More.' > MORE.md && git add MORE.md && git commit -qm 'docs: more' && git push -q origin main"
    - "echo 'Other.' > OTHER.md && git add OTHER.md && git commit -qm 'docs: other' && git push -q origin main"
    - "git checkout -q workline/developer/3 && git merge -q --no-ff main -m \"Merge branch 'main' into workline/developer/3\" -m 'Workline-Role: developer' && git push -q origin workline/developer/3 && git checkout -q main"
  forge:
    statuses:
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "workline/developer/4", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: workline/developer/3
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T09:30:00Z"
        auto-merge-by: workline-bot
        checks: pending
        pushes: [{head: "workline/developer/3~1", at: "2026-01-04T09:00:00Z"}, {head: workline/developer/3, at: "2026-01-04T10:00:00Z", by: workline-bot}]
        comments: []
      - id: 8
        branch: workline/developer/4
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:06:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/4, at: "2026-01-04T09:00:00Z"}]
        comments: []
run:
  follow: [--base, main]
  summary: true
expect:
  status: pass
  findings: [{rule: merged-from-base, where: "#8"}]
  no-findings: [{rule: merged-from-base, where: "#7"}]
  pushed:
    workline/developer/4: {OTHER.md: "Other."}
  not-pushed: [workline/developer/3]
  summary-file: ["#7: passed over, checks pending past 30 min", "#8: head of the queue, main merged in"]
