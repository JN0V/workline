case: merge/no-yes-nothing-turned-on
about: "No yes (#321), never without one (ADR-0042): a person's pull request, the release tool's and a fork's, each green — the line passed on its head — but none labelled `workline:accepted`; when main moves, `workline follow` turns no auto-merge on and brings none up to date."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && sh \"$FIXTURES/verdict.sh\" HEAD pass && git checkout -q main"
    - "git checkout -qb release-please--branches--main && echo '1.1.0' > version.txt && git add version.txt && git commit -qm 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && sh \"$FIXTURES/verdict.sh\" HEAD pass && git checkout -q main"
    - "git checkout -qb patch-1 && echo typo > typo.txt && git add typo.txt && git commit -qm 'fix: a typo' && git push -q origin HEAD:refs/pull/9/head && sh \"$FIXTURES/verdict.sh\" HEAD pass && git checkout -q main"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    merge-requests:
      - {id: 7, branch: feat/sessions, base: main, author: dana, labels: [], comments: []}
      - {id: 8, branch: release-please--branches--main, base: main, author: "workline-app[bot]", bot: true, labels: [], comments: []}
      - {id: 9, branch: patch-1, base: main, fork: true, author: zed, labels: [], comments: []}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  no-findings: [{rule: auto-merge-on}, {rule: updated}, {rule: fork-behind}, {rule: merged-at-once}]
  not-pushed: [feat/sessions, release-please--branches--main]
  summary-file: ["merge policy (cautious): none in line into main"]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, comments: 0}
      - {id: 8, auto-merge: false, comments: 0}
      - {id: 9, auto-merge: false, comments: 0}
