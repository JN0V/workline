case: merge/project-default-leaves-merge-level
about: "The merge keeps its own key (ADR-0060, §3): `merge: {autonomy: normal}` and the project's default `autonomy: enterprising`; `workline follow` merges at normal, as it would with no default: workline's own routine pull request merges alone, by the policy at normal."
given:
  repo: documented
  config:
    forge: 'cmd:sh "$FIXTURES/forges/merging-routine.sh"'
    autonomy: enterprising
    merge: {autonomy: normal}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/documentalist/suspect && sed -i '/^checked:/a judged: 1a2b3c4' docs/tech/auth.md && GIT_COMMITTER_NAME='workline-app[bot]' git commit -qam 'docs: record the docs judged' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/suspect && git checkout -q main"
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: auto-merge-on, where: "#9", message: "with no person's yes, workline's own records"}]
