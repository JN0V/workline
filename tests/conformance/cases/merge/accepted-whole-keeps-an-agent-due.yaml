case: merge/accepted-whole-keeps-an-agent-due
about: "A reading is not an agent (#1107): `workline:accepted-whole` takes a review too large for the reviewer's parts, not one no agent made. A pull request whose line passed with no agent (`not-reviewed`) stays off, labelled so: where the project sets an agent, one must answer (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: failure, description: "short: its review falls short (not-reviewed): no agent: only the rules that need no judgement ran", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted-whole]
        label-events: [{label: workline:accepted-whole, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: review-short, where: "#7", level: warn, message: "accepted by @dana, but its review falls short (not-reviewed): no agent"}]
  no-findings: [{rule: auto-merge-on}]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted-whole]}
