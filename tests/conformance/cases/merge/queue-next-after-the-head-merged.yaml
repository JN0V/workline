case: merge/queue-next-after-the-head-merged
about: >
  One update per merge: the head of the queue has merged, and two
  accepted developer pull requests are left behind main, `!8` second
  before and now first, `!9` after it. The next `workline follow` updates
  the former position 2, `!8`, alone: main merged into its branch, a
  merge commit pushed; `!9` is queued and its branch is left where it
  was, so main is merged into one pull request per merge, not into every
  one still waiting.
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  env: {WORKLINE_CLOCK: "2026-01-04T10:00:00Z"}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/developer/4 && echo 'Other.' > OTHER.md && git add OTHER.md && git commit -qm 'docs: other' -m 'Workline-Role: developer' && git push -q origin workline/developer/4 && git checkout -q main"
    - "git checkout -qb workline/developer/5 && echo 'Third.' > THIRD.md && git add THIRD.md && git commit -qm 'docs: third' -m 'Workline-Role: developer' && git push -q origin workline/developer/5 && git checkout -q main"
    - "echo 'More.' > MORE.md && git add MORE.md && git commit -qm 'docs: more' && git push -q origin main"
  forge:
    statuses:
      - {commit: "workline/developer/4", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "workline/developer/5", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 8
        branch: workline/developer/4
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T09:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T09:06:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/4, at: "2026-01-04T08:55:00Z"}]
        comments: []
      - id: 9
        branch: workline/developer/5
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T09:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T09:07:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/5, at: "2026-01-04T08:55:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: merged-from-base, where: "#8", message: "main merged into workline/developer/4"}]
  no-findings: [{rule: merged-from-base, where: "#9"}]
  pushed:
    workline/developer/4: {MORE.md: "More.", OTHER.md: "Other."}
  not-pushed: [workline/developer/5]
