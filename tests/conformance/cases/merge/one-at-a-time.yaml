case: merge/one-at-a-time
about: "One at a time (#321): three accepted pull requests behind main; when main moves, `workline follow` brings up to date only the first accepted — the order the labels were put, not their numbers —, the others wait until it merges: each update runs a pull request's checks, and only one merges before the rest are behind again (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "for b in a b c; do git checkout -qb feat/$b main && echo $b > $b.txt && git add $b.txt && git commit -qm \"feat: $b\" && git push -q origin feat/$b; done; git checkout -q main"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    statuses:
      - {commit: "feat/a", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "feat/b", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "feat/c", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - {id: 7, branch: feat/a, base: main, author: dana, labels: [workline:accepted], auto-merge: true, auto-merge-by: workline-bot, auto-merge-at: "2026-01-04T11:01:00Z", comments: [],
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T11:00:00Z"}]}
      - {id: 8, branch: feat/b, base: main, author: dana, labels: [workline:accepted], auto-merge: true, auto-merge-by: workline-bot, auto-merge-at: "2026-01-04T12:01:00Z", comments: [],
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T12:00:00Z"}]}
      - {id: 9, branch: feat/c, base: main, author: dana, labels: [workline:accepted], auto-merge: true, auto-merge-by: workline-bot, auto-merge-at: "2026-01-04T10:01:00Z", comments: [],
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: updated, where: "#9", message: "first in line, brought up to date"}]
  no-findings: [{rule: updated, where: "#7"}, {rule: updated, where: "#8"}]
  merged: {feat/c: main}
  not-pushed: [feat/a, feat/b]
  summary-file: ["in line into main, #9, #7, #8", "first in line #9, brought up to date"]
