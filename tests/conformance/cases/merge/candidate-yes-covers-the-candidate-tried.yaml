case: merge/candidate-yes-covers-the-candidate-tried
about: >
  A yes covers the candidate tried (ADR-0060, §4): dana put
  `workline:accepted` on #8 on 2026-01-05; `v1.1.0-rc.2`, with a fix
  copied, was tagged on 2026-01-06. Her yes was for `rc.1`: `workline
  follow` takes the label off, says why on #8, and asks the release tool
  for nothing. The version ships only on a yes given to the candidate as
  it is.
given:
  repo: tested
  config: {merge: {autonomy: enterprising}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git tag v1.0.0"
    - "git checkout -qb release/v1.1 && git commit -q --allow-empty -m 'chore: release 1.1.0-rc.1' -m 'Release-As: 1.1.0-rc.1' && git tag v1.1.0-rc.1 && printf 'add() { echo $(($1 + $2)); }\\nmul() { echo $(($1 * $2)); }\\n' > lib.sh && GIT_COMMITTER_DATE=2026-01-06T10:00:00Z git commit -qam 'fix: mul' -m 'Release-As: 1.1.0-rc.2' && git tag v1.1.0-rc.2 && git checkout -q main && git push -q origin main release/v1.1 --tags"
  forge:
    milestones: ["v1.1"]
    statuses:
      - {commit: "main", name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
    issues:
      - id: 8
        title: "Release candidate v1.1.0-rc.1: try it, then say yes"
        author: workline-bot
        labels: ["workline:candidate", "workline:accepted"]
        milestone: v1.1
        body: "A candidate.\n\n<!-- workline:candidate=v1.1.0-rc.1 -->"
        label-events:
          - {label: "workline:accepted", added: true, author: dana, writer: true, insider: true, created: "2026-01-05T10:00:00Z"}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: candidate-yes-reset, where: "#8", message: "v1.1.0-rc.2 was tagged after @dana's yes"}
  no-findings: [{rule: candidate-shipped}]
  not-pushed: [release/v1.1]
  forge:
    issues:
      - {id: 8, closed: false, labels: ["workline:candidate"], comment-contains: ["**workline took `workline:accepted` off**"]}
    milestones: ["v1.1"]
