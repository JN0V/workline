case: merge/behind-main-brought-up-to-date
about: "Behind main (#321): an accepted pull request whose auto-merge is on waits, the base requiring it up to date; when main moves, `workline follow` merges main into it as the forge's Update branch does — a merge commit, its commits kept, workline's trailer so the line judges the commits before it — and its auto-merge stays on: it merges once its checks pass again (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "sh \"$FIXTURES/verdict.sh\" feat/sessions pass"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && git add src && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge:
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:01:00Z"
        auto-merge-by: workline-bot
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: updated, where: "#7", message: "first in line, brought up to date: main merged in"}]
  no-findings: [{rule: auto-merge-on}]
  merged: {feat/sessions: main}
  pushed:
    feat/sessions: {src/auth/token.go: "7200", src/auth/refresh.go: "Refresh renews"}
  pushed-message: {feat/sessions: "Merge branch 'main' into feat/sessions\n\nBrought up to date with main by the project's merge policy"}
  summary-file: ["first in line #7, brought up to date"]
  forge:
    merge-requests:
      - {id: 7, auto-merge: true, labels: [workline:accepted], comments: 0}
