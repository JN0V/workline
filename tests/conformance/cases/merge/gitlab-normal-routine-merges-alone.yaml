case: merge/gitlab-normal-routine-merges-alone
about: "On GitLab (#322): at `normal`, the documentalist's merge request opened by the project's bot — the token's user, a bot as the users API says — only records which docs were read; every push to its branch the bot's, as the project's push events name them; its commit committed as the template's jobs commit (`workline`); the line passed on its head (the verdict in hand, as GitLab keeps none). Nobody labelled it: `workline follow` notes on it that it merges with no person's yes, and sets it to merge when its pipeline succeeds, as for a yes (ADR-0042, amended)."
given:
  repo: documented
  config: {merge: {autonomy: normal}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/documentalist/suspect && sed -i '/^checked:/a judged: 1a2b3c4' docs/tech/auth.md && GIT_COMMITTER_NAME=workline git commit -qam 'docs: record the docs judged' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/suspect && git checkout -q main"
    - "sh \"$FIXTURES/verdict.sh\" workline/documentalist/suspect pass ../verdict.json"
  forge:
    members: [{username: dana, access_level: 30}]
    bots: [workline-bot]
    statuses:
      - {commit: main, name: workline/merge-read, state: success, description: "reverts read; held:", by: workline-bot}
    merge-requests:
      - {id: 9, branch: workline/documentalist/suspect, base: main, author: workline-bot, labels: [], comments: [],
         pushes: [{head: workline/documentalist/suspect, at: "2026-01-04T09:00:00Z", by: workline-bot}]}
run: {follow: [--base, main, --verdict, ../verdict.json], forge: gitlab}
expect:
  status: pass
  findings:
    - {rule: auto-merge-on, where: "!9", message: "with no person's yes, workline's own records"}
  no-findings: [{rule: waits-for-a-yes}, {rule: merge-app-unknown}]
  forge:
    merge-requests:
      - {id: 9, auto-merge: true, comments: 1, comment-contains: ["Merging with no person's yes", "workline:merge-alone=records"]}
