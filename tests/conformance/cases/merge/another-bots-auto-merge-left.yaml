case: merge/another-bots-auto-merge-left
about: "A dependency bot turned its own pull request's auto-merge on (Renovate's platform automerge), no label: no person's yes, and no workline's act to take back — `workline follow` neither turns it off nor merges main into the bot's branch, which the bot rebuilds itself (ADR-0041, ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb renovate/go-1.x && echo 'go 1.25' > go.mod && git add go.mod && git commit -qm 'chore(deps): update go to 1.25' && git push -q origin renovate/go-1.x && git checkout -q main"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    merge-requests:
      - {id: 7, branch: renovate/go-1.x, base: main, author: "renovate[bot]", bot: true, labels: [], auto-merge: true, auto-merge-by: "renovate[bot]", auto-merge-at: "2026-01-04T10:00:00Z", comments: []}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  no-findings: [{rule: auto-merge-off}, {rule: updated}]
  not-pushed: [renovate/go-1.x]
  summary-file: ["merge policy (cautious): none in line into main"]
  forge:
    merge-requests:
      - {id: 7, auto-merge: true, comments: 0}
