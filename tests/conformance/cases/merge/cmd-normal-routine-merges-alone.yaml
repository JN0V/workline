case: merge/cmd-normal-routine-merges-alone
about: "With `forge: cmd:<command>` (#322): at `normal`, workline's own records merge request, opened by a bot, unlabelled, its head's verdict passed: the policy asks the command to note it (`comment`, the merge recorded), to hold the yes on its head (`accept`) and to turn auto-merge on (`auto-merge`), as on GitHub and GitLab — no operation beyond those `cautious` uses (ADR-0042, amended)."
given:
  repo: documented
  config:
    forge: 'cmd:sh "$FIXTURES/forges/merging-routine.sh"'
    merge: {autonomy: normal}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/documentalist/suspect && sed -i '/^checked:/a judged: 1a2b3c4' docs/tech/auth.md && git commit -qam 'docs: record the docs judged' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/suspect && git checkout -q main"
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: auto-merge-on, where: "#9", message: "with no person's yes, workline's own records"}]
  files:
    .git/forge-requests.jsonl: {contains: ['"operation":"comment"', 'workline:merge-alone=records', '"operation":"accept"', '"ok":true', '"operation":"auto-merge"', '"on":true']}
