case: merge/behind-main-merges-as-it-is
about: "Behind main (ADR-0051, cut 2): an accepted pull request whose auto-merge is on, its head's verdict passed, is not brought up to date when main moves: `workline follow` pushes nothing, and the forge merges it once its own head is green. A red main after it is main's run's to say."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && git add src && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:01:00Z"
        auto-merge-by: workline-bot
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  no-findings: [{rule: updated}, {rule: auto-merge-on}]
  not-pushed: [feat/sessions]
  summary-file: ["accepted into main, #7: each merges once its own head is green"]
  forge:
    merge-requests:
      - {id: 7, auto-merge: true, labels: [workline:accepted], comments: 0}
