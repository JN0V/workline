case: merge/normal-routine-merges-alone
about: "A record merges alone (#322): with `merge: {autonomy: normal}`, the documentalist's gardening pull request only records which docs were read (`judged`), every commit its own — checked by its tree, its trailer never taken alone —, its head's verdict passed with every agent's review whole. Nobody labelled it: `workline follow` sets `workline/accepted` on its head itself, records on the pull request that it merges with no person's yes, its kind and why, and turns auto-merge on, the same path as a yes. The summary says which kinds merge with no person's yes (ADR-0042, amended)."
given:
  repo: documented
  config: {merge: {autonomy: normal}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/documentalist/suspect && sed -i '/^checked:/a judged: 1a2b3c4' docs/tech/auth.md && git commit -qam 'docs: record the docs judged' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/suspect && git checkout -q main"
  forge:
    statuses:
      - {commit: "workline/documentalist/suspect", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - {id: 9, branch: workline/documentalist/suspect, base: main, author: "workline-app[bot]", bot: true, title: "docs: bring the docs in line with the code", labels: [], comments: []}
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings:
    - {rule: auto-merge-on, where: "#9", message: "with no person's yes, workline's own records — it only records when docs were read —, every commit workline's own"}
  no-findings: [{rule: waits-for-a-yes}, {rule: label-ignored}]
  not-pushed: [workline/documentalist/suspect]
  summary-file: ["merge policy (normal; with no person's yes: workline's own merge requests, records, derived, docs)", "in line into main, #9", "auto-merge turned on for 1"]
  forge:
    merge-requests:
      - {id: 9, auto-merge: true, labels: [], comments: 1, comment-contains: ["Merging with no person's yes", "workline's own records", "workline:merge-alone=records"]}
    statuses:
      - {commit: "workline/documentalist/suspect", name: workline/accepted, state: success, by: workline-bot, description: "with no person's yes: workline's own records"}
