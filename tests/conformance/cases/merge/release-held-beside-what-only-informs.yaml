case: merge/release-held-beside-what-only-informs
about: "A release pull request's verdict as a real line writes it (#536): the documentalist step held — its docs due, `block`, waiting for the night —, beside many findings that only inform, with no level (budgets, links). It is kept held, pending, never red: the steps say which held (ADR-0050, §7; ADR-0042). Before, those findings with no level were read as blocks, and the release was red."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb release-please--branches--main && echo '1.1.0' > version.txt && git add version.txt && git commit -qm 'chore(main): release 1.1.0' && git push -q origin release-please--branches--main && git checkout -q main"
    - "H=$(git rev-parse release-please--branches--main) && printf '{\"head\": \"%s\", \"status\": \"block\", \"steps\": [{\"name\": \"committer\", \"status\": \"pass\"}, {\"name\": \"documentalist\", \"status\": \"block\", \"held\": true}], \"findings\": [{\"rule\": \"doc-too-long\", \"where\": \"CHANGELOG.md\", \"message\": \"474 lines\"}, {\"rule\": \"links-not-checked\", \"where\": \"README.md\", \"message\": \"12 links\"}, {\"rule\": \"suspect\", \"where\": \"docs/tech/auth.md\", \"level\": \"block\", \"message\": \"made suspect since v1.0.0\"}, {\"rule\": \"ai-waits-for-night\", \"level\": \"warn\", \"message\": \"1 doc due\"}]}' \"$H\" > ../verdict.json"
  forge:
    merge-requests:
      - {id: 10, branch: release-please--branches--main, base: main, author: "workline-app[bot]", bot: true, labels: [workline:accepted], comments: [],
         label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]}
run: {follow: [--base, main, --verdict, ../verdict.json]}
expect:
  status: pass
  findings:
    - {rule: verdict-kept, message: "held, the release waits for its docs, judged at night"}
    - {rule: waits-for-docs, where: "#10", message: "judged at night"}
  no-findings: [{rule: verdict-red}]
  forge:
    statuses:
      - {commit: release-please--branches--main, name: workline/verdict, state: pending, by: workline-bot, description: "held: the release waits for its docs, judged at night"}
