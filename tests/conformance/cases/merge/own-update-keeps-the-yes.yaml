case: merge/own-update-keeps-the-yes
about: "A push after the yes that is `follow`'s own update — main merged in, workline's trailer — is no push of the person's or an agent's: the yes still covers the head, auto-merge is turned on (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git checkout -q main"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
    - "git checkout -q feat/sessions && git merge -q --no-ff main -m \"Merge branch 'main' into feat/sessions\" -m 'Workline-Role: documentalist' && git push -q origin feat/sessions && git checkout -q main"
    - "sh \"$FIXTURES/verdict.sh\" feat/sessions pass"
  forge:
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: "feat/sessions^1", at: "2026-01-04T09:00:00Z"}, {head: feat/sessions, at: "2026-01-04T10:30:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: auto-merge-on, where: "#7"}]
  no-findings: [{rule: accepted-reset}]
  not-pushed: [feat/sessions]
  forge:
    merge-requests:
      - {id: 7, auto-merge: true, labels: [workline:accepted], comments: 0}
