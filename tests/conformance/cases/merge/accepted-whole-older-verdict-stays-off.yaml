case: merge/accepted-whole-older-verdict-stays-off
about: "A verdict kept by an earlier workline (#1107): its text names only the first of the rules that made its review short, so `review-not-whole` may hide a lens that failed. Labelled `workline:accepted-whole`, the pull request stays off: the whole yes takes only a verdict that says `review-not-whole` is its one short rule, and the summary says the line's run again on the head tells (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: failure, description: "short: its review falls short (review-not-whole): the change would take 4 parts, past parts-max (2)", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted-whole]
        label-events: [{label: workline:accepted-whole, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: review-short, where: "#7", level: warn, message: "accepted by @dana, but its review falls short (review-not-whole)"}]
  no-findings: [{rule: auto-merge-on}, {rule: review-read-whole}]
  summary-file: ["kept by an earlier workline", "run the line again on its head"]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted-whole]}
