case: merge/normal-revert-demotes-until-restored
about: "A revert demotes (#322): at `normal`, #9, a records pull request workline merged with no person's yes — recorded on it —, was reverted with GitHub's own Revert: a commit saying only `Revert \"<its title>\"`, in a pull request of its own, #11, both merged by merge commits. `workline follow` finds the merge it undoes by its title and its change, and sends records back to a person's yes (ADR-0026): an issue kept open says why and how to restore it, #9 is told, the summary says it, and the next records pull request, #10, waits. A person closes the issue: the next run merges #10 alone, and the same revert is never read twice (ADR-0042, amended)."
given:
  repo: documented
  config: {merge: {autonomy: normal}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "git checkout -qb workline/documentalist/suspect && sed -i '/^checked:/a judged: 1a2b3c4' docs/tech/auth.md && git commit -qam 'docs: record the docs judged' -m 'Workline-Role: documentalist' && git checkout -q main && git merge -q --no-ff workline/documentalist/suspect -m 'Merge pull request #9 from acme/workline/documentalist/suspect' -m 'docs: record the docs judged'"
    - "git checkout -qb revert-9-workline/documentalist/suspect && git revert --no-edit HEAD -m 1 >/dev/null && git commit -q --amend -m 'Revert \"docs: record the docs judged\"' && git checkout -q main && git merge -q --no-ff revert-9-workline/documentalist/suspect -m 'Merge pull request #11 from acme/revert-9-workline/documentalist/suspect' -m 'Revert \"docs: record the docs judged\"' && git push -q origin main"
    - "git checkout -qb workline/documentalist/stale && sed -i '/^checked:/a judged: 5d6e7f8' docs/product/sign-in.md && git commit -qam 'docs: record the docs read again' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/stale && git checkout -q main"
  forge:
    statuses:
      - {commit: "workline/documentalist/stale", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - {id: 9, branch: workline/documentalist/suspect, base: main, author: "workline-app[bot]", bot: true, closed: true, merged: true, labels: [],
         comments: ["**Merging with no person's yes**: the project's merge policy is `normal`, and this is workline's own records.\n\n<!-- workline:merge-alone=records -->"]}
      - {id: 10, branch: workline/documentalist/stale, base: main, author: "workline-app[bot]", bot: true, labels: [], comments: []}
run:
  follow: [--base, main]
  then: again
  between:
    issues:
      - {id: 1, closed: true}
expect:
  status: pass
  findings:
    - {rule: merge-demoted, where: "#9", message: "merged with no person's yes, reverted by"}
    - {rule: waits-for-a-yes, where: "#10", message: "its records merge requests wait for a person's yes since one was reverted (#1)"}
    - {rule: auto-merge-on, where: "#10", message: "with no person's yes, workline's own records"}
  forge:
    issues:
      - {id: 1, closed: true, title: "workline: its records merge requests wait for a person's yes again", body-contains: ["#9 merged with no person's yes, and was reverted", "close this issue"]}
      - {id: 2, absent: true}
    merge-requests:
      - {id: 9, comments: 2, comment-contains: ["**Reverted** by", "until a person closes #1"]}
      - {id: 10, auto-merge: true, comments: 1}
