case: merge/normal-red-or-short-verdict-waits
about: "Never alone on a verdict that did not pass (#322): at `normal`, two of workline's own records pull requests — opened, pushed and committed by its App. The line blocked on one; on the other it passed, but a step that needs an agent's judgement had none (`not-reviewed`). Neither merges with no label: `workline/accepted` set to failure on each head, why said (ADR-0042: an agent really answered where the project sets one)."
given:
  repo: documented
  config: {merge: {autonomy: normal}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/documentalist/suspect && sed -i '/^checked:/a judged: 1a2b3c4' docs/tech/auth.md && GIT_COMMITTER_NAME=workline-bot git commit -qam 'docs: record the docs judged' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/suspect && git checkout -q main"
    - "git checkout -qb workline/documentalist/stale && sed -i '/^checked:/a judged: 5d6e7f8' docs/product/sign-in.md && GIT_COMMITTER_NAME=workline-bot git commit -qam 'docs: record the docs read again' -m 'Workline-Role: documentalist' && git push -q origin workline/documentalist/stale && git checkout -q main"
  forge:
    statuses:
      - {commit: "workline/documentalist/suspect", name: workline/verdict, state: failure, description: "red: the line's verdict on its head is block (documentalist block): suspect", by: workline-bot}
      - {commit: "workline/documentalist/stale", name: workline/verdict, state: failure, description: "short: its review falls short (not-reviewed): no agent judged the docs", by: workline-bot}
    merge-requests:
      - {id: 9, branch: workline/documentalist/suspect, base: main, author: workline-bot, bot: true, labels: [], comments: [],
         pushes: [{head: workline/documentalist/suspect, at: "2026-01-04T09:00:00Z", by: workline-bot}]}
      - {id: 13, branch: workline/documentalist/stale, base: main, author: workline-bot, bot: true, labels: [], comments: [],
         pushes: [{head: workline/documentalist/stale, at: "2026-01-04T09:00:00Z", by: workline-bot}]}
run: {follow: [--base, main]}
expect:
  status: pass
  findings:
    - {rule: verdict-red, where: "#9", message: "workline's own records, but the line's verdict on its head is block"}
    - {rule: review-short, where: "#13", message: "workline's own records, but its review falls short (not-reviewed)"}
  no-findings: [{rule: auto-merge-on}, {rule: merged-at-once}]
  forge:
    merge-requests:
      - {id: 9, auto-merge: false, comments: 0}
      - {id: 13, auto-merge: false, comments: 0}
    statuses:
      - {commit: "workline/documentalist/suspect", name: workline/accepted, state: failure, by: workline-bot}
      - {commit: "workline/documentalist/stale", name: workline/accepted, state: failure, by: workline-bot}
