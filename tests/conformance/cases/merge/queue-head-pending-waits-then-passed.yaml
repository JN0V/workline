case: merge/queue-head-pending-waits-then-passed
about: >
  A pending head waits, then is passed over: the head (#1) has its checks
  pending. The first `follow` run is within 180 s of its update (its yes,
  auto-merge and push dated far ahead of now): no other one is updated.
  Then its dates are moved far into the past and `follow` runs again, past
  the `verdict` budget of 180 s: #1 is said "passed over, checks pending
  past 180 s", and the next one (#2) is updated.
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/developer/1 && echo one > one.txt && git add one.txt && git commit -qm 'feat: one' -m 'Workline-Role: developer' && git push -q origin workline/developer/1 && git checkout -q main"
    - "git checkout -qb workline/developer/2 && echo two > two.txt && git add two.txt && git commit -qm 'feat: two' -m 'Workline-Role: developer' && git push -q origin workline/developer/2 && git checkout -q main"
    - "echo 'More.' > MORE.md && git add MORE.md && git commit -qm 'docs: more' && git push -q origin main"
  forge:
    statuses:
      - {commit: "workline/developer/1", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "workline/developer/2", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 1
        branch: workline/developer/1
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2099-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2099-01-04T10:01:00Z"
        auto-merge-by: workline-bot
        checks: pending
        behind: true
        pushes: [{head: workline/developer/1, at: "2099-01-04T09:00:00Z"}]
        comments: []
      - id: 2
        branch: workline/developer/2
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:02:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/2, at: "2026-01-04T09:00:00Z"}]
        comments: []
run:
  follow: [--base, main]
  summary: true
  then: again
  between:
    merge-requests:
      - id: 1
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge-at: "2026-01-04T10:01:00Z"
        pushes: [{head: workline/developer/1, at: "2026-01-04T09:00:00Z"}]
expect:
  status: pass
  findings: [{rule: merged-from-base, where: "#2"}]
  no-findings: [{rule: merged-from-base, where: "#1"}]
  pushed:
    workline/developer/2: {MORE.md: "More.", two.txt: "two"}
  not-pushed: [workline/developer/1]
  summary-once:
    - "#1: passed over, checks pending past 180 s"
    - "#2: head of the queue, main merged in"
