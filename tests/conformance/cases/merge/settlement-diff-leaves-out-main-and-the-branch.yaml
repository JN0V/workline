case: merge/settlement-diff-leaves-out-main-and-the-branch
about: "The comment that takes the yes off after a developer round settled a conflict shows what the agent wrote, and no line main brought in (a clean change of main's, nor main's side of the conflict), and no line of the branch's own change (its clean change, nor its side of the conflict)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git"
    - "for f in limits.conf quotas.conf; do { echo a=1; seq -f 'f%g' 1 8; echo d=4; seq -f 'h%g' 1 8; echo g=7; } > $f; done && git add . && git commit -qm 'chore: limits and quotas' && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/^a=1$/a=branch-own/;s/^d=4$/d=branch-line/' limits.conf quotas.conf && git commit -qam 'feat: the branch changes limits' && git tag before && git push -q origin feat/sessions && git checkout -q main"
    - "sed -i 's/^d=4$/d=main-line/;s/^g=7$/g=main-new/' limits.conf quotas.conf && git commit -qam 'feat: main moves limits' && git push -q origin main"
    - "git checkout -q feat/sessions && { git merge -q --no-ff --no-commit main || true; } && for f in limits.conf quotas.conf; do { echo a=branch-own; seq -f 'f%g' 1 8; echo d=settled-in-$f; seq -f 'h%g' 1 8; echo g=main-new; } > $f; done && git add . && git commit -q -m 'Merge branch main into feat/sessions' -m 'Workline-Role: developer' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: feat/sessions, name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: before, at: "2026-01-04T09:00:00Z"}, {head: feat/sessions, at: "2026-01-04T10:30:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: accepted-reset, where: "#7"}]
  forge:
    merge-requests:
      - id: 7
        labels: []
        comments: 1
        comment-contains: ["workline took `workline:accepted` off", "d=settled-in-limits.conf"]
        comment-lacks: ["d=main-line", "g=main-new", "d=branch-line", "a=branch-own"]
