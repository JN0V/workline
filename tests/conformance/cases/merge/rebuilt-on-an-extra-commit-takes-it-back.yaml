case: merge/rebuilt-on-an-extra-commit-takes-it-back
about: "A role's branch rebuilt after the yes keeps it only when rebuilt on the base (#321's re-review): this one carries the same change, but on a commit main does not hold — a file of its own slipped under it. No `follow` rebuild: a push after the yes, taken back (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/documentalist/suspect && sed -i 's/one hour/one hour, renewed/' docs/tech/auth.md && git commit -qam 'docs: the auth doc says tokens are renewed' -m 'Workline-Role: documentalist' && git tag before && git push -q origin workline/documentalist/suspect && git checkout -q main"
    - "git checkout -q -B rebuilt main && echo 'package auth' > src/auth/evil.go && git add src && git commit -qm 'chore: slipped under' && GIT_COMMITTER_DATE=2026-01-04T11:00:00Z git cherry-pick before >/dev/null && git push -q -f origin rebuilt:workline/documentalist/suspect && git checkout -q main"
  forge:
    statuses:
      - {commit: rebuilt, name: workline/verdict, state: success, description: "pass: the line passed", by: workline-bot}
    merge-requests:
      - id: 12
        branch: workline/documentalist/suspect
        base: main
        author: "workline-app[bot]"
        bot: true
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: before, at: "2026-01-04T09:00:00Z"}, {head: rebuilt, at: "2026-01-04T11:00:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: accepted-reset, where: "#12", message: "its branch was rewritten"}]
  no-findings: [{rule: auto-merge-on}]
  forge:
    merge-requests:
      - {id: 12, auto-merge: false, labels: []}
