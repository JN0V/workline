case: merge/gitlab-accepted-turned-on
about: "On GitLab (#321): a Developer of the project put `workline::accepted` — the scoped spelling — on a merge request behind main whose head the line passed; `workline follow` sets it to merge when its pipeline succeeds (the merge API's `auto_merge`, at its head), and leaves it behind main as it is: GitLab merges it once its own pipeline succeeds, as on GitHub (ADR-0042, ADR-0051)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "sh \"$FIXTURES/verdict.sh\" feat/sessions pass ../verdict.json"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    members: [{username: dana, access_level: 30}, {username: zed, access_level: 10}]
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: ["workline::accepted"]
        label-events: [{label: "workline::accepted", added: true, author: dana, created: "2026-01-04T10:00:00Z"}]
        pushes: [{head: feat/sessions, at: "2026-01-04T09:00:00Z"}]
        comments: []
run: {follow: [--base, main, --verdict, ../verdict.json], forge: gitlab}
expect:
  status: pass
  findings:
    - {rule: auto-merge-on, where: "!7", message: "accepted by @dana, its head's verdict passed: auto-merge turned on"}
  no-findings: [{rule: updated}]
  not-pushed: [feat/sessions]
  forge:
    merge-requests:
      - {id: 7, auto-merge: true, labels: ["workline::accepted"], comments: 0}
