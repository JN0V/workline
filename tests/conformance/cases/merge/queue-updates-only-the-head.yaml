case: merge/queue-updates-only-the-head
about: >
  Only the head is updated: a repository that requires branches up to
  date holds three accepted pull requests behind, their checks green
  (`workline/developer/1` to `/3`, auto-merge turned on in that order).
  main moves. `workline follow` merges main into the first alone; the run's
  summary says #1 "head of the queue", #2 "queued, position 2", #3 "queued,
  position 3". Nothing is pushed to the two others.
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb workline/developer/1 && echo one > one.txt && git add one.txt && git commit -qm 'feat: one' -m 'Workline-Role: developer' && git push -q origin workline/developer/1 && git checkout -q main"
    - "git checkout -qb workline/developer/2 && echo two > two.txt && git add two.txt && git commit -qm 'feat: two' -m 'Workline-Role: developer' && git push -q origin workline/developer/2 && git checkout -q main"
    - "git checkout -qb workline/developer/3 && echo three > three.txt && git add three.txt && git commit -qm 'feat: three' -m 'Workline-Role: developer' && git push -q origin workline/developer/3 && git checkout -q main"
    - "echo 'More.' > MORE.md && git add MORE.md && git commit -qm 'docs: more' && git push -q origin main"
  forge:
    statuses:
      - {commit: "workline/developer/1", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "workline/developer/2", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
      - {commit: "workline/developer/3", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 1
        branch: workline/developer/1
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:01:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/1, at: "2026-01-04T09:00:00Z"}]
        comments: []
      - id: 2
        branch: workline/developer/2
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:02:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/2, at: "2026-01-04T09:00:00Z"}]
        comments: []
      - id: 3
        branch: workline/developer/3
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: true
        auto-merge-at: "2026-01-04T10:03:00Z"
        auto-merge-by: workline-bot
        checks: success
        behind: true
        pushes: [{head: workline/developer/3, at: "2026-01-04T09:00:00Z"}]
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: merged-from-base, where: "#1"}]
  no-findings: [{rule: merged-from-base, where: "#2"}, {rule: merged-from-base, where: "#3"}]
  pushed:
    workline/developer/1: {MORE.md: "More.", one.txt: "one"}
  not-pushed: [workline/developer/2, workline/developer/3]
  summary-once:
    - "#1: head of the queue, main merged in"
    - "#2: queued, position 2"
    - "#3: queued, position 3"
