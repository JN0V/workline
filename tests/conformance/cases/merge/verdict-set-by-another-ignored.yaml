case: merge/verdict-set-by-another-ignored
about: "A verdict anyone else set is never read (#321's review): a writer — or an agent with their token — set `workline/verdict` to pass on the head of a pull request whose review was short. Only what `follow`'s own token kept counts: its verdict, short, leaves auto-merge off; the other is ignored, never taken for a pass (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
  forge:
    statuses:
      - {commit: feat/sessions, name: workline/verdict, state: failure, description: "short: its review falls short (not-reviewed): no agent", by: workline-bot}
      - {commit: feat/sessions, name: workline/verdict, state: success, description: "pass: trust me", by: dana}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        comments: []
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: review-short, where: "#7", message: "its review falls short (not-reviewed)"}]
  no-findings: [{rule: auto-merge-on}]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false}
    statuses:
      - {commit: feat/sessions, name: workline/accepted, state: failure, by: workline-bot}
