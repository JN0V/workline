case: merge/auto-merge-turned-off-stays-off
about: "My veto (#321), the forge's own: auto-merge was turned on for an accepted pull request after the yes, and a person turned it off since; `workline follow` does not turn it on again, nor bring it up to date, until the label is put again (ADR-0042)."
given:
  repo: documented
  config: {merge: {autonomy: cautious}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feat/sessions && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feat/sessions && git checkout -q main"
    - "echo moved > moved.txt && git add moved.txt && git commit -qm 'feat: main moves' && git push -q origin main"
  forge:
    statuses:
      - {commit: "feat/sessions", name: workline/verdict, state: success, description: "pass: the line passed, every agent's review whole", by: workline-bot}
    merge-requests:
      - id: 7
        branch: feat/sessions
        base: main
        author: dana
        labels: [workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dana, insider: true, writer: true, created: "2026-01-04T10:00:00Z"}]
        auto-merge: false
        auto-merge-at: "2026-01-04T10:01:00Z"
        comments: []
run: {follow: [--base, main], summary: true}
expect:
  status: pass
  findings: [{rule: vetoed, where: "#7", message: "left off until the label is put again"}]
  no-findings: [{rule: auto-merge-on}, {rule: updated}]
  not-pushed: [feat/sessions]
  forge:
    merge-requests:
      - {id: 7, auto-merge: false, labels: [workline:accepted]}
