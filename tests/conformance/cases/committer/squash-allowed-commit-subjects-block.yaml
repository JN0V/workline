case: committer/squash-allowed-commit-subjects-block
about: "On a merge request the forge may squash, but may also merge or rebase, a branch commit's subject can reach the base: one the rules refuse still blocks."
given:
  repo: basic
  setup:
    - "git tag base && echo a >> main.go && git commit -qam 'fix: AC-3' && echo b >> main.go && git commit -qam 'feat: add a greeting'"
  forge:
    squash: {on: true, suffix: " (#{n})"}
    merge-requests: [{id: 5, title: "feat: add a greeting", labels: [], comments: []}]
run: {role: committer, event: merge-request, input: {range: "base..HEAD"}, target: {merge-request: 5}}
expect: {status: block, agent-calls: 0, findings: [{rule: internal-code, where: "commit"}]}
