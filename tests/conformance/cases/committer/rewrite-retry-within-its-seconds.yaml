case: committer/rewrite-retry-within-its-seconds
about: "ai-max-seconds holds every call of the rewrite together: a refused rewrite is asked again of a stronger model with what is left of the time, and ends with it."
given:
  repo: basic
  config: {roles: {committer: {settings: {rewrite: true, ai-max-seconds: 2}}}}
run:
  role: committer
  event: commit-msg
  input: {message: "fix: AC-3"}
  # The light model answers at once, still naming the code; the stronger
  # one takes longer than what is left.
  ai: |-
    cmd:if [ "$WORKLINE_TIER" = light ]; then echo '- commit-message: "fix: AC-3 again"'; exit 0; fi
    sleep 20
    echo '- commit-message: "fix(parser): stop crashing on an empty input file"'
expect:
  status: block
  agent-calls: 2
  applied: []
  calls: [{agent: cmd, tier: light}, {agent: cmd, tier: standard}]
  findings:
    - {rule: internal-code, message: "AC-3"}
    - {rule: ai-max-seconds, level: warn, message: "it allows 2"}
