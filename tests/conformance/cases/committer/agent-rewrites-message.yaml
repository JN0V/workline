case: committer/agent-rewrites-message
about: "By default, with an agent, a rejected message is rewritten (ADR-0050), and the new one passes the same checks."
given: {repo: basic}
run: {role: committer, event: commit-msg, input: {message: "fix: AC-3"}, ai: "fake:good-commit-message"}
expect: {status: pass, agent-calls: 1, applied: [commit-message]}
