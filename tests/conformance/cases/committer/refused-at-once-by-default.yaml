case: committer/refused-at-once-by-default
about: "The agent's rewrite is opt-in (ADR-0050): with an agent at hand, a refused message is still refused at once, with the reasons, and no agent is asked."
given: {repo: basic}
run: {role: committer, event: commit-msg, input: {message: "fix: AC-3"}, ai: "fake:good-commit-message"}
expect:
  status: block
  summary: rewrite the commit message
  agent-calls: 0
  applied: []
  findings: [{rule: internal-code, message: "AC-3"}]
