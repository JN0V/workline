case: committer/secret-in-a-message-of-a-merge-request
about: On a merge request, every commit message is scanned too; the finding names the commit and the line of its message.
given:
  repo: basic
  # the key is split here, so this file holds none
  setup:
    - "git checkout -qb feature && echo change >> README.md && git add README.md && git commit -qm \"$(printf 'docs: say more\\n\\nThe key was AKIA%s.' QYLPMN5HHHFPZAM2)\""
    - "echo more >> README.md && git add README.md && git commit -qm 'docs: say even more' -m 'Two lines of body,' -m 'in two paragraphs.'"
run: {role: committer, event: merge-request, input: {range: "main..feature"}, ai: none}
expect:
  status: block
  findings: [{rule: leak, where: ", message line 3"}]
