case: committer/identity-forge-not-named
about: The forge's own addresses are not allowed unless the project names them; the user's list alone refuses the App's commits and GitHub's web merges.
given:
  repo: basic
  setup:
    - "mkdir -p \"$XDG_CONFIG_HOME/workline\" && printf '^fixture@example\\\\.invalid$\\n' > \"$XDG_CONFIG_HOME/workline/allowed-identities\""
    - "git checkout -qb feature && echo x >> main.go && GIT_AUTHOR_EMAIL='12345+example-app[bot]@users.noreply.github.com' GIT_COMMITTER_EMAIL='12345+example-app[bot]@users.noreply.github.com' git commit -qam 'docs: move checked'"
    - "echo y >> main.go && GIT_COMMITTER_EMAIL=noreply@github.com git commit -qam 'fix: merged on the web'"
run: {role: committer, event: merge-request, input: {range: "main..feature"}, ai: none}
expect:
  status: block
  findings:
    - {rule: identity, where: author, message: "12345+example-app[bot]@users.noreply.github.com"}
    - {rule: identity, where: committer, message: "noreply@github.com"}
