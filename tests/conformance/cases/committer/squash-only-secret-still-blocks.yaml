case: committer/squash-only-secret-still-blocks
about: "On a merge request the forge lands by squash only, a secret in a branch commit's message still blocks: the commit reached the forge, whatever lands on the base."
given:
  repo: basic
  # the key is split here, so this file holds none
  setup:
    - "git tag base && echo change >> README.md && git add README.md && git commit -qm \"$(printf 'docs: say more\\n\\nThe key was AKIA%s.' QYLPMN5HHHFPZAM2)\""
  forge:
    squash: {on: true, only: true, suffix: " (#{n})"}
    merge-requests: [{id: 5, title: "docs: say more", labels: [], comments: []}]
run: {role: committer, event: merge-request, input: {range: "base..HEAD"}, target: {merge-request: 5}, ai: none}
expect:
  status: block
  findings: [{rule: leak, where: ", message line 3"}]
