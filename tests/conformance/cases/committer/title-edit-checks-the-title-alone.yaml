case: committer/title-edit-checks-the-title-alone
about: "An edit to the title checks it alone (`title-only`, ADR-0051): the commits were read on their push, so a refused commit is not said again, and a title over its room blocks."
given:
  repo: basic
  setup: ["git tag base && echo a >> main.go && git commit -qam 'fix: AC-3'"]
  forge:
    squash: {on: true, suffix: " (#{n})"}
    merge-requests: [{id: 5, title: "feat(committer): check the title a squash lands, room left for its tag", labels: [], comments: []}]
run: {role: committer, event: merge-request, input: {range: "base..HEAD", title-only: "true"}, target: {merge-request: 5}}
expect:
  status: block
  agent-calls: 0
  findings: [{rule: subject-length, where: title}]
  no-findings: [{rule: internal-code}]
