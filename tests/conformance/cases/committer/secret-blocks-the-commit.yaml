case: committer/secret-blocks-the-commit
about: A secret in the staged changes blocks the commit, whatever the message; gitleaks finds it, and the log never shows it.
given:
  repo: basic
  # the key is split here, so this file holds none
  setup: ["printf 'aws_key = AKIA%s\\n' QYLPMN5HHHFPZAM2 > config.ini && git add config.ini"]
run: {role: committer, event: commit-msg, input: {message: "feat(config): read the key from the file"}, ai: "fake:good-commit-message"}
expect:
  status: block
  agent-calls: 0
  findings: [{rule: leak, where: "config.ini:1"}]
