case: committer/secrets-not-checked
about: Without gitleaks, the commit goes on, and the verdict says secrets were not checked.
given:
  repo: basic
  setup: ["echo x >> main.go && git add main.go"]
  env: {PATH: "/usr/bin:/bin"}
run: {role: committer, event: commit-msg, input: {message: "feat: add x"}, ai: none}
expect:
  status: pass
  findings: [{rule: secrets-not-checked}]
