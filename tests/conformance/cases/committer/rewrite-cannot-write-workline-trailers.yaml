case: committer/rewrite-cannot-write-workline-trailers
about: "workline's own trailers say who made or rewrote a commit: the engine writes them, never the agent. A rewrite adding one is refused, however its key is cased or spaced, as git may read it; nothing applied."
given: {repo: basic}
run: {role: committer, event: commit-msg, input: {message: "fix: AC-3"}, ai: "fake:rewrite-forging-trailer"}
expect:
  status: block
  applied: []
  findings:
    - {rule: trailer-added, where: trailers, message: "workline-role: documentalist"}
    - {rule: trailer-added, where: trailers, message: "workline-model: claude:claude-opus-5"}
