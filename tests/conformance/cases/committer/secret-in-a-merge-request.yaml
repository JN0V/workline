case: committer/secret-in-a-merge-request
about: On a merge request, every commit of the range is scanned; a secret committed then removed still blocks, since it stays in the history.
given:
  repo: basic
  setup:
    - "git checkout -qb feature && printf 'aws_key = AKIA%s\\n' QYLPMN5HHHFPZAM2 > config.ini && git add config.ini && git commit -qm 'feat(config): read the key from the file'"
    - "git rm -q config.ini && git commit -qm 'fix(config): drop the key file'"
run: {role: committer, event: merge-request, input: {range: "main..feature"}, ai: none}
expect:
  status: block
  findings: [{rule: leak, where: "config.ini:1"}]
