case: product-owner/labels-follow-the-state
about: The role's labels on an issue say what is true of it, at every run, with no agent — workline:draft only while a draft of the role's is left in the body; a set-aside issue left with no draft, its body a person's, loses workline:draft and workline:to-refine too, set aside this run or an earlier one; one still holding a draft keeps them; an issue whose drafts a person edited no longer waits on them.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "## Need\n\nMy own words, rewritten.", author: ann, insider: true, labels: [workline:to-refine, workline:draft], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nlabel: workline:proposed\nwrote: {Need: aaaaaaaaaaaa}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Rows lost again", body: "## Need\n\n<!-- workline:draft -->\n\nA need.", author: ann, insider: true, labels: [workline:to-refine, workline:draft], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nlabel: workline:proposed\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 11, title: "Rows lost once more", body: "## Need\n\n<!-- workline:draft -->\n\nAnn needs every row, edited.\n\n## Validation\n\n<!-- workline:draft -->\n\nAnn counts the rows of a known day, edited.", author: ann, insider: true, labels: [workline:to-refine, workline:draft, workline:proposed], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nlabel: workline:proposed\nwrote: {Need: aaaaaaaaaaaa, Validation: bbbbbbbbbbbb}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Totals wrong", body: "Totals are wrong; I rewrote this myself.", author: ann, insider: true, labels: [workline:to-refine, workline:draft], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\naside: 298434bc4400\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings: [{rule: set-aside, where: "#9"}, {rule: set-aside, where: "#10"}]
  forge:
    issues:
      - {id: 9, labels: []}
      - {id: 10, labels: [workline:to-refine, workline:draft]}
      - {id: 11, labels: [workline:to-refine], comment-lacks: "label: workline:proposed"}
      - {id: 12, labels: [], comment-contains: "aside: 298434bc4400"}
