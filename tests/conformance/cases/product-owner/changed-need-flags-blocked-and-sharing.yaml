case: product-owner/changed-need-flags-blocked-and-sharing
about: "A person rewrites an issue's Scope: an issue waiting on it, and one naming the same code, are listed in the summary under the change, flagged for a person, nothing written to them; one on other code is not — with no agent, the change's sections kept so it flags once (ADR-0032)."
given:
  repo: backlog
  config:
    roles: {product-owner: {settings: {changed-needs: true}}}
  forge:
    issues:
      - {id: 9, title: "Export in JSON", body: "## Need\n\nA JSON export.\n\n## Scope\n\nsrc/export/json.go, a new file beside the CSV writer.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nsections:\n  Need: A JSON export.\n  Scope: WriteRows in src/export/csv.go.\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Stream the JSON export", body: "Write rows as they come.", labels: [workline:ready], blocked-by: [9], comments: ["```yaml\nsources: [README.md]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 14, title: "Slow export", body: "The export is slow.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go#WriteRows]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 15, title: "A better README", body: "Say what the project does.", labels: [], comments: ["```yaml\nsources: [README.md]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings:
    - {rule: need-changed, where: "#9", message: "a person rewrote its Scope: #13 (waits, listed for a person), #14 (sources, listed for a person)"}
  forge:
    issues:
      - {id: 16, absent: true}
      - {id: 13, comments: 1, labels: [workline:ready]}
      - {id: 14, comments: 1}
      - {id: 9, comment-contains: "Scope: src/export/json.go, a new file beside the CSV writer."}
