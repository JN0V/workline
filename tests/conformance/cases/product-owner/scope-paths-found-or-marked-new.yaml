case: product-owner/scope-paths-found-or-marked-new
about: >
  The product owner writes the Scope as paths and globs (ADR-0065,
  change 2; #1228), and its writing check finds each: a path the commit
  holds, a glob matching a file of it, or a path on a line `New:`, to
  create. #9's Scope is written. #12's names src/import/xml.go, which
  the commit lacks and no line marks new; #14's glob src/import/** matches
  nothing: each Scope is left out, said; a Verification given is left
  out, the tester's (ADR-0066).
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "XML export in src/export", body: "## Need\n\nAnn needs the rows of a day as XML, beside src/export/csv.go.\n\n## Validation\n\nAnn exports a known day as XML.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "XML import", body: "## Need\n\nAnn needs to import the XML her bank sends, as src/export/csv.go reads rows.\n\n## Validation\n\nAnn imports last month's file and sees its rows.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 14, title: "CSV import", body: "## Need\n\nAnn needs to import a CSV file, as src/export/csv.go writes it.\n\n## Validation\n\nAnn imports a file and sees its rows.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-scope-new-files}
expect:
  findings:
    - {rule: done, where: "#9", message: "Refined #9: Scope."}
    - {rule: scope-without-files, where: "#12", message: "its Scope named src/import/xml.go, which the repository does not hold, so it was left out: name a path it holds, a glob matching one, or a new file on a line `New:`"}
    - {rule: scope-without-files, where: "#14", message: "its Scope named src/import/**, which the repository does not hold, so it was left out: name a path it holds, a glob matching one, or a new file on a line `New:`"}
  forge:
    issues:
      - {id: 9, body-contains: "- New: `src/export/xml.go`, the XML writer.", comment-contains: "sources: [src/export/csv.go"}
      - {id: 12, body-lacks: ["## Scope", "## Verification"]}
      - {id: 14, body-lacks: "## Scope"}
