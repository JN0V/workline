case: product-owner/kind-light-read-answers-kind-only
about: >
  A light read answers with a kind, or a note, only (#878): the agent
  read the issue by its title and the start of its body, never its code.
  A closing it proposes all the same is dropped, said; its kind stands.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost on export", body: "The export loses the last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:kind-light-and-close}
expect:
  status: pass
  calls: [{agent: fake, task: kind}]
  findings:
    - {rule: intention-refused, level: warn, message: "close dropped: a kind task answers with kind, note only"}
    - {rule: done, where: "#9", message: "Labelled #9 `bug`, a bug"}
  forge:
    issues:
      - {id: 9, closed: false, labels: [bug]}
