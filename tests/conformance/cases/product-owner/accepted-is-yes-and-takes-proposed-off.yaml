case: product-owner/accepted-is-yes-and-takes-proposed-off
about: workline:accepted on an issue waiting on a person is their yes, on every plan (ADR-0038, amended) — with no agent, the act its state proposes is done as recorded, its drafts made the person's, the issue moved to ready, and the role takes workline:proposed off itself, scoped labels or not; the comment no longer asks anything.
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 9
        title: "Rows lost"
        body: "Some rows are lost.\n\n## Need\n\n*Draft by the product owner: edit it, then delete this line to make it yours.* <!-- workline:draft -->\n\nThe monthly report counts every sale.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\n*Draft by the product owner: edit it, then delete this line to make it yours.* <!-- workline:draft -->\n\nAnn opens a known day.\n\n## Scope\n\nsrc/export/csv.go"
        author: ann
        insider: true
        labels: [workline:to-refine, workline:draft, workline:proposed, workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: bob, insider: true, created: "2026-10-08T07:00:00Z"}]
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nlabel: workline:proposed\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 12
        title: "Last row missing in CSV"
        body: "In my CSV export the last row is missing."
        labels: [workline:proposed, workline:accepted]
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\nlabel: workline:proposed\nproposed:\n  - act: close-duplicate\n    line: 'Close #12 as a duplicate of #7'\n    since: \"2026-10-01\"\n    proposal:\n      do: close\n      issue: 12\n      reason: duplicate\n      duplicate-of: 7\n      quote: {issue: 7, text: \"the export drops the last row\"}\n      why: Same bug.\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings:
    - {rule: done-as-accepted, where: "#12", message: "Accepted by a person of the project."}
    - {rule: done-as-accepted, where: "#9", message: "Moved #9 to ready: its drafts accepted (workline:accepted) Accepted by @bob."}
  forge:
    issues:
      - {id: 9, labels: [workline:ready], body-contains: "## Need\n\nThe monthly report counts every sale.", body-lacks: "workline:draft"}
      - {id: 9, comment-lacks: "Your answer"}
      - {id: 12, closed: true, reason: duplicate, comment-contains: "Duplicate of #7", labels: [workline:accepted]}
