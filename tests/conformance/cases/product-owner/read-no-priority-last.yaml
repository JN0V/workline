case: product-owner/read-no-priority-last
about: 'Given an issue with no priority and one of priority 4, a later backlog run reads the priority-4 issue first, though the other is newer.'
given:
  repo: backlog
  forge:
    issues:
      - id: 30
        title: "Export in CSV"
        body: "Add a CSV export."
        labels: ["workline:priority/1"]
        comments:
          - body: '<!-- workline:product-owner-state {"judged":[30]} -->'
      - {id: 31, title: "Export in XML", body: "Add an XML export.", labels: ["workline:priority/4"], comments: []}
      - {id: 32, title: "Export in YAML", body: "Add a YAML export.", labels: [], comments: []}
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  run-files:
    in/issues-read: {contains: "31\n32"}
