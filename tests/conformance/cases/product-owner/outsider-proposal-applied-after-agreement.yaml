case: product-owner/outsider-proposal-applied-after-agreement
about: A person of the project agrees to the text proposed to an outsider with the label workline:accepted; with no agent, the engine writes the proposed sections in the body and moves the issue to ready.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: zed, insider: false, labels: [workline:to-refine, workline:accepted], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->", "@zed, the product owner read this issue.\n\n<details><summary>As the engine reads it</summary>\n\n```yaml\nneed: Every row exported.\nverification: A test writes three rows.\nvalidation: Zed opens a known day.\nscope: WriteRows in src/export/csv.go.\nsources: [src/export/csv.go]\n```\n</details>\n\n<!-- workline:product-owner/proposal=1 -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 9, labels: [workline:ready], body-contains: "Some rows are lost.\n\n## Need\n\nEvery row exported.", body-lacks: "workline:draft"}
      - {id: 9, body-contains: "## Scope\n\nWriteRows in src/export/csv.go."}
