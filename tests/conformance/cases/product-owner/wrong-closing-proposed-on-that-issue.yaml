case: product-owner/wrong-closing-proposed-on-that-issue
about: An issue the role closed, open again, was a wrong closing (its state keeps the kind it was closed with); that kind of act is proposed on that issue from then on, another issue's closing still done alone — the kind is proposed everywhere only once undone undone-max times (ADR-0038, amended).
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 9, title: "Rows lost on Windows", body: "Reopened: not the same bug.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\nclosed: close-duplicate\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row missing in CSV", body: "In my CSV export the last row is missing.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:close-duplicate}
expect:
  findings: [{rule: wrong-closing, where: "#9"}]
  no-findings: [{rule: demoted, where: ""}]
  forge:
    issues:
      - {id: 12, closed: true}
      - {id: 9, comment-contains: ["undone:", "act: close-duplicate", "#9 reopened"], comment-lacks: "closed: close-duplicate"}
