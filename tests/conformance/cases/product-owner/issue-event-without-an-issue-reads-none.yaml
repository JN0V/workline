case: product-owner/issue-event-without-an-issue-reads-none
about: >
  On `issue`, the product owner reads the issue its state named, alone
  (ADR-0059). Run on that event with no issue named — a dispatch by hand
  with none — it reads none and asks no agent: never the night's share.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.\n\n## Need\n\nThe monthly report counts every sale.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n\n## Scope\n\nsrc/export/csv.go", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: issue, ai: fake:ready-nine}
expect:
  status: pass
  agent-calls: 0
  forge:
    issues:
      - {id: 9, labels: [workline:to-refine]}
