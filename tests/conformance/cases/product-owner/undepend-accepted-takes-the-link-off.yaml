case: product-owner/undepend-accepted-takes-the-link-off
about: A proposal to take off a link the role set, its blocker still open, accepted by a person of the project — workline:accepted on the issue —, is done at the next run with no agent; its state no longer keeps that link, so it is not read as a person undoing the role's act (ADR-0028, ADR-0038).
given:
  repo: backlog
  forge:
    dependencies: true
    issues:
      - {id: 12, title: "Quote commas in exported cells", body: "A comma splits a cell.", author: ann, insider: true, labels: [workline:proposed, workline:accepted], blocked-by: [13], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nlabel: workline:proposed\ndone:\n  - {act: depend, set: \"13\", level: normal}\nproposed:\n  - act: undepend\n    line: 'Take off the link the role set from #12 to #13: its need changed.'\n    proposal: {do: undepend, issue: 12, blocked-by: [13], why: 'its need changed.'}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Keep the last row in the CSV export", body: "The export drops its last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  no-findings: [{rule: undone}]
  findings: [{rule: done-as-accepted, where: "#12", message: "Took off the link the role set from #12 to #13: its need changed. Accepted by a person of the project."}]
  forge:
    issues:
      - {id: 12, blocked-by: [], labels: [workline:accepted], comment-lacks: "act: depend"}
