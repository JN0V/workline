case: product-owner/obsolete-label-removed-cancels
about: The label workline:obsolete taken off an announced issue keeps it open, recorded in its state, with no agent nor judge (ADR-0024).
given:
  repo: backlog
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 7
        title: "Export drops the last row"
        body: "Every CSV file: the export drops the last row."
        author: zed
        labels: []
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "@zed, this issue looks obsolete.\n\n<details><summary>As the engine reads it</summary>\n\n```yaml\nquote: {path: src/export/csv.go, text: \"for i := 0; i < len(rows); i++ {\"}\nwhy: WriteRows now loops to the last row.\ncommit: d8c4dff\nannounced: \"2026-01-01\"\n```\n</details>\n\n<!-- workline:product-owner/obsolete -->"
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 7, closed: false, labels: [], comments: 2, comment-contains: "kept: ['src/export/csv.go:b2a6ba892dee']"}
      - {id: 8, title: "Backlog — product owner", body-contains: "Kept #7 open, announced obsolete on 2026-01-01: the label workline:obsolete was taken off."}
