case: product-owner/no-state-no-act
about: An issue the engine has no state of yet is not closed; it gets its state, and is judged from the next run.
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row missing in CSV", body: "In my CSV export the last row is missing.", labels: [], comments: []}
run: {role: product-owner, event: schedule, ai: fake:close-duplicate}
expect:
  findings: [{rule: no-state, where: "#12"}]
  forge:
    issues:
      - {id: 12, closed: false, comments: 1, comment-contains: "<!-- workline:sticky=product-owner/state -->", comment-lacks: "Duplicate of"}
