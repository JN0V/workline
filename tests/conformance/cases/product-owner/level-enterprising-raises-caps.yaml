  run-files:
    in/task.md: {contains: "- close-duplicate: act, 5 a run (level)\n- close-obsolete: off (level)\n- milestone: off (level)\n- order: off (level)\n- refine: act, 10 a run (level)\n- ready: act, 10 a run (level)\n- ask: act, 5 a run (level)"}
  forge:
    issues:
