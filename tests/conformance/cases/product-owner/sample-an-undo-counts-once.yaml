case: product-owner/sample-an-undo-counts-once
about: A person's undo counts against one act only, the newest of its issue and kind done by the day it was found; the same issue renamed again since stands, and the undo is counted once.
given:
  repo: vouched
  config:
    roles: {product-owner: {settings: {weekly-sample: true}}}
  forge:
    issues:
      - {"id": 21, "title": "Issue 21", "body": "Issue 21.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: rename, level: normal, day: '2026-01-06', line: 'Renamed #21 first'}\n- {act: rename, level: normal, day: '2026-01-15', line: 'Renamed #21 again'}\nundone:\n- {act: rename, evidence: '#21 renamed back by a person', day: '2026-01-08'}\n```\n\n<!-- workline:sticky=product-owner/state -->"], "closed": true}
run: {sample: [--week, 2026-W03, --judge, none], then: apply}
expect:
  status: pass
  forge:
    issues:
      - {id: 23, comment-contains: "| #21 | rename | 2026-01-15 | normal | standing |"}
      - {id: 23, comment-contains: "2 acts done alone at normal in the acts the issues keep, 1 undone"}
