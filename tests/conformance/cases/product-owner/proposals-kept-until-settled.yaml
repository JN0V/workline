case: product-owner/proposals-kept-until-settled
about: A proposal stays on its issue from run to run until a person settles it — its issue closed, here #8 — and the run's own proposals are added on theirs; the old report's proposals move to their issues once.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings:
          acts: {close-obsolete: {mode: propose, max: 3}}
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "The export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 8, closed: true, title: "Rows lost", body: "Some rows are lost.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 9, title: "Last row missing", body: "The last row is missing.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "An older report."
        labels: []
        comments: ["```yaml\nproposed:\n  - {issue: 7, act: close-obsolete, line: 'Close #7 as obsolete: the loop', proposal: {do: close, issue: 7, reason: obsolete, quote: {path: src/export/csv.go, text: the loop}, why: The loop reaches the last row.}}\n  - {issue: 8, act: close-obsolete, line: 'Close #8 as obsolete: the loop'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: fake:close-obsolete-nine}
expect:
  forge:
    issues:
      - {id: 9, closed: false}
      - {id: 7, labels: [workline:proposed], comment-contains: "**Proposes**: Close it as obsolete: src/export/csv.go says `the loop` — The loop reaches the last row."}
      - {id: 9, labels: [workline:proposed], comment-contains: "**Proposes**: Announce it obsolete, on the issue: closed at a later run if nobody writes on it and a second judge agrees. src/export/csv.go says"}
      - {id: 8, comment-lacks: "close-obsolete"}
      - {id: 10, closed: true}
