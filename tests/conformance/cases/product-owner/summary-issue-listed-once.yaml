case: product-owner/summary-issue-listed-once
about: "An issue is said once, in its first list: one next to build is not said stuck, ready though it has been for months; one whose reporter was not answered and whose proposal waits is said for the first, its reporter (ADR-0031, in the summary since ADR-0038)."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {next-max: 1}
  forge:
    issues:
      - {id: 20, title: "Export in JSON", body: "Add a JSON export.", labels: [workline:ready, workline:priority/1], labeled: {"workline:ready": "2026-01-01T09:00:00Z"}, comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 21
        title: "Rows lost"
        body: "Some rows are lost."
        author: ann
        insider: true
        labels: []
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: which rows are lost?\n\n<!-- workline:product-owner/ask -->", created: "2026-01-02T10:00:00Z"}
      - id: 22
        title: "Backlog — product owner"
        body: "An older report."
        labels: []
        comments: ["```yaml\nproposed:\n  - {issue: 21, act: rename, line: 'Rename #21 to Keep every row', since: '2026-01-01'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings:
    - {rule: next-ready, where: "#20", message: "Export in JSON — no milestone, priority 1"}
    - {rule: stuck, where: "#21", message: "its reporter written to on 2026-01-02 ("}
  no-findings:
    - {rule: stuck, where: "#20"}
    - {rule: stuck, where: "#21", message: "proposed"}
