case: product-owner/picker-a-function-before-its-callees
about: >
  The code picker's contract, the product owner's side (#1152, the
  re-check of its fix): an issue with no component in its title names
  `DoWork()`, defined once, in w/worker.go. DoWork calls three helpers
  of 60 lines each. Under a budget of 130 lines, DoWork is given whole,
  its fault line in it, before the helpers it calls: a callee comes
  after its caller, never in its place.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {code-lines-max: 130}
  setup:
    - |
      mkdir -p w
      {
        printf 'package w\n\n'
        for h in helperOne helperTwo helperThree; do
          printf 'func %s() int {\n\tn := 0\n' "$h"
          for i in $(seq 1 56); do printf '\tn += %d\n' "$i"; done
          printf '\treturn n\n}\n\n'
        done
        printf '// DoWork does the work.\nfunc DoWork() int {\n\ttotal := helperOne() + helperTwo() + helperThree()\n'
        for i in $(seq 1 25); do printf '\ttotal -= %d\n' "$i"; done
        printf '\treturn total * 0 // the fault: the total is thrown away\n}\n'
      } > w/worker.go
      git add w && git commit -qm 'feat: the worker'
  forge:
    issues:
      - {id: 9, title: "The worker returns nothing", body: "Calling `DoWork()` returns 0 whatever the helpers add up to.", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: issue, target: {issue: 9}, ai: fake:proposes-nothing}
expect:
  status: pass
  agent-calls: 1
  run-files:
    in/task.md:
      contains: ["return total * 0 // the fault: the total is thrown away", "func DoWork() int {"]
