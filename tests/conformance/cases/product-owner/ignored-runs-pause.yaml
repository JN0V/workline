case: product-owner/ignored-runs-pause
about: The third run in a row that reads issues with an agent while its report proposes something, and since which no person ticked, wrote on the report or undid a closing, pauses the role; the report says so, with a box to resume.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 7, title: "Export drops the last row", body: "The export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "## Proposed\n\n- [ ] Close #7 as obsolete: the loop <!-- workline:proposal=7/close-obsolete -->\n"
        labels: []
        comments: ["```yaml\nproposed:\n  - {issue: 7, act: close-obsolete, line: 'Close #7 as obsolete: the loop'}\nignored: 2\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  agent-calls: 1
  findings: [{rule: paused, where: "#10"}]
  forge:
    issues:
      - {id: 10, body-contains: "**Paused**: 3 runs in a row", comment-contains: "ignored: 3"}
      - {id: 10, body-contains: "- [ ] Resume <!-- workline:proposal=resume -->"}
