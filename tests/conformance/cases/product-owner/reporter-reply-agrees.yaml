case: product-owner/reporter-reply-agrees
about: The reporter of an outsider's issue replies `agreed` to the text last proposed to them — the engine writes the sections in the body, with no agent; moving it to ready stays the project's, by the label workline:accepted (ADR-0021).
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: zed, insider: false, labels: [workline:to-refine], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->", "@zed, the product owner read this issue.\n\n<details><summary>As the engine reads it</summary>\n\n```yaml\nneed: Every row exported.\nverification: A test writes three rows.\nvalidation: Zed opens a known day.\nscope: WriteRows in src/export/csv.go.\nsources: [src/export/csv.go]\n```\n</details>\n\n<!-- workline:product-owner/proposal=1 -->", {author: zed, body: "Agreed!\n\nThanks."}]}
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 9, body-contains: "Some rows are lost.\n\n## Need\n\n", labels: [workline:to-refine, workline:draft]}
      - {id: 9, body-contains: "## Scope\n\nWriteRows in src/export/csv.go."}
      - {id: 10, title: "Backlog — product owner", body-contains: "agreed to by @zed (its reporter) in a reply"}
