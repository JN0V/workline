case: product-owner/level-cautious-refines-scope-and-verification
about: At autonomy cautious, a refine writes what the code shows — Scope and Verification — and proposes the Need and Validation drafts on the issue, in its comment, never written in the body until a person accepts them.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {autonomy: cautious}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "XML import", body: "Import XML.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-nine}
expect:
  findings: [{rule: drafts-proposed, where: "#9"}, {rule: done, where: "#9", message: "Refined #9: Verification, Scope."}]
  forge:
    issues:
      - {id: 9, body-contains: "Some rows are lost.\n\n## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope\n\nWriteRows in src/export/csv.go.", labels: [workline:to-refine, workline:proposed], comment-contains: "sources: [src/export/csv.go]"}
      - {id: 9, body-lacks: "## Need", comment-contains: ["**Proposes**: Add Need and Validation to it (Need and Validation as drafts for you to correct). Why: The issue says what is wrong, not how it will be proved.", "<summary>The sections it proposes</summary>", "**Need**\n\nEvery row exported, so a report counts what was sold."]}
