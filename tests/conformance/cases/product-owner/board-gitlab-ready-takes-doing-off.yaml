case: product-owner/board-gitlab-ready-takes-doing-off
about: >
  On a GitLab Free board, a column is a plain label (ADR-0057): set
  ready again, an issue a developer had held, its card leaves Doing in
  the same call that puts it in To do — never in two columns.
given:
  repo: backlog
  forge:
    boards:
      - {forge: gitlab, number: 7, name: Development, owner: project, columns: ["To do", "Doing"], closed-list: true}
    issues:
      - {id: 41, title: "Last sale missing", author: ann, insider: true, labels: ["Doing"], body: "Exports drop the last sale of the day: 3 sales, 2 rows.\n\n## Validation\n\nAnn exports a day of 3 sales and counts 3 rows.\n\n---\n\n## Verification\n\nA test writes 3 rows and reads 3 back.\n\n## Scope\n\n`WriteRows` in `src/export/csv.go`.", comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:ready-text-on-top}
expect:
  forge:
    issues:
      - {id: 41, labels: [workline:ready, "To do"]}
