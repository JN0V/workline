case: product-owner/sample-says-a-closing-reopened
about: An act drawn that a person undid since — a closing whose issue is open again — is said undone in the weekly sample of every role's acts, with what shows it; with fewer than ten acts done alone at the level, no level is suggested, and the sample says why.
given:
  repo: vouched
  forge:
    issues:
      - {"id": 20, "title": "Rows lost on Windows", "body": "Not the same bug.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: close-duplicate, level: normal, day: '2026-01-14', line: 'Closed #20 as a duplicate of #7'}\nclosed: close-duplicate\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {sample: [--week, 2026-W03, --judge, none], then: apply}
expect:
  status: pass
  findings:
    - {rule: sample-acts, message: "1 act, `close-duplicate`, by the product owner"}
  no-findings:
    - {rule: acts-suggest}
  forge:
    issues:
      - {id: 21, title: "workline: the weekly sample of every role's acts", comment-contains: "| Closed #20 as a duplicate of #7 — **undone**: #20 reopened |"}
      - {id: 21, comment-contains: "Too few acts done alone at normal to suggest a level: 1, at least 10."}
