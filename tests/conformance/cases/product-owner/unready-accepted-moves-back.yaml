case: product-owner/unready-accepted-moves-back
about: "A move back to refine proposed before it was done alone, and accepted since by a person of the project — workline:accepted —: the next run takes workline:ready off, puts workline:to-refine on and says why in the role's one comment, with no agent (ADR-0032, ADR-0038, ADR-0059 amended)."
given:
  repo: backlog
  forge:
    issues:
      - id: 11
        title: "Keep the last row in the CSV export"
        body: "Part of #9."
        labels: [workline:ready, workline:proposed, workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: dev, insider: true, created: "2026-10-08T07:00:00Z"}]
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nlabel: workline:proposed\nproposed:\n  - act: unready\n    line: 'Move #11 back to refine (workline:ready off, workline:to-refine on): #9 now asks for JSON.'\n    proposal: {do: unready, issue: 11, why: '#9 now asks for JSON.'}\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings: [{rule: done-as-accepted, where: "#11", message: "Moved #11 back to refine"}]
  forge:
    issues:
      - {id: 11, labels: [workline:accepted, workline:to-refine], comments: 1, comment-contains: "Moved #11 back to refine (workline:ready off, workline:to-refine on; put workline:ready back to undo): #9 now asks for JSON. Accepted by @dev."}
