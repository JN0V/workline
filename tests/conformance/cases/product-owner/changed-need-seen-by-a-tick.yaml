case: product-owner/changed-need-seen-by-a-tick
about: "A change the report lists stays there from run to run until a person of the project ticks it checked: then it leaves the report, said under the boxes ticked, nothing done to its issues (ADR-0032)."
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Export in JSON", body: "## Need\n\nA JSON export.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nsections:\n  Need: A JSON export.\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Stream the JSON export", body: "Write rows as they come.", labels: [workline:ready], blocked-by: [9], comments: ["```yaml\nsources: [README.md]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 14, title: "Slow export", body: "The export is slow.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 20
        title: "Backlog — product owner"
        body: "## Changed needs\n\n- [x] #9 Export in JSON: a person changed its Need (2026-10-01). <!-- workline:proposal=changed/9 -->\n  - #13 Stream the JSON export, waits on it: not read: check it against the change.\n- [ ] #14 Slow export: a person changed its Scope (2026-10-01). <!-- workline:proposal=changed/14 -->\n"
        labels: []
        ticks: [{item: "#9 Export in JSON: a person changed its Need (2026-10-01). <!-- workline:proposal=changed/9 -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\nchanges:\n  - {issue: 9, what: [Need], since: '2026-10-01', touched: [{issue: 13, how: waits}]}\n  - {issue: 14, what: [Scope], since: '2026-10-01', touched: [{issue: 9, how: sources, files: src/export/csv.go}]}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 20, body-contains: "- The change to #9 checked by @dev: it leaves the report.", body-lacks: "proposal=changed/9"}
      - {id: 20, body-contains: "- [ ] #14 Slow export: a person changed its Scope (2026-10-01). <!-- workline:proposal=changed/14 -->"}
      - {id: 13, labels: [workline:ready], comments: 1}
