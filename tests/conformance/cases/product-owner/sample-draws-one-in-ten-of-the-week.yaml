case: product-owner/sample-draws-one-in-ten-of-the-week
about: "The weekly sample, turned on (weekly-sample, off by default since ADR-0038) and written with --apply, draws one in ten of the acts the product owner did alone that week — not another week's — from each issue's state, and writes them on a tracking issue of their own, one comment for the week, each act with its kind, issue, day, level and whether it stands; with enough acts done alone at normal and none undone, it suggests enterprising, never changing the setting."
given:
  repo: vouched
  config:
    roles: {product-owner: {settings: {weekly-sample: true}}}
  forge:
    issues:
      - {"id": 20, "title": "Issue 20", "body": "Issue 20.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: rename, level: normal, day: '2026-01-12', line: 'Did rename on #20'}\n```\n\n<!-- workline:sticky=product-owner/state -->"], "closed": true}
