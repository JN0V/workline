      - {"id": 28, "title": "Issue 28", "body": "Issue 28.", "labels": [], "comments": ["```yaml\nsources: [src/a.go]\nconfirmed: d8c4dff\ndid:\n- {act: close-duplicate, level: normal, day: '2026-01-13', line: 'Did close-duplicate on #28'}\n```\n\n<!-- workline:sticky=product-owner/state -->"], "closed": true}
