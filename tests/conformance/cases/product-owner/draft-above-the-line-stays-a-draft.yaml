case: product-owner/draft-above-the-line-stays-a-draft
about: "The thematic break between the person's part of an issue and the builder's is no section's text and no footer: a draft of the role's just above it is still the draft it wrote, its digest unchanged, so the issue keeps workline:draft; the sections below it are read."
given:
  repo: backlog
  forge:
    issues:
      - {id: 12, title: "Rows lost", body: "## Need\n\nAnn needs every row.\n\n## Validation\n\n<!-- workline:draft -->\n\nAnn counts the rows of a known day.\n\n---\n\n## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope\n\nWriteRows in src/export/csv.go.", author: ann, insider: true, labels: [workline:to-refine, workline:draft], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nlabel: workline:proposed\nwrote: {Validation: 6497b83030bf}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 12, labels: [workline:to-refine, workline:draft]}
