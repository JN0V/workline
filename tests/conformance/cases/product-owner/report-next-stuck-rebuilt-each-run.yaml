case: product-owner/report-next-stuck-rebuilt-each-run
about: "Next and Stuck are rebuilt at every run from the forge as it is, nothing of them stored: a run with nothing else to write rewrites a report whose Next is out of date, and its record holds neither list (ADR-0031)."
given:
  repo: backlog
  forge:
    issues:
      - {id: 13, title: "Keep the last row in the CSV export", body: "The export drops its last row.", labels: [workline:ready, workline:priority/3], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "## Next\n\n1. #9 An issue closed since — no milestone, priority 1\n"
        labels: []
        comments: ["```yaml\nmeasure: {level: normal}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 10, body-contains: "(at most 5, the setting `next-max`).\n\n1. #13 Keep the last row in the CSV export — no milestone, priority 3\n", comment-lacks: "#13"}
      - {id: 10, body-lacks: "#9 An issue closed since", comment-lacks: "stuck"}
      - {id: 10, body-contains: "Nothing has waited on a person for more than 14 days (the setting `stuck-days`)."}
