case: product-owner/question-cautious-waits-for-the-answer
about: >
  Cautious (ADR-0060): a question unanswered for over a week still waits
  for its answer. The agent is told so, an assumption it writes is
  dropped, said, and the issue stays in refine.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings:
          autonomy: cautious
  forge:
    issues:
      - id: 9
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: Should `--verbose=false` print the plain line, as `--short` does?\n\n<!-- workline:product-owner/ask -->", created: "2026-10-01T23:50:00Z"}
run: {role: product-owner, event: issue, target: {issue: 9}, ai: fake:assume-only-plain-line}
expect:
  status: pass
  findings: [{rule: assume-waits, where: "#9", message: "the role waits for the answer (autonomy cautious, or acts.ask.wait never)"}]
  run-files:
    in/task.md: {contains: "A question you ask waits for its answer (acts.ask.wait never): write no `assume`.", not-contains: "Unanswered:"}
  forge:
    issues:
      - id: 9
        labels: [workline:to-refine]
        body-lacks: "## Assumptions"
