case: product-owner/report-suggests-from-the-acts-done-alone
about: The product owner's own report suggests a level from the acts it did alone, as the weekly sample does — more than one in ten undone at enterprising suggests normal — with no agent; the setting is not changed (ADR-0033).
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {autonomy: enterprising}
  forge:
    issues:
      - id: 5
        title: "Backlog — product owner"
        body: "What the product owner did."
        labels: []
        comments: ["```yaml\nundone:\n  - {issue: 21, act: rename, evidence: '#21 renamed back by a person', day: \"2026-01-14\"}\n  - {issue: 24, act: rename, evidence: '#24 renamed back by a person', day: \"2026-01-17\"}\nmeasure: {level: enterprising}\ndid:\n  - {issue: 20, act: rename, level: enterprising, day: \"2026-01-12\", line: 'Renamed #20'}\n  - {issue: 21, act: rename, level: enterprising, day: \"2026-01-13\", line: 'Renamed #21'}\n  - {issue: 22, act: rename, level: enterprising, day: \"2026-01-14\", line: 'Renamed #22'}\n  - {issue: 23, act: rename, level: enterprising, day: \"2026-01-15\", line: 'Renamed #23'}\n  - {issue: 24, act: rename, level: enterprising, day: \"2026-01-16\", line: 'Renamed #24'}\n  - {issue: 25, act: rename, level: enterprising, day: \"2026-01-17\", line: 'Renamed #25'}\n  - {issue: 26, act: rename, level: enterprising, day: \"2026-01-18\", line: 'Renamed #26'}\n  - {issue: 27, act: rename, level: enterprising, day: \"2026-01-12\", line: 'Renamed #27'}\n  - {issue: 28, act: rename, level: enterprising, day: \"2026-01-13\", line: 'Renamed #28'}\n  - {issue: 29, act: rename, level: enterprising, day: \"2026-01-14\", line: 'Renamed #29'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
      - {id: 7, title: "Slow export", body: "The export is slow.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 5, body-contains: "**Suggested** from the acts done alone: `autonomy: normal` — 2 of the 10 acts done alone at enterprising were undone (more than 10%). Set it in the project's settings if you agree; the role never changes it."}
  files:
    .workline/config.yaml: {contains: "autonomy: enterprising"}
