case: product-owner/kind-full-read-corrects-its-own-guess
about: >
  A full read may correct the role's own guess, never a person's
  (ADR-0039 (c), amended): the role labelled #9 `task` from a light
  read, its state says so, and the label is still its own; read in full,
  the agent proposes `bug`: `task` comes off, `bug` goes on, the state
  says `bug`. #10's `chore` is a person's: kept.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost on export", body: "The export loses the last row.", author: ann, insider: true, labels: [task], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\nkind: task\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Slow export", body: "The export is slow.", author: ann, insider: true, labels: [chore], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:kind-set-back}
expect:
  findings:
    - {rule: done, where: "#9", message: "Labelled #9 `bug`, a bug"}
    - {rule: kind-kept, where: "#10", message: "its label `chore` says its kind already, a person's: never swapped"}
  forge:
    issues:
      - {id: 9, labels: [bug], comment-contains: "kind: bug"}
      - {id: 10, labels: [chore]}
