case: product-owner/refine-rewrites-a-verification-it-asked-a-person-for
about: "An issue left waiting on a person by the rule before ADR-0060: the product owner answered the reviewer's finding in a Verification a person wrote by asking them, and nobody answered. Its state holds the review answered, but not the sections it was given to rewrite then (`revised`): the next run reads it again, once, without the person, and rewrites the Verification; the question asked stays, nothing asked again."
given:
  repo: backlog
  config:
    routing:
      events: {schedule: [product-owner, reviewer]}
  forge:
    issues:
      - id: 9
        title: Rows lost
        body: "## Need\n\nThe monthly report counts every sale.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n\n---\n\n## Verification\n\nSessions feel right to the users.\n\n## Scope\n\nsrc/export/csv.go"
        author: ann
        insider: true
        labels: [workline:to-refine]
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nbody: efbae4cec0e6\nanswered: efbae4cec0e6\nheard: 0\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline reviewer**, its spec.\n\n<!-- workline:spec-review body=efbae4cec0e6 round=1 open=1 in=Verification -->\n\n<!-- workline:sticky=reviewer/spec -->"
          - "@ann, to refine this issue: The reviewer found a problem in the Verification, which is yours to change. Could you name a test?\n\n<!-- workline:product-owner/ask -->"
run: {role: product-owner, event: schedule, ai: fake:refine-persons-verification}
expect:
  forge:
    issues:
      - id: 9
        body-contains: "## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope"
        body-lacks: "Sessions feel right"
        comment-contains: ["Changed: Verification.", "revised: [Verification]"]
  run-files:
    in/issues-read: {contains: "9"}
    in/task.md: {contains: ["yours to rewrite: Verification"]}
