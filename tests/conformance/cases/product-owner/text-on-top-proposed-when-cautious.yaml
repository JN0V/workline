case: product-owner/text-on-top-proposed-when-cautious
about: "A role's text on top taken into the Need draft follows the refine's mode and autonomy as the drafts do (ADR-0039, amended): at autonomy cautious, Scope and Verification are written and the Need draft is proposed on the issue, in its comment, the body's text on top left as it is; once a person accepts it, the engine writes the Need and takes that text from the top, its own lines kept."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {autonomy: cautious}
  forge:
    issues:
      - {id: 8, title: "WriteRows stops one row short", author: "github-actions[bot]", labels: [needs-triage], body: "The loop ends one row early: `for i := 0; i < len(rows)-1; i++` skips the last index.\n\nFound by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#00000000 -->", comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\nwrote:\n    Description: cce12975b3bc\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 9
        title: "WriteRows stops one row short, again"
        author: "github-actions[bot]"
        labels: [needs-triage, workline:to-refine, workline:proposed, workline:accepted]
        label-events: [{label: workline:accepted, added: true, author: bob, insider: true, created: "2026-10-17T07:00:00Z"}]
        body: "The loop ends one row early: `for i := 0; i < len(rows)-1; i++` skips the last index.\n\nFound by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#11111111 -->"
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nwrote:\n    Description: cce12975b3bc\nlabel: workline:proposed\nproposed:\n  - act: refine\n    line: 'Refine #9: Need (draft, from the text on top).'\n    since: \"2026-10-16\"\n    proposal:\n      do: refine\n      issue: 9\n      need: 'Exporting a CSV file drops its last row: 3 sales give a file of 2 rows.'\n      why: A finding in code words.\n      lift: true\n      added: [Description, Need]\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: fake:text-on-top-cautious}
expect:
  findings: [{rule: drafts-proposed, where: "#8"}, {rule: done, where: "#8", message: "Refined #8: Verification, Scope."}, {rule: done-as-accepted, where: "#9"}]
  forge:
    issues:
      - id: 8
        body-contains: "The loop ends one row early"
        body-lacks: "## Need"
        labels: [needs-triage, workline:to-refine, workline:proposed]
        comment-contains: ["**Proposes**: Take its text on top into the Need, rewritten in plain words as a draft for you to correct. Why: A finding in code words.", "**Need**\n\nExporting a CSV file drops its last row: 3 sales give a file of 2 rows."]
      - id: 9
        body-contains: "Found by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#11111111 -->\n\n## Need\n\n"
        body-lacks: "The loop ends one row early"
        comment-contains: "Rewrote: the text on top as the Need, in plain words."
