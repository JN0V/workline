case: product-owner/report-stuck-proposed-unticked
about: "Stuck lists a proposal of the report unticked and unsettled for more than stuck-days, from the day the record says it was first proposed; one the record has no day for gets the run's, and is not stuck yet (ADR-0031)."
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "The export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "An older report."
        labels: []
        comments: ["```yaml\nproposed:\n  - {issue: 7, act: close-obsolete, line: 'Close #7 as obsolete: the loop', since: '2026-01-01'}\n  - {issue: 9, act: rename, line: 'Rename #9 to Keep every row'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 10, body-contains: "- #7 Export drops the last row — `close-obsolete` proposed here since 2026-01-01 (", comment-contains: "since: \"2026-01-01\""}
      - {id: 10, body-lacks: "#9 Rows lost — `rename` proposed"}
      - {id: 10, body-contains: "- [ ] Rename #9 to Keep every row"}
