case: product-owner/scope-waits-for-its-code
about: >
  Bugs read with no code given (#970): the product owner's refine
  writes a Scope it has not read. The engine leaves that Scope out and
  keeps its paths as the issue's code: the issue is read again with
  that code, and its Scope is written from it. The rest of #9's refine
  is written. #10's refine holds its Scope alone: nothing is written,
  and why is said, the agent told to name the code with a sources.
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses the last one.\n\n## Steps to reproduce\n\n1. Export three rows.\n- **Expected:** three rows.\n- **Actual:** two.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n"
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 10
        title: "First row lost"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses the first one.\n\n## Steps to reproduce\n\n1. Export three rows.\n- **Expected:** three rows.\n- **Actual:** two.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n\n## Verification\n\n- A test exports three rows.\n"
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: fake:refine-scope-no-code}
expect:
  findings:
    - {rule: scope-unread, where: "#9", message: "its Scope is written from that code"}
    - {rule: scope-unread, where: "#10", message: "Name the code it is about with `sources`"}
  no-findings: [{rule: nothing-to-refine, where: "#10"}]
  forge:
    issues:
      - {id: 9, body-contains: "## Verification", body-lacks: "## Scope", comment-contains: "sources: [src/export]\n"}
      - {id: 10, body-lacks: "## Scope"}
