case: product-owner/proposal-on-a-read-issue-posted-anew
about: "A proposal on an issue the role already commented on is posted anew, as the role's own comment, last on the issue, and the one before is deleted — one comment of the role's still, and one mail to whoever follows the issue, since a forge mails for a new comment and never for an edit (#426). That comment was created under a person's account, as when the role once ran with their token: the proposal is not left under their name."
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        body: "Some rows are lost."
        author: ann
        insider: true
        labels: []
        comments:
          - {body: "```yaml\nsources: []\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->", author: ann, insider: true}
          - {body: "Seen again on Monday's export.", author: bob, insider: true}
run: {role: product-owner, event: schedule, ai: fake:refine-nine-again}
expect:
  findings: [{rule: done, where: "#9"}]
  forge:
    issues:
      - {id: 9, labels: [workline:to-refine, workline:draft, workline:proposed], comments: 2, posted: 1}
      - {id: 9, comment-contains: ["Your answer", "author:workline-bot body:**The product owner**"], comment-lacks: "author:ann"}
