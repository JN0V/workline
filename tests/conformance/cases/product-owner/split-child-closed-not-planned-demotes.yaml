case: product-owner/split-child-closed-not-planned-demotes
about: A part of a split, closed as not planned by a person, undoes the split — found at the next run from the parent's state, with no agent — and puts splitting back to propose; a part closed as completed does not.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Export fixes", body: "The export drops its last row, and a comma splits a cell.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nsplit: [11, 12]\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 8, title: "Rows lost", body: "Some rows are lost.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nsplit: [13, 14]\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 11, title: "Keep the last row in the CSV export", body: "Part of #9.", labels: [], closed: true, reason: completed}
      - {id: 12, title: "Quote commas in exported cells", body: "Part of #9.", labels: [], closed: true, reason: not_planned}
      - {id: 13, title: "Count the rows", body: "Part of #8.", labels: [], closed: true, reason: completed}
      - {id: 14, title: "Say the rows lost", body: "Part of #8.", labels: [], comments: []}
      - id: 10
        title: "Backlog — product owner"
        body: "What the product owner did."
        labels: []
        comments: ["```yaml\ndone:\n  - {issue: 8, act: split, level: normal}\n  - {issue: 9, act: split, level: normal}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings: [{rule: undone, where: "#9", message: "#12, split from #9 by the role, closed as not planned by a person"}]
  no-findings: [{rule: undone, where: "#8"}]
  forge:
    issues:
      - {id: 10, body-contains: "split: propose (demoted)"}
      - {id: 10, body-contains: "- [ ] Set split back to act: 1 of its acts still standing, 1 undone."}
      - {id: 10, comment-contains: "propose: [split]"}
