case: product-owner/effort-not-kept-is-dropped
about: "With the effort act on but the `effort` setting unset, where the project keeps an effort is not known: the effort is dropped, said; the priority beside it is set. Unset, the agent is not told of efforts, and the act's mode is not listed (ADR-0040, step 3)."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {moved-percent-max: 100, priority: auto, acts: {order: {mode: act}, effort: {mode: act}}}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.\n\n## Scope\n\nsrc/export/csv.go", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:order-effort}
expect:
  findings:
    - {rule: done, where: "#9", message: "Set #9's priority to 1"}
    - {rule: effort-nowhere, where: "#9", message: "the setting `effort` is unset"}
  run-files:
    in/task.md: {contains: "- order: act", not-contains: ["- effort:", "Effort, how hard"]}
  forge:
    issues:
      - {id: 9, labels: [priority/urgent], comment-lacks: "effort:"}
