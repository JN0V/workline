case: product-owner/picker-a-symbol-past-the-first-lines
about: >
  The code picker's contract, the product owner's side (ADR-0063, step
  4), on DomoticsCore's own code as the C++ trial had it: #1056, the
  trial's #37: two static members of an 894-line header, declared at its
  top and defined at its end. The issue's task holds the code it names,
  within the role's budget, and the agent is asked.
given:
  repo: backlog
  setup:
    - |
      cp -R "$FIXTURES/code/domoticscore/." .
      git add . && git commit -qm 'feat: DomoticsCore, frozen from the C++ trial'
  forge:
    issues:
      - {id: 9, title: "`wsBuffer_` and `bufferLock_` defined in a header", body: "`wsBuffer_` and `bufferLock_` are declared in `DomoticsCore-WebUI/include/DomoticsCore/WebUI.h` (lines 82-83). Check where each is defined: two sources that include it fail to link.", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: issue, target: {issue: 9}, ai: fake:proposes-nothing}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: prompt-over-budget}]
  run-files:
    in/task.md:
      contains: ["char WebUIComponent::wsBuffer_[WEBUI_WS_BUFFER_SIZE];", "HAL::Platform::RecursiveLock WebUIComponent::bufferLock_;"]
