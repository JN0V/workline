case: product-owner/obsolete-reply-cancels
about: Anyone writing on an issue announced obsolete keeps it open — its label taken off, the evidence recorded in its state so it is not announced again for it, nothing more said to them; no judge is asked (ADR-0024).
given:
  repo: backlog
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 7
        title: "Export drops the last row"
        body: "Every CSV file: the export drops the last row."
        author: zed
        labels: [workline:obsolete]
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "@zed, this issue looks obsolete.\n\n<details><summary>As the engine reads it</summary>\n\n```yaml\nquote: {path: src/export/csv.go, text: \"for i := 0; i < len(rows); i++ {\"}\nwhy: WriteRows now loops to the last row.\ncommit: d8c4dff\nannounced: \"2026-01-01\"\n```\n</details>\n\n<!-- workline:product-owner/obsolete -->"
          - {author: ann, body: "Still happens with an empty file."}
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  calls: [{agent: fake, model: proposes-nothing}]
  forge:
    issues:
      - {id: 7, closed: false, labels: [], comments: 3, comment-contains: "kept: ['src/export/csv.go:b2a6ba892dee']"}
      - {id: 8, title: "Backlog — product owner", body-contains: "Kept #7 open, announced obsolete on 2026-01-01: @ann wrote on it after it was announced obsolete."}
