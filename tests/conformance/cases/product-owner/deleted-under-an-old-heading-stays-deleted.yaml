case: product-owner/deleted-under-an-old-heading-stays-deleted
about: "An issue's state is read by meaning (ADR-0039): in an engine built with how a person accepts the need written \"Accepted when\", \"Validation\" still read (a build of the tests only), a section the role wrote as Validation that a person deleted is a \"no\" for that meaning — a refine proposing it writes nothing under the new name either, and the deletion is kept as it was recorded, as product-owner/deleted-section-not-written-again's."
given:
  repo: backlog
  engine-tags: [workline_alias]
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.\n\n## Need\n\nEvery row exported, so the monthly report is right.\n\n## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope\n\nWriteRows in src/export/csv.go.", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nbody: 0123456789ab\nwrote:\n  Need: aaaaaaaaaaaa\n  Verification: 5d0b8e3c1f2a\n  Validation: bbbbbbbbbbbb\n  Scope: cccccccccccc\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-nine-again}
expect:
  agent-calls: 1
  findings: [{rule: nothing-to-refine, where: "#9"}]
  forge:
    issues:
      - {id: 9, body-lacks: "Accepted when", comment-contains: "deleted: [Validation]"}
