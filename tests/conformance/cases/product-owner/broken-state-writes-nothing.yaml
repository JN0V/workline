case: product-owner/broken-state-writes-nothing
about: "An issue whose engine comment does not read is never acted on; nothing is written on it, not even a repaired comment. It is said, a warning naming the issue and what a person may do (#302); a state that reads, or one an older engine wrote (`comments`, before `heard`), says nothing."
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 8, title: "Export in JSON", body: "Add a JSON export.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\njudged: 0000000\ncomments: 1\n```\n\n<!-- workline:sticky=product-owner/state -->", "A JSON export would help."]}
      - {id: 12, title: "Last row missing in CSV", body: "In my CSV export the last row is missing.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go\nconfirmed: \n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:close-duplicate, summary: true}
expect:
  findings: [{rule: state-broken, where: "#12", level: warn, message: "): the issue is held — not judged, nothing written on it — until a person mends that comment, or deletes it for a state anew"}]
  no-findings: [{rule: state-broken, where: "#7"}, {rule: state-broken, where: "#8"}]
  summary-file:
    - "#12](https://forge.example/issues/12), warn: its state comment does not read ("
  forge:
    issues:
      - {id: 12, closed: false, comments: 1, comment-contains: "sources: [src/export/csv.go\n"}
