case: product-owner/back-to-act-by-a-tick
about: A kind of act back to propose after a wrong closing is set back to act only by a person of the project ticking its box in the report, the measure beside it; the settings are not touched.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost on Windows", body: "Not the same bug.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 13
        title: "Backlog — product owner"
        body: "Back to propose after a wrong closing: close-duplicate.\n- [x] Set close-duplicate back to act: 2 of its closings still closed, 1 reopened. <!-- workline:proposal=act/close-duplicate -->\n"
        labels: []
        ticks: [{item: "Set close-duplicate back to act: 2 of its closings still closed, 1 reopened. <!-- workline:proposal=act/close-duplicate -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\nclosed:\n  - {issue: 4, act: close-duplicate}\n  - {issue: 5, act: close-duplicate}\nwrong:\n  - {issue: 9, act: close-duplicate}\npropose: [close-duplicate]\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings: [{rule: back-to-act, where: "#13"}]
  forge:
    issues:
      - {id: 13, body-contains: "close-duplicate set back to act by @dev", comment-lacks: "propose: [close-duplicate]"}
      - {id: 13, body-lacks: "Back to propose after a wrong closing"}
