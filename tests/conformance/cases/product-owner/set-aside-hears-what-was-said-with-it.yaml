case: product-owner/set-aside-hears-what-was-said-with-it
about: 'A comment written before a person took workline:proposed off is part of their "not now" (ADR-0038): heard when the role records the issue set aside, so it does not bring the issue back; one written after the label came off is their word since, and brings it back at the next run.'
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        body: "Some rows are lost."
        author: ann
        insider: true
        labels: []
        label-events: [{label: workline:proposed, added: false, author: ann, insider: true, created: "2026-10-08T07:00:00Z"}]
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nheard: 0\nlabel: workline:proposed\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "Not now: after the release.", author: ann, insider: true, created: "2026-10-08T06:59:00Z"}
      - id: 10
        title: "Totals wrong"
        body: "Totals are wrong."
        author: ann
        insider: true
        labels: []
        label-events: [{label: workline:proposed, added: false, author: ann, insider: true, created: "2026-10-08T07:00:00Z"}]
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nheard: 0\nlabel: workline:proposed\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "Thinking again: the totals matter now.", author: ann, insider: true, created: "2026-10-08T07:05:00Z"}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings: [{rule: set-aside, where: "#9"}, {rule: set-aside, where: "#10"}]
  forge:
    issues:
      - {id: 9, labels: [], comment-contains: ["aside: ", "heard: 1"]}
      - {id: 10, labels: [], comment-contains: ["aside: ", "heard: 0"]}
