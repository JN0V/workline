case: product-owner/refine-rewrites-a-guessed-scope
about: >
  A Scope marked `Guessed:` was written before its code was read
  (#970). Given that code, the product owner answers a refine with a new
  Scope: it replaces the guess, the `Guessed:` line gone (#1126, the
  DomoticsCore copy's #47, where it was dropped as drafted already).
  #10's Scope, a person's with no guess and nothing found in it, stays
  word for word: the role's other Scope is not written.
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses the last one.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n\n---\n\n## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope\n\nGuessed: the export loop is not in the code given.\n- `src/export/`: the export loop must write every row."
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 10
        title: "First row lost"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses the first one.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n\n---\n\n## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope\n\n`src/export/csv.go`: the writer, as Ann found it."
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: fake:refine-guessed-scope}
expect:
  no-findings: [{rule: nothing-to-refine, where: "#9"}, {rule: scope-unread}]
  forge:
    issues:
      - id: 9
        body-contains: "## Scope\n\n`src/export/csv.go`: `WriteRows` stops one row short."
        body-lacks: "Guessed:"
        comment-contains: "Changed: Scope."
      - id: 10
        body-contains: "## Scope\n\n`src/export/csv.go`: the writer, as Ann found it."
        body-lacks: "stops one row short"
