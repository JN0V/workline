case: product-owner/picker-a-line-of-a-long-file
about: >
  The code picker's contract, the product owner's side (ADR-0063, step
  4), on DomoticsCore's own code as the C++ trial had it: #1063, the
  trial's #33: an issue naming one line of a 7,576-line roadmap. The
  issue's task holds the code it names, within the role's budget, and
  the agent is asked.
given:
  repo: backlog
  setup:
    - |
      cp -R "$FIXTURES/code/domoticscore/." .
      git add . && git commit -qm 'feat: DomoticsCore, frozen from the C++ trial'
    - |
      mkdir -p docs
      awk 'BEGIN { for (i = 1; i <= 7576; i++) if (i == 6353) print "| WebUI | `wsBuffer_[]` static member defined in header — ODR violation risk in multi-TU builds |"; else print "| Core | an item of the roadmap, line " i " |" }' > docs/CODE-ROADMAP.md
      git add docs && git commit -qm 'docs: the roadmap, 7,576 lines'
  forge:
    issues:
      - {id: 9, title: "A roadmap item is done", body: "The item at `docs/CODE-ROADMAP.md:6353` was fixed since: strike it.", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: issue, target: {issue: 9}, ai: fake:proposes-nothing}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: prompt-over-budget}]
  run-files:
    in/task.md:
      contains: ["| WebUI | `wsBuffer_[]` static member defined in header", "an item of the roadmap, line 6352 |", "an item of the roadmap, line 6354 |"]
      not-contains: ["an item of the roadmap, line 1 |", "an item of the roadmap, line 400 |"]
