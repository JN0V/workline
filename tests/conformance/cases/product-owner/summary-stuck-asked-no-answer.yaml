case: product-owner/summary-stuck-asked-no-answer
about: "The summary says stuck an issue whose reporter was last written to more than stuck-days ago, with no person's comment since, from the day the forge gives the round; one answered is not stuck (ADR-0031)."
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        body: "Some rows are lost."
        author: ann
        insider: true
        labels: []
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: which rows are lost?\n\n<!-- workline:product-owner/ask -->", created: "2026-01-02T10:00:00Z"}
      - id: 10
        title: "Rows lost again"
        body: "Lost."
        author: bob
        insider: true
        labels: []
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@bob, to refine this issue: before?\n\n<!-- workline:product-owner/ask -->", created: "2026-01-02T10:00:00Z"}
          - {body: "Yes, before the export.", author: bob, insider: true, created: "2026-01-03T10:00:00Z"}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings: [{rule: stuck, where: "#9", message: "its reporter written to on 2026-01-02 ("}]
  no-findings: [{rule: stuck, where: "#10"}]
