case: product-owner/issue-event-reads-its-issue-alone
about: >
  Woken by one issue's state (ADR-0059), the product owner reads that
  issue's comments alone, when it judges and when its acts are decided
  and written: never every open issue's, which spent the token's API
  budget at every step of the line (#804). The other issue's comments
  are not listed, and nothing is done on it.
given:
  repo: backlog
  config:
    routing: {events: {schedule: [product-owner], issue: [product-owner, tester, developer]}}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.\n\n## Need\n\nThe monthly report counts every sale.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n\n## Scope\n\nsrc/export/csv.go", author: ann, insider: true, labels: [workline:to-refine]}
      - {id: 10, title: "Rows lost again", body: "Rows go missing on the last day of a month.", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {route: issue, target: {issue: 9}, ai: fake:ready-nine}
expect:
  status: pass
  agent-calls: 1
  forge:
    issues:
      - {id: 9, labels: [workline:needs-tests]}
      - {id: 10, labels: [workline:to-refine], comments: 1, comments-read: 0}
