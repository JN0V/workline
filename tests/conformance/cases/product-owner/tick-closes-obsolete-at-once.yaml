case: product-owner/tick-closes-obsolete-at-once
about: A closing as obsolete proposed in the report and ticked by a person of the project is closed at the next run, its quote found again — not announced, no second judge asked; the person's tick is the yes, named on the issue.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings:
          acts: {close-obsolete: {mode: propose, max: 3}}
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "The export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "## Proposed\n\n- [x] Close #7 as obsolete: the loop <!-- workline:proposal=7/close-obsolete -->\n"
        labels: []
        ticks: [{item: "Close #7 as obsolete: the loop <!-- workline:proposal=7/close-obsolete -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\nproposed:\n  - issue: 7\n    act: close-obsolete\n    line: 'Close #7 as obsolete: the loop'\n    proposal: {do: close, issue: 7, reason: obsolete, quote: {path: src/export/csv.go, text: 'for i := 0; i < len(rows); i++ {'}, why: WriteRows now loops to the last row., announce: true, until: '2026-10-12'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 7, closed: true, labels: [], comment-contains: "@dev having ticked it in the report"}
      - {id: 10, body-contains: "Closed #7 as obsolete", comment-contains: "act: close-obsolete"}
