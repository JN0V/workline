case: product-owner/drafts-held-from-a-ready-while-its-question-waits
about: >
  A product choice is never settled by silence (ADR-0060, amended): an
  agent's `ready` takes no draft past a question that waits with no
  answer nor assumption (#11): not moved, said why, its drafts left to a person's yes. One the same run
  assumes is settled first: #12's drafts are taken as written, and it
  goes on.
given:
  repo: backlog
  forge:
    issues:
      - id: 11
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine, workline:draft]
        labeled: {"workline:draft": "2026-10-01T09:00:00Z"}
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n<!-- workline:draft -->\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: Should `--verbose=false` print the plain line, or is that undecided?\n\n<!-- workline:product-owner/ask -->", created: "2026-10-01T23:50:00Z"}
      - id: 12
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine, workline:draft]
        labeled: {"workline:draft": "2026-10-01T09:00:00Z"}
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n<!-- workline:draft -->\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: Should `--verbose=false` print the plain line, as `--short` does?\n\n<!-- workline:product-owner/ask -->", created: "2026-10-01T23:50:00Z"}
run: {role: product-owner, event: schedule, ai: "fake:ready-past-an-open-question"}
expect:
  status: pass
  findings:
    - {rule: not-ready, where: "#11", message: "its question waits for an answer or an assumption: its drafts are not taken before"}
  forge:
    issues:
      - id: 11
        labels: [workline:to-refine, workline:draft, workline:proposed]
        body-lacks: "## Assumptions"
      - id: 12
        labels: [workline:ready]
        body-contains: "## Assumptions"
