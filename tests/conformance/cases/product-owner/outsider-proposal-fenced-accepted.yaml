case: product-owner/outsider-proposal-fenced-accepted
about: A proposal to an outsider whose example and steps hold a code block, accepted by a maintainer with the label workline:accepted — every proposed section is written whole, the code blocks kept, and the issue moves to ready (#391).
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: zed, insider: false, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run:
  role: product-owner
  event: schedule
  ai: fake:refine-an-outsider-fenced
  then: again
  between:
    issues:
      - {id: 9, labels: [workline:to-refine, workline:accepted]}
expect:
  no-findings: [{rule: proposal-unread, where: "#9"}]
  forge:
    issues:
      - id: 9
        labels: [workline:ready]
        body-contains:
          - "## Example\n\nThe export of 8 Oct, 3 sales:\n\n```csv\nday,item\n2026-10-08,tea\n2026-10-08,cake\n```"
          - "## Steps to reproduce\n\n1. Run:\n\n```sh\nshop export --day 2026-10-08\n```\n\n2. Count the rows: 2, not 3."
          - "## Verification\n\nA test writes three rows and reads three lines back."
          - "## Validation\n\n- **One day:** Given 3 sales on 8 Oct"
          - "## Scope\n\n`WriteRows` in src/export/csv.go, and its test."
