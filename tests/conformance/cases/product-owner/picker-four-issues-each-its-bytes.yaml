case: product-owner/picker-four-issues-each-its-bytes
about: >
  The code picker's contract, the product owner's side (#1152): four
  issues read in one run, the C++ trial's #54, #55, #56 and #56 titled
  `Core:`. Each issue has code-bytes-max to itself, the context budget
  bounding the run: #55's fault, in ProviderRegistry.h, is still
  given, and each of the others'.
given:
  repo: backlog
  setup:
    - |
      cp -R "$FIXTURES/code/domoticscore-7da20c9/." .
      git add . && git commit -qm 'feat: DomoticsCore at 7da20c9, reduced, from the C++ trial'
  forge:
    issues:
      - {id: 54, title: "NTP: \"Sync now\" reports success when no server answers", body: "Who it hurts: anyone who presses \"Sync now\" on the NTP page, or calls `syncNow()`, after the clock has synced once. Every such sync reports success at the next `loop()`, even when no NTP server answers. A device that lost its NTP servers never says so: `syncErrors` stays 0, the `ntp/sync_failed` event and the `onSync(false)` callback never come.\n\nSteps to reproduce\n1. Start the NTP component; let it sync once (the clock is past 2020).\n2. Cut the network to the NTP servers (or point the servers to an address that never answers).\n3. Call `ntp.syncNow()` (or press \"Sync now\" in the WebUI); it returns `true`.\n4. Let `loop()` run for longer than `timeoutMs` (5 s by default).\n5. Read `getStatistics()`, and watch `onSync()`.\n\nExpected\n- No answer within `timeoutMs`: `syncErrors` is 1, `consecutiveFailures` is 1, `onSync(false)` is called and `ntp/sync_failed` is emitted.\n- `syncCount` counts only the syncs a server answered.\n\nActual\n- The first `loop()` after `syncNow()` counts a sync: `syncCount` goes 1 \u2192 2, `onSync(true)`, \"Time re-synchronized after 10 ms\".\n- The timeout never fires; `syncErrors` stays 0.\n\nHost run (native stubs, the NTP stub never answers):\n\n```\nafter first sync: syncCount=1 ok=1 fail=0\nsyncNow() -> 1 (no server will answer)\n6 s later: syncCount=2 syncErrors=0 lastSyncDuration=10 ms ok=2 fail=0\n```\n\nIt looks like `loop()` takes \"the clock is valid and the time differs from the last sync\" as the end of the sync. After the first sync both are always true.\n\nVersion: DomoticsCore 2.13.0 (NTP component 1.4.3), native build.\n", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 55, title: "WebUI: switching on a running component runs its begin() again", body: "Who it hurts: anyone who uses the switches on the WebUI's Components page. Switching on a component that is already on runs its `begin()` a second time, with no `shutdown()` in between. A component that subscribes to events in `begin()` then handles each event twice. Switching off one already off runs `shutdown()` again.\n\nIt happens easily: two browser tabs on the same device, or a page left open while someone else changed it. The stale tab shows a component as off; switching it on sends \"enabled=true\" for a component that is on.\n\nSteps to reproduce\n1. A component registered with the WebUI and running (its `begin()` ran once).\n2. POST `/api/components/enable` with `name=<component>` and `enabled=true`.\n3. Let the WebUI's `loop()` apply it.\n4. POST `enabled=false` twice, with a `loop()` after each.\n\nExpected\n- Step 2 changes nothing: the component is on already, `begin()` is not called again.\n- Step 4 calls `shutdown()` once.\n\nActual\n- Step 2 answers `\"success\":true` and `begin()` runs a second time.\n- Step 4 calls `shutdown()` twice.\n\nHost run (native stubs, a component that counts its calls):\n\n```\ncomponent started: begins=1\nPOST enabled=true -> {\"name\":\"Toggle\",\"enabled\":true,\"success\":true}\nafter enable of an enabled component: begins=2 shutdowns=0\nPOST enabled=false -> {\"name\":\"Toggle\",\"enabled\":false,\"success\":true}\nPOST enabled=false -> {\"name\":\"Toggle\",\"enabled\":false,\"success\":true}\nafter two disables: shutdowns=2\n```\n\nVersion: DomoticsCore 2.13.0 (WebUI component 1.13.0), native build.\n", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 56, title: "RemoteConsole: a disabled console's shutdown() removes my log listener", body: "Who it hurts: an application that adds its own log listener with `LoggerCallbacks::addCallback()` (to forward log lines to MQTT or a file, say) and has the remote console disabled in its config. When the disabled console is shut down (switched off on the WebUI's Components page, or at the Core's shutdown), the application's listener stops receiving log lines. Nothing says so.\n\nSteps to reproduce\n1. In `setup()`, add a log listener with `LoggerCallbacks::addCallback(...)` before any other.\n2. Add a `RemoteConsoleComponent` with `enabled = false` in its config.\n3. Run its `begin()`, then its `shutdown()`.\n4. Log a line.\n\nExpected\n- The application's listener gets the line: a console that never started has nothing to remove.\n\nActual\n- The listener gets nothing after step 3. It was removed from the logger.\n\nHost run (native stubs):\n\n```\nmy listener got 1 APP line(s)\nafter a disabled console's begin()+shutdown(): my listener got 1 APP line(s)\n```\n\nThe second line should say 2.\n\nVersion: DomoticsCore 2.13.0 (RemoteConsole component 1.7.3), native build.\n", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 57, title: "Core: a disabled component's shutdown() removes my log listener", body: "Who it hurts: an application that adds its own log listener with `LoggerCallbacks::addCallback()` (to forward log lines to MQTT or a file, say) and has the remote console disabled in its config. When the disabled console is shut down (switched off on the WebUI's Components page, or at the Core's shutdown), the application's listener stops receiving log lines. Nothing says so.\n\nSteps to reproduce\n1. In `setup()`, add a log listener with `LoggerCallbacks::addCallback(...)` before any other.\n2. Add a `RemoteConsoleComponent` with `enabled = false` in its config.\n3. Run its `begin()`, then its `shutdown()`.\n4. Log a line.\n\nExpected\n- The application's listener gets the line: a console that never started has nothing to remove.\n\nActual\n- The listener gets nothing after step 3. It was removed from the logger.\n\nHost run (native stubs):\n\n```\nmy listener got 1 APP line(s)\nafter a disabled console's begin()+shutdown(): my listener got 1 APP line(s)\n```\n\nThe second line should say 2.\n\nVersion: DomoticsCore 2.13.0 (RemoteConsole component 1.7.3), native build.\n", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: prompt-over-budget}, {rule: issues-cut}]
  run-files:
    in/task.md:
      contains: ["            if (enabled) component->begin();", "LoggerCallbacks::removeCallback(loggerCallbackId_);", "        // Detect sync completion (initial or subsequent)", "## The code #57 names"]
