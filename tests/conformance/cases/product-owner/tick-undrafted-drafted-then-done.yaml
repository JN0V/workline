case: product-owner/tick-undrafted-drafted-then-done
about: "A proposal an older engine recorded with its line alone, no act kept, ticked by a person of the project: its issue is read first, though nothing changed, the agent asked to draft that act, and the act drafted is done as their yes — whatever the kind's mode — never handed back to the person (ADR-0025, amended)."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings:
          acts: {refine: {mode: propose, max: 5}}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "## Proposed\n\n- [x] Refine #9: Need (draft), Validation (draft). The issue says what is wrong. <!-- workline:proposal=9/refine -->\n"
        labels: []
        ticks: [{item: "Refine #9: Need (draft), Validation (draft). The issue says what is wrong. <!-- workline:proposal=9/refine -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\nproposed:\n  - issue: 9\n    act: refine\n    line: 'Refine #9: Need (draft), Validation (draft). The issue says what is wrong.'\n    since: '2026-10-04'\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: fake:refine-nine}
expect:
  agent-calls: 1
  run-files:
    in/task.md: {contains: "A person of the project, @dev, ticked this proposal in the report, recorded before its act was: \"Refine #9: Need (draft), Validation (draft). The issue says what is wrong.\". Write that act now (`refine`)"}
  forge:
    issues:
      - {id: 9, body-contains: "Some rows are lost.\n\n## Need\n\n*Draft by the product owner"}
      - {id: 10, body-contains: "Refined #9: Need (draft), Verification, Validation (draft), Scope.", body-lacks: "proposal=9/refine", comment-lacks: "act: refine"}
      - {id: 10, body-contains: "Ticked by @dev."}
