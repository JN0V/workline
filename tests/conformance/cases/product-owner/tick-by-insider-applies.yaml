case: product-owner/tick-by-insider-applies
about: A person of the project ticks a proposal's box in the report; at the next run the engine does it as the record holds it, with no agent, says who ticked it, and the proposal leaves the report.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings:
          acts: {rename: {mode: propose, max: 5}}
  forge:
    issues:
      - {id: 9, title: "bug", body: "The export loses the last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "## Proposed\n\n- [x] Rename #9 from \"bug\" to \"The CSV export drops the last row\": \"bug\" says nothing. <!-- workline:proposal=9/rename -->\n"
        labels: []
        ticks: [{item: "Rename #9 from \"bug\" to \"The CSV export drops the last row\": \"bug\" says nothing. <!-- workline:proposal=9/rename -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\nproposed:\n  - issue: 9\n    act: rename\n    line: 'Rename #9 from \"bug\" to \"The CSV export drops the last row\": \"bug\" says nothing.'\n    proposal: {do: rename, issue: 9, title: The CSV export drops the last row, why: '\"bug\" says nothing.'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 9, title: "The CSV export drops the last row"}
      - {id: 10, body-contains: "Renamed #9", comment-lacks: "act: rename"}
      - {id: 10, body-contains: "Ticked by @dev.", body-lacks: "proposal=9/rename"}
