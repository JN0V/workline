case: product-owner/acts-recorded-with-day-and-level
about: An act the role did alone is kept in its issue's state with its kind, the autonomy level it was done at and the day, for its comment there and the weekly sample to draw (ADR-0038).
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row missing in CSV", body: "In my CSV export the last row is missing.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:close-duplicate}
expect:
  status: pass
  forge:
    issues:
      - {id: 12, closed: true}
      - {id: 12, comment-contains: "did:\n    - act: close-duplicate\n      level: normal\n      day: \"20"}
      - {id: 13, absent: true}
