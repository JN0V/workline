case: product-owner/level-cautious-proposes-direction
about: At autonomy cautious — a person is the Product Owner — the acts that set direction are proposed in the report, not done (a duplicate closed, a rename, a priority, a split), and those that check facts are done (sources named); the report and the task say each kind's mode, from the level.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {autonomy: cautious}
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 9, title: "bug", body: "The export loses the last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Export fixes", body: "The export drops its last row, and a comma splits a cell.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 11, title: "Rows lost", body: "WriteRows loses rows.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [README.md]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row missing in CSV", body: "In my CSV export the last row is missing.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:level-acts}
expect:
  status: pass
  run-files:
    in/task.md: {contains: "- split: propose (level)\n- depend: propose (level)\n- rename: propose (level)\n"}
  forge:
    issues:
      - {id: 12, closed: false}
      - {id: 9, title: "bug", labels: []}
      - {id: 10, comment-lacks: "split:"}
      - {id: 11, comment-contains: "sources: [src/export/csv.go]"}
      - {id: 13, title: "Backlog — product owner", body-contains: "- sources: act, 10 a run (level)\n- close-duplicate: propose (level)\n- close-obsolete: act, 3 a run (level)\n- milestone: propose (level)\n- order: propose (level)\n- refine: act, 5 a run, Need and Validation drafts proposed (level)\n- ready: act, 5 a run (level)\n- ask: act, 2 a run (level)\n- split: propose (level)\n- depend: propose (level)\n- rename: propose (level)\n- open: act, 30 a run (level)"}
      - {id: 13, body-contains: "<details><summary>Autonomy: cautious — what the role does alone, and what it proposes</summary>"}
      - {id: 13, body-contains: "**#12 Last row missing in CSV**\n\n- [ ] Close it as a duplicate of #7"}
      - {id: 13, body-contains: "- [ ] Rename it to \"The CSV export drops the last row\""}
      - {id: 13, body-contains: "**#9 bug**\n\n- [ ] Set its priority to 1 (now: no priority, no milestone)."}
      - {id: 13, body-contains: "- [ ] Split it into 2 issues"}
