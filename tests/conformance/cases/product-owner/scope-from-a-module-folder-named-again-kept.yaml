case: product-owner/scope-from-a-module-folder-named-again-kept
about: >
  #1433, the Kotlin trial's #39: an issue naming no code, the product
  owner named the module folders core/timelapse and feature/timelapse,
  no line quoted: its state keeps no source. Run again with those folders, every file below them given, it names the folders again beside a Scope written from those files: kept.
given:
  repo: backlog
  setup:
    - |
      cp -R "$FIXTURES/code/traceglass/." .
      printf 'plugins { kotlin("jvm") }\n' > core/timelapse/build.gradle.kts
      printf 'plugins { kotlin("jvm") }\n' > feature/timelapse/build.gradle.kts
      git add . && git commit -qm 'feat: TraceGlass, reduced, from the Kotlin trial'
  # Every file below the folders given.
  config:
    roles: {product-owner: {settings: {code-bytes-max: 2500}}}
  forge:
    issues:
      - {id: 39, title: "The time-lapse counter runs on while the camera is off", body: "## Need\n\nWhile recording a time-lapse I want the counter to show the snapshots really taken.\n\n## Example\n\n1. Start a time-lapse, one snapshot every 5 seconds.\n2. Switch to another app for a minute, then come back.\n3. The counter reads 13, but only 2 snapshots were saved.\n", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run:
  role: product-owner
  event: issue
  target: {issue: 39}
  input: {needs: "core/timelapse, feature/timelapse"}
  ai: fake:scope-from-a-module-folder-named-again
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: scope-unread, where: "#39"}]
  forge:
    issues:
      - {id: 39, body-contains: "## Scope"}
