case: product-owner/field-blind-token-writes-nothing
about: "A token not shown to read values visible to organization members only — the job's own, an App's, an outsider's — reads them as none, and never as empty: nothing is written in those fields, said where each axis is found and on each act (ADR-0040, step 4: never read as empty)."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {moved-percent-max: 100, priority: auto, effort: auto, acts: {order: {mode: act}, effort: {mode: act}}}
  forge:
    public: true
    fields-blind: "the job's own token (GITHUB_TOKEN) is not shown yet to read values visible to organization members only"
    issue-fields:
      - {id: 47714576, name: Priority, options: [Urgent, High, Medium, Low]}
      - {id: 47714579, name: Effort, options: [High, Medium, Low]}
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.\n\n## Scope\n\nsrc/export/csv.go", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:order-effort}
expect:
  findings:
    - {rule: values-where, message: "the job's own token (GITHUB_TOKEN) is not shown yet to read values visible to organization members only: nothing written there"}
    - {rule: priority-blind, where: "#9", message: "its values are never read as empty, and nothing is written in the field Priority"}
    - {rule: effort-blind, where: "#9", message: "nothing is written in the field Effort"}
  no-findings:
    - {rule: done, where: "#9"}
  forge:
    issues:
      - {id: 9, fields: {}, comment-lacks: ["priority:", "effort:"]}
