case: product-owner/refine-adds-a-file-to-a-persons-scope
about: "A Scope a person wrote is the product owner's to keep too (ADR-0060): the reviewer finds a file missing from it; at its next refine the product owner adds the file to the Scope, asks nobody, and says \"Changed: Scope\". The person's Need, Validation and Verification stay as they are."
given:
  repo: backlog
  config:
    routing:
      events: {schedule: [product-owner, reviewer]}
  forge:
    issues:
      - id: 9
        title: Rows lost
        body: "## Need\n\nThe monthly report counts every sale.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n\n---\n\n## Verification\n\nSessions feel right to the users.\n\n## Scope\n\nsrc/export/csv.go"
        author: ann
        insider: true
        labels: [workline:to-refine]
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nbody: efbae4cec0e6\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline reviewer**, its spec.\n\n<!-- workline:spec-review body=efbae4cec0e6 round=1 open=1 in=Scope -->\n\n<!-- workline:sticky=reviewer/spec -->"
run: {role: product-owner, event: schedule, ai: fake:refine-persons-scope}
expect:
  forge:
    issues:
      - id: 9
        body-contains: "## Verification\n\nSessions feel right to the users.\n\n## Scope\n\n- src/export/csv.go\n- src/export/csv_test.go: the test the Verification names."
        comment-contains: ["Changed: Scope.", "revised: [Scope]"]
        comment-lacks: "to refine this issue"
  run-files:
    in/task.md: {contains: ["yours to rewrite: Scope"]}
