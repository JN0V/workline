case: product-owner/tick-undrafted-waits-for-an-agent
about: "A proposal recorded without its act, ticked by a person of the project, with no agent to draft it: kept, the report saying it is drafted then done at the next run that reads its issue with an agent — never handed back to the person (ADR-0025, amended)."
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 10
        title: "Backlog — product owner"
        body: "## Proposed\n\n- [x] Refine #9: Need (draft), Validation (draft). The issue says what is wrong. <!-- workline:proposal=9/refine -->\n"
        labels: []
        ticks: [{item: "Refine #9: Need (draft), Validation (draft). The issue says what is wrong. <!-- workline:proposal=9/refine -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\nproposed:\n  - issue: 9\n    act: refine\n    line: 'Refine #9: Need (draft), Validation (draft). The issue says what is wrong.'\n    since: '2026-10-04'\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 9, body: "Some rows are lost."}
      - {id: 10, body-contains: "**#9 Rows lost**\n\n- Ticked by @dev: Add Need and Validation to it (Need and Validation as drafts for you to correct). It is drafted, then done, at the next run that reads it with an agent.\n", comment-contains: "agreed: '@dev'"}
      - {id: 10, body-lacks: "proposal=9/refine"}
      - {id: 10, body-contains: "- **Nothing waits on you.**"}
