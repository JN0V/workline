case: product-owner/order-says-what-it-was
about: With milestone and order turned on (off by default, ADR-0038), each issue a run moves is said with its priority and milestone before the run, so a person can put the order back.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {moved-percent-max: 100, acts: {milestone: {mode: act}, order: {mode: act}}}
  forge:
    milestones: [v1.0.0, v1.1.0]
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", milestone: v1.0.0, labels: [workline:priority/3], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\npriority: 3\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:order-and-milestone}
expect:
  findings: [{rule: done, where: "#9", message: "Set #9's priority to 1 (was: priority 3, milestone v1.0.0)"}]
  forge:
    issues:
      - {id: 9, milestone: v1.1.0, labels: [workline:priority/1]}
