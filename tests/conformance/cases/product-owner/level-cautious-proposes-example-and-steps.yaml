case: product-owner/level-cautious-proposes-example-and-steps
about: "At autonomy cautious, an example of the need and a bug's steps to reproduce are drafts as the Need and Validation are: proposed on the issue, in its comment, never written in the body; the Scope, what the code shows, is written. A Need draft saying again the reporter's text on top is not proposed, said with the drafts (ADR-0039)."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {autonomy: cautious}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Last sale missing", body: "The export drops the last sale of the day.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-cautious-example-steps}
expect:
  findings:
    - {rule: drafts-proposed, where: "#9"}
    - {rule: drafts-proposed, where: "#10"}
    - {rule: done, where: "#9", message: "Refined #9: Scope."}
    - {rule: done, where: "#10", message: "Refined #10: Scope."}
  forge:
    issues:
      - id: 9
        body-contains: "Some rows are lost.\n\n## Scope\n\nWriteRows in src/export/csv.go."
        body-lacks: "## Example"
        labels: [workline:to-refine, workline:proposed]
        comment-contains: ["**Proposes**: Add Need, Example and Validation to it (Need, Example and Validation as drafts for you to correct).", "**Example**\n\nAnn sells 3 items on 8 Oct and exports that day: the file holds 2 rows."]
      - id: 10
        body-contains: "The export drops the last sale of the day.\n\n## Scope\n\nWriteRows in src/export/csv.go."
        body-lacks: "## Steps to reproduce"
        labels: [workline:to-refine, workline:proposed]
        comment-contains: ["**Proposes**: Add Steps to reproduce and Validation to it (Steps to reproduce and Validation as drafts for you to correct). Not written: the Need, which said again what is above it.", "**Steps to reproduce**\n\n1. Make 3 sales on 8 Oct, the last at 18:59.", "- Added: Scope. Changed: —. See the issue's edit history."]
