case: product-owner/level-cautious-proposes-example-and-steps
about: "At autonomy cautious, an example of the need and a bug's steps to reproduce are drafts as the Need and Validation are: proposed on the issue, in its comment, never written in the body; Scope and Verification, what the code shows, are written."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {autonomy: cautious}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Last sale missing", body: "The export drops the last sale of the day.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-cautious-example-steps}
expect:
  findings:
    - {rule: drafts-proposed, where: "#9"}
    - {rule: drafts-proposed, where: "#10"}
    - {rule: done, where: "#9", message: "Refined #9: Verification, Scope."}
    - {rule: done, where: "#10", message: "Refined #10: Verification, Scope."}
  forge:
    issues:
      - id: 9
        body-contains: "Some rows are lost.\n\n## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope\n\nWriteRows in src/export/csv.go."
        body-lacks: "## Example"
        labels: [workline:to-refine, workline:proposed]
        comment-contains: ["**Proposes**: Add Need, Example and Validation to it (Need, Example and Validation as drafts for you to correct).", "**Example**\n\nAnn sells 3 items on 8 Oct and exports that day: the file holds 2 rows."]
      - id: 10
        body-contains: "The export drops the last sale of the day.\n\n## Verification\n\nA test with a sale at 18:59 fails today and passes after the fix.\n\n## Scope\n\nWriteRows in src/export/csv.go."
        body-lacks: "## Steps to reproduce"
        labels: [workline:to-refine, workline:proposed]
        comment-contains: ["**Proposes**: Add Need, Steps to reproduce and Validation to it (Need, Steps to reproduce and Validation as drafts for you to correct).", "**Steps to reproduce**\n\n1. Make 3 sales on 8 Oct, the last at 18:59."]
