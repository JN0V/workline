case: product-owner/unready-ticked-moves-back
about: "Moving a ready issue back to refine is always proposed, never done by the role; a person of the project ticks it, and the next run takes workline:ready off, puts workline:to-refine on and tells the issue why, with no agent (ADR-0032)."
given:
  repo: backlog
  forge:
    issues:
      - {id: 11, title: "Keep the last row in the CSV export", body: "Part of #9.", labels: [workline:ready], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 20
        title: "Backlog — product owner"
        body: "## Proposed\n\n- [x] Move #11 back to refine (workline:ready off, workline:to-refine on): #9 now asks for JSON. <!-- workline:proposal=11/unready -->\n"
        labels: []
        ticks: [{item: "Move #11 back to refine (workline:ready off, workline:to-refine on): #9 now asks for JSON. <!-- workline:proposal=11/unready -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\nproposed:\n  - issue: 11\n    act: unready\n    line: 'Move #11 back to refine (workline:ready off, workline:to-refine on): #9 now asks for JSON.'\n    proposal: {do: unready, issue: 11, why: '#9 now asks for JSON.'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 11, labels: [workline:to-refine], comment-contains: "Moved back to refine: #9 now asks for JSON."}
      - {id: 20, body-contains: "Moved #11 back to refine", body-lacks: "proposal=11/unready"}
