case: product-owner/code-named-is-given
about: The agent gets each file an issue names, whole, with the last commits that changed it, so an issue the code solved can be told; a path the commit does not hold is not given.
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "WriteRows in src/export/csv.go stops one row short; see also src/export/json.go.", labels: [], comments: ["```yaml\nsources: []\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  status: pass
  run-files:
    in/task.md: {contains: "Code it names, given below: src/export/csv.go."}
