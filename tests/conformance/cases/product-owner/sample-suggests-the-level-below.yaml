case: product-owner/sample-suggests-the-level-below
about: More than one in ten of the acts the product owner did alone at enterprising undone by a person suggests normal in the weekly sample; the setting is not changed.
given:
  repo: vouched
  config:
    roles:
      product-owner:
        settings: {autonomy: enterprising}
  forge:
    issues:
      - id: 5
        title: "Backlog — product owner"
        body: "What the product owner did."
        labels: []
        comments: ["```yaml\nundone:\n  - {issue: 21, act: rename, evidence: '#21 renamed back by a person'}\n  - {issue: 24, act: rename, evidence: '#24 renamed back by a person'}\nmeasure: {level: enterprising}\ndid:\n  - {issue: 20, act: rename, level: enterprising, day: \"2026-01-12\", line: 'Renamed #20'}\n  - {issue: 21, act: rename, level: enterprising, day: \"2026-01-13\", line: 'Renamed #21'}\n  - {issue: 22, act: rename, level: enterprising, day: \"2026-01-14\", line: 'Renamed #22'}\n  - {issue: 23, act: rename, level: enterprising, day: \"2026-01-15\", line: 'Renamed #23'}\n  - {issue: 24, act: rename, level: enterprising, day: \"2026-01-16\", line: 'Renamed #24'}\n  - {issue: 25, act: rename, level: enterprising, day: \"2026-01-17\", line: 'Renamed #25'}\n  - {issue: 26, act: rename, level: enterprising, day: \"2026-01-18\", line: 'Renamed #26'}\n  - {issue: 27, act: rename, level: enterprising, day: \"2026-01-12\", line: 'Renamed #27'}\n  - {issue: 28, act: rename, level: enterprising, day: \"2026-01-13\", line: 'Renamed #28'}\n  - {issue: 29, act: rename, level: enterprising, day: \"2026-01-14\", line: 'Renamed #29'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {sample: [--week, 2026-W03, --judge, none], then: apply}
expect:
  status: pass
  findings:
    - {rule: acts-suggest, message: "autonomy: normal"}
  forge:
    issues:
      - {id: 7, comment-contains: "**Suggested**: `autonomy: normal` — 2 of the 10 acts done alone at enterprising were undone (more than 10%). Set it in the project's settings if you agree; the sample never changes it."}
  files:
    .workline/config.yaml: {contains: "autonomy: enterprising"}
