case: product-owner/sources-a-module-folder
about: >
  #1410, the Kotlin trial's #24: an issue naming no code, the product
  owner named the module folders `core/timelapse` and
  `feature/timelapse` as its sources. A module's folder holds its build
  file; its code sits folders below, under `src/main/kotlin/<package>/`.
  Read again, it is given that code, both modules', not the build files
  alone.
given:
  repo: backlog
  setup:
    - |
      cp -R "$FIXTURES/code/traceglass/." .
      printf 'plugins { kotlin("jvm") }\n' > core/timelapse/build.gradle.kts
      printf 'plugins { kotlin("jvm") }\n' > feature/timelapse/build.gradle.kts
      git add . && git commit -qm 'feat: TraceGlass, reduced, from the Kotlin trial'
  forge:
    issues:
      - {id: 24, title: "The time-lapse counter runs on while the camera is off", body: "## Need\n\nWhile recording a time-lapse I want the counter to show the snapshots really taken.\n\n## Example\n\n1. Start a time-lapse, one snapshot every 5 seconds.\n2. Switch to another app for a minute, then come back.\n3. The counter reads 13, but only 2 snapshots were saved.\n", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: [core/timelapse, feature/timelapse]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: issue, target: {issue: 24}, ai: fake:proposes-nothing}
expect:
  status: pass
  agent-calls: 1
  run-files:
    in/task.md:
      contains:
        - "### `core/timelapse/src/main/kotlin/io/github/jn0v/traceglass/core/timelapse/SnapshotStorage.kt`"
        - "### `feature/timelapse/src/main/kotlin/io/github/jn0v/traceglass/feature/timelapse/FileSnapshotStorage.kt`"
    in/code-given:
      contains:
        - "core/timelapse/src/main/kotlin/io/github/jn0v/traceglass/core/timelapse/SnapshotStorage.kt"
        - "feature/timelapse/src/main/kotlin/io/github/jn0v/traceglass/feature/timelapse/FileSnapshotStorage.kt"
