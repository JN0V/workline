case: product-owner/depend-mode-per-level
about: "`depend` is off by default at every level (ADR-0038); a project turning it on to propose has it proposed on the issue, nothing written on the forge; the task says its mode, from the setting (ADR-0028)."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {autonomy: cautious, acts: {depend: {mode: propose}}}
  forge:
    dependencies: true
    issues:
      - {id: 12, title: "Quote commas in exported cells", body: "A comma splits a cell.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Keep the last row in the CSV export", body: "The export drops its last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:depend-one}
expect:
  status: pass
  run-files:
    in/task.md: {contains: "- depend: propose (setting)\n"}
  forge:
    issues:
      - {id: 12, blocked-by: [], body-lacks: "Blocked by", labels: [workline:proposed], comment-contains: "**Proposes**: Mark it as waiting on #13: ordered after, never offered first. Why: "}
