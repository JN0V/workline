case: product-owner/over-budget-reads-nothing-says-so
about: "One issue whose task alone is over the role's context budget — a title of 170,000 characters, its agent reading the code itself (ADR-0074) —: the agent is not asked, and the night's summary says so. It lists no issue as read, says no \"nothing to do\", and records nothing of the issue as read: it waits for a person, or a smaller task (#427)."
given:
  repo: backlog
  setup:
    - "awk 'BEGIN { printf \"s/@huge@/\"; for (i = 1; i <= 1700; i++) printf \"%099d \", i; print \"/\" }' > ../huge.sed && sed -i -f ../huge.sed \"$FORGE_FILE\""
  forge:
    issues:
      - {id: 9, title: "Huge @huge@", body: "Rows lost.", labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: "cmd:cat > /dev/null; echo '[]'", no-apply: true}
expect:
  status: pass
  agent-calls: 0
  summary: "judged, not applied (the agent was not asked: no issue read)"
  findings: [{rule: prompt-over-budget, message: "the agent was not asked"}]
  no-findings: [{rule: nothing-proposed}]
