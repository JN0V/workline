case: product-owner/task-gives-the-whole-body-and-every-answer
about: >
  A rewrite keeps only what it sees (#1331): the product owner rewrites
  a section whole, so the task gives the issue's body whole, never cut
  at 3000 characters, and every comment of a person who counts, never
  only the last five. Here a body of over 3000 characters ends on a
  person's answer written into the Scope, and Ann wrote seven comments,
  the first an answer the Scope must keep.
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "Sales counted"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nThe monthly report counts every sale.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n\n---\n\n## Verification\n\nA test counts a known day.\n\n## Scope\n\n- `src/export/csv.go`: rule 1 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 2 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 3 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 4 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 5 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 6 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 7 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 8 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 9 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 10 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 11 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 12 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 13 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 14 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 15 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 16 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 17 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 18 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 19 of the writer, kept as the spec says it, word for word.\n- `src/export/csv.go`: rule 20 of the writer, kept as the spec says it, word for word.\n- `sr