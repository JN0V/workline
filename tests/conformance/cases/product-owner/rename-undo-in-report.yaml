case: product-owner/rename-undo-in-report
about: The report says each rename with the title before it, to set it back.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "bug", body: "The export loses the last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:rename-nine}
expect:
  forge:
    issues:
      - {id: 10, title: "Backlog — product owner", body-contains: "Renamed #9 from \"bug\" to \"The CSV export drops the last row\": The title says nothing of the problem. Rename it back to undo."}
