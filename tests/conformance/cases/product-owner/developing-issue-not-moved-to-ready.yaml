case: product-owner/developing-issue-not-moved-to-ready
about: >
  Given an issue labelled `workline:developing` whose body holds its four
  sections, When the product owner runs, daily, twice here, and its agent
  proposes moving that issue to ready, Then the role does not move it to
  ready: no "Moved #9 to ready" is recorded at either run, and the labels
  read afterwards are `workline:developing` alone, neither
  `workline:ready` nor `workline:needs-tests` added.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "## Need\n\nA.\n\n## Verification\n\nB.\n\n## Validation\n\nC.\n\n## Scope\n\nD.", author: ann, insider: true, labels: [workline:developing],
         comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nbody: 000000000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:ready-nine, then: again}
expect:
  no-findings: [{rule: done, where: "#9", message: "Moved #9 to ready"}]
  forge:
    issues:
      - {id: 9, labels: [workline:developing]}
