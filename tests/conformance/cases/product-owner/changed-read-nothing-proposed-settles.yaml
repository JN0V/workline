case: product-owner/changed-read-nothing-proposed-settles
about: "A change the record holds whose every issue was read again with it, nothing proposed on them, needs no person: no box, it leaves the record, and the report says it once in a folded line; one with an issue not read keeps its box under To check (ADR-0032)."
given:
  repo: backlog
  forge:
    issues:
      - {id: 4, title: "Keep the last row", body: "The export drops its last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 5, title: "Sort the columns", body: "By name, then by type.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 6
        title: "Backlog — product owner"
        body: "An older report."
        labels: []
        comments: ["```yaml\nchanges:\n  - {issue: 4, path: ROADMAP.md, lines: 7 to 9, since: 2026-10-01, touched: [{issue: 4, how: import, read: true}]}\n  - {issue: 5, path: ROADMAP.md, lines: 10 to 11, since: 2026-10-01, touched: [{issue: 5, how: import}]}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 6, body-contains: "<details><summary>1 issue whose source changed was read again: nothing to change</summary>\n\n- #4 Keep the last row — `ROADMAP.md`, lines 7 to 9, which it was opened from, changed.\n", body-lacks: "proposal=changed-lines/4", comment-lacks: "issue: 4"}
      - {id: 6, body-contains: "- **1 change to check** (*To check*)"}
      - {id: 6, body-contains: "- [ ] `ROADMAP.md`, lines 10 to 11, which #5 Sort the columns was opened from, changed (found 2026-10-01): check #5 against them, then tick. <!-- workline:proposal=changed-lines/5 -->", comment-contains: "issue: 5"}
