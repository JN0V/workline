case: product-owner/proposal-labelled-and-said-on-the-issue
about: An issue the role completes with drafts gets the label workline:proposed, created once, and its one comment — the state comment, edited in place — says what the role did and what it wants from a person, the state folded under it; no report issue is opened (ADR-0038).
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-nine-again}
expect:
  findings: [{rule: done, where: "#9", message: "Refined #9: Need (draft), Verification, Validation (draft), Scope."}]
  forge:
    issues:
      - {id: 9, labels: [workline:to-refine, workline:draft, workline:proposed], comments: 1}
      - {id: 9, comment-contains: ["Refined #9: Need (draft), Verification, Validation (draft), Scope.", "**Your answer**: label `workline:accepted` to agree", "take `workline:proposed` off for not now", "<details><summary>What workline knows of this issue, edited by the engine</summary>", "label: workline:proposed"]}
      - {id: 10, absent: true}
    labels:
      - {id: 1, title: workline:accepted}
      - {id: 2, title: workline:proposed}
