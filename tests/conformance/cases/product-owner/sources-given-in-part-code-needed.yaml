case: product-owner/sources-given-in-part-code-needed
about: >
  #1440, the Kotlin trial's #75: a complete bug, its Scope naming its
  file, given to the product owner only in part, past code-bytes-max.
  It names that file in `sources`, then `ready`: the file is given whole
  at the next run, `needs-code` as before.
given:
  repo: backlog
  setup:
    - |
      cp -R "$FIXTURES/code/traceglass/." .
      git add . && git commit -qm 'feat: TraceGlass, reduced, from the Kotlin trial'
  # The reviewer reads the spec before ready, as on the trial: its
  # ready waits, spec-not-reviewed.
  config:
    roles: {product-owner: {settings: {code-bytes-max: 600}}}
    routing:
      events: {issue: [product-owner, reviewer]}
  forge:
    issues:
      - {id: 75, title: "A session that cannot be written is lost silently", body: "## Need\n\nA person whose session file cannot be written loses the session silently.\n\n## Steps to reproduce\n\n1. Fill the disk.\n2. Save a session.\n\n- **Expected:** an error is said.\n- **Actual:** nothing is said.\n- **Version:** 1.4.0.\n\n## Validation\n\n- **Disk full:** Given a full disk, When a session is saved, Then an error is said.\n\n---\n\n## Scope\n\n- `feature/timelapse/src/main/kotlin/io/github/jn0v/traceglass/feature/timelapse/FileSnapshotStorage.kt`: `saveSnapshot`.\n", author: ann, insider: true, labels: [bug, workline:to-refine]}
run: {role: product-owner, event: issue, target: {issue: 75}, ai: "fake:sources-in-part-then-ready"}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: needs-code, where: "#75"}
