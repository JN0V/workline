case: product-owner/priority-unset-reads-worklines-labels
about: "With priority and effort unset, the default, nothing is detected nor said: the role reads and writes workline's own labels, workline:priority/1 to /4, as before ADR-0040's step 2, though the project has its own P0 to P3."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {moved-percent-max: 100, acts: {order: {mode: act}}}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Slow export", body: "The export is slow.", labels: [P1], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 20, title: "Export to JSON", body: "Add a JSON export.", labels: [P0], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:order-two}
expect:
  findings:
    - {rule: done, where: "#9", message: "Set #9's priority to 1 (was"}
  no-findings:
    - {rule: values-where}
    - {rule: priority-elsewhere, where: "#10"}
  forge:
    issues:
      - {id: 9, labels: [workline:priority/1]}
      - {id: 10, labels: [P1, workline:priority/2]}
