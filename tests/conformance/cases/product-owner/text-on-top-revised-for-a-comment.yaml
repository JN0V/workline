case: product-owner/text-on-top-revised-for-a-comment
about: "A text on top the role rewrote in plain words, under an earlier engine, is its own until a person edits it (ADR-0039, amended): when a person of the project comments on what it proposed, the agent is told its Need draft and that text are among what it may rewrite, and the new Need is written, the text taken from the top; with no comment, the Need it drafted is kept and nothing is written."
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "WriteRows stops one row short"
        author: "github-actions[bot]"
        labels: [needs-triage, workline:proposed]
        body: "Exporting a CSV file drops its last row.\n\nFound by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#00000000 -->\n\n## Need\n\n<!-- workline:draft -->\n\nCSV rows are lost."
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nplain: 8caaa932b175\nlabel: workline:proposed\nheard: 0\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "Say which export: the daily one.", author: bob, insider: true}
      - id: 10
        title: "WriteRows again"
        author: "github-actions[bot]"
        labels: [needs-triage]
        body: "Exporting a CSV file drops its last row.\n\nFound by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#11111111 -->\n\n## Need\n\n<!-- workline:draft -->\n\nCSV rows are lost."
        comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\nplain: 8caaa932b175\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: fake:revise-text-on-top}
expect:
  findings:
    - {rule: done, where: "#9", message: "Refined #9: Need (draft, from the text on top)."}
    - {rule: nothing-to-refine, where: "#10"}
  run-files:
    in/task.md: {contains: ["revision 1 of 2", "the sections that are still yours (Need, its text on top, a role's: taken from the top into the `need` you give)"]}
  forge:
    issues:
      - id: 9
        body-contains: "Found by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#00000000 -->\n\n## Need\n\n<!-- workline:draft -->\n\nExporting the daily CSV file drops its last row: 3 sales give a file of 2 rows."
        body-lacks: "CSV rows are lost"
        reactions: {"2": [eyes]}
        comment-contains: ["@bob, read (revision 1 of 2): rewrote Need in place, its text on top taken into the Need.", "- Added: —. Changed: Need (draft). Rewrote: the text on top as the Need, in plain words.", "revisions: 1"]
      - {id: 9, body-lacks: "Exporting a CSV file drops its last row.\n\nFound by"}
      - {id: 10, body-contains: "Exporting a CSV file drops its last row.\n\nFound by"}
