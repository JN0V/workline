case: product-owner/feature-ready-held-by-an-earlier-question
about: >
  A product choice is never settled by silence (ADR-0060, amended),
  whatever run asked it: on a feature whose sections are the person's,
  the role's question of an earlier run still unanswered, the agent
  woken later gives a `ready`. Not moved, said why: the feature waits
  in refine for the person's answer, no assumption written.
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine, enhancement]
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: Should `--verbose=false` print the plain line, as `--short` does?\n\n<!-- workline:product-owner/ask -->", created: "2026-10-01T23:50:00Z"}
run: {role: product-owner, event: issue, target: {issue: 9}, ai: fake:ready-nine}
expect:
  status: pass
  findings:
    - {rule: not-ready, where: "#9", message: "not moved to ready: #9's question waits for a person's answer"}
  forge:
    issues:
      - id: 9
        labels: [workline:to-refine, enhancement]
        body-lacks: "## Assumptions"
