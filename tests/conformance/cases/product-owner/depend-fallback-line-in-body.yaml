case: product-owner/depend-fallback-line-in-body
about: On GitLab Free, which refuses `is_blocked_by` for its license, a `depend` act is a line in the issue's body, under the engine's marker, after its text; its state takes the body's digest, so the engine's own line is not read as a person's change (ADR-0028).
given:
  repo: backlog
  forge:
    members:
      - {username: ann, access_level: 30}
    issues:
      - {id: 12, title: "Quote commas in exported cells", body: "A comma splits a cell.", author: ann, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Keep the last row in the CSV export", body: "The export drops its last row.", author: ann, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:depend-one, forge: gitlab}
expect:
  status: pass
  forge:
    issues:
      - {id: 12, body-contains: "A comma splits a cell.\n\nBlocked by #13. <!-- workline:blocked-by -->", comment-contains: "body: "}
