      - {id: 9, title: "WriteRows stops one row short", author: "github-actions[bot]", labels: [needs-triage], body: "Exports lose their last row: 3 sales give a file of 2 rows.\n\nFound by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->", comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\nwrote:\n    Description: 4c3b048e0c8a\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
