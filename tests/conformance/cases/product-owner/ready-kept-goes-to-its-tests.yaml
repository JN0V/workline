case: product-owner/ready-kept-goes-to-its-tests
about: >
  A ready issue from before the line of states, re-checked by the product
  owner (#788): kept, with named scenarios and no Draft of its tests, it
  goes to its tests, workline:needs-tests; the agent is told so. Stale, it
  goes back to refine, its reason on the issue (ADR-0059, amended). One whose tester's Draft is
  open keeps its labels, the agent's ready on it doing nothing.
given:
  repo: backlog
  config:
    routing: {events: {schedule: [product-owner], issue: [tester, developer]}}
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "## Need\n\nThe monthly report counts every sale.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n\n## Scope\n\nsrc/export/csv.go", author: ann, insider: true, labels: [workline:ready], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Rows lost in June", body: "## Need\n\nThe June report counts every sale.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\n- **A June day:** Given a June day of three sales, When Ann opens it, Then she counts three.\n\n## Scope\n\nsrc/export/csv.go", author: ann, insider: true, labels: [workline:ready], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 11, title: "Last row lost", body: "## Need\n\nThe export keeps its last row.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\n- **Last row:** Given three rows, When Ann exports them, Then she reads three.\n\n## Scope\n\nsrc/export/csv.go", author: ann, insider: true, labels: [workline:ready], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
    merge-requests:
      - {id: 1, branch: workline/tester/issue-10, draft: true, title: "test: the acceptance tests of #10"}
run: {role: product-owner, event: schedule, ai: fake:ready-kept-to-tests}
expect:
  run-files:
    in/task.md:
      contains: ["#9", "Its tests: ready from before the line of states, no Draft of its tests"]
  forge:
    issues:
      - {id: 9, labels: [workline:needs-tests]}
      - {id: 10, labels: [workline:ready]}
      - {id: 11, labels: [workline:to-refine], comment-contains: "Moved #11 back to refine (workline:ready off, workline:to-refine on; put workline:ready back to undo): stale: the export already keeps the last row"}
