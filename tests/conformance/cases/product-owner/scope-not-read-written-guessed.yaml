case: product-owner/scope-not-read-written-guessed
about: >
  Bugs read by an agent that read no code (a fake, as a cmd: agent):
  its refine writes a Scope from code it did not read (#970). The
  engine writes that Scope with a line `Guessed:`, which holds no other
  issue back, and says so (ADR-0074); never left out for a read again.
  The rest of #9's refine is written. #10's refine holds its Scope
  alone: it is written too.
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses the last one.\n\n## Steps to reproduce\n\n1. Export three rows.\n- **Expected:** three rows.\n- **Actual:** two.\n"
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 10
        title: "First row lost"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses the first one.\n\n## Steps to reproduce\n\n1. Export three rows.\n- **Expected:** three rows.\n- **Actual:** two.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n\n## Verification\n\n- A test exports three rows.\n"
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: fake:refine-scope-no-code}
expect:
  findings:
    - {rule: input-cut, message: "the product owner's agent does not read the repository itself (claude does)"}
    - {rule: scope-unread, where: "#9", message: "its Scope names `src/export`, code its agent did not read in this run: marked `Guessed:`"}
    - {rule: scope-unread, where: "#10", message: "marked `Guessed:`"}
  no-findings: [{rule: nothing-to-refine, where: "#10"}]
  forge:
    issues:
      - {id: 9, body-contains: ["## Validation", "## Scope\n\n`src/export`: the CSV export, guessed from the folders.\n\nGuessed: written from code its writer did not read."], body-lacks: "## Verification"}
      - {id: 10, body-contains: "## Scope\n\n`src/export`: the CSV export, guessed from the folders.\n\nGuessed: written from code its writer did not read."}
