case: product-owner/outsider-proposal-not-repeated
about: A text proposed to an outsider, not answered since, is not proposed again — nothing more is written on the issue before an answer.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: zed, insider: false, labels: [workline:to-refine], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->", "@zed, the product owner read this issue.\n\n<!-- workline:product-owner/proposal=1 -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-an-outsider}
expect:
  findings: [{rule: already-proposed, where: "#9"}]
  forge:
    issues:
      - {id: 9, comments: 2, body-lacks: "## Need"}
