case: product-owner/code-named-in-a-comment
about: The code a person names in a comment — the answer to the role's question — is given as the issue's, as the code its body names; the engine's own comments name none.
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "It is slow", body: "Sometimes things are slow.", labels: [], comments: ["```yaml\nsources: []\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->", "@ann, to refine this issue: what is slow?\n\n<!-- workline:product-owner/ask -->", "The export: WriteRows in src/export/csv.go takes 8 seconds."]}
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  status: pass
  run-files:
    in/task.md: {contains: "Code it names, given below: src/export/csv.go.\n"}
