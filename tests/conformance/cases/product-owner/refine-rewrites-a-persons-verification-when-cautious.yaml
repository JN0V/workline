case: product-owner/refine-rewrites-a-persons-verification-when-cautious
about: "At every level (ADR-0060): with the product owner at autonomy cautious, a finding in a Verification a person wrote is still rewritten in the body, with no proposal waiting on a person; only a Need or Validation draft would be proposed at that level."
given:
  repo: backlog
  config:
    routing:
      events: {schedule: [product-owner, reviewer]}
    roles:
      product-owner:
        settings: {autonomy: cautious}
  forge:
    issues:
      - id: 9
        title: Rows lost
        body: "## Need\n\nThe monthly report counts every sale.\n\n## Validation\n\n- **A known day:** Given a day of three sales, When Ann opens it, Then she counts three.\n\n---\n\n## Verification\n\nSessions feel right to the users.\n\n## Scope\n\nsrc/export/csv.go"
        author: ann
        insider: true
        labels: [workline:to-refine]
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nbody: efbae4cec0e6\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline reviewer**, its spec.\n\n<!-- workline:spec-review body=efbae4cec0e6 round=1 open=1 in=Verification -->\n\n<!-- workline:sticky=reviewer/spec -->"
run: {role: product-owner, event: schedule, ai: fake:refine-persons-verification}
expect:
  no-findings: [{rule: drafts-proposed}]
  forge:
    issues:
      - id: 9
        labels: [workline:to-refine]
        body-contains: "## Verification\n\nA test writes three rows and reads three lines back.\n\n## Scope"
        body-lacks: "Sessions feel right"
        comment-contains: ["Changed: Verification."]
        comment-lacks: ["to refine this issue", "proposed:"]
