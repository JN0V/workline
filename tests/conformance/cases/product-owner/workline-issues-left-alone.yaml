case: product-owner/workline-issues-left-alone
about: "Issues workline keeps for its own work — the weekly sample, the documentalist's \"Docs waiting for a person\" — are neither read nor listed as the backlog's: nothing is asked, drafted nor proposed there, even when the agent names them, and the role's comment an older engine left there is not touched (#429)."
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 20, title: "workline: the weekly sample of every role's acts", body: "One comment a week: the acts drawn.", author: "workline-jn0v[bot]", labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 21, title: "Docs waiting for a person", body: "The docs the documentalist could not judge.\n\nKept up to date by the documentalist role.", author: "workline-jn0v[bot]", labels: [], comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:ask-workline-and-bots}
expect:
  status: pass
  findings:
    - {rule: workline-issue, where: "#20"}
    - {rule: workline-issue, where: "#21"}
  no-findings: [{rule: done, where: "#20"}, {rule: done, where: "#21"}, {rule: proposed, where: "#21"}]
  run-files:
    in/task.md: {not-contains: ["weekly sample", "Docs waiting for a person"]}
  forge:
    issues:
      - {id: 20, comments: 1, posted: 0, labels: [], comment-lacks: "to refine this issue"}
      - {id: 21, comments: 1, posted: 0, labels: [], body-lacks: "## Need"}
