case: product-owner/split-capped
about: Splits are capped per run — past acts.split.max, a split is proposed in the report, nothing opened for it.
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {acts: {split: {mode: act, max: 1}}}
  forge:
    issues:
      - {id: 9, title: "Export fixes", body: "Rows lost, commas split cells.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "More formats", body: "JSON and XML.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:split-nine-and-ten}
expect:
  findings: [{rule: act-cap, where: "#10"}]
  forge:
    issues:
      - {id: 11, title: "Keep the last row"}
      - {id: 12, title: "Quote commas"}
      - {id: 13, title: "Backlog — product owner", body-contains: "**#10 More formats**\n\n- [ ] Split it into 2 issues, each linked to it: \"Export as JSON\", \"Export as XML\"."}
      - {id: 14, absent: true}
