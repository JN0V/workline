case: product-owner/sources-outside-the-code-given
about: >
  A bug whose text names a doc, not the code it is about (#980): the run
  gives that doc, and the product owner names the export's folder, which
  it was not shown, no line quoted. The sources are kept: the issue is
  read again with that code. One whose text names a file in the folder
  it names was given that code: its sources still quote a line of it,
  as do sources mixing code shown and code not shown.
given:
  repo: backlog-documented
  forge:
    issues:
      - id: 9
        title: "Rows lost"
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses the last one, though docs/export.md says each row is written.\n\n## Steps to reproduce\n\n1. Export three rows.\n- **Expected:** three rows.\n- **Actual:** two.\n\n## Validation\n\n- **Three rows:** Given three rows, When I export them, Then the file holds three.\n"
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 12
        title: "Rows lost in src/export/csv.go"
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses one, in src/export/csv.go.\n"
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 13
        title: "Rows lost, docs/export.md says otherwise"
        labels: [workline:to-refine]
        body: "## Need\n\nA user exporting rows loses one, though docs/export.md says each row is written.\n"
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
run: {role: product-owner, event: schedule, ai: fake:sources-outside-the-code-given}
expect:
  findings:
    - {rule: done, where: "#9", message: "Named the code #9 is about: src/export."}
    - {rule: no-quote, where: "#12"}
    - {rule: no-quote, where: "#13"}
  no-findings: [{rule: no-quote, where: "#9"}]
  run-files:
    in/task.md: {contains: "### `docs/export.md`"}
  forge:
    issues:
      - {id: 9, comment-contains: "sources: [src/export]\n"}
