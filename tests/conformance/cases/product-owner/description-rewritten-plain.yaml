case: product-owner/description-rewritten-plain
about: "Each thing said once (ADR-0039, amended): the text above an issue's sections that a role wrote — an item imported from a file, another role's finding — and no person edited becomes the Need draft the agent gives, taken from the top; the engine tells it is the role's from what it recorded — the digest kept at opening, an import's key, an earlier engine's rewrite —, keeps its own lines there — where the issue comes from, its hidden markers —, and says it in one line, also beside a question. A person's text on top — an issue a person opened, an import a person edited — is the Need: a Need draft saying it again is not written, said. A description given apart, as an earlier engine asked, is left out."
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Five whys", author: ann, insider: true, labels: [], body: "- **Five whys as a shared skill.** Root cause before any countermeasure in the\n  defect ledger; used by reviewer, developer, tester, architect.\n\nOpened from `docs/BACKLOG.md`, lines 10 to 11 by the product-owner role.\n\n<!-- workline:import=docs/BACKLOG.md:e17512fffb50 -->", comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 8, title: "WriteRows stops one row short", author: "github-actions[bot]", labels: [needs-triage], body: "The loop ends one row early: `for i := 0; i < len(rows)-1; i++` skips the last index.\n\nFound by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#00000000 -->", comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\nwrote:\n    Description: cce12975b3bc\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Faster export", author: ann, insider: true, labels: [], body: "- **Faster export.** The export takes too long: 9 minutes for 1.2 GB.\n\nOpened from `docs/BACKLOG.md`, lines 20 to 20 by the product-owner role.\n\n<!-- workline:import=docs/BACKLOG.md:44092247e34e -->", comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 11, title: "Rows lost", author: ann, insider: true, labels: [], body: "Rows lost.", comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row", author: ann, insider: true, labels: [], body: "Exports lose their last row: a sale of the day is missing.\n\nOpened from `docs/BACKLOG.md`, lines 30 to 30 by the product-owner role.\n\n<!-- workline:import=docs/BACKLOG.md:0123456789ab -->", comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\nplain: b22745c863f8\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Cache", author: ann, insider: true, labels: [], body: "- **Cache.** Keep a cache of the parsed files.\n\nOpened from `docs/BACKLOG.md`, lines 40 to 40 by the product-owner role.\n\n<!-- workline:import=docs/BACKLOG.md:b601a6fea153 -->", comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:description-plain}
expect:
  findings:
    - {rule: done, where: "#7", message: "Refined #7: Need (draft, from the text on top)."}
    - {rule: done, where: "#8", message: "Refined #8: Need (draft, from the text on top), Scope."}
    - {rule: repeated, where: "#10", message: "its Need draft was not written: 100% of its words are said above it already, past 40 (repeated-percent-max)"}
    - {rule: repeated, where: "#11", message: "its Need draft was not written: 100% of its words"}
    - {rule: done, where: "#12", message: "Refined #12: Need (draft, from the text on top)."}
    - {rule: description-kept, where: "#13", message: "its description is left as it is: a role's text on top is taken into the Need it drafts, never rewritten apart"}
  run-files:
    in/task.md: {contains: ["## #7 Five whys\n\nOpened by: ann, of the project\nDescription: the text above its sections is a role's, and no person edited it — give it as the `need` draft, rewritten in plain words: the engine takes it from the top, its Need said once\nSections: none; missing: Need, Verification, Validation, Scope", "## #11 Rows lost\n\nOpened by: ann, of the project\nSections: Need (the text on top, a person's); missing: Verification, Validation, Scope", "## #12 Last row\n\nOpened by: ann, of the project\nDescription: the text above its sections is a role's"]}
  forge:
    issues:
      - id: 7
        body-contains: "Opened from `docs/BACKLOG.md`, lines 10 to 11 by the product-owner role.\n\n<!-- workline:import=docs/BACKLOG.md:e17512fffb50 -->\n\n## Need\n\n<!-- workline:draft -->\n\nWhen a defect is found, the team fixes what it sees, not why it happened, and the same defect comes back."
        body-lacks: "countermeasure"
        comment-contains: ["- Added: Need (draft). Changed: —. Rewrote: the text on top as the Need, in plain words. See the issue's edit history.", "- Asked the reporter a question, [in this comment]", "@ann, to refine this issue: Which defect came back"]
        comment-lacks: "plain: "
      - id: 8
        body-contains: "Found by the reviewer role while reviewing abc1234, outside that change.\n\n<!-- workline:opened-by=reviewer -->\n\n<!-- workline:issue=src/export/csv.go#00000000 -->\n\n## Need\n\n<!-- workline:draft -->\n\nExporting a CSV file drops its last row: 3 sales give a file of 2 rows.\n\n---\n\n## Scope\n\nWriteRows in src/export/csv.go."
        body-lacks: "The loop ends one row early"
      - {id: 10, body-contains: "- **Faster export.** The export takes too long: 9 minutes for 1.2 GB.", body-lacks: "## Need"}
      - {id: 11, body-contains: "Rows lost.", body-lacks: "## Need"}
      - id: 12
        body-contains: "Opened from `docs/BACKLOG.md`, lines 30 to 30 by the product-owner role.\n\n<!-- workline:import=docs/BACKLOG.md:0123456789ab -->\n\n## Need\n\n<!-- workline:draft -->\n\nThe export loses the last row of the day."
        body-lacks: "a sale of the day is missing"
      - {id: 13, body-contains: "- **Cache.** Keep a cache of the parsed files."}
