case: product-owner/sample-without-a-report-draws-no-acts
about: A project whose issues keep no act of the product owner's gets nothing of it in the weekly sample — no issue of its own, no level said — and the sample of every role's acts is written as before.
given:
  repo: vouched
  forge:
    issues:
      - {id: 3, title: "Rows lost", body: "Some rows are lost.", labels: []}
run: {sample: [--week, 2026-W03, --judge, none], then: apply}
expect:
  status: pass
  no-findings:
    - {rule: acts-sample}
  forge:
    issues:
      - {id: 4, title: "workline: the weekly sample of every role's acts", comments: 2, comment-contains: "2026-W03", comment-lacks: "The product owner's level"}
      - {id: 5, absent: true}
