case: product-owner/slipped-without-a-milestone-proposed
about: An issue whose milestone is released, with no open milestone left to move it to, is proposed on the issue for a person to place, and left where it is.
given:
  repo: backlog
  config:
    roles: {product-owner: {settings: {acts: {milestone: {mode: act}}}}}
  setup: ["git tag v1.0.0"]
  forge:
    milestones: [v1.0.0]
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", milestone: v1.0.0, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  forge:
    issues:
      - {id: 9, milestone: v1.0.0}
      - {id: 9, labels: [workline:proposed], comment-contains: "**Proposes**: Move #9 out of the milestone \"v1.0.0\""}
