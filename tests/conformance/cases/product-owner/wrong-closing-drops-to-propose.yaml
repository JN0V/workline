case: product-owner/wrong-closing-drops-to-propose
about: An issue it closed, open again, was a wrong closing; that kind of act goes back to propose whatever the settings say, and the report says so.
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 9, title: "Rows lost on Windows", body: "Reopened: not the same bug.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row missing in CSV", body: "In my CSV export the last row is missing.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 13
        title: "Backlog — product owner"
        body: "What the product owner did."
        labels: []
        comments: ["```yaml\nclosed:\n  - {issue: 9, act: close-duplicate}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: fake:close-duplicate}
expect:
  findings: [{rule: wrong-closing, where: "#9"}]
  forge:
    issues:
      - {id: 12, closed: false, comments: 1}
      - {id: 13, body-contains: "close-duplicate", comment-contains: "propose: [close-duplicate]"}
