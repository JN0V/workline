case: product-owner/order-without-state-dropped
about: An issue the engine has no state of yet is not ordered; it gets its state, and is ordered from the next run.
given:
  repo: backlog
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row missing", body: "The last row is missing.", labels: [], comments: []}
run: {role: product-owner, event: schedule, ai: fake:order-without-state}
expect:
  findings: [{rule: no-state, where: "#12"}]
  forge:
    issues:
      - {id: 12, labels: [], comments: 1, comment-contains: "<!-- workline:sticky=product-owner/state -->", comment-lacks: "priority:"}
