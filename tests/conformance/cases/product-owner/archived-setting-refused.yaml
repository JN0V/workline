case: product-owner/archived-setting-refused
about: "`archived` is a list of file paths or globs: anything else stops the run, never read as no file archived (principle 12)."
given:
  repo: backlog
  config:
    roles:
      product-owner:
        settings: {archived: docs/BACKLOG.md}
  forge:
    issues:
      - {id: 13, title: "Keep the last row in the CSV export", body: "The export drops its last row.", labels: [workline:ready], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  status: block
  findings: [{rule: engine-error, message: "pre exited with code 1"}]
  agent-calls: 0
  forge:
    issues:
      - {id: 14, absent: true}
