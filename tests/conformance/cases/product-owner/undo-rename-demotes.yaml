case: product-owner/undo-rename-demotes
about: A title the role set, renamed back by a person to the one it had, is an act undone — found at the next run from the issue's state, with no agent — and renaming is proposed on that issue from then on (ADR-0038, amended); a priority the role set and nobody touched still stands.
given:
  repo: backlog
  config:
    roles: {product-owner: {settings: {acts: {rename: {mode: act}}}}}
  forge:
    issues:
      - {id: 9, title: "bug", body: "The export loses the last row.", author: ann, insider: true, labels: [workline:priority/1], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\ntitle: The CSV export drops the last row\npriority: 1\ndone:\n  - {act: rename, was: bug, set: The CSV export drops the last row, level: normal}\n  - {act: order, was: \"0\", set: \"1\", level: normal}\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  findings: [{rule: undone, where: "#9", message: "#9 renamed back to \"bug\" by a person; the role had set \"The CSV export drops the last row\""}]
  no-findings: [{rule: demoted, where: ""}]
  forge:
    issues:
      - {id: 9, comment-contains: ["undone:", "act: rename", "act: order\n      was: \"0\"\n      set: \"1\""]}
