case: product-owner/outsider-proposal-answered-not-applied
about: A text proposed to an outsider that its reporter answered since is not applied on the label workline:accepted — the answer may change it, and the agent reads it first; nothing is written in the body without one.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: zed, insider: false, labels: [workline:to-refine, workline:accepted], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\ncomments: 1\n```\n\n<!-- workline:sticky=product-owner/state -->", "@zed, the product owner read this issue.\n\n<details><summary>As the engine reads it</summary>\n\n```yaml\nneed: Every row exported.\nverification: A test writes three rows.\nvalidation: Zed opens a known day.\nscope: WriteRows in src/export/csv.go.\nsources: [src/export/csv.go]\n```\n</details>\n\n<!-- workline:product-owner/proposal=1 -->", "Not quite: only the JSON export loses rows."]}
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  no-findings: [{rule: nothing-to-refine}]
  forge:
    issues:
      - {id: 9, body-lacks: "## Need", labels: [workline:to-refine, workline:accepted]}
