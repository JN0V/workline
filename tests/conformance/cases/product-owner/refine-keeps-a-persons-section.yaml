case: product-owner/refine-keeps-a-persons-section
about: Refining never rewrites a section the body already has — a person's, or one the role wrote before; an act with nothing left to add is dropped.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.\n\n## Need\n\nMine: the monthly report.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Done", body: "## Need\n\nA.\n\n## Verification\n\nB.\n\n## Validation\n\nC.\n\n## Scope\n\nD.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-keeps-need}
expect:
  findings: [{rule: section-kept, where: "#9"}, {rule: nothing-to-refine, where: "#10"}]
  forge:
    issues:
      - {id: 9, body-contains: "## Need\n\nMine: the monthly report.\n\n## Scope\n\nWriteRows in src/export/csv.go."}
      - {id: 10, body-contains: "## Need\n\nA.\n\n## Verification", labels: []}
