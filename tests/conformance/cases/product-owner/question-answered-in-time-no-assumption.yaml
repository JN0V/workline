case: product-owner/question-answered-in-time-no-assumption
about: >
  Normal, an answer in time (ADR-0060): the reporter answered 3 h after
  the question, inside the 24 h delay. Their answer is read; no
  assumption is taken, and one the agent writes is dropped.
given:
  repo: backlog
  forge:
    issues:
      - id: 9
        title: "workline version --verbose=false"
        author: ann
        insider: true
        labels: [workline:to-refine]
        body: "## Need\n\nWhen I run `workline version --verbose=false`, I want the plain line, so my scripts read it.\n\n## Validation\n\n- **Plain line:** Given workline installed, When I run `workline version --verbose=false`, Then it prints one line.\n\n---\n\n## Verification\n\nA test runs the command and reads one line.\n\n## Scope\n\nsrc/export/csv.go"
        comments:
          - "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - {body: "@ann, to refine this issue: Should `--verbose=false` print the plain line, as `--short` does?\n\n<!-- workline:product-owner/ask -->", created: "2026-10-01T23:50:00Z"}
          - {body: "No: keep the verbose line, my scripts use `--short`.", author: ann, insider: true, created: "2026-10-02T02:50:00Z"}
run: {role: product-owner, event: schedule, ai: fake:assume-only-plain-line}
expect:
  status: pass
  findings: [{rule: assume-nothing-asked, where: "#9"}]
  run-files:
    in/task.md: {contains: "answered since: read the answer", not-contains: "Unanswered:"}
  forge:
    issues:
      - id: 9
        labels: [workline:to-refine]
        body-lacks: "## Assumptions"
        comment-lacks: "Assumption taken on #9"
