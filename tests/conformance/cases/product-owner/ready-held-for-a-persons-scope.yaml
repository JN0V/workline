case: product-owner/ready-held-for-a-persons-scope
about: >
  An issue whose Scope section names a file only a person changes, a CI
  workflow, is not readied whole: the line could build only part of it
  and close it. The engine holds the ready, saying to split that part
  into an issue of its own for a person, or to ask.
given:
  repo: backlog
  forge:
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.\n\n## Need\n\nThe monthly report counts every sale.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\nAnn opens a known day.\n\n## Scope\n\n- `src/export/csv.go`\n- `.github/workflows/ci.yml`: run the export test on push.", author: ann, insider: true, labels: [workline:to-refine], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:ready-nine}
expect:
  findings: [{rule: scope-a-persons, where: "#9", message: "`.github/workflows/ci.yml`"}]
  forge:
    issues:
      - {id: 9, labels: [workline:to-refine]}
