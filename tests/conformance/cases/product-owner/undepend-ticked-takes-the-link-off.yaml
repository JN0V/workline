case: product-owner/undepend-ticked-takes-the-link-off
about: A proposal to take off a link the role set, its blocker still open, ticked by a person of the project, is done at the next run with no agent; the record no longer keeps that link, so it is not read as a person undoing the role's act (ADR-0028, ADR-0025).
given:
  repo: backlog
  forge:
    dependencies: true
    issues:
      - {id: 12, title: "Quote commas in exported cells", body: "A comma splits a cell.", author: ann, insider: true, labels: [], blocked-by: [13], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 13, title: "Keep the last row in the CSV export", body: "The export drops its last row.", author: ann, insider: true, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - id: 20
        title: "Backlog — product owner"
        body: "## Proposed\n\n- [x] Take off the link the role set from #12 to #13: its need changed. <!-- workline:proposal=12/undepend -->\n"
        labels: []
        ticks: [{item: "Take off the link the role set from #12 to #13: its need changed. <!-- workline:proposal=12/undepend -->", done: true, author: dev, insider: true}]
        comments: ["```yaml\ndone:\n  - {issue: 12, act: depend, set: \"13\", level: normal}\nproposed:\n  - issue: 12\n    act: undepend\n    line: 'Take off the link the role set from #12 to #13: its need changed.'\n    proposal: {do: undepend, issue: 12, blocked-by: [13], why: 'its need changed.'}\n```\n\n<!-- workline:sticky=product-owner/acts -->"]
run: {role: product-owner, event: schedule, ai: none}
expect:
  agent-calls: 0
  no-findings: [{rule: undone}]
  forge:
    issues:
      - {id: 12, blocked-by: []}
      - {id: 20, body-contains: "- Took off the link the role set from #12 to #13: its need changed. Ticked by @dev.", body-lacks: "proposal=12/undepend"}
      - {id: 20, comment-lacks: "act: depend", body-lacks: "waits on #13"}
