case: product-owner/code-named-by-its-file-name
about: An issue naming a file by its name alone — `csv.go:5`, as a roadmap writes it — gets that file when one file of the commit has that name; a name two files share, or none, is not guessed.
given:
  repo: backlog
  setup:
    - "mkdir -p a b && echo x > a/util.go && echo y > b/util.go && git add a b && git commit -qm 'feat: two utils'"
  forge:
    issues:
      - {id: 7, title: "Export drops the last row", body: "- **File**: `csv.go:5`, and `util.go`, and `xml.go`.", labels: [], comments: ["```yaml\nsources: []\nconfirmed: 0000000\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:proposes-nothing}
expect:
  status: pass
  run-files:
    in/task.md: {contains: "Code it names, given below: src/export/csv.go.", not-contains: "util.go\n"}
