case: inspector/answer-not-read-said
about: >
  The agent's triage never reads: asked again once, then said. The new
  findings stand as the gates report them, asked again at the next push;
  the run apart passes, nothing posted.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      sed -i 's|^\tos.Remove("c.tmp")$|&\n\tos.Remove("d.tmp")|' clean.go && git commit -qam "feat: clean d too"
  env: {TRIAGE_BROKEN: "1"}
  forge: {merge-requests: [{id: 1, branch: change, labels: [], comments: []}]}
  config:
    routing: {events: {merge-request: [committer, "gate:merge", inspector]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run:
  route: merge-request
  warn-only: true
  gates-job: {env: {PATH: "$FIXTURES/bin:$PATH"}}
  input: {range: main..change}
  target: {merge-request: 1}
  ai: "cmd:sh $FIXTURES/agents/triage.sh"
expect:
  status: pass
  agent-calls: 2
  findings:
    - {rule: part-asked-again, where: triage}
    - {rule: triage-failed, level: warn, message: "the agent's triage did not read (invalid: "}
  no-findings: [{rule: triage}]
  forge: {merge-requests: [{id: 1, comments: 0}]}
