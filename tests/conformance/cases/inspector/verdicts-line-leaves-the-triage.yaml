case: inspector/verdicts-line-leaves-the-triage
about: >
  The verdict's line, split from the run apart (`--warn-apart`), never
  waits for the triage (ADR-0050): the inspector after the gate asks no
  agent there, and says where it reads.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      sed -i 's|^\tos.Remove("c.tmp")$|&\n\tos.Remove("d.tmp")|' clean.go && git commit -qam "feat: clean d too"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: [committer, "gate:merge", inspector]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 5}}]}}
run:
  route: merge-request
  warn-apart: true
  summary: true
  input: {range: main..change}
  ai: "cmd:sh $FIXTURES/agents/triage.sh"
expect:
  status: pass
  steps: [committer, "gate:merge", inspector]
  agent-calls: 0
  summary-file: ["the triage reads apart from the verdict, which never waits for it (ADR-0050): nothing asked in this run"]
