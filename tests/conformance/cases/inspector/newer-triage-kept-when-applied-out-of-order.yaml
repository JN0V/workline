case: inspector/newer-triage-kept-when-applied-out-of-order
about: >
  On GitLab, two applies waiting for the lock may start in any order
  (#598): push B's run, a later pipeline, is applied before push A's. The
  comment names the head and the pipeline its run read; A's apply, the
  older, keeps B's comment as it is and merges only its record into it.
  The comment shows B's triage; A's triage of the scratch file B removed
  stays in the record, and is not asked again if the finding comes back.
given:
  repo: linted
  env: {CI_PIPELINE_ID: "101", GITHUB_RUN_ID: ""}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - git checkout -q -b change
    - |
      sed -i 's|^\tos.Remove("c.tmp")$|&\n\tos.Remove("d.tmp")|' clean.go
      printf 'package main\n\nimport "os"\n\n// scratch writes a temporary file and removes it on the way out.\nfunc scratch() {\n\tf, _ := os.CreateTemp("", "scratch")\n\tdefer os.Remove(f.Name())\n}\n' > cleanup.go
      git add . && git commit -qm "feat: clean d too, and a scratch file" && git push -q origin change
  forge: {merge-requests: [{id: 1, branch: change, labels: [], comments: []}]}
  config:
    routing: {events: {merge-request: [committer, "gate:merge", inspector]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run:
  route: merge-request
  warn-only: true
  no-apply: true
  then: applied-out-of-order
  pushed:
    - |
      sed -i 's|^\tos.Remove("b.tmp")$|&\n\tos.Remove("e.tmp")|' clean.go && git rm -q cleanup.go && git commit -qam "feat: clean e too, no scratch file" && git push -q origin change
  gates-job: {env: {PATH: "$FIXTURES/bin:$PATH"}}
  input: {range: main..change}
  target: {merge-request: 1}
  ai: "cmd:sh $FIXTURES/agents/triage.sh"
expect:
  status: pass
  findings:
    - {rule: applied-after-a-newer-run, level: warn, message: "the comment holds a later run's text"}
  agent-calls: 2
  forge:
    merge-requests:
      - id: 1
        comments: 1
        comment-contains:
          - " run=102 -->"
          - "\"where\":\"cleanup.go:8\""
          - "\"where\":\"clean.go:11\""
        comment-lacks: [" run=101 -->"]
