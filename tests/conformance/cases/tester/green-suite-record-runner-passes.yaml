case: tester/green-suite-record-runner-passes
about: >
  A runner that writes its record of a suite only when the suite fails
  (PlatformIO's `native:<suite>`, red by an error). The tester froze its
  real tests alone; the code makes each pass, and no record is written:
  the green proof passes, nothing missing (#1325).
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}; s=$?; if [ $s -ne 0 ]; then sed -i 's|</testsuite>|<testcase classname=\"tests\" name=\"native:tests\"><error message=\"Program errored with 1 code\"/></testcase></testsuite>|' {report}; fi; exit $s"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests.test_mul_by_zero\",\"tests.test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  status: pass
  agent-calls: 0
  no-findings: [{rule: frozen-test-missing}, {rule: test-red-on-head}]
