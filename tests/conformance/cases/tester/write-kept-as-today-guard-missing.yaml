case: tester/write-kept-as-today-guard-missing
about: >
  A scenario kept as it is today, its reason naming a test the base does
  not hold, `tests.test_add_unchanged`: the Draft says plainly that no
  existing test was found to guard it, the name quoted; never the
  agent's claim of a guard (#1359).
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **Add unchanged:** Given the library, When I add 2 and 3, Then I get 5, as today.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-kept-as-today-unknown"}
expect:
  status: pass
  summary: "1 new test, red on the base"
  forge:
    merge-requests:
      - id: 1
        draft: true
        body-contains: ["kept as today: no existing test was found that checks it", "`tests.test_add_unchanged` named, in no test file of the base"]
        body-lacks: ["guarded by"]
