case: tester/write-kept-as-today-guard-test
about: >
  A scenario kept as it is today gets a guard: its test passes on the
  base, declared with the reason "kept as today", so the red proof
  takes it green there, frozen beside the red test. The Draft names it
  for its scenario in the Tests table, nothing left not tested; the
  issue is ready.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **Add unchanged:** Given the library, When I add 2 and 3, Then I get 5, as today.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-kept-as-today-guard"}
expect:
  status: pass
  summary: "2 new tests, red on the base but 1, a guard of a scenario kept as today, green there"
  agent-calls: 1
  pushed:
    workline/tester/issue-3:
      tests/test_add_unchanged.sh: "add 2 3"
  forge:
    issues:
      - {id: 3, labels: ["workline:ready"]}
    merge-requests:
      - id: 1
        draft: true
        body-contains: ["| Two by three | `tests.test_mul_two_by_three` |", "| Add unchanged | `tests.test_add_unchanged` |"]
        body-lacks: ["Not tested", "test-green-on-base"]
