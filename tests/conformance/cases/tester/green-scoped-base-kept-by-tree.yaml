case: tester/green-scoped-base-kept-by-tree
about: >
  Scoped to the tests' folders, the green proof reads the base's test
  ids back as the scoped run of the same tree found them (#1338): the
  command named with the folders the base holds, as the Draft's red
  proof ran it. Here the guard runs twice on the same pull request: the
  base runs once, the head twice, three runs, not four.
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
  config:
    roles: {tester: {settings: {test-command: "exit 3", test-paths: ["**/test_*.sh"],
      draft-command: "f=\"$(git rev-parse --git-common-dir)/../suite-runs.txt\"; echo $(( $(cat \"$f\" 2>/dev/null || echo 0) + 1 )) > \"$f\"; sh \"$FIXTURES/bin/run-folders\" {report} {packages}"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests.test_mul_by_zero\",\"tests.test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}, then: again}
expect:
  status: pass
  summary: "the tester's 2 tests green on the head"
  agent-calls: 0
  findings: [{rule: proof-scope, level: info, where: draft-command, message: "the folders holding the tester's tests alone, ./tests:"}]
  no-findings: [{rule: test-flaky}, {rule: test-red-on-head}]
  files:
    suite-runs.txt: {contains: ["3"], lacks: ["4"]}
