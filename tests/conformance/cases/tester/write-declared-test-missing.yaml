case: tester/write-declared-test-missing
about: >
  A declared test missing (ADR-0065, change 4): an id found neither in
  the report among the new tests nor in the test files written goes the
  objection's way. The tester's agent is asked again once with it; the
  same answer again blocks, said on the issue, which the line blocks and
  the product owner reads again; no Draft opened.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-declared-missing"}
expect:
  status: block
  agent-calls: 2
  findings: [{rule: declared-test-missing, where: "By zero"}]
  run-files:
    out/feedback.md: {contains: ["tests.test_mul_nowhere"]}
  forge:
    merge-requests:
      - {id: 1, absent: true}
    issues:
      - id: 3
        comment-contains: ["wrote no tests for this issue this run", "tests.test_mul_nowhere"]
