case: tester/objection-own-reply-by-app-not-answered-again
about: >
  The tester's own reply in an objection's thread, written by workline's
  GitHub App, is its own even when the forge names the App on its
  comments alone, not on its replies in a thread: the App's login is
  learnt from its record on the merge request. The objection it said
  unreadable waits for the builder, never answered again (a loop of
  replies, 2026-10-31).
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  env: {WORKLINE_APP_ID: "42"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments:
          - {author: "workline-app[bot]", bot: true, app: "42", body: "The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"}
        threads:
          - {id: "7", path: tests/test_mul_two_by_three.sh, line: 4, author: builder, body: "workline:objection\n- test: tests/test_mul_two_by_three.sh\n- scenario: Three by two\n- kind: over-specified\n- why: too strict", replies: [{author: "workline-app[bot]", bot: true, body: "**Not answered**: its scenario \"Three by two\" is none of #3's.\n\n<!-- workline:tester-unreadable -->"}]}
run: {test: [answer, --merge-request, "1"], ai: "fake:tester-answer-kept"}
expect:
  status: pass
  agent-calls: 0
  summary: "no objection waits for the tester's answer"
  forge:
    merge-requests:
      - id: 1
        threads:
          - {path: tests/test_mul_two_by_three.sh, replies: 1}
