case: tester/write-made-up-name-twice-blocked
about: >
  In a shell project, asked once more with the error, the agent's test
  still calls `stub_two`, a name the code lacks and the issue never
  names (#1111): the tester asks no third time. The run blocks with the
  error, said on the issue, which waits for a person; no Draft opens.
given:
  repo: tested
  setup:
    - "sed -i 's|>/dev/null 2>&1|>/dev/null|' run-tests.sh && git commit -qam 'chore: the tests say their errors'"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env:
    ALWAYS: "1"
  config:
    roles:
      tester:
        settings:
          test-command: "sh run-tests.sh {report}"
          build-errors:
            - error: '^(?P<file>tests/[^\s:]+\.sh):(?: line)? \d+: (?P<message>.+)$'
              missing-name: ['^(?P<name>\w+): (?:command )?not found$']
              test-name: '(?m)^# test: (\S+)$'
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "cmd:sh $FIXTURES/agents/tester-mul-stub-once.sh"}
expect:
  status: block
  agent-calls: 2
  findings: [{rule: build-broken, where: tests/test_mul_two_by_three.sh}]
  not-pushed: [workline/tester/issue-3]
  forge:
    merge-requests:
      - {id: 1, absent: true}
    issues:
      - id: 3
        comment-contains: ["**The tester** wrote no tests for this issue this run", "the issue never names (stub_two)"]
