case: tester/product-owners-verification-rewritten
about: >
  The product owner's, from before ADR-0066 (#1261): a ready issue whose
  Verification the product owner wrote, as its state's `wrote` says,
  untouched since. It is no person's: the tester writes its own in its
  place, from its tests, as it would on an issue with none.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        author: ann
        insider: true
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nThe multiplication works well.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
        comments:
          - "```yaml\nsources: [lib.sh]\nconfirmed: d8c4dff\nwrote: {Verification: c69e85ed5e80}\n```\n\n<!-- workline:sticky=product-owner/state -->"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-two-scenarios"}
expect:
  status: pass
  agent-calls: 1
  run-files:
    in/task.md: {not-contains: ["The multiplication works well."]}
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        body-contains: "workline:verification=tester"
        body-lacks: "The multiplication works well."
        comment-contains: "the tester wrote its Verification from them"
