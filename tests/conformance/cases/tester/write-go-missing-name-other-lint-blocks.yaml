case: tester/write-go-missing-name-other-lint-blocks
about: >
  The same Go test, red by a missing name, is not formatted: beside the
  type-check's missing name, left out (#988), the project's format check
  fails on it. That finding still counts: the agent is asked once more,
  writes the same test, and the run blocks (tests-lint), no Draft.
given:
  repo: go-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    gates:
      lint:
        checks:
          - {id: golangci, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}
          - {id: gofmt, run: "test -z \"$(gofmt -l calc)\"", output: exit}
    routing: {events: {issue: [tester], merge-request: ["gate:lint"]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA Go test.\n\n## Scope\n\n- `calc/calc.go`: a `Mul` function beside `Add`.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-go-missing-name-unformatted"}
expect:
  status: block
  agent-calls: 2
  findings: [{rule: tests-lint, where: gofmt, message: "the gate lint"}]
  no-findings: [{rule: tests-lint, where: calc/calc.go:1}]
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - {id: 3, labels: ["workline:needs-tests"]}
