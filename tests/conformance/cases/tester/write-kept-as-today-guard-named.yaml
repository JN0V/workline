case: tester/write-kept-as-today-guard-named
about: >
  A scenario kept as it is today, its reason naming the existing test
  that guards it, `tests.test_add`: the base holds it (tests/test_add.sh),
  so the Draft keeps the reason as written (#1359).
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **Add unchanged:** Given the library, When I add 2 and 3, Then I get 5, as today.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-kept-as-today-named"}
expect:
  status: pass
  summary: "1 new test, red on the base"
  forge:
    merge-requests:
      - id: 1
        draft: true
        body-contains: ["Not tested", "Add unchanged: kept as today: guarded by `tests.test_add`."]
