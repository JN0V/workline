case: tester/write-build-broken-twice-blocked
about: >
  Asked once more with the judge's no, the agent answers with the same
  wrong call (#1048); the judge says no again: the tester asks no third
  time. The run blocks with its line, said on the issue; no Draft opens.
given:
  repo: go-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env:
    WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-red-no.yaml"
    ALWAYS: "1"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA Go test.\n\n## Scope\n\n- `calc/calc.go`: a `Mul` function beside `Add`.\n"
run: {test: [write, --issue, "3"], ai: "cmd:sh $FIXTURES/agents/tester-go-wrong-call-once.sh"}
expect:
  status: block
  agent-calls: 4
  findings: [{rule: build-broken, where: calc/mul_test.go}]
  not-pushed: [workline/tester/issue-3]
  forge:
    merge-requests:
      - {id: 1, absent: true}
    issues:
      - id: 3
        comment-contains: ["**The tester** wrote no tests for this issue this run", "the judge: the test calls a helper"]
