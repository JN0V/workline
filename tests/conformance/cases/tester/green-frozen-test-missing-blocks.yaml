case: tester/green-frozen-test-missing-blocks
about: >
  The green proof requires each test the tester froze, by the ids its
  record keeps, not the head's tests the base lacks (ADR-0065, change
  2). The developer's change edits the test runner so the
  multiply-by-zero test no longer runs; the other test is green, and a
  new test of the builder's runs. A report's id converges: no judge,
  the proof blocks, naming the missing test.
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
    - |
      cat > run-tests.sh <<'RUN'
      #!/bin/sh
      # The developer's edit: the multiply-by-zero test no longer runs.
      report=$1 failed=0
      mkdir -p "$(dirname "$report")"
      {
        echo '<?xml version="1.0" encoding="UTF-8"?>'
        echo '<testsuites><testsuite name="tests">'
        for t in tests/test_*.sh; do
          case $t in *by_zero*) continue ;; esac
          name=$(basename "$t" .sh)
          if sh "$t" >/dev/null 2>&1; then echo "<testcase classname=\"tests\" name=\"$name\"/>"
          else failed=1; echo "<testcase classname=\"tests\" name=\"$name\"><failure/></testcase>"; fi
        done
        echo '</testsuite></testsuites>'
      } > "$report"
      exit $failed
      RUN
      git commit -qam 'build: run fewer tests'
    - |
      cat > tests/test_mul_negative.sh <<'T'
      . ./lib.sh
      [ "$(mul -2 3)" = -6 ]
      T
      git add tests && git commit -qm 'test: multiply a negative number'
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests.test_mul_by_zero\",\"tests.test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  status: block
  agent-calls: 0
  findings: [{rule: frozen-test-missing, where: tests.test_mul_by_zero, message: "not in the head's reports"}]
  no-findings: [{rule: frozen-test-missing, where: tests.test_mul_two_by_three}, {rule: test-red-on-head}]
