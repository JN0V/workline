case: tester/picker-imports-as-declarations-typescript
about: >
  The tester gets what its test builds against (the C++ copy's #36). The
  code picker follows the imports of the Scope's file two steps deep,
  inside the project, and gives each file as its declarations: its
  interfaces, types and signatures, every body left out as `…`. A third
  step is a path only. The same rule for every language, here
  TypeScript, by braces, its relative imports without an extension.
given:
  repo: tested
  setup:
    - |
      cp -R "$FIXTURES/code/closure/typescript/." .
      git add . && git commit -qm 'feat: a shop in TypeScript'
    - |
      git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}", test-paths: ["test/**"]}}}
  forge:
    issues:
      - id: 3
        title: "A cart of two currencies adds them"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nA cart holding euros and dollars sums them as one: its total is wrong.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario.\n\n## Scope\n\n- `src/cart.ts`: `total()` refuses two currencies.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-two-scenarios"}
expect:
  agent-calls: 1
  run-files:
    in/task.md:
      contains:
        - "### `src/money.ts` (20 lines: its declarations, each body left out as `…`, included or imported by `src/cart.ts`)"
        - "export interface Amount {\n  cents: number;\n  unit: Code;\n}"
        - "export function plus(a: Amount, b: Amount): Amount { … }"
        - "### `src/currency.ts` (12 lines: its declarations, each body left out as `…`, included or imported by `src/money.ts`)"
        - "export function parse(text: string): Code { … }"
        - "`src/rates.ts` (included or imported)"
      not-contains: ["money body", "currency body", "rates body"]
