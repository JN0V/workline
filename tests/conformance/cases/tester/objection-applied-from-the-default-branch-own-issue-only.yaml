case: tester/objection-applied-from-the-default-branch-own-issue-only
about: >
  The tester's answer applied by a job of the default branch acts on the
  issue its Draft was opened for, nothing else: a run proposing a label on
  another issue is refused whole, nothing of it applied.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
        threads:
          - {id: "7", path: tests/test_mul_two_by_three.sh, line: 4, author: builder, body: "workline:objection\n- test: tests/test_mul_two_by_three.sh\n- scenario: Two by three\n- kind: over-specified\n- why: mul may print spaces around the number"}
run: {test: [answer, --merge-request, "1", --no-apply], ai: "fake:tester-answer-rewritten", then: resume, apply-from: {merge-request: 1, base: main, head: workline/tester/issue-3, intents: [{label: {issue: 9, add: ["workline:ready"]}}]}}
expect:
  status: block
  agent-calls: 1
  findings: [{rule: run-refused, level: block, message: "it proposes a label on another issue than its merge request's"}]
  not-pushed: [workline/tester/issue-3]
