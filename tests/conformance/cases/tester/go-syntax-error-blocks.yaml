case: tester/go-syntax-error-blocks
about: >
  The tests alone, in Go, with a syntax error: the package does not
  build, but not by a name the base lacks. That is no proof of red: the
  check blocks and names the error (build-broken).
given:
  repo: go-tested
  setup:
    - git checkout -q -b workline/issue-7
    - |
      printf 'package calc\n\nimport "testing"\n\nfunc TestMulTwoByThree(t *testing.T) {\n\tif Mul(2, 3) != 6 {\n\t\tt.Fatal("2 x 3 is not 6"\n\t}\n}\n' > calc/mul_test.go && git add . && git commit -qm "test: multiply"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
run: {test: [check, --base, main]}
expect:
  status: block
  summary: "not by a missing name"
  findings: [{rule: build-broken, where: calc/mul_test.go}]
