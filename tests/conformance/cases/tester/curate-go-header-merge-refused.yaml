case: tester/curate-go-header-merge-refused
about: >
  The curator's agent merges two Go tests by deleting lines only:
  TestAdd's closing brace and TestAddAgain's header, so TestAdd's body
  runs on into the other's. Every line left is the base's, yet TestAdd is
  not the base's declaration: a Go file is read by its declarations, and
  the merge is refused, nothing proposed.
given:
  repo: go-tested
  setup:
    - |
      cat >> calc/calc_test.go <<'GO'

      func TestAddAgain(t *testing.T) {
      	if Add(1, 1) != 2 {
      		t.Fatal("1 + 1 is not 2")
      	}
      }
      GO
      printf 'cover.out\njunit.xml\n' > .gitignore
      git add . && git commit -q -m "test: add again"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report} && GOFLAGS=-mod=mod GOTOOLCHAIN=local GOPROXY=off go test -count=1 -coverprofile=cover.out ./... >/dev/null", coverage-report: cover.out, curator-mutation-command: none}}}
  forge:
    merge-requests: []
run: {test: [curate], ai: "fake:tester-curate-go-header-merge"}
expect:
  status: block
  agent-calls: 1
  findings: [{rule: removal-writes-code, where: calc/calc_test.go}]
  forge:
    merge-requests:
      - {id: 1, absent: true}
