case: tester/kotlin-wrong-call-no-agent-waits
about: >
  The tests alone, in Kotlin, calling a function the base lacks and the
  base's `add` with too many arguments, no issue known: Gradle writes no
  report. The compiler's lines are read, not the build tool's last ones
  (#1192), and quoted: with no agent to judge them, red unproven, for a
  person (ADR-0065).
given:
  repo: kotlin-tested
  setup:
    - git checkout -q -b workline/issue-7
    - |
      cat > calc/src/test/kotlin/calc/MulTest.kt <<'KT'
      package calc

      import org.junit.jupiter.api.Test

      // gradle: e: {file}:10:15 Unresolved reference 'mul'.
      // gradle: e: {file}:10:35 Too many arguments for 'fun add(a: Int, b: Int): Int'.
      class MulTest {
          @Test
          fun `two by three`() {
              check(mul(2, 3) == add(3, 3, 0))
          }
      }
      KT
      git add . && git commit -qm "test: multiply"
  config:
    roles: {tester: {settings: {test-command: "sh \"$FIXTURES/bin/gradle-says\" {report}"}}}
run: {test: [check, --base, main]}
expect:
  status: human
  findings: [{rule: red-unproven, where: calc/src/test/kotlin/calc/MulTest.kt, message: "Too many arguments for 'fun add(a: Int, b: Int): Int'"}]
