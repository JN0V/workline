case: tester/write-existing-test-skipped-refused
about: >
  A line inserted in a test already there changes it, though every line
  of the file is kept: the tester adds a skip inside the base's test_add
  and a test of its own beside it. With the tests laid on the base,
  test_add, which ran there, is skipped: the run blocks,
  base-test-skipped, naming it, and no Draft is opened (#1259).
given:
  repo: python-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh -m {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA pytest test beside test_add.\n\n## Scope\n\n- `pkg/calc.py`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-py-skips-a-base-test"}
expect:
  status: block
  findings: [{rule: base-test-skipped, where: tests.test_calc.test_add}]
  no-findings: [{rule: test-line-changed}]
  forge:
    merge-requests:
      - {id: 1, absent: true}
