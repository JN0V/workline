case: tester/draft-not-opened-issue-keeps-its-state
about: >
  The tester's tests are proven, and its Draft does not open: the
  commit on its branch is refused (a person's pre-commit hook). The
  issue's move to ready is undone, its state kept, the reason said on
  it: no issue says ready with no Draft to start from (#1280).
given:
  repo: tested
  setup:
    - |
      mkdir -p .git/workline/issues && cat > .git/workline/issues/3.md <<'IS'
      ---
      title: "Multiply two numbers"
      state: open
      labels: ["workline:needs-tests"]
      ---

      ## Need

      When I total an order, I want to multiply a price by a count, so I need not add it up by hand.

      ## Validation

      - **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.
      - **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.

      ---

      ## Verification

      A test a scenario, in tests/.

      ## Scope

      - `lib.sh`: a `mul` function beside `add`.
      IS
    - "printf '#!/bin/sh\\nexit 1\\n' > .git/hooks/pre-commit && chmod +x .git/hooks/pre-commit"
  config:
    forge: local
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
run: {route: issue, target: {issue: 3}, ai: "fake:tester-two-scenarios"}
expect:
  status: block
  findings:
    - {rule: not-opened, where: "workline/tester/issue-3", message: "then applied what the role asks for that case: label, comment"}
  no-findings: [{rule: state-moved}]
  files:
    .git/workline/merge-requests/1.md: {exists: false}
    .git/workline/issues/3.md: {contains: ["workline:needs-tests", "**The tester** keeps this issue in tests.", "its Draft did not open: `git commit"], lacks: "workline:ready"}
