case: tester/green-stop-on-base-not-the-changes
about: >
  The same stop on the base is the base's, not the change's: the
  comment says it was the base's run that stopped, and asks the author
  to fix no finding (no test put back, no run again as the tester
  wrote it).
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
  config:
    roles: {tester: {settings: {test-command: "sleep 30; sh run-tests.sh {report}", suite-max-seconds: 1}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests.test_mul_by_zero\",\"tests.test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  agent-calls: 0
  forge:
    merge-requests:
      - id: 1
        comment-contains: ["on the base"]
        comment-lacks: ["Run it again as the tester wrote it", "Put it back", "test-red-on-head", "frozen-test-missing"]
