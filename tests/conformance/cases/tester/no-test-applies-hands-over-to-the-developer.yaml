case: tester/no-test-applies-hands-over-to-the-developer
about: >
  No test applies: the tester's agent writes no test and names no proof
  kind, and gives only its reason, the scenarios being ones no test can
  check. The tester does not send the issue back to the product owner nor
  fail: its one comment says that no acceptance test applies and why,
  quoting the agent's reason, and the issue goes on to the developer,
  ready. The comment is checked by its content, not by a count of the
  issue's comments, since the line also writes its own state record
  comment on every step it wakes.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-no-test-noted"}
expect:
  status: pass
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        comment-contains: ["no acceptance test applies", "neither the multiply step's code nor its tests"]
        comment-lacks: ["back to the product owner"]
