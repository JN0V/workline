case: tester/new-test-green-on-base-refused
about: >
  A new test that already passes on the base proves nothing new (ADR-0055,
  the proof, red first): it is refused, blocking, named by its id in the
  runner's JUnit report.
given:
  repo: tested
  setup:
    - git checkout -q -b change
    - |
      printf '. ./lib.sh\n[ "$(add 2 0)" = 2 ]\n' > tests/test_add_zero.sh && git add . && git commit -qm "test: add zero"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
run: {test: [check, --base, main]}
expect:
  status: block
  findings: [{rule: test-green-on-base, where: tests.test_add_zero, message: "passes on the base"}]
