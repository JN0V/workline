case: tester/green-draft-not-run
about: >
  While the tester's branch is a Draft, its tests are meant red: the
  green proof waits for the pull request marked ready; the frozen guard
  alone runs, and says the proof waits.
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 + $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  status: pass
  summary: "the green proof waits for the pull request marked ready"
  no-findings: [{rule: test-red-on-head}]
