case: tester/second-reader-no-objection-keeps-the-answer
about: >
  A sound test is kept: the tester's answer sends 601 bytes, the first
  one over the limit. Its second reader answers NO OBJECTION: the
  tester is not asked again, and its first answer is the Draft.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Refuse a long payload"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I send a payload, I want one over 600 bytes refused, so the line is not flooded.\n\n## Validation\n\n- **Over the limit:** Given a payload over 600 bytes, When I check it, Then it is refused.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `refused` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-second-reader-no-objection"}
expect:
  status: pass
  summary: "1 new test, red on the base"
  agent-calls: 2
  pushed:
    workline/tester/issue-3:
      tests/test_over_600_refused.sh: "refused 601"
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
