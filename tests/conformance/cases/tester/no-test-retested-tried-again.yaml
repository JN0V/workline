case: tester/no-test-retested-tried-again
about: >
  The tester found no test possible, and the product owner sent the issue
  back to its tests unchanged, its reason the tester's own (#1053): its
  state's retest answers that word. The tester asks its agent again,
  never blocking it as sent back unchanged; a second "no test possible"
  is recorded as retried, so no second retest follows.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n"
        comments:
          - "```yaml\nsources: []\nconfirmed: d8c4dff\nretest: 1d507da29cc3\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**The tester** finds no test possible for this issue.\n\n<!-- workline:tester-proof {\"kind\":\"none\",\"reason\":\"the code of the multiply step was not in its task.\",\"body\":\"4ddd2750a5af\"} -->\n<!-- workline:sticky=tester/issue -->"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-proof-none"}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: no-test-possible, level: info, where: "#3"}]
  forge:
    issues:
      - id: 3
        labels: ["workline:to-refine"]
        comment-contains: ["**The tester** finds no test possible for this issue.", "no test checks a feeling.", "\"retried\":true"]
