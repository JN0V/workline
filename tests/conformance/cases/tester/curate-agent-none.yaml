case: tester/curate-agent-none
about: >
  With no agent, nobody weighs which tests are redundant: nothing is
  removed, said (principle 5).
given:
  repo: curated
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}", coverage-report: cover.info, curator-mutation-command: "sh mutate.sh {report} {package}"}}}
  forge:
    merge-requests: []
run: {test: [curate], ai: none}
expect:
  status: pass
  agent-calls: 0
  findings: [{rule: no-agent, where: tests}]
  forge:
    merge-requests:
      - {id: 1, absent: true}
