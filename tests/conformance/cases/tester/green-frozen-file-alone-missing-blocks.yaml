case: tester/green-frozen-file-alone-missing-blocks
about: >
  A test frozen by its file alone (#1293), and the developer's runner edit stops that file's tests running: no test of the file is in the head's reports, and no new test could be it. It blocks, frozen-test-missing, naming the file.
given:
  repo: c-tested
  setup:
    - "git checkout -q -b workline/tester/issue-3"
    - "printf '#include <assert.h>\\n\\nint mul(int a, int b);\\n\\nint main(void) {\\n    assert(mul(2, 3) == 6);\\n    return 0;\\n}\\n' > tests/test_mul.c && git add tests && git commit -q -m 'test: the acceptance tests of #3' -m 'Workline-Role: tester'"
    - "printf 'int mul(int a, int b) { return a * b; }\\n' >> src/calc.c && git commit -qam 'feat: multiply'"
    - "sed -i 's|^for f in tests/test_\\*.c; do$|for f in tests/test_add.c; do|' run-tests.sh && git commit -qam 'build: run fewer tests'"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul.c\":\"fdc59b87a8e675c7f16ac17305bae997982d1504\"},\"tests\":[\"tests/test_mul.c\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  status: block
  agent-calls: 0
  findings: [{rule: frozen-test-missing, where: "tests/test_mul.c"}]
