case: tester/frozen-record-not-workline-s
about: >
  The record is read from workline's own comment only: one a person wrote,
  holding the marker, is never read, and the guard blocks, the tests it
  cannot tell.
given:
  repo: tested-draft
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: [{body: "The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->", author: builder}]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  status: block
  findings: [{rule: tester-record-missing, where: merge request 1, message: "@builder's comment"}]
