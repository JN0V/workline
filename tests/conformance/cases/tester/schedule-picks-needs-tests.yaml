case: tester/schedule-picks-needs-tests
about: >
  At night the tester takes an issue waiting for its tests,
  workline:needs-tests (ADR-0059), as it takes a ready one with no
  Draft: the first in the backlog's order. One that waits on an open
  issue is passed over, as a ready one is. Its proven Draft moves the
  issue to ready.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {schedule: [tester]}}
  forge:
    issues:
      - id: 2
        title: "Multiply, after the rounding"
        labels: ["workline:needs-tests"]
        blocked-by: [7]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n"
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
      - {id: 7, title: "Rounding", labels: ["workline:to-refine"], body: "## Need\n\nI want to round.\n"}
run: {route: schedule, open-merge-request: true, ai: "fake:tester-two-scenarios"}
expect:
  status: pass
  agent-calls: 1
  pushed:
    workline/tester/issue-3:
      tests/test_mul_two_by_three.sh: "Scenario: Two by three"
  not-pushed: [workline/tester/issue-2]
  forge:
    issues:
      - {id: 3, labels: ["workline:ready"]}
      - {id: 2, labels: ["workline:needs-tests"]}
