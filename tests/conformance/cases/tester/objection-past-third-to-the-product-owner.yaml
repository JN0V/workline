case: tester/objection-past-third-to-the-product-owner
about: >
  Past the tester's third answer, the product owner settles it (ADR-0059,
  decision 6): no agent, no person asked, no label on the merge request;
  the issue goes back to the product owner's state, refine, the thread
  and the issue told; never earlier.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
        threads:
          - {id: "7", path: tests/test_mul_two_by_three.sh, line: 4, author: builder, body: "workline:objection\n- test: tests/test_mul_two_by_three.sh\n- scenario: Two by three\n- kind: over-specified\n- why: too strict", replies: ["Kept: 1.\n\n<!-- workline:tester-answer -->", {body: "no", author: builder}, "Kept: 2.\n\n<!-- workline:tester-answer -->", {body: "no", author: builder}, "Kept: 3.\n\n<!-- workline:tester-answer -->", {body: "no", author: builder}]}
run: {test: [answer, --merge-request, "1"], ai: "fake:tester-answer-kept"}
expect:

  status: pass
  agent-calls: 0
  findings: [{rule: objection-to-the-product-owner, level: warn, message: "3 answers did not settle it: #3 back to the product owner"}]
  forge:
    issues:
      - id: 3
        labels: ["workline:to-refine"]
        comment-contains: ["**The tester** asks the product owner to settle an objection to its test, scenario **Two by three**", "too strict"]
    merge-requests:
      - id: 1
        labels: []
        threads:
          - {path: tests/test_mul_two_by_three.sh, replies: 7, replies-contain: ["The product owner settles it", "3 answers", "objected to again after that, #3 is blocked"]}
