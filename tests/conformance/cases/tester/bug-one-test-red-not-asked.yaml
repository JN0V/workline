case: tester/bug-one-test-red-not-asked
about: >
  A bug one test shows is reproduced (ADR-0060, decision 4): #3 is a
  bug; of its two tests, one fails on main, the other passes there. The
  bug shows, so its reporter is not asked and no workline:needs-repro is
  put; the green test is refused as any test that proves nothing. Asked
  once more, told which test passes on the base (#1156), the agent sends
  the same green test: the run blocks.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "mul gives a sum"
        author: ann
        insider: true
        labels: ["bug", "workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-green-on-base"}
expect:
  status: block
  agent-calls: 2
  findings: [{rule: test-green-on-base, where: tests.test_mul_by_zero}]
  no-findings: [{rule: bug-not-reproduced}]
  not-pushed: [workline/tester/issue-3]
  forge:
    merge-requests:
      - {id: 1, absent: true}
    issues:
      - {id: 3, labels: ["bug", "workline:needs-tests"], comment-contains: ["**The tester** wrote no tests for this issue this run", "passes on the base"], comment-lacks: ["kept as today", "covers entry"]}
