case: tester/green-frozen-renamed-judged-dropped
about: >
  A test named from its file is in no head report under that name;
  the head holds another new test, and the change edits the test
  runner. The judge reads the runner's diff and says the test was
  dropped: frozen-test-missing blocks, the judge's reason quoted.
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
    - |
      cat > tests/test_mul_negative.sh <<'T'
      . ./lib.sh
      [ "$(mul -2 3)" = -6 ]
      T
      git add tests && git commit -qm 'test: multiply a negative number'
    - |
      sed -i 's|for t in tests/test_\*.sh; do$|for t in tests/test_*.sh; do case $t in *by_zero*) continue ;; esac|' run-tests.sh
      grep -q by_zero run-tests.sh
      git commit -qam 'build: run fewer tests'
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-renamed-dropped.yaml"}
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests/test_mul_by_zero.sh:mulByZero\",\"tests.test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}, ai: "fake:tester-two-scenarios"}
expect:
  status: block
  agent-calls: 1
  findings: [{rule: frozen-test-missing, where: "tests/test_mul_by_zero.sh:mulByZero", message: "the judge says it was dropped"}]
  run-files:
    in/judge/frozen-names/question.yaml: {contains: ["+  for t in tests/test_*.sh; do case $t in *by_zero*) continue ;; esac", "tests.test_mul_negative"]}
