case: tester/write-declared-and-run
about: >
  Declared and run (ADR-0065, change 4): the agent declares which test
  covers which scenario, a `covers` entry each, its tests named for
  neither. Each declared id is found in the report among the new tests,
  red on the base, whole (`tests.test_mul_case_b`) or by its name alone
  (`test_mul_case_a`): each scenario is covered, its row in the Draft
  and in the record, which the developer's objections read.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-declared"}
expect:
  status: pass
  summary: "2 new tests, red on the base"
  agent-calls: 1
  no-findings: [{rule: scenario-without-test}, {rule: declared-test-missing}]
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        body-contains: ["| Two by three | `tests.test_mul_case_a` |", "| By zero | `tests.test_mul_case_b` |", "as the tester declared it"]
        comment-contains: ['"covers":{"By zero":["tests.test_mul_case_b"],"Two by three":["tests.test_mul_case_a"]}']
    issues:
      - id: 3
        comment-contains: ["the tests prove it another way: `tests.test_mul_case_a` (Two by three), `tests.test_mul_case_b` (By zero)"]
