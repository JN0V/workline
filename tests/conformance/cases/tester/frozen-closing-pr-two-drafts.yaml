case: tester/frozen-closing-pr-two-drafts
about: >
  A pull request closing two issues, each with its tester's Draft (#1286):
  both records are read, so a commit changing a test of the second issue
  blocks, and the finding sends the objection to that Draft, where the
  tester answers, not to this pull request.
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && printf '. ./lib.sh\n[ \"$(mul 2 3)\" ]\n' > tests/test_mul_two_by_three.sh && git commit -qam 'feat: multiply'"
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\"},\"tests\":[\"tests.test_mul_by_zero\"]} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 4
        branch: workline/tester/issue-4
        draft: true
        comments: ["The tests of #4, frozen.\n\n<!-- workline:tester-record {\"issue\":4,\"base\":\"main\",\"files\":{\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests.test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
      - id: 5
        branch: workline/developer/3
        body: "Closes #3\nCloses #4"
run: {role: tester, event: merge-request, target: {merge-request: 5}}
expect:
  status: block
  agent-calls: 0
  findings:
    - {rule: tester-test-changed, where: tests/test_mul_two_by_three.sh, message: "in the tester's Draft, merge request 4"}
