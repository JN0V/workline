case: tester/write-kotlin-overrides-nothing-judge-reads
about: >
  The issue adds `nextIndex` to an interface. The tester's Kotlin test
  fakes it with `override fun nextIndex()`: Gradle writes no report, and
  Kotlin says `'nextIndex' overrides nothing`, no missing name. The judge
  first asks to read the base where `nextIndex` is written, is served it
  from git, then says yes: red, the Draft opens (ADR-0065, ADR-0045).
given:
  repo: kotlin-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-red-reads.yaml"}
  config:
    roles: {tester: {settings: {test-command: "sh \"$FIXTURES/bin/gradle-says\" {report}"}}}
  forge:
    issues:
      - id: 3
        title: "The next file number"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I resume a recording, I want the next file number, so no file is written over.\n\n## Validation\n\n- **Next index:** Given a store holding five files, When I ask its next index, Then I get 5.\n\n---\n\n## Verification\n\nA Kotlin test, with a fake store.\n\n## Scope\n\n- `calc/src/main/kotlin/calc/Calc.kt`: a `Store` interface gains `nextIndex`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-kotlin-override"}
expect:
  status: pass
  summary: "1 new test, red on the base (1 not built there, a broken build)"
  agent-calls: 3
  findings: [{rule: red-judged, level: info}]
  run-files:
    out/judge/red-proof/question.yaml: {contains: ["What you read, round 1", "grep `nextIndex`"]}
  forge:
    merge-requests:
      - {id: 1, branch: workline/tester/issue-3, draft: true}
