case: tester/write-malformed-twice-refused
about: >
  Two answers in a row that do not read as YAML: the tester asks no
  third time (#761). The run blocks with the reader's error, the
  refusal is said on the issue, and no Draft opens.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env:
    ALWAYS: "1"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "cmd:sh $FIXTURES/agents/tester-mul-malformed-once.sh"}
expect:
  status: block
  agent-calls: 2
  findings: [{rule: agent-invalid-output}, {rule: no-test-written}]
  not-pushed: [workline/tester/issue-3]
  forge:
    merge-requests:
      - {id: 1, absent: true}
    issues:
      - id: 3
        comments: 1
        comment-contains: ["**The tester** wrote no tests for this issue this run", "could not be read", "yaml: line"]
