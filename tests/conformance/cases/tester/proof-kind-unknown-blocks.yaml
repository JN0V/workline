case: tester/proof-kind-unknown-blocks
about: >
  A proof kind the engine does not know is refused (ADR-0059, decision
  4): flaky-n-of-n, existing-suite, docs-checks, or none; the issue keeps
  its state.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-proof-unknown"}
expect:
  status: block
  findings: [{rule: proof-kind-unknown, where: "#3", message: "`eyeballed` is no proof kind"}]
  forge:
    issues:
      - {id: 3, labels: ["workline:needs-tests"]}
