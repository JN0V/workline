case: tester/board-blocked-column-github
about: >
  Given a GitHub project with a Blocked option in its Status, an issue
  the tester blocks (sent to its tests again unchanged after no test
  possible) goes workline:blocked and its card's Status to Blocked
  (ADR-0059, decision 2), written when its label is: the issue says
  why. No agent asked.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    boards:
      - forge: github
        number: 3
        name: Team plan
        owner: organization
        columns: [Todo, Tests, In Progress, Blocked, Done]
        workflows: {"Item closed": true, "Pull request merged": true, "Pull request linked to issue": true}
    issues:
      - id: 3
        title: "A calmer page"
        labels: ["workline:needs-tests"]
        status: {"3": "Tests"}
        body: "## Need\n\nA reader needs a calmer page.\n\n## Validation\n\n- **Calm:** Given the page, When Ann reads it, Then it feels calm.\n"
        comments:
          - "**The tester** finds no test possible for this issue.\n\n<!-- workline:tester-proof {\"kind\":\"none\",\"reason\":\"no test checks a feeling.\",\"body\":\"9e210b1ef9d0\"} -->\n<!-- workline:sticky=tester/issue -->"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-proof-none"}
expect:
  status: pass
  agent-calls: 0
  findings: [{rule: sent-back-unchanged, level: warn, where: "#3"}]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        status: {"3": "Blocked"}
        comment-contains: ["**The tester** leaves this issue blocked", "no test checks a feeling."]
