case: tester/green-frozen-named-from-file-missing-blocks
about: >
  A test whose build broke on the base is frozen as its file and name,
  as the red proof read it (file:name): no report named it yet. On the
  code, the head's report must name it: a report test of that name, as a
  whole word, is it. The developer's runner edit drops one: it blocks,
  named; the other is found green.
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
    - |
      cat > run-tests.sh <<'RUN'
      #!/bin/sh
      # The developer's edit: the multiply-by-zero test no longer runs.
      report=$1 failed=0
      mkdir -p "$(dirname "$report")"
      {
        echo '<?xml version="1.0" encoding="UTF-8"?>'
        echo '<testsuites><testsuite name="tests">'
        for t in tests/test_*.sh; do
          case $t in *by_zero*) continue ;; esac
          name=$(basename "$t" .sh)
          if sh "$t" >/dev/null 2>&1; then echo "<testcase classname=\"tests\" name=\"$name\"/>"
          else failed=1; echo "<testcase classname=\"tests\" name=\"$name\"><failure/></testcase>"; fi
        done
        echo '</testsuite></testsuites>'
      } > "$report"
      exit $failed
      RUN
      git commit -qam 'build: run fewer tests'
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests/test_mul_by_zero.sh:test_mul_by_zero\",\"tests/test_mul_two_by_three.sh:test_mul_two_by_three\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  status: block
  agent-calls: 0
  findings: [{rule: frozen-test-missing, where: "tests/test_mul_by_zero.sh:test_mul_by_zero"}]
  no-findings: [{rule: frozen-test-missing, where: "tests/test_mul_two_by_three.sh:test_mul_two_by_three"}, {rule: test-red-on-head}]
