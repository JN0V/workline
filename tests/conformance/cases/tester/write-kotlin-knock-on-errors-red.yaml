case: tester/write-kotlin-knock-on-errors-red
about: >
  The tester's Kotlin test calls `grid`, the one name the issue gives,
  and reaches a type and a member of it: Gradle writes no report, and
  Kotlin prints, beside `grid`, `Thirds` (a type the test does not
  call), `vertical` (a member) and a type it cannot infer. Those follow
  from `grid` in the same file: knock-ons, never named by the issue, not
  a build broken otherwise. The Draft opens at once (#1192).
given:
  repo: kotlin-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh \"$FIXTURES/bin/gradle-says\" {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Guide lines at the thirds"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I frame a picture, I want guide lines at its thirds, so I can place what matters.\n\n## Validation\n\n- **Thirds of nine:** Given the library, When I cut 9 in thirds, Then the lines are at 3 and 6.\n\n---\n\n## Verification\n\nA Kotlin test.\n\n## Scope\n\n- `calc/src/main/kotlin/calc/Calc.kt`: a `grid` function.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-kotlin-grid"}
expect:
  status: pass
  summary: "1 new test, red on the base (1 not built there, a missing name)"
  agent-calls: 1
  forge:
    merge-requests:
      - {id: 1, branch: workline/tester/issue-3, draft: true}
