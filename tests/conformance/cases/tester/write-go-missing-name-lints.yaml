case: tester/write-go-missing-name-lints
about: >
  The tester's Go test calls a name the code lacks: red by a missing
  name, as the proof allows. The project's golangci-lint type-checks it
  and says the same name, `undefined: Mul` (typecheck), at the package's
  first file (#988). That finding is the missing name the proof read,
  not counted: the Draft opens at once, the issue moves to ready.
given:
  repo: go-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    gates: {lint: {checks: [{id: golangci, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
    routing: {events: {issue: [tester], merge-request: ["gate:lint"]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA Go test.\n\n## Scope\n\n- `calc/calc.go`: a `Mul` function beside `Add`.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-go-missing-name"}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: tests-lint}]
  pushed:
    workline/tester/issue-3:
      calc/mul_test.go: "Scenario: Two by three"
  forge:
    merge-requests:
      - {id: 1, branch: workline/tester/issue-3, draft: true}
    issues:
      - {id: 3, labels: ["workline:ready"]}
