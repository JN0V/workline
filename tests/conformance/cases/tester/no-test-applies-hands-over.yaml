case: tester/no-test-applies-hands-over
about: >
  No acceptance test applies: the tester's agent writes no test and
  names no proof kind, only why no test can check the issue's
  scenarios. The issue does not go back to the product owner and does
  not fail: the tester says, in its comment, that no acceptance test
  applies and quotes the agent's reason, and the issue goes to the
  developer (ready). No Draft is opened. The comment count is not
  checked: the line's own record comment is written after every step
  it routes, so the count is not the tester's alone.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-no-test-noted"}
expect:
  status: pass
  agent-calls: 1
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        comment-contains: ["no acceptance test applies", "neither the multiply step's code nor its tests"]
