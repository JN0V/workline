case: tester/picker-a-line-of-a-long-file
about: >
  The code picker's contract, the tester's side (ADR-0063, step 4), on
  DomoticsCore's own code as the C++ trial had it: #1063, the trial's
  #33: an issue naming one line of a 7,576-line roadmap. The task holds
  the code the issue names, in its Need as in its Scope.
given:
  repo: tested
  setup:
    - |
      cp -R "$FIXTURES/code/domoticscore/." .
      git add . && git commit -qm 'feat: DomoticsCore, frozen from the C++ trial'
    - |
      mkdir -p docs
      awk 'BEGIN { for (i = 1; i <= 7576; i++) if (i == 6353) print "| WebUI | `wsBuffer_[]` static member defined in header — ODR violation risk in multi-TU builds |"; else print "| Core | an item of the roadmap, line " i " |" }' > docs/CODE-ROADMAP.md
      git add docs && git commit -qm 'docs: the roadmap, 7,576 lines'
    - |
      git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "A roadmap item is done"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nThe item at `docs/CODE-ROADMAP.md:6353` was fixed since: strike it.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario.\n\n## Scope\n\n- `docs/CODE-ROADMAP.md:6353`: the item to strike.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-two-scenarios"}
expect:
  agent-calls: 1
  run-files:
    in/task.md:
      contains: ["| WebUI | `wsBuffer_[]` static member defined in header", "an item of the roadmap, line 6352 |", "an item of the roadmap, line 6354 |"]
      not-contains: ["an item of the roadmap, line 1 |", "an item of the roadmap, line 400 |"]
