case: tester/check-reads-own-pack-test-paths
about: >
  My own pack (ADR-0065; #1230): a project's pack file of its own,
  .workline/packs/shell-checks.yaml, listed in its config, says its tests
  are under checks/; the tester's test-paths are unset. A change adds
  checks/sub.sh and the code it checks: the tester reads the pack's test
  paths, the check a test, red on the base, green on the head. The
  generic pack alone would call checks/sub.sh code.
given:
  repo: tested
  setup:
    - |
      cat > run-tests.sh <<'RUN'
      #!/bin/sh
      report=$1 failed=0
      mkdir -p "$(dirname "$report")"
      {
        echo '<?xml version="1.0" encoding="UTF-8"?>'
        echo '<testsuites><testsuite name="checks">'
        for t in checks/*.sh; do
          [ -f "$t" ] || continue
          name=$(basename "$t" .sh)
          if sh "$t" >/dev/null 2>&1; then
            echo "<testcase classname=\"checks\" name=\"$name\" time=\"0.01\"/>"
          else
            failed=1
            echo "<testcase classname=\"checks\" name=\"$name\" time=\"0.01\"><failure message=\"$t failed\"/></testcase>"
          fi
        done
        echo '</testsuite></testsuites>'
      } > "$report"
      exit $failed
      RUN
      mkdir -p .workline/packs
      printf 'about: shell projects whose checks live in checks/\ndetect:\n  extensions: [.sh]\ntest-paths: ["checks/**"]\n' > .workline/packs/shell-checks.yaml
      git add run-tests.sh .workline/packs && git commit -qm 'build: run the checks'
    - git checkout -q -b change
    - |
      printf 'sub() { echo $(($1 - $2)); }\n' >> lib.sh && mkdir -p checks && printf '. ./lib.sh\n[ "$(sub 5 3)" = 2 ]\n' > checks/sub.sh && git add . && git commit -qm "feat: subtract"
  config:
    packs: [shell-checks]
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
run: {test: [check, --base, main]}
expect:
  status: pass
  summary: "1 new test, red on the base, green on the head"
  no-findings: [{rule: test-green-on-base}, {rule: test-red-on-head}]
