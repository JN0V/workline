case: tester/write-kept-as-today-said
about: >
  A scenario of behaviour kept as it is today, said not tested, its
  reason as the agent wrote it: the Draft lists it unproven, for the
  reviewer's tests lens to weigh whether a guard test can prove it; the
  other scenario's test is proven red, the Draft opened, the issue ready.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **Add unchanged:** Given the library, When I add 2 and 3, Then I get 5, as today.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-kept-as-today"}
expect:
  status: pass
  summary: "1 new test, red on the base"
  forge:
    issues:
      - {id: 3, labels: ["workline:ready"]}
    merge-requests:
      - id: 1
        draft: true
        body-contains: ["Not tested", "Add unchanged: kept as today: the existing suite guards it.", "**Unproven**: Add unchanged.", "the reviewer's tests lens weighs whether a test can"]
