case: tester/proof-kind-moves-to-ready
about: >
  No new test fits a flaky-test fix (ADR-0059, decision 4): the tester's
  agent names the proof that does, `flaky-n-of-n`, and why. The engine
  records the kind and its reason in the tester's comment on the issue,
  opens no Draft, and moves the issue to ready; the developer accepts
  that proof in place of one.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "The retry test fails one run in five"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nA maintainer needs the retry test to stop failing at random.\n\n## Validation\n\n- **Reliable:** Given the suite, When the retry test runs 10 times, Then it passes 10 times.\n\n## Scope\n\n- `tests/test_retry.sh`\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-proof-flaky"}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: proof-recorded, level: info, where: "#3", message: "flaky-n-of-n: tests/test_retry.sh must pass 10 runs of 10"}]
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - id: 3
        labels: ["workline:ready"]
        comment-contains: ["**The tester** records the proof of this issue: flaky-n-of-n, no new test.", "- **Next**: it is ready: whoever builds it proves it so, the named test passes N runs of N", "<!-- workline:tester-proof {\"kind\":\"flaky-n-of-n\""]
