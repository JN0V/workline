case: tester/kotlin-missing-name-no-agent-waits
about: >
  The tests alone, in Kotlin, calling a function the code lacks, no
  issue known: the module does not build, and Gradle prints the error with
  the file's absolute path, as a file:// URI. With the role's default
  build-errors, the path is read from the repository's root (#1177); no
  agent judges it, so red unproven, a person reads it (ADR-0065).
given:
  repo: kotlin-tested
  setup:
    - git checkout -q -b workline/issue-7
    - |
      printf 'package calc\n\nimport org.junit.jupiter.api.Test\n\nclass MulTest {\n    @Test\n    fun `two by three`() {\n        check(mul(2, 3) == 6)\n    }\n}\n' > calc/src/test/kotlin/calc/MulTest.kt && git add . && git commit -qm "test: multiply"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
run: {test: [check, --base, main]}
expect:
  status: human
  summary: "1 new test, red on the base (1 not built there, a broken build), red unproven: a person reads it"
  findings: [{rule: red-unproven, where: calc/src/test/kotlin/calc/MulTest.kt}]
  no-findings: [{rule: tests-not-built, where: junit.xml}, {rule: no-new-test, where: junit.xml}]
