case: tester/write-kotlin-changed-signature-judged-red
about: >
  Judged yes: the issue changes a function's signature (`add(a, b, c)`,
  the base's `add` taking two). The tester's Kotlin test calls it with
  three arguments: the module does not compile, Gradle writes no report,
  and Kotlin says `Too many arguments for 'fun add(…)'`, no missing name.
  The fast path does not pass it; the judge is asked with the compiler's
  lines, and its yes makes the test red: the Draft opens (ADR-0065).
given:
  repo: kotlin-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-red-yes.yaml"}
  config:
    roles: {tester: {settings: {test-command: "sh \"$FIXTURES/bin/gradle-says\" {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Add three numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total three prices, I want to add them in one call, so I need not chain two.\n\n## Validation\n\n- **Three numbers:** Given the library, When I add 2, 3 and 4, Then I get 9.\n\n---\n\n## Verification\n\nA Kotlin test.\n\n## Scope\n\n- `calc/src/main/kotlin/calc/Calc.kt`: `add(a, b, c)` takes a third number.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-kotlin-signature"}
expect:
  status: pass
  summary: "1 new test, red on the base (1 not built there, a broken build)"
  agent-calls: 2
  findings: [{rule: red-judged, level: info, where: calc/src/test/kotlin/calc/AddThreeTest.kt}]
  run-files:
    out/judge/red-proof/question.yaml: {contains: ["Too many arguments for 'fun add(a: Int, b: Int): Int'", "add(2, 3, 4)", "takes a third number"]}
  forge:
    merge-requests:
      - {id: 1, branch: workline/tester/issue-3, draft: true}
