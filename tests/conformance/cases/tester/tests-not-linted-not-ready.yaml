case: tester/tests-not-linted-not-ready
about: >
  The tester's tests pass the project's lint before the issue is ready
  (ADR-0059, decision 3): each gate the project routes on merge-request
  runs on them, only what they add counted. One that does not pass
  blocks the run: no Draft opened, the issue keeps its state.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    gates: {lint: {checks: [{id: fixme, run: "! grep -rq FIXME tests", output: exit}]}}
    routing: {events: {issue: [tester], merge-request: ["gate:lint"]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-two-scenarios-unlinted"}
expect:
  status: block
  findings: [{rule: tests-lint, where: fixme, message: "the gate lint"}]
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - {id: 3, labels: ["workline:needs-tests"]}
