case: tester/empty-answer-is-no-test-written
about: >
  A tester's agent that answers nothing, no test, no proof kind and no
  reason, as one stopped at its turn cap with its text not written yet
  (#1194): no work, a machine error the line retries (no-test-written),
  never "no test possible" sending the issue back to refine.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester]}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nI want to multiply.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:proposes-nothing"}
expect:
  status: block
  findings: [{rule: no-test-written, where: "#3"}]
  no-findings: [{rule: no-test-possible}]
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - id: 3
        labels: ["workline:needs-tests"]
