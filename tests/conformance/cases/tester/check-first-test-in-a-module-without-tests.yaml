case: tester/check-first-test-in-a-module-without-tests
about: >
  A change adds the first test of a module that has none, and its code
  (#2091). The test command runs that module alone, as Gradle does: on
  the base it says NO-SOURCE, writes no report and exits 0. The base
  run is an empty run: the test is red there with the tests laid on
  it, and green on the head.
given:
  repo: tested
  setup:
    - "mkdir app && printf 'plugins {}\\n' > app/build.gradle.kts && git add app && git commit -qm 'build: a module'"
    - git checkout -q -b change
    - |
      printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && printf '. ./lib.sh\n[ "$(mul 2 3)" = 6 ]\n' > app/test_mul.sh && git add . && git commit -qm "feat: multiply"
  config:
    roles: {tester: {settings: {test-command: "sh \"$FIXTURES/bin/gradle-no-source\" {report} app"}}}
run: {test: [check, --base, main]}
expect:
  status: pass
  summary: "1 new test, red on the base, green on the head"
  no-findings: [{rule: report-missing}, {rule: test-green-on-base}, {rule: test-red-on-head}]
