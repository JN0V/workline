case: tester/kotlin-knock-on-errors-red
about: >
  The tests alone, in Kotlin, calling a function the base lacks and a
  type of it: Gradle writes no report, and Kotlin prints, beside the
  missing name, a member of the new type and a type it cannot infer.
  Those follow from the missing name in the same file: knock-ons, not a
  build broken otherwise. The test is red by its missing name (#1192).
given:
  repo: kotlin-tested
  setup:
    - git checkout -q -b workline/issue-7
    - |
      cat > calc/src/test/kotlin/calc/GridTest.kt <<'KT'
      package calc

      import org.junit.jupiter.api.Test

      // gradle: e: {file}:11:20 Unresolved reference 'grid'.
      // gradle: e: {file}:11:30 Unresolved reference 'Thirds'.
      // gradle: e: {file}:12:24 Unresolved reference 'vertical'.
      // gradle: e: {file}:12:38 Cannot infer type for this parameter. Please specify it explicitly.
      class GridTest {
          @Test
          fun `thirds of nine`() {
              val g = grid(9, Thirds.ALL)
              check(g.vertical.map { x -> x } == listOf(3, 6))
          }
      }
      KT
      git add . && git commit -qm "test: grid"
  config:
    roles: {tester: {settings: {test-command: "sh \"$FIXTURES/bin/gradle-says\" {report}"}}}
run: {test: [check, --base, main]}
expect:
  status: pass
  summary: "1 new test, red on the base (1 not built there, a missing name)"
