case: tester/write-build-broken-asked-again
about: >
  The tester's Go test calls a name the base has, wrongly: its package
  does not build for an error other than a missing name (#1048, a wrong
  constructor call on the C++ trial). As for a lint finding, the agent
  is asked once more with the build's error; its second answer builds
  but for the missing name, red on the base: the Draft opens.
given:
  repo: go-tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA Go test.\n\n## Scope\n\n- `calc/calc.go`: a `Mul` function beside `Add`.\n"
run: {test: [write, --issue, "3"], ai: "cmd:sh $FIXTURES/agents/tester-go-wrong-call-once.sh"}
expect:
  status: pass
  agent-calls: 2
  run-files:
    out/feedback.md: {contains: ["build-broken", "calc/mul_test.go"]}
  pushed:
    workline/tester/issue-3:
      calc/mul_test.go: "Mul(2, 3) != 6"
  forge:
    merge-requests:
      - {id: 1, branch: workline/tester/issue-3, draft: true}
