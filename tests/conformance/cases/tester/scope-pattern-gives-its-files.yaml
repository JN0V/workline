case: tester/scope-pattern-gives-its-files
about: >
  A Scope that names its files by a pattern, `src/calc/*.sh`, gives the
  tester the files it matches as the code it names, and not the others
  of the folder: given nothing, it found no test possible (#801).
given:
  repo: tested
  setup:
    - "mkdir -p src/calc && printf 'add() { echo $(($1 + $2)); }\\n' > src/calc/add.sh && printf 'package calc\\n' > src/calc/add.go && git add src && git commit -qm 'src' && git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:needs-tests"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `src/calc/*.sh`: a `mul` function beside `add`.\n"
run: {test: [write, --issue, "3"], ai: "fake:tester-two-scenarios"}
expect:
  status: pass
  agent-calls: 1
  run-files:
    in/task.md: {contains: ["## The code the Scope names", "### `src/calc/add.sh`", "add() { echo"], not-contains: "### `src/calc/add.go`"}
