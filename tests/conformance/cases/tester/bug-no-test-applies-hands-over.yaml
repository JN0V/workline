case: tester/bug-no-test-applies-hands-over
about: >
  A bug whose scenarios no acceptance test can check: the tester's
  agent writes no test and gives why. The bug is handed over to the
  developer as any issue is, provided the tester's one comment on the
  issue says why no test applies; its kind stays bug.
given:
  repo: tested
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
    routing: {events: {issue: [tester, developer]}}
  forge:
    issues:
      - id: 3
        title: "The page feels cramped"
        author: ann
        insider: true
        labels: ["bug", "workline:needs-tests"]
        body: "## Need\n\nWhen I multiply, I want the step to work, so the total is right.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n\n---\n\n## Verification\n\nA test in tests/.\n\n## Scope\n\n- `lib.sh`: `mul`.\n"
run: {route: issue, target: {issue: 3}, open-merge-request: true, ai: "fake:tester-no-test-noted"}
expect:
  status: pass
  not-pushed: [workline/tester/issue-3]
  forge:
    issues:
      - id: 3
        labels: ["bug", "workline:ready"]
        comments: 1
        comment-contains: ["no acceptance test applies", "neither the multiply step's code nor its tests"]
