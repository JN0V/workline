case: tester/objection-again-after-settling-blocked
about: >
  Objected to again after the product owner settled it (ADR-0059,
  decision 6): the roles do not agree. The issue goes workline:blocked,
  its other states' labels off, the reason on it and in the thread; no
  agent, no person asked: one on the loop reads the board.
given:
  repo: tested-draft
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main workline/tester/issue-3"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    issues:
      - id: 3
        title: "Multiply two numbers"
        labels: ["workline:ready"]
        body: "## Need\n\nWhen I total an order, I want to multiply a price by a count, so I need not add it up by hand.\n\n## Validation\n\n- **Two by three:** Given the library, When I multiply 2 by 3, Then I get 6.\n- **By zero:** Given the library, When I multiply 5 by 0, Then I get 0.\n\n---\n\n## Verification\n\nA test a scenario, in tests/.\n\n## Scope\n\n- `lib.sh`: a `mul` function beside `add`.\n"
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        draft: true
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"}} -->\n<!-- workline:sticky=tester/tests -->"]
        threads:
          - {id: "7", path: tests/test_mul_two_by_three.sh, line: 4, author: builder, body: "workline:objection\n- test: tests/test_mul_two_by_three.sh\n- scenario: Two by three\n- kind: over-specified\n- why: too strict", replies: ["Kept: 1.\n\n<!-- workline:tester-answer -->", {body: "no", author: builder}, "Kept: 2.\n\n<!-- workline:tester-answer -->", {body: "no", author: builder}, "Kept: 3.\n\n<!-- workline:tester-answer -->", {body: "no", author: builder}, "**The product owner settles it**: 3 answers.\n\n<!-- workline:tester-product-owner-settles -->\n\n<!-- workline:tester-answer -->", {body: "please", author: builder}]}
run: {test: [answer, --merge-request, "1"], ai: "fake:tester-answer-kept"}
expect:

  status: pass
  agent-calls: 0
  findings: [{rule: objection-blocked, level: warn, message: "#3 blocked"}]
  forge:
    issues:
      - id: 3
        labels: ["workline:blocked"]
        comment-contains: ["**The tester** blocks this issue", "a person on the loop reads the thread"]
    merge-requests:
      - id: 1
        labels: []
        threads:
          - {path: tests/test_mul_two_by_three.sh, replies: 9, replies-contain: ["**Blocked**: objected to again after the product owner settled it"]}
