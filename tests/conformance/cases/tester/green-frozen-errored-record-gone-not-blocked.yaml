case: tester/green-frozen-errored-record-gone-not-blocked
about: >
  A runner that cannot collect a test file may write a record of it,
  with no class, failed, in place of its tests (pytest's collection
  error). The red proof froze it as a new id, marked errored. On the
  code the file collects, its tests run under their own ids, and the
  record is gone: no test case was dropped. Never a block on it: with
  no agent, frozen-unproven, written on the pull request.
given:
  repo: tested-draft
  setup:
    - "printf 'mul() { echo $(($1 * $2)); }\n' >> lib.sh && git commit -qam 'feat: multiply'"
  config:
    roles: {tester: {settings: {test-command: "sh run-tests.sh {report}"}}}
  forge:
    merge-requests:
      - id: 1
        branch: workline/tester/issue-3
        body: "Closes #3"
        comments: ["The tests of #3, frozen.\n\n<!-- workline:tester-record {\"issue\":3,\"base\":\"main\",\"files\":{\"tests/test_mul_by_zero.sh\":\"8f123a0bacbd681063880b867df38dd216784b97\",\"tests/test_mul_two_by_three.sh\":\"2dee0641bd7a79057ade7bff5af43b603125f543\"},\"tests\":[\"tests.collect_error\",\"tests.test_mul_two_by_three\"],\"errored\":[\"tests.collect_error\"]} -->\n<!-- workline:sticky=tester/tests -->"]
run: {role: tester, event: merge-request, target: {merge-request: 1}}
expect:
  status: pass
  agent-calls: 0
  findings: [{rule: frozen-unproven, level: warn, where: tests.collect_error}]
  no-findings: [{rule: frozen-test-missing}]
  forge:
    merge-requests:
      - id: 1
        comment-contains: ["frozen-unproven", "tests.collect_error"]
