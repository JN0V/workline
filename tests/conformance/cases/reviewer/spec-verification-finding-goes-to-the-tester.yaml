case: reviewer/spec-verification-finding-goes-to-the-tester
about: "Reviewer's finding (#1261): an issue a person wrote whole, with an important finding in its Verification. The Verification is the tester's (ADR-0066): the reviewer's comment routes the finding to the tester, who answers it as it writes the tests; the finding holds nothing from ready, and neither the product owner nor a person is asked."
given:
  repo: reviewed
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 4
        title: The mean of no values
        body: "## Need\n\nAverage gives 0 for an empty list.\n\n## Verification\n\nThe mean works well.\n\n## Validation\n\nThe maintainer reads the test.\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments: ["```yaml\nsources: [calc/calc.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
    merge-requests: []
run: {role: reviewer, event: schedule, ai: "fake:review-spec-forge-verification"}
expect:
  status: pass
  findings: [{rule: unverifiable, where: "#4:7"}]
  forge:
    issues:
      - id: 4
        comments: 2
        comment-contains: ["**Holds nothing**: 1 important finding open, round 1 of 5. Verification, the tester's: it answers it as it writes the tests, after ready, and holds nothing back.", "in=Verification -->"]
        comment-lacks: ["Verification, a person's", "Verification, the product owner's"]
