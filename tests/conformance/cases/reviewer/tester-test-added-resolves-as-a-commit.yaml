case: reviewer/tester-test-added-resolves-as-a-commit
about: "A warning of the tests lens went to the tester, who answered by adding a test (#1303): no reason to weigh. The reviewer reads the commit adding it as any commit: its tests lens reads a test file touching the finding's file, finds nothing, and the conversation is resolved, as before (#1039). No judge is asked."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - "printf 'package calc\\n\\nimport \"testing\"\\n\\nfunc TestAverageOffByOne(t *testing.T) {\\n\\tif Average([]int{2, 4}) != 3 {\\n\\t\\tt.Fatal(\"off by one\")\\n\\t}\\n}\\n' > calc/calc_test.go && git add calc/calc_test.go && git commit -qm 'test: add a test the review asks to calc/calc_test.go'"
  forge:
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments:
          - |
            **workline reviewer** — 1 finding on the change; lenses: tests.

            <!-- workline:record reviewed=@reviewed@ runs=1 -->

            <!-- workline:sticky=reviewer/summary -->
          - "**The tester** answers a test finding of this review on `calc/calc.go:11`, sent to its Draft ([the thread](https://forge.example/pr/1#7)): **Added** in `calc/calc_test.go`: it averages 2 and 4.\n\n<!-- workline:sticky=tester/tester-answer-7 -->"
        threads:
          - {path: calc/calc.go, line: 11, body: "**workline reviewer** · warns · tests\n\n**Important: Average has no test for a count off by one**\n\n<!-- workline:line=tests/d861c7fa46d7 -->"}
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: tests}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  # The tests lens alone: no judge, no answer to weigh.
  agent-calls: 1
  forge:
    merge-requests:
      - id: 5
        comment-contains: ["**Resolved**: 1 conversation"]
        comment-lacks: ["**The tester's answers weighed**"]
        threads:
          - {path: calc/calc.go, line: 11, resolved: true}
