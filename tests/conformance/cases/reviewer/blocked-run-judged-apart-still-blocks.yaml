case: reviewer/blocked-run-judged-apart-still-blocks
about: "Judged with --no-apply, a blocked merge request still blocks, and leaves its comment to apply: the job that judges fails, the one that applies writes it (#226)."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config: {roles: {reviewer: {settings: {ai-findings: block}}}}
  forge:
    issues: []
    merge-requests: [{id: 5, labels: [], comments: []}]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: correctness}, target: {merge-request: 5}, ai: "fake:review-related", no-apply: true}
expect:
  status: block
  summary: "apply with: workline apply"
  findings: [{rule: correctness, where: "calc/calc.go:11"}]
  forge:
    merge-requests:
      - {id: 5, comments: 0}
