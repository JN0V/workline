case: reviewer/tester-none-needed-other-finding-same-line-stands
about: "The judge settled the tester's answer on one finding of the tests lens at `calc/calc.go:11` (#1303). A different finding now blocks on the same line: the answer and its verdict are not this one's. It stands, and no judge is asked."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
  config: {roles: {reviewer: {settings: {ai-findings: block}}}}
  forge:
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments:
          - |
            **workline reviewer** — 1 finding on the change; lenses: tests; the author fixes what blocks.

            <!-- workline:record reviewed=@reviewed@ runs=1 -->
            <!-- workline:blocks [{"lens":"tests","at":"@reviewed@","where":"calc/calc.go:11","title":"Important: Average has no test for a count off by one","cause":{"path":"calc/calc.go","quote":"return total / (len(values) - 1)"}}] -->
            <!-- workline:weighed [{"lens":"tests","where":"calc/calc.go:11","title":"Average has no test for a negative count","answer":"72f3d83f3918","holds":true,"why":"a test would pass on the base"}] -->

            <!-- workline:sticky=reviewer/summary -->
          - "**The tester** answers a test finding of this review on `calc/calc.go:11`, “Average has no test for a negative count”, sent to its Draft ([the thread](https://forge.example/pr/1#7)): **None needed**: TestAverage already averages 2 and 4: a new test would pass on the base and prove nothing.\n\n<!-- workline:sticky=tester/tester-answer-7 -->"
run: {role: reviewer, event: merge-request, input: {range: main..HEAD}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: block
  agent-calls: 0
  forge:
    merge-requests:
      - id: 5
        comment-contains: ["| **blocks** | tests | `calc/calc.go:11`", "Average has no test for a count off by one"]
        comment-lacks: ["**The tester's answers weighed**"]
