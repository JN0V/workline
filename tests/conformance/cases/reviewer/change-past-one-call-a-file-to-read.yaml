case: reviewer/change-past-one-call-a-file-to-read
about: "A change whose diff is past what one call is given (diff-lines-max), for claude, which reads the repository itself: the diff is a file in its copy of the repository, named in its task with the files changed, and read there whole; never cut, never in parts (ADR-0074)."
given:
  repo: reviewed
  setup: ["printf 'package calc\\n\\n// Half halves a count given as text.\\nfunc Half(s string) int {\\n\\treturn Parse(s) / 2\\n}\\n' > calc/half.go && git add calc/half.go && git commit -qm 'feat: halve a count'"]
  env: {PATH: "$FIXTURES/claude-reviews:$PATH", WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config: {roles: {reviewer: {settings: {diff-lines-max: 3}}}}
run: {role: reviewer, event: review, input: {range: main..HEAD, lenses: correctness}, ai: claude}
expect:
  status: pass
  calls: [{task: part, for: 1-correctness}, {task: judge, for: judge/01}]
  findings: [{rule: outside-the-change, message: "Half of a word that is no number is zero"}]
  no-findings: [{rule: review-not-whole}, {rule: input-cut}, {rule: lens-failed}]
  run-files:
    in/parts/1-correctness/task.md:
      contains: ["too many to give here: read it whole in `workline-change.diff`", "The files it changes: calc/half.go."]
      not-contains: "```diff"
    out/calls.jsonl: {contains: ' workline-change.diff"'}
