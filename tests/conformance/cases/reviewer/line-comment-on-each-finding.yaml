case: reviewer/line-comment-on-each-finding
about: "On a merge request, each important finding with a file and a line, and each rule's, is a comment on that line, in one review of the forge's own (the simulated forge takes it whole, as GitHub does): a rule's, then a lens's, each saying whether it blocks or warns, the lens's whole, its why and its fix. The summary comment stays, links to the review and keeps each finding on a line to its title (#277)."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "printf '\\n// Double returns twice n,\\n// for a count.\\nfunc Double(n int) int { return 2 * n }\\n' >> calc/calc.go && git commit -qam 'feat: double a count'"
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config: {roles: {reviewer: {settings: {ai-findings: {correctness: block}, comment-block-max: 1}}}}
  forge:
    issues: []
    merge-requests: [{id: 5, labels: [], comments: []}]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: correctness}, target: {merge-request: 5}, ai: "fake:review-related"}
expect:
  status: block
  applied: [comment]
  findings:
    - {rule: correctness, where: "calc/calc.go:11", message: "Important: Average divides by one less than the count"}
    - {rule: long-comment, where: "calc/calc.go:20"}
  no-findings: [{rule: line-comment-refused}]
  forge:
    merge-requests:
      - id: 5
        comments: 1
        comment-contains:
          - "**On their lines**: 2 comments, in [the review](https://forge.example/merge-requests/5#review-1) (2 posted now). What blocks stands until a commit fixes it; what warns asks nothing."
          - "| **blocks** | correctness | `calc/calc.go:11` | Important: Average divides by one less than the count |"
        comment-lacks: "the mean of [2, 4]"
        threads:
          - {path: calc/calc.go, line: 20, contains: ["**workline reviewer** · warns · long-comment", "a comment of 2 lines"]}
          - path: calc/calc.go
            line: 11
            contains: ["**workline reviewer** · **blocks** · correctness", "**Important: Average divides by one less than the count**", "the mean of [2, 4] comes out 6", "What would fix it: divide by len(values)", "_verified, independence:", "<!-- workline:line=correctness/"]
