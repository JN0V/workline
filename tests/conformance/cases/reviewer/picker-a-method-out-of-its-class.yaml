case: reviewer/picker-a-method-out-of-its-class
about: >
  The code picker's contract, the reviewer's side (ADR-0063, step 4), on
  DomoticsCore's own code as the C++ trial had it: #1064, the trial's
  #36: two methods defined out of their class, deep in a 743-line
  header, named in the Need, not the Scope. The spec's lenses are given
  the code it names.
given:
  repo: reviewed
  setup:
    - |
      cp -R "$FIXTURES/code/domoticscore/." .
      git add . && git commit -qm 'feat: DomoticsCore, frozen from the C++ trial'
    - |
      mkdir -p docs && cat > docs/spec.md <<'MD'
      # MQTT reconnect counter reset clears the statistics

      ## Need

      `resetReconnect()` zeroes `stats.reconnectCount`, and `updateStatistics()` then reports an uptime since the reset, not since the connection.
      MD
run: {review: [--spec, docs/spec.md], ai: "fake:review-nothing"}
expect:
  agent-calls: 1
  run-files:
    in/parts/1-lenses/task.md:
      contains: ["inline void MQTTComponent::resetReconnect() {", "    stats.reconnectCount = 0;", "inline void MQTTComponent::updateStatistics() {", "        stats.uptime = (HAL::Platform::getMillis() - stateChangeTime) / 1000;"]
