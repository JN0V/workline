case: reviewer/spec-owners-scope-is-rewritten
about: "An important finding in the Scope, the product owner's at every level (ADR-0060): the reviewer holds the issue from ready, and its comment says the product owner rewrites the Scope at its next refine; a person may still accept the issue as it reads. Unlike a finding in the Verification, the tester's (ADR-0066)."
given:
  repo: reviewed
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 4
        title: The mean of no values
        body: "## Need\n\nAverage gives 0 for an empty list, and the README tells the users.\n\n## Validation\n\nThe maintainer reads the test.\n\n---\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments: ["```yaml\nsources: [calc/calc.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
    merge-requests: []
run: {role: reviewer, event: schedule, ai: "fake:review-spec-forge-scope"}
expect:
  status: pass
  findings: [{rule: out-of-scope}]
  forge:
    issues:
      - id: 4
        comments: 2
        comment-contains: ["**Holds it from ready**: 1 important finding open, round 1 of 5. Scope, the product owner's: it rewrites it at its next refine.", "in=Scope -->"]
        comment-lacks: ["a person's", "the tester's", "Holds nothing"]
