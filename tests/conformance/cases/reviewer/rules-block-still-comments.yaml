case: reviewer/rules-block-still-comments
about: "A merge request a rule blocks gets the summary comment too, before any agent is asked; no lens ran, so the record does not move (#226)."
given:
  repo: reviewed
  setup:
    - "printf '\\n// Double returns twice n.\\n// The bug was an overflow here.\\nfunc Double(n int) int { return 2 * n }\\n' >> calc/calc.go && git commit -qam 'feat: double a count'"
  forge:
    issues: []
    merge-requests: [{id: 5, labels: [], comments: []}]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: block
  agent-calls: 0
  applied: [comment]
  findings: [{rule: bug-story, where: "calc/calc.go:21"}]
  forge:
    merge-requests:
      - {id: 5, comments: 1, comment-contains: ["| **blocks** | bug-story |", "reviewed= runs=0 -->"]}
