case: reviewer/commits-past-five-counts-only-those-changing-code
about: "The five new commits a push the lenses that warn read (ADR-0050, step 6) count only those changing code: a docs commit and a merge of main are read with them, never counted. Nine new commits, six changing code, two on the README, and main merged in between: the run apart reads up to the fifth commit changing code, the docs and the merge before it included, and leaves the sixth alone. Main's code, merged in, is not given to the lens."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - 'for i in 1 2 3; do printf "package calc\n\n// F$i is $i.\nfunc F$i() int { return $i }\n" > calc/f$i.go && git add calc/f$i.go && git commit -qm "feat: add f$i"; done'
    - "printf 'More words.\\n' >> README.md && git commit -qam 'docs: say more'"
    - "git checkout -q main && printf 'package calc\\n\\n// Sum adds the values.\\nfunc Sum(values []int) int { return 0 }\\n' > calc/sum.go && git add calc && git commit -qm 'feat: sum the values' && git checkout -q feature && git merge -q --no-edit main"
    - 'for i in 4 5; do printf "package calc\n\n// F$i is $i.\nfunc F$i() int { return $i }\n" > calc/f$i.go && git add calc/f$i.go && git commit -qm "feat: add f$i"; done'
    - "printf 'Even more words.\\n' >> README.md && git commit -qam 'docs: say even more'"
    - 'i=6; printf "package calc\n\n// F$i is $i.\nfunc F$i() int { return $i }\n" > calc/f$i.go && git add calc/f$i.go && git commit -qm "feat: add f$i"'
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge:
    merge-requests:
      - id: 5
        labels: []
        comments:
          - "Every lens that blocks read the change.\n<!-- workline:warn-apart -->\n\n<!-- workline:record reviewed=@reviewed@ runs=1 read=all -->\n\n<!-- workline:sticky=reviewer/summary -->"
          - "Every lens that warns read the change.\n\n<!-- workline:record reviewed=@reviewed@ runs=1 read=all -->\n\n<!-- workline:sticky=reviewer/warn -->"
run: {route: merge-request, warn-only: true, input: {range: main..HEAD, draft: "false"}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  calls: [{task: part, for: 1-edge-cases}]
  findings: [{rule: commits-left, level: warn, message: "6 new commits change code, past the 5 the lenses that warn read a push (commits-per-push): the oldest 5 read; the 1 left"}]
  run-files:
    in/parts/1-edge-cases/task.md:
      contains: ["### calc/f1.go", "### calc/f5.go", "feat: add f5"]
      not-contains: ["### calc/f6.go", "feat: add f6", "### calc/sum.go"]
  forge:
    merge-requests:
      - id: 5
        comments: 2
        comment-contains: ["8 of the 9 new commits read, 1 left for the next push", " runs=2 read=all left-by=edge-cases -->"]
