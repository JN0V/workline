case: reviewer/lens-given-new-commits-files
about: A lens is given the files the commits not reviewed yet change, not every file of the merge request.
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "mkdir -p .git/workline && echo \"<!-- workline:record reviewed=$(git rev-parse HEAD) runs=1 -->\" > .git/workline/reviewer-record"
    - "printf 'package calc\\n\\n// Half halves a count.\\nfunc Half(n int) int { return n / 2 }\\n' > calc/half.go && git add calc/half.go && git commit -qm 'feat: halve a count'"
run: {role: reviewer, event: merge-request, input: {range: main..HEAD}, ai: "fake:review-nothing"}
expect:
  status: pass
  agent-calls: 1
  run-files:
    in/parts/1-edge-cases/task.md: {contains: "### calc/half.go", not-contains: "### calc/calc.go"}
