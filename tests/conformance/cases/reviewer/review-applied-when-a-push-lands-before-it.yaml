case: reviewer/review-applied-when-a-push-lands-before-it
about: "A push lands while the run before it waits to be applied (#375). The push's judging job waits for that apply: one lock a pull request, which the judging and the applying jobs share. The apply, as GitHub's job of the base runs it, finds the branch moved on from the head its run judged: only the review of that head is applied, its summary comment and the record in it, said; never a patch, a label nor a verdict. The push's run reads that record: it reviews only the new commit, and the judge is not asked again. The comment keeps both runs' commits and the line of the finding the first judged (ADR-0046)."
given:
  repo: reviewed
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count' && git push -q origin feature"
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge: {merge-requests: [{id: 5, branch: feature, labels: [], comments: []}]}
run:
  role: reviewer
  event: merge-request
  input: {range: main..HEAD, lenses: correctness}
  target: {merge-request: 5}
  ai: "cmd:sh $FIXTURES/agents/review-calc-only.sh"
  no-apply: true
  then: applied-between
  pushed:
    - "printf 'package calc\\n\\n// Half halves a count.\\nfunc Half(n int) int { return n / 2 }\\n' > calc/half.go && git add calc/half.go && git commit -qm 'feat: halve a count' && git push -q origin feature"
  apply-from: {merge-request: 5, base: main}
expect:
  status: pass
  findings:
    - {rule: moved-on, level: warn, where: feature, message: "only the review of that head applied"}
  # The first run: its lens, then the judge. The push's: its lens alone.
  agent-calls: 3
  forge:
    merge-requests:
      - id: 5
        comments: 1
        comment-contains:
          - " runs=2 -->"
          - "<!-- workline:judged-lines gone=0 -->\n<!-- workline:judged {\"lens\":\"correctness\",\"where\":\"calc/calc.go:11\",\"at\":\""
