case: reviewer/spec-owners-verification-is-the-testers
about: "An issue whose Verification the product owner wrote before ADR-0066, as its state records it (#847): an important finding there is the tester's now, answered as it writes the tests; it holds nothing from ready, and the product owner is not named."
given:
  repo: reviewed
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 4
        title: The mean of no values
        body: "## Need\n\nAverage gives 0 for an empty list.\n\n## Verification\n\nThe mean works well.\n\n## Validation\n\nThe maintainer reads the test.\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments: ["```yaml\nsources: [calc/calc.go]\nconfirmed: d8c4dff\njudged: d8c4dff\nwrote: {Verification: ceb0e3889bbd}\n```\n\n<!-- workline:sticky=product-owner/state -->"]
    merge-requests: []
run: {role: reviewer, event: schedule, ai: "fake:review-spec-forge-verification"}
expect:
  status: pass
  findings: [{rule: unverifiable, where: "#4:7"}]
  forge:
    issues:
      - id: 4
        comments: 2
        comment-contains: ["**Holds nothing**: 1 important finding open, round 1 of 5. Verification, the tester's: it answers it as it writes the tests, after ready, and holds nothing back.", "in=Verification -->"]
        comment-lacks: ["a person's", "the product owner's", "Holds it from ready"]
