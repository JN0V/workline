case: reviewer/spec-without-ai-questions-still-asked
about: "On the forge with no agent (#433), the specs that wait are not read, each said, nothing written on them; an issue whose rounds are spent is still put to a person, which needs no agent, wherever it lies in the backlog's order."
given:
  repo: reviewed
  forge:
    issues:
      - id: 4
        title: The mean of no values
        body: "## Need\n\nAverage gives 0 for an empty list.\n\n## Verification\n\nA test of Average on [] expects 0.\n\n## Validation\n\nThe maintainer reads the test.\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 6
        title: Every row exported
        body: "## Need\n\nEvery row exported.\n\n## Verification\n\nA test writes three rows.\n\n## Validation\n\nAnn opens a known day.\n\n## Scope\n\nsrc/export/csv.go"
        labels: [workline:to-refine]
        comments: ["```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
      - id: 8
        title: The median of no values
        body: "## Need\n\nMedian gives 0 for an empty list.\n\n## Verification\n\nA test of Median on [] expects 0.\n\n## Validation\n\nThe maintainer reads the test.\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments:
          - "```yaml\nsources: []\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline reviewer**, its spec — 1 findings on the spec.\n\n<!-- workline:spec-review body=000000000000 round=5 open=1 in=Need -->\n\n<!-- workline:sticky=reviewer/spec -->"
    merge-requests: []
run: {role: reviewer, event: schedule, ai: none}
expect:
  status: pass
  agent-calls: 0
  findings:
    - {rule: not-reviewed, where: "#4", level: warn}
    - {rule: not-reviewed, where: "#6", level: warn}
    - {rule: spec-rounds-spent, where: "#8"}
  summary: "no agent: the 2 specs were not reviewed; #8: 1 important finding still open after 5 rounds"
  forge:
    issues:
      - {id: 4, comments: 1}
      - {id: 6, comments: 1}
      - {id: 8, comments: 2, comment-contains: ["**Question for a person**", "round=5 open=1 in=Need stopped -->"]}
