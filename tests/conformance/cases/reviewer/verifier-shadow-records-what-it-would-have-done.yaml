case: reviewer/verifier-shadow-records-what-it-would-have-done
about: "With `verifier: shadow`, a person reading the run's summary sees what the verifier would have done: its answer on the findings, and the findings it added; the review itself is unchanged."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config: {roles: {reviewer: {settings: {verifier: shadow, ai-findings: {correctness: block}}}}}
run: {role: reviewer, event: review, input: {range: main..HEAD, lenses: correctness}, ai: "fake:review-related", summary: true}
expect:
  status: block
  agent-calls: 3
  findings:
    - {rule: correctness, where: "calc/calc.go:11", message: "Important: Average divides by one less than the count"}
  summary-file: ["verifier"]
