case: reviewer/picker-a-symbol-past-the-first-lines
about: >
  The code picker's contract, the reviewer's side (ADR-0063, step 4), on
  DomoticsCore's own code as the C++ trial had it: #1056, the trial's
  #37: two static members of an 894-line header, declared at its top and
  defined at its end. The spec's lenses are given the code it names.
given:
  repo: reviewed
  setup:
    - |
      cp -R "$FIXTURES/code/domoticscore/." .
      git add . && git commit -qm 'feat: DomoticsCore, frozen from the C++ trial'
    - |
      mkdir -p docs && cat > docs/spec.md <<'MD'
      # `wsBuffer_` and `bufferLock_` defined in a header

      ## Need

      `wsBuffer_` and `bufferLock_` are declared in `DomoticsCore-WebUI/include/DomoticsCore/WebUI.h` (lines 82-83). Check where each is defined: two sources that include it fail to link.
      MD
run: {review: [--spec, docs/spec.md], ai: "fake:review-nothing"}
expect:
  agent-calls: 1
  run-files:
    in/parts/1-lenses/task.md:
      contains: ["char WebUIComponent::wsBuffer_[WEBUI_WS_BUFFER_SIZE];", "HAL::Platform::RecursiveLock WebUIComponent::bufferLock_;"]
