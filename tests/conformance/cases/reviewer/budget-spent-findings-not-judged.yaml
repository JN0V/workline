case: reviewer/budget-spent-findings-not-judged
about: "Once the run has spent its ai-max-tokens, the judge is not asked: the finding is shown not verified, the run says why, and the commits are not recorded as reviewed (#147)."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config: {roles: {reviewer: {settings: {ai-max-tokens: 1000}}}}
run: {role: reviewer, event: review, input: {range: main..HEAD, lenses: correctness}, ai: "fake:review-costly"}
expect:
  status: pass
  agent-calls: 1
  findings:
    - {rule: correctness, where: "calc/calc.go:11", message: "not verified: not asked: the run spent its ai-max-tokens"}
    - {rule: review-not-whole, message: "1 finding not judged"}
    - {rule: ai-max-tokens}
  run-files: {out/review.json: {contains: '"complete": false'}}
