case: reviewer/claim-block-goes-on-a-commit-elsewhere
about: "A claim's block stands on a line the change kept, in a file the change may never touch again (#1415). The author pushes a commit to another file: the claims lens reads the change again, its turn or not, and finds nothing: the block goes."
given:
  repo: reviewed
  setup:
    - "sed -i 's|^\\t\\ttotal += v$|\\t\\t// negative values are skipped\\n\\t\\ttotal += v|' calc/calc.go && git commit -qam 'feat: skip negative values' -m 'Average now skips negative values.'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - "printf 'package calc\\n\\n// Positive keeps the values over zero.\\nfunc Positive(values []int) []int { return values }\\n' > calc/positive.go && git add calc/positive.go && git commit -qm 'feat: keep the positive values'"
  config: {roles: {reviewer: {settings: {ai-findings: block}}}}
  forge:
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments:
          - |
            **workline reviewer** — 1 findings on the change; lenses: claims; the author fixes what blocks.

            <!-- workline:record reviewed=@reviewed@ runs=1 -->
            <!-- workline:blocks [{"lens":"claims","at":"@reviewed@","where":"calc/calc.go:10","title":"Important: Negative values are still summed","cause":{"path":"calc/calc.go","quote":"total += v"},"side":"claim"}] -->

            <!-- workline:sticky=reviewer/summary -->
run: {role: reviewer, event: merge-request, input: {range: main..HEAD}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  no-findings: [{rule: claims}]
  forge:
    merge-requests:
      - {id: 5, comments: 1, comment-contains: " runs=2 -->", comment-lacks: ["**blocks**", "workline:blocks"]}
