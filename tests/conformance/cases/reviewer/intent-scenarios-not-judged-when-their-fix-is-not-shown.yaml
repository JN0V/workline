case: reviewer/intent-scenarios-not-judged-when-their-fix-is-not-shown
about: "The developer's fix lies in a commit the lenses are not shown: workline's own, changing the CHANGELOG alone, and a file the reviewer's `ignore` leaves. The intent lens, shown the tester's test alone, leaves the scenario unanswered: what it does not answer may lie in what it was not shown, so it is not judged as shown by nothing; said (scenario-unasked), no finding, no judge asked."
given:
  repo: reviewed
  setup:
    - "git checkout -q main && printf '# Changelog\\n\\n## 1.2.0\\n\\n- See docs/migration/v1.2.0.md to upgrade.\\n' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'docs: a changelog' && git checkout -q feature && git rebase -q main"
    - "printf 'package calc\\n\\nimport (\\n\\t\"os\"\\n\\t\"regexp\"\\n\\t\"testing\"\\n)\\n\\n// Given the CHANGELOG, When I follow each path it names under docs/,\\n// Then every one exists.\\nfunc TestChangelogDocsPathsExist(t *testing.T) {\\n\\ttext, _ := os.ReadFile(\"../CHANGELOG.md\")\\n\\tfor _, p := range regexp.MustCompile(`docs/[A-Za-z0-9_./-]+`).FindAllString(string(text), -1) {\\n\\t\\tif _, err := os.Stat(\"../\" + p); err != nil {\\n\\t\\t\\tt.Errorf(\"%%s does not exist\", p)\\n\\t\\t}\\n\\t}\\n}\\n' > calc/changelog_test.go && git add calc && git commit -qm 'test: the acceptance tests of #4'"
    - "sed -i 's|See docs/migration/v1.2.0.md to upgrade.|See the notes above to upgrade.|' CHANGELOG.md && git commit -qam 'fix: CHANGELOG references nonexistent docs/migration/' -m 'Workline-Role: developer'"
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {intent: block}}}}
  forge:
    issues:
      - id: 4
        title: CHANGELOG references nonexistent docs/migration/
        body: "## Need\n\nA user upgrading between versions wants the migration pointer in the CHANGELOG to lead somewhere real.\n\n## Example\n\nThe CHANGELOG mentions `docs/migration/`. A user who looks for it in the repository finds no such folder.\n\n## Validation\n\n- **Link target:** Given the CHANGELOG, When I follow each path it names under `docs/`, Then every one exists.\n\n---\n\n## Verification\n\n- **Link target:** `calc.TestChangelogDocsPathsExist`.\n\n## Scope\n\n`CHANGELOG.md` and `docs`.\n"
        labels: []
        comments: []
    merge-requests:
      - {id: 5, branch: workline/developer/4, title: "fix: CHANGELOG references nonexistent docs/migration/", body: "Closes #4\n\n## Changes\n\n- Code: `CHANGELOG.md`.\n- The tester's acceptance tests: `calc/changelog_test.go`.\n", labels: [], comments: []}
run: {route: merge-request, input: {range: main..HEAD, lenses: intent}, target: {merge-request: 5}, ai: "fake:review-nothing", no-apply: true}
expect:
  status: pass
  calls: [{task: part, for: 1-intent}]
  findings:
    - {rule: scenario-unasked, where: "#4", message: "CHANGELOG.md"}
  no-findings: [{rule: intent}]
