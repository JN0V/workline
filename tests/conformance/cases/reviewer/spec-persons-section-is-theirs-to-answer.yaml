case: reviewer/spec-persons-section-is-theirs-to-answer
about: "An issue a person wrote whole, refined by the product owner with nothing to add (#847): the reviewer holds it with an important finding in its Verification. The Verification is the person's, neither a draft of the product owner's nor a text as it wrote it: the comment says the person answers it, or accepts the issue as it reads, never that the product owner rewrites it."
given:
  repo: reviewed
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 4
        title: The mean of no values
        body: "## Need\n\nAverage gives 0 for an empty list.\n\n## Verification\n\nThe mean works well.\n\n## Validation\n\nThe maintainer reads the test.\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments: ["```yaml\nsources: [calc/calc.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]
    merge-requests: []
run: {role: reviewer, event: schedule, ai: "fake:review-spec-forge-verification"}
expect:
  status: pass
  findings: [{rule: unverifiable, where: "#4:7"}]
  forge:
    issues:
      - id: 4
        comments: 2
        comment-contains: ["**Holds it from ready**: 1 important finding open, round 1 of 5. Verification, a person's: the product owner never rewrites it and asks its reporter; a person answers, editing it, or accepts the issue as it reads with `workline:accepted`.", "in=Verification -->"]
        comment-lacks: "rewrites it at its next refine"
