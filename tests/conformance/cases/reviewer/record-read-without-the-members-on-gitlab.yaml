case: reviewer/record-read-without-the-members-on-gitlab
about: "On GitLab, a token that may not list the project's members — 401, the job's own on a self-managed instance (#552) — still reads the merge request's notes: the reviewer reads its record in its summary comment, which needs no author's access level, and reviews only the commit pushed since. No record-unread: the push costs no whole review."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/\" \"$FORGE_FILE\""
    - "printf 'package calc\\n\\n// Half halves a count.\\nfunc Half(n int) int { return n / 2 }\\n' > calc/half.go && git add calc/half.go && git commit -qm 'feat: halve a count'"
  forge:
    members-refused: 401
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments: ["Reviewed.\n\n<!-- workline:record reviewed=@reviewed@ runs=1 -->\n\n<!-- workline:sticky=reviewer/summary -->"]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD}, target: {merge-request: 5}, ai: "fake:review-nothing", summary: true, forge: gitlab}
expect:
  status: pass
  agent-calls: 1
  no-findings: [{rule: record-unread}]
  summary-lacks: [record-unread]
  run-files:
    in/parts/1-edge-cases/task.md: {contains: "### calc/half.go", not-contains: "### calc/calc.go"}
  forge:
    merge-requests:
      - {id: 5, comments: 1, comment-contains: " runs=2 -->"}
