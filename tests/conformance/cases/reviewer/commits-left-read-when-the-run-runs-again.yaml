case: reviewer/commits-left-read-when-the-run-runs-again
about: "The commits the lenses that warn left past five a push (ADR-0050, step 6) are read when the run runs again on the same head, as at the next push: the record holds the five read, so the second run reads the two left alone, and leaves none."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - 'for i in 1 2 3 4 5 6 7; do printf "package calc\n\n// F$i is $i.\nfunc F$i() int { return $i }\n" > calc/f$i.go && git add calc/f$i.go && git commit -qm "feat: add f$i"; done'
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge:
    merge-requests:
      - id: 5
        labels: []
        comments:
          - "Every lens that blocks read the change.\n<!-- workline:warn-apart -->\n\n<!-- workline:record reviewed=@reviewed@ runs=1 read=all -->\n\n<!-- workline:sticky=reviewer/summary -->"
          - "Every lens that warns read the change.\n\n<!-- workline:record reviewed=@reviewed@ runs=1 read=all -->\n\n<!-- workline:sticky=reviewer/warn -->"
run: {route: merge-request, warn-only: true, input: {range: main..HEAD, draft: "false"}, target: {merge-request: 5}, ai: "fake:review-nothing", then: again}
expect:
  status: pass
  # The turn moves on: edge-cases, then tests.
  calls: [{task: part, for: 1-edge-cases}, {task: part, for: 1-tests}]
  run-files:
    in/parts/1-tests/task.md:
      contains: ["### calc/f6.go", "### calc/f7.go"]
      not-contains: ["### calc/f5.go", "### calc/f1.go"]
  forge:
    merge-requests:
      - id: 5
        comments: 2
        comment-contains: [" runs=3 read=all -->"]
        comment-lacks: "commits-left"
