case: reviewer/verifier-shadow-refused-gives-no-answer
about: "With `verifier: shadow`, a verifier that refuses (its answer does not read) harms nothing: the review ends as it would without the verifier, and one summary line says the verifier gave no answer."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config: {roles: {reviewer: {settings: {verifier: shadow, ai-findings: {correctness: block}}}}}
run: {role: reviewer, event: review, input: {range: main..HEAD, lenses: correctness}, ai: "fake:review-related-then-refuses"}
expect:
  status: block
  agent-calls: 3
  findings:
    - {rule: correctness, where: "calc/calc.go:11", message: "Important: Average divides by one less than the count"}
  summary: "verifier gave no answer"
