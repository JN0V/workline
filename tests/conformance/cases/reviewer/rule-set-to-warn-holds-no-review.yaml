case: reviewer/rule-set-to-warn-holds-no-review
about: "A project sets a rule to warn (`enforce: {internal-code: warn}`, #550): its finding is shown as a warning and never holds the review. The push's lens is asked, and the review passes, its comment saying the rule warns."
given:
  repo: reviewed
  setup:
    - "printf '\\n// Double returns twice n (PROJ-12).\\nfunc Double(n int) int { return 2 * n }\\n' >> calc/calc.go && git commit -qam 'feat: double a count'"
  config: {roles: {reviewer: {enforce: {internal-code: warn}}}}
  forge:
    issues: []
    merge-requests: [{id: 5, labels: [], comments: []}]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  agent-calls: 1
  findings: [{rule: internal-code, level: warn, where: "calc/calc.go:20", message: "PROJ-12"}]
  forge:
    merge-requests:
      - {id: 5, comments: 1, comment-contains: ["| warns | internal-code |", " runs=1 -->"]}
