case: reviewer/intent-answers-each-validation-scenario
about: "The intent lens reads the issue's Example, Steps to reproduce and Validation with its Need, and answers each Validation scenario: the code doing it and the test proving it quoted, or a finding. A scenario shown by code and test found again at the head is no finding; one whose code is not found, one with no test, or one the lens leaves unanswered becomes an important finding on the issue, judged: silence is never \"no finding\"."
given:
  repo: reviewed
  setup:
    - "sed -i 's|^\\ttotal := 0|\\tif len(values) == 0 {\\n\\t\\treturn 0\\n\\t}\\n\\ttotal := 0|' calc/calc.go && printf 'package calc\\n\\nimport \"testing\"\\n\\nfunc TestAverageEmpty(t *testing.T) {\\n\\tif Average(nil) != 0 {\\n\\t\\tt.Fatal(\"not 0\")\\n\\t}\\n}\\n' > calc/calc_test.go && git add calc && git commit -qm 'fix: an empty list averages 0' -m 'Closes #4.'"
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 4
        title: The mean survives an empty list
        body: "## Need\n\nAn empty list gives 0 instead of a crash.\n\n## Example\n\nAverage([]) gives 0.\n\n## Validation\n\n- **Empty list:** Given no values, When the mean is asked, Then it is 0.\n- **Zeros skipped:** Given [0, 2, 4], When the mean is asked, Then it is 3.\n- **Negatives kept:** Given [-2, 4], When the mean is asked, Then it is 1.\n- **Odd count:** Given [1, 2], When the mean is asked, Then it is 1.\n- **Said in the comment:** Given the code, When a person reads Average, Then its comment says the mean.\n\n## Scope\n\ncalc/calc.go\n"
        labels: []
        comments: []
    merge-requests: []
run: {role: reviewer, event: review, input: {range: main..HEAD, lenses: intent}, ai: "fake:review-intent-scenarios"}
expect:
  status: pass
  calls: [{task: part, for: 1-intent}, {task: judge, for: judge/01}, {task: judge, for: judge/02}, {task: judge, for: judge/03}]
  findings:
    - {rule: intent, where: "#4", message: "No code and test shown for the scenario \"Zeros skipped\""}
    - {rule: scenario-unshown, message: "the scenario \"Zeros skipped\", shown done: its code doing it is not found in calc/calc.go"}
    - {rule: scenario-unshown, message: "the scenario \"Negatives kept\", shown done: it quotes no test proving it"}
    - {rule: scenario-no-test, where: "#4", message: "the scenario \"Said in the comment\" is shown done by its code, no test proving it: a comment is read, never run"}
  no-findings: [{rule: intent, message: "Empty list"}, {rule: intent, message: "Said in the comment"}]
  run-files:
    in/parts/1-intent/task.md: {contains: "#### Validation\n\n- **Empty list:** Given no values"}
