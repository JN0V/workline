case: reviewer/tests-thread-resolved-by-a-test-named-after-the-file
about: "A tests-lens conversation is resolved once a later commit adds the test it asks for, wherever the project keeps its tests (#1417): Gradle's calc/src/test/kotlin/calc/GridTest.kt tests calc/src/main/kotlin/calc/Grid.kt, in another folder and never naming Grid as a word, but named after it. The tests lens reads it, finds nothing, and the conversation no longer holds a base requiring every conversation resolved, as a test beside its code did (#1039)."
given:
  repo: kotlin-tested
  setup:
    - "git checkout -q -b feature && printf 'package calc\\n\\nfun computeGrid(width: Int): List<Int> = listOf(width / 3, 2 * width / 3)\\n' > calc/src/main/kotlin/calc/Grid.kt && git add calc && git commit -qm 'feat: a grid in thirds'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - "printf 'package calc\\n\\nimport org.junit.jupiter.api.Test\\n\\nclass GridTest {\\n    @Test\\n    fun `thirds of nine`() {\\n        check(computeGrid(9) == listOf(3, 6))\\n    }\\n}\\n' > calc/src/test/kotlin/calc/GridTest.kt && git add calc && git commit -qm 'fix: the review findings, round 1'"
  forge:
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments:
          - |
            **workline reviewer** — 1 finding on the change; lenses: tests.

            <!-- workline:record reviewed=@reviewed@ runs=1 -->

            <!-- workline:sticky=reviewer/summary -->
        threads:
          - {path: calc/src/main/kotlin/calc/Grid.kt, line: 3, body: "**workline reviewer** · warns · tests\n\n**Important: computeGrid is untested**\n\n<!-- workline:line=tests/f9a7b8499476 -->"}
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: tests}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  forge:
    merge-requests:
      - id: 5
        comment-contains: ["**Resolved**: 1 conversation"]
        threads:
          - {path: calc/src/main/kotlin/calc/Grid.kt, line: 3, resolved: true}
