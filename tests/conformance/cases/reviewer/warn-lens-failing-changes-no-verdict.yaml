case: reviewer/warn-lens-failing-changes-no-verdict
about: "On ready, split (ADR-0050): the verdict's run asks correctness, whose verified finding blocks; the run apart asks the lenses that warn together, whose answer never reads, asked twice. It says so in its own comment, and its record is not moved: the next push asks them again. The verdict stays the block it was: a lens that fails never turns a fail into a pass, nor a pass into a fail."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml", REVIEW_LENS_BROKEN: edge-cases}
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge: {merge-requests: [{id: 5, labels: [], comments: []}]}
run: {route: merge-request, warn-apart: true, then: apart, input: {range: main..HEAD, lenses: all}, target: {merge-request: 5}, ai: "cmd:sh $FIXTURES/agents/review-by-lens.sh"}
expect:
  status: block
  apart-status: pass
  calls: [{task: part, for: 1-correctness}, {task: judge, for: judge/01}, {task: part, for: 1-lenses}, {task: part, for: 1-lenses}]
  findings:
    - {rule: correctness, where: "calc/calc.go:11", message: "Important: Average divides by one less than the count"}
    - {rule: lens-failed, level: warn, message: "the lenses edge-cases, tests, claims, asked together, got no answer that reads"}
  forge:
    merge-requests:
      - id: 5
        comments: 2
        comment-contains:
          - "| **blocks** | correctness |"
          - "**workline reviewer, the lenses that warn** — 0 findings on the change; lenses: edge-cases, tests, claims; not every lens answered: not reviewed whole"
          - "| warns | lens-failed |"
          - "not every lens answered on the run on ready: the next push asks every lens again"
