case: reviewer/ai-findings-lens-unnamed-warns
about: "ai-findings set by lens: a lens the map does not name takes the default, warn (#222)."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  config: {roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}}
run: {role: reviewer, event: review, input: {range: main..HEAD, lenses: tests}, ai: "fake:review-related", reports: true}
expect:
  status: pass
  sarif: [{rule: reviewer/tests, uri: calc/calc.go, line: 11, level: warning}]
