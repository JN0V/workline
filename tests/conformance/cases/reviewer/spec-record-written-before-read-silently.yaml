case: reviewer/spec-record-written-before-read-silently
about: "A record an engine before #300 hid in the reviewer's comment on a spec — its sections by heading, letters only, unescaped — still reads (#302): nothing is said of it, and its rounds count, the spec changed since read again as round 2."
given:
  repo: reviewed
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 4
        title: The mean of no values
        body: "## Need\n\nAverage gives 0 for an empty list, and the README tells the users.\n\n## Verification\n\nA test of Average on [] expects 0.\n\n## Validation\n\nThe maintainer reads the test.\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments:
          - "```yaml\nsources: [calc/calc.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline reviewer**, its spec.\n\n<!-- workline:spec-review body=000000000000 round=1 open=2 in=Need,Scope -->\n\n<!-- workline:sticky=reviewer/spec -->"
    merge-requests: []
run: {role: reviewer, event: schedule, ai: "fake:review-spec-out-of-scope"}
expect:
  status: pass
  calls: [{task: part, for: 1-lenses}, {task: judge, for: judge/01}]
  findings: [{rule: out-of-scope, where: "#4:3", message: "verified"}]
  no-findings: [{rule: spec-record-unread, where: "#4"}]
  forge:
    issues:
      - {id: 4, comments: 2, comment-contains: ["round 2 of 5", "round=2 open=1 in=Need -->"]}
