case: reviewer/warn-lenses-answered-read-nothing-when-run-again
about: "The guard of #588: the push after a failed run on ready apart (`retried=once`) asks the lenses that warn again, and they answer. The 4 commits are recorded, and every lens read the change (`read=all`). The run run again on the same head asks nobody: nothing is new, and none of them owes a commit."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - 'for i in 1 2 3; do printf "package calc\n\n// F$i is $i.\nfunc F$i() int { return $i }\n" > calc/f$i.go && git add calc/f$i.go && git commit -qm "feat: add f$i"; done'
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge:
    merge-requests:
      - id: 5
        labels: []
        comments: ["Not every lens answered.\n\n<!-- workline:record reviewed= runs=0 retried=once -->\n\n<!-- workline:sticky=reviewer/warn -->"]
run: {route: merge-request, warn-only: true, input: {range: main..HEAD, draft: "false"}, target: {merge-request: 5}, ai: "fake:review-nothing", then: again}
expect:
  status: pass
  calls: [{task: part, for: 1-lenses}]
  no-findings: [{rule: lens-failed}, {rule: every-lens-again}, {rule: every-lens-not-whole}]
  forge:
    merge-requests:
      - id: 5
        comments: 1
        comment-contains: ["lenses: edge-cases, tests, claims", " runs=1 read=all -->"]
        comment-lacks: "failed="
