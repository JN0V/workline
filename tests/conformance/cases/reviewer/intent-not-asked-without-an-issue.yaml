case: reviewer/intent-not-asked-without-an-issue
about: "A change closing no issue has nothing to be compared with: the intent lens is not asked, its tokens not spent, and the summary says so (#126)."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count' -m 'Refs #4.'"]
run: {role: reviewer, event: review, input: {range: main..HEAD}, ai: "fake:review-nothing"}
expect:
  status: pass
  calls: [{task: part, for: 1-lenses}]
  summary: "not asked: intent (the change closes no issue)"
  run-files:
    in/parts/1-lenses/task.md: {contains: "## Lens: claims", not-contains: "## Lens: intent"}
