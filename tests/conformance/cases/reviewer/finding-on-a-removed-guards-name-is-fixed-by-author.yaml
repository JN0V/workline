case: reviewer/finding-on-a-removed-guards-name-is-fixed-by-author
about: "A change removes the guard on p from Page; a lens finds the defect it opens on a later use of p, a kept line more than three lines below (#357). In the same function, the line uses a name the removed lines tested: the finding is the change's, for its author, its comment on the line where the guard was. No agent decides it."
given:
  repo: shop
  setup:
    - |
      cat > shop/page.go <<'GO'
      package shop

      // Page returns page p of the items, counted from 1, size items a page;
      // nil past the last page, or for a page below 1. A size below 1 is 10.
      func Page(items []Item, p, size int) []Item {
      	if p < 1 {
      		return nil
      	}
      	if size < 1 {
      		size = 10
      	}
      	count := len(items)
      	last := (count + size - 1) / size
      	if p > last {
      		return nil
      	}
      	from := (p - 1) * size
      	to := min(from+size, count)
      	return items[from:to]
      }
      GO
      git commit -qam 'feat(page): a size below 1 is 10'
      git checkout -q -b feature
      sed -i '6,8d' shop/page.go
      git commit -qam 'refactor(page): the last page check is enough'
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues: []
    merge-requests: [{id: 5, labels: [], comments: []}]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: correctness}, target: {merge-request: 5}, ai: "fake:review-guard-removed"}
expect:
  status: pass
  agent-calls: 2
  applied: [comment]
  findings: [{rule: correctness, where: "shop/page.go:14", message: "Important: Page panics on page 0"}]
  no-findings: [{rule: line-comment-refused}]
  forge:
    issues: []
    merge-requests:
      - id: 5
        comments: 1
        comment-contains: "`shop/page.go:14`"
        threads: [{path: shop/page.go, line: 5, contains: "**Important: Page panics on page 0**"}]
