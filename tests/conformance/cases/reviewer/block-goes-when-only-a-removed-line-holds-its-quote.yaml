case: reviewer/block-goes-when-only-a-removed-line-holds-its-quote
about: "A merge request rewrites a line of main; on ready, correctness blocks on the new line, quoting a part both lines hold (#570). The author pushes a fix rewriting the new line: its quote is no longer at the head, only on main's line, which the change removes. A block found on the head's lines is looked for there again: the fix answers it, with no draft and ready."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / len(values) + 1|' calc/calc.go && git commit -qam 'fix: average over one more'"]
  env:
    WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"
    REVIEW_TITLE: Average comes out one more than the mean
    REVIEW_QUOTE: return total / len(values)
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge: {merge-requests: [{id: 5, labels: [], comments: []}]}
run:
  route: merge-request
  warn-apart: true
  input: {range: main..HEAD, draft: "false"}
  target: {merge-request: 5}
  ai: "cmd:sh $FIXTURES/agents/review-quoting.sh"
  then: again
  # The fix: the new line no longer holds the quote; main's, removed, still does.
  again-after: ["sed -i 's|return total / len(values) + 1|return total / max(len(values), 1)|' calc/calc.go && git commit -qam 'fix: average over the count, one at least'"]
expect:
  status: pass
  agent-calls: 2
  calls: [{task: part, for: 1-correctness}, {task: judge, for: judge/01}]
  # The first run's, on ready: found and judged.
  findings: [{rule: correctness, where: "calc/calc.go:11", message: "Average comes out one more than the mean — the mean of [2, 4] is not 3 Fix: return the mean (verified"}]
  forge:
    merge-requests:
      - id: 5
        comments: 1
        comment-contains: ["no lens that blocks on this push", " runs=2 read=all -->"]
        comment-lacks: ["**blocks**", "workline:blocks", "still blocks"]
