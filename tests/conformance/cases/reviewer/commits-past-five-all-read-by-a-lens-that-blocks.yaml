case: reviewer/commits-past-five-all-read-by-a-lens-that-blocks
about: "Five new commits a push caps the lenses that warn only (ADR-0050, step 6): a lens the project blocks on reads every new commit, and a finding that blocked an earlier push still holds the head's verdict while the head still has it. The push brings seven commits elsewhere; correctness, in turn on the verdict's run, reads all seven and not the cause's file again: the block stands."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - 'for i in 1 2 3 4 5 6 7; do printf "package calc\n\n// F$i is $i.\nfunc F$i() int { return $i }\n" > calc/f$i.go && git add calc/f$i.go && git commit -qm "feat: add f$i"; done'
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge:
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments:
          - |
            **workline reviewer** — 1 findings on the change; lenses: correctness; the author fixes what blocks.
            <!-- workline:warn-apart -->

            <!-- workline:record reviewed=@reviewed@ runs=5 read=all -->
            <!-- workline:blocks [{"lens":"correctness","at":"@reviewed@","where":"calc/calc.go:11","title":"Important: Average divides by one less than the count","cause":{"path":"calc/calc.go","quote":"return total / (len(values) - 1)"}}] -->

            <!-- workline:sticky=reviewer/summary -->
run: {route: merge-request, warn-apart: true, input: {range: main..HEAD, draft: "false"}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: block
  calls: [{task: part, for: 1-correctness}]
  findings: [{rule: correctness, level: block, where: "calc/calc.go:11", message: "Average divides by one less than the count"}]
  no-findings: [{rule: commits-left}]
  run-files:
    in/parts/1-correctness/task.md: {contains: ["### calc/f1.go", "### calc/f7.go", "feat: add f7"]}
  forge:
    merge-requests:
      - {id: 5, comments: 1, comment-contains: [" runs=6 read=all -->", "| **blocks** | correctness |", "1 finding of a review before still blocks"]}
