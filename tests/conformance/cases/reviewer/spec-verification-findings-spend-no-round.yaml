case: reviewer/spec-verification-findings-spend-no-round
about: >
  Reviewer's finding (#1261, ADR-0066): five reviews left findings open
  in the tester's Verification alone, which the product owner does not
  answer. They spend no round: the body changed, the reviewer reads it
  again at the same round, puts nothing to a person, and stops nothing.
given:
  repo: reviewed
  forge:
    issues:
      - id: 4
        title: The mean of no values
        body: "## Need\n\nAverage gives 0 for an empty list, and the README tells the users.\n\n## Validation\n\nThe maintainer reads the test.\n\n---\n\n## Verification\n\nIt works.\n\n## Scope\n\ncalc/calc.go\n"
        labels: [workline:to-refine]
        comments:
          - "```yaml\nsources: [calc/calc.go]\nconfirmed: d8c4dff\njudged: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"
          - "**workline reviewer**, its spec.\n\n**Holds nothing**: 1 important finding open, round 5 of 5.\n\n<!-- workline:spec-review body=000000000000 round=5 open=1 in=Verification -->\n\n<!-- workline:sticky=reviewer/spec -->"
    merge-requests: []
run: {role: reviewer, event: schedule, ai: "fake:review-spec-out-of-scope"}
expect:
  status: pass
  no-findings: [{rule: spec-rounds-spent}]
  forge:
    issues:
      - id: 4
        comment-lacks: ["**Question for a person**", " stopped -->"]
        comment-contains: "round=5 "
