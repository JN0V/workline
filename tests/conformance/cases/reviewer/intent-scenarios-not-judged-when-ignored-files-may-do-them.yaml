case: reviewer/intent-scenarios-not-judged-when-ignored-files-may-do-them
about: "A person's change fixes the CHANGELOG, a file the reviewer's `ignore` leaves, and adds the test proving it. The intent lens, shown the test alone, leaves the scenario unanswered: the fix may lie in the file it was not shown, so it is not judged as shown by nothing; said (scenario-unasked), no finding, no judge asked."
given:
  repo: reviewed
  setup:
    - "git checkout -q main && printf '# Changelog\\n\\n## 1.2.0\\n\\n- See docs/migration/v1.2.0.md to upgrade.\\n' > CHANGELOG.md && git add CHANGELOG.md && git commit -qm 'docs: a changelog' && git checkout -q feature && git rebase -q main"
    - "printf 'package calc\\n\\nimport (\\n\\t\"os\"\\n\\t\"strings\"\\n\\t\"testing\"\\n)\\n\\n// Given the CHANGELOG, When I follow each path it names under docs/,\\n// Then every one exists.\\nfunc TestChangelogNamesNoMigrationFolder(t *testing.T) {\\n\\ttext, _ := os.ReadFile(\"../CHANGELOG.md\")\\n\\tif strings.Contains(string(text), \"docs/migration/\") {\\n\\t\\tt.Error(\"docs/migration/ does not exist\")\\n\\t}\\n}\\n' > calc/changelog_test.go && sed -i 's|See docs/migration/v1.2.0.md to upgrade.|See the notes above to upgrade.|' CHANGELOG.md && git add calc CHANGELOG.md && git commit -qm 'fix: the CHANGELOG names no missing docs path' -m 'Closes #4.'"
  env: {WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"}
  forge:
    issues:
      - id: 4
        title: CHANGELOG references nonexistent docs/migration/
        body: "## Need\n\nA user upgrading between versions wants the migration pointer in the CHANGELOG to lead somewhere real.\n\n## Validation\n\n- **Link target:** Given the CHANGELOG, When I follow each path it names under `docs/`, Then every one exists.\n\n## Scope\n\n`CHANGELOG.md`\n"
        labels: []
        comments: []
    merge-requests: []
run: {role: reviewer, event: review, input: {range: main..HEAD, lenses: intent}, ai: "fake:review-nothing"}
expect:
  status: pass
  calls: [{task: part, for: 1-intent}]
  findings:
    - {rule: scenario-unasked, where: "#4", message: "the change touches files the lenses are not shown (CHANGELOG.md)"}
  no-findings: [{rule: intent}]
