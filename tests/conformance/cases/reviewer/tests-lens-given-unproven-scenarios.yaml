case: reviewer/tests-lens-given-unproven-scenarios
about: >
  The scenarios the tester said no test proves, as the developer's pull
  request lists them under Unproven, are given to the tests lens with
  their reasons, once: a test missing where one can prove a scenario is
  its finding, settled the usual way, the tester then the judge. Its
  record says they were given, so no later run asks again.
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  forge:
    merge-requests:
      - {id: 5, branch: workline/developer/4, title: Average over the count, body: "Closes #4\n\n## Changes\n\n- Code: `calc/calc.go`.\n\n## Unproven\n\nScenarios of the issue no test proves, as the tester said, each with its reason.\n\n- **Empty list**: a person reads the error by eye\n\n## Verification\n\n- proven\n", labels: [], comments: []}
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: tests}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  run-files:
    in/parts/1-tests/task.md: {contains: ["The tester said no test proves these scenarios of the issue, each with its reason. For each the change makes testable, a test missing is a finding of this lens, Important", "- **Empty list**: a person reads the error by eye"]}
  forge:
    merge-requests:
      - {id: 5, comment-contains: ["<!-- workline:unproven=asked -->"]}
