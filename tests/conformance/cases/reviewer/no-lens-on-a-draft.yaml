case: reviewer/no-lens-on-a-draft
about: "A push to a draft (`draft=true`) asks no agent, an agent set (ADR-0050): the rules run, no lens, no judge. The review says plainly that it waits for the merge request to be marked ready, never that a person must review it; nothing is posted, so the review before, if any, stands."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  forge:
    issues: []
    merge-requests: [{id: 5, labels: [], comments: []}]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, draft: "true"}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  agent-calls: 0
  applied: []
  findings: [{rule: ai-waits-for-ready, level: warn, message: "a draft: no lens asked; every lens reads the whole change once it is marked ready"}]
  no-findings: [{rule: not-reviewed}]
  summary: "a draft: only the rules ran"
  forge:
    merge-requests:
      - {id: 5, comments: 0}
