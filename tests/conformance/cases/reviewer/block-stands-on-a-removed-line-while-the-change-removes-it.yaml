case: reviewer/block-stands-on-a-removed-line-while-the-change-removes-it
about: "A merge request removes a line of main; on ready, correctness blocks quoting that line, which the head no longer holds (#570). The author pushes a commit elsewhere, the removal left as it was: a block found on a removed line is looked for among the lines the change removes, and stands."
given:
  repo: reviewed
  setup: ["sed -i '/total += v/d' calc/calc.go && git commit -qam 'refactor: drop the sum'"]
  env:
    WORKLINE_JUDGE: "fake:$FIXTURES/agents/judge-yes.yaml"
    REVIEW_TITLE: Average no longer sums the values
    REVIEW_QUOTE: total += v
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge: {merge-requests: [{id: 5, labels: [], comments: []}]}
run:
  route: merge-request
  warn-apart: true
  input: {range: main..HEAD, draft: "false"}
  target: {merge-request: 5}
  ai: "cmd:sh $FIXTURES/agents/review-quoting.sh"
  then: again
  again-after: ["printf 'package calc\\n\\n// Half halves a count.\\nfunc Half(n int) int { return n / 2 }\\n' > calc/half.go && git add calc/half.go && git commit -qm 'feat: halve a count'"]
expect:
  status: block
  agent-calls: 2
  calls: [{task: part, for: 1-correctness}, {task: judge, for: judge/01}]
  findings: [{rule: correctness, level: block, message: "no commit since answers it"}]
  forge:
    merge-requests:
      - id: 5
        comments: 1
        comment-contains: ["no lens that blocks on this push", "| **blocks** | correctness |", "1 finding of a review before still blocks", "<!-- workline:blocks "]
