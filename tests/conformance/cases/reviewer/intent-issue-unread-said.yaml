case: reviewer/intent-issue-unread-said
about: "A change saying `Closes #4` with no forge to read #4 from: the intent lens is not asked, and the run says why, never a silent pass (#126, principle 12)."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count' -m 'Fixes #4'"]
run: {role: reviewer, event: review, input: {range: main..HEAD}, ai: "fake:review-nothing"}
expect:
  status: pass
  findings:
    - {rule: issue-unread, where: "#4", message: "no forge to read it from: the intent lens is not asked"}
  run-files:
    in/parts/1-lenses/task.md: {not-contains: "## Lens: intent"}
