case: reviewer/every-lens-owed-read-on-the-next-push
about: "The push after a run on ready a rule held, the template passing no `lenses`, reads every lens once on the whole change, commits reviewed before too (#129); then nothing is owed, and the record says every lens read the change (#359)."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    # A draft push reviewed it; then the run on ready, a rule holding it, owed every lens.
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/\" \"$FORGE_FILE\""
    - "printf 'package calc\\n\\n// Half halves a count.\\nfunc Half(n int) int { return n / 2 }\\n' > calc/half.go && git add calc/half.go && git commit -qm 'feat: halve a count'"
  forge:
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments: ["Held by a rule.\n\n<!-- workline:record reviewed=@reviewed@ runs=1 owed=all -->\n\n<!-- workline:sticky=reviewer/summary -->"]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  applied: [comment]
  no-findings: [{rule: record-unread}]
  calls: [{task: part, for: 1-lenses}]
  run-files:
    in/parts/1-lenses/task.md: {contains: ["## Lens: correctness", "## Lens: edge-cases", "## Lens: tests", "## Lens: claims", "### calc/calc.go", "### calc/half.go"]}
  forge:
    merge-requests:
      - {id: 5, comments: 1, comment-contains: " runs=2 read=all -->", comment-lacks: "owed"}
