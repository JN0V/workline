case: reviewer/commits-past-five-a-push-left-for-the-next
about: "After the run on ready, the lenses that warn read at most five new commits a push (ADR-0050, step 6; `commits-per-push`). A push brings seven, each adding a file: the run apart reads the oldest five, records them with the lens that left the rest (`left-by=`, #591), and says the two left and how they are read: first at the next push, or when the run runs again."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - 'for i in 1 2 3 4 5 6 7; do printf "package calc\n\n// F$i is $i.\nfunc F$i() int { return $i }\n" > calc/f$i.go && git add calc/f$i.go && git commit -qm "feat: add f$i"; done'
  config:
    routing: {events: {merge-request: [reviewer]}}
    roles: {reviewer: {settings: {ai-findings: {correctness: block}}}}
  forge:
    merge-requests:
      - id: 5
        labels: []
        comments:
          - "Every lens that blocks read the change.\n<!-- workline:warn-apart -->\n\n<!-- workline:record reviewed=@reviewed@ runs=1 read=all -->\n\n<!-- workline:sticky=reviewer/summary -->"
          - "Every lens that warns read the change.\n\n<!-- workline:record reviewed=@reviewed@ runs=1 read=all -->\n\n<!-- workline:sticky=reviewer/warn -->"
run: {route: merge-request, warn-only: true, input: {range: main..HEAD, draft: "false"}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  calls: [{task: part, for: 1-edge-cases}]
  findings: [{rule: commits-left, level: warn, message: "7 new commits change code, past the 5 the lenses that warn read a push (commits-per-push): the oldest 5 read; the 2 left"}]
  run-files:
    in/parts/1-edge-cases/task.md:
      contains: ["### calc/f1.go", "### calc/f5.go", "feat: add f5"]
      not-contains: ["### calc/f6.go", "### calc/f7.go", "feat: add f6"]
  forge:
    merge-requests:
      - id: 5
        comments: 2
        comment-contains: ["5 of the 7 new commits read, 2 left for the next push", " runs=2 read=all left-by=edge-cases -->"]
