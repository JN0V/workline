case: reviewer/every-lens-owed-once-after-a-failed-run-on-ready
about: "The run on ready whose lenses give no answer that reads, after their one retry, does not say every lens read the change (#359): its record says one retry is spent (`retried=once`), and the comment says the next push asks every lens again, once."
given:
  repo: reviewed
  setup: ["sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"]
  forge:
    issues: []
    merge-requests: [{id: 5, labels: [], comments: []}]
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: all, draft: "false"}, target: {merge-request: 5}, ai: "fake:review-unreadable"}
expect:
  status: pass
  findings:
    - {rule: lens-failed}
    - {rule: every-lens-again, level: warn, message: "the next push asks every lens again, on the whole change, once"}
  forge:
    merge-requests:
      - {id: 5, comments: 1, comment-contains: ["| warns | every-lens-again |", " runs=0 retried=once -->"], comment-lacks: "read=all"}
