case: reviewer/warn-thread-resolved-after-the-developers-fix
about: "A warning's conversation on a line is resolved once the developer answered it with a fix pushed, its tests green, and the reviewer's next run does not raise it again, its lens reading the file or not (#1050): a warning asks nothing, and a base requiring every conversation resolved would hold the merge on it with no end. One the developer was not asked stays open while nothing answers it."
given:
  repo: reviewed
  setup:
    - "sed -i 's|return total / len(values)|return total / (len(values) - 1)|' calc/calc.go && git commit -qam 'fix: average over the count'"
    - "sed -i \"s/@reviewed@/$(git rev-parse HEAD)/g\" \"$FORGE_FILE\""
    - "printf 'package calc\\n\\n// Half halves a count.\\nfunc Half(n int) int { return n / 2 }\\n' > calc/half.go && git add calc/half.go && git commit -qm 'fix: the review findings, round 1'"
  forge:
    issues: []
    merge-requests:
      - id: 5
        labels: []
        comments:
          - |
            **workline reviewer** — 2 findings on the change; lenses: correctness, edge-cases.

            <!-- workline:record reviewed=@reviewed@ runs=1 -->

            <!-- workline:sticky=reviewer/summary -->
          - "**The developer**'s record of this pull request.\n\n- Review round 1: 1 asked, its fix pushed, the tests green.\n\n<!-- workline:developer-act {\"act\":\"code\",\"issue\":3,\"rounds\":[{\"n\":1,\"asked\":[\"warns edge-cases `calc/calc.go:11`: Important: Average divides by one less than the count\"],\"result\":\"green\"}]} -->\n<!-- workline:sticky=developer/code -->"
        threads:
          - {path: calc/calc.go, line: 11, body: "**workline reviewer** · warns · edge-cases\n\n**Important: Average divides by one less than the count**\n\n<!-- workline:line=edge-cases/d861c7fa46d7 -->"}
          - {path: calc/calc.go, line: 11, body: "**workline reviewer** · warns · correctness\n\n**Important: Average of no values divides by zero**\n\n<!-- workline:line=correctness/d861c7fa46d7 -->"}
run: {role: reviewer, event: merge-request, input: {range: main..HEAD, lenses: correctness}, target: {merge-request: 5}, ai: "fake:review-nothing"}
expect:
  status: pass
  applied: [comment]
  forge:
    merge-requests:
      - id: 5
        comment-contains: "**Resolved**: 1 conversation"
        threads:
          - {path: calc/calc.go, line: 11, resolved: true}
          - {path: calc/calc.go, line: 11, resolved: false}
