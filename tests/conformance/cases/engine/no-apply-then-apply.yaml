case: engine/no-apply-then-apply
about: A run judged with --no-apply writes nothing; `workline apply` then applies it, without the agent.
given: {repo: released, config: {roles: {release-manager: {settings: {flow: direct}}}}}
run: {role: release-manager, event: release, ai: "fake:release-with-notes", no-apply: true, then: resume}
expect: {status: pass, agent-calls: 1, applied: [patch, release], files: {CHANGELOG.md: {contains: "## v1.3.0"}}}
