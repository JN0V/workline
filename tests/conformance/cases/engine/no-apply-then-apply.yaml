case: engine/no-apply-then-apply
about: A run judged with --no-apply writes nothing; `workline apply` then applies it, without the agent.
given: {repo: released}
run: {role: hands-over, event: merge, ai: "fake:changelog-entry", no-apply: true, then: resume}
expect: {status: pass, agent-calls: 1, applied: [patch], files: {CHANGELOG.md: {contains: "## Unreleased"}}}
