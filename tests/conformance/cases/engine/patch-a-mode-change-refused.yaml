case: engine/patch-a-mode-change-refused
about: "A patch changing a file's mode — a doc made executable — is refused: a role writes text. Read from a merge request's own run (#331): nothing of the run is pushed."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, labels: [], comments: []}]}
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  push-to-merge-request: true
  no-apply: true
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: feature
    intents:
      - patch: |
          diff --git a/docs/product/sign-in.md b/docs/product/sign-in.md
          old mode 100644
          new mode 100755
expect:
  status: block
  findings: [{rule: engine-error, message: "mode"}]
  pushed: {feature: {docs/tech/auth.md: "Access tokens last one hour."}}
