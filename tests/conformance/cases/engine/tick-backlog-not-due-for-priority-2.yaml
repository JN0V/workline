case: engine/tick-backlog-not-due-for-priority-2
about: >
  Issue 41 is priority 2 with no state label, labelled at 10:00; the last backlog run started at 09:00, Ready is full: the tick, at 10:20, lists no backlog run, as before (Priority 2 unchanged).
given:
  repo: basic
  config:
    routing: {events: {schedule: [product-owner], issue: [tester, developer]}, wip: {ready: 2}}
  forge:
    issues:
      - {id: 1, title: "Item 1", body: "x", labels: ["workline:ready"]}
      - {id: 2, title: "Item 2", body: "x", labels: ["workline:ready"]}
      - id: 41
        title: "Item 41"
        body: "x"
        labels: ["workline:priority/2"]
        label-events: [{label: "workline:priority/2", added: true, created: "2026-11-16T10:00:00Z"}]
    runs:
      - {name: "workline gardening backlog", workflow: workline-gardening.yml, status: completed, success: true, started: "2026-11-16T09:00:00Z", updated: "2026-11-16T09:05:00Z"}
run: {cli: [tick, --forge, "fake:../forge.json", --now, "2026-11-16T10:20:00Z", --json]}
expect:
  exit: 0
  stdout: ['{"job":"reconcile"']
  stdout-lacks: ['"job":"backlog"']
