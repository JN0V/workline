case: engine/patch-comment-without-a-fence
about: 'A patch that cannot be pushed goes in a comment (#145). Its diff holds no backtick: the comment reads as it always did, the diff in a fence of three backticks.'
given:
  repo: basic
  setup:
    - "mkdir docs && printf '# Usage\\n\\nRun the tool.\\nIt prints a line.\\nIt stops.\\n' > docs/usage.md && git add docs && git commit -qm 'docs: say how to run the tool'"
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && echo 'func quiet() {}' >> main.go && git commit -qam 'feat: run quietly' && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, fork: true, labels: [], comments: []}]}
run: {role: fixes-a-doc, event: merge-request, target: {merge-request: 1}, ai: "fake:doc-gains-a-sentence", push-to-merge-request: true}
expect:
  status: pass
  findings: [{rule: patch-as-comment, message: "fork"}]
  forge:
    merge-requests:
      - id: 1
        comments: 1
        comment-contains:
          - "Apply it with `git apply`:\n\n```diff\ndiff --git a/docs/usage.md b/docs/usage.md\n"
          - "-It stops.\n+It stops when done.\n```"
        comment-lacks: ["````"]
