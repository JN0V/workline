case: engine/from-a-merge-request-run-a-proposal-out-of-its-line-is-refused
about: "Applying a merge request's own CI run (#331): a proposal its role never makes — here an issue closed, an act on the backlog — means the run is not the line's: nothing of it is applied, said."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q --detach"
  forge:
    issues: [{id: 3, title: "Keep users signed in", labels: [], comments: []}]
    merge-requests: [{id: 1, branch: feature, labels: [], comments: []}]
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  no-apply: true
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: feature
    intents: [{close: {issue: 3, reason: completed, why: "done"}}]
expect:
  status: block
  findings: [{rule: run-refused, level: block, message: "it proposes close, which the documentalist never does"}]
  not-pushed: [feature]
  forge: {issues: [{id: 3, closed: false, comments: 0}], merge-requests: [{id: 1, comments: 0}]}
