case: engine/from-a-merge-request-run-moved-on-nothing-applied
about: "Applying a merge request's own CI run (#331): the merge request's branch is no longer at the head that run judged, as the forge's event names it: nothing is applied, said; the run of the new head applies its own."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, labels: [], comments: []}]}
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  no-apply: true
  then: resume
  apply-from: {merge-request: 1, base: main, head: main}
expect:
  status: pass
  findings: [{rule: moved-on, level: warn, where: feature, message: "nothing applied"}]
  not-pushed: [feature]
  forge: {merge-requests: [{id: 1, comments: 0}]}
