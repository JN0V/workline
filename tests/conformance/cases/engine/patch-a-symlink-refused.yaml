case: engine/patch-a-symlink-refused
about: "A patch creating a link — a doc pointing at a workflow — is refused: a role writes text. Read from a merge request's own run (#331): nothing of the run is pushed."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, labels: [], comments: []}]}
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  push-to-merge-request: true
  no-apply: true
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: feature
    intents:
      - patch: |
          diff --git a/docs/tech/link.md b/docs/tech/link.md
          new file mode 120000
          --- /dev/null
          +++ b/docs/tech/link.md
          @@ -0,0 +1 @@
          +../../.github/workflows/ci.yml
          \ No newline at end of file
expect:
  status: block
  findings: [{rule: engine-error, message: "mode 120000"}]
  pushed: {feature: {docs/tech/auth.md: "Access tokens last one hour."}}
  files: {docs/tech/link.md: {exists: false}}
