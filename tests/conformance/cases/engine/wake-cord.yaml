case: engine/wake-cord
about: "Anyone's step-back label on an open issue or merge request is listed under the cord at the next merge; a closed one is not (ADR-0068 §8, #1461)."
given:
  repo: basic
  setup:
    - "printf 'a\\n' > a.txt && git add . && git commit -q -m 'feat: a'"
  forge:
    issues:
      - {id: 7, title: "this grows", body: "x", labels: [step-back]}
      - {id: 8, title: "that grew", body: "x", labels: [step-back], closed: true}
      - {id: 1, title: "a", body: "x", labels: [], closed: true}
    merge-requests:
      - {id: 9, title: "big", branch: f9, base: main, labels: [step-back]}
      - {id: 10, title: "a", branch: f10, base: main, merged: true, merged-at: "2026-01-03", merged-as: "main", closes: [1], labels: []}
run: {cli: [wake, --forge, "fake:../forge.json", --range, "main~1..main"]}
expect:
  exit: 0
  stdout: ["### The cord", "`step-back` on issue #7", "`step-back` on merge request #9"]
  stdout-lacks: ["issue #8"]
