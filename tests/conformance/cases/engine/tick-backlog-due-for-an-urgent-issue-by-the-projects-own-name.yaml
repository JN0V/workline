case: engine/tick-backlog-due-for-an-urgent-issue-by-the-projects-own-name
about: >
  The project keeps its own priority labels, P0 to P3 (`priority: auto`, ADR-0040): issue 41 carries P0, its Urgent, and no state label, put on at 10:00; the last backlog run started at 09:00, Ready is full: the tick, at 10:20, lists a backlog run, its reason naming the issue (#2322, ADR-0075 §1).
given:
  repo: basic
  config:
    routing: {events: {schedule: [product-owner], issue: [tester, developer]}, wip: {ready: 2}}
    roles:
      product-owner:
        settings: {priority: auto}
  forge:
    labels:
      - {id: 3, title: P0, labels: []}
      - {id: 4, title: P1, labels: []}
      - {id: 5, title: P2, labels: []}
      - {id: 6, title: P3, labels: []}
    issues:
      - {id: 1, title: "Item 1", body: "x", labels: ["workline:ready"]}
      - {id: 2, title: "Item 2", body: "x", labels: ["workline:ready"]}
      - id: 41
        title: "Item 41"
        body: "x"
        labels: [P0]
        label-events: [{label: P0, added: true, created: "2026-11-16T10:00:00Z"}]
    runs:
      - {name: "workline gardening backlog", workflow: workline-gardening.yml, status: completed, success: true, started: "2026-11-16T09:00:00Z", updated: "2026-11-16T09:05:00Z"}
run: {cli: [tick, --forge, "fake:../forge.json", --now, "2026-11-16T10:20:00Z", --json]}
expect:
  exit: 0
  stdout: ['{"job":"backlog","role":"product-owner","why":"', '41', '"key":"workline gardening backlog"}']
