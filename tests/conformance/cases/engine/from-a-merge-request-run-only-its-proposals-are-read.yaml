case: engine/from-a-merge-request-run-only-its-proposals-are-read
about: "Applying a merge request's own CI run (#331), whose code could have written anything in its folders, reads only the proposals there: the forge, the repository, the roles, the merge request, where the fix goes and the files written are the applying job's own, whatever run.yaml says."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, labels: [], comments: []}]}
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  no-apply: true
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: feature
    run:
      forge: "cmd:touch pwned-by-the-forge"
      repo: /nonexistent
      roles-dir: /nonexistent
      target: {kind: merge-request, id: 2}
      targets: {message: pwned-by-a-target}
      open-merge-request: true
      release: feature
expect:
  status: pass
  applied: [patch]
  findings: [{rule: patch-as-comment}]
  not-pushed: [feature]
  files: {pwned-by-the-forge: {exists: false}, pwned-by-a-target: {exists: false}}
  forge: {merge-requests: [{id: 1, comments: 1, comment-contains: "+Access tokens last two hours."}, {id: 2, absent: true}]}
