case: engine/patch-comment-holds-a-code-fence
about: 'A patch on a merge request goes in a comment, never on its branch, to be copied whole and applied with `git apply` (#145). Its diff holds lines of three backticks, a doc''s code block: the comment''s fence is longer than any, so none ends the block early; the diff''s last line, a blank line of context, is kept.'
given:
  repo: basic
  setup:
    - 'mkdir docs && printf ''# Usage\n\nRun the tool:\n\n```sh\ntool --run\n```\n\nIt prints a line.\nIt stops.\n\n## Options\n\nNone yet.\n'' > docs/usage.md && git add docs && git commit -qm ''docs: say how to run the tool'''
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && echo 'func quiet() {}' >> main.go && git commit -qam 'feat: run quietly' && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, fork: true, labels: [], comments: []}]}
run: {role: fixes-a-doc, event: merge-request, target: {merge-request: 1}, ai: "fake:doc-gains-a-code-block"}
expect:
  status: pass
  findings: [{rule: patch-as-comment, message: "pushes nothing"}]
  forge:
    merge-requests:
      - id: 1
        comments: 1
        comment-contains:
          - "Apply it with `git apply`:\n\n````diff\ndiff --git a/docs/usage.md b/docs/usage.md\n"
          - " tool --run\n ```\n \n+Or quietly:\n+\n+```sh\n+tool --run --quiet\n+```\n"
          - " It stops.\n \n````"
