case: engine/patch-a-path-with-a-space-out-of-its-paths-refused
about: "A patch writing a file whose name holds a space, outside what its role may write — here a workflow — is refused like any other, read from a merge request's own run (#331): nothing of the run is pushed."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, labels: [], comments: []}]}
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  push-to-merge-request: true
  no-apply: true
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: feature
    intents:
      - patch: |
          --- /dev/null
          +++ b/.github/workflows/x y.yml
          @@ -0,0 +1 @@
          +on: push
expect:
  status: block
  findings: [{rule: engine-error, message: ".github/workflows/x y.yml is outside what this role may write"}]
  pushed: {feature: {docs/tech/auth.md: "Access tokens last one hour."}}
