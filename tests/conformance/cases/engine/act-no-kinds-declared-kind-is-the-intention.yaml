case: engine/act-no-kinds-declared-kind-is-the-intention
about: "A role with no `acts` that proposes a comment has its act recorded with the intention's kind, comment."
given:
  repo: basic
  forge:
    issues:
      - {id: 1, title: "Export users", body: "Export the users as CSV.", labels: [], comments: []}
run:
  role: records-comment
  event: schedule
  target: {issue: 1}
  ai: |-
    cmd:printf '%s\n' '- comment: "The issue is clear."'
expect:
  applied: [comment]
  forge:
    issues:
      - id: 1
        comment-contains:
          - "workline:act"
          - '"kind":"comment"'
