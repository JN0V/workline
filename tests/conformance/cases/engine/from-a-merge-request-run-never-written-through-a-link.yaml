case: engine/from-a-merge-request-run-never-written-through-a-link
about: "Applying a merge request's own CI run (#331): the files of its head are data; a doc there that is a link is never written through, whatever the proposal: nothing is pushed, and the link's target is left as it was."
given:
  repo: documented
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q --detach"
  forge: {merge-requests: [{id: 1, branch: feature, labels: [], comments: []}]}
run:
  role: documentalist
  event: merge-request
  target: {merge-request: 1}
  ai: "fake:doc-fixed"
  push-to-merge-request: true
  no-apply: true
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: feature
    # The head, as the merge request's code made it: a doc that links out.
    setup: ["git checkout -q feature && echo original > ../escaped.md && ln -s ../../../escaped.md docs/tech/link.md && git add docs/tech/link.md && git commit -qm 'docs: link the notes' && git push -q origin feature && git checkout -q --detach"]
    intents: [{patch: {file: docs/tech/link.md, content: "written through the link"}}]
expect:
  status: block
  findings: [{rule: engine-error, message: "docs/tech/link.md is a link"}]
  files: {../escaped.md: {contains: original, lacks: "written through the link"}}
