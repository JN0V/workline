case: forge/gitlab-read-keeps-failing-said
about: "A GitLab read that keeps failing is tried a bounded number of times, then the forge is unreachable, said with how often it was tried: an issue's notes answered 503 from the plan's read on, the plan is unread, said (#489)."
given:
  repo: backlog
  engine-tags: [workline_quick]
  forge:
    faults:
      - {path: /issues/12/notes, status: 503, skip: 1}
    issues:
      - {id: 7, title: "Export drops the last row", body: "Every CSV file: the export drops the last row.", author: ann, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 9, title: "bug", body: "The export loses the last row.", author: ann, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 10, title: "Export fixes", body: "The export drops its last row, and a comma splits a cell.", author: ann, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 11, title: "Rows lost", body: "WriteRows loses rows.", author: ann, labels: [], comments: ["```yaml\nsources: [README.md]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
      - {id: 12, title: "Last row missing in CSV", body: "In my CSV export the last row is missing.", author: ann, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
    members:
      - {username: ann, access_level: 30}
  config:
    roles:
      product-owner:
        settings: {autonomy: cautious}
run: {role: product-owner, event: schedule, ai: fake:level-acts, forge: gitlab, no-apply: true, summary: true}
expect:
  findings:
    - {rule: plan-unread, level: warn, message: "GitLab GET projects/:id/issues/12/notes?sort=asc&order_by=created_at&per_page=100: 503 Service Unavailable"}
    - {rule: plan-unread, level: warn, message: "(tried 3 times)"}
  summary-file:
    - "judged, not applied (what it does on the issues is decided when applied)"
