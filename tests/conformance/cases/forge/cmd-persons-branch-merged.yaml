case: forge/cmd-persons-branch-merged
about: "With `forge: cmd:<command>`, `workline follow` asks the command for the open merge requests into the branch that moved (`merge-requests`), each with where it comes from and who opened it, and merges main into a person's in conflict only on a `checked` line (ADR-0041)."
given:
  repo: documented
  config:
    forge: 'cmd:sh "$FIXTURES/forges/logged.sh"'
    roles: {documentalist: {settings: {update-branches: conflicts}}}
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - "git checkout -qb feature && sed -i 's/3600/7200/' src/auth/token.go && sed -i 's/^checked: .*/checked: 2222222/' docs/tech/auth.md && git commit -qam 'feat(auth): keep users signed in for two hours' && git push -q origin feature && git checkout -q main"
    - "printf 'package auth\\n\\n// Refresh renews a token.\\nfunc Refresh() {}\\n' > src/auth/refresh.go && sed -i 's/^checked: .*/checked: 3333333/' docs/tech/auth.md && git add src docs && git commit -qm 'feat(auth): refresh tokens' && git push -q origin main"
run: {follow: [--base, main]}
expect:
  status: pass
  findings: [{rule: merged, where: feature, message: "docs/tech/auth.md"}]
  merged: {feature: main}
  files:
    .git/forge-requests.jsonl: {contains: '{"operation":"merge-requests"}'}
