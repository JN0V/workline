case: forge/github-read-keeps-failing-said
about: "A GitHub read that keeps failing is tried 3 times in all, then the forge is unreachable, said with how often it was tried; nothing is written (#491). GitHub's own forge code, a fake gh."
given:
  repo: linted
  engine-tags: [workline_quick]
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - git checkout -q -b change
    - "printf 'package main\n\nimport \"os\"\n\nfunc clean() {\n\tos.Remove(\"f\")\n}\n' > clean.go && git add clean.go && git commit -qm 'feat: clean' && git push -q origin change"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run:
  route: merge-request
  input: {range: main..change}
  gates-only: true
  forge: github
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: change
    gates: true
    env: {PATH: "$FIXTURES/gh:$PATH", GH_LOG: .git/gh.log, GH_FAULT: "GET pulls/1 503", GH_FAULT_TIMES: "0"}
expect:
  findings: [{rule: gates-not-shown, message: "gh: Service Unavailable (HTTP 503) (tried 3 times)"}]
  files:
    .git/gh.log:
      contains: ["call 3: GET pulls/1: 503"]
      lacks: ["call 4", "check-runs"]
