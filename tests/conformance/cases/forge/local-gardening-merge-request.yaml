case: forge/local-gardening-merge-request
about: "With `forge: local` and no remote, gardening's merge request is a local branch of its task, recorded in the clone, nothing pushed; the working tree goes back to the branch it was on."
given:
  repo: documented
  setup: ["sed -i 's/3600/7200/' src/auth/token.go && git commit -qam 'feat(auth): keep users signed in for two hours'"]
  config: {forge: local}
run: {role: documentalist, event: schedule, ai: "fake:doc-fixed", open-merge-request: true}
expect:
  status: pass
  applied: [patch, issue, issue]   # with the two kept issues, docs due and docs waiting for a person
  branches:
    workline/documentalist/suspect: {docs/tech/auth.md: "Access tokens last two hours."}
  files:
    .git/workline/merge-requests/1.md: {contains: "branch: workline/documentalist/suspect"}
    docs/tech/auth.md: {lacks: "Access tokens last two hours."}
  issues-listed: ["!1", "docs: bring the docs in line with the code"]
