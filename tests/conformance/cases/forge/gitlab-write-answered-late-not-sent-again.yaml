case: forge/gitlab-write-answered-late-not-sent-again
about: "A GitLab write answered too late may have been taken: it is not sent again, which would add a note twice; the run says so, blocked-external, and the apply run later does what is left (#489)."
given:
  repo: backlog
  engine-tags: [workline_quick]
  forge:
    faults:
      - {method: POST, path: /issues/9/notes, stall: true, times: 1}
    members:
      - {username: plan, access_level: 15}
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: plan, labels: [], comments: ["```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"]}
run: {role: product-owner, event: schedule, ai: fake:refine-an-outsider, forge: gitlab}
expect:
  status: blocked-external
  findings: [{rule: forge-unreachable, message: "(a write: not sent again, GitLab may have taken it)"}]
  forge:
    issues:
      - {id: 9, posted: 1, comments: 2}
