case: forge/gitlab-state-of-another-user-written-anew
about: On GitLab, a note only its author edits — a state comment a person's token wrote, before the project's bot took over, is left, and the state is written anew after it, read from there; the run is not blocked.
given:
  repo: backlog
  forge:
    members:
      - {username: owner, access_level: 50}
    issues:
      - {id: 9, title: "Rows lost", body: "Some rows are lost.", author: owner, labels: [], comments: [{author: owner, insider: true, body: "```yaml\nsources: [src/export/csv.go]\nconfirmed: d8c4dff\n```\n\n<!-- workline:sticky=product-owner/state -->"}]}
run: {role: product-owner, event: schedule, ai: fake:refine-an-outsider, forge: gitlab}
expect:
  status: pass
  forge:
    issues:
      - {id: 9, comments: 2, body-contains: "## Need"}
      - {id: 9, comment-contains: "judged: "}
