case: gates/settings-checked
about: >
  A check's settings are read before it runs: a `new` the engine does not
  know, or a duration it cannot read or of zero, is refused, never ignored.
given:
  repo: basic
  config: {gates: {merge: {checks: [
    {id: lint, run: "true", output: sarif, max: {error: 0}, new: sometimes},
    {id: tests, run: "true", output: exit, timeout: ten minutes},
    {id: build, run: "true", output: exit, new: rerun},
    {id: deps, run: "true", output: sarif, max: {error: 0}, base-timeout: 0s}]}}}
run: {gate: merge}
expect:
  status: block
  findings:
    - {rule: invalid-gate, where: lint, message: "new \"sometimes\""}
    - {rule: invalid-gate, where: tests, message: "timeout \"ten minutes\""}
    - {rule: invalid-gate, where: build, message: "an exit code holds no findings"}
    - {rule: invalid-gate, where: deps, message: "base-timeout \"0s\" is not a duration past zero"}
