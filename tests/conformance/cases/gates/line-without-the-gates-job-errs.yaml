case: gates/line-without-the-gates-job-errs
about: >
  A line told to read its gates' verdicts from a job that left none errs
  on each gate: never a pass, and never the gate run in its place, in the
  job that may hold the agent's token.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      sed -i 's|^\tos.Remove("c.tmp")$|&\n\tos.Remove("d.tmp")|' clean.go && git commit -qam "feat: clean d too"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run: {route: merge-request, input: {range: main..change}, gates-from: no-such-gates.json}
expect:
  status: block
  findings: [{rule: check-error, where: merge, message: "the gates' job left no result to read"}]
  no-findings: [{rule: over-threshold}]
