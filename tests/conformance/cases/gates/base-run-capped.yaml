case: gates/base-run-capped
about: >
  The run at the merge base has a cap: past it, the check is an error,
  never a pass.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      echo on > head-only.txt && git add head-only.txt && git commit -qm "feat: add a file"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, output: sarif, max: {error: 0}, base-timeout: 1s,
      run: "test -f head-only.txt || sleep 3; golangci-lint run --output.sarif.path={out}/lint.sarif"}]}}
run: {route: merge-request, input: {range: main..HEAD}}
expect:
  status: block
  findings: [{rule: check-error, where: lint, message: "timed out after 1s"}]
