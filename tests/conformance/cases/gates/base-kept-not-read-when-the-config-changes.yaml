case: gates/base-kept-not-read-when-the-config-changes
about: >
  A merge request that changes its tool's config cannot read the merge
  base's findings main kept: they were found with main's config. The
  check runs again at the merge base, with the head's config (ADR-0049),
  and says why: godot turned on finds the comment main had already, not
  new.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      printf 'linters: {enable: [errcheck, godot]}\n' > .golangci.yml && git add .golangci.yml && git commit -qm "build: end every comment with a period"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run: {route: merge-request, input: {range: main..HEAD}, kept-on-main: main, summary: true}
expect:
  status: pass
  no-findings: [{rule: over-threshold}]
  summary-file: ["lint 0 new, 4 before it", "at the merge base; not read as kept on main: the change touches its config, .golangci.yml"]
