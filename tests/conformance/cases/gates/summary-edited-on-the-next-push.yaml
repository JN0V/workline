case: gates/summary-edited-on-the-next-push
about: >
  The gates' summary comment is one, edited in place on each push: the
  second push's count replaces the first's, and no other comment is
  posted. Each head judged gets its own check, its annotations its own.
given:
  repo: linted
  setup:
    - "git init -q --bare ../origin.git && git remote add origin ../origin.git && git push -q origin main"
    - git checkout -q -b change
    - |
      sed -i 's|^\tos.Remove("c.tmp")$|&\n\tos.Remove("d.tmp")|' clean.go && git commit -qam "feat: clean d too" && git push -q origin change
  env: {PATH: "$FIXTURES/bin:$PATH"}
  forge: {merge-requests: [{id: 1, branch: change, labels: [], comments: []}]}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run:
  route: merge-request
  input: {range: main..change}
  gates-only: true
  then: resume
  apply-from:
    merge-request: 1
    base: main
    head: change
    gates: true
    again:
      - |
        git checkout -q change && sed -i 's|^\tos.Remove("d.tmp")$|&\n\tos.Remove("e.tmp")|' clean.go && git commit -qam "feat: clean e too" && git push -q origin change
expect:
  findings: [{rule: gates-shown, message: "2 new findings of the gates"}]
  forge:
    check-runs:
      - {commit: change, name: workline gates, title: 2 new findings, count: 2}
      - {commit: "change~1", name: workline gates, title: 1 new finding, count: 1}
    merge-requests:
      - id: 1
        comments: 1
        posted: 1
        comment-contains: ["### Gates: 2 new findings", "| `merge` | `lint` | 2 | 3 |", "`clean.go:10`, `clean.go:11`"]
        comment-lacks: ["1 new finding"]
