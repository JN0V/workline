case: gates/new-finding-blocks
about: >
  On a merge request over lint debt, only the finding the change adds
  counts, named on its line; the three already on main do not.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      sed -i 's|^\tos.Remove("c.tmp")$|&\n\tos.Remove("d.tmp")|' clean.go && git commit -qam "feat: clean d too"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run: {route: merge-request, input: {range: main..HEAD}}
expect:
  status: block
  findings:
    - {rule: over-threshold, where: lint, message: "1 new error finding, at most 0 allowed (3 there before it, not counted"}
    - {rule: over-threshold, where: lint, message: "clean.go:10 errcheck"}
