case: gates/line-refuses-gates-of-a-branch-moved-since
about: >
  The gates' job says the commits it ran on: when a branch its range names
  moved before the line reads its verdicts, the line judges other commits,
  and each gate is an error, never the old verdict.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      printf '\n// Run it with go run.\n' >> main.go && git commit -qam "docs: say how to run it"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run:
  route: merge-request
  input: {range: main..change}
  gates-job:
    after:
      - |
        sed -i 's|^\tos.Remove("c.tmp")$|&\n\tos.Remove("d.tmp")|' clean.go && git commit -qam "feat: clean d too"
expect:
  status: block
  findings: [{rule: check-error, where: merge, message: "the gates ran on"}]
