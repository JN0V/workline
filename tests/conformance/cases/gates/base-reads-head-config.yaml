case: gates/base-reads-head-config
about: >
  The merge base is read with the head's config: a change enabling a
  linter is not blamed for what it finds in old code.
given:
  repo: linted
  setup:
    - git checkout -q -b change
    - |
      printf 'linters:\n  enable: [godot]\n' > .golangci.yml && git add .golangci.yml && git commit -qm "build: check comments end in a period"
  env: {PATH: "$FIXTURES/bin:$PATH"}
  config:
    routing: {events: {merge-request: ["gate:merge"]}}
    gates: {merge: {checks: [{id: lint, run: "golangci-lint run --output.sarif.path={out}/lint.sarif", output: sarif, max: {error: 0}}]}}
run: {route: merge-request, input: {range: main..HEAD}, summary: true}
expect:
  status: pass
  summary-file: ["count: lint 0 new, 4 before it"]
