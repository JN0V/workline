case: release-manager/changelog-is-not-rewritten
about: A changelog written by the agent instead of the generated one is refused; nothing is applied.
given: {repo: released, config: {roles: {release-manager: {settings: {flow: direct}}}}}
run: {role: release-manager, event: release, ai: "fake:release-and-own-changelog"}
expect: {status: block, findings: [{rule: changelog-edited}], applied: []}
