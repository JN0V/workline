case: release-manager/releases-without-ai
about: Without AI, the release still happens with the generated changelog.
given: {repo: released, config: {roles: {release-manager: {settings: {flow: direct}}}}}
run: {role: release-manager, event: release, ai: none}
expect: {status: pass, applied: [patch, release], files: {CHANGELOG.md: {contains: "v1.3.0"}}}
