# Kotlin, and Java, built with Gradle (ADR-0065, "Language packs"): a
# module's tests in its src/test/ source set, an Android module's in
# src/androidTest/, a multiplatform one's in src/<target>Test/.
about: Kotlin or Java projects built with Gradle
detect:
  files: [settings.gradle.kts, settings.gradle, build.gradle.kts, build.gradle]
  extensions: [.kt, .kts, .java]
test-paths:
  - "**/src/test/**"
  - "**/src/*Test/**"
  - "**/src/androidTest*/**"
  - "**/src/test*Debug/**"
  - "**/src/test*Release/**"
test-homes:
  - {tests: "**/src/test/**", code: "**/src/main/**"}
  - {tests: "**/src/androidTest/**", code: "**/src/main/**"}
  - {tests: "**/src/commonTest/**", code: "**/src/commonMain/**"}
# code-navigation: how a file's functions are found and its declarations
# outlined, with no build. Java's rows are the java-maven pack's, read
# whatever the list.
code-navigation:
  - name: Kotlin
    extensions: [.kt, .kts]
    definition: c-like
    body: braces
    outline: braces
    containers: [class, interface, object]
    ignore: '@[\w.]+(?:\([^)]*\))?'
    line-ends: true
    param-headers: true
    bases: '\b(?:class|object|interface)\s+\w+(?:<[^>]*>)?(?:\s*\([^)]*\))?\s*:\s*([A-Z]\w*)'
    keywords: "fun val var override companion object data sealed suspend lateinit internal open inline when typealias Unit Int Long Boolean String Any Float Double"
# build-errors: error lines of the test command's output a new test breaks the build with.
build-errors:
  - error: '^e: (?P<file>.+?\.kts?)(?::\d+:\d+:?|: \(\d+, \d+\):) (?P<message>.+)$'
    missing-name:
      - '^Unresolved reference ''(?P<name>[^'']+)'''
      - '^Unresolved reference: (?P<name>\S+)'
      - '^No parameter with name ''(?P<name>[^'']+)'' found'
      - '^Cannot find a parameter with this name: (?P<name>\S+)'
    test-name: '(?m)@Test\b(?:\([^)]*\))?\s+(?:@\w+(?:\([^)]*\))?\s+)*(?:(?:public|internal)\s+)?fun\s+(?:`([^`]+)`|(\w+))\s*\('
  - error: '^(?:Build|Settings) file ''(?P<file>[^'']+)'' line: \d+(?P<message>)$'
  - error: '^(?P<file>\S.*?\.java):\d+: error: (?P<message>.+)$'
    missing-name:
      - '^cannot find symbol$'
    name-line: '^\s*symbol:\s+\w+\s+(?P<name>\w+)'
    test-name: '(?m)@Test\b(?:\([^)]*\))?\s+(?:@\w+(?:\([^)]*\))?\s+)*(?:(?:public|protected|private|static|final)\s+)*void\s+(\w+)\s*\('
