# Java built with Maven (ADR-0065, "Language packs"): a module's tests in
# src/test/, its code in src/main/.
about: Java projects built with Maven
detect:
  files: [pom.xml]
  extensions: [.java]
test-paths:
  - "**/src/test/**"
test-homes:
  - {tests: "**/src/test/**", code: "**/src/main/**"}
# code-navigation: how a file's functions are found and its declarations
# outlined, with no build.
code-navigation:
  - name: Java
    extensions: [.java, .groovy]
    definition: c-like
    body: braces
    outline: braces
    containers: [class, interface, enum, record, trait]
    ignore: '@[\w.]+(?:\([^)]*\))?'
    bases: '\b(?:extends|implements|with)\s+([A-Z]\w*)'
    param-headers: true
    keywords: "extends implements final abstract synchronized throws instanceof interface record boolean String Integer Object Override"
# build-errors: error lines of the test command's output a new test breaks the build with.
build-errors:
  - error: '^(?P<file>\S.*?\.java):\d+: error: (?P<message>.+)$'
    missing-name:
      - '^cannot find symbol$'
    name-line: '^\s*symbol:\s+\w+\s+(?P<name>\w+)'
    test-name: '(?m)@Test\b(?:\([^)]*\))?\s+(?:@\w+(?:\([^)]*\))?\s+)*(?:(?:public|protected|private|static|final)\s+)*void\s+(\w+)\s*\('
