# JavaScript and TypeScript tested with Jest or a runner of its shape
# (ADR-0065, "Language packs"): __tests__/ folders, *.test.* and *.spec.*
# files.
about: JavaScript or TypeScript projects with a package.json
detect:
  files: [package.json]
  extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx]
test-paths:
  - "**/__tests__/**"
  - "**/[^.]*.test.*"
  - "**/[^.]*.spec.*"
  - "**/test/**"
  - "**/tests/**"
# code-navigation: how a file's functions are found and its declarations
# outlined, with no build.
code-navigation:
  - name: JavaScript and TypeScript
    extensions: [.js, .jsx, .mjs, .cjs, .ts, .tsx, .mts, .cts]
    definition: c-like
    body: braces
    outline: braces
    containers: [class, interface, namespace, module, enum, type]
    ignore: '@[\w.]+(?:\([^)]*\))?'
    bases: '\b(?:extends|implements|with)\s+([A-Z]\w*)'
    param-headers: true
    keywords: "function undefined let async await typeof instanceof export default yield extends implements interface readonly"
