# Python tested with pytest (ADR-0065, "Language packs"): test_*.py and
# *_test.py files, tests/ folders, and conftest.py, pytest's fixtures.
about: Python projects tested with pytest
detect:
  files: [pyproject.toml, setup.py, setup.cfg, pytest.ini, tox.ini, requirements.txt]
  extensions: [.py]
test-paths:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/tests/**"
  - "**/test/**"
  - "**/conftest.py"
test-command: "pytest --junitxml={report}"
# code-navigation: how a file's functions are found and its declarations
# outlined, with no build.
code-navigation:
  - name: Python
    extensions: [.py]
    definition: '^\s*(?:async\s+)?def\s+(NAME)\s*\('
    body: indent
    outline: indent
    containers: [class]
    bodies: [def, async]
    hash-comments: true
    bases: '^\s*class\s+\w+\(\s*(?:[\w.]+\.)?([A-Z]\w*)'
    keywords: "def elif None True False self cls lambda pass from import async await with yield global nonlocal raise except finally assert del str"
# build-errors: error lines of the test command's output a new test breaks the build with.
build-errors:
  - error: '^_+ ERROR collecting (?P<file>\S+\.py) _+(?P<message>)$'
    message-line: '^E\s+(?P<message>[\w.]+: .+)$'
    missing-name:
      - '^ImportError: cannot import name ''(?P<name>[^'']+)'''
    test-name: '(?m)^\s*(?:async\s+)?def (test\w*)\s*\('
