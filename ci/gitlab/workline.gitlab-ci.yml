# workline on GitLab CI — include it from .gitlab-ci.yml:
#   include: {local: ci/workline.gitlab-ci.yml}
# Tried on gitlab.com (2026-10-01): Claude judges, the fix is committed to the
# merge request's branch. A free account must verify itself (phone or card)
# before its pipelines run. A fork's merge request is untried.
#
# The project's routing decides what runs on a merge request (.workline/config.yaml,
# `routing:`; by default the committer, then the documentalist).
#
# Two jobs, two trust zones (docs/research/server-side.md), the gates first:
#   gates  runs the project's gates alone (`gate:<name>`; the first release
#          after v0.35.0), their tools the merge request's code: what they
#          add is its Code Quality report, their verdicts judge's to read
#          (ADR-0049). Install their tools in its before_script. No token:
#          workline:base, before it, reads main's findings at the merge
#          base with the bot's, and hands them over.
#   judge  runs the line, no write token, stops before applying (--no-apply).
#          With the variable CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, a
#          Claude subscription; masked), Claude judges; without it, the docs
#          are listed for a person. GitLab gives a variable to the whole job,
#          installs included, where GitHub gives it to one step.
#          The reviewer's lenses that only warn are left to warn
#          (--warn-apart, ADR-0050; the first release after v0.36.0) when
#          WORKLINE_GITLAB_TOKEN is set; else they read here, said.
#   warn   beside judge, with the agent's token: the reviewer's lenses that
#          only warn (--warn-only), and the inspector's triage of what the
#          gates found, given their result (ADR-0049); warn:apply posts
#          what they found, each in a comment of its own. Both run in a
#          child pipeline of this same file, which the merge request's
#          does not wait for (ADR-0051): neither fails a pipeline the
#          merge waits on, nor holds the head's verdict, which
#          workline:merge reads from judge alone.
#   The findings show in the merge request's Code Quality report, on every tier.
#   Each job also writes its summary (`--summary`): what ran, each step's
#   verdict, the findings, what waits to be applied; the applying job adds
#   what it applied to the judging job's. workline-summary.md is printed at
#   the end of the log; workline-summary.html, a page GitLab shows (an .md
#   artifact it only downloads), is linked from the job's page (Annotations)
#   and from the merge request's (`expose_as`). `--summary` needs the first
#   release after v0.16.0.
#   A merge train's pipeline (`merge_train`, Premium; ADR-0050; the first
#   release after v0.37.0) runs gates alone, on the merged result, against
#   the target's tip, no agent asked: the head's review and verdict, and
#   a person's yes, stay its merge request's (ADR-0042). A merged results
#   pipeline (`merged_result`) is the merge request's own, on each push:
#   every job runs there, as on any other.
#   apply  holds WORKLINE_GITLAB_TOKEN (a project access token, role Developer,
#          scopes `api` and `write_repository`: one glab command in
#          docs/ci-gitlab.md makes and stores it; CI_JOB_TOKEN reaches no issue) and
#          no AI key. A doc fix goes in one comment on the merge request,
#          never on its branch (ADR-0051).
#
# Both variables are masked, and NOT protected: GitLab gives a protected
# variable only to protected branches, never to a merge request's. Anyone who
# may push a branch can then read them from a pipeline they change — people
# who may already write to the repository. A fork's merge request runs in the
# fork, which has neither: it is judged without an agent, and nothing is
# applied or commented.
# Scope each to the environment `workline` (Settings, CI/CD, Variables,
# Environments; a project's variable, on every tier): GitLab gives it then
# only to the jobs that declare it, those that hold a token here, and never
# to workline:gates nor workline:main, which run the project's tools (#520).
# GITLAB_TOKEN and WORKLINE_SIGNING_KEY too, when set. `workline doctor`
# warns of a token left to every environment.
#
# The jobs run in workline's image (Dockerfile): the engine at WORKLINE_VERSION
# and the tools its roles use, nothing to build. A self-managed GitLab whose
# runners cannot reach ghcr.io copies it into its own registry and sets
# WORKLINE_IMAGE; its own certificate authority (CI_SERVER_TLS_CA_FILE) is
# trusted; the engine talks to the instance the job runs on (CI_API_V4_URL).
# The agent still needs npm's registry and Anthropic's API.
variables:
  WORKLINE_VERSION: v0.63.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_IMAGE: ghcr.io/jn0v/workline
  WORKLINE_RUNS_DIR: $CI_PROJECT_DIR/.workline-runs

.workline:trust: &trust             # a self-managed instance's own authority, when it has one
  - '[ -z "${CI_SERVER_TLS_CA_FILE:-}" ] || cat "$CI_SERVER_TLS_CA_FILE" >> /etc/ssl/certs/ca-certificates.crt'
# The environment each job holding a token declares, the one its variables
# are scoped to; `prepare` records no deployment. GitLab advises against
# testing an environment's variable in `rules:`: a job that needs the bot's
# token runs, and without it says so and stops, green.
.workline:environment: &environment {name: workline, action: prepare}
.workline:bot-token: &bot-token
  - '[ -n "${WORKLINE_GITLAB_TOKEN:-}" ] || { echo "workline: WORKLINE_GITLAB_TOKEN is not set, or not scoped to the environment workline: nothing to do (docs/ci-gitlab.md)"; exit 0; }'
# The bot's name on the commits it writes; given an SSH private key, the
# File variable WORKLINE_SIGNING_KEY, git signs them with it, for a project
# that refuses unsigned commits (docs/gitlab/signed-commits.md; the first
# release after v0.37.0). Never echoed: a key typed as a plain variable
# fails the job, unread.
.workline:bot: &bot
  - git config user.name "workline"
  - git config user.email "workline@noreply.$CI_SERVER_HOST"
  - |
    if [ -n "${WORKLINE_SIGNING_KEY:-}" ]; then
      [ -f "$WORKLINE_SIGNING_KEY" ] || { echo "workline: WORKLINE_SIGNING_KEY is not a file: set its type to File (Settings, CI/CD, Variables)"; exit 1; }
      chmod 600 "$WORKLINE_SIGNING_KEY"   # a File variable is readable by all, which ssh-keygen refuses
      [ -z "$(tail -c 1 "$WORKLINE_SIGNING_KEY")" ] || echo >> "$WORKLINE_SIGNING_KEY"   # nor reads a key with no last newline
      git config gpg.format ssh
      git config user.signingkey "$WORKLINE_SIGNING_KEY"
      git config commit.gpgsign true
    fi
.workline:summary: &summary         # the summary, at the end of the log and linked from the job's page
  - '[ ! -s workline-summary.md ] || cat workline-summary.md'
  - printf '{"workline":[{"external_link":{"label":"workline summary","url":"%s/artifacts/file/workline-summary.html"}}]}\n' "$CI_JOB_URL" > workline-annotations.json
# kept <file>: a file of .workline-kept/ from main's last successful
# workline:main, never a cache a branch could write. Read with the bot's
# token, in workline:base; else the job's, which GitLab takes there on
# Premium and Ultimate only (gitlab.com's Free tier answers 404).
.workline:kept: &kept
  - 'kept() { h="JOB-TOKEN: $CI_JOB_TOKEN"; [ -z "${WORKLINE_GITLAB_TOKEN:-}" ] || h="PRIVATE-TOKEN: $WORKLINE_GITLAB_TOKEN"; mkdir -p .workline-kept; curl -fsSL --header "$h" -o ".workline-kept/$1" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_DEFAULT_BRANCH/raw/.workline-kept/$1?job=workline:main" 2>/dev/null || { rm -f ".workline-kept/$1"; return 1; }; }'
.workline:claude: &claude           # the agent, only when the project gives its token; not installed on a draft, which asks none
  - ai=none
  - if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then if [ "${draft:-}" = true ]; then ai=claude; else npm install -g --silent @anthropic-ai/claude-code && ai=claude; fi; fi
# The developer's agent runs commands in a worktree of the clone: in the
# jobs that may run it, the runner's job token leaves its git config
# first, every branch fetched while it is there; the engine refuses to
# start the agent while git would hand it one (ADR-0056).
.workline:no-credential: &no-credential
  - git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
  - git config remote.origin.url "$CI_SERVER_URL/$CI_PROJECT_PATH.git"
  - for k in $(git config --local --name-only --get-regexp '^(http\..*extraheader|credential\..*helper)$'); do git config --local --unset-all "$k"; done
# Every lens of the reviewer once when the merge request becomes ready
# (ADR-0020); a draft's pipelines ask no agent, the summary saying the AI
# review waits for ready (ADR-0050). Marking a draft ready starts no
# pipeline: the next one, a push or Run pipeline, is
# the run on ready when the merge request is no draft and its note
# "marked this merge request as **ready**" is newer than the reviewer's
# comment, or there is no comment yet. Read with GITLAB_TOKEN, else the
# job's token; unread, one lens, said (roles/reviewer/docs/run.md). The
# draft state goes on every run (`draft`): a merge request no draft whose
# record does not say every lens read it gets them (#359). The lenses that
# warn read the ready note against their own comment (WORKLINE_STICKY).
# The draft state as the API says it when the job runs (#662), else as
# the pipeline was created with it (CI_MERGE_REQUEST_DRAFT).
.workline:ready: &ready
  - |
    lenses=; last=; auth="JOB-TOKEN: $CI_JOB_TOKEN"
    sticky="<!-- workline:sticky=${WORKLINE_STICKY:-reviewer/summary} -->"
    [ -z "${GITLAB_TOKEN:-}" ] || auth="PRIVATE-TOKEN: $GITLAB_TOKEN"
    mr="$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID"
    get() { curl -fsS --header "$auth" "$mr$1"; }
    draft=$(get "" | jq -r .draft) || draft=
    case "$draft" in true|false) ;; *) draft=${CI_MERGE_REQUEST_DRAFT:-} ;; esac
    page=0; [ "$draft" != false ] || last=more
    while [ "$last" = more ] && [ "$page" -lt 50 ]; do
      page=$((page + 1))
      last=$(get "/notes?order_by=updated_at&sort=desc&per_page=100&page=$page" | jq -r --arg sticky "$sticky" '([.[] | select((.system and .body == "marked this merge request as **ready**") or (.body | contains($sticky)))][0]) as $n | if $n == null then (if length == 100 then "more" else "none" end) elif $n.system then "ready" else "reviewed" end') || last=
    done
    case "$draft:$last" in
      false:ready|false:none) lenses="--input lenses=all"; echo "workline: the merge request is ready and not reviewed since: every lens of the reviewer, once" ;;
      false:reviewed|true:) ;;
      *) echo "workline: whether the merge request just became ready could not be read: one lens of the reviewer" ;;
    esac

.workline:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  variables: {GIT_DEPTH: 0}         # the whole history: docs are compared since their `checked`, the release since its tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - *trust
    - workline version
    - git fetch --quiet origin $CI_MERGE_REQUEST_DIFF_BASE_SHA || true
    - '[ -z "${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-}" ] || git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA" || true'

# The stored base, before the gates run (ADR-0050): main's findings by
# commit, read from main's own pipeline artifacts (workline:main), never
# from a cache a branch could write, and handed to workline:gates, or to
# workline:main on the default branch, as this job's artifact. The bot's
# token reads them here, where no tool runs and nothing is checked out:
# the jobs that run the project's tools never receive it (#520). Its
# failure fails nothing: the tools then run again at the merge base, said.
workline:base:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: .pre
  environment: *environment
  variables: {GIT_STRATEGY: none}
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - *trust
    - rm -rf .workline-kept
    - '[ -n "${WORKLINE_GITLAB_TOKEN:-}" ] || echo "workline: no WORKLINE_GITLAB_TOKEN here: main''s findings read with the job''s token, which GitLab takes there on Premium and Ultimate only"'
    - *kept
    - |
      if [ "$CI_PIPELINE_SOURCE" = push ]; then   # the commits main's last pipeline kept, 19 of them, carried
        kept commits && for c in $(head -n 19 .workline-kept/commits); do kept "$c.json" || true; done || echo "workline: main's last pipeline kept no findings"
      else                                       # the merge base's, or in a merge train the target's tip's
        base=$CI_MERGE_REQUEST_DIFF_BASE_SHA
        [ "${CI_MERGE_REQUEST_EVENT_TYPE:-}" != merge_train ] || base=${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-$base}
        kept "$base.json" || echo "workline: main's pipeline kept no findings for $base"
      fi
  allow_failure: true
  artifacts:
    paths: [.workline-kept/]
    expire_in: 1 day

# The gates alone, before the judge, given no token scoped to the
# environment workline; it unsets them still, for one left to every
# environment (docs/gitlab/environment.md). The judge runs after it,
# whatever its verdict: the line reads it, and errs on a gate it does not
# hold. In a merge train (ADR-0050), with workline:base the only jobs of
# workline: the gates on the merged result against the target's tip,
# failing the train's pipeline when they block; the summary names the
# steps left to the head's verdict.
workline:gates:
  extends: .workline
  stage: test
  needs: [{job: "workline:base", artifacts: true}]
  interruptible: true
  # The merge base's findings, as workline:base read them from main's
  # pipeline: the tools then run once, when kept with the same command,
  # config and tool.
  before_script:
    - *trust
    - workline version
    - git fetch --quiet origin $CI_MERGE_REQUEST_DIFF_BASE_SHA || true
    - '[ -z "${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-}" ] || git fetch --quiet origin "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA" || true'
    - base=$CI_MERGE_REQUEST_DIFF_BASE_SHA; queue=
    - 'if [ "${CI_MERGE_REQUEST_EVENT_TYPE:-}" = merge_train ]; then base=${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-$base}; queue="--input queue=true"; fi'
    - '[ -s ".workline-kept/$base.json" ] || echo "workline: main''s pipeline kept no findings for $base: the gates run again at the merge base"'
  script:
    - unset CLAUDE_CODE_OAUTH_TOKEN WORKLINE_GITLAB_TOKEN GITLAB_TOKEN
    - status=0
    - >
      workline route merge-request --gates-only --forge none $queue
      --input range=$base..$CI_COMMIT_SHA --gates-kept .workline-kept
      --code-quality gl-code-quality-gates.json --summary gates-summary.md --summary gates-summary.html
      --json > gates.json || status=$?
    - exit $status
  # Its summary named its own: the judge, given this job's artifacts,
  # writes workline-summary.md afresh.
  after_script:
    - '[ ! -s gates-summary.md ] || cat gates-summary.md'
    - printf '{"workline":[{"external_link":{"label":"workline gates","url":"%s/artifacts/file/gates-summary.html"}}]}\n' "$CI_JOB_URL" > workline-annotations.json
  artifacts:
    when: always
    paths: [gates.json, gates-summary.html, gates-summary.md]
    reports: {codequality: gl-code-quality-gates.json, annotations: workline-annotations.json}
    expire_in: 1 day

workline:judge:
  extends: .workline
  stage: test
  environment: *environment         # the agent's token, the bot's (whether workline:warn runs), GITLAB_TOKEN
  needs: [workline:gates]
  rules:                            # also when the gates did not pass: the line reads their verdict; never in a merge train
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train"
      when: always
  # One pipeline per merge request (#359): a push cancels the one still
  # judging the head before, with GitLab's "Auto-cancel redundant
  # pipelines" on (docs/ci-gitlab.md). The jobs that write are not
  # interruptible: one begun goes to its end.
  interruptible: true
  # One review at a time per merge request (#375), with workline:apply: a
  # push waits while the pipeline before it applies, then reads its
  # record and reviews only what is new.
  resource_group: workline-review-$CI_MERGE_REQUEST_IID
  # The lenses that warn read apart only where workline:warn runs, which
  # needs the bot's token too (ADR-0050); without it they read here, on the
  # verdict's path, said in the log and the summary, never lost. On a
  # release tool's merge request, the default branch's checks not done
  # yet are waited for, 30 minutes at most, this job running meanwhile
  # (#640).
  script:
    - *ready
    - *claude
    - '[ -n "${WORKLINE_GITLAB_TOKEN:-}" ] || echo "workline: warn lenses not run apart: WORKLINE_GITLAB_TOKEN not set, they read in this job, on the path of the verdict"'
    - status=0
    - >
      workline route merge-request --ai "$ai" --no-apply ${WORKLINE_GITLAB_TOKEN:+--warn-apart}
      --forge gitlab --target merge-request:$CI_MERGE_REQUEST_IID --branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" --release-wait 30m
      --input range=$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA $lenses ${draft:+--input draft=$draft} --input ready=${lenses:+true}
      --gates-from gates.json --code-quality gl-code-quality.json --summary workline-summary.md --summary workline-summary.html
      --verdict workline-verdict.json --verdict-head "${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-$CI_COMMIT_SHA}" --json > line.json || status=$?
    - '[ -n "${WORKLINE_GITLAB_TOKEN:-}" ] || printf "\n- **warn lenses not run apart**: WORKLINE_GITLAB_TOKEN not set, they read in this job, on the path of the verdict\n" >> workline-summary.md'
    - exit $status
  # An agent out of reach (3) warns, not taken for the change's fault: a
  # person judges what it would have (ADR-0010).
  allow_failure: {exit_codes: [3]}
  after_script: *summary
  artifacts:
    when: always                    # steps that passed before one blocked are still applied
    expose_as: workline summary
    paths: [workline-summary.html, workline-summary.md, .workline-runs/, line.json, workline-verdict.json]
    reports: {codequality: gl-code-quality.json, annotations: workline-annotations.json}
    expire_in: 1 day

workline:apply:
  extends: .workline
  stage: deploy
  environment: *environment
  needs: [workline:judge]
  interruptible: false
  resource_group: workline-review-$CI_MERGE_REQUEST_IID   # one review at a time, with workline:judge (#375)
  rules:                            # also when the judge failed: a blocked merge request still gets the reviewer's comment (#226)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train"
      when: always
  script:
    - *bot-token
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - workline apply --line line.json --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    expose_as: workline applied
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# What only warns, in a child pipeline (ADR-0051): GitLab merges a merge
# request set to merge once its pipeline succeeds, and waits for
# `allow_failure` jobs too. Started with no `strategy`, the merge
# request's pipeline ends with the verdict. The child is this same file,
# where only workline:warn and workline:warn:apply run: copied elsewhere
# than ci/workline.gitlab-ci.yml, change its `include`.
workline:warn:child:
  stage: test
  needs: [workline:gates]
  interruptible: true
  rules:                            # also when the gates did not pass: their findings are what the inspector triages
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train"
      when: always
  variables: {WORKLINE_PARENT_PIPELINE_ID: $CI_PIPELINE_ID}   # where workline:warn reads the gates' result
  # The file's own variables, never forwarded: a trigger job would expand
  # them where CI_PROJECT_DIR is empty (WORKLINE_RUNS_DIR=/.workline-runs).
  inherit: {variables: false}
  trigger:
    include: ci/workline.gitlab-ci.yml
  allow_failure: true               # a child that cannot start warns: the lenses that warn did not read

# The reviewer's lenses that only warn (its `ai-findings`, ADR-0050; the
# first release after v0.36.0): workline:judge asks the lenses that block
# (--warn-apart), and workline:merge reads the head's verdict from it
# alone. This job asks the others beside it, in the child pipeline
# (--warn-only); workline:warn:apply posts what they found, in a comment
# of their own. Never a verdict, and neither job fails the pipeline
# (allow_failure): a lens that fails is said in that comment. With the
# agent's token and the bot's: unposted, their record would never move,
# and every pipeline read them all again. One review apart at a time per
# merge request. The inspector's triage too, when the line routes it
# (ADR-0049): after workline:gates, whatever its verdict, it reads the
# result that job left (`--gates-from`); the gates never run here, in the
# agent's reach.
workline:warn:
  extends: .workline
  stage: test
  environment: *environment
  needs: []
  interruptible: true
  resource_group: workline-warn-$CI_MERGE_REQUEST_IID
  variables: {WORKLINE_STICKY: reviewer/warn}   # the ready note read against its own comment
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_MERGE_REQUEST_IID
  script:
    - *bot-token
    - '[ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || { echo "workline: CLAUDE_CODE_OAUTH_TOKEN is not set, or not scoped to the environment workline: no agent, nothing read apart"; exit 0; }'
    - *ready
    - *claude
    # workline:gates's gates.json, read from the merge request's pipeline
    # with the bot's token: GitLab's needs:pipeline:job fetches only a job
    # that passed, and the inspector triages most when the gates did not.
    - |
      gates=; api="$CI_API_V4_URL/projects/$CI_PROJECT_ID"; h="PRIVATE-TOKEN: $WORKLINE_GITLAB_TOKEN"
      job=$(curl -fsS --header "$h" "$api/pipelines/${WORKLINE_PARENT_PIPELINE_ID:-none}/jobs?per_page=100" | jq -r '[.[] | select(.name == "workline:gates")][0].id // empty') || job=
      [ -z "$job" ] || curl -fsSL --header "$h" -o gates.json "$api/jobs/$job/artifacts/gates.json" || rm -f gates.json
      if [ -s gates.json ]; then gates=gates.json; else echo "workline: workline:gates left no gates.json in the merge request's pipeline: nothing to triage"; fi
    - status=0
    - >
      workline route merge-request --warn-only --ai "$ai" --no-apply
      --forge gitlab --target merge-request:$CI_MERGE_REQUEST_IID --branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      --input range=$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA $lenses ${draft:+--input draft=$draft}
      ${gates:+--gates-from $gates} --summary workline-summary.md --summary workline-summary.html --json > line.json || status=$?
    - '[ "$status" != 3 ] || echo "workline: the agent could not be reached: the lenses that warn did not read this push"'
    - '[ "$status" = 0 ] || [ "$status" = 3 ] || exit $status'
  allow_failure: true
  after_script: *summary
  artifacts:
    when: always
    expose_as: workline lenses that warn
    paths: [workline-summary.html, workline-summary.md, .workline-runs/, line.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:warn:apply:
  extends: .workline
  stage: deploy
  environment: *environment
  needs: [workline:warn]
  interruptible: false
  resource_group: workline-warn-$CI_MERGE_REQUEST_IID   # one review apart at a time, with workline:warn
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_MERGE_REQUEST_IID
      when: always
  script:
    - *bot-token
    - '[ -s line.json ] || { echo "workline: the lenses that warn left nothing to apply"; exit 0; }'
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - workline apply --line line.json --summary workline-summary.md --summary workline-summary.html
  allow_failure: true
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# The merge policy, `merge: {autonomy: cautious}` (ADR-0042; the first
# release after v0.25.0), after the judge: the head's verdict kept, the
# merge requests a person accepted set to merge when their pipeline
# succeeds, none brought up to date first (ADR-0051). A label starts no
# pipeline: it waits for that merge request's own next one. The target
# branch checked out, for its config; never a fork's. Without `merge:`,
# it stops at once (docs/merge-policy.md).
workline:merge:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: deploy
  environment: *environment
  needs: [workline:judge]
  interruptible: false
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  resource_group: workline-follow   # one at a time, with workline:follow
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_EVENT_TYPE != "merge_train" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID
      when: always
  script:
    - *bot-token
    - *trust
    - git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" && git checkout -q -B "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" FETCH_HEAD
    - if ! grep -qE '^merge:' .workline/config.yaml 2>/dev/null; then echo "workline:" "no merge policy (merge:), nothing to do"; exit 0; fi
    - workline version
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - verdict=; [ ! -s workline-verdict.json ] || verdict=workline-verdict.json
    - workline follow --base "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --forge gitlab ${verdict:+--verdict "$verdict"} --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# Gardening: in a scheduled pipeline (CI/CD → Schedules, weekly), the project's
# `schedule` line runs (by default the documentalist); each task it takes up
# becomes a merge request of its own, on a branch workline/<role>/<task>,
# updated when the task runs again, and no more are proposed while
# max-open-merge-requests of them wait (ADR-0006); those the branch moved
# under are rebuilt on it, or closed when nothing is left to merge
# (ADR-0034). WORKLINE_GITLAB_TOKEN also
# needs the `write_repository` scope, to push the branch. Without AI, only
# derived blocks are regenerated. The release never waits for the docs
# (ADR-0051).
.workline:garden:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  environment: *environment
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:
    # A schedule left from before ADR-0051 (WORKLINE_TASK=release-docs) runs
    # no gardening: delete it (docs/ci-gitlab.md).
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_TASK != "sample" && $WORKLINE_TASK != "release-docs" && $WORKLINE_TASK != "reconcile"
  before_script:                    # one shell with the script: a job without the bot's token stops here
    - *bot-token
    - *trust
    - workline version
    - git checkout -q -B "$CI_COMMIT_REF_NAME"   # GitLab runs on a detached HEAD
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN

workline:garden:judge:
  extends: .workline:garden
  stage: test
  script:
    - *claude
    - *no-credential
    - status=0
    - workline route schedule --ai "$ai" --no-apply --forge gitlab --open-merge-request --summary workline-summary.md --summary workline-summary.html --json > line.json || status=$?
    - exit $status
  allow_failure: {exit_codes: [3]}  # an agent out of reach warns, as on a merge request
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, .workline-runs/, line.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:garden:apply:
  extends: .workline:garden
  stage: deploy
  needs: [workline:garden:judge]
  rules:                            # also when the judge failed: what passed before a step blocked is applied (#142)
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_TASK != "sample" && $WORKLINE_TASK != "release-docs" && $WORKLINE_TASK != "reconcile"
      when: always
  script:
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - status=0
    - workline apply --line line.json --summary workline-summary.md --summary workline-summary.html || status=$?
    # Its merge requests the branch moved under: rebuilt on it, or closed
    # when nothing is left to merge; one a person committed to is theirs
    # (ADR-0034). Needs the first release after v0.24.0.
    - workline follow --gardening --base "$CI_COMMIT_REF_NAME" --forge gitlab --summary workline-summary.md --summary workline-summary.html || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# The tester answers an objection (ADR-0055): a comment opened by
# `workline:objection` on a line of its Draft (branch workline/tester/…).
# GitLab starts no pipeline on a comment: a tool given the project's note
# webhook starts one on the default branch, through the pipelines API or a
# trigger token, with WORKLINE_TASK=objection, MR_IID and MR_SOURCE_BRANCH,
# the merge request (docs/gitlab-trigger.md). The judge proposes, holding the agent's token;
# apply writes the reply and a rewrite, holding the bot's and no agent's,
# from the default branch's checkout (docs/objection-jobs.md).
# Install your test runner in the judge: a rewrite is proven red there.
.workline:objection:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  environment: *environment
  variables: {GIT_DEPTH: 0}
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline") && $WORKLINE_TASK == "objection" && $MR_IID && $MR_SOURCE_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - *bot-token
    - *trust
    - workline version
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - 'case "$MR_SOURCE_BRANCH" in workline/tester/*) ;; *) echo "workline: $MR_SOURCE_BRANCH is not a branch of the tester: nothing to answer"; exit 1;; esac'

# The Draft's head, read before any of its code runs, by a job holding no
# agent: the one the judge reads and apply checks, as the event's on GitHub.
workline:objection:head:
  extends: .workline:objection
  stage: .pre
  script:
    - git ls-remote origin "refs/heads/$MR_SOURCE_BRANCH" | cut -f1 > objection-head
    - 'grep -Eqx "[0-9a-f]{40}|[0-9a-f]{64}" objection-head || { echo "workline: no branch $MR_SOURCE_BRANCH: nothing to answer"; exit 1; }'
  artifacts:
    paths: [objection-head]
    expire_in: 1 day

workline:objection:judge:
  extends: .workline:objection
  stage: test
  needs: [workline:objection:head]
  script:
    - *claude
    # The Draft at the head read before: the test objected to is read there.
    - git fetch -q origin "$MR_SOURCE_BRANCH" && git checkout -q -B "$MR_SOURCE_BRANCH" "$(cat objection-head)"
    - git rev-parse HEAD > answer-head
    - status=0
    - workline test answer --merge-request "$MR_IID" --ai "$ai" --no-apply --forge gitlab --json > answer.json || status=$?
    - jq -r '(.pending // [])[0] // empty | split("/") | last' answer.json > answer-run   # a run left to apply, by name; none when it stopped before
    - exit $status
  allow_failure: {exit_codes: [3]}  # an agent out of reach warns: the objection waits for the next
  artifacts:
    when: always
    paths: [.workline-runs/, answer.json, answer-run, answer-head]
    expire_in: 1 day

workline:objection:apply:
  extends: .workline:objection
  stage: deploy
  needs: [workline:objection:head, workline:objection:judge]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline") && $WORKLINE_TASK == "objection" && $MR_IID && $MR_SOURCE_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - '[ -s answer-run ] || { echo "nothing proposed: nothing to apply"; exit 0; }'
    # The judge ran the Draft's code: its run is data, found by name; the
    # repository, roles and forge are this job's, the default branch's.
    - run=$(cat answer-run)
    - 'printf "%s" "$run" | grep -Eqx "[0-9]{8}T[0-9]{6}\.[0-9]{9}-[a-z0-9-]+" && [ -d "$WORKLINE_RUNS_DIR/$run" ] || { echo "workline: the judge named no run of its own: $run"; exit 1; }'
    # The head is the one read before the judge, never the judge's word.
    - head=$(cat objection-head)
    - '[ "$(cat answer-head 2>/dev/null)" = "$head" ] || { echo "workline: the judge reports a head other than $head, the one read before it: nothing applied"; exit 1; }'
    - status=0
    - workline apply "$run" --from-merge-request "$MR_IID" --head "$head" --forge gitlab --summary workline-summary.md --summary workline-summary.html || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# Your project's setup steps, run by the developer's judges before the
# agent and the proof: redefine `.workline:setup` in your .gitlab-ci.yml,
# its script what your test job installs (a language, a tool); the
# judges' image too, if your tests need another. Empty here: the image as
# it is (roles/developer/docs/triggers.md).
.workline:setup:
  script: []

# The line of states (ADR-0059): the project's issue webhook, pointed at
# its own trigger URL with WORKLINE_TASK=issue, starts a pipeline on every
# issue change; workline:issue reads the event ($TRIGGER_PAYLOAD) and,
# when it put a state's label on an issue whose step is due, starts that
# issue's own pipeline, WORKLINE_TASK=develop and ISSUE_IID, with the
# job's token: any other event exits at once. A pipeline schedule with
# WORKLINE_TASK=reconcile, hourly, does the same for every issue an event
# missed (docs/gitlab-trigger.md). No agent, the bot's token to read.
.workline:start: &start             # each due issue's own pipeline, started with the job's token; one not started is said, the others still started, the job warns (exit 3)
  - |
    missed=
    for n in $(jq -r '(.due // [])[]' due.json); do
      if curl -fsS -o /dev/null -X POST --form token="$CI_JOB_TOKEN" --form ref="$CI_DEFAULT_BRANCH" \
        --form "variables[WORKLINE_TASK]=develop" --form "variables[ISSUE_IID]=$n" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/trigger/pipeline"; then
        echo "workline: #$n's step started"
      else
        echo "workline: #$n's pipeline not started: the reconciler starts it"; missed="$missed #$n"
      fi
    done
    [ -z "$missed" ] || exit 3

workline:issue:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: test
  environment: *environment
  variables: {GIT_DEPTH: 0}
  rules:
    - if: $CI_PIPELINE_SOURCE == "trigger" && $WORKLINE_TASK == "issue" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script: [*bot-token, *trust, export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN]
  script:
    - workline route issue --ai none --forge gitlab --open-merge-request --input reconcile=list --summary workline-summary.md --summary workline-summary.html --json > due.json
    - *start
  allow_failure: {exit_codes: [3]}  # the forge out of reach warns: the reconciler catches it
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, due.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:reconcile:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: test
  environment: *environment
  variables: {GIT_DEPTH: 0}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_TASK == "reconcile"
  before_script: [*bot-token, *trust, export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN]
  script:
    - workline route reconcile --ai none --forge gitlab --open-merge-request --input reconcile=list --summary workline-summary.md --summary workline-summary.html --json > due.json
    - *start
  allow_failure: {exit_codes: [3]}  # the forge out of reach warns: the next hour runs again
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, due.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

# The step an issue's state wakes (ADR-0059), routed `issue: [tester,
# developer]`: the tester on workline:needs-tests, the developer on
# workline:ready (ADR-0054, ADR-0055). A pipeline workline:issue or
# workline:reconcile starts, or a tool, with WORKLINE_TASK=develop and
# ISSUE_IID; without ISSUE_IID, the first ready issue nobody took. One
# run an issue, whichever role (resource_group). Your setup steps run in
# the judge. Why each part: roles/developer/docs/triggers.md.
.workline:develop:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  environment: *environment
  variables: {GIT_DEPTH: 0}
  resource_group: workline-issue-$ISSUE_IID
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline") && $WORKLINE_TASK == "develop" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - *bot-token
    - *trust
    - workline version
    - git checkout -q -B "$CI_COMMIT_REF_NAME"   # GitLab runs on a detached HEAD
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - '[ -z "${ISSUE_IID:-}" ] || printf "%s" "$ISSUE_IID" | grep -Eqx "[0-9]+" || { echo "workline: ISSUE_IID is not an issue number: $ISSUE_IID"; exit 64; }'

# The engine gives the agent no forge token: the bot's reads the issues
# for the pick here, and writes nothing until apply.
workline:develop:judge:
  extends: .workline:develop
  stage: test
  script:
    - *claude
    - !reference [.workline:setup, script]
    - *no-credential
    - status=0
    - workline route issue ${ISSUE_IID:+--target issue:$ISSUE_IID} --ai "$ai" --no-apply --forge gitlab --open-merge-request --summary workline-summary.md --summary workline-summary.html --json > line.json || status=$?
    - exit $status
  allow_failure: {exit_codes: [3]}  # an agent out of reach warns: the issue waits for the next run
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, .workline-runs/, line.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:develop:apply:
  extends: .workline:develop
  stage: deploy
  needs: [workline:develop:judge]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline") && $WORKLINE_TASK == "develop" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - '[ -s line.json ] || { echo "nothing proposed: nothing to apply"; exit 0; }'
    - status=0
    - workline apply --line line.json --summary workline-summary.md --summary workline-summary.html || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# A review round on the developer's own merge request (ADR-0054, step 6):
# the reviewer's verdict or a person's comment. GitLab starts no pipeline
# on a comment: a tool given the note webhook starts one on the default
# branch with WORKLINE_TASK=review, MR_IID and MR_SOURCE_BRANCH
# (docs/gitlab-trigger.md). The judge proposes the fix, holding the
# agent's token; apply pushes it on its branch, holding the bot's
# (roles/developer/docs/review-loop.md). Your setup steps run in the judge.
.workline:review:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  environment: *environment
  variables: {GIT_DEPTH: 0}
  resource_group: workline-review-$MR_IID
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline") && $WORKLINE_TASK == "review" && $MR_IID && $MR_SOURCE_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - *bot-token
    - *trust
    - workline version
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - 'case "$MR_SOURCE_BRANCH" in workline/developer/*) ;; *) echo "workline: $MR_SOURCE_BRANCH is not a branch of the developer: no round"; exit 1;; esac'

# Its head, read before any of its code runs, by a job holding no agent.
workline:review:head:
  extends: .workline:review
  stage: .pre
  script:
    - git ls-remote origin "refs/heads/$MR_SOURCE_BRANCH" | cut -f1 > review-head
    - 'grep -Eqx "[0-9a-f]{40}|[0-9a-f]{64}" review-head || { echo "workline: no branch $MR_SOURCE_BRANCH: no round"; exit 1; }'
  artifacts:
    paths: [review-head]
    expire_in: 1 day

workline:review:judge:
  extends: .workline:review
  stage: test
  needs: [workline:review:head]
  script:
    - *claude
    - !reference [.workline:setup, script]   # before its code is checked out
    - git fetch -q origin "$MR_SOURCE_BRANCH" && git checkout -q -B "$MR_SOURCE_BRANCH" "$(cat review-head)"
    - *no-credential
    - git rev-parse HEAD > round-head
    - status=0
    - workline develop --merge-request "$MR_IID" --ai "$ai" --no-apply --forge gitlab --json > round.json || status=$?
    - jq -r '(.pending // [])[0] // empty | split("/") | last' round.json > round-run   # a run left to apply, by name
    - exit $status
  allow_failure: {exit_codes: [3]}  # an agent out of reach warns: the review waits for the next verdict
  artifacts:
    when: always
    paths: [.workline-runs/, round.json, round-run, round-head]
    expire_in: 1 day

workline:review:apply:
  extends: .workline:review
  stage: deploy
  needs: [workline:review:head, workline:review:judge]
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "pipeline") && $WORKLINE_TASK == "review" && $MR_IID && $MR_SOURCE_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - '[ -s round-run ] || { echo "nothing proposed: nothing to apply"; exit 0; }'
    - run=$(cat round-run)
    - 'printf "%s" "$run" | grep -Eqx "[0-9]{8}T[0-9]{6}\.[0-9]{9}-[a-z0-9-]+" && [ -d "$WORKLINE_RUNS_DIR/$run" ] || { echo "workline: the judge named no run of its own: $run"; exit 1; }'
    - head=$(cat review-head)
    - '[ "$(cat round-head 2>/dev/null)" = "$head" ] || { echo "workline: the judge reports a head other than $head, the one read before it: nothing applied"; exit 1; }'
    - status=0
    - workline apply "$run" --from-merge-request "$MR_IID" --head "$head" --forge gitlab --summary workline-summary.md --summary workline-summary.html || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# A release's dry run, on each schedule but the sample's (ADR-0050): what
# would hold the release if it were cut now from the branch's tip. Every
# step, no agent, nothing applied, said as warnings. Install here the
# tools of your `release` line's gates: they run on the default branch's
# code, with no token. workline:release:dry-run:post says it in the
# default branch's issue (docs/release.md).
workline:release:dry-run:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: test
  environment: *environment
  variables: {GIT_DEPTH: 0}         # the whole history: the release since its tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_TASK != "sample" && $WORKLINE_TASK != "reconcile"
  script:
    - *trust
    - workline version
    - git checkout -q -B "$CI_COMMIT_REF_NAME"   # GitLab runs on a detached HEAD
    - unset CLAUDE_CODE_OAUTH_TOKEN WORKLINE_GITLAB_TOKEN
    - workline route release --dry-run --forge none --summary workline-summary.md --summary workline-summary.html --json > dry-run.json
  allow_failure: {exit_codes: [3]}  # never 3: it asks no agent; as every night's job
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, dry-run.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:release:dry-run:post:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: deploy
  environment: *environment
  needs: [workline:release:dry-run]
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  resource_group: workline-main-issue   # one writer of the default branch's issue at a time, with workline:main:issue
  rules:                            # also when the dry run failed: said
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_TASK != "sample" && $WORKLINE_TASK != "reconcile"
      when: always
  script:
    - *bot-token
    - *trust
    - workline version
    - '[ -s dry-run.json ] || { echo "workline: the release''s dry run left no result: nothing to post"; exit 0; }'
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - workline apply --release-dry-run dry-run.json --forge gitlab --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# The tester's curator, its measures, no agent (ADR-0055, step 6): the
# project's tests run on the branch's tip, each test's time and result kept
# from one run to the next in this job's artifact, read back from the last
# one (GitLab keeps a ref's latest). Said in the job's summary. Opt-in: the
# CI/CD variable WORKLINE_CURATOR set to on, the tester's test-command set,
# and an image holding workline and your test runner. With
# CLAUDE_CODE_OAUTH_TOKEN (scoped to the environment workline) too, workline:curator:judge then proposes a few
# redundant tests removed, and workline:curator:apply opens the merge
# request once the proof holds (step 7, roles/tester/docs/curator.md).
workline:curator:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: test
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_CURATOR == "on" && $WORKLINE_TASK != "sample" && $WORKLINE_TASK != "reconcile"
  timeout: 1h
  script:
    - *trust
    - workline version
    - unset CLAUDE_CODE_OAUTH_TOKEN WORKLINE_GITLAB_TOKEN
    # The judge's, when one ran: it adds the folder it weighed.
    - 'h="$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_REF_NAME/raw/curator-history.json"; curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" -o curator-history.json "$h?job=workline%3Acurator%3Ajudge" || curl -fsS -H "JOB-TOKEN: $CI_JOB_TOKEN" -o curator-history.json "$h?job=workline%3Acurator" || { rm -f curator-history.json; echo "workline: no history of the curator''s: the first measure"; }'
    - workline test measure --history curator-history.json --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, curator-history.json]
    expire_in: 90 days

# The curator's removals (step 7): the agent weighs one folder of tests,
# the engine proves its removal with no agent (the tester's
# curator-proof-command and curator-mutation-command, which your image
# runs); the bot's token opens the merge request, merged by your policy.
workline:curator:judge:
  extends: .workline:garden
  stage: test
  needs: [{job: "workline:curator", artifacts: true}]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_CURATOR == "on" && $WORKLINE_TASK != "sample" && $WORKLINE_TASK != "reconcile"
  timeout: 1h
  script:
    - *claude
    - '[ "$ai" != none ] || { echo "workline: no CLAUDE_CODE_OAUTH_TOKEN: the curator measures, and removes nothing"; exit 0; }'
    - status=0
    - workline test curate --history curator-history.json --ai "$ai" --no-apply --forge gitlab --json > curate.json || status=$?
    - jq -r '(.pending // [])[0] // empty | split("/") | last' curate.json > curate-run   # a run left to apply, by name
    - jq -r '.summary // empty' curate.json
    - exit $status
  allow_failure: {exit_codes: [3]}  # an agent out of reach warns: the next week weighs again
  artifacts:
    when: always
    paths: [.workline-runs/, curate.json, curate-run, curator-history.json]
    expire_in: 90 days

workline:curator:apply:
  extends: .workline:garden
  stage: deploy
  needs: [workline:curator:judge]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_CURATOR == "on" && $WORKLINE_TASK != "sample" && $WORKLINE_TASK != "reconcile"
      when: always
  script:
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - '[ -s curate-run ] || { echo "nothing proposed: nothing to apply"; exit 0; }'
    - run=$(cat curate-run)
    - 'printf "%s" "$run" | grep -Eqx "[0-9]{8}T[0-9]{6}\.[0-9]{9}-[a-z0-9-]+" && [ -d "$WORKLINE_RUNS_DIR/$run" ] || { echo "workline: the judge named no run of its own: $run"; exit 1; }'
    - status=0
    - workline apply "$run" --summary workline-summary.md --summary workline-summary.html || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# At a release's tag (ADR-0050; the first release after v0.37.0), whoever
# pushed it: the release's line, its gates, no agent, no token, red when it
# holds the release; never the docs (ADR-0051). Have the jobs that
# publish it need it (`needs: [workline:release]`). A tool that tags and
# publishes in one job (semantic-release) runs `workline route release
# --ai none` before it, in that job. Why and how: docs/release.md.
workline:release:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: test
  variables: {GIT_DEPTH: 0}         # the whole history: the release before this one
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - *trust
    - workline version
    - git fetch --quiet --tags origin || true   # every release tag, the one before this
    - unset CLAUDE_CODE_OAUTH_TOKEN WORKLINE_GITLAB_TOKEN GITLAB_TOKEN
    - status=0
    - workline route release --ai none --forge none --summary workline-summary.md --summary workline-summary.html --json > release.json || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, release.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# Main after a merge (ADR-0050; the first release after v0.37.0), each
# push to the default branch, no token, no agent: the gates, red when the
# push adds what they count, their findings kept in its artifacts by the
# commit for workline:gates to read; then the whole repository's checks.
# No Code Quality report: the merge requests' widget compares with it.
# workline:main:issue keeps what it found in one issue
# (docs/main-after-merge.md). No environment: GitLab gives it none of the
# variables scoped to workline; it unsets them still, as workline:gates.
workline:main:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: test
  needs: [{job: "workline:base", artifacts: true}]
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # Its artifact, .workline-kept/, holds the findings of the last 20
  # commits main's pipelines analysed, carried from its last successful
  # pipeline, as workline:base read them: the only writer of the merge
  # requests' base.
  before_script:
    - *trust
    - workline version
    - mkdir -p .workline-kept       # workline:base's artifact, or none kept
  script:
    - unset CLAUDE_CODE_OAUTH_TOKEN WORKLINE_GITLAB_TOKEN GITLAB_TOKEN
    - status=0
    - >
      workline route main --ai none --forge none --gates-kept .workline-kept
      --input range=$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA
      --summary workline-summary.md --summary workline-summary.html --json > main.json || status=$?
    - |
      { echo "$CI_COMMIT_SHA"; cat .workline-kept/commits 2>/dev/null || true; } | awk 'NF && !seen[$0]++' | head -n 20 > .workline-kept/next || true
      : > .workline-kept/commits; while read -r c; do [ ! -s ".workline-kept/$c.json" ] || echo "$c" >> .workline-kept/commits; done < .workline-kept/next
      for f in .workline-kept/*.json; do grep -qxF "$(basename "$f" .json)" .workline-kept/commits || rm -f "$f"; done; rm -f .workline-kept/next
    - exit $status
  allow_failure: {exit_codes: [3]}  # a source repository out of reach warns, as on a merge request
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, main.json, .workline-kept/]
    reports: {annotations: workline-annotations.json}
    expire_in: 30 days

workline:main:issue:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: deploy
  environment: *environment
  needs: [workline:main]
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:                            # red too: the issue says so
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  resource_group: workline-main-issue   # one at a time: each reads the issue the one before left
  script:
    - *bot-token
    - *trust
    - workline version
    - '[ -s main.json ] || { echo "workline: main''s run left no result: nothing to keep"; exit 0; }'
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - workline apply --main main.json --forge gitlab --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# When the default branch moves, no agent (`workline follow`): with the
# merge policy (`merge:`), as workline:merge. It writes to no person's
# merge request.
workline:follow:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: deploy
  environment: *environment
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  resource_group: workline-follow   # one at a time, with workline:merge
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - *bot-token
    - *trust
    - workline version
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - workline follow --base "$CI_DEFAULT_BRANCH" --forge gitlab --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# The weekly sample of every role's acts (ADR-0014, step 4; ADR-0046): a
# second pipeline schedule, weekly (Mondays, after the gardening), with the
# variable WORKLINE_TASK=sample. One in ten of the docs whose `checked` the
# documentalist moved in the week before is read whole against its sources
# by a judge standing apart from the model that vouched: the documentalist's
# `sample.judge` setting, or the variable WORKLINE_JUDGE (claude:opus when
# the gardening vouches with Sonnet). The other roles' acts are drawn too,
# one in ten per kind, read from the issues and merge requests with the
# project's token, as the gardening reads them, and re-checked by the same
# judge, within `sample.ai-max-tokens`. What it found goes to one tracking
# issue, a comment a week; a `checked` found false labels it
# documentalist-step-0, and a merge request puts it back, for a person.
# The week sampled is the last whole one; for another, set the variable
# WORKLINE_SAMPLE_WEEK (2026-W40) on the schedule, then play it. A schedule's
# variables need Settings > CI/CD > Variables, "Minimum role to use pipeline
# variables", at Maintainer: no one, by default, on a new gitlab.com
# project, and setting one is refused (403).
# Needs a workline release with `workline sample`: the first after v0.2.1.
.workline:sample:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  environment: *environment
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_TASK == "sample"
  before_script:                    # one shell with the script: a job without the bot's token stops here
    - *bot-token
    - *trust
    - workline version
    - git checkout -q -B "$CI_COMMIT_REF_NAME"   # GitLab runs on a detached HEAD

workline:sample:read:               # the agent reads; nothing is written
  extends: .workline:sample
  stage: test
  script:
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN   # the acts recorded on issues and merge requests, read
    - *claude
    - status=0
    - workline sample ${WORKLINE_SAMPLE_WEEK:+--week "$WORKLINE_SAMPLE_WEEK"} --forge gitlab --out sample.json --summary workline-summary.md --summary workline-summary.html || status=$?
    - '[ "$status" != 1 ]'           # 2 and 3: for a person, on the issue
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, sample.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:sample:write:              # writes to the forge; no agent installed
  extends: .workline:sample
  stage: deploy
  needs: [workline:sample:read]
  script:
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - *bot
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - workline sample --apply sample.json --forge gitlab --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week
