# workline on GitLab CI — include it from .gitlab-ci.yml:
#   include: {local: ci/workline.gitlab-ci.yml}
# Tried on gitlab.com (2026-10-01): Claude judges, the fix is committed to the
# merge request's branch. A free account must verify itself (phone or card)
# before its pipelines run. A fork's merge request is untried.
#
# The project's routing decides what runs on a merge request (.workline/config.yaml,
# `routing:`; by default the committer, then the documentalist).
#
# Two jobs, two trust zones (docs/research/server-side.md):
#   judge  runs the line, no write token, stops before applying (--no-apply).
#          With the variable CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, a
#          Claude subscription; masked), Claude judges; without it, the docs
#          are listed for a person. GitLab gives a variable to the whole job,
#          installs included, where GitHub gives it to one step.
#   The findings show in the merge request's Code Quality report, on every tier.
#   Each job also writes its summary (`--summary`): what ran, each step's
#   verdict, the findings, what waits to be applied; the applying job adds
#   what it applied to the judging job's. workline-summary.md is printed at
#   the end of the log; workline-summary.html, a page GitLab shows (an .md
#   artifact it only downloads), is linked from the job's page (Annotations)
#   and from the merge request's (`expose_as`). `--summary` needs the first
#   release after v0.16.0.
#   apply  holds WORKLINE_GITLAB_TOKEN (a project access token, role Developer,
#          scopes `api` and `write_repository`: one glab command in
#          docs/ci.md makes and stores it; CI_JOB_TOKEN reaches no issue) and
#          no AI key. A doc fix is committed to the merge request's branch
#          (--push-to-merge-request).
#
# Both variables are masked, and NOT protected: GitLab gives a protected
# variable only to protected branches, never to a merge request's. Anyone who
# may push a branch can then read them from a pipeline they change — people
# who may already write to the repository. A fork's merge request runs in the
# fork, which has neither: it is judged without an agent, and nothing is
# applied or commented.
#
# The jobs run in workline's image (Dockerfile): the engine at WORKLINE_VERSION
# and the tools its roles use, nothing to build. A self-managed GitLab whose
# runners cannot reach ghcr.io copies it into its own registry and sets
# WORKLINE_IMAGE; its own certificate authority (CI_SERVER_TLS_CA_FILE) is
# trusted; the engine talks to the instance the job runs on (CI_API_V4_URL).
# The agent still needs npm's registry and Anthropic's API.
variables:
  WORKLINE_VERSION: v0.16.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_IMAGE: ghcr.io/jn0v/workline
  WORKLINE_RUNS_DIR: $CI_PROJECT_DIR/.workline-runs

.workline:trust: &trust             # a self-managed instance's own authority, when it has one
  - '[ -z "${CI_SERVER_TLS_CA_FILE:-}" ] || cat "$CI_SERVER_TLS_CA_FILE" >> /etc/ssl/certs/ca-certificates.crt'
.workline:summary: &summary         # the summary, at the end of the log and linked from the job's page
  - '[ ! -s workline-summary.md ] || cat workline-summary.md'
  - printf '{"workline":[{"external_link":{"label":"workline summary","url":"%s/artifacts/file/workline-summary.html"}}]}\n' "$CI_JOB_URL" > workline-annotations.json
.workline:claude: &claude           # the agent, only when the project gives its token
  - ai=none
  - if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then npm install -g --silent @anthropic-ai/claude-code && ai=claude; fi

.workline:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  variables: {GIT_DEPTH: 0}         # the whole history: docs are compared since their `checked`, the release since its tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - *trust
    - workline version
    - git fetch --quiet origin $CI_MERGE_REQUEST_DIFF_BASE_SHA || true

workline:judge:
  extends: .workline
  stage: test
  script:
    - *claude
    - status=0
    - >
      workline route merge-request --ai "$ai" --no-apply --push-to-merge-request
      --forge gitlab --target merge-request:$CI_MERGE_REQUEST_IID --branch "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      --input range=$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA
      --code-quality gl-code-quality.json --summary workline-summary.md --summary workline-summary.html --json > line.json || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always                    # steps that passed before one blocked are still applied
    expose_as: workline summary
    paths: [workline-summary.html, workline-summary.md, .workline-runs/, line.json]
    reports: {codequality: gl-code-quality.json, annotations: workline-annotations.json}
    expire_in: 1 day

workline:apply:
  extends: .workline
  stage: deploy
  needs: [workline:judge]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $WORKLINE_GITLAB_TOKEN
      when: always
  script:
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - git config user.name "workline"
    - git config user.email "workline@noreply.$CI_SERVER_HOST"
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - workline apply --line line.json --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    expose_as: workline applied
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# Gardening: in a scheduled pipeline (CI/CD → Schedules, weekly), the project's
# `schedule` line runs (by default the documentalist); each task it takes up
# becomes a merge request of its own, on a branch workline/<role>/<task>,
# updated when the task runs again, and no more are proposed while
# max-open-merge-requests of them wait (ADR-0006). WORKLINE_GITLAB_TOKEN also
# needs the `write_repository` scope, to push the branch. Without AI, only
# derived blocks are regenerated.
.workline:garden:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_GITLAB_TOKEN && $WORKLINE_TASK != "sample"
  before_script:
    - *trust
    - workline version
    - git checkout -q -B "$CI_COMMIT_REF_NAME"   # GitLab runs on a detached HEAD
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN

workline:garden:judge:
  extends: .workline:garden
  stage: test
  script:
    - *claude
    - status=0
    - workline route schedule --ai "$ai" --no-apply --forge gitlab --open-merge-request --summary workline-summary.md --summary workline-summary.html --json > line.json || status=$?
    - exit $status
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, .workline-runs/, line.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:garden:apply:
  extends: .workline:garden
  stage: deploy
  needs: [workline:garden:judge]
  script:
    - git config user.name "workline"
    - git config user.email "workline@noreply.$CI_SERVER_HOST"
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - workline apply --line line.json --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week

# The release's own fix follows the default branch (ADR-0034): when it
# moves, the documentalist's merge request for the release, when one is
# open (workline/documentalist/release), is rebuilt on its new tip and
# force-pushed, as release-please rebuilds its own branch, so a merge
# request that touched the same doc leaves it mergeable. No agent; one a
# person committed to is left as it is. Needs a workline release with
# `workline follow`: the first after v0.16.0.
workline:follow:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  stage: deploy
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $WORKLINE_GITLAB_TOKEN
  script:
    - *trust
    - workline version
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - git config user.name "workline"
    - git config user.email "workline@noreply.$CI_SERVER_HOST"
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - workline follow --base "$CI_DEFAULT_BRANCH" --forge gitlab

# The weekly sample of the docs vouched for (ADR-0014, step 4): a second
# pipeline schedule, weekly (Mondays, after the gardening), with the variable
# WORKLINE_TASK=sample. One in ten of the docs whose `checked` the
# documentalist moved in the week before is read whole against its sources
# by a judge standing apart from the model that vouched: the documentalist's
# `sample.judge` setting, or the variable WORKLINE_JUDGE (claude:opus when
# the gardening vouches with Sonnet). What it found goes to one tracking
# issue, a comment a week; a `checked` found false labels it
# documentalist-step-0, and a merge request puts it back, for a person.
# The week sampled is the last whole one; for another, set the variable
# WORKLINE_SAMPLE_WEEK (2026-W40) on the schedule, then play it. A schedule's
# variables need Settings > CI/CD > Variables, "Minimum role to use pipeline
# variables", at Maintainer: no one, by default, on a new gitlab.com
# project, and setting one is refused (403).
# Needs a workline release with `workline sample`: the first after v0.2.1.
.workline:sample:
  image: $WORKLINE_IMAGE:$WORKLINE_VERSION
  variables: {GIT_DEPTH: 0}         # the whole history, as .workline
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $WORKLINE_GITLAB_TOKEN && $WORKLINE_TASK == "sample"
  before_script:
    - *trust
    - workline version
    - git checkout -q -B "$CI_COMMIT_REF_NAME"   # GitLab runs on a detached HEAD

workline:sample:read:               # the agent reads; nothing is written
  extends: .workline:sample
  stage: test
  script:
    - *claude
    - status=0
    - workline sample ${WORKLINE_SAMPLE_WEEK:+--week "$WORKLINE_SAMPLE_WEEK"} --out sample.json --summary workline-summary.md --summary workline-summary.html || status=$?
    - '[ "$status" != 1 ]'           # 2 and 3: for a person, on the issue
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md, sample.json]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 day

workline:sample:write:              # writes to the forge; no agent installed
  extends: .workline:sample
  stage: deploy
  needs: [workline:sample:read]
  script:
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - git config user.name "workline"
    - git config user.email "workline@noreply.$CI_SERVER_HOST"
    - git remote set-url origin "https://oauth2:${WORKLINE_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - workline sample --apply sample.json --forge gitlab --summary workline-summary.md --summary workline-summary.html
  after_script: *summary
  artifacts:
    when: always
    paths: [workline-summary.html, workline-summary.md]
    reports: {annotations: workline-annotations.json}
    expire_in: 1 week
