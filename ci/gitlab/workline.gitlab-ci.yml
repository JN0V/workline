# workline on GitLab CI — include it from .gitlab-ci.yml:
#   include: {local: ci/workline.gitlab-ci.yml}
# Not yet tried on a live GitLab instance.
#
# The project's routing decides what runs on a merge request (.workline/config.yaml,
# `routing:`; by default the committer, then the documentalist).
#
# Two jobs, two trust zones (docs/research/server-side.md):
#   judge  runs the line, no write token, stops before applying (--no-apply).
#   apply  holds WORKLINE_GITLAB_TOKEN (a project access token with the `api`
#          scope, stored as a protected, masked variable) and no AI key.
variables:
  WORKLINE_VERSION: main            # pin a tag or commit once releases exist
  WORKLINE_RUNS_DIR: $CI_PROJECT_DIR/.workline-runs

.workline:
  image: golang:1.27
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - go install github.com/JN0V/workline/cmd/workline@$WORKLINE_VERSION
    - export PATH=$PATH:$(go env GOPATH)/bin
    - git fetch --quiet origin $CI_MERGE_REQUEST_DIFF_BASE_SHA || true

workline:judge:
  extends: .workline
  stage: test
  script:
    - status=0
    - >
      workline route merge-request --ai none --no-apply
      --forge gitlab --target merge-request:$CI_MERGE_REQUEST_IID
      --input range=$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA
      --json > line.json || status=$?
    - exit $status
  artifacts:
    when: always                    # steps that passed before one blocked are still applied
    paths: [.workline-runs/, line.json]
    expire_in: 1 day

workline:apply:
  extends: .workline
  stage: deploy
  needs: [workline:judge]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $WORKLINE_GITLAB_TOKEN
      when: always
  script:
    - go install gitlab.com/gitlab-org/cli/cmd/glab@latest
    - export GITLAB_TOKEN=$WORKLINE_GITLAB_TOKEN
    - workline apply --line line.json
