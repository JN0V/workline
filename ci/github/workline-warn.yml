# workline on GitHub Actions, what only warns, apart from the verdict — copy
# to .github/workflows/workline-warn.yml, beside workline.yml and
# workline-apply.yml (the first release after v0.36.0).
#
# The reviewer's lenses that only warn (its `ai-findings`, ADR-0050):
# workline.yml's judge asks the lenses that block (--warn-apart), and the
# head's verdict waits for nothing else. This workflow asks the others on
# the same push, beside it (--warn-only); workline-apply.yml posts what they
# found once they answered, in a comment of their own, maybe after the
# verdict was given. Never a verdict, never holding one: a lens that fails
# is said there, the job green; only the engine's own error fails it.
# Without the reviewer in the line, or with every lens blocking, it ends at
# once.
#
# The pull request's own, as workline.yml: GitHub runs the copy its branch
# holds; no write token, never the GitHub App's key (ADR-0044). With the
# secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, a Claude
# subscription), Claude reads; for another agent, change --ai to a `cmd:`.
# Without it, or on a fork, which gets no secrets, it ends at once: the
# lenses need an agent.
name: workline warn
on:
  pull_request: {types: [opened, synchronize, reopened, ready_for_review]}
permissions: {}
# One run per pull request: a push cancels the run still on the head before,
# whose record did not move: the newer run reads its commits too.
concurrency: {group: "workline-warn-${{ github.event.pull_request.number }}", cancel-in-progress: true}

env:
  WORKLINE_VERSION: v0.37.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  warn:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # One review apart at a time per pull request, with workline-apply.yml's
    # apply of this workflow's runs, neither cancelling the other: a push
    # waits while the run before it is applied, then reads its record.
    concurrency: {group: "workline-warn-review-${{ github.event.pull_request.number }}", cancel-in-progress: false}
    # pull-requests read: its own comment, the record of what it read, and
    # the pull request's title and body.
    permissions: {contents: read, pull-requests: read}
    env:
      HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"
    steps:
      - name: No agent, nothing read apart
        if: env.HAS_CLAUDE != 'true'
        run: echo "no CLAUDE_CODE_OAUTH_TOKEN, nothing is read apart; the lenses that warn need an agent"
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE == 'true'
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}"}
      # The lenses that warn are the reviewer's: with no reviewer in the
      # project's config, nothing reads apart, nothing is installed. Nor
      # when no workflow applies what they propose, said: their record would
      # never move, and every push read them all again.
      - name: Whether anything reads apart
        id: any
        if: env.HAS_CLAUDE == 'true'
        run: |
          if ! grep -qsw reviewer .workline/config.yaml; then
            echo "no reviewer in .workline/config.yaml, nothing reads apart"
          elif ! grep -qsE 'workflows: \[.*workline warn' .github/workflows/*.yml; then
            echo "::warning title=workline::no workflow applies what the lenses that warn propose, so they do not read; copy workline-apply.yml of this release beside workline-warn.yml (docs/ci-github.md)"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi
      # The engine at the version pinned above, checksum verified, and the
      # agent; not on a draft, which asks none (ADR-0050): the engine only
      # keeps the record there.
      - name: workline, and Claude
        if: steps.any.outputs.any == 'true'
        env: {DRAFT: "${{ github.event.pull_request.draft }}"}
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
          [ "$DRAFT" = true ] || npm install -g @anthropic-ai/claude-code
      - name: What only warns, apart from the verdict (proposals only)
        id: line
        if: steps.any.outputs.any == 'true'
        # As workline.yml's judge: every lens once when opened or marked
        # ready, the draft state on every run (ADR-0020, #359); on a draft,
        # no lens (ADR-0050).
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          ready=; case "$ACTION:$DRAFT" in opened:false|ready_for_review:*) ready=1 ;; esac
          status=0
          workline route merge-request --warn-only --ai claude --no-apply \
            --forge github --target merge-request:${{ github.event.pull_request.number }} --branch "$HEAD_REF" \
            --input range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} ${ready:+--input lenses=all} --input draft="$DRAFT" \
            --summary workline-summary.md --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          [ ! -s workline-summary.md ] || cat workline-summary.md
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p report && echo "${{ github.event.pull_request.number }}" > report/number
      # Applied by workline-apply.yml, from the default branch.
      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs\nreport/number", include-hidden-files: true}
      # Never the head's verdict: what only warns fails no check. An agent
      # out of reach (3) is said; only the engine's own error fails the job.
      - name: Said
        if: steps.any.outputs.any == 'true'
        env: {STATUS: "${{ steps.line.outputs.status }}"}
        run: |
          case "$STATUS" in
            0) ;;
            3) echo "::warning title=workline::the agent could not be reached: the lenses that warn did not read this push" ;;
            *) exit "${STATUS:-1}" ;;
          esac
