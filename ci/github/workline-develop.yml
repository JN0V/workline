# workline's developer woken by a ready issue, on GitHub Actions — copy to
# .github/workflows/workline-develop.yml, and route it in
# .workline/config.yaml: `routing: {events: {issue: [developer]}}`.
# An issue labelled workline:ready (the product owner's, or a person's)
# runs the project's `issue` line on that issue: the developer claims it,
# writes its code, proves it with your test command, and opens its pull
# request (ADR-0054). Run by hand with no issue, it takes the first ready
# issue nobody took. Its schedule is gardening's: list `developer` in the
# `schedule` line (roles/developer/docs/triggers.md).
# A label the job's own token puts starts no workflow on GitHub: the App's
# does; else the schedule takes the issue.
#
# Two jobs, two trust zones, as gardening's:
#   judge  the agent (secret CLAUDE_CODE_OAUTH_TOKEN), a read token for the
#          pick, no write token; the engine gives the agent no forge token
#          at all. It runs your test command: install your test runner
#          there. Without the agent, the issue is named, nothing claimed.
#   apply  the App's key (environment workline-app), no AI key: the
#          claim, the branch, the pull request.
name: workline develop
on:
  issues: {types: [labeled]}
  workflow_dispatch:
    inputs:
      issue: {description: "the ready issue to take; empty: the first nobody took", required: false, default: ""}
permissions: {}
# One developer at a time: a second run waits, and reads the first's claim.
# GitHub keeps one run waiting: an older one waiting is dropped, its issue
# left to the next run or the schedule.
concurrency: {group: workline-develop, cancel-in-progress: false}

env:
  WORKLINE_VERSION: v0.52.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'workline:ready' && github.event.issue.state == 'open' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, issues: read}
    env: {HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"}
    outputs:
      proposed: ${{ steps.line.outputs.proposed }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The engine at the version pinned above, from its release, checksum
      # verified: seconds, not a build.
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code
      # Your test runner here: the developer proves its code with the
      # tester's `test-command` before it opens the pull request.
      - name: The issue line (proposals only)
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLINE_APP_ID: ${{ vars.WORKLINE_APP_ID }}   # the App whose comments keep the records a role reads back (ADR-0051)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          target=
          if [ -n "$ISSUE" ]; then
            printf '%s' "$ISSUE" | grep -Eqx '[0-9]+' || { echo "::error title=workline::not an issue number: $ISSUE"; exit 64; }
            target="--target issue:$ISSUE"
          fi
          status=0
          workline route issue $target --ai "$ai" --no-apply --forge github --open-merge-request --summary workline-summary.md --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          [ ! -s workline-summary.md ] || cat workline-summary.md
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs", include-hidden-files: true, retention-days: 1}

      - name: Verdict
        run: |
          status=${{ steps.line.outputs.status }}
          if [ "$status" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the issue waits for the next run"
            exit 0
          fi
          exit "$status"

  apply:
    needs: judge
    if: always() && needs.judge.outputs.proposed == 'true'
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    permissions: {contents: write, pull-requests: write, issues: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with: {name: workline-runs}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # workline's own account: the records it trusts
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline apply --line line.json --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
