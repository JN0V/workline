# The developer's bounds on its pull request, on GitHub Actions: copy to
# .github/workflows/workline-bounds.yml, then require the check
# `workline bounds` on the default branch (roles/developer/docs/bounds.md#on-the-pull-request;
# ADR-0058). On a pull request from a workline/developer/<n> branch, each
# file changed since its base is held to issue n's bounds, read at the
# base's tip: one refused fails the check, whoever pushed it.
#
# `pull_request_target`: GitHub runs this file as the default branch
# holds it, never the pull request's copy, so a pull request cannot edit
# its own check. Its code is never run here: the checkout is the base's,
# the head fetched as data for git to diff, no agent, no tool of the
# project. Another branch's pull request skips the job, which a required
# check takes as passed: a person's, reviewed as theirs.
#   bounds        a read token; its verdict is the check.
#   bounds-apply  the App's key (environment workline-app), no AI key: the
#                 verdict kept on the pull request, for the auditor.
name: workline bounds
on:
  pull_request_target: {types: [opened, synchronize, reopened]}
permissions: {}
# A push cancels the check still on the head before.
concurrency: {group: "workline-bounds-${{ github.event.pull_request.number }}", cancel-in-progress: true}

env:
  WORKLINE_VERSION: v0.57.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  bounds:
    name: workline bounds           # the check branch protection requires
    if: startsWith(github.event.pull_request.head.ref, 'workline/developer/')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, issues: read}
    outputs:
      run: ${{ steps.bounds.outputs.run }}
    steps:
      # The base's tip, every branch: the rules are read there, and the
      # tester's Draft its frozen tests come from.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      # The head, as data: fetched, never checked out. Its branch's name is
      # anyone's text: a variable, never written into the script.
      - name: The bounds
        id: bounds
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLINE_APP_ID: ${{ vars.WORKLINE_APP_ID }}   # the App whose comments keep the records the bounds read (ADR-0051)
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch -q origin "+$HEAD_SHA:refs/remotes/origin/$HEAD_REF"
          status=0
          workline develop --bounds --merge-request "$PR" --ai none --no-apply --forge github \
            --input range="$GITHUB_SHA..$HEAD_SHA" --json > bounds.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "run=$(jq -r '(.pending // [])[0] // empty | split("/") | last' bounds.json)" >> "$GITHUB_OUTPUT"
          jq -r '.summary // empty' bounds.json
          jq -r '.summary // empty' bounds.json >> "$GITHUB_STEP_SUMMARY"
          jq -r '.findings[]? | "::error file=\(.where // ""),title=workline bounds::\(.rule): \(.message)"' bounds.json || true
      - uses: actions/upload-artifact@v4
        if: steps.bounds.outputs.run != ''
        with: {name: workline-bounds, path: .workline-runs, include-hidden-files: true, retention-days: 1}
      - name: Verdict
        env: {STATUS: "${{ steps.bounds.outputs.status }}"}
        run: exit "${STATUS:-1}"

  # The verdict kept on the pull request, its sticky comment, refused or
  # not: data from the job above, no code of the pull request.
  bounds-apply:
    needs: bounds
    if: always() && needs.bounds.outputs.run != ''
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    permissions: {pull-requests: write, issues: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with: {name: workline-bounds, path: "${{ runner.temp }}/workline-runs"}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # workline's own account: the records it trusts
          WORKLINE_RUNS_DIR: ${{ runner.temp }}/workline-runs
          RUN: ${{ needs.bounds.outputs.run }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$RUN" | grep -Eqx '[0-9]{8}T[0-9]{6}\.[0-9]{9}-[a-z0-9-]+' && [ -d "$WORKLINE_RUNS_DIR/$RUN" ] ||
            { echo "::error title=workline::the bounds named no run of their own: $RUN"; exit 1; }
          workline apply "$RUN" --from-merge-request "$PR" --head "$HEAD_SHA" --forge github
