# workline: the release pull request's docs, at night — copy to
# .github/workflows/workline-release-docs.yml, beside workline-gardening.yml.
#
# On each move of a release tool's pull request (release-please's), no agent
# judges its docs: the documentalist counts those due and holds the release
# (ADR-0050). This workflow judges them every night, with the agent, on
# that pull request's head, and proposes their fix in a pull request of
# its own, workline/documentalist/release, which the release waits for.
# With no release pull request open, or none of its docs due, it asks no
# agent. Run it by hand (Actions → Run workflow) for the release sooner.
#
# Not every night: the weekly gardening judges the release first, on its
# own night (Mondays here). Keep the two apart if you move either; with a
# nightly gardening, this workflow is not needed.
#
# Two jobs, two trust zones, as gardening's:
#   judge  finds the release pull request and judges its docs, with the
#          agent's token (CLAUDE_CODE_OAUTH_TOKEN), reading the forge only.
#   apply  holds the write token and no AI key: it pushes the fix's branch
#          and opens its pull request. With the GitHub App (variable
#          WORKLINE_APP_ID, secret WORKLINE_APP_PRIVATE_KEY in the
#          environment workline-app), the fix is the App's only when the
#          App alone pushed to the release's branch.
# Needs the first release after v0.37.0.
name: workline release docs
on:
  schedule: [{cron: "47 2 * * 0,2-6"}]   # every night but Monday, the gardening's; off the hour
  workflow_dispatch:
permissions: {}

env:
  WORKLINE_VERSION: v0.37.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}
    env: {HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"}
    outputs:
      proposed: ${{ steps.line.outputs.proposed }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The engine at the version pinned above, and the tools its roles use,
      # from their releases, checksums verified: seconds, not a build.
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # The release tool's pull request open into this branch, found on the
      # forge (--target merge-request:release): its docs due judged on its
      # head, checked out for the run, then put back.
      - name: The release pull request's docs (proposals only)
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          status=0
          workline route release --target merge-request:release --ai "$ai" --no-apply --forge github --summary workline-summary.md --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          [ ! -s workline-summary.md ] || cat workline-summary.md
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs", include-hidden-files: true}

      - name: Verdict
        run: |
          status=${{ steps.line.outputs.status }}
          if [ "$status" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the release's docs wait for the next night"
            exit 0
          fi
          exit "$status"

  apply:
    needs: judge
    if: always() && needs.judge.outputs.proposed == 'true'
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    permissions: {contents: write, pull-requests: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - uses: actions/download-artifact@v4
        with: {name: workline-runs}
      # Applied on the head judged, checked out again; nothing once the
      # release tool moved its branch since (the next night judges it).
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # the release's fix is its pull request only if it alone pushed to the release's branch
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline apply --line line.json --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
