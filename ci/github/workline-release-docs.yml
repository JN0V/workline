# workline: the release pull request's docs, the nights the gardening does
# not run — copy to .github/workflows/, beside workline-gardening.yml.
# judge finds the release pull request and judges its docs due with the
# agent; none due, no agent. apply, the App's token and no AI key, opens
# their fix in workline/documentalist/release. Run it by hand for the
# release sooner. With a nightly gardening, not needed. Why and how:
# docs/ci-github.md (ADR-0050). Needs the first release after v0.37.0.
# The release's dry run too, as on the gardening's night (dry-run below):
# what would hold the release if it were cut now, every night.
name: workline release docs
on:
  schedule: [{cron: "47 2 * * 0,2-6"}]   # every night but Monday, the gardening's; off the hour
  workflow_dispatch:
permissions: {}

env:
  WORKLINE_VERSION: v0.38.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}
    env: {HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"}
    outputs:
      proposed: ${{ steps.line.outputs.proposed }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The engine at the version pinned above, and the tools its roles use,
      # from their releases, checksums verified: seconds, not a build.
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # The release tool's pull request open into this branch, found on the
      # forge (--target merge-request:release): its docs due judged on its
      # head, checked out for the run, then put back.
      - name: The release pull request's docs (proposals only)
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          status=0
          workline route release --target merge-request:release --ai "$ai" --no-apply --forge github --summary workline-summary.md --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          [ ! -s workline-summary.md ] || cat workline-summary.md
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs", include-hidden-files: true}

      - name: Verdict
        run: |
          status=${{ steps.line.outputs.status }}
          if [ "$status" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the release's docs wait for the next night"
            exit 0
          fi
          exit "$status"

  apply:
    needs: judge
    if: always() && needs.judge.outputs.proposed == 'true'
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    permissions: {contents: write, pull-requests: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - uses: actions/download-artifact@v4
        with: {name: workline-runs}
      # Applied on the head judged, checked out again; nothing once the
      # release tool moved its branch since (the next night judges it).
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # the release's fix is its pull request only if it alone pushed to the release's branch
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline apply --line line.json --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # A release's dry run, every night this runs (ADR-0050; the first release
  # after v0.37.0): what would hold the release if it were cut now — on
  # the release tool's pull request open into this branch, its head; else
  # this branch's tip. The release's line, every step, no agent, nothing
  # applied: said as warnings, never a block. Install the tools of the
  # gates your `release` line runs here. dry-run-post says what it found in
  # one comment on that pull request, else in the default branch's issue
  # (docs/release.md).
  dry-run:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}   # the release's pull request, found
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: What would hold the release (said, never a block)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          workline route release --dry-run --forge github --summary workline-summary.md --json > dry-run.json
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: workline-dry-run, path: dry-run.json, if-no-files-found: ignore}

  dry-run-post:
    needs: dry-run
    if: always()                    # a dry run that left no result is said
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    # One writer of the default branch's issue at a time, with main's.
    concurrency: {group: "workline-main-issue", cancel-in-progress: false}
    permissions: {contents: read, pull-requests: write, issues: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - uses: actions/download-artifact@v4
        continue-on-error: true         # none: said below
        with: {name: workline-dry-run}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          [ -s dry-run.json ] || { echo "::warning title=workline::the release's dry run left no result: nothing posted"; exit 0; }
          status=0
          workline apply --release-dry-run dry-run.json --forge github --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
