# workline's tester answering an objection, on GitHub Actions — copy to
# .github/workflows/workline-answer.yml, with workline-objection.yml beside it.
# judge: the agent (secret CLAUDE_CODE_OAUTH_TOKEN), no write token; it runs
# your test command on the Draft's head: install your test runner there.
# apply: the App's key (environment workline-app), no AI key, from the
# default branch's checkout. Why: docs/objection-jobs.md.
name: workline answer
on:
  workflow_run: {workflows: [workline objection], types: [completed]}
permissions: {}
# One answer at a time per Draft: the next takes the objection waiting after it.
concurrency: {group: "workline-answer-${{ github.event.workflow_run.head_branch }}", cancel-in-progress: false}

env:
  WORKLINE_VERSION: v0.62.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'workline/tester/')
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, issues: read}
    env: {HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"}
    outputs:
      run: ${{ steps.answer.outputs.run }}
      status: ${{ steps.answer.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code
      # Your test runner here: the tester proves a rewrite red on the base
      # with the project's `test-command`.
      - name: The answer (proposed only)
        id: answer
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLINE_APP_ID: ${{ vars.WORKLINE_APP_ID }}   # the App whose comments keep the tester's record (ADR-0051)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || { echo "no open pull request from $BRANCH: nothing to answer"; exit 0; }
          # The head the objection was made on; the engine already set up
          # from the default branch's checkout.
          git checkout -q -B "$BRANCH" "$HEAD_SHA"
          status=0
          workline test answer --merge-request "$pr" --ai "$ai" --no-apply --forge github --json > answer.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "run=$(jq -r '(.pending // [])[0] // empty | split("/") | last' answer.json)" >> "$GITHUB_OUTPUT"   # a run left to apply, by name; none when it stopped before
          jq -r '.summary // empty' answer.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.answer.outputs.run != ''
        with: {name: workline-answer, path: ".workline-runs", include-hidden-files: true, retention-days: 1}
      - name: Verdict
        env: {STATUS: "${{ steps.answer.outputs.status }}"}
        run: |
          if [ "$STATUS" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the objection waits for the next one"
            exit 0
          fi
          exit "${STATUS:-0}"

  apply:
    needs: judge
    if: always() && needs.judge.outputs.run != ''
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    permissions: {contents: write, pull-requests: write, issues: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
      # judge ran the Draft's code: its folder is data, outside the checkout.
      - uses: actions/download-artifact@v4
        with: {name: workline-answer, path: "${{ runner.temp }}/workline-runs"}
      # Only what the Draft's line may do, to it, at the event's head: the
      # repository, roles and forge this job's (`apply --from-merge-request`).
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # workline's own account: the records it trusts
          WORKLINE_RUNS_DIR: ${{ runner.temp }}/workline-runs
          RUN: ${{ needs.judge.outputs.run }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf '%s' "$RUN" | grep -Eqx '[0-9]{8}T[0-9]{6}\.[0-9]{9}-[a-z0-9-]+' && [ -d "$WORKLINE_RUNS_DIR/$RUN" ] ||
            { echo "::error title=workline::judge named no run of its own: $RUN"; exit 1; }
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          [ -n "$NUMBER" ] || { echo "no open pull request from $BRANCH: nothing to apply"; exit 0; }
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline apply "$RUN" --from-merge-request "$NUMBER" --head "$HEAD_SHA" --forge github --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
