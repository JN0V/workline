# workline's merge policy when a pull request's label changes — copy to
# .github/workflows/workline-merge.yml, beside workline.yml, with the
# project's `merge: {autonomy: cautious}` (ADR-0042; the first release after
# v0.24.0).
#
# A person puts workline:accepted on a pull request, or takes it off, or
# marks it Draft: `workline follow` turns GitHub's auto-merge on for each
# pull request accepted by someone who can write, its head's verdict passed
# (workline.yml keeps it), off where the label was taken off, and brings the
# first in line up to date with main. workline.yml's follow job does the
# same after each judge and on each push to main.
#
# pull_request_target: the run is the repository's, from its default
# branch, with its secrets — a fork's pull request too —, and nothing of the
# pull request is checked out: the base is, for its config. No `judge` job
# here: a skipped one would show on the pull request as a check passed.
# Only with the GitHub App's token (variable WORKLINE_APP_ID, secret
# WORKLINE_APP_PRIVATE_KEY): a merge made with the job's own starts no
# workflow on main.
name: workline merge
on:
  pull_request_target: {types: [labeled, unlabeled, converted_to_draft]}
permissions: {}

env:
  WORKLINE_VERSION: v0.24.0          # a release of workline: update it to take a newer one (x-release-please-version)

jobs:
  follow:
    # One at a time on a branch, with workline.yml's: the first in line is
    # brought up once.
    concurrency: {group: "workline-follow-${{ github.base_ref }}", cancel-in-progress: false}
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: read}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.base_ref }}
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Whether the project has a merge policy
        id: policy
        run: |
          if grep -qE '^merge:' .workline/config.yaml 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no merge policy (merge:): nothing to do"
          fi
      # The engine at the version pinned above, checksum verified.
      - name: workline
        if: steps.policy.outputs.run == 'true'
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - if: steps.policy.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # the merge policy acts only with an App's token
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline follow --base "$GITHUB_BASE_REF" --forge github --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
