# workline gardening on GitHub Actions — copy to .github/workflows/workline-gardening.yml.
#
# On a schedule, the project's `schedule` line runs (by default the
# documentalist): each task it takes up becomes a pull request of its own, on
# a branch workline/<role>/<task>, updated when the task runs again, and no
# more are proposed while max-open-merge-requests of them wait (ADR-0006).
# The review is on those pull requests; nothing is merged here (ADR-0011).
#
# Two jobs, two trust zones, as for pull requests (workline.yml):
#   judge  runs the line. With the secret CLAUDE_CODE_OAUTH_TOKEN (`claude
#          setup-token`, a Claude subscription), Claude judges, in the one
#          step that needs the token; without it, only derived blocks are
#          regenerated. It reads the open pull requests, and writes nothing.
#          The subscription's limits are shared with its owner: run it at
#          night, and keep ai-max-calls and max-open-merge-requests low.
#   apply  holds the write token and no AI key: it commits, pushes the
#          branch, and opens or updates the pull request. With a GitHub App
#          (variable WORKLINE_APP_ID, secret WORKLINE_APP_PRIVATE_KEY), the
#          pull request runs your checks by itself; with the job's own token,
#          GitHub waits for someone to approve them, and the repository must
#          let Actions create pull requests (Settings → Actions → General).
name: workline gardening
on:
  # Mondays, 02:17 UTC; nightly ("17 2 * * *") to catch up a backlog. Off
  # the hour: GitHub may drop a run scheduled at its start, when busiest.
  schedule: [{cron: "17 2 * * 1"}]
  workflow_dispatch:
permissions: {}

env:
  WORKLINE_VERSION: v0.4.0          # a release of workline: update it to take a newer one (x-release-please-version)
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read}
    env: {HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"}
    outputs:
      proposed: ${{ steps.line.outputs.proposed }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The engine at the version pinned above, and the tools its roles use,
      # from their releases, checksums verified: seconds, not a build.
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: The schedule line (proposals only)
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          status=0
          workline route schedule --ai "$ai" --no-apply --forge github --open-merge-request --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          report=$(jq -r '"\(.status) — \(.summary)",
            ((.steps // [])[] | select(.result.calls) | .name as $n | .result.calls[] |
              "- agent, \($n): \(.model // .asked // "?") \(.["tokens-in"] // 0) tokens in, \(.["tokens-out"] // 0) out"),
            ((.steps // [])[] | .name as $n | (.result.notes // [])[] | "- note from the agent, \($n): \(split("\n")[0])"),
            ((.findings // [])[] | (.message // "" | split("\n")) as $l |
              "- \(.rule) \(.where // ""): \($l[0])\(if ($l | length) > 1 and ($l[-1] | startswith("(")) then " " + $l[-1] else "" end)")' line.json)
          echo "$report"
          { echo "### workline gardening ($ai)"; echo; echo "$report"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs", include-hidden-files: true}

      - name: Verdict
        run: |
          status=${{ steps.line.outputs.status }}
          if [ "$status" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the docs are listed in the summary, for a person"
            exit 0
          fi
          exit "$status"

  apply:
    needs: judge
    if: always() && needs.judge.outputs.proposed == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      # The engine at the version pinned above, and the tools its roles use,
      # from their releases, checksums verified: seconds, not a build.
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - uses: actions/download-artifact@v4
        with: {name: workline-runs}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          workline apply --line line.json
