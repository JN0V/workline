# The tools workline's own tests need beyond Go, from their releases,
# checksums verified: one list for the test job and for each job where a
# role runs the tests (the developer's proof, the tester's, the curator's
# measures). A tool missing there turns a test red on the proof alone.
# workline's own workflows only.
name: workline tests' tools
description: The tools workline's own tests need beyond Go, pinned, checksums verified.
runs:
  using: composite
  steps:
    # The committer's secrets and forbidden terms check.
    - name: gitleaks
      shell: bash
      run: |
        bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
        get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
        get https://github.com/gitleaks/gitleaks/releases/download/v8.30.1 gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt gitleaks
        echo "$bin" >> "$GITHUB_PATH"
    # The tool of workline's own gate (.workline/config.yaml): the tester's
    # tests pass the project's lint before the issue is ready (ADR-0059).
    # Pinned as in workline.yml's gates job.
    - name: golangci-lint
      shell: bash
      env: {VERSION: 2.15.0, SHA256: 9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea}
      run: |
        bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
        f="golangci-lint-$VERSION-linux-amd64.tar.gz"
        curl -fsSLO "https://github.com/golangci/golangci-lint/releases/download/v$VERSION/$f"
        echo "$SHA256  $f" | sha256sum -c -
        tar -xzf "$f" -C "$bin" --strip-components=1 "golangci-lint-$VERSION-linux-amd64/golangci-lint"
        echo "$bin" >> "$GITHUB_PATH"
