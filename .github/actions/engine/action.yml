# The engine for workline's own workflows (ADR-0071 §1). With a version,
# the published release, downloaded and its checksum checked as the
# templates do: what every job with a write token runs, and judge and
# gates' verdict. Without one, the engine built from the commit checked
# out, once a commit (ADR-0050, step 1): the first job builds it and keeps
# it in Actions' cache by that commit, the jobs after take it; warn, and
# the head pass on an engine-changing pull request. Never another engine:
# the release must say its version, the cache is read by its exact key,
# and a built binary must name the commit checked out, unmodified, or the
# job fails (docs/ci-github.md).
name: workline engine
description: The pinned release of workline, checksum checked; or, with no version, the engine built from the commit checked out, once a commit.
inputs:
  version:
    description: A published release, as WORKLINE_VERSION pins it (v0.78.3); empty, the engine built from the commit checked out.
    default: ""
  keep:
    description: Keep the engine built for the jobs after this one; "false" when none needs it. Not read with a version.
    default: "true"
  go:
    description: Leave Go set up for the steps after; "true" where the gates' tools or the tests need it.
    default: "false"
runs:
  using: composite
  steps:
    # The release, as the templates take it (defaults/ci/github/): its
    # archive checked against the release's checksums, then its version.
    - name: The pinned release
      if: inputs.version != ''
      shell: bash
      env: {WORKLINE_VERSION: "${{ inputs.version }}"}
      run: |
        bin="$RUNNER_TEMP/workline-release"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
        get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
        get "https://github.com/JN0V/workline/releases/download/$WORKLINE_VERSION" workline_linux_amd64.tar.gz checksums.txt workline
        got=$("$bin/workline" version)
        if [ "$got" != "$WORKLINE_VERSION" ]; then
          echo "::error title=workline::the release downloaded says $got, not $WORKLINE_VERSION, the version pinned: nothing runs on it"
          exit 1
        fi
        echo "$bin" >> "$GITHUB_PATH"
        echo "workline $got, the pinned release, checksum checked"
    - if: inputs.version != '' && inputs.go == 'true'
      uses: actions/setup-go@v5
      with: {go-version-file: go.mod}
    - id: key
      if: inputs.version == ''
      shell: bash
      run: |
        sha=$(git rev-parse HEAD)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "key=workline-engine-$RUNNER_OS-$RUNNER_ARCH-$sha" >> "$GITHUB_OUTPUT"
    - id: cache
      if: inputs.version == ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/workline-engine
        key: ${{ steps.key.outputs.key }}
    # Go, to build the engine; and, asked for, for the tools a job runs
    # after, the engine taken or built: a gate's golangci-lint.
    - if: inputs.version == '' && (steps.cache.outputs.cache-hit != 'true' || inputs.go == 'true')
      uses: actions/setup-go@v5
      with: {go-version-file: go.mod}
    # Static, as the releases are: it runs on any runner image.
    - if: inputs.version == '' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/workline-engine"
        CGO_ENABLED=0 go build -o "$RUNNER_TEMP/workline-engine/workline" ./cmd/workline
    - name: The engine is the commit's
      if: inputs.version == ''
      shell: bash
      env: {SHA: "${{ steps.key.outputs.sha }}"}
      run: |
        bin="$RUNNER_TEMP/workline-engine"
        if [ "${#SHA}" != 40 ] || ! grep -aqF "vcs.revision=$SHA" "$bin/workline" || ! grep -aqF "vcs.modified=false" "$bin/workline"; then
          echo "::error title=workline::the engine is not the one built from $SHA, unmodified: nothing runs on it (go version -m names the commit a binary was built from)"
          exit 1
        fi
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/workline" version
    - if: inputs.version == '' && steps.cache.outputs.cache-hit != 'true' && inputs.keep == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/workline-engine
        key: ${{ steps.key.outputs.key }}
