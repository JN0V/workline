# workline gardening its own repository: ci/github/workline-gardening.yml,
# with the engine built from this checkout rather than installed — both jobs
# check out the same commit, built once (.github/actions/engine), judge's
# kept for apply. Claude with CLAUDE_CODE_OAUTH_TOKEN, pull
# requests opened with the GitHub App (ADR-0006, ADR-0010).
name: workline gardening
on:
  # Nightly while its docs are caught up, then Mondays ("17 2 * * 1"). Off
  # the hour: GitHub may drop a run scheduled at its start, when busiest.
  schedule: [{cron: "17 2 * * *"}]
  workflow_dispatch:
permissions: {}

env:
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    runs-on: ubuntu-latest
    # issues: the product owner reads them.
    permissions: {contents: read, pull-requests: read, issues: read}
    env: {HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"}
    outputs:
      proposed: ${{ steps.line.outputs.proposed }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/engine
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: The schedule line (proposals only)
        id: line
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          status=0
          workline route schedule --ai "$ai" --no-apply --forge github --open-merge-request --summary workline-summary.md --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          [ ! -s workline-summary.md ] || cat workline-summary.md
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs", include-hidden-files: true}

      - name: Verdict
        run: |
          status=${{ steps.line.outputs.status }}
          if [ "$status" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the docs are listed in the summary, for a person"
            exit 0
          fi
          exit "$status"

  # Every night, proposed or not: it also tends the pull requests gardening
  # opened before (ADR-0034, amended).
  apply:
    needs: judge
    if: always()
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    # issues: the product owner's acts, comments and labels on each issue.
    permissions: {contents: write, pull-requests: write, issues: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/engine
      - uses: actions/download-artifact@v4
        if: needs.judge.outputs.proposed == 'true'
        with: {name: workline-runs}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          PROPOSED: ${{ needs.judge.outputs.proposed }}
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          [ "$PROPOSED" != true ] || workline apply --line line.json --summary workline-summary.md || status=$?
          # Its pull requests main moved under: rebuilt on it, or closed when
          # nothing is left to merge; one a person committed to is theirs.
          workline follow --gardening --base "$GITHUB_REF_NAME" --forge github --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
