# workline's own CI: the tests, workline running its own line on its pull
# requests, and its documentalist's findings on main, in code scanning.
name: test
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: The line for this pull request, as the project routes it
        if: github.event_name == 'pull_request'
        run: |
          go build -o workline ./cmd/workline
          ./workline route merge-request --ai none \
            --input range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  findings:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: The documentalist's findings, without AI
        run: |
          go build -o workline ./cmd/workline
          ./workline run-role documentalist --event schedule --ai none --no-apply --sarif workline.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        with: {sarif_file: workline.sarif, category: workline}
