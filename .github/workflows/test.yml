# workline's own CI: the tests, workline running its own line on its pull
# requests, and its documentalist's findings on main, in code scanning.
name: test
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1   # the committer's secrets check
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: The line for this pull request, as the project routes it
        if: github.event_name == 'pull_request'
        run: |
          go build -o workline ./cmd/workline
          ./workline route merge-request --ai none \
            --input range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  findings:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: lychee, for the links to other sites
        run: |
          f=lychee-x86_64-unknown-linux-musl.tar.gz
          curl -sSfLO https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/$f
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $f" | sha256sum -c
          tar xzf $f && sudo install -m755 lychee-x86_64-unknown-linux-musl/lychee /usr/local/bin/lychee
      - name: The documentalist's findings, without AI
        run: |
          go build -o workline ./cmd/workline
          ./workline run-role documentalist --event schedule --ai none --no-apply --sarif workline.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        with: {sarif_file: workline.sarif, category: workline}
