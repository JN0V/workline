# workline on its own pull requests: ci/github/workline-title.yml, but
# for one thing, as workline.yml: the engine built from the pull
# request's commit (.github/actions/engine), taken from the cache when a
# job built it first.
#
# A squash lands the title on the default branch as a subject: judge, in
# workline.yml, checks it on each push by the committer's rules
# (ADR-0051). An edit to the title runs only this job: the title checked
# again, no commit, no agent. When its result is not judge's last on the
# head, that judge is run again (`actions: write`), so the check the merge
# waits for follows the title. An edit to the description alone runs
# nothing. Its own concurrency group: an edit never cancels a push's run.
name: workline title
on:
  pull_request: {types: [edited]}
permissions: {}
concurrency: {group: "workline-title-${{ github.event.pull_request.number }}", cancel-in-progress: true}

jobs:
  title:
    if: github.event.changes.title
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}"}
      - uses: ./.github/actions/engine
        with: {keep: "false"}
      - name: The title, checked again
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          workline run-role committer --event merge-request --ai none --forge github --target "merge-request:$NUMBER" \
            --input "range=$RANGE" --input title-only=true || status=$?
          # judge follows the title: run again when its last result is not this one.
          want=success; [ "$status" = 0 ] || want=failure
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow workline.yml --commit "$HEAD_SHA" --event pull_request --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          job=; [ -z "$run" ] || job=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.name == "judge")][0] | "\(.databaseId) \(.status) \(.conclusion)"')
          set -- $job
          if [ -z "${1:-}" ]; then
            echo "no judge on $HEAD_SHA yet: it reads the title when it runs"
          elif [ "$2" != completed ]; then
            echo "::warning title=workline::judge still runs on $HEAD_SHA and may have read the title before this edit; run it again if it did"
          elif [ "${3:-}" = "$want" ]; then
            echo "judge's last result on $HEAD_SHA is already $want"
          else
            gh run rerun "$run" -R "$GITHUB_REPOSITORY" --job "$1" && echo "judge run again: it was $3, the title is now $want" \
              || echo "::warning title=workline::judge could not be run again (a fork's token may not): run it again by hand"
          fi
          exit "$status"
