# workline's own weekly sample: ci/github/workline-sample.yml, with the engine
# built from this checkout rather than installed — both jobs check out the
# same commit, built once (.github/actions/engine), read's kept for write.
# The judge is the documentalist's `sample.judge` setting
# (.workline/config.yaml): Claude Opus, the gardening vouching with Sonnet —
# another model of the same provider, the best independence this repository
# has (ADR-0005, level 2); the commits' Workline-Model says which vouched.
name: workline sample
on:
  # Mondays, 05:43 UTC, after the night's gardening. Off the hour: GitHub may
  # drop a run scheduled at its start, when busiest.
  schedule: [{cron: "43 5 * * 1"}]
  workflow_dispatch:
    inputs:
      week: {description: "the ISO week sampled, 2026-W40 (default: the last whole week)", required: false}
permissions: {}

jobs:
  read:
    runs-on: ubuntu-latest
    # issues and pull-requests read: the acts the other roles recorded
    # there; actions read: the tallies the line's jobs kept.
    permissions: {contents: read, issues: read, pull-requests: read, actions: read}
    env:
      HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"
      WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs
    outputs:
      drawn: ${{ steps.sample.outputs.drawn }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: ./.github/actions/engine
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # The week's tokens (ADR-0052, criterion 3): the tallies the jobs
      # calling an agent kept 14 days (ADR-0019, open point 1), gathered as
      # the runs folder's tally. This repository's runs only: a fork's pull
      # request runs with no agent token, and what it uploads is anyone's.
      # The jobs' names are the templates'.
      - name: The line's tallies, from its jobs' artifacts
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          dir=$RUNNER_TEMP/workline-tallies; mkdir -p "$dir" "$WORKLINE_RUNS_DIR"
          for job in judge review warn curator read; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=workline-tally-$job&per_page=100" \
              --jq '.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id) | .id' ||
              echo "::warning title=workline::the tallies of the jobs named $job could not be listed: the week's tokens leave them out" >&2
          done > "$dir/ids"
          n=0
          while read -r id; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/$id.zip" && unzip -p "$dir/$id.zip" workline-tally.jsonl >> "$WORKLINE_RUNS_DIR/tally.jsonl"; then
              n=$((n + 1))
            else
              echo "::warning title=workline::the tally $id could not be read: the week's tokens leave it out"
            fi
          done < "$dir/ids"
          echo "workline: $n tallies gathered"

      - name: The sample, read (writes nothing)
        id: sample
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WORKLINE_JUDGE: ${{ vars.WORKLINE_JUDGE }}
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ inputs.week }}
        run: |
          status=0
          workline sample ${WEEK:+--week "$WEEK"} --forge github --out sample.json --summary workline-summary.md || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          [ "$status" != 1 ] && [ -s sample.json ] && echo "drawn=true" >> "$GITHUB_OUTPUT"
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.sample.outputs.drawn == 'true'
        with: {name: workline-sample, path: sample.json}

      - name: Verdict
        run: |
          case "${{ steps.sample.outputs.status }}" in
            0) ;;
            2) echo "::warning title=workline::the sample holds acts for a person: see the tracking issue" ;;
            3) echo "::warning title=workline::the judge or the forge could not be reached; what was drawn is listed for a person" ;;
            *) exit 1 ;;
          esac
      # What this job's agent calls spent, a line a run: role, target,
      # calls, tokens, seconds; no prompt, no diff. Kept 14 days for the
      # weekly sample's tokens (ADR-0019, open point 1); the run folders
      # keep their day. Never in a cancelled run (a newer push's), whose
      # spend is lost; nor in a merge queue's, which asks no agent.
      - name: The runs' tally
        if: "!cancelled() && github.event_name != 'merge_group'"
        run: 'workline sample --tally workline-tally.jsonl || echo "workline: no tally kept"'
      - uses: actions/upload-artifact@v4
        if: "!cancelled() && github.event_name != 'merge_group'"
        with: {name: "workline-tally-${{ github.job }}", path: workline-tally.jsonl, if-no-files-found: ignore, retention-days: 14, overwrite: true}

  write:
    needs: read
    if: always() && needs.read.outputs.drawn == 'true'
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    permissions: {contents: write, pull-requests: write, issues: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: ./.github/actions/engine
      - uses: actions/download-artifact@v4
        with: {name: workline-sample}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline sample --apply sample.json --forge github --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
