# workline's tester woken by an objection, on its own repository:
# defaults/ci/github/workline-objection.yml, its jobs unchanged, on no
# event (#1871). The template notices a comment on a line, with no token
# and no secret, and its end wakes workline-answer.yml or
# workline-develop.yml's round. Here workline-develop.yml's reconciler,
# dispatched by the loop (docs/tick.md) or the heartbeat, starts the
# answer on each Draft an objection or a reply waits on; its jobs skip
# on a start by hand. Why the template's: docs/objection-jobs.md.
name: workline objection
on:
  workflow_dispatch:
permissions: {}

jobs:
  noticed:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'workline/tester/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.comment.body, 'workline:objection') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env: {PR: "${{ github.event.pull_request.number }}", URL: "${{ github.event.comment.html_url }}"}
        run: 'echo "an objection on pull request $PR, $URL: workline-answer.yml answers it"'

  # A person's reply in a thread on a line of the developer's pull
  # request (#1438): noticed the same way, its end wakes the round in
  # workline-develop.yml, which runs as the default branch holds it.
  replied:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'workline/developer/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' && github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env: {PR: "${{ github.event.pull_request.number }}", URL: "${{ github.event.comment.html_url }}"}
        run: 'echo "a reply in a thread on pull request $PR, $URL: workline-develop.yml runs its round"'

  # A reply in a thread on the tester's Draft (workline/tester/*), the
  # developer's App or a person's, its body opening with no
  # `workline:objection`, nor the tester's own answer: noticed the same
  # way, its end wakes workline-answer.yml, which answers the reply.
  replied-to-tester:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'workline/tester/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' && github.event.comment.in_reply_to_id != '' &&
      !startsWith(github.event.comment.body, 'workline:objection') &&
      !contains(github.event.comment.body, '<!-- workline:tester-') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - env: {PR: "${{ github.event.pull_request.number }}", URL: "${{ github.event.comment.html_url }}"}
        run: 'echo "a reply in a thread on pull request $PR, $URL: workline-answer.yml answers it"'
