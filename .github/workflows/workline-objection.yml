# workline's tester woken by an objection, on its own repository: as
# ci/github/workline-objection.yml, unchanged. It runs for any branch
# workline/tester/* of this repository that gets an objection.
# A comment opened by `workline:objection` on the tester's Draft, from a
# person of the project or an App: noticed, with no token and no secret;
# its end wakes workline-answer.yml. Why: docs/objection-jobs.md.
name: workline objection
on:
  pull_request_review_comment: {types: [created]}
permissions: {}

jobs:
  noticed:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'workline/tester/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.comment.body, 'workline:objection') &&
      (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env: {PR: "${{ github.event.pull_request.number }}", URL: "${{ github.event.comment.html_url }}"}
        run: 'echo "an objection on pull request $PR, $URL: workline-answer.yml answers it"'
