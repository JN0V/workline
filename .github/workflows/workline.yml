# workline on its own pull requests: ci/github/workline.yml, but for one
# thing. judge runs the engine built from the pull request's commit, as
# gardening and the sample do: a project never runs, in the checks of a
# commit, the pin that commit ships (ADR-0017), and a pull request moving
# the templates' pins to a version not yet tagged stays green. What it
# proposes is applied by workline-apply.yml, from main, with the engine
# built from main: what a pull request changes in the engine never runs
# with the write token.
# workline on GitHub Actions — copy to .github/workflows/workline.yml, with
# workline-apply.yml beside it.
#
# The project's routing decides what runs on a merge request (.workline/config.yaml,
# `routing:`; by default the committer, then the documentalist). The docs the
# pull request makes suspect are judged here, and fixed on its branch
# (ADR-0010); the review is the pull request's (ADR-0011).
#
# Two trust zones (docs/research/server-side.md), two workflows. This one is
# the pull request's own: GitHub runs the copy its branch holds, so whoever
# can push a branch can change it. It holds no write token and never the
# GitHub App's key (ADR-0044); workline-apply.yml, which runs from the
# default branch, applies what it proposed.
#   judge  runs the line; it can read the code, and holds no write token but
#          code scanning's, which only uploads its findings as SARIF (free on
#          public repositories; private ones need GitHub Advanced Security —
#          remove that step otherwise). It stops before applying (--no-apply),
#          and leaves what it proposed and its verdict on the head as
#          artifacts, for workline-apply.yml; a fork's report, for
#          workline-fork.yml.
#          With the secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, a
#          Claude subscription), Claude judges; without it, or on a fork,
#          which gets no secrets, the docs are listed for a person. The
#          token is in reach of what the line runs, the project's `derive`
#          commands included: only pull requests from the repository get it.
#          It warns when the App's key is in its reach: a repository
#          secret, not the environment's (docs/ci-github.md).
name: workline
on:
  # ready_for_review: a draft marked ready, read by every lens of the
  # reviewer once, when the line runs it (ADR-0020).
  pull_request: {types: [opened, synchronize, reopened, ready_for_review]}
permissions: {}

env:
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    runs-on: ubuntu-latest
    # pull-requests read: the reviewer, when the line runs it, reads its
    # summary comment, to review only the commits it has not reviewed yet.
    permissions: {contents: read, security-events: write, pull-requests: read}
    # Only whether a token is there: the agent's goes to the one step that
    # calls it, not to installs whose scripts could read it; the App's key
    # never comes here.
    env:
      HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"
      APP_KEY_IN_REACH: "${{ secrets.WORKLINE_APP_PRIVATE_KEY != '' }}"
    steps:
      - name: The App's key, out of a pull request's reach
        if: env.APP_KEY_IN_REACH == 'true'
        run: echo "::warning title=workline::the GitHub App's key is a repository secret, which any branch's workflow can read; move it to the environment workline-app, which only the default branch may use (docs/ci-github.md)"
      # The branch's head, not the merge GitHub builds for a pull request: a
      # doc checked here names a commit the branch holds.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha }}"}
      # The engine built from this commit, and the tools its roles use, from
      # their releases, checksums verified.
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - name: workline
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          go build -o "$bin/workline" ./cmd/workline
          cd "$RUNNER_TEMP"
          get() { curl -fsSLO "$1/$2" && curl -fsSL "$1/$3" | grep " $2\$" | sha256sum -c - && tar -xzf "$2" -C "$bin" "$4"; }
          get https://github.com/gitleaks/gitleaks/releases/download/v8.30.1 gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt gitleaks
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/workline" version
      - name: Claude, when the repository gives its token
        if: env.HAS_CLAUDE == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: The line for this pull request (proposals only)
        id: line
        # The branch tells a release tool's pull request, held as the release
        # (ADR-0017); from a fork it is anyone's text: a variable, never
        # written into the script. Opened ready, or marked ready, the
        # reviewer reads every lens once, on the whole change; one a push
        # after (ADR-0020).
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          ready=; case "$ACTION:$DRAFT" in opened:false|ready_for_review:*) ready=1 ;; esac
          status=0
          workline route merge-request --ai "$ai" --no-apply --push-to-merge-request \
            --forge github --target merge-request:${{ github.event.pull_request.number }} --branch "$HEAD_REF" \
            --input range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} ${ready:+--input lenses=all} \
            --sarif workline.sarif --summary workline-summary.md --verdict workline-verdict.json --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          [ ! -s workline-summary.md ] || cat workline-summary.md
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p report && { [ ! -s workline-summary.md ] || cp workline-summary.md report/report.md; }
          echo "${{ github.event.pull_request.number }}" > report/number

      # From a fork, this job has no right to comment: the report goes to
      # workline-fork.yml, which comments it from the repository's side.
      - uses: actions/upload-artifact@v4
        if: always() && github.event.pull_request.head.repo.full_name != github.repository
        with: {name: workline-report, path: report/}

      # The line's verdict on the head, for workline-apply.yml to keep (the
      # merge policy). Not a fork's: its run is the fork's to write.
      - uses: actions/upload-artifact@v4
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with: {name: workline-verdict, path: "workline-verdict.json\nreport/number", if-no-files-found: ignore, retention-days: 1}

      # What the line proposed, for workline-apply.yml to apply.
      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs\nreport/number", include-hidden-files: true}

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with: {sarif_file: workline.sarif, category: workline}

      # An agent missing or out of quota (3) is said, not taken for the
      # change's fault: a person judges what it would have (ADR-0010).
      - name: Verdict
        run: |
          status=${{ steps.line.outputs.status }}
          if [ "$status" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the docs are listed in the summary, for a person"
            exit 0
          fi
          exit "$status"
