# workline on GitHub Actions — copy to .github/workflows/workline.yml.
#
# The project's routing decides what runs on a merge request (.workline/config.yaml,
# `routing:`; by default the committer, then the documentalist). The docs the
# pull request makes suspect are judged here, and fixed on its branch
# (ADR-0010); the review is the pull request's (ADR-0011).
#
# Two jobs, two trust zones (docs/research/server-side.md):
#   judge  runs the line; it can read the code, and holds no write token but
#          code scanning's, which only uploads its findings as SARIF (free on
#          public repositories; private ones need GitHub Advanced Security —
#          remove that step otherwise). It stops before applying (--no-apply).
#          With the secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, a
#          Claude subscription), Claude judges; without it, or on a fork,
#          which gets no secrets, the docs are listed for a person. The
#          token is in reach of what the line runs, the project's `derive`
#          commands included: only pull requests from the repository get it.
#   apply  holds the write token and no AI key; it applies what judge proposed,
#          after checking the prepared input did not change. A doc fix is
#          committed to the pull request's branch (--push-to-merge-request).
#          With a GitHub App (variable WORKLINE_APP_ID, secret
#          WORKLINE_APP_PRIVATE_KEY; contents, pull requests and issues in
#          read and write), the commit runs the checks again by itself; with
#          the job's own token, GitHub waits for someone to approve them. The
#          commit carries `Workline-Role:`, and the line does not judge it
#          again. Nothing is applied for a fork: the job summary lists what
#          was found.
name: workline
on:
  pull_request:
permissions: {}

env:
  WORKLINE_VERSION: main            # pin a tag or commit once releases exist
  WORKLINE_RUNS_DIR: ${{ github.workspace }}/.workline-runs

jobs:
  judge:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    env: {CLAUDE_CODE_OAUTH_TOKEN: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"}
    outputs:
      proposed: ${{ steps.line.outputs.proposed }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: go install github.com/JN0V/workline/cmd/workline@${{ env.WORKLINE_VERSION }}
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1   # secrets, for the committer
      - name: Claude, when the repository gives its token
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: The line for this pull request (proposals only)
        id: line
        run: |
          ai=none; [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] && ai=claude
          status=0
          workline route merge-request --ai "$ai" --no-apply --push-to-merge-request \
            --forge github --target merge-request:${{ github.event.pull_request.number }} \
            --input range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} \
            --sarif workline.sarif --json > line.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "proposed=$(jq '(.pending // []) | length > 0' line.json)" >> "$GITHUB_OUTPUT"
          report=$(jq -r '"\(.status) — \(.summary)",
            ((.steps // [])[] | select(.result.calls) | .name as $n | .result.calls[] |
              "- agent, \($n): \(.model // .asked // "?") \(.["tokens-in"] // 0) tokens in, \(.["tokens-out"] // 0) out"),
            ((.steps // [])[] | .name as $n | (.result.notes // [])[] | "- note from the agent, \($n): \(split("\n")[0])"),
            ((.findings // [])[] | "- \(.rule) \(.where // ""): \(.message // "" | split("\n")[0])")' line.json)
          echo "$report"
          { echo "### workline ($ai)"; echo; echo "$report"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.line.outputs.proposed == 'true'
        with: {name: workline-runs, path: "line.json\n.workline-runs", include-hidden-files: true}

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        with: {sarif_file: workline.sarif, category: workline}

      # An agent missing or out of quota (3) is said, not taken for the
      # change's fault: a person judges what it would have (ADR-0010).
      - name: Verdict
        run: |
          status=${{ steps.line.outputs.status }}
          if [ "$status" = 3 ]; then
            echo "::warning title=workline::the agent could not be reached; the docs are listed in the summary, for a person"
            exit 0
          fi
          exit "$status"

  apply:
    needs: judge
    # Steps that passed before one blocked still get their proposals applied,
    # as they would on a machine; nothing runs for a fork.
    if: always() && needs.judge.outputs.proposed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write, issues: write}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-go@v5
        with: {go-version: stable}
      - run: go install github.com/JN0V/workline/cmd/workline@${{ env.WORKLINE_VERSION }}
      - uses: actions/download-artifact@v4
        with: {name: workline-runs}
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          workline apply --line line.json
