# workline's merge policy on its own repository, when a pull request's
# label changes: defaults/ci/github/workline-merge.yml, on the release
# WORKLINE_VERSION pins, as a user's line (ADR-0071 §1; the engine's action,
# .github/actions/engine, downloads it). Without `merge:` in
# .workline/config.yaml, it stops at once. Hourly too, the safety net: a
# pull request whose auto-merge GitHub missed, its checks green, merged by
# the next run the loop dispatches. And when a person closes the issue holding a demotion: the
# pull requests it held merge at once.
name: workline merge
on:
  pull_request_target: {types: [labeled, unlabeled, converted_to_draft]}
  issues: {types: [closed]}
  # No schedule: by hand, and by the loop when `workline tick` lists the
  # merge, an hour after its last run (docs/tick.md), named `workline
  # merge`. The template keeps its hourly cron, for a dry-run loop.
  workflow_dispatch:
permissions: {}

env:
  # The release this workflow runs (ADR-0071 §1): moved only in its own
  # pull request, after its try on a copy; release-please never moves it.
  WORKLINE_VERSION: v0.90.0

jobs:
  follow:
    concurrency: {group: "workline-follow-${{ github.base_ref || github.ref_name }}", cancel-in-progress: false}
    # An issue's event: a demotion issue's close only, known by its title
    # as the engine reads it.
    if: >-
      github.event_name != 'issues' ||
      github.event.action == 'closed' && startsWith(github.event.issue.title, 'workline: its ') &&
      contains(github.event.issue.title, 'merge requests wait for a person''s yes again')
    runs-on: ubuntu-latest
    environment: workline-app       # the App's key: the default branch only (ADR-0044)
    permissions: {contents: write, pull-requests: read}
    steps:
      - id: app
        if: vars.WORKLINE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.WORKLINE_APP_ID }}
          private-key: ${{ secrets.WORKLINE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.base_ref || github.ref_name }}
          token: ${{ steps.app.outputs.token || github.token }}
      - name: Whether the project has a merge policy
        id: policy
        run: |
          if grep -qE '^merge:' .workline/config.yaml 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no merge policy (merge:): nothing to do"
          fi
      - uses: ./.github/actions/engine
        if: steps.policy.outputs.run == 'true'
        with: {version: "${{ env.WORKLINE_VERSION }}"}
      - if: steps.policy.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          WORKLINE_APP: ${{ steps.app.outputs.app-slug }}   # who holds the yes, and reads the verdict
          WORKLINE_APP_ID: ${{ vars.WORKLINE_APP_ID }}
          BASE: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ -n "$APP" ]; then
            git config user.name "$APP[bot]"
            git config user.email "$(gh api "/users/$APP%5Bbot%5D" --jq .id)+$APP[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          status=0
          workline follow --base "$BASE" --forge github --summary workline-summary.md || status=$?
          [ ! -s workline-summary.md ] || cat workline-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
