# Publishes a release of workline (ADR-0017): release-please.yml calls it
# once it has tagged the merged release pull request and written the
# release's notes. GoReleaser builds the engine for each system, with the
# roles inside it, and puts the archives on that release, its notes kept
# (.goreleaser.yaml); then the image CI templates run in,
# ghcr.io/jn0v/workline:<tag> (Dockerfile), so a job downloads a fixed
# version in seconds instead of building main. Called in release-please's
# run, not on the tag's push: it needs no event a token may not start.
name: release
on:
  workflow_call:
    inputs:
      tag: {description: "the tag release-please made, v0.3.0", required: true, type: string}
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "refs/tags/${{ inputs.tag }}"}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: goreleaser/goreleaser-action@v6
        with: {version: "~> v2", args: release --clean}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
      - name: The image CI runs in
        env:
          TAG: ${{ inputs.tag }}
          TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr A-Z a-z)/workline
          cp dist/workline_linux_amd64_v1/workline .
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image:$TAG" .
          docker push "$image:$TAG"
          case "$TAG" in *-*) ;; *) docker tag "$image:$TAG" "$image:latest" && docker push "$image:latest" ;; esac
