# workline on its own repository.
roles:
  committer:
    settings:
      # The role's list, plus this repository's decision records: `ADR-0001`
      # means something to anyone reading docs/adr/.
      internal-codes-allow: [UTF-8, UTF-16, SHA-1, SHA-256, SHA-512, ISO-8601, 'RFC-[0-9]+', 'CVE-[0-9]+', 'ADR-[0-9]+']
  documentalist:
    settings:
      # The role READMEs, and the pages the documentalist's, the product
      # owner's and the reviewer's are split into, describe what the code
      # does: they are docs too.
      docs: ["docs/**", "*.md", "roles/*/README.md", roles/documentalist/docs/checks.md,
        roles/documentalist/docs/tasks.md, roles/documentalist/docs/judge.md, roles/documentalist/docs/push.md,
        roles/documentalist/docs/cascades.md, roles/documentalist/docs/gardening.md,
        roles/documentalist/docs/judge-claims.md,
        roles/product-owner/docs/run.md, roles/product-owner/docs/outputs.md, roles/product-owner/docs/tracking.md,
        roles/reviewer/docs/run.md, roles/reviewer/docs/judge.md, roles/reviewer/docs/spec.md]
      # The user pages (AGENTS.md, "Writing user docs"): the role pages too,
      # but their status and the archived backlog; each role page opens
      # with a diagram.
      reader:
        pages: ["README.md", "docs/**", "roles/*/README.md", "roles/*/docs/*.md"]
        skip: ["docs/spec/**", "roles/*/docs/status.md", docs/BACKLOG.md, docs/backlog-parked.md]
        flow: ["roles/*/README.md"]
      # Catching up its own docs, far behind: those whose sources do not fit
      # one call are judged in parts (ADR-0009), one doc a night (8 parts),
      # and a night spends at most 400k tokens.
      judge-in-parts: true
      parts-max-per-run: 8
      ai-max-tokens: 400000
      # The weekly sample of the docs vouched for (ADR-0014, step 4) is read
      # by Opus: the gardening vouches with Sonnet, and no other provider is
      # set up here, so another model is the best independence (ADR-0005).
      # Nothing vouched for before v0.2.1, whose engine earns `checked`
      # (step 0; the `checked` moved before it were put back by 0669684).
      sample: {judge: "claude:opus", after: v0.2.1}
      # Facts the docs quote, regenerated from the code rather than typed.
      derive:
        conformance-cases: "n=$(ls tests/conformance/cases/*/*.yaml | wc -l); p=$(grep -cvE '^(#|$)' tests/conformance/pending.txt || true); echo $((n - p))"
        runs-kept: "sed -n 's/^const keepRuns = \\([0-9]*\\)$/\\1/p' internal/engine/engine.go"
  product-owner:
    settings:
      # The backlog file the issues were imported from, archived since: the
      # issues are the source, an edit to it flags none of them (ADR-0032).
      archived: [docs/BACKLOG.md]
routing:
  # Before a push, the committer checks the commits leaving the machine, and
  # the documentalist has the docs they made suspect judged. On a pull
  # request, the reviewer reads the code too (ADR-0020). Gardening at
  # night: the docs, then the backlog — the GitHub issues, kept by the
  # product owner (ADR-0018).
  events: {pre-push: [committer, documentalist], merge-request: [committer, documentalist, reviewer],
    schedule: [documentalist, product-owner]}
